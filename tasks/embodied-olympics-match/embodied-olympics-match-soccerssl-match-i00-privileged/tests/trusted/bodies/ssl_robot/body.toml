# The RoboOlympics SSL robot (bodies/ssl_robot/README.md): a RoboCup Small Size League robot after TIGERs Mannheim's
# v2020 generation (the league's best documented robot, S1-S4), for the wheeled 5v5 soccer sport (sports/soccer_ssl).
# The model is OUR OWN APPROXIMATION FROM PUBLISHED DIMENSIONS (body.py builds it; tools/make_model.py writes model.xml):
# no team publishes a URDF / MJCF, TIGERs' CAD carries a non-commercial licence and ER-Force's CAD no licence, so
# no CAD is used. Every limit has a source: the team's own paper (S1-S4) or configuration (S5, "[config]"), another
# team's measurement (S6, S8, S9), the league's rules (S7), else DERIVED / ESTIMATE with the method.
# Data only: body.py reads it.

[body]
name = "ssl_robot"
title = "RoboCup SSL robot (after TIGERs Mannheim v2020)"
revision = "ssl-1"                     # bump on any change that alters play
kind = "planar"                        # a planar base (x, y, yaw: bodies/servo.py PlanarBase), a kicker, a dribbler
model = "model.xml"                    # tools/make_model.py (one robot alone; mount() builds the same into a scene)
license = "MIT (the repository's LICENSE; bodies/ssl_robot/LICENSE): model and code are our own, written from the published dimensions (S1-S7); no team's CAD"
mass_kg = 2.62                         # S1 Table 1 ("Total weight 2.62kg")
height_m = 0.148                       # S1 Table 1 ("Dimension 178 x 148mm")
diameter_m = 0.178                     # S1 Table 1; the rules' maximum is 0.18 m x 0.15 m (S7 3.2.2)

[sources]
S1 = "TIGERs Mannheim, Extended Team Description for RoboCup 2020 (v2020 robot): Table 1, 2.1-2.3 (kicker, dribbler, break beam), 3.2 (kicker circuit). ssl.robocup.org/team-description-papers"
S2 = "TIGERs Mannheim, Extended Team Description for RoboCup 2022: 1.1 (dribbler damping: hinged dribbler, 2-DoF, TPE 70A dampers), Table 1"
S3 = "TIGERs Mannheim, Team Description for RoboCup 2024: 1 (flat 14 mm dribbling bar, 3D-printed TPU shore 60A), 2.1 (dribbler positions: 2-point / 3-point contact, chip shovel end stop, coverage), 2.2 (torque-limited dribbler motor control; R = 0.48 ohm, L = 35 uH)"
S4 = "TIGERs Mannheim, Extended Team Description for RoboCup 2026: 3.2 (RoboCup 2025 vision records: 'acceleration limit of 3 m/s^2, velocity limit of 3 m/s and occasional breaking with 6 m/s^2')"
S5 = "TIGERs Mannheim Sumatra, config/botParamsDatabase.json entry 'TIGERs v2020' [config, not a measurement]: velMaxW 20, accMaxW 50, center2DribblerDist 0.0715, chipAngle 45, maxAbsoluteChipVelocity 5.5. github.com/TIGERs-Mannheim/Sumatra"
S6 = "ZJUNlict, Team Description Paper RoboCup 2024, Table 1 (benchmark of the v2023 robot): flat kick variance 0.033 m^2/s^2 over 20 kicks at 6.0 m/s; TestDribble at 3 m/s^2: -x 2.3 m/s, y 2.6 m/s, rotation 9.3 rad/s before the ball is lost"
S7 = "RoboCup Small Size League rules, 2026-09-19 (github.com/RoboCup-SSL/ssl-rules 2ff4be0c): 3.2.2 shape, 3.2.4 dribbling device (at most 20 % of the ball inside the robot's convex hull seen from above), 3.2.5 vision pattern (figure 5 dimensions, figure 6 colours), 8.4.2 ball speed 6.5 m/s"
S8 = "KIKS, Extended Team Description for RoboCup 2023: dribbler shaft about 36 mm above the carpet; a non-rotating dribbler hit head-on by a 2.3 m/s ball: rebound 379 mm with damper, 600 mm without (Table 2); ball lost when turning at 200 deg/s or more"
S9 = "ZJUNlict, Extended Team Description for RoboCup 2019, 2.3: ball reception up to 8.5 m/s with the three-point dribbler; TIGERs' two-DoF damped dribbler about 5 m/s; an ordinary dribbler about 3 m/s"
S10 = "ER-Force framework simulator (github.com/robotics-erlangen/framework, simball.cpp / simulator.cpp source comments, as read for the proposal soccer_ssl_proposal_zh.md appendix A): ball-robot restitution about 0.60, floor restitution 0.56"
S12 = "RoboCup SSL rules 2026-09-19 (ssl-rules 2ff4be0c) 3.2.3 Color of Robots: 'distinctive coloring covering at least 20% of the robot's surrounding area (bottom and top surfaces do not count)', 'partially visible from all sides', 'interchangeable colors: one bright and one dark', 'Robot sides must avoid colors similar to those used in the vision pattern and ball', not reflective"
S11 = "Moons' Industries ECU22048H18-S101 dribbling motor (S1 Table 1, 2.3): 55 W, rated speed 17000 rpm, direct 1:1 gear to the bar"

[limits.base]                          # the chassis in the robot's own frame (bodies/servo.py PlanarBase, on the norm)
kind = "base"
mode = "norm"
speed_m_s = 3.0
accel_m_s2 = 3.0                       # also the braking deceleration (PlanarBase has one acceleration limit: the real
                                       # robot brakes at up to 6 m/s^2, S4; symmetric 3 is stricter, declared)
jerk_m_s3 = 150.0
yaw_rate_rad_s = 20.0
yaw_accel_rad_s2 = 50.0
yaw_jerk_rad_s3 = 2500.0
drive_force_n = 15.7                   # each world axis's drive force cap (the output stage): the grip that brakes at 6 m/s^2
drive_torque_nm = 1.26                 # the yaw drive's torque cap
[limits.base.source]
speed_m_s = "S4 (3.2: velocity limit 3 m/s seen in the RoboCup 2025 vision records); S5 velMax 3.0 [config]"
accel_m_s2 = "S4 (3.2: acceleration limit 3 m/s^2); braking at the same 3 m/s^2 is stricter than the occasional 6 m/s^2 of S4 (declared deviation)"
jerk_m_s3 = "ESTIMATE: 50 x the acceleration (TIGERs plan bang-bang trajectories without a jerk limit, S1; the library's rule for unpublished jerk)"
yaw_rate_rad_s = "S5 velMaxW 20 [config; no measurement published]"
yaw_accel_rad_s2 = "S5 accMaxW 50 [config; no measurement published]"
yaw_jerk_rad_s3 = "ESTIMATE: 50 x the yaw acceleration (the library's rule)"
drive_force_n = "DERIVED: 2.62 kg (S1) x 6 m/s^2, the braking deceleration the wheels' grip reaches (S4)"
drive_torque_nm = "DERIVED: drive_force_n at 0.08 m, the wheels' distance from the centre (ESTIMATE from the 0.089 m radius and the 62 mm wheels, S1)"

[limits.kicker]                        # body.py Kicker: an impulse model (README "Kicker")
flat_speed_max_m_s = 8.5
chip_speed_max_m_s = 5.5
chip_angle_deg = 45.0
speed_sigma_rel = 0.030
direction_sigma_deg = 1.0
charge_full_s = 2.0
recharge_after_max_s = 0.5
[limits.kicker.source]
flat_speed_max_m_s = "S1 Table 1 ('Straight kick speed max. 8.5m/s'; the rules' limit is 6.5 m/s, S7 8.4.2: a referee matter)"
chip_speed_max_m_s = "S5 maxAbsoluteChipVelocity 5.5 [config]"
chip_angle_deg = "S5 chipAngle 45 [config]"
speed_sigma_rel = "DERIVED: S6, sqrt(0.033) = 0.18 m/s at 6.0 m/s, taken as 3.0 % of the commanded speed (TIGERs publish none)"
direction_sigma_deg = "ESTIMATE: no team publishes a kick direction error"
charge_full_s = "S1 3.2 ('charge the capacitors from 0V to 250V in two seconds')"
recharge_after_max_s = "S1 3.2 ('Recharging after a strong kick takes half a second'; 'The kick strength is directly proportional to the current'): a kick at speed v needs the voltage v / v_max of the full charge, i.e. a stored-energy fraction (v / v_max)^2, and uses 25 % x (v / v_max)^2 of the full energy, so a maximum kick is refilled in 0.5 / 2.0 of the full charging time (DERIVED; the coil's efficiency taken constant)"

[limits.dribbler]                      # body.py Dribbler: the bar's motor with a speed loop saturated at a torque
speed_max_rpm = 17000.0
torque_max_nm = 0.031
spinup_s = 0.04
[limits.dribbler.source]
speed_max_rpm = "S11 (S1 2.3: rated 17000 rpm, gear 1:1:1, so the bar turns at the motor speed)"
torque_max_nm = "DERIVED: 55 W / 17000 rpm = 0.031 N m, the motor's rated torque (S11); TIGERs saturate the speed loop at a current limit they do not publish (S3 2.2)"
spinup_s = "DERIVED: 0 -> 17000 rpm at torque_max_nm on the bar's and the rotor's inertia (geometry below; rotor 2e-7 kg m^2 ESTIMATE for a 22 mm motor); recorded, the physics produces it"

[geometry]                             # metres, robot frame: x forward, y left, z up from the carpet
radius = 0.089                         # S1 (diameter 178 mm)
height = 0.148                         # S1
front = 0.0715                         # the front chord's distance from the centre: S5 center2DribblerDist
ground_clearance = 0.005               # ESTIMATE (the wheels carry the robot; the bottom plate clears the carpet)
cavity_half_width = 0.032              # ESTIMATE: the dribbler opening (a 43 mm ball with clearance)
cavity_depth = 0.022                   # ESTIMATE: from the front chord back to the dribbler module
cavity_top = 0.060                     # ESTIMATE: the cover over the dribbler
bar_diameter = 0.014                   # S3
bar_half_length = 0.030                # ESTIMATE: fills the opening
bar_axis_height = 0.036                # S8 (KIKS: the shaft about 36 mm above the carpet; TIGERs publish none)
pivot_above_bar = 0.040                # ESTIMATE: the hinged dribbler's pivot (S2) above the bar's axis
pivot_behind_bar = 0.010               # ESTIMATE
shovel_coverage = 0.198                # S1 Table 1 ('Max. ball coverage 19.8 %'): the chip shovel stops the ball there
shovel_height = 0.026                  # ESTIMATE
beam_height = 0.0213                   # ESTIMATE: the break beam (S1 2.3) at the ball's centre height
beam_x = 0.070                         # ESTIMATE: just inside the front chord
pattern_center_diameter = 0.050        # S7 figure 5
pattern_dot_diameter = 0.040           # S7 figure 5
pattern_front_dot = [0.035, 0.054772]  # S7 figure 5: (forward, lateral) of the two front dots
pattern_back_dot = [-0.054772, 0.035]  # S7 figure 5: the two back dots

[appearance]                           # visual only (contype 0): body.py _side_band. S12: the team colour on the sides
side_band_z = [0.085, 0.125]           # ESTIMATE: a 40 mm band below the top (the dribbler opening and the
                                       # bumper zone stay clear), all round but the camera window in front
side_band_front_gap_deg = 15.0         # ESTIMATE: +-15 deg kept clear in front (the onboard camera's window,
                                       # sports/soccer_ssl/sim/onboard.py)
side_band_min_share = 0.20             # S12: at least 20 % of the side area (checked by the tests)
# S12: one team bright, one dark, interchangeable, and NOT the vision pattern's / ball's colours: a dark navy for
# blue, a pale cream for yellow (hue of the team, far from the pattern's saturated blue / yellow, matte). 代你决定
# (the coordinator, 2026-10-11): "blue / yellow by team"; these shades are the rule-compatible reading of it.
side_band_rgba = { blue = [0.04, 0.08, 0.30, 1.0], yellow = [1.0, 0.95, 0.60, 1.0] }

[dribbler_model]                       # body.py mount(): the dribbler's contact model (README "Dribbler")
hinge_range_rad = 0.14                 # the carrier's swing from its forward stop to the shovel
hinge_stiffness = 0.5                  # N m / rad, preloaded against the forward stop (springref)
hinge_springref = -0.05
hinge_damping = 0.002                  # N m s / rad
hinge_solref_limit = [0.01, 1.0]       # the end stops (TPE dampers)
rotor_inertia = 2e-7                   # kg m^2, the motor's rotor (the bar's own inertia comes from its geometry)
bearing_damping = 1e-7
bar_friction = [1.0, 0.005, 0.0001]    # TPU 60A on the ball's cover (priority 3: the bar owns the contact)
bar_solref = [0.004, 1.0]
bar_solimp = [0.9, 0.95, 0.001, 0.5, 2.0]
bar_condim = 6
shovel_solref = [0.004, 1.0]           # the kicker face / chip shovel, damped (priority 2)
[dribbler_model.source]
hinge_range_rad = "S3 2.1 (the dribbler swings from +5 deg to -3 deg: 8 deg = 0.14 rad)"
hinge_stiffness = "ESTIMATE: holds the carrier on its forward stop until the ball pushes (S3 2.1 'forward dribbler position is the default')"
hinge_springref = "ESTIMATE: the preload of that stop"
hinge_damping = "ESTIMATE (S2: dampers absorb the impact; their properties are not published)"
hinge_solref_limit = "ESTIMATE (S2: TPE 70A end-stop dampers)"
rotor_inertia = "ESTIMATE: a 22 mm BLDC rotor (S11)"
bearing_damping = "ESTIMATE: ball bearings (S1 2.3), negligible"
bar_friction = "ESTIMATE: soft TPU (shore 60A, S3) on an ionomer golf-ball cover, about 1; 1.5 and 2.0 change nothing measured (README)"
bar_solref = "ESTIMATE: a soft bar, critically damped"
bar_solimp = "ESTIMATE: MuJoCo's default"
bar_condim = "ESTIMATE: torsional and rolling friction at the bar"
shovel_solref = "ESTIMATE (S1 2.2: the plunger has printed dampers): damped, no restitution"

[dribbler_assist]                      # assist.py: the capped grip the rigid contact misses (README "Dribbler")
enabled = true
hold_force_n = 0.5
stiffness_n_m = 400.0
damping_n_s_m = 8.0
catch_speed_m_s = 5.0
back_speed_m_s = 1.9
side_speed_m_s = 2.3
turn_rate_rad_s = 9.1
zone_m = 0.03
[dribbler_assist.source]
hold_force_n = "DERIVED: S6 turning at 9.3 rad/s keeps the ball 0.09 m from the centre: 9.3^2 x 0.09 = 7.8 m/s^2 on 0.046 kg, plus the 3 m/s^2 runs = 0.5 N (measured: a push of 0.75 N takes the held ball, tools/dribble_lab.py steal)"
stiffness_n_m = "ESTIMATE: the 46 g ball's held point at 15 Hz (a stiff grip, critically damped with damping_n_s_m)"
damping_n_s_m = "ESTIMATE: critical damping of stiffness_n_m on 0.046 kg"
catch_speed_m_s = "S9 (TIGERs' 2-DoF damped dribbler receives balls up to about 5 m/s; ZJUNlict 8.5, an ordinary dribbler 3: the TIGERs value)"
back_speed_m_s = "DERIVED from S6 (ZJUNlict v2023 TestDribble at 3 m/s^2: ball lost at 2.3 m/s backwards; the more conservative of their two robots, v2019 3.9): the grip lets go at 1.9 m/s so that the same test here loses the ball (3 cm off) at 2.28 m/s (tools/dribble_lab.py, 3000 rpm)"
side_speed_m_s = "DERIVED from S6 (2.6 m/s sideways, v2023; v2019 3.9): released at 2.3 so that the test loses the ball at 2.61 m/s"
turn_rate_rad_s = "DERIVED from S6 (9.3 rad/s, v2023; v2019 12.9; KIKS S8 loses it at 3.5 rad/s): released at 9.1 so that the test loses the ball at 9.32 rad/s"
zone_m = "ESTIMATE: the grip reaches 3 cm in front of the held point (the bar's damped travel and the ball's bounce)"

[controller]                           # body.py Rig: bodies/servo.py Servo every physics step
kp_base = [10300.0, 10300.0, 41.0]     # x, y: 2.62 kg at 10 Hz; yaw: 0.0104 kg m^2 at 10 Hz (ESTIMATE, tuning)
kd_base = [330.0, 330.0, 1.3]          # critically damped
resync_m = 0.02                        # the setpoint restarts from the measured state when a collision pushes the robot
                                       # this far off it (the real robot replans from its state estimate every frame)
control_dt_s = 0.01
setpoint_dt_s = 0.01                   # PlanarBase's rate (the 1 kHz PD interpolates it; README "Speed")
physics_dt_s = 0.001
dribbler_kp = 0.0002                   # N m per rad/s: the speed loop's P gain (S3 2.2: "a high-gain P-only setting");
                                       # the highest stable at the 1 kHz loop: kp dt / I < 1 with I = 5e-7 kg m^2
