# README data for tasks/robowits/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   upstream  RoboWits (UMass-Embodied-AGI/RoboWits @ 9cc30ae): gs_gym/envs/robowits/<NN>_<task>.py, `_check_success` of
#             each shipped family (line numbers below are at 9cc30ae); gs_gym/envs/robowits/utils.py L142-180
#             check_being_held (either gripper's end-effector point inside the object's bounding box grown by 3 cm).
#             Every predicate's "table area" is TABLE_X 0.21..1.00, TABLE_Y -0.69..0.69 (world frame), table top z 0.76.
#   tooling   embodied_first_exam/benchmarks/robowits/privileged/tests/rcb_robowits.py: SETTLE_STEPS 30, CHECK_STEPS 60,
#             CHECK_STRIDE 6, REST_M 0.002 (L339-342), GRADED (L343-359: "rest" objects, stand_pages "release_also"),
#             MOVE_CUBE_LINE_X / FALLEN_M (L360-361), _family_clause (move_cube, L735-743), goal() L755-761 (predicate AND
#             clause AND no robot contact with the graded objects, Genesis' contact list), settle_check() L763-800,
#             replay() L816-833, step() L697-716 (MAX_STEPS 200,000, L318), _poses_match() L641-660.
#   graders   privileged: embodied_first_exam/benchmarks/robowits/privileged/tests/grade.py L91-133 (one replay);
#             standard: embodied_first_exam/benchmarks/robowits/sim/server.py finish() L181-223 (RCB_AGENT_END=1 in every
#             standard docker-compose), instance check L226-235, and standard/tests/grade.py.
# Standard READMEs give no world coordinates (README "World-frame information"; ci_checks/benchmarks/robowits/
# check-world-frame-texts.sh): every family text below is written relative to the objects and the table top. Only the
# privileged mode text and move_cube's privileged text name world coordinates.

[benchmark]
name = "RoboWits"
citation = "Lin et al., 2026"           # upstream README "Citation": lin2026robowits, arXiv:2605.30326
url = "https://github.com/UMass-Embodied-AGI/RoboWits"
repo = "UMass-Embodied-AGI/RoboWits"
commit = "9cc30ae"
# The frozen scene's dataset entry: seed.toml of the other seeds replaces "entry 0 of RoboWits' `eval_dataset_50/NN.json`".
others = """
The frozen scene is entry {seed} of RoboWits' `eval_dataset_50/{vars[ds]}.json` (RoboWits task
`robowits/{vars[upstream]}`).
"""

[license]
text = """
RoboWits ([UMass-Embodied-AGI/RoboWits](https://github.com/UMass-Embodied-AGI/RoboWits) @ `9cc30ae`) is MIT-licensed,
as declared in its `pyproject.toml`. Genesis 0.4.7 is under the Apache License 2.0, and RoboWits' asset bundle
(`XHRlyb2001/RoboWits_assets`) also under Apache-2.0. Most families also load BlenderKit models. BlenderKit licenses
each model to the account that downloads it, and these models may not be redistributed, so they are not in the image
or the repository. Users fetch them with their own BlenderKit key, or use the encrypted research bundle, whose terms
allow **non-commercial academic research only** (`images/robowits/NOTICE`).
"""

[robots]
marvin-bimanual = "Bimanual Marvin: two 7-DoF arms with Pika parallel grippers"

# grade.py L91-133: no file -> missing_trajectory; np.load fails / no `task` or `actions` / a member > 256 MB (L36, L45-52)
# -> bad_trajectory; task != family -> wrong_family (L102); ndim != 2, width != 16, T > MAX_STEPS, non-finite ->
# bad_trajectory (L104); Session() raises -> instance_build_failed, grader_error = infra_error = 1 (L107-112); success =
# replay()["success"] (settle_check) AND instance_matches (CPU backend; else infra_error 1, L117-124).
# rcb_robowits.py replay() L816-833: reset, rows (stop on the cap), then settle_check(); step() L697-716 returns True at
# the 200,000th control step and raises after it.
[modes.privileged]
success = """
The verifier, in a separate sandbox without network, replays `/app/output/trajectory.npz` once in a fresh process
from its own copy of the frozen instance: a reset, then the rows open-loop, one per 1/30 s control step. A settle
window follows the last row. The robot holds the last row's joint targets for 30 control steps (1 s), and nothing is
checked. For 60 more control steps (2 s) the goal must then hold at every 6th step and at the last one. Through those
60 steps the set of graded objects must not change, and no graded object may move more than 2 mm from where it was
when they began. The task scores 1 only if the window passes.

Where the goal names the table area, it is the world-frame rectangle 0.21 ≤ x ≤ 1.00 m, −0.69 ≤ y ≤ 0.69 m;
the table top is at z = 0.76 m.

A missing file scores 0, and so does an invalid one. Invalid means: not a readable `.npz`, no `task` or `actions`
entry, an entry over 256 MB, a `task` other than this family, `actions` that are not finite numbers of shape (T, 16),
or T over 200,000. The rows and the window share the cap of 200,000 control steps; a window cut short by the cap does
not pass. The rebuilt scene must match the frozen instance: the same state hash, or every object within 2 mm and 0.02
(quaternion components) and every joint within 0.002 rad of the recorded pose. A scene that does not match, or does
not build, is an infrastructure error, not a score.
"""

# server.py finish() L181-223 with AE.ENABLED: "finished" (POST /finish) and "timeout" (session end, agent_exit folded
# in) -> settle(journal_step) = Session.settle_check on the live simulator; "step_guard" -> "step_limit": check_success()
# = Session.goal() as it stands (no window); "error" (simulator) -> success stays False. L226-235: instance_matches false
# -> give_up("instance_mismatch", infra=True) before the agent is served. standard/tests/grade.py: success =
# final.json success AND graded_by live AND not infra AND reason != "error".
[modes.standard]
success = """
Graded: the live episode the simulator service ran; nothing is replayed. There is one episode and no reset. The
episode ends when the agent sends `/finish` or when its session ends (at the latest after {timeout}). Success is never
shown and never ends the episode. The verdict is a settle window on the live simulator, from the state the episode
ends in. The robot holds the last command for 30 control steps (1 s), and nothing is checked. For 60 more control
steps (2 s) the goal must then hold at every 6th step and at the last one. Through those 60 steps the set of graded
objects must not change, and no graded object may move more than 2 mm from where it was when they began. The window's
steps are part of the recorded episode.

Where the goal names the table area, it is a fixed rectangle, 0.79 m deep (away from the robot) and 1.38 m wide,
that the predicates use as the table's extent. Heights are measured from the table top.

The episode also ends on a simulator error, which scores 0. It also ends after 200,000 control steps: the goal is then
judged as it stands, with no window. A window cut short by that cap does not pass. The scene is checked against the
frozen instance before the agent is served; a mismatch is an infrastructure failure, not a score.
"""

