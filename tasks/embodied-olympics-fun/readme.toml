[benchmark]
name = "Embodied Olympics - Fun"
citation = "Embodied Olympics authors, 2026"   # no paper; the private upstream repository (images/embodied-olympics-fun/roboolympics/SOURCE.md)
url = "https://github.com/CHIGUI0/roboolympics"
repo = "CHIGUI0/roboolympics"
commit = "7df999b"                             # SOURCE.md: commit 7df999b3f553063a9b6b7cc3130b77dbee7bb9c8, branch athletics-v3

[license]
# images/embodied-olympics-fun/roboolympics/SOURCE.md (third-party parts, each licence file next to its files)
text = """
The Embodied Olympics robot library and running-policy port ([CHIGUI0/roboolympics](https://github.com/CHIGUI0/roboolympics)
@ `7df999b`, a private repository) is released under the MIT License (`LICENSE.roboolympics` in the image); this
benchmark's venues and referees are MIT too. Third-party parts in the image: the Unitree G1 model and meshes from MuJoCo
Menagerie (BSD-3-Clause), the Unitree H1-2 model, meshes and walking policy and the G1 walking policy from
unitree_rl_gym (BSD-3-Clause), the G1 running policy from C1801SYQ/g1_running (Apache-2.0), FALCON's G1 walking policy
from LeCAR-Lab/FALCON (MIT) and the WBC-AGILE G1 walking policy from NVIDIA (Apache-2.0). No non-commercial terms apply.
"""

[robots]
# B/rfo/task.py TaskBase.robot L14-15; B/rfo/world.py Robot L591-635 (29 / 27 joints); hands per family:
# B/rfo/realhand.py (dex3 on the G1, inspire on the H1-2), elsewhere palm pads or a family's tool on the wrist mount
unitree-g1 = "Unitree G1 humanoid (1.32 m, 33 kg, 29 joints), with Unitree's walking and running policies"
unitree-h1-2 = "Unitree H1-2 humanoid (1.78 m, 67 kg, 27 joints), with Unitree's walking policy"

[modes.privileged]
# B/grade.py L77-79 missing -> 0; L88-98 a link, over 64 MB, not an npz with `actions`, more than 40000 rows -> bad
# (0); L99-101 `family` of another task -> wrong_task (0); L94 only the first horizon rows are used; L102-105 a
# non-finite value among them -> bad (0); L107-113 a replay without a result (600 s timeout, a crash) or an image that
# no longer builds the frozen start -> grader_error / infra_error; L114 success = the replay's referee verdict.
# B/rcb_rfo.py replay() L224-235: stops at the referee's call; a row with an unknown mode ends the replay there.
success = """
Graded file: `/app/output/trajectory.npz`, as `s.save_trajectory()` writes it: an `actions` array of sim rows, one per
10 ms control step, and the task's family name. After the agent's session it is replayed once, open-loop, from the
frozen start, in a fresh process of a separate verifier container without network. Rows run one per control step
until the referee calls the attempt; rows after the call, and rows past the attempt's time limit, are not run. The
task is passed if the referee has called a success when the replay stops. If the rows run out before the referee's
call, the task is not passed. A row the robot cannot run (its first value, the mode, is not one of the robot's modes)
ends the replay at that row without a pass.

The physics diverging (a non-finite state, a bad acceleration, or the robot or a prop faster than 150 m/s) ends the
attempt as a failure, unless a success was called in an earlier control step. Only the trajectory is scored (`gen.py`
and `NOTES.md` are not). A missing file, a file that is not such an array (a link, over 64 MB, more than 40,000 rows,
the wrong row width), a file for another task, or a non-finite value in the rows that are used scores 0. An image that
no longer rebuilds the frozen start, or a replay that crashes or runs over 600 s, is an infrastructure failure, not a
score.
"""

[modes.standard]
# server.py RoboFun.step() L196-204 + rcb_service.py _step() L940-952, _end() L960-973, _judged() L683-686 (events):
# success seen at any control step -> the episode is a success; a failure call before it -> "failed", 0; the time
# limit -> step_cap -> "step_limit", judged on the success seen so far. /finish -> "finished"; session end ->
# "timeout"; both judged the same way. Reset: _reset() L1208-1240 (a new attempt from the frozen start, success cleared).
# Error on the agent's call -> "error", 0; instance mismatch, a crash outside the agent's calls -> infra (docstring
# L57-78). Divergence: rfo/world.py L877-889.
success = """
Graded: the live attempt, judged by the referee in the simulator service as it runs; nothing is replayed. The referee's
success call is an event: once it is made at some control step, the attempt is a success. It is never shown to the
agent and does not end the attempt: the physics goes on until the agent's `/finish`, the attempt's time limit, or the
end of the agent's time ({timeout}), and nothing after the call undoes it. A failure the referee calls before any
success (a foul, a fall, the physics diverging) ends the attempt at once with 0. Reaching the time limit or the end of
the session without a success call scores 0. The agent has {resets} resets, each starting a new attempt from the
frozen start; only the last attempt (the one after the last reset) is graded, and a success in an earlier attempt does
not count. A simulator error raised by the agent's own call ends the attempt with 0. An attempt that does not start
from the frozen instance, or a service crash outside the agent's calls, is an infrastructure failure, not a score.
"""

[modes.realtime]
# As [modes.standard] (rcb_realtime.py extends rcb_service.Service; the verdict is the standard service's), plus the
# clock (rcb_realtime.py docstring L9-18: paused until the first /submit, one control step every control_dt x
# slowdown s, zero-order hold when the plan runs out) and its error rule (L86-98: after the first command a simulator
# error or a crash inside a control step is the agent's; before it, a kill, a failed resume, a reset that does not
# rebuild: infrastructure).
success = """
Graded: the live attempt, judged by the referee in the simulator service as it runs; nothing is replayed. The clock
does not stop: an attempt starts paused at the frozen start, and from the agent's first `submit` one control step runs
every 10 ms × S of wall time (slowdown S = {slowdown}) whether or not the agent sends anything; when the planned
commands run out the last ones are held. The referee's success call is an event: once it is made at some control step,
the attempt is a success. It is never shown to the agent and does not end the attempt: the physics goes on until the
agent's `/finish`, the attempt's time limit, or the end of the agent's time ({timeout}), and nothing after the call
undoes it. A failure the referee calls before any success (a foul, a fall, the physics diverging) ends the attempt at
once with 0. Reaching the time limit or the end of the session without a success call scores 0. The agent has
{resets} resets, each starting a new, paused attempt from the frozen start; only the last attempt (the one after the
last reset) is graded. After the agent's first command, a simulator error or a simulator crash inside a control step
is the agent's 0; anything before the first command, a killed service, a failed resume or a reset that does not
rebuild the scene is an infrastructure failure, not a score.
"""

# -------------------------------------------------------------------------------------------------------------------
# embodied-olympics-fun families, part 1 (merged into tasks/embodied-olympics-fun/readme.toml).
# B/ = embodied_first_exam/benchmarks/embodied-olympics-fun/. Every family: B/rfo/tasks/<family>.py (the referee: its
# `stages`, `substep` / `step` hooks, `time_limit_s`, `fall_rule`); the numbers are the frozen instance's `params`
# (environment/instance.json, equal to the module's defaults); shared rules: B/rfo/referee.py Referee.stage() L149-159
# (stages latch in order), step() L273-291 (the generic fall rule when `fall_rule` is on, the time limit -> fail
# "time"), standing() L294-303 (only the feet on the ground, torso within about 20 degrees of vertical = upright
# >= 0.94, pelvis <= 0.35 m/s unless the family passes other values), Flights L355-400 (a flight = nothing of the
# robot touches anything but what its hands grip, counted from `min_air` seconds).

[families.backflip]
# B/rfo/tasks/backflip.py: time_limit_s 20 (L27), stages L29, fall_rule on with fall_z = fall_pelvis_m 0.20 (L55-57),
# legal ground the feet (TaskBase); take-off L87-91 (first flight >= 0.2 s, from the feet only), full turn L92-93
# (pelvis' backward rotation about its levelled lift-off left-right axis, summed in the air, >= 300 deg), landing
# L94-104 (first touch with the feet only, else fail), stand L106-111 (standing() with tilt 20 deg, 0.35 m/s, held 2 s).
success = """
The referee's stages, in order: take-off, full turn, landing, stand.
- Take-off: the robot's first flight phase of at least 0.2 s (nothing of the robot touches anything). At lift-off the
  last parts on the ground must be the feet alone; otherwise the attempt fails. Shorter hops are ignored.
- Full turn: during that flight the pelvis turns at least 300 degrees backwards about the horizontal axis that was its
  left-right axis at lift-off. Only rotation while airborne counts.
- Landing: the first touch after the flight is made by the feet only. Landing with less than 300 degrees turned, or
  touching down with any other part, fails.
- Stand: after the landing, the robot stands for 2 s without a break: only the feet on the ground, the torso within
  20 degrees of vertical, the pelvis slower than 0.35 m/s. The success is called when the 2 s are complete.

Fall (a failure at any time): any part other than a foot touches the ground, or the pelvis is below 0.20 m. Time
limit: 20 s (2,000 control steps).
"""

[families.balance_beam]
# B/rfo/tasks/balance_beam.py: time_limit_s 90 (L40), fall_rule False (L42), stages L43; substep L106-110 (any part on
# the floor or the beam's supports; any part but a foot on the beam -> fail); step L123-139 (half way: both feet on the
# beam with the rearmost contact point at x >= 2.5 m; far end: rearmost contact >= 4.5 m; stand: far end + standing()
# on the beam, tilt 20 deg, 0.35 m/s, held 2 s).
success = """
The beam is 5.00 m long and 0.10 m wide, its top 1.25 m above the floor; the robot starts on the near end. The
referee's stages, in order: half way, far end, stand.
- Half way: both feet touch the beam and every point where they touch it is at least 2.5 m from the near end.
- Far end: both feet touch the beam and every point where they touch it is inside the far end, the last 0.50 m.
- Stand: for 2 s without a break the robot stands there: both feet in the far end, only the feet touching the beam,
  the torso within 20 degrees of vertical, the pelvis slower than 0.35 m/s. The success is called when the 2 s are
  complete.

Fouls (each fails the attempt at once): any part of the robot touches the floor or the beam's supports; any part other
than a foot touches the beam. A hop off the beam with both feet is allowed if the robot lands on it on its feet. The
generic fall rule is off; these fouls replace it. Time limit: 90 s (9,000 control steps).
"""

[families.balance_board]
# B/rfo/tasks/balance_board.py: time_limit_s 30.5, fall_rule False; substep L147-155 (deck on the floor, robot on the
# floor, robot on the roller, any part but a foot on the deck -> fail), step L157-171 (no foot on the deck for more
# than off_board_s 1.0 s -> fail; stages at 10, 20, 30 s; success at duration_s 30 s).
success = """
The board is a rigid deck (0.76 m by 0.38 m) lying loose on a free roller on the floor. The referee's stages, in
order: 10 s, 20 s, 30 s, each latched when that much time has passed with no failure. The success is called at 30 s.

Fouls (each fails the attempt at once): any part of the deck (an end or one of the stops under its ends) touches the
floor; any part of the robot touches the floor or the roller; any part other than a foot touches the deck; neither
foot has touched the deck for more than 1.0 s. The generic fall rule is off; these fouls replace it. Time limit:
30.5 s (3,050 control steps).
"""

[families.boxing]
# B/rfo/tasks/boxing.py (H1-2): time_limit_s 15, stages ["strike", "guard"], fall_rule on with fall_z 0.50, legal
# ground the feet; substep L147-190: the first touch of the bag is the punch: only the right palm pad's far 0.03 m
# (knuckle part) may touch, first contact depth below the hook inside the band (1.2-1.6 m above the floor), a touch over
# 0.1 s -> "pushed", the touch ends after 0.03 s apart; impulse = change of the bag's angular momentum about the hook /
# depth of the lowest contact >= 12.0 N s; any touch after the punch -> fail. step L192-199: right palm within 0.35 m
# of the right shoulder joint while standing(), held 2 s.
success = """
A 30 kg heavy bag hangs by a chain in front of the robot, with a marked band from 1.2 m to 1.6 m above the floor. The
referee's stages, in order: strike, guard.
- Strike: the robot's first touch of the bag is the punch. Only the knuckle part of the right fist (the far 0.03 m of
  the hand's pad, along the forearm) may touch the bag, and the first contact must be inside the band. The touch lasts
  at most 0.1 s (it ends when fist and bag have been apart for 0.03 s), and the bag receives an impulse of at least
  12.0 N s (the change of its angular momentum about the hook, divided by the depth below the hook of the lowest point
  touched).
- Guard: after the strike, the right palm stays within 0.35 m of the right shoulder joint for 2 s without a break
  while the robot stands (only the feet on the ground, the torso within about 20 degrees of vertical, the pelvis
  slower than 0.35 m/s). The success is called when the 2 s are complete.

Fouls (each fails the attempt): anything other than the knuckle part of the right fist touches the bag; the punch
lands outside the band, is weaker than 12.0 N s, or lasts longer than 0.1 s (a push); anything touches the bag again
after the punch. Fall (a failure at any time): the pelvis below 0.5 m, or any part other than the feet on the floor.
Time limit: 15 s (1,500 control steps).
"""

[families.box_jump]
# B/rfo/tasks/box_jump.py (H1-2): time_limit_s 20, fall_rule False, stages ["take-off", "landing", "stand"];
# substep L124-161: before the take-off any part but the feet on the floor -> fail, touching the box -> fail; the jump =
# the first flight >= 0.1 s, each foot on the floor within 0.1 s before lift-off, pelvis rise >= 0.1 m; after it any
# floor contact -> fail, any part but a foot on the box -> fail; in the 0.5 s after the first contact every foot
# contact on the top face (within 0.02 m of the top plane, normal within 20 deg), both feet on top at its end.
# step L163-175: both feet on the top face, pelvis >= 1.0 m above the box top, standing() on the box (20 deg, 0.35 m/s),
# held 2 s.
success = """
The box is a free 25 kg body, 0.61 m high, with a top 0.51 m by 0.76 m. The referee's stages, in order: take-off,
landing, stand.
- Take-off: the robot's first flight phase of at least 0.1 s. It counts only if nothing of the robot touched the box
  before it, each foot was on the floor within the last 0.1 s before lift-off, and the pelvis rose at least 0.1 m
  above its height at lift-off; otherwise the attempt fails.
- Landing: over the 0.5 s after the first contact, only the feet touch anything, and only the box's top face (each
  contact within 0.02 m of the top plane and pushing within 20 degrees of straight out of it); at the end of the 0.5 s
  both feet are on the top. Otherwise the attempt fails.
- Stand: for 2 s without a break, both feet on the top face and nothing else touching anything, the torso within 20
  degrees of vertical, the pelvis slower than 0.35 m/s and at least 1.0 m above the box's top. The success is called
  when the 2 s are complete.

Fouls (each fails the attempt at once): before the jump, any part other than the feet touching the floor, or anything
touching the box; after the take-off, any part touching the floor, or any part other than a foot touching the box. The
generic fall rule is off (no pelvis-height limit). Time limit: 20 s (2,000 control steps).
"""

[families.breaking_windmill]
# B/rfo/tasks/breaking_windmill.py: time_limit_s 30, fall_rule False, stages ["down", "1 windmill", "2 windmills",
# "3 windmills"]; ALLOWED parts L24, BACK L23; substep L127-135 (a contact with the floor outside the 8 m x 8 m field ->
# fail); step L137-184: down = BACK on the floor with no disallowed part; a revolution = 360 deg of torso heading and
# >= 0.85 of a roll about the torso's long axis, same sense, counted only while lying (axis within 30 deg of horizontal,
# pelvis <= 0.45 m), BACK on the floor in each half; hips or legs on the floor, a reversed rotation or a revolution that
# misses these -> the count goes back to 0; success at 3 counted in a row.
success = """
The referee's stages, in order: down, 1 windmill, 2 windmills, 3 windmills.
- Down: the torso or an upper arm touches the floor while no hip or leg part does. How the robot gets down is free.
- A windmill revolution is counted on the torso: its long axis (pelvis to neck) turns 360 degrees round the vertical
  while the torso rolls at least 0.85 of a full turn about that axis, both the same way round. Turning and rolling
  count only while the robot lies on the floor: the torso's long axis within 30 degrees of horizontal and the pelvis
  at most 0.45 m above the floor. The torso or an upper arm must touch the floor in each half of each revolution.
- During the windmills only the torso (with the head), upper arms, forearms and hands may touch the floor. The count
  goes back to zero when a hip or leg part (thighs, shins, feet) touches the floor, when the rotation reverses, or when
  a revolution of heading is completed without the roll or the floor touches above.
- The success is called when 3 revolutions are counted in a row.

Fouls (each fails the attempt): any part of the robot touches the floor outside the 8.0 m by 8.0 m field of play. The
generic fall rule is off. Time limit: 30 s (3,000 control steps).
"""

[families.crawl]
# B/rfo/tasks/crawl.py: time_limit_s 120 (L21), fall_rule False (L23), stages (L24) ["under the first wire", "half way", "through"];
# course L54 (x0 = 1.0 m ahead of the pelvis start, x1 = x0 + 10 m, half width 1.0 m, wire centre height 0.45 m);
# substep L72-74 (any touch of a wire -> fail); step L76-99: with the pelvis between x0 and x1, |y| > 1.0 m -> "went
# round", z > 0.45 m -> "went over"; under the first wire = the whole body past x0; half way = pelvis past the middle;
# through = the whole body past x1, with the pelvis having passed under the wires and half way, else fail.
success = """
A lane 2.0 m wide runs along the robot's forward direction, with wires across it every 0.5 m over 10.0 m, the first
1.0 m ahead of the pelvis' start; each wire's centre is 0.45 m above the ground. The referee's stages, in order: under
the first wire (the whole body past the first wire, the pelvis under the wires), half way (the pelvis past the
middle), through (every part of the robot past the last wire). The success is called at through.

Fouls (each fails the attempt at once): any part of the robot touches a wire; while the pelvis is between the first
and the last wire, it is higher than 0.45 m or outside the lane; the whole body is past the last wire without the
pelvis having passed under the wires and the half-way mark. Any part may touch the ground (there is no fall rule), and
the posts may be touched. Time limit: 120 s (12,000 control steps).
"""

[families.dribble_slalom]
# B/rfo/tasks/dribble_slalom.py: time_limit_s 90, fall_rule on with fall_z 0.35, legal ground the feet; stages out 1-6,
# back 6-1, finish; substep L158-189: a hand or arm on the ball -> handball; the robot or the ball touching a cone ->
# fail; for the ball's centre and the pelvis separately, the first crossing of the next cone's plane in the direction
# of travel decides its side (_advance L144-156: wrong side -> fail); a stage latches when both have passed that plane;
# finish = after the twelve planes, the whole ball (its centre one radius past the line) and the pelvis back over the
# start line. step L191-200: ball centre more than control_m 2.0 m from the pelvis (horizontally) -> fail.
success = """
A football lies ahead of the robot, behind a start line; six free-standing cones stand on the robot's forward line, the
first 2.0 m beyond the start line and then every 2.0 m. Each cone has a plane through it, square to the course. The
referee's stages, in order: out 1 to out 6, back 6 to back 1, finish.
- Out: the ball's centre and the pelvis each cross the plane of cone 1 to the robot's starting left, cone 2 to its
  right, and so on alternately to cone 6 (to the right).
- Back: round cone 6, then the planes of cones 6 to 1 again, each on its other side (cone 6 to the left as seen from
  the start, cone 5 to the right, and so on, cone 1 to the right).
- For each plane, the first crossing in the direction of travel after the previous plane decides, for the ball and the
  pelvis separately; a stage latches when both have passed that plane on the correct side.
- Finish: after all twelve planes, the whole ball and the pelvis are back over the start line. The success is called
  then.

Fouls (each fails the attempt at once): the ball or the pelvis crosses a plane on the wrong side; the ball's centre is
more than 2.0 m from the pelvis, measured along the ground; the robot or the ball touches a cone; a hand or arm touches
the ball (any other part may play it). Fall (a failure at any time): the pelvis below 0.35 m, or any part other than
the feet on the ground. Time limit: 90 s (9,000 control steps).
"""

[families.bowling]
# B/rfo/tasks/bowling.py: time_limit_s 40, fall_rule on with fall_z = LANE_Z + fall_pelvis_m (0.5 m above the approach,
# L33, L212), legal ground the feet; stages ["delivery", "pins", "strike"]; pins_down L309-319 (tilt > 20 deg, or off
# the lane's surface); substep L321-355: a robot contact with anything but the ball at x >= 0 (on or past the foul
# line) -> foul, at any time; before the release a ball contact with a part other than the hands -> fail; release = no
# contact for release_s 0.05 s, dated at the last touch; after it any robot touch of the ball -> fail (checked until the
# ball first touches a pin); delivery = ball past the foul line; a gutter contact (before a pin is touched) -> fail;
# pins = the first ball-pin contact after the delivery. step L357-367: settle_s 5.0 s after that contact, 10 down ->
# strike, else fail.
success = """
The lane runs 18.288 m from the foul line to the head pin, with a gutter on each side; ten pins stand in the usual
triangle. The ball starts pressed between the robot's palms; nothing can be gripped. The referee's stages, in order:
delivery, pins, strike.
- Before the release the ball may touch no part of the robot but the hands. The release is the ball's last touch of the
  robot before 0.05 s with no touch; after it no part of the robot may touch the ball (checked until the ball first
  touches a pin).
- Delivery: the released ball crosses the foul line.
- Pins: the ball touches a pin after the delivery. A ball that touches a gutter before that fails the attempt (a
  gutter ball).
- Strike: 5.0 s after the ball's first pin contact, all ten pins are down. A pin is down when it is tilted more than
  20 degrees or is no longer on the lane's surface. Fewer than ten pins down at that count fails the attempt.

Fouls (each fails the attempt at once): any part of the robot touches the lane, a gutter or anything else on or beyond
the foul line, at any time. Fall (a failure at any time before the count): the pelvis lower than 0.5 m above the
approach, or any part other than the feet on the approach or the floor. Time limit: 40 s (4,000 control steps).
"""

[families.clean_and_jerk]
# B/rfo/tasks/clean_and_jerk.py: time_limit_s 60, fall_rule False; stages ["lift-off", "clean", "overhead", "down
# signal"]; hands_on L314-318 (the grip section on the hand's fingers now or within off_bar_s 0.05 s); substep L321-348:
# robot on the floor, barbell on the floor, a part other than the feet on the platform, robot on a block -> fail; the
# bar 0.03 m above its rest with fewer than two hands -> fail, else lift-off; the bar's centre 0.48 m above the platform
# starts the attempt: then fewer than two hands, or the bar touching the platform or a block -> fail. final_checks
# L350-365 and step L367-393: before the clean, bar overhead (centre >= head centre + 0.25 m) -> fail; clean = attempt +
