schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-tabletennis-match-i02-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): table tennis, one match against the scripted opponent at level 3 on the frozen instance of embodied-olympics-match-tabletennis-match-i02-standard-realtime (seed 12). Full simulator in development (read and change any state, reset the whole match); the deliverable is a closed-loop Python program that plays a fresh unmodified match in the verifier, on the original S = 10 clock, seeing the full state instead of camera images."
authors = [{ name = "Embodied Olympics (CHIGUI0)" }]
keywords = ["robotics", "mujoco", "fullsim", "policy", "tabletennis"]
[metadata]
author_name = "Embodied Olympics"
task_type = "policy"
simulator = "mujoco"
robot = "franka-panda"
family = "tabletennis_match"
mode = "privileged"
dynamics = "dynamic"
verifier_wall_clock = true
instance_seed = 12
opponent_level = 3
revision = "wallclock-15+duel-wallclock-12+low-inloop-1+core-0.2"
source_commits = ["0d7f680cc049"]
source_task = "roboolympics/tabletennis-match-wallclock-program-standard"
exporter = "roboolympics tools.tt_fullsim.export"
official = false
expert_time_estimate_hours = 1.0
oracle = "partial"
oracle_evidence = "full-state reference program (solution/): the camera-only reference player's serve and stroke planner fed the true ball state; its wins on this instance and across levels 1-4 are in the Embodied Olympics privileged report (tools/tt_fullsim/calibrate.py); not reproduced in this repository: the owner waived the oracle runs on 2026-10-17 (validated = false)"
validated = false

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 4.0
min_memory_gb = 6.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 8.0
verifier_min_gpu_memory_gb = 0.0
measured = "author estimate (Embodied Olympics, an RTX 4090 workstation, 2026-10-15): CPU-only MuJoCo 3.3.7, no cameras; one world about 0.4 GB, 470 control steps/s on one core; the verifier holds the service, the policy (2 GiB address space) and two fresh replays"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 6.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 6.0
measured = "author estimate, not yet measured: 6 GiB under the 8 GiB container cap (2 GiB for the monitor's margin), enough for about ten worlds at once; processes 512 and disk 20 GiB: design defaults"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 4.0, memory_gb = 8.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 12
allowed = [12]
oracle = [12]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
[verifier]
timeout_sec = 10000.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
