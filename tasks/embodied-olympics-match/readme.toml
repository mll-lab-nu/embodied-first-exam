#   standard, realtime  grade() L96-172: complete = reason in (match_over, ready_timeout, clock, abandoned, no_show)
#               L108; valid L110; agent_sim_error L116-122 (live, finalized, slowdown set, reason technical_error, every
#               error where "world_step", seat A applied > 0: valid, success 0); single side: success = valid and the
#               winner is A L134-135; duel (two seats): success = valid L137, then the duel's fexam_reward.py (B/
#               standard-realtime/tests/fexam_reward.py L18: valid_trial and A_won). No sport_grade.py sets `success`.
#               Forfeits: B/sim/core/service.py close_start_window L323-347 (no_show at START_TIMEOUT_S = 1800, a single
#               side's window from the service start), no_show_at_collect L349-369 (the session ends before the start),
#               abandon_single L371-388 (the session ends in play; a built-in seat counts as no session: the duel's A
#               loses); B/privileged/environment/fullsim/core/realtime.py timeout L344-370 (ready_timeout at
#               READY_TIMEOUT_S = 300). The collect: each standard/realtime task.toml [[verifier.collect]] (kill the
#               agent's container, then SIGUSR1 = Service.collect). The lockstep standard service tags its step errors
