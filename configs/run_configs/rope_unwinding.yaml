# rope_unwinding_physical_handle_demo 的运行模式参数（与 rope_winding 同一套 run 键）。
#
# 物理与场景参数用点路径覆盖，不在这里：
#   task.winding.direction=cw       镜像布局：出生缠绕与轨道同时反向，仍应成功
#   task.winding.start_turns=2      出生圈数（难度轴 1/2/3；spawn_arc.sweep_deg=-130 三档通用）
#   task.winding.orbit_direction=ccw  轨道方向强制与缠绕同向的失败对照例（winding 读 2·start_turns）
#   task.winding.wind_speed=0.0012  唯一的耗时旋钮（步数 = 段长 ÷ 速度）
#   task.rope.fem.rest_shape=spawn  task.rope.fem.E=200000.0
#   env.genesis.logging_level=warning
#
# 缠绕方向刻意**不**在这里开旋钮：本组的判据是「同一份 task/env 配置配上不同的
# run.* 应当产生相同的物理」，而换方向直接换掉整条轨迹。它是 task.winding.direction。

defaults:
  - default
  - _self_

# 只走缠绕路线的前 N 个路点，用于分段验证（入轨 / 逐圈解开 / 放置）。
# null = 走完整条；只有走完整条才装目标端口的 latch，也才做 winding 判定。
max_waypoints: null

# 开场静置步数。
settle_steps: 60

# 手跟不上规划点时不中止（跟随误差与绳接触的安全判定仍然生效）。
allow_target_lag: false

# 低分辨率绳：把网格与求解迭代降一档，用于快速看轨迹是否正确。
# 具体数值在 task 配置的 rope.lite 块里。
lite: false

# 每 N 步采一次诊断量并打印 PROBE 行：手的实际速度、插头高度、绳的最低节点、
# 绳的展开度与单步跳变、**实时 winding number**、柱面接触粒子数。
probe: false
probe_every: 15

# 运动步数的缩放。两者都按 1.0 时是正常物理。
viewer_speedup: 1.0
slow_factor: 1.0

# --- 数据生成相关 ----------------------------------------------------------
# 没有 randomize_layout / difficulty：本 demo 还没接布局随机化，
# 留着就是一个读不到的死键。接的时候连同 generation/layout_randomization.py
# 的条目一起加。
variant_id: default
# 录制 H5 数据集到该路径。null = 不录。
record_dataset: null
dataset_every_n_steps: 10
