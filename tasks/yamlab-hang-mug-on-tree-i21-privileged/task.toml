# Generated by scripts/yamlab/mk_tasks.py -- edit the template or scripts/yamlab/instances.json, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/yamlab-hang-mug-on-tree-i21-privileged"
description = "YAMLab HangMugOnTree-v0 (two I2RT YAM arms with parallel grippers, Isaac Lab / Isaac Sim 5.1): produce one replayable trajectory of YAMLab's 14-D joint-position actions. Task: pick up the mug with the left arm, hand it over to the right arm, and hang it on the mug tree. Frozen scene instance: `mug` = `Mug/mug_021` and `mug_tree` = `MugTree/mug_tree_021`, the recorded initial state of YAMLab teleoperation demonstration hangmug_021.hdf5 demo_0; graded by YAMLab's own staged success check (evaluation thresholds)."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "yamlab", "isaac-lab", "isaac-sim", "bimanual", "i2rt-yam", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "yamlab"              # YAMLab @ ec0455d on Isaac Lab @ f4aa17f / Isaac Sim 5.1 (PhysX on the CPU, RTX rendering)
robot = "i2rt-yam-bimanual"
family = "hang_mug_on_tree"
mode = "privileged"
oracle = "full"
expert_time_estimate_hours = 1.5

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 8.0
min_memory_gb = 16.0
min_gpu_memory_gb = 5.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 9.0
verifier_min_gpu_memory_gb = 5.0
measured = "GPU 3.8-4.0 GB per trial, anon memory 11.1-11.8 GB, CPU p90 5.8-8.7 cores over 12 trials, live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 AWS hosts + mll-4090-1, 10-10); vram_profile peaks 5.5-6.5 GB on 24 GB cards; board 0048: about 11 GB RAM and 8 CPUs per simulator; verifier 7.2 GB, mem_guard (docker memory per container, mll-4090-1, 10-02..10)"

[metadata.resources.limits]
# agent-phase limits; exceeding one fails the trial. scope: trial = every container, agent = the agent's container (docs/PROTOCOL.md §2.10)
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 24.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app"]
sustain_sec = 60.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 24.0

[verifier]
timeout_sec = 2400.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # Isaac Sim starts and renders offline: every asset is in the image (images/yamlab/web_assets.txt)

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576

[agent]
timeout_sec = 5400.0              # YAMLab budget, both modes (docs/benchmarks/yamlab.md): every Python process pays ~1.5-2.5 min of Isaac Sim launch + scene build
# YAMLab's teleoperation demonstrations (which solve these exact instances) and its MimicGen datasets are public upstream,
# so the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 24576
