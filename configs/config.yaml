# Shared environment defaults. Select a task in its own primary config.
defaults:
  - common_configs@common: manipulation_space_tabletop_v1
  - env_configs@env: world_tabletop_v1
  - robot_control_configs@robot_control: franka_panda_position_ik
  - task_configs@task: null
  - prefab_configs@prefabs: topogym_prefabs_v1
  - recording: "off"
  - run_configs@run: default
  - override hydra/job_logging: quiet
  - _self_

task: {}
hydra:
  job:
    chdir: false
  run:
    dir: runs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: runs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
