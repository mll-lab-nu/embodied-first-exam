schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robocasa-arrange-vegetables-i00-privileged"
description = "RoboCasa (ArrangeVegetables, a Franka Panda arm on an Omron mobile base (with a torso lift)): Pick the vegetables from the sink and place them on the cutting board. Produce one replayable trajectory of the robot's native controller commands on a frozen instance; graded on the state after the last action."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "robosuite", "robocasa", "mobile-manipulation", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "robosuite"
robot = "franka-panda-omron"
family = "robocasa/ArrangeVegetables"
mode = "privileged"
oracle = "full"
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 3.0
min_memory_gb = 14.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 5.0
verifier_min_gpu_memory_gb = 0.0
measured = "memory: robosuite sim p90 9.7 GB, verifier p90 4.0 GB (RoboCasa and RoboCasa-GR1 together), mem_guard (docker memory per container, ws-1, 10-02..10); CPU-only (OSMesa cameras); CPU author estimate"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# The benchmark's demonstrations solve these tasks and are publicly downloadable, so egress is closed to the model APIs.
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §2.7
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
