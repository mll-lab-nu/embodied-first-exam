# Franka Emika Panda (Franka Robotics "FER", Franka Emika Robot): the 7-joint arm of the Franka sports (fencing,
# table tennis, tennis, badminton; basketball's kinematic Panda gave way to a declared shooting machine in
# basketball-5). Their MJCFs are MuJoCo Menagerie franka_emika_panda (panda_nohand; Apache-2.0): the Panda's
# kinematics, joint ranges and masses, so the Panda's limits apply (not the FR3's). Data only: bodies/limits.py reads
# it. Every number is the manufacturer's (S1, cross-checked against S2 and S3); none is derived. Hands / tools are the
# sports' own for now (the unified body's bodies/hands/ may take them over).

[body]
name = "franka_panda"
title = "Franka Emika Panda (FER)"
revision = "panda-limits-2"            # bump on any change of the numbers below
                                       # panda-limits-2: self-collision, [self_collision] (bodies/selfcollision.py, 2026-10-09)
kind = "arm"                           # an arm on a sport's own base (pedestal, cart, rail); no model file yet: each
                                       # sport's scene carries the Menagerie Panda

[limits.arm]                           # joints A1..A7, joint space (S1 "Limits for Franka Emika Robot (FER)")
range_lo_rad = [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
range_hi_rad = [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]
speed_rad_s = [2.1750, 2.1750, 2.1750, 2.1750, 2.6100, 2.6100, 2.6100]
accel_rad_s2 = [15.0, 7.5, 10.0, 12.5, 15.0, 20.0, 20.0]
jerk_rad_s3 = [7500.0, 3750.0, 5000.0, 6250.0, 7500.0, 10000.0, 10000.0]
torque_nm = [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
torque_rate_nm_s = [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]
# S1: in joint-space control the range, velocity, acceleration and jerk limits are "necessary conditions" on the
# commanded joint trajectory (violating one aborts the motion); the torque and torque-rate limits are "recommended";
# in torque control the torque rate is a necessary condition.
[limits.arm.source]                    # per quantity (bodies/sources.py; the numbers above unchanged)
speed_rad_s = "S1 (S2 kMaxJointVelocity, S3)"
accel_rad_s2 = "S1 (S2 kMaxJointAcceleration)"
jerk_rad_s3 = "S1 (S2 kMaxJointJerk)"
torque_nm = "S1, S3"
torque_rate_nm_s = "S1 (S2 kMaxTorqueRate)"

[limits.cartesian]                     # S1, for Cartesian-space interfaces only: they do not bind joint-space control
translation = { speed_m_s = 1.7, accel_m_s2 = 13.0, jerk_m_s3 = 6500.0 }
rotation = { speed_rad_s = 2.5, accel_rad_s2 = 25.0, jerk_rad_s3 = 12500.0 }
elbow = { speed_rad_s = 2.1750, accel_rad_s2 = 10.0, jerk_rad_s3 = 5000.0 }


# ---------------------------------------------------------------------------------------------------------------------
# Self-collision (real limits B0, 2026-10-09): bodies/selfcollision.py, as for the robots with a model. The Panda's
# scene is the sport's: a sport maps its names (prefix / suffix, the bodies it stands on: pedestal, gantry carriage,
# rail cart; worldbody geoms of its stand) and writes the generated pairs into its scene files
# (selfcollision.scene_block); ci_checks/check-robot-limits.py compares them with this declaration.
[self_collision]
parts.arm = "link[1-7]"  # below link7 (the flange): the sport's tool; above link0: its stand
parts.body = "link0"
rules = { arm_body = true, arm_arm = true, tool_own_arm = true, same_arm = true }   # same_arm: the links fold onto
                                       # each other (link i x link j two or more joints apart, as MuJoCo's own filter)
warn_force_n = 20.0                    # a self-collision event above this peak normal force is a warning: the force
                                       # at which the real Panda's collision reflex stops the robot (S4)
exclude = []                           # none beyond the automatic ones (a link and its parent; the flange and the tool;
                                       # link0 and its stand): the Menagerie collision meshes clear each other otherwise
[self_collision.source]
warn_force_n = "S4"

[sources]
S1 = "Franka Robotics, Franka Control Interface (FCI) documentation, 'Control Interface Specification and Robot Limits', section 'Limits for Franka Emika Robot (FER)' (joint-space and Cartesian-space limit tables), https://frankarobotics.github.io/docs/robot_specifications.html (formerly frankaemika.github.io/docs/control_parameters.html), page (c) 2023 Franka Robotics GmbH, read 2026-10-07"
S2 = "libfranka 0.9.2 (the last release line for the Panda / FER), include/franka/rate_limiting.h: kMaxJointJerk {7500, 3750, 5000, 6250, 7500, 10000, 10000}, kMaxJointAcceleration {15, 7.5, 10, 12.5, 15, 20, 20}, kMaxJointVelocity {2.175 x4, 2.61 x3}, kMaxTorqueRate 1000 (each minus kLimitEps = 1e-3), kMaxTranslationalVelocity 2.0 m/s (the FCI page says 1.7), https://github.com/frankaemika/libfranka/blob/0.9.2/include/franka/rate_limiting.h"
S3 = "franka_ros (develop), franka_description/robots/panda/joint_limits.yaml: joint ranges, velocity, effort 87 / 12 N m, https://github.com/frankaemika/franka_ros"
S4 = "libfranka 0.9.2 examples/examples_common.cpp setDefaultBehavior(): setCollisionBehavior with Cartesian force collision thresholds 20 N (x, y, z) and 25 N m (rotations), the thresholds above which the Panda's reflex stops the motion (franka::Robot::setCollisionBehavior), https://github.com/frankaemika/libfranka/blob/0.9.2/examples/examples_common.cpp"
