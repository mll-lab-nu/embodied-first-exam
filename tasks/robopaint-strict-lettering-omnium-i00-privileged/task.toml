schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robopaint-strict-lettering-omnium-i00-privileged"
description = "RoboPaint-strict lettering: embodied robotic lettering (ManiSkill 3.0.1 Franka Panda holding a broad-edge (chisel) dip pen; the mark is the chisel edge swept along the path it takes): produce one replayable trajectory that copies the lettering shown in the picture target.png onto the main sheet with pen and ink, in at most 14 strokes. Scored against the picture (after the best single shift of the sheet, at most 5 mm along each axis: success iff IoU >= 0.85, boundary F within 1 mm >= 0.80, every stroke of the exemplar covered >= 0.75, stray ink <= 0.04 of its inked area and at most 14 strokes; the IoU is the continuous score). s.score() is served by a separate scoring container. Process rules (RoboPaint-strict): letter with pen strokes the way a scribe writes; colouring in or filling the letters, zigzag, serpentine or contour-offset fills fail: a pen-tip path on the main sheet longer than 970 mm made of marks narrower than 0.93 mm on average is colouring in."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "robopaint-strict", "maniskill", "sapien", "lettering", "calligraphy", "broad-edge", "foundational", "franka", "code-as-policy", "trajectory", "robopaint_strict_lettering_omnium"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "maniskill"           # ManiSkill 3.0.1 / SAPIEN 3.0.3 (PhysX on the CPU) + the broad-edge nib model (rcb_brush.py, CPU)
robot = "franka-panda"            # PandaStick with a dip pen: rigid holder + a collision-free 6 mm 4 mm chisel nib; TCP = the middle of the edge
family = "robopaint_strict_lettering_omnium"
mode = "privileged"               # privileged (exact sheets, pen state, reset, scoring service) | standard (RGB only: the -standard twin)
oracle = "partial"                # solution/solve.sh replays the frozen reference plan; its recorded scores: oracle_evidence
oracle_evidence = "The RoboPaint pair's reference solution, unchanged (solution/; its RoboPaint record: the oracle_evidence of robopaint-lettering-omnium-i00-privileged). Under the process rules the strict verifier scores it 1 (tests/grade.py with rcb_brush_strict.py, two fresh replays, ws3, 2026-10-05): path_mm 322 and mark_width_mm 3.12, against the colouring-in limits 970 mm and 0.93 mm. Harbor oracle and nop runs on one pair per family: docs/benchmarks/robopaint-strict.md (Validation)."
instance_seed = 0                 # scene = environment/instance.json (agent's copy: sheets, pen, ink well, start joints, the rule, instance_sha)
expert_time_estimate_hours = 3.0
difficulty = "hard"          # RoboPaint tiers: line easy; lettering medium (one short word, broad edge) / hard / extreme (pointed pen, long words)
medium = "broad_nib"           # the pen model: broad_nib | pointed_pen (rcb_brush.py)
hand = "foundational"               # difficulty axes: hand, letters, strokes (= the stroke cap), pen control
letters = 6
stroke_count = 14
pen_control = "wrist yaw (pen angle)"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 7200.0              # 2 h of wall clock (a replay of a few thousand control steps takes seconds)
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
