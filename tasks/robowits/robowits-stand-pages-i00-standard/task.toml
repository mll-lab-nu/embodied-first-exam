schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/journal.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/server.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/robowits-stand-pages-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): RoboWits stand_pages on the same frozen instance as the privileged task (evaluation scene 0 of task 7). Stand the two pages up on the table so that they brace each other. They start joined like an open book: the stabilizing bar already runs through the eyelets of both pages as a hinge pin, so nothing has to be inserted. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
keywords = ["robotics", "robowits", "genesis", "marvin-bimanual", "dual-arm", "standard-mode", "trajectory", "stand_pages"]

[metadata]
task_type = "trajectory"
simulator = "robowits"
robot = "marvin-bimanual"
family = "stand_pages"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.2"
oracle = "none"
oracle_evidence = "No reference solution: RoboWits ships no expert or planner for its seed tasks. Solvable: model trial robowits-stand-pages-i00__npAKeQv (calib-high-1944, privileged) graded success=1, deterministic=1 by the separate verifier; nop scored 0. These records are from earlier versions of the task (before protocol v1.0, on the same frozen instance and predicate); not re-run on this version (static validation only, 2026-10-01). Human review per family (protocol §4). Re-graded with the current grader (two AMD workstations; the earlier positives were graded on the Intel laptop, so a trajectory that fails the earlier grader on AMD too says nothing either way): the cited robowits-stand-pages-i00__npAKeQv fails the earlier grader on AMD as well (inconclusive); __ZfFjKom passes the earlier grader but fails the current one: it ends at the first control step where the predicate holds (row 549 of 549) and the pages fall within the settle second. No positive confirmed under the current grader yet (the 10-14 standard A trial of Opus stood them as a tent; its trajectory is not in our hands)."
instance_seed = 0
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
# end the episode (SIGUSR1 to the live service, through a crash resume if one is under way): the service runs the settle
# window after the agent's last command on the live simulator and writes the live verdict (nothing is replayed), then
# renders the video once; wait for it (final.json video_done), then hand over the record (docs/protocol/standard_mode.md §13.3)
command = "python3 /srv/rcb_limited.py end /data --wait-key video_done --timeout 2280; cat /data/final.json"
timeout_sec = 2400                # service up (a resume replays the journal first), the settle window, then the video

[agent]
timeout_sec = 3600.0             # RoboWits budget (why: tasks/robowits/README.md)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 5120
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
