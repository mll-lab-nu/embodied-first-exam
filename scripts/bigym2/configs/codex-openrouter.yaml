# Harbor job config: Harbor's own Codex agent, served by OpenRouter -- the run id codex-gpt6_luna-medium. Needs
# OPENROUTER_API_KEY in the environment (or `--env-file .env`). Paths are relative to the repository root:
#   harbor run -c scripts/bigym2/configs/codex-openrouter.yaml --env-file .env -p tasks/bigym2-flip-cup-i00-standard
agents:
  - name: codex
    model_name: openai/gpt-6-luna
    kwargs:
      version: 0.159.2          # the Codex CLI the recorded runs used
      reasoning_effort: medium
      web_search: disabled      # Codex's live search runs at the model provider, past the task's egress allowlist
      # Codex's config.toml: OpenRouter as a provider of its own. As "OpenAI", Codex compacts a full context through
      # an endpoint OpenRouter does not serve, and the run stops there ("Error running remote compact task").
      config:
        model_provider: openrouter
        model_providers:
          openrouter:
            name: OpenRouter
            base_url: https://openrouter.ai/api/v1
            env_key: OPENAI_API_KEY
            wire_api: responses
            supports_websockets: false
    env:
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
