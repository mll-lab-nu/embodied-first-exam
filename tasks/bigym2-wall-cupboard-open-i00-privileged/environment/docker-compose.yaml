# Rendering (upstream's env renders the robot's three cameras every control step) runs on an NVIDIA GPU through EGL;
# physics and the whole-body controller run on the CPU. Harbor's local docker sandbox rejects [environment].gpus;
# merging this onto the main service passes the device through. `graphics` mounts the EGL vendor library.
services:
  main:
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
