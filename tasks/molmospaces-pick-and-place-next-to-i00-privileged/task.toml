schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/molmospaces-pick-and-place-next-to-i00-privileged"
description = "MolmoSpaces pick-and-place-next-to (a Franka FR3 arm with a Robotiq 2F-85 gripper on a fixed base, MuJoCo 3.5.0) in privileged mode: produce one replayable trajectory. Pick up the lepidopteran and place it next to the brown rectangular bread. Frozen episode: upstream benchmark procthor-objaverse/FrankaPickandPlaceNextToHardBench/FrankaPickandPlaceNextToHardBench_20260305_json_benchmark, episode 5."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "molmospaces", "mujoco", "franka-robotiq-2f85", "code-as-policy", "trajectory", "pick-and-place-next-to"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "molmospaces"          # MolmoSpaces (molmo-spaces 0.2.9) on MuJoCo 3.5.0, CPU physics
robot = "franka-robotiq-2f85"
family = "pick-and-place-next-to"
mode = "privileged"
# scene = environment/instance.json (one upstream benchmark episode + its t = 0 state hash); identity = the dataset.toml digest
expert_time_estimate_hours = 2.0
oracle = "none"
oracle_evidence = "upstream record: learned policies are evaluated on the MolmoSpaces benchmark episodes in arXiv 2602.11337 (MolmoSpaces) and arXiv 2603.16861 (MolmoBot); no reference solution is shipped"

[verifier]
timeout_sec = 1800.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in two fresh processes, with no network.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[agent]
timeout_sec = 3600.0
# The model APIs and nothing else (scripts/set_agent_egress.py HOSTS): MolmoSpaces, its experts and its trajectories are public.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
