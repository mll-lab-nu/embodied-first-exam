# unlink_c_ring_inspect_demo 的运行模式参数。
#
# 几何不在这里 —— 它在 task 配置里，用点路径覆盖即可扫参：
#   task.c_ring.gap_deg=30            （开口变窄，预期 gateway 也过不去）
#   task.c_ring.tab.length=0.010      （凸台变短，预期 hold 阶段开口向管身漂移）
#   task.fixed_ring.segment_deg=15    （分段变粗，预期弦近似误差从 0.11mm 升到 0.26mm）
#   task.stand.hang_yaw_deg=180       （C 环改挂在别的环缘，几何判据不变，只改观感与取景）
# 改了几何先跑 `python tests/check_c_ring_clearance.py`，它不需要 GPU。

defaults:
  - default
  - _self_

# 只建场景、不沉降不静置。两条各三十多段的圆柱链互相穿过，正是最容易在生成时就互嵌的
# 形状；这一档让互嵌在第一次沉降把它掩盖之前就暴露出来。
static_only: false
# static_only 时只走这么多步，让录像器有帧可写（变体 sweep 的 visual 组用）。
final_hold_steps: 20

# --- 变体（2026-09-03）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）。默认关 = 确定性布局。
randomize_layout: false
difficulty: envelope
variant_id: default

# 机械臂回 home 的沉降步数。C 环同时从 spawn_drop 落到管身上。
settle_steps: 100

# 沉降后静置多少步、每隔多少步取一次读数。**本 demo 的关键判据在这一段**：
# 全程无人接触，C 环若自行脱开，任务就是自解的。dt 由 env 预设给（tabletop V1 = 0.01s），
# 600 步 = 6 秒，是凸台不起作用时环转过 90° 所需时间（约 0.35 秒）的十几倍。
hold_steps: 600
hold_sample_every: 25
