# tests/pleat_settle_spike.py 的运行模式参数。
#
# 布带的几何、材料与判据参数不在这里 —— 它们在 task 配置
# （cloth_unpleat）的 cloth / success 块，用点路径覆盖即可扫参：
#   task.cloth.pleat.crest_height=0.040
#   task.cloth.particle_size=0.006
#   task.cloth.mesh.spacing=0.010

defaults:
  - default
  - _self_

# 静置多少步（dt=0.01，所以 400 步 = 4 秒）。
# 褶皱塌陷或弹开都是慢过程，比布落到桌面慢得多，所以取值明显大于 cloth_fold
# 的 settle（120 步）—— 那一项只需要布落定。
settle_steps: 400

# 每隔多少步打印一行采样。曲线的形状本身是诊断：一路单调下降是塌陷，
# 前几十步掉一点然后稳住是正常的松弛。
sample_every: 25

# 建不建机械臂。默认不建：这一项没有任何东西碰布，不建能省下建场时间。
# 要看褶皱与手臂的相对高度时置 true。
include_robot: false

# ------------------------------------------------------------------ 判据
# 「褶皱还立着吗」的两条线。两个方向是不同的失败，修法也不同，所以分开判：
#   crest_keep_min : 静置后顶缘高度 ÷ 建模高度，低于它算塌陷。
#                    与 demo 的 `task.grasp.min_crest_kept` 取同一个值，理由写在
#                    那边：三层压平是 3 倍布厚 = 0.012 m，占建模高度 0.030 的 0.40，
#                    所以 0.50 在「已经塌成三层」之上。
#                    **顶缘下沉本身不是问题** —— 沉下去的褶皱仍然是三层、
#                    仍然收着那些材料，demo 会在静置后重新找顶缘（layout.observe）
#                    并从它实际所在的位置起弧。这条线管的是「还算不算一个褶皱」。
#   span_grow_max  : 静置后俯视跨度 ÷ 建模跨度，高于它算自己弹开。
#                    1.15 允许布落定时的自然松弛，不允许褶皱放料。
#                    弹开意味着 PBD 的弯曲约束把平面当静止角，调参解决不了，
#                    要改成「先物理压出褶皱再开始 episode」。
crest_keep_min: 0.50
span_grow_max: 1.15
