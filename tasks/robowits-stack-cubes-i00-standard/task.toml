schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/journal.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/server.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robowits-stack-cubes-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): RoboWits stack_cubes on the same frozen instance as the privileged task (evaluation scene 0 of task 14). Build a stable two-layer stack so the red cube's center is above the green colored dot. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robowits", "genesis", "marvin-bimanual", "dual-arm", "standard-mode", "trajectory", "stack_cubes"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "robowits"
robot = "marvin-bimanual"
family = "stack_cubes"
mode = "standard"                  # RGB + proprioception only; no object poses, no reset
protocol = "eai-standard/2.2"
oracle = "partial"
oracle_evidence = "Reference solution solution/oracle_replay.py, which streams the privileged oracle's recorded joint rows (solution/oracle_qpos.npy) through the client. It scored 1 under Harbor -a oracle on the dev/qineng 9eb18edf version of this task (protocol 2.2, then named rcb-limited): job v22-laptop-oracle-stack-cubes-0413, trial robowits-stack-cubes-i00-limited__Yw2oaio, 2026-09-29 (laptop, Intel; success=1, live 1, replay 1, deterministic 1). Same since then: the frozen instance (state hash 41c4d7e7d7193b0d), the joint rows (equal to that run's recorded trajectory) and the tooling rcb_robowits.py. Changed since then, so the label is partial: the grader (this PR: the crash-recovery fields and infra_error), the sim adapter server.py and the shared layer rcb_limited.py / rcb_client.py (this PR: crash recovery), the collect hook, the client image and pins, and the oracle player (this PR: it recovers from a crash). Not re-run on this version (static validation only, 2026-10-01)."
instance_seed = 0
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
# end the episode (SIGUSR1 to the live service, through a crash resume if one is under way), wait for the in-process
# grade and the video (final.json video_done), then hand over the record (docs/STANDARD_MODE_2_2.md §13.3)
command = "python3 /srv/rcb_limited.py end /data --wait-key video_done --timeout 2280; cat /data/final.json"
timeout_sec = 2400                # service up (a resume replays the journal first), the grading replay, then the video

[agent]
timeout_sec = 5400.0             # RoboWits budget: 1.5 h of wall clock (docs/benchmarks/robowits.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
