services:
  main:
    depends_on:
    - sim
    labels:
      topogym.difficulty-run: keyhole-harbor-20261002
  sim:
    image: topogym-local/cast-keyhole-oracle:20261002-02
    volumes:
    - ./sim:/srv:ro
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_TASK: cast_keyhole
      RCB_INSTANCE: /srv/instance.json
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: '21600'
      RCB_STARTUP_TIMEOUT_S: '1800'
      PYTHONPATH: /srv:/opt/topogym
      RCB_SESSION_LOG: ''
      NVIDIA_DRIVER_CAPABILITIES: all
    runtime: nvidia
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    labels:
      topogym.difficulty-run: keyhole-harbor-20261002
