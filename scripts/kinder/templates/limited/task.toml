# Limited-mode twin of {{twin_dir}}. Generated from scripts/kinder/templates/limited/task.toml -- edit subset.toml or
# the template, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{task_dir}}"
description = "LIMITED MODE (robot as a service, rcb-limited/1.1): KinDER {{env_name}} on the same frozen instance as {{twin_dir}}. The agent only gets a client: observe (the robot's {{sensors_plus}}), step (one action or a batch). No reset by default, no privileged state, no goal check; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", {{keywords}}, "physical-reasoning", "limited-mode", "trajectory", "{{family}}"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "{{robot_id}}"
family = "{{family}}"
tier = "perception"                # robot-{{sensors_plus}}; no object pose, no goal check
mode = "limited"
protocol = "rcb-limited/1.1"
instance_seed = {{seed}}
expert_time_estimate_hours = {{limited_expert_hours}}

[verifier]
timeout_sec = {{verifier_timeout}}
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 280); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; sleep 2; done; cat /data/final.json"
timeout_sec = 750                  # both waits: 90 x 2 s for the service, 280 x 2 s for the finalize

[agent]
timeout_sec = {{agent_timeout}}
# The agent container holds no simulator, but upstream is public: the agent reaches the model APIs and nothing else
# (subset.toml agent_allowed_hosts).
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
