# Linkbar Rotate To Zone（docx 4.4 改造版）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 场景：一根固定立柱上铰接一条连接梁，梁只能绕竖直轴转，梁端的销在一个水平圆上走。
# 圆上画一段固定长度的虚线导轨，导轨上任意位置放两条互不重叠的色条（可同侧、可相邻），
# 一红一蓝。每条色条标出一个扇形区域。机械臂转梁上的手柄，把销停进指令说的那种颜色
# 的色条所标出的扇形里即成功。
#
# 2026-09-01 改版：此前两区被要求分居初始角两侧、各在 [15°, 75°] 扫掠带内，十个变体画面
# 几乎一样（linkbar_rotate_to_zone_zh.md §8.2）。改为固定导轨 + 自由两区后，区键名从
# left/right 改为 color_1/color_2（不再有方位含义；随机化后 color_1 是导轨上角度较小的那块）。
#
# 2026-08-27 改造前，本任务是「把销扣进两个同款插口之一，接对的那个把导轨小车锁住」，
# 成功判据为推小车不动。review 意见：小车静止在视频里辨识度低。改为颜色区域后，成功
# 与失败在单帧画面上就能分辨：销停在同色区里，或者停在异色区／区外。
# 旧判据与旧场景（小车、导轨、插口、weld 闩、行程测试）已整体删除，记录见
# docs/develop/tasks/linkbar_rotate_to_zone_zh.md。
#
# 派生量不写在这里，由 LinkbarRotateLayout 从下面几个数算出来：
#   zone_center(θ)  = pivot + arm_radius · (cos θ, sin θ)     区域中心（销的落点）
#   in_zone(angle)  = |wrap(angle − θ)| ≤ half_width_deg       只看角度，与半径无关
# 区域是这个角窗口划出的整个扇形；桌面上的色条只是把它标出来（见 zones.half_width_deg）。
#
# 高度：立柱 0–0.078，转轴间隙 0.002，梁底 0.095，销 0.052–0.095，手柄 0.125–0.165。
# 这些数在旧版本里经过夹持与净空的实测（见 linkbar 段各注释），本次不动。

# 配色：桌面浅灰 0.78-0.82；固定立柱 0.50；梁 0.42-0.52 蓝灰；转轴 0.55；手柄炭黑 0.12。
# **连接梁上一处标识色都没有（2026-09-09 起）**：销、销的套环、手柄盖三处与转轴同灰，
# 整根梁只有「灰／蓝灰／炭黑」三种中性色，没有任何一块鲜艳的、看得出是特意涂上去的颜色。
# 鲜艳色只出现在桌面的两块区域上（zones.colors，红与蓝），两色与桌面浅灰、梁的蓝灰都拉得开。

task:
  id: linkbar_rotate_to_zone
  difficulty: smoke

coordinate_frame: task

# ---------------------------------------------------------------- 枢轴
# 整套几何的原点。
#
# x 取 +0.020 是被实测逼出来的，不是随手选的。停在共用 home 位姿的手部实测在
# task 帧 (+0.043, −0.000, +0.267)，指尖悬在手柄的高度带里。枢轴原为 −0.020 时，
# 手部相对枢轴的半径是 0.063，而手柄圆是 0.100——张开的夹爪正好横跨手柄圆，
# 连接梁扫回初始角附近时会撞上它（2026-08-20 实测：四段扫掠里有三段顶在机械臂上，
# 接触力约 20N，梁停在 +8.34° 再也过不去）。
#
# 挪到 +0.020 之后手部相对枢轴的半径是 0.023，落在轮毂（半径 0.030、顶面 0.097）
# 正上方，指尖高度还剩约 50mm 余量；手柄圆与指尖的水平净空从 26mm 增到 43mm。
#
# 不改共用 home（`shared home parity`：那是 RoboMME 的锚点）。若将来仍需让开，
# 按 stacked_plate 的先例配一份任务专属的抬高 home，而不是动 common 里的 qpos。
pivot:
  x: 0.020
  y: 0.0

# ---------------------------------------------------------------- 连接梁
linkbar:
  # 销走的圆半径。也是两块区域的半径——「同在旋转圆上」在这里是一个数。
  arm_radius: 0.170
  # 初始角。0° = 梁指向 +x（远离机械臂、朝 front 相机）。必须在导轨内，且销不在任一区里。
  # 随机化时不直接抽它：先抽两区，再由 init_frac 在 init_span_deg 扣掉两区禁区
  # （half_width + pin_start_margin）后剩下的区间并集上按长度比例定位
  # （LinkbarRotateLayout.init_angle_from_frac），构造式保证销不在区里。2026-09-02 起；
  # 此前直接在 ±15° 里均匀抽、撞区即重抽，首抽拒绝率 0.234。
  init_angle_deg: 0.0
  # 初始角的抽样跨度（度）。梁停在机械臂正前方附近，两区才都可能在任一侧。
  init_span_deg: [-15.0, 15.0]
  # 初始角在允许集合上的归一化位置，[0, 1]；只在随机化时被写入，默认值对应 init_angle_deg=0。
  init_frac: 0.5

  beam:
    bottom_z: 0.095
    height: 0.020
    width: 0.026
    color: [0.42, 0.46, 0.52]

  pin:
    radius: 0.010
    # 销底距桌面 52mm。销不碰任何东西，色块是纯视觉的（collision=false）；这个高度
    # 保留旧值是为了不动梁的质心与夹持实测。
    bottom_z: 0.052
    collar_radius: 0.015
    collar_height: 0.008
    # 销、套环、手柄盖没有自己的颜色叶子：三处都用下面 axle.color 的转轴灰
    # （LinkbarRotateSceneBuilder._add_linkbar）。
    #
    # 2026-09-08 之前销取目标区的颜色，「转到和销同色的那一块」就是正解——一次低层次的颜色
    # 配对，不需要读懂任务。09-08 改成第三种颜色堵掉了它，但梁上仍留着一块鲜艳的标识色，
    # 是画面里最扎眼的东西，策略容易学成「盯着梁上那个彩色小零件」。2026-09-09 起梁上不留
    # 任何标识色：目标是哪一块只能由指令说（goal.instruction 填目标区的颜色名），
    # 不读语言的基线走 goal.goal_id_fn → 数据集里的 obs/goal_id。

  axle:
    radius: 0.018
    # 转轴伸出梁顶多少。露出一截才看得出「梁绕它转」。
    rise: 0.010
    # 转轴底面与固定立柱顶面之间的轴承间隙。**不能为 0，更不能让转轴一路伸到桌面**：
    # 立柱已经在那里，同轴两根实心圆柱在立柱整个高度上互相穿透，等于在固定件与唯一
    # 需要自由转动的件之间做了一圈永久接触。2026-08-20 实测（转轴从 z=0 起）：伺服
    # 驱动的扫掠最多欠转 22°。
    clearance: 0.002
    color: [0.55, 0.56, 0.58]

  hub:
    radius: 0.030
    height: 0.024

  knob:
    # 手柄所在半径。取 0.100 < arm_radius：手柄在销的内侧。
    station: 0.100
    boss_radius: 0.016
    boss_height: 0.010
    # 圆柱手柄而不是方柱：方柱的对角线比端面宽，转动时会把指腹撑开（4.3 实测结论）。
    # 0.040：手柄越高，夹爪横移到它正上方时要抬得越高，手柄已在距 Franka 底座 0.690m
    # 处，抬高会吃可达余量。指腹约 14mm 高，40mm 的柱面够夹。
    radius: 0.011
    height: 0.040
    cap_radius: 0.014
    cap_height: 0.006
    # 指腹在手柄上的高度（自手柄底面起）。手柄 0.125–0.165，取中偏下。
    grasp_height: 0.025
    color: [0.12, 0.13, 0.15]

  mechanism:
    joint_name: linkbar_joint
    mass: 0.450
    # friction 是**驻车阻力**，取 0.10 N·m 有实测理由，而且本版本判据直接依赖它：
    # 松手后梁要靠它停在区域里。
    #
    # 2026-08-21 曾把它从 0.030 降到 0.015，用意是减小扫掠阻力以解打滑。那一刀是多砍
    # 的：真正解打滑的是夹持力（grasp_qpos 0.006→0.001，能力 0.23→0.48 N·m）。而摩擦
    # 正是让一个竖直自由铰链停在原地的东西——竖直轴上重力不产生力矩，但梁的质心偏出轴
    # 85mm，重力的反作用由关节约束承担，求解器残差会漏一点进自由方向。摩擦减半之后压
    # 不住，梁在 home 沉降的 40 步里自行转动，夹爪合到空处（2026-08-22 复现）。
    #
    # 0.10 不影响扫掠：阻力矩 = 0.04 × 0.63 rad/s + 0.10 ≈ 0.125 N·m，对 0.48 N·m 的
    # 夹持能力仍有 3.8 倍余量。
    joint_damping: 0.040
    joint_friction: 0.100
    joint_armature: 0.010
    contact_friction: 1.000
    # 关节**不设限位**。圆上有两块区域，限位只能描述其中一块。

# ---------------------------------------------------------------- 固定立柱
# 梁转在它上面。转轴从它上方穿出，于是关节的「固定半边」与「转动半边」在画面里是
# 分开的两件东西。顶面 0.078：轮毂底（0.093）下余 15mm。
pivot_column:
  radius: 0.026
  height: 0.078
  color: [0.50, 0.51, 0.53]

# ---------------------------------------------------------------- 颜色区域
# 防捷径的随机化轴有三条，逐 episode 覆盖即可：
#   target                   哪块区域是目标（它涂的颜色就是指令里的那个词）
#   color_1/color_2.angle    两块区域在导轨上的角位置（任意，可同侧、可相邻，不重叠）
#   assignment               哪块区域红、哪块区域蓝
# 目标只在指令（与 obs/goal_id）里，画面里没有任何东西指认它。
# **红蓝分配必须留着随机**：随机化之后 color_1 永远是导轨上角度较小的那块（front 相机里
# 偏左那块），红要是永远给 color_1，指令里的「red」就等价于「画面偏左那块」，策略不看色块
# 也能解。对换之后「目标在左还是在右」与「目标是红还是蓝」各占一半、互相独立，两件都得读。
# 于是「转向最近的区」「不读指令永远转向红块」「总是转同一个方向」三条都被钉在随机水平。
# 键名 color_1 / color_2 只是两个标签，本身没有方位含义。
zones:
  color_1:
    angle_deg: -45.0
  color_2:
    angle_deg: 55.0
  # 调色板。判据不看名字，看 target 指向的那块区域；名字是指令里说的那个词。
  # 2026-09-09 起只有红、蓝两色（此前是六色，随机化时抽三种：两区各一种、销一种）。
  # 任务要读的信息只有「两块里哪一块」，多出来的四种颜色不增加这件事的难度，只增加画面方差。
  # 随机化时从这里不放回地抽两种给两块区域，即红蓝对换，共 2 组有序对。
  #
  # **键的书写顺序就是 obs/goal_id 的编号顺序：red=0、blue=1**
  # （LinkbarRotateLayout.goal_id 直接读这个顺序，不另存一张映射表）。调换这两行会改变
  # 已录数据集里 goal_id 的含义。
  colors:
    red: [0.85, 0.15, 0.15]
    blue: [0.15, 0.45, 0.85]
  assignment:
    color_1: red
    color_2: blue
  target: color_2
  # 区域的角半宽。**区域是一整个扇形**：销中心与区中心的角差 ≤ 它即在区内，与半径无关
  # （销焊在梁上，半径恒为 arm_radius，半径不是自由度）。桌面上那条色条不是区域的边界，
  # 它只是把这个扇形**标出来**给人看，指令里也是这么说的（"the sector marked by the
  # red band"）。8° 在半径 0.170 上是 23.7 mm 的弧长，销直径 20 mm。
  #
  # 2026-09-10 从 8° 放宽到 12°（弧长 47.5 → 71.2 mm）。两条理由：色条要看着像扇形的外周
  # 而不是方块，弧得够长；而 12° 是**不破首抽拒绝率 2% 门的最宽**——销的出生禁区跟着半宽
  # 走（half + pin_start_margin），初始角只有 ±15° 可抽，区一落到 0° 附近就把可用区间吃光，
  # 实测 1000 seed 拒绝率：±8° 0.002、±10° 0.005、±12° 0.010、±14° 0.036（超门）、±16° 0.075。
  # 代价是任务变容易一档：成功窗口 16° → 24°，oracle 实测到位误差 2.27° 从占窗口 28% 降到 19%。
  half_width_deg: 12.0
  # 色条横跨圆周的宽度（径向）。18 mm 配 71.2 mm 的弧长是 4:1，看上去是一条弧带
  # （扇形的外周），不是方块。
  #
  # 它**不需要比销宽**：区域是扇形、色条只是标记，销悬在桌面上方 52 mm，斜机位下销与色条
  # 本来就因视差不重合，要读的是「梁指不指着这条色条」。2026-09-10 之前这个数是 40 mm
  # （= 销直径两倍），那是按「销要压在色条上、两侧各露一截」设计的，配 47.5 mm 的弧长
  # 是 1.2:1，画出来像方块。更早还因为尺寸装反只画出 7.2 mm（见 _add_zones 注释）。
  radial_width: 0.018
  # 一条色条用几段直盒拼。10 段各 2.4°，弦与弧的偏差 <0.1mm；
  # 直盒子在弧两端各凸出 0.16°（半径 0.170 上是 0.47 mm），所以画出来是 ±12.16°。
  segments: 10
  thickness: 0.0010
  z_offset: 0.0006
  # 销出生时不得在任一区里：初始角与每个区中心的角差 ≥ half_width + 这个余量。
  # 每个 episode 都必须真的转一次。其余布局规则（区整体在导轨内、两区不重叠、两区不同色）
  # 见 LinkbarRotateLayout.validate，违反直接报错。
  pin_start_margin_deg: 2.0

# ---------------------------------------------------------------- 虚线导轨
# 销的圆上一段固定跨度的虚线。两块区域都放在它上面，它是「两块区域是同一次转动能到的
# 地方」的可读证据；跨度固定，不随两区位置变。±90°：与已实测过的绝对范围一致（seed 6
# 区中心 +84° oracle 通过）；再往后梁指向机械臂一侧，停放的手臂会进入手柄圆。
# 纯视觉，无碰撞。落在区跨度内的格不画，色块盖在那段上。
rail:
  enabled: true
  start_deg: -90.0
  end_deg: 90.0
  # 36 格 / 180° = 5° 一格，与改版前 16 格 / 80° 的疏密相同。
  segments: 36
  tick_size: [0.012, 0.004, 0.0010]
  z_offset: 0.0006
  color: [0.46, 0.47, 0.49]

# ---------------------------------------------------------------- 指令
# **2026-09-08 起指令是承重的**：梁上没有任何东西指认目标，目标是哪一块画面里读不出来，
# 只有这句话说得清。所以它随 seed 变（填的是目标区的颜色名）。
# 模板 + instruction_fn 而不是派生写回叶子：派生只能写标量、无空格的叶子，
# 句子带空格会被角点 sweep 的 Hydra 覆盖按空格切词（ring_transfer 教训）。
#
# goal_id_fn 是同一件事的数字版，给没有语言输入的强化学习基线用（2026-09-09 加）：
# 返回目标区颜色在 zones.colors 键序里的下标（red=0、blue=1），录进数据集的
# setup.attrs["goal_id"] 与每帧的 obs/goal_id。给的是**颜色编号而不是区编号**——给区编号
# 等于直接告诉策略往左转还是往右转，画面可以完全不看，那和把颜色涂在销上是同一类捷径。
goal:
  # 句子说的是「色条划出的那个扇形」，不是「压在色条上」：区域是扇形，色条只是标记
  # （2026-09-10 改的措辞，配合色条画法修正）。
  instruction: "Turn the bar so its pin comes to rest inside the sector marked by the {target_colour} band."
  instruction_fn: "topogym.tasks_legacy.connectivity.linkbar_rotate_to_zone:render_instruction"
  goal_id_fn: "topogym.tasks_legacy.connectivity.linkbar_rotate_to_zone:render_goal_id"

# ---------------------------------------------------------------- 判据
success:
  # 松手后先沉降多少步再读。梁靠关节摩擦停住，这段时间给它把残余转动耗掉。
  settle_steps: 30
  # 读数时关节角速度上限（rad/s）。超过它说明梁还在动，本步的位置不算数。
  max_angular_speed: 0.05

# ---------------------------------------------------------------- 原语参数
# 全部是 hand link 在 task 帧的 z（指腹在其下方 HAND_TO_PAD_Z=0.1029 处）。
#
# 时长：本次 review 要求尽量短。已去掉行程测试（180 步）；下面的 hold/settle 也按
# 「看得清」而不是「看很久」取值。
motion:
  # 接近／退刀高度。0.315 是被实测逼出来的：手柄加盖顶到 0.171，原值 0.300 对应的
  # 指腹在 0.197，指尖净空只剩约 6mm，横移最后一段贴着盖子过去，把梁推歪（2026-08-22）。
  # 现值指腹在 0.212，对盖顶余 41mm。
  approach_z: 0.315
  retreat_z: 0.315
  steps_per_phase: 80
  # 扫掠步数不固定，按扫掠角推导（LinkbarRotateLayout.steps_arc）：
  #   steps = max(min_steps_arc, ceil(|sweep| / arc_deg_per_step))
  # 固定的是角速度。0.23°/步 = 55°/240 步，即 2026-08-27 验收时的速度（max_lag 2.8°，门 6°）。
  # 2026-09-01 变体 sweep 里步数固定 240 时 max_lag 随扫掠角线性增长（约 0.05°/°，88° 到
  # 4.79°），包络最大 105° 会贴门；来源是手的 IK 追踪滞后与关节阻尼，都与角速度成正比，
  # 不是打滑（finger_qpos 全 0.0105）。恒定角速度后各扫掠角的 lag 回到同一水平。
  # （那时的 max_lag 按旧定义含跟踪滞后，见 max_lag_deg 注释；恒定角速度本身仍然成立：
  # 角速度决定跟踪滞后与终角过冲。）

  # min_steps_arc 120：小扫掠（15° 只需 65 步）留两倍余量，避免余弦缓动太短显得一顿。
  arc_deg_per_step: 0.23
  min_steps_arc: 120
  gripper_steps: 50
  close_hold_steps: 35
  arc_settle_steps: 30
  release_hold_steps: 30
  # 手柄半径 0.011，指腹被手柄顶在 0.0107 处停住。夹持力 = 指刚度(100) × 过行程，
  # 所以指令值越小夹得越紧。2026-08-21 由 0.006 改到 0.001：0.006 实测打滑 5.03°。
  grasp_qpos: 0.001
  finger_links: [left_finger, right_finger]
  finger_friction: 3.000
  knob_friction: 2.000
  # 到位角容差。2026-09-10 半宽从 8° 放宽到 12° 之后**这一项不跟着放宽**：4° 原本是半宽的
  # 一半，现在是三分之一，等于对机械臂的要求比以前严一点。放宽判据是为了画面，不是为了
  # 给执行让路。
  target_tolerance_deg: 4.0
  max_follow_error: 0.040
  # 扫掠过程中关节允许落后手部实际角多少。区分「夹着转」与「推着走」。
  # 2026-09-02 起原语比的是关节角与手部实际位置对枢轴的角度；之前比的是指令角，
  # 读数含手的跟踪滞后（本任务半径 100mm、0.23°/步，只折合 2–3°，没触门，但 §8.4 的
  # 「lag 随扫掠角增长」就是这部分）。旧读数与新读数不可比。
  max_lag_deg: 6.0

  max_release_drift_deg: 5.0
  # 合爪停位低于它即判为「合在空处」。
  min_finger_qpos: 0.004

physical:
  settle_steps: 40

mdp:
  max_episode_steps: 60
  reward:
    success: 10.0
    wrong_zone_penalty: 1.0
    action: 0.01

# ---------------------------------------------------------------- 变体轴
# 每 episode 按 seed 改写下列叶子（generation/layout_randomization.py 读这里；没有 python
# 注册表）。kind 与参数见该模块 docstring。边界与上面保持一致：两区中心 ∈
# [rail.start + half_width, rail.end − half_width] = [−78, 78]，中心角距 ≥ 2·half_width = 24。
# （2026-09-10 半宽 8° → 12°，这两个数跟着从 ±82 / 16 改成 ±78 / 24。）
# 随机流名字 = "<task_id>/<path>"（spaced_pair 为 "<path0>&<path1>"，distinct_choice 为
# keys_of），改路径名会改变 seed → 变体的映射。
variation:
  # 防捷径：哪块区是目标（它涂的颜色就是指令里的那个词，也是 obs/goal_id 的取值）
  - {kind: choice, path: zones.target, values: [color_1, color_2]}
  # 防捷径：红蓝给哪一块（不放回地抽两种，即两色对换，2 组有序对）。
  # 与 zones.target 是两条独立的轴：目标在左／在右各一半，目标是红／是蓝也各一半。
  - {kind: distinct_choice, paths: [zones.assignment.color_1, zones.assignment.color_2], keys_of: zones.colors}
  # 布局：两区在导轨上的中心角；color_1 取小的；相邻允许
  - {kind: spaced_pair, paths: [zones.color_1.angle_deg, zones.color_2.angle_deg], lo: -78.0, hi: 78.0, min_gap: 24.0}
  # 布局：横梁初始角在「init_span_deg 扣掉两区禁区」上的归一化位置
  - {kind: uniform, path: linkbar.init_frac, lo: 0.0, hi: 1.0}
  # 派生：init_frac -> linkbar.init_angle_deg（构造式保证销不在区里；并集为空则拒绝）
  - {kind: derived, fn: "topogym.tasks_legacy.connectivity.linkbar_rotate_to_zone:derive_task_cfg"}
  # 校验：区在导轨内、两色不同、销不在区内（兜底）……不过则整体重抽（LinkbarRotateLayout.validate）
  - {kind: validate, fn: "topogym.tasks_legacy.connectivity.linkbar_rotate_to_zone:validate_task_cfg"}

