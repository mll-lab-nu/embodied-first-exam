[self_collision]                       # real limits B0 (screening 2026-10-10, revision 12/10): the arm and paddle cannot
body = "franka_panda"                  # pass through the robot's own links or its column / carriage on the rail base;
                                       # bodies/franka_panda/body.toml [self_collision]; the pairs in the scenes below are
                                       # generated (python3 -m bodies.selfcollision scene sports/tabletennis), CI S4 compares
[[self_collision.scenes]]
