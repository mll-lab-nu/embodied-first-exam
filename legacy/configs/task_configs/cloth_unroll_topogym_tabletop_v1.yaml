# Cloth Unroll（docx 1.3「展开自身卷曲的布带」）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点。
#
# 与 cloth_unpleat（docx 1.2）的关系：**材料、抓取护栏、动作收敛三块的取值直接沿用**，
# 推导过程写在 `configs/task_configs/cloth_unpleat_topogym_tabletop_v1.yaml`，
# 本文件只写与 1.3 有关的部分。
#
# 场景：布带一端绕在一根水平横梁上（两圈），横梁架在两根立柱之间，像公共卫生间的抽纸器。
# 布从卷筒 +y 侧切向离开、垂到桌面、平铺出一段。
# 动作：夹爪抓平铺段的自由端，贴着桌面沿 +y 直线拉；旋转全部由卷筒绕梁吸收，手腕不转。
# 行程 195mm，一次连续拉完（2026-08-24 改；此前分三段，见 physical.stroke_m）。
# 行程不等于卷料（161mm）：垂落段也要铺平，见 physical.pull_scale 下面那段。
# 状态变化：自接触消失、层数多 → 1、铺展长度恢复到材料全长。

task:
  id: cloth_unroll
  difficulty: smoke

coordinate_frame: task

board:
  name: cloth_unroll_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# ---------------------------------------------------------------------- 夹具
# 两根立柱 + 一根水平横梁。**横梁是这个任务的锚**：它让拉动变成放卷而不是整条被拖走，
# 也给最内圈提供支撑。立柱除了架梁还有一个作用 —— 布带内端是自由的，卷筒能沿梁轴滑，
# 两根柱子把它挡住。
#
# 用朴素圆柱而不是 `world/rope.py` 的喇叭底座 `routing_post_mesh`：那个形状是为了消掉
# 「柱底×桌面 90° 楔角」把贴桌拖拽的绳弹射出去，而这里没有任何东西沿着立柱拖。
dispenser:
  name: cloth_unroll_dispenser
  # 横梁半径。**尽量小**：两圈的卷料长度 ≈ 4π×平均半径，而平均半径的下限被
  # 「梁面到最内圈要留够一个粒子」顶住，所以梁越粗行程越长、越难一次拉完。
  # 0.004（φ8）是还能当刚体圆柱建的细杆。当前取值下卷料 161mm。
  bar_radius: 0.004
  # 横梁中心离桌面多高。要满足两条：
  #   卷筒外径 35mm，半径 17.5mm，所以必须 > 0.0175 否则卷筒压在桌上；
  #   垂落段 = 这个值 − 布的静止高度 = 43mm，够布从梁侧垂到桌面。
  bar_height: 0.045
  # 横梁长度 = 两柱间距。布宽 120mm，两侧各留 10mm。
  span: 0.140
  post_radius: 0.006
  # 立柱高。要高过横梁中心 + 卷筒半径，否则卷筒顶出柱头。
  # 0.075 → 0.090（2026-09-05，变体）：杆高轴上端 0.053 + 最粗的卷（1.25 圈 × 层距 0.018，
  # 半径 0.031）= 0.084 会高过 0.075。手指沿 x 只在中心 ±4 mm 处、立柱在 ±70 mm，
  # 实测 57 mm 的停止距离撞的是横梁不是立柱，所以加高不引入新接触（未经 GPU 实测）。
  post_height: 0.090
  color: [0.55, 0.57, 0.60]
  bar_color: [0.72, 0.74, 0.77]
  # 辊（铰链实体）的质量。辊由环境按放出的布长转动，质量只进惯量张量，不影响运动。
  bar_mass: 0.02

# ---------------------------------------------------------------------- 布带
cloth:
  name: unroll_band
  # 材料全长与带宽。0.260 与 1.1／1.2 相同，便于三个任务的读数并排比。
  # 0.28。加大层距后螺旋多吃约 20mm 材料，平铺段随之变短，shove 的可用余量被压成
  # 负数（夹爪起点距梁心 55.4mm < 夹爪自身 57mm 净空）。补回 20mm 把平铺段还原。
  material_length: 0.280
  width: 0.120
  # 横梁轴的位置（任务坐标系）。布沿 +y 抽出去。
  #
  # **手的终点只由三个量决定，卷筒几何一个都不进：**
  #     末位 = center_y + inner_s + material_length − edge_inset
  #          = -0.080 + 0.0085 + 0.260 − 0.012 = +0.1765
  # 圈数、层距、梁高全部抵消 —— 绕得紧只是让端头的**起点**更靠外。够不着的时候
  # 能动的只有这三个（`tests/check_cloth_unroll_geometry.py` 钉住了这条恒等式）。
  #
  # 起始：卷起时布带跨 y[-0.098, -0.010]，抓取点在 y=-0.019（2026-08-24 实测抓到，
  # attach_error 0.16mm）。末位 y=+0.1765 **比 1.2 实测送到的 +0.152 远 24.5mm，
  # 尚未实测**，跑一次看 arm_pos_err_mm 与末态跨度。
  #
  # 真的够不着的话，三个旋钮里只有 center_y 可动而不破坏别的：往回挪要看抓取点
  # （y 更负）还抓不抓得到，那一侧同样没实测过；缩短 material_length 会同时吃掉平铺段
  # （平铺段 = 全长 − 卷料 − 垂落），而平铺段短于 38mm 时附着盘就够到垂落段了。
  # 夹具后移 20mm，与上面补的 20mm 材料相抵，末位不变，可达余量不受影响。
  #
  # 2026-09-05 拆成两个标量键（随机化只写标量叶子）。center_x：支架朝 / 离机械臂平移；
  # center_y：支架沿拉动方向平移，变体时由 center_y_frac 在可达盘与工作区封顶的窗口里派生
  # （`_cloth_unroll_geometry.center_along_bounds`），固定布局走这里的值。
  center_x: 0.040
  center_y: -0.100
  center_y_frac: 0.5
  material_axis: y
  # +1：布从卷的 +y 侧离开、向 +y 拖（上面的画面）。−1 = 镜像布局：支架在 y = +0.100，
  # 布从 −y 侧离开、向 −y 拖。底座在 y = 0、工作区关于 y = 0 对称，两侧判据逐行相等。
  # 藏起来的信息是「往哪边拖」：固定向 +y 拖的策略在 −1 的实例失败。只有变体块改它。
  pull_side: 1
  # 铺放高度 = 一个粒子半径，也就是静止时粒子中心该在的高度。
  #
  # 2026-08-24 试过在这里垫一块 4mm 的不可见刚体把布抬起来（让穿透发生在看不见的
  # 地方），按用户要求撤掉了。撤掉的理由不只是偏好：薄板会被隧穿（粒子进去过半就
  # 离下表面更近，被从下面推出去），埋厚之后布浮空又更明显，而下沉本身一点没修好。
  # 下沉发生在哪儿目前还没量过，`ClothFoldWatch` 现在会报 `lowest_at` 与
  # `worst_below_count`，先拿数据再决定。
  z: 0.002

  # ------------------------------------------------------------------ 卷筒
  # 螺旋剖面由 `cloth_profile_mesh.spiral_profile` 生成：顺时针缠绕两圈，
  # 在卷筒 +y 侧切向离开，垂到桌面，再平铺出一段。
  # 离开点的解析切线几乎竖直；折线上最后一段弦偏离竖直 14.6°（实测 (+0.252,-0.968)），
  # 差别来自离散化 —— 17.5mm 半径上 7.5mm 的弦张 24.7°，弦方向就差半个张角。
  # 布拿到的是弦不是解析切线，所以记的是后者。
  #
  # 从侧面离开而不是底部：螺旋在最外点的切线垂直于该处半径，所以侧面离开是自然垂下，
  # 底部离开则要在卷筒高度上先水平出去再折向桌面，多一道折痕。真实抽纸器也是侧面出纸。
  roll:
    # 1.5 圈 / 14mm 层距：层距是实测粒子间距 3.7mm 的 3.8 倍，脱离 vis_mode="visual"
  # 绑定映射的混淆区（4.5mm 时比值仅 1.22，视觉网格被扯开）。2026-08-25 抽帧确认
  # 画面干净：布带连续满幅、无孔洞。松卷静置只略散不散架，见 max_start_spread_ratio。
  # 圈数受【行程】封顶，不受材料长度封顶：卷上去多少料，夹爪就
    # 得走多少 mm，而单次抓取只有约 200mm（抓取点 -0.019 到实测可达 +0.181）。
    # 螺旋长度按圈数平方增长（半径每圈涨一个 pitch），11mm 层距下 2.0 圈就要 246mm。
    # 更多圈要靠多次抓取，不是靠加长布料。
    turns: 1.5
    # 层距。**≥ particle_size (0.004)**，否则层与层出生时靠得比一个粒子近，
    # PBD 第一步就在解碰撞而不是静置（1.2 的实测教训）。
    #
    # 2026-08-24 从 0.005 收到 0.0045：0.005 卷出来画面上偏松。余量因此从 1.0mm
    # 减到 0.5mm，**这是本文件里离约束最近的一个取值**。再收到 0.0042 只剩 0.2mm，
    # 不取。收紧的连带影响：外径 38→35mm、卷料 174→161mm、平铺段 43→56mm。
    #
    # 这一项归 `tests/roll_settle_spike.py` 管：`spawn` 那行 max_speed 不为 0 或
    # lowest_mm 为负，就是出生互穿，退回 0.005。
    # 14mm = 实测粒子间距 3.7mm 的 3.8 倍。层距必须远大于粒子间距，否则
    # vis_mode="visual" 的绑定映射分不清「本圈的邻居」和「隔壁那一圈」，展开时
    # 错绑的顶点被拽向别处，视觉网格被扯开——2026-08-25 那个「布被撕开」的现象。
    # 判定方式：切到 vis_mode=particle（无绑定映射）撕裂即消失。原值 4.5mm 只有
    # 1.22 倍，粒子读数全程健康（worst_gap 4.4 / median 3.7、零穿模、零逃逸），
    # 所以那不是物理问题，纯渲染。
    pitch: 0.014
    # 变体：层距由这个归一化量在 [0.014, pitch_max] 里派生，pitch_max 是圈数、杆高下
    # 平铺段五行判据（平铺段 ≥ 4 格、附着盘离垂落段、抓取点离梁心 ≥ 57 mm、卷底离桌、
    # 立柱高过卷顶）都还成立的最大层距，封顶 0.018。1.5 圈 + 杆高 0.053 时只到约 0.0158；
    # 1.75 圈在 0.280 m 材料下任何层距都没有平铺段，所以圈数只到 1.5。0 还原上面的 0.014。
    pitch_frac: 0.0
    # 横梁表面到最内圈的净空。同一条理由，只是这次是布↔刚体。
    # 内圈半径因此是 0.004 + 0.0045 = 0.0085，外圈 0.0175。
    clearance: 0.0045

  # 控制网格。剖面按弧长重采样后沿横梁轴扫掠。间距沿用 1.1 实测保序的 7.5mm。
  #
  # 螺旋段在 `spiral_profile` 里就按这个间距采好了，不是交给 `resample_polyline`
  # 去采曲线 —— 那个函数是按**段**重采样的，密采样的曲线会保留自己的密度而忽略目标。
  # 弦线切掉的弧高是 r(1−cos(间距/2r))，在 8.5mm 内圈上是 0.81mm，小于一个粒子半径。
  mesh:
    spacing: 0.0075
    output_dir: .cache/topogym/meshes/cloth_unroll

  # ------------------------------------------------------------ PBD 求解器迭代
  # **穿透残差的直接来源之一，而且三个布任务从来没设过它。**
  #
  # PBD 每个子步先按速度和重力**预测**一个位置（不看任何约束），再**迭代**把位置往
  # 满足约束的方向修——拉伸、弯曲、与刚体的碰撞。这些修正互相打架，迭代次数有限，
  # 剩下的就是残差。IPC 不是「修得更准」，它是把接触写成间隙趋 0 时能量趋无穷的
  # 势垒，穿透状态在数学上到不了。
  #
  # 绳类明确设成 16/12/6（`prefab_configs/topogym_prefabs_v1.yaml`），
  # 而 1.1／1.2／1.3 一直用 Genesis 默认值。留空 = 用默认值，行为不变；
  # 要扫就整块填上，日志会打 `cloth_unroll pbd_iterations`。
  pbd:
    max_stretch_solver_iterations: null
    max_bending_solver_iterations: null
    max_volume_solver_iterations: null

  # ------------------------------------------- 以下取值沿用 cloth_unpleat
  particle_size: 0.004
  # ------------------------------------------------------------------ 转轴（2026-09-06，09-07 改为只钉尾端）
  # 横梁是一根能绕自身轴转的辊（URDF 铰链实体，`_fixtures.add_hinge_mechanism`）。出生时**只有**内端起
  # anchor_arc 那一段布（「粘在芯上的尾端」）绑到辊的连杆上（`fix_particles_to_link`），卷身完全交给
  # 求解器。夹爪沿拉动方向走了 d，环境就把辊转到「剥离前沿（弧长 卷料 − d 处）正对出口切点」的角度；
  # 尾端随连杆转，通过布↔布接触把整卷带着转，剥离点固定在出口，像真的抽纸卷。剥完时辊停下，尾端停在
  # 出口方向、离轴约 12 mm、轴高，布从那里垂到桌面再平铺到夹爪。
  #
  # 2026-09-07 之前连卷身也一起钉住。那样卷被冻在解析螺旋上、永远不静置，画面上像一圈悬空绕着杆的
  # 松螺旋。只钉尾端之后重力把层与层压到一起：出生态 on_bar 198 → 534、spread_ratio 0.405 → 0.383
  # （卷变**紧**了）。这和 08-25 那次「松卷静置 +17% 散开」相反，差别就在尾端有没有锚住——没有锚时
  # 自由端的重量会把最外圈拽下来。卷仍然跟着辊转：零外加耦合时实测转过命令角度的 84%。
  # 判据读数不变（基准单层率 0.960 对钉死版 0.948、c002 回收比 0.984 对 1.019、c042 0.929 对 0.934），
  # 当初逼出「钉住卷身」的两个角点只靠粘尾端就过了（c002 在 09-06 上午还没有粘尾端时读 0.56）。
  #
  # 为什么由环境转辊：Genesis 1.2.1 的布↔刚体接触**根本没有摩擦**，只有沿法向的推出——
  # `legacy_coupler._func_pbd_collide_with_rigid_geom` 里算刚体表面速度与切向相对速度的那一整块被
  # 注释掉了（`# we don't consider friction for now`），而 `kernel_pbd_rigid_collide` 只写粒子、
  # 刚体一侧全是只读入参。两个方向都断：布拉不动辊，辊也拽不动布。而且法向力过圆柱轴心、力臂为零，
  # 所以「布绷紧带动辊」本质上是个摩擦现象，恰好是缺的那一块。真正的修法是 FEM+IPC（见
  # `docs/develop/physics/pbd_tabletop_friction_zh.md` 第 6 节），IPC 不支持 PBD。
  # 因此辊的转角由环境给定，挂在放出的布长上而不是时间上，拉动速度仍是自由参数；shove 朝横梁推，
  # 放出长度为 0，辊不转。布和辊之间唯一的通路是尾端那一处 `fix_particles_to_link`。
  #
  # 它替代的是 09-05/06 的胶带式保持：那时杆固定、卷被钉在原地绕着它剥，最后松开的是内端，它从杆
  # 高自由落下叠在铺好的布上，每格都留一段约 40 mm、长度随机的折边（角点 c042 单层率因此跨门）。
  # 尾端粘在辊上后不再有这一段。
  #
  # 拉刚好与扯断：尾端到夹爪之间的布长 L = 材料全长 − anchor_arc − edge_inset。oracle 停在离绷直
  # 还差 pull_slack 的位置（尾端到抓取点的直线距离 = L − pull_slack）；夹爪拉到这段距离超过
  # L + tear_allowance 时，环境解绑尾端（胶水断），尾端离开辊，判据 success.on_bar_min 判失败。
  # 四个数先取值，GPU 探针后写回（docs/develop/tasks/cloth_unroll_zh.md §9.11）：
  #   lead           剥离提前量：太小硬拽（看 worst_gap_mm），太大松垂
  #   anchor_arc     粘住的弧长：≥ 2 粒径
  #   tear_allowance 胶水的伸长量 X：oracle 全包络不扯断、overpull 必扯断
  #   pull_slack     oracle 离绷直的余量：> 位置误差 1.9 mm + 观测噪声，< X
  spool:
    enabled: true
    lead: 0.008
    anchor_arc: 0.020
    tear_allowance: 0.020
    pull_slack: 0.010
  # "visual" = 把原始扫掠网格蒙在仿真粒子上（好看，有织纹）；"particle" = 直接画
  # 求解器粒子（难看，但没有绑定映射，画的就是算的）。用后者做诊断：布面读数全
  # 健康而画面撕开时，切过去就能判定问题在绑定映射还是在物理。
  vis_mode: visual
  rho: 4.0
  # 布↔布摩擦。**1.2 的两难在这里不存在。** 那边把它从 0.15 抬到 0.4 是为了让褶皱的
  # 三层别散开，而放卷需要层间滑动，方向相反。有了横梁当轴之后两种都能放料：
  # 摩擦低则外层直接从内层剥下来（最内圈可以一动不动），摩擦高则整卷绕梁转。
  # 先取 0.4 与 1.2 一致，第 6 步标定时再扫。
  # 2026-09-06 试过 0.1（卷的形状改由 cloth.tape 钉住保持后，摩擦只剩下阻碍已松开的布绕过
  # 还钉着的芯）：探针里 seed 3 回收比 0.834 → 0.894、c002 0.732 → 0.810，但 seed 0–9 全量
  # 没有净收益（seed 1 单层率 0.885 → 0.790）。退回 0.4，一次只动一个变量；
  # 见 docs/develop/tasks/cloth_unroll_zh.md §9.8。
  static_friction: 0.4
  kinetic_friction: 0.4
  stretch_compliance: 1.0e-07
  bending_compliance: 1.0e-05
  stretch_relaxation: 0.3
  # **0.0，这一项对 1.3 比对 1.2 更关键。**
  # Genesis 的 PBD 弯曲约束把**平面**当静止角，也就是它一直在把卷筒往开里推。
  # 不关掉，布卷会自己弹开——任务由仿真器而不是机械臂完成。
  # 1.2 实测这一项 0.1 → 0.5 时两秒内跨度从 199mm 涨到 251mm。
  # 顺带记下同一轮的结论：`bending_compliance` 是死参数（1e-1 到 1e-8 读数一位没变），
  # 别调它。
  bending_relaxation: 0.0
  air_resistance: 0.001
  # 白布。1.1／1.2 用的是浅灰蓝，1.3 改白是因为卷筒把布叠成好几层，
  # 灰蓝在阴影里层与层分不开。
  # 亚麻本白，不是纯白。纯白 [0.97,0.97,0.97] 在强主光下和桌面基色
  # [0.78,0.80,0.82] 一起被推到饱和，平铺段在画面里整个消失，只剩垂落段和
  # 夹爪附近的褶皱显形——看起来就是布从桌面里冒出来一截，2026-08-25 被当成
  # 穿模报了三次，而那几跑的 below_particle_steps 全是 0。暖色偏移让它在同样
  # 明亮的冷灰桌面上仍然分得出边界。观感仍是白布。
  color: [0.90, 0.86, 0.78]
  # **纯白平织，没有条带。**
  #
  # 2026-08-24 起：条带宽度是间距的一半、占 50% 面积，深蓝一压整块布读起来是蓝灰
  # 而不是白（平均亮度 0.541）；换淡蓝也只到 0.673。`pattern: plain` 直接去掉条带，
  # 平均亮度 0.788，而织纹本身仍有 2.2 倍明暗对比 —— 布还是看得出是布。
  #
  # 代价：卷筒的每一圈在画面上不再靠颜色分开，只靠明暗与轮廓。
  # 判据不受影响（两条门槛都读粒子位置，不读贴图）。
  texture:
    enabled: true
    pattern: plain
    # 以下两项 `plain` 用不到，留着是因为 `fabric_weave` 的签名要求它们，
    # 也方便随时切回 stripes。
    accent_color: [0.55, 0.66, 0.85]
    stripe_pitch: 0.020
    thread_pitch: 0.002
    pixels_per_thread: 8
    thread_shading: 0.45
    weft_tint: 0.94
    fibre_noise: 0.05
    cloud_noise: 0.08
    seed: 0
  # 布↔桌面的接触。切向（摩擦）对 1.3 没有 1.2 那么关键（锚是横梁不是桌面），
  # 但已经抽出来的那段要待在原地不往回滑。
  tabletop_friction:
    enabled: true
    kinetic_mu: 0.4
    static_mu: 0.5
    contact_band: 0.003
    max_load_factor: 3.0
    # **没有法向项，这是已知缺陷而不是遗漏。**
    #
    # 布确实会沉进桌面：实测最低粒子在桌面下 1.7~1.9mm，比静止位置（+2.0mm）低
    # 约 3.8mm。而 Genesis 渲染 PBD 布时顶点就是粒子中心、布没有厚度，且布面几乎与
    # 桌面平行——沉 2mm 会让一大片布落到桌面以下被桌子挡住，看起来像布被拉断了一截。
    #
    # 2026-08-24 试过在 `TabletopParticleFriction` 里给沉下去的粒子一个分离速度，
    # 当天撤掉：既没用也有害。没用是因为速度写在 `scene.step` 之后、只影响下一步的
    # 预测，求解器随后重新解算位置（最低点 1.70→1.87mm，等于没动）；有害是因为
    # 上限 0.1m/s 与一步重力 0.098m/s 同量级，贴桌的布变得近乎失重，铺不平反而堆起来
    # （最大层数 2→4、峰高 5.9→13.0mm、铺展 238→200mm）。
    #
    # 根因是 Genesis 的 PBD↔刚体接触没有真实法向势垒
    # （`docs/develop/physics/pbd_tabletop_friction_zh.md` 第 6 节）。
    # 真正的修法是换 FEM+IPC，而 IPC 不支持 PBD。

# ------------------------------------------------------------------ 抓取护栏
grasp:
  attach_tolerance: 0.008
  # 相切标定，几何推出来的不是扫出来的。指垫是半高 8.5mm 的盒子、中心在手坐标系
  # 0.1029（= HAND_TO_PAD_Z），所以垫尖在 0.1114、比这个中心低 8.5mm。要让垫尖
  # 落在布面上，clearance 就取 8.5mm。
  #
  # 这个值只有在机械臂退出软体耦合（needs_coup=False，见 tasks/.../cloth_unroll.py）
  # 之后才安全：耦合开着时相切加上手臂约 1mm 欠量就会把布压穿，2026-08-25 之前
  # 靠抬到 28mm 躲开，代价是那个姿态真机复现不了（PBD 稳定间隙 5~9mm > 捏布所需
  # 的 2mm，两者不相交）。耦合关掉之后指垫压不动布，才能退回真实接触高度。
  touch_clearance: 0.0085
  # 手指必须真的合拢：动作标签里没有抓取，策略学到的就是永远不合拢，真机上
  # 张着手平移什么都不会动。这是动作维度缺失，比观测里的伪影更不可补救。
  # 实测 2026-08-25：合拢的两指落在抓取点两侧 ±4mm，正压在布上，clearance 28
  # 也够不掉；close_before_descend 在 20mm 上 1221 vs 张开的 303。代价是画面上
  # 夹爪没有夹住布，这一项在 docs 里写明。
  grasp_qpos: 0.004
  # 14mm 而非 18mm。2026-08-25 卷筒层距加大后卷半径 17.5->29.5mm，平铺段变短，
  # 18mm 的盘会够到垂落段（离垂落段 25.9mm < 18+2粒径=26.0mm）。14mm 留 3.9mm 余量，
  # 仍能抓到 40 个上下的粒子。
  attach_radius: 0.014
  # 端头是躺在桌上的单层布，正下方没有别的层可抓错，所以不需要高度窗口。
  attach_z_band: null
  edge_inset: 0.012
  finger_axis: across
  # **在空中先合拢手指，再下降。**
  #
  # 附着是运动学绑定，手指从来不需要真的夹住布 —— 在布上闭合是为了画面可信，
  # 不是机制。代价 2026-08-24 实测到了：`open_qpos=0.04` 让两个指垫张开成 80mm
  # 横跨抓取点，下降和那 60 步闭合都是贴着布面横扫，`close` 阶段 60 步**全程**
  # 有布在桌面以下（0.012 和 0.014 两档都是）。
  #
  # 先合拢之后：闭合发生在半空（零接触），下降与触碰静置时指垫在布上的覆盖
  # 从 ±40mm 缩到 ±grasp_qpos。
  close_before_descend: false
  # Servo the commanded height so the bound patch keeps the height it had
  # at bind time instead of riding the link's z error. The bind is rigid and
  # takes those particles out of collision, so nothing else keeps them above
  # the table. Off until the A/B is measured.
  # 补掉手臂在拉动段的恒定 z 欠量（unpleat -8.0mm、unroll -1.4mm，八段纹丝不动）。
  # 机械臂退出软体耦合之后没有东西阻止夹爪进入桌面，这一项是唯一的防线。
  hold_pad_height: true
  # 绑定是刚性的、会把粒子移出碰撞求解，于是绑定瞬间的竖直状态被永久冻结：
  # 那一刻在桌面以下的粒子，整个 episode 都在桌面以下。只绑一个粒子把这件事
  # 封顶到一个粒子，其余留在求解器里可以被桌面顶回来。代价是拖拽权威变弱，
  # 可能要下调 physical.pull_step_m；看 follow_mm。默认关，等 A/B。
  # 关掉。它当初唯一的作用是给「粒子被压到桌下再被刚性冻住」封顶，而机械臂退出
  # 软体耦合（needs_coup=False）之后指垫压不动布，那个病理不可能发生了。
  # 代价实测到了 2026-08-25：一个运动学点拖整张布，材料在该点被抽成细颈，腕部
  # 相机里布带从满幅缩成指间一小撮——就是「布被撕开」的观感。片绑定对应一片有
  # 宽度的指面，布被一条边带走。同日对照：cloth_unpleat 片绑定 attached=64,
  # single_layer_frac=1.000 全门槛通过；unroll 单粒子 0.858。
  attach_single_particle: false
  # 动作开始之前的护栏，与 1.2 同一套：材料还收着没有、层数还在没有。
  # 起始铺展比实测 88.4/260 = 0.340（1.2 是 0.764）—— 卷起来的布带俯视跨度小得多。
  # 0.50 是按【松卷】几何重标的，不是放宽。层距 14mm 的卷筒设计出生跨度 0.392，
  # 健康静置落在 0.457（重力把每圈往下拉、不往轴心拉，松卷只会略散不会自紧），
  # 真正散架会远高于此，`on_bar` 作旁证（健康时 263）。0.45 是在层距 4.5mm 的
  # 紧卷上标的，那个几何已因渲染缺陷退役。
  # 变体时由派生覆盖：设计出生铺展比 + 0.11（基准 0.392 + 0.11 = 0.502）。1 圈的卷设计
  # 铺展比 0.60–0.66，固定 0.50 会把健康布局当 material_already_released 中止。
  max_start_spread_ratio: 0.50
  # 起始护栏的第二种度量：还贴在鼓上的粒子占比。null = 沿用 max_start_spread_ratio。
  # 两者在小卷筒上等价，在宽鼓上分道扬镳：spread_ratio 量的是水平伸展，而 φ119 的鼓
  # 自身就占 119mm，架高它又逼出 70mm 垂落段，两者都不是「已放出的料」。2026-08-25
  # 实测：鼓几何读到 0.450（恰在门槛上）而 62% 的布还卷在鼓上。
  # on_bar 数的是离鼓轴 bar_radius+2粒径 以内的粒子，对单层包裹正好覆盖。
  min_start_stored_frac: null
  # 两圈在俯视图上叠出的多层格数。起始值按几何估，spike 跑完按实测填。
  min_start_three_layer_cells: 12

physical:
  approach_z: 0.250
  move_steps: 120
  gripper_steps: 60
  max_follow_error: 0.045
  # 下降到位之后、判定附着之前保持多少步。1.2 实测：不等到位的话指垫会停在比命令低
  # 7.5mm 的地方（几乎是整个 touch_clearance），手指整段拉动都蹭着布，回收率掉三成。
  touch_settle_steps: 60
  # 每一段拉动结束后保持指令等手臂到位多少步。1.2 实测：不等的话命令 64mm 只送到 33mm。
  carry_settle_steps: 120
  release_hold_steps: 60
  # 端头每步走多少米。**1.3 不能沿用 1.2 的 0.0015。**
  #
  # 2026-08-24 实测：0.0015（dt=0.01，即 150mm/s）把布带中段拉成一条薄带，
  # 回弹时粒子速度大到一步穿过桌面。原因不是「力太大」——`fix_particles_to_link`
  # 是运动学绑定，抓到的粒子精确跟着手走，不存在力。限制拉伸的是约束求解器把这个
  # 位移传播出去的速度：PBD 一次迭代大约传一条边，布带材料方向上有 ~35 个粒子，
  # 张力还没传到卷筒，手已经又走了一步，残差逐步累积。
  #
  # 1.2 的 0.0015 站得住是因为那边只拉 61mm 且阻力只有桌面摩擦；这里要拉 161mm，
  # 还要克服卷筒绕梁的摩擦与层间摩擦。
  #
  # 标定过程（都是实测，不是估的）：
  #   0.0015 = 150mm/s  中段被拉成一条薄带，回弹时粒子一步穿过桌面
  #   0.0006 =  60mm/s  仍然瞬时断开一次，随后自己聚合回去
  #   0.0003 =  30mm/s  当前取值。2026-08-24 实测未再拉断（blowup=none，
  #                     最低粒子仅入桌 1.7mm）
  # 从 150 到 60 只把破坏从「持续拉薄」降到「瞬时断一次」，也就是还差一个安全裕度
  # 而不是差一点点，所以这一步是再砍一半而不是微调。195mm 用 651 步（6.5 秒）。
  #
  # 仍然断的话只有一条路：继续降（0.0002 = 20mm/s，976 步）。代价只有时长。
  # `env.sim.substeps` 那条路**不存在** —— tabletop V1 preset 把它锁死在 4
  # （`world/tabletop.py:_validate_locked_preset`），改了直接抛异常。锁得对：
  # 全仓所有阈值都是在 dt=0.01 / substeps=4 下标的，动它就没有一条读数还能横向比。
  # `stretch_compliance` 也帮不上：1e-7 已经接近不可伸长，没有余量可加。
  pull_step_m: 0.0003
  # **单次抓取行程的上限**（不是实际长度）。取 0.300 > 总行程 195mm，
  # 也就是**一次连续拉完，不分段**。留得比总行程宽是为了 pull_scale 调上去时
  # 不会静悄悄地又分成两段。
  #
  # 这一项 2026-08-24 从 0.070 改过来，原因是当初分三段的理由不成立：
  # 手的终点是「起点 + **总**行程」，分不分段都一样，所以分段从来没有换来可达性，
  # 只换来两次「松手 → 退开 → 回来 → 重新抓」——那正是画面上一顿一顿的来源。
  # 1.2 那条「64mm 一段末端仍差 8.6mm」量的是单段末端的跟踪残差，
  # 治它的是 `carry_settle_steps`，不是把行程切碎。
  #
  # 多段的机制留在代码里（`stroke_count` / demo 的循环）：圈数一旦调大，
  # 总行程会超出手臂可达，那时才真的需要它。
  stroke_m: 0.300
  # 行程不再有倍数（2026-09-06 转轴起）：终点由几何定，尾端粘在辊上、布绷直减 pull_slack
  # （cloth.spool 的注释）。09-05 之前这里是 pull_scale 1.30（补内端落点的实测残差）、09-06 上午
  # 1.05 / 1.10（胶带后公式本身就准），历史读数见 docs/develop/tasks/cloth_unroll_zh.md §9.9。

# ------------------------------------------------------------------ 可达与工作区
# checks() 的 hand_reach 行：拉动终点（夹爪最远到的位置）离机械臂底座的水平距离上限。
# base_xy 同 cloth_unpleat / rope_unwinding / gate 的 reach 段（manipulation_space 的 mount.pos）。
# max_hand_dist 0.665 沿用 cloth_unpleat 的假设；本任务 pull_scale 1.30 那次实测手到过
# y = +0.215（x = 0.040，离底座 0.647）。center_x 到 0.050 时终点最远 0.665。
reach:
  base_xy: [-0.570, 0.0]
  max_hand_dist: 0.665

# manipulation_space.workspace 的 x / y 字面量副本（checks() 的 band_in_workspace 行读；
# 角点门裸加载本文件时读不到 common 配置）。builder 断言与 common 相等。
workspace:
  x: [-0.25, 0.25]
  y: [-0.30, 0.30]

success:
  # **动作开始前给布带多少步沉降。** 注意 demo 里实际步数是
  # `settle_steps − physical.gripper_steps`（沉降与夹爪张开重叠，1.2 立的规矩，
  # 为的是省掉开场两秒的空等）。
  #
  # 2026-08-24 之前这里是 60，而 gripper_steps 也是 60 —— **布带一步专门的沉降都
  # 没有**。1.2 那样够用是因为它是一块平布；1.3 是两圈的卷筒，稳定所需时间不是一个
  # 量级（`roll_settle_spike` 给的是 400 步）。实测后果有两条：
  #   最深下沉发生在 step 188 的 `approach` 阶段（还没抓、更没拉），位置在布带边缘，
  #   14/2346 粒子、1.95mm —— 就是布还在自己沉降；
  #   同一份配置两次跑 single_layer_frac 得到 0.959 与 0.889（GPU 原子操作非确定性），
  #   而起始态没稳会把这个方差放大。
  # 200 − 60 = 140 步专门沉降，代价 1.4 秒。
  settle_steps: 200
  cell: 0.008
  # ---------------------------------------------------------- 两条联合判据
  # 与 1.2 完全相同的算术，因为末态是同一件事（单层、平摊、材料全放出来）。
  # docx 1.3 的三条判据里，「无自重叠区域」就是单层率，「端到端距离 ≈ 材料长度」
  # 就是回收率；第三条「累计转角」做不出来 —— 它需要沿带长排序材料点，而 2026-08-23
  # 实测 Genesis 的重网格化不保顶点顺序（控制 595 → 仿真 2283，最大偏移 198mm）。
  # 残留扭转改用离面厚度（PCA 第三奇异值）兜底，先只记录。
  # 0.70：按 1.3 自己的三种走法实测重标（此前 0.90 是从 1.2 继承、从未为本任务标过）。
  # 2026-08-25 实测（1.5圈/14mm 几何）：shove 0.530、unroll 0.783~0.875（跨 pull_scale
  # 1.12/1.30/1.35/1.45）、overpull 0.921。门槛落在 0.530 与 0.783 之间的空档里，
  # 两侧余量 0.17 / 0.08，都大于观测到的 0.09 run-to-run 摆幅。
  single_layer_frac_min: 0.70
  # 放回来的料占「还能铺出来的料」的比例：分母 = 放松位跨度上限 − 静置后跨度（转轴版尾端粘在辊上，
  # 垂落高那一段永远挂着、anchor_arc 永远卷着，拉满读 1.0；09-06 之前分母是材料全长 − 静置跨度）。
  # 起始值按 1.2 的门槛搬过来，等三种走法跑完再标定。
  # 0.50：同一批实测，shove 0.057、unroll 0.733~0.921、overpull 1.010。空档宽 0.68，
  # 门槛放中间，噪声不可能翻过去。判据分的是【动作对错】，行程调得好不好由默认值负责。
  recovered_frac_min: 0.50
  # ---------------------------------------------------------- 只记录不判定
  # 1.2 的 band_shift 在这里没有对应项：那一项量的是「正确动作不该动的那半段布」，
  # 而本任务的锚是横梁不是布，正确放卷时每个粒子都在动（内端要从梁上下来铺到桌上）。
  # 它本来要抓的失败（整条被拖走而不是放卷）由 on_bar 加层数门槛抓：
  # 被拖走的布还是一卷，层数留着、整卷离开横梁。
  # 离面厚度：全部粒子的 PCA 第三奇异值。平摊的布应当接近一个布厚；
  # 留着半个扭转会立起一道脊，这个数就上去。
  out_of_plane_max: null
  # 还缠在梁上的粒子数（梁半径 + 2 个粒子以内）。转轴版尾端粘在辊上，完全展开时只剩粘住的
  # 尾端（约 30–40 粒子）；扯断后为 0。on_bar_min 是「尾端还在辊上」的门，取尾端粒子数的三分之一。
  on_bar_max: null
  on_bar_min: 10
  stretch_max: null
  flatness_var_max: null
  # ---------------------------------------------------------- 第三条门：防过拉（2026-09-06）
  # 布带前端（夹爪松开的那一头）越过「放松位」多少米；放松位 = 尾端点（离辊轴 tail_radius）
  # 沿拉动方向再加 (L − 垂落高) 再加内缩量：尾端粘在辊上，松手后布从尾端竖直垂下再平铺，
  # 不论拉到哪里（只要没扯断）自由端都停在这里（判定器从配置算）。0 = 布正好停在放松位；
  # 正 = 松手后仍被拉长或拖过了头。拉过头的主判据是尾端被扯断（on_bar_min），这条门取
  # tear_allowance，兜住「扯断之前把布拉长」。前两条门只会因为多拉
  # 而更好过，是这一条把「拉得够远就行」判成失败。三条门合取；C1 禁的是只有一条位置阈值。
  # 为什么量前端不量后端：行程固定时后端 = 前端 − 铺开长度，折边把铺开长度缩短多少后端就
  # 前移多少（09-06 实测：两个没多拉的 seed 后端 +38 mm，正是回收比最低的两个）；前端是
  # 夹爪放下的位置，有没有折边都一样。后端距离 tail_gap 仍记录，看折边用。
  # 2026-09-06 转轴实测（按放松位重算）：固定布局 +7 mm、seed 7 +6、c002 +2、c042 +13（杆越高，
  # 松手后垂落段越不完全竖直）；overpull 走法（扯断）+85、shove −149。门 0.030：oracle 余量 ≥ 17 mm。
  over_pull_max: 0.030
  # 后端越过杆轴的距离，只记录（见上）。
  tail_gap_max: null

  # ------------------------------------------------- 接触有效性（与任务成败无关）
  # **布在整个 episode 里最深进入桌面多少米。**
  #
  # 这不是判「机械臂做没做成」，而是判「这一次的物理算不算数」——和 `diverged`
  # 同一类，是数据集能不能收这条轨迹的问题。单独列出来的理由有三条：
  #   判据本身依赖接触正确 —— `single_layer_frac` 按高度分层，陷进桌面的粒子照样
  #     被计入，穿透污染的是测量不只是画面；
  #   它是「Genesis 的 PBD↔刚体接触没有真实法向势垒」这个缺陷的症状，同一个缺陷
  #     作用在布↔布上就是层数判据整个失效，不再是美观问题；
  #   这些跑要产训练数据，演示里的布穿过桌子，学到的是不存在的物理。
  #
  # 2026-08-24 实测：最深 1.95mm，14/2346 粒子（0.6%），发生在 step 188 的
  # `approach` 阶段 —— 布带边缘还在自己沉降，与拉拽无关。`settle_steps` 因此从 60
  # 抬到 200。**0.6% 是这一组参数下的一次观测，不是界**：随机化布局、改圈数、改摩擦
  # 之后是多少没有证据，所以要有门槛盯着它，而不是写在注释里就算了。
  #
  # 0.004 = 一个粒子直径，实测值的两倍余量。它抓的是「质变」而不是「微调」。
  # 置 null 则只记录不判定。
  # 第一原则：任何一个粒子进入桌面即判失败。28mm + 单粒子 + 不闭合实测为 0，
  # 所以这里不留余量——留了就等于默许视觉穿模进训练数据。
  penetration_max: 0.0

# ------------------------------------------------------------------ 指令
# 常量句：防捷径离散轴是 cloth.pull_side，整个布局是镜像的，自由端在哪一侧看得见。
goal:
  instruction: "Unroll the cloth off the bar and lay it flat on the table."

# ------------------------------------------------------------------ 变体
# 每条轴各自独立区间；区间依赖其他轴的量抽归一化 frac 再由 derive_task_cfg 派生；
# 首抽拒绝率门 2%（tests/check_variant_rng.py）。角点 2 × 3 × 2^4 = 96 个。
variation:
  # 防捷径离散轴：支架在 y = −0.100 向 +y 拖，还是镜像到 y = +0.100 向 −y 拖（cloth.pull_side 的注释）。
  - {kind: choice, path: cloth.pull_side, values: [1, -1]}
  # 单调裕度轴：横梁上绕几圈。圈少则卷细、平铺段长、行程短（1.0 圈行程 164 mm，1.5 圈 239 mm）。
  # 1.5 以上在 0.280 m 材料下平铺段不够（roll.pitch_frac 的注释）。
  - {kind: choice, path: cloth.roll.turns, values: [1.0, 1.25, 1.5]}
  # 布局：横梁离桌面多高，±0.008。下端由 roll_clears_table 行、上端由立柱 0.090 保证。
  - {kind: uniform, path: dispenser.bar_height, lo: 0.037, hi: 0.053}
  # 布局：支架朝 / 离机械臂平移。上限 0.050 由可达盘定：终点 y ≈ 0.225 时弦长 0.240。
  - {kind: uniform, path: cloth.center_x, lo: 0.010, hi: 0.050}
  # 归一化：层距。窗口随圈数、杆高变，抽 [0,1] 再派生（roll.pitch_frac 的注释）。
  - {kind: uniform, path: cloth.roll.pitch_frac, lo: 0.0, hi: 1.0}
  # 归一化：支架沿拉动方向的位置。区间 [−0.130, min(−0.070, 可达盘弦长 − 终点偏移, 工作区 − 终点偏移)]，
  # 随层距 / center_x / pull_side 变，抽 [0,1] 再派生。
  - {kind: uniform, path: cloth.center_y_frac, lo: 0.0, hi: 1.0}
  # 派生：pitch_frac -> roll.pitch（要圈数、杆高），再 center_y_frac -> cloth.center_y（要层距给的自由端、行程、center_x），
  #       再 grasp.max_start_spread_ratio = 设计铺展比 + 0.11（要层距）。
  - {kind: derived, fn: "topogym.tasks_legacy.deformation.cloth_unroll:derive_task_cfg"}
  # 校验：ClothUnrollLayout.checks() 十行（平铺段 ≥ 4 格、附着盘离垂落段、抓取点离梁心 ≥ 57 mm、卷底离桌、
  #       立柱高过卷顶、层距 ≥ 0.014、出生足迹与终点在工作区内、终点可达、行程 ≤ stroke_m、出生铺展比 ≤ 守卫）。
  - {kind: validate, fn: "topogym.tasks_legacy.deformation.cloth_unroll:validate_task_cfg"}
