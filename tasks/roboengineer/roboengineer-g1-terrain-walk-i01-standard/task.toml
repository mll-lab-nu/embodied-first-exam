schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, { source = "/data/", service = "sim" }, "/app/output/"]
[task]
name = "embodied-first-exam/roboengineer-g1-terrain-walk-i01-standard"
description = "Train a blind 29-DoF Unitree G1 policy in mjlab/MuJoCo Warp and transfer to CPU MuJoCo over flat, sloped, rough and stepped terrain. Stand 2 s, then follow a public forward velocity command of 0.5–0.65 m/s for 18 s."
authors = [{name = "Robotic Engineering Bench contributors"}]
keywords = ["robotics", "policy", "adaptation", "mujoco"]
[metadata]
author_name = "Robotic Engineering Bench contributors"
author_org = "Robotic Engineering Bench"
collection = "roboEngineer"
embodiment = "humanoid"
task_type = "policy"
simulator = "mujoco"
robot = "unitree-g1"
family = "roboengineer/g1-terrain-walk"
mode = "standard"
dynamics = "static"
protocol = "eai-policy/1.1"
oracle = "partial"
oracle_evidence = "Harbor 0.23.0 oracle agent on aws:rcb-gpu13 (L40S), 2026-10-18, images efe-private:control-transfer-0.2.0-train / 0.2.0 (200 + 2466 + 1479 + 986 PPO iterations x 4096 environments from scratch; 12009 s of the 14400 s; round 0 passed all four development cases, the later, sealed rounds drifted sideways): the reference (trains the public curriculum from scratch on the agent's GPU, three deployments, the last sealed) succeeded on 4/12 held-out cases, mean engineering score 82.68; nop 0. No full oracle: human review (PROTOCOL §4)."
instance_seed = 1
expert_time_estimate_hours = 4.0

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 6.0
min_memory_gb = 15.0
min_gpu_memory_gb = 20.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB (all measurements; a 24 GB card fits the memory but trains slower, so fewer iterations fit the cutoff)"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 0.0
measured = "Harbor 0.23 oracle (the reference: 4096 environments, 12638 s of training and deployments) and smoke trials on aws:rcb-gpu14 / -gpu13 (L40S, 2026-10-18; docker stats + cgroup memory.peak + nvidia-smi per container every 3-6 s): the agent's container 16.1 GiB (16492 MiB) of GPU memory, 5.3 GiB memory (5.6 GiB cgroup peak, growing over the 3.5 h run), 1.0-1.6 cores (one Python thread drives the GPU); the public trainer's default 256 environments 1.8 GB, its cap of 1024 4.7 GB; the sidecar 2.2-2.6 cores during deployments (OSMesa), its 4-CPU cap during finalization (12 held-out cases x 2 + video: 419 s), peak 2.06 GiB. Minimum: GPU = 16.1 GiB x 1.15 = 18.5, raised to 20 (headroom for the pool's VRAM reservation); memory = the agent's 12 GB cap + the sidecar's peak x 1.2 + the monitor; CPU = the sidecar's ~2.5 during deployments + the training's 1.6, rounded up to leave the agent's 4-core cap some room; the monitor: <= 0.86 GiB of new files, <= 6 processes"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 20.0
max_memory_gb = 10.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 20.0
trial_max_memory_gb = 16.0
measured = "the reference (4096 environments) peaked at 16.1 GiB of GPU memory and 5.6 GiB of memory in the agent's container; 20 GiB of GPU memory = the declared minimum (enough for ~4900 environments); 10 GiB of memory leaves room for an agent's own CPU rollouts; trial = the agent's 10 GiB + the sidecar's 6 GB cap (its peak 2.1 GiB); disk 0.86 GiB and 6 processes in the reference, within the design defaults"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 4.0, memory_gb = 12.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 6.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 1
allowed = [1]
oracle = [1]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"
# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"   # PROTOCOL H.4: nothing the agent started runs on when the sidecar finalizes
timeout_sec = 30
[[verifier.collect]]
service = "sim"
command = "python -m scripts.control_transfer.trusted.collect"
timeout_sec = 1800
[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 12288
[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
