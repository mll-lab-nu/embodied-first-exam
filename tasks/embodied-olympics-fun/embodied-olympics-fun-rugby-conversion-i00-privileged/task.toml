schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-rugby-conversion-i00-privileged"
description = "Embodied Olympics rugby-conversion (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Kick a conversion: with one place kick of a foot, send the rugby ball standing on its tee over the crossbar and between the posts. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "rugby-conversion"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "rugby_conversion"
category = "football-and-volleyball"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 6.0
oracle = "full"
oracle_evidence = "Reference, on Unitree's actuator data (rotor inertia, joint friction): a standing power kick through lowcmd, the hip and knee bursts at the G1's 88 / 139 N m; the wind-up pose, hip roll, crouch, ankle, knee-burst start, waist torque and wind-up length from CMA-ES, with a penalty for any arm passing into the robot's own body. The foot meets the ball above the rigid tee at 3.18 s and sends it through the goal plane at 5.66 m (the bar is at 3.0 m), 0.44 m right of the middle; success after 4.05 s. All 8 perturbations score (servo gains x0.97 / x1.03, the kick 10 ms earlier / later, the tee 1 cm nearer, farther, left, right; the ball crosses at 5.3-5.7 m). The deepest self-overlap is 1.2 mm (trunk and shoulder). The robot falls after the kick, which is allowed (Law 8 judges the ball). Measured: success after 4.05 s of the 60 s limit, live and in a fresh replay, ending in the same state."

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
