schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-high-bar-swing-i00-privileged"
description = "Embodied Olympics high-bar-swing (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Standing on the block behind the high bar, jump up and catch the bar with both hands, then do one giant swing: take your extended body in a full circle around the bar, without letting go. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "high-bar-swing"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "high_bar_swing"
category = "parkour-apparatus-balance"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 12.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: positive by a declared magic action (the G1 on a 1.1 m block behind the bar; its own Dex3-1 hands, drives 5 times the device's, declared: the one exception to the benchmark's 2x cap; no weld): the jump is one injected velocity (a 0.18 m rise), the hands close 0.12 s before the top and catch the bar, then an injected spin as from 60 deg and a gravity-like drive of at most 400 N m about the bar (no joint loaded by it): a full extended circle in 4.95 s, bottom load up to 8.6 body weights in 10 ms samples, all held by the hands' own drives; the same state hash twice. The grip-force need, the same magic action: 4 and 4.5 times let go, 5 and 6 times hold, forwards and backwards; capacity of the two hands on the bar: about 1 body weight at the device's torques (the catch tears them off), 1.55 at 1.5 times, 2.05 at 2 times. Negatives: nop (time), no catch (hands open: the mats), holding the bar without a jump, the hands opened (let go), a fall from the block (the mats), a tucked circle and a circle that turns back (referee-only rotations: no count). Stress: random joint targets on the bar then the hands opened: let go; the finger links press at most 3.3 mm into the bar.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
