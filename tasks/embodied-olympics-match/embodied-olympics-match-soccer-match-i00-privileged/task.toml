schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-soccer-match-i00-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): robot soccer 2 v 2 (RoboCup Humanoid Soccer League rules, soccer-2v2-10): two simulated Booster T1 humanoids of team A, commanded by one program, against the scripted team B on a boarded 10 x 7 m pitch, two halves of 5 minutes of game time, one match against the scripted opponent at level 2 on the frozen instance of embodied-olympics-match-soccer-match-i00-standard-realtime (seed 7, S = 5). Full simulator in development (read and change any state, reset the whole match); the deliverable is a closed-loop Python program that plays a fresh unmodified match in the verifier, on the original S = 5 clock, seeing the full state instead of camera images."
authors = [{ name = "Embodied Olympics (CHIGUI0)" }]
keywords = ["robotics", "mujoco", "fullsim", "policy", "soccer"]
[metadata]
author_name = "Embodied Olympics"
task_type = "policy"
simulator = "mujoco"
robot = "booster-t1"
family = "soccer_match"
mode = "privileged"
dynamics = "dynamic"
verifier_wall_clock = true
instance_seed = 7
opponent_level = 2
source_commits = ["0d7f680cc049"]
source_task = "roboolympics/soccer-match-wallclock-program-standard"
exporter = "Embodied Olympics full-simulator exporter"
official = false
expert_time_estimate_hours = 1.0
oracle = "partial"
oracle_evidence = "full-state reference program (solution/): the screening's truth reference (the frozen scripted coach at the reference level: both robots go for the ball, in-walk kick) as a program reading the declared truth; in step timing it reproduces the in-world truth reference bit for bit; its results at levels 2 and 3 and on this instance are in the Embodied Olympics privileged report (soccer section); not reproduced in this repository: the owner waived the oracle runs on 2026-10-17 (validated = false)"
validated = false

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 6.0
min_memory_gb = 8.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 6.0
verifier_min_memory_gb = 8.0
verifier_min_gpu_memory_gb = 0.0
measured = "Harbor 0.23 oracle trial (an RTX 4090 workstation, 2026-10-17): CPU-only MuJoCo with two Booster T1 humanoids per team; the verifier holds the service, the program, one replay and the video renderer; 6 CPUs pinned (the match runs on the wall clock)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 13.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 13.0
measured = "author estimate: no trials yet; memory under the 16 GiB cap by the margin the monitor needs (an agent may run several worlds at once or train a controller); disk 20 GiB for downloaded tools and controllers; processes 512: design default"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 6.0, memory_gb = 16.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 7
allowed = [7]
oracle = [7]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 16384
[verifier]
timeout_sec = 7800.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
