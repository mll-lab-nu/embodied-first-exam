defaults:
  - staged_lock_policy_views
  - _self_

env:
  renderer:
    spp: 24
  cameras:
    agentview:
      pos: [-0.68, -1.06, 2.02]
      lookat: [-0.13, -0.01, 1.15]
      fov: 55
    front_oblique:
      pos: [0.48, -0.65, 1.57]
      lookat: [-0.045, -0.10, 1.035]
      fov: 47
    wrist:
      res: [960, 540]
      fov: 83
      attach:
        offset_pos: [0.085, 0.060, 0.025]
        offset_lookat: [0.0, 0.0, 0.17]
        offset_up: [1.0, 0.0, 0.0]

unwrap:
  opening_down: true
  source: [-0.02, 0.17, 0.108]
  work: [-0.04, -0.06, 0.093]
  goal: [0.12, -0.30, 0.021]
  board_size: [0.15, 0.072, 0.028]
  board_center_z: 0.019
  half_base: [0.079, 0.041]
  # Continuous cross-shaped cloth: the four flaps share their base vertices.
  flap_lengths: [0.155, 0.150, 0.108, 0.105]
  layer_heights: [0.044, 0.041, 0.038, 0.035]
  grid_spacing: 0.002
  drape_drop: 0.09
  # Reachable branch for the side grasp; continued through the package flip.
  package_ik_seed: [-1.393298, 1.755517, 0.809381, -2.736268, 2.356232, 1.683657, -2.256759]

run:
  output: runs/cloth_unwrap/opening_down
  fps: 20
  preview: false
  audit_only: false
  record_cameras: [agentview, wrist, front_oblique]
  exterior_cameras: [agentview]
