# Generated by scripts/vlabench/generate.py -- edit the template or tasks.json, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/vlabench-{{dash}}-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): VLABench {{task}} (Franka Panda) on the same frozen instance as vlabench-{{dash}}-i00-privileged: {{instruction_toml}} The agent only gets a client: four cameras (RGB, optional depth, calibrated) and the robot's own state; joint-position chunks; one episode, no reset, no object poses; the sim service records the episode, replays it in a fresh simulator and grades it."
authors = [{ name = "{{author}}" }]
keywords = ["robotics", "vlabench", "mujoco", "franka-panda", "code-as-policy", "trajectory", "standard-mode"]

[metadata]
author_name = "{{author}}"
author_org = "{{org}}"
task_type = "trajectory"
simulator = "vlabench"
robot = "franka-panda"
family = "vlabench/{{task}}"
mode = "standard"
protocol = "eai-standard/2.1"
oracle = "full"
instance_seed = {{seed}}
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container, so nothing drives the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it.
# The loops run on the clock, inside timeout_sec: the verdict ("finalized": true, set before any video is rendered) may
# take until 1440 s; then the hook waits for the replay video ("video_pending") until 1470 s -- a video that is not ready
# by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 1440 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 1470 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 1500

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator, but VLABench's experts are public upstream: the agent reaches the model APIs
# and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0
