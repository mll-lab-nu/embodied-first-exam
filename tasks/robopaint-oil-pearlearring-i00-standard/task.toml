schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/canvas.png", service = "sim" },            # the replayed main sheet that was scored
  { source = "/data/canvas_practice.png", service = "sim" },   # the replayed practice sheet (never scored)
  { source = "/data/canvas_live.png", service = "sim" },       # the live episode's main sheet
  { source = "/data/canvas_live_practice.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robopaint-oil-pearlearring-i00-standard"
description = "RoboPaint oil painting from a reference, STANDARD MODE (robot as a service, eai-standard/2.2): embodied robotic oil painting (ManiSkill 3.0.1 Franka Panda with an oil-paint brush; libmypaint 1.6.1 paints) on the same frozen instance as the privileged task: paint the picture target.png (a square crop of Johannes Vermeer's Girl with a Pearl Earring, c. 1665) onto the main sheet in at most 450 strokes, with 16 premixed paints and a practice sheet for test strokes. The agent only gets a client: get_obs (camera RGB + proprioception), submit (ee_pose or joint_position chunks). No reset, no sheet readout, no brush model, no score; the sim service records the episode, which is replayed twice and scored at a 1 mm scale against the picture (success iff mean CIELAB ΔE <= 5.7, p90 ΔE <= 12.5, SSIM of L* >= 0.77, edge correlation >= 0.61, paint IoU >= 0.96 (all after the best single shift of the sheet, at most 5 mm along each axis, inside the central area 8 mm in from the sheet's edges) and at most 450 strokes)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "maniskill", "sapien", "painting", "oil-painting", "mypaint", "brush", "paint-from-reference", "franka", "standard-mode", "trajectory", "robopaint_oil_pearlearring"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "maniskill"
robot = "franka-panda"
family = "robopaint_oil_pearlearring"
mode = "standard"                  # camera RGB + proprioception only; no sheet readout, no score, no reset, no brush model
protocol = "eai-standard/2.2"
oracle = "partial"                # solution/: the privileged oracle's joint targets, streamed through the client
oracle_evidence = "Reference solution in solution/. Oracle 1 and nop 0 in the release validation (ws3, 2026-09-28: oil-l-oracle-final0928, oil-l-nop-final0928), on earlier scoring and tooling. Changed since: the v2 registered scoring (cc866ac9: scorer and success rule; the saved oracle trajectories re-scored, all pass; Harbor oracle and nop on irises and pearlearring, this pair included), the 2.2 inputs (cf95376f) and the rated limits (fe5fb9e6), both adding tooling queries only; protocol v1.0 gave the standard service, collect hook, grader and oracle client crash recovery. Not re-run on this version (static validation only)."
instance_seed = 0
expert_time_estimate_hours = 6.0
difficulty = "extreme"          # RoboPaint tiers: acrylic stroke copy hard, oil paint-from-reference extreme
medium = "mypaint"
stroke_count = 300                # difficulty axes: the reference solution's strokes, the stroke budget, paints, brush sizes, the picture
stroke_budget = 450
palette_size = 16
brush_sizes_mm = [10.7, 8.0, 5.5]
picture_detail = 2.056          # mean |grad L*| per mm of the picture at the 1 mm judging scale
palette_floor_de = 3.72          # mean ΔE of the picture to its nearest premixed paint (no blending)
reference_de_mean = 5.16
reference_ssim_L = 0.802
source_image = "File:1665 Girl with a Pearl Earring.jpg"
source_license = "Public domain"
source_artist = "Johannes Vermeer"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # dump + exit the service, replay twice in fresh processes (+ video), score, write final.json
timeout_sec = 3600

[agent]
timeout_sec = 7200.0              # 2 h of wall clock, same as the privileged twin
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
