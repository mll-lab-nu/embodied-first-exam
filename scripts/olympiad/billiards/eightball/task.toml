schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/billiards-eightball-program-standard"
description = "PROGRAM PLAY, turn-based, parameterized: the opponent level (RCB_LEVEL 1-2) and the rack seed (RCB_SEED) are chosen at run time; the verifier reports them and whether they form an official configuration. One rack of American 8-ball (WPA rules: break, called shots, open table, solids/stripes from the first called ball pocketed, ball in hand after a foul, the 8 into a called pocket; pooltool event-based physics with spin) against a scripted opponent. Observation: an overhead camera and a sighting camera, no ball coordinates; action: cue direction, cue speed and tip offset, plus a cue-ball placement with ball in hand and the call (ball and pocket, or safety) on every shot after the break. A 60-minute chess clock runs only on the player's turn (reviews included); clock out = loss. The agent may write a program that measures the images and sends its shots, with a live metered model session; one act in flight; a review after each of its shots. Success: win the rack in a valid trial (deterministic replay, no simulator, model-API or metering failure)."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "billiards", "8-ball", "pool", "pooltool", "turn-based", "chess-clock", "vision", "spatial-reasoning", "physics", "match"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded match itself
simulator = "pooltool"
robot = "none (cue)"
family = "billiards_eightball"
mode = "standard"
protocol = "eai-standard-turn/1.0"           # turn-based extension of standard mode
oracle = "full"
oracle_evidence = "solution/: a scripted camera-only 8-ball player; wins the default L1 configuration (seed 1), checked valid at L1 and L2 (it can lose)"
revision = "eightball-turn-1-program-param"
parameters = "RCB_LEVEL (1-2, default 1), RCB_SEED (default: the level's first official seed, 1 / 2)"
expert_time_estimate_hours = 0.75

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 900); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 1000

[agent]
timeout_sec = 7200.0           # preparation, then the game: a 60-minute chess clock plus the service's own time

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
# The agent runs in `player` (a single Harbor seat), networked only with sim during play; see docker-compose.yaml.
