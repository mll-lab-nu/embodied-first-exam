# untangle_continuous_inspect_demo 的运行模式参数。
#
# 物理与场景参数不在这里，用点路径覆盖：
#   task.braid.n_strands=2   task.braid.length=3
#   task.rope.mesh.segment_length=0.004   task.rope.mesh.radial_segments=6
#   task.rope.model=fem_ipc_tube   task.rope.fem.E=200000.0

defaults:
  - default
  - _self_

# 把机械臂整个排除在场景外，只看绳。
no_robot: false

# 形如 "0-9"：对该范围内每个 seed 跑一次 braid 自检，而不是只跑一个。
# 本仓没有 pytest，这一项充当 braid.py 的回归门。null = 只用 run.seed。
seeds: null

# 只跑 braid 自检，跳过 gs.init 与建场景。与 seeds 搭配用。
no_build: false
