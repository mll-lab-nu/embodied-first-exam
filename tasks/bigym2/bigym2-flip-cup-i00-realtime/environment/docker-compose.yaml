# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# GPU on sim: physics and the whole-body controller run on the CPU, but upstream's env renders the robot's three cameras
# every control step, and every image the agent asks for is rendered here (EGL). `graphics` mounts the EGL ICD.
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 6144m   # rcb-monitor
    pids_limit: 1024   # rcb-monitor
    x-gpu-memory-gb: 4   # GiB   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    command: python /srv/rcb_realtime.py
    restart: on-failure:6                               # a crash resumes the same episode, never a reset (rcb_service.py)
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_TASK_TEXT: "Turn the upside-down cup the right way up and gently set it back down."
      RCB_EPISODE: "one episode, no reset: it succeeds when this has held for 1 s (50 control steps): the cup stands the right way up (its axis within 5 degrees of vertical), touching the counter, held by neither gripper (held = a finger of the gripper touching the object); a fall (pelvis tilted beyond ~53 degrees or below 0.30 m) fails it without ending it; it ends at the success, a failure, the pelvis 10 m from the scene's origin, a simulator error, or after 1850 control steps"
      RCB_WALL_CLOCK_S: "3600"
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the standard
      # configuration; results under other settings are reported separately.
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-1}"                # 1: real time (official); S: one step every S x control_dt s, reported apart
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-0}"        # 0: one episode (the protocol's default)
      RCB_IMAGE_HW: "${RCB_IMAGE_HW:-84}"               # the side of each onboard camera's square image, pixels (84: upstream's)
      RCB_SESSION_LOG: ""
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
