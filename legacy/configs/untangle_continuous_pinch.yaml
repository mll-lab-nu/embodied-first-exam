# untangle_continuous_physical_pinch_demo 的主配置。
#
# 每个 demo 一份主配置，取代此前写在 demo 里的 DEFAULT_ENV_CONFIG / DEFAULT_TASK_CONFIG
# 等模块常量 —— 那些常量是「这个 demo 默认跑哪个场景」的声明，本来就属于配置。
#
# 只声明与共享基座 configs/config.yaml 的差异，其余（组的选择、hydra 输出目录、
# chdir 设置）都从它继承。
#
# 用法：
#   python -m demos.entangle.untangle_continuous_physical_pinch_demo
#   python -m demos.entangle.untangle_continuous_physical_pinch_demo run.viewer=true run.keep_open=true
#   python -m demos.entangle.untangle_continuous_physical_pinch_demo task.rope.mesh.segment_length=0.004
#   python -m demos.entangle.untangle_continuous_physical_pinch_demo --cfg job   # 只打印解析后的配置

defaults:
  - config
  # 本 demo 有自己的诊断开关（grasp_strand / connector_probe_steps / trace），
  # 因此用 run_configs 组里的专属选项，而不是通用的 default。
  - override run_configs@run: untangle_continuous
  - _self_
