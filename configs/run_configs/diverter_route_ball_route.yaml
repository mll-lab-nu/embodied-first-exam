# diverter_route_ball_physical_route_demo 的运行模式参数。
#
# 指令方向不在这里 —— 它属于实例定义，在 task 里：
#   task.diverter.dead_end_side=right
#   task.diverter.init_sealed_side=left

defaults:
  - default
  - _self_

# 用哪条规则决定目标角。两者共用一个接口，构成官方对照对：
#   oracle           读指令与当前板相位，封住另一侧 —— 预期成功
#   fixed_direction  永远转到同一个落座端，不看指令 —— 预期成功率约一半
oracle_mode: oracle

# 跑到哪一步：
#   full         旋转 -> 退刀 -> 放球 -> S–T 弹珠测试 -> 判定
#   rotate_only  只做旋转，用来单独量原语的落点误差
stage: full

# 在规划出的目标角上再加这么多度，用来**故意转不到位**。
# 不是 oracle 的一部分，是执行误差注入：录对照视频、以及将来量「差多少度会失败」时用。
# 0 = 不注入。参考：落座角 ±30°，拓扑上 |角| ≤ 15° 时两侧都不可达（球必卡）。
target_offset_deg: 0.0

# 弹珠测试的步数上限。球从释放到出口实测 3.10s；600 步 = 6 秒，留出滚出后静止的时间。
marble_steps: 600

# --- 变体（2026-09-02）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识。
variant_id: default
