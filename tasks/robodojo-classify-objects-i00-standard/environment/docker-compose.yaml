# Standard mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# Isaac Sim needs an RTX-class GPU even headless (RoboDojo runs PhysX with GPU dynamics). The sidecar is TRUSTED: its Kit cache is
# the trusted volume, never mounted where agent code runs (Isaac keeps generated Python there that Kit imports); it has no
# fixed name, so every trial's compose project gets its own (Harbor's teardown deletes it).
# Crash recovery (docs/STANDARD_MODE.md §13): run.sh exits non-zero when the service crashes and compose restarts the
# same container (its /data kept); the service resumes the episode from its journal. RCB_STARTUP_TIMEOUT_S: the startup
# watchdog, at least twice the slowest measured scene build (scripts/robodojo: ~3.5 min per start on a warm shader cache).
services:
  main:
    pids_limit: 16384   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 16   # rcb-monitor
    mem_limit: 25600m   # rcb-monitor
    pids_limit: 16384   # rcb-monitor
    image: ghcr.io/mll-lab-nu/eai-robodojo:0.1.0
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
      - rcb_robodojo_cache_trusted:/cache
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_TASK: classify_objects
      RCB_INSTANCE: /srv/instance.json
      RCB_TOOL: /srv/rcb_robodojo.py
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "5400"
      RCB_STARTUP_TIMEOUT_S: "1800"
      PYTHONPATH: /srv
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/PROTOCOL.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/eai-monitor:0.1.0@sha256:f2c910f53f79c2bfa4a71298b10c78383cae3afc40720ca562cc845b8d20fb0c
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor:/opt/rcb_monitor:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
  rcb_robodojo_cache_trusted:
