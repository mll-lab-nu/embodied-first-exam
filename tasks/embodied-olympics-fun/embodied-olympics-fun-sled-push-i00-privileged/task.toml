schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-sled-push-i00-privileged"
description = "Embodied Olympics sled-push (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Push the weighted sled with your palms on its two upright handles until the whole sled is over the line 12.5 m ahead, within 60 s. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "sled-push"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "sled_push"
category = "parkour-apparatus-balance"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 8.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: positive by a declared injection on top of a real controller (the walking policy pushing with inverse-kinematics palm pads on the 1.04 m poles, plus an external force on the sled along its heading at the two handles, only while both palm pads are on their handles, topping its speed up towards 0.35 m/s, at most 30 N): the sled is wholly over the line at 58.0 s of 60 with 264 N s injected over 22.7 s (11.7 N on average); it is marginal (0.30 or 0.45 m/s, or a 50 N cap, fail: the sled leaves the lane or touches the body); negatives: nop, a body push, a palm on the deck, out of the lane, a fall. The controller alone moves the 5 kg sled (about 22 N to start on turf at friction 0.45) at most 9.8 m of the 12.5 m in 60 s: the palms press the poles partly downwards (about 15 N), which adds turf friction, and the sled drifts out of the lane in most of the 25 settings tried; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
