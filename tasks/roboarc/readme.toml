# README data for tasks/roboarc/*/README.md (scripts/task_conventions.py render_readme_v3).
#
# Sources checked for the success texts:
#   puzzle families  embodied_first_exam/benchmarks/roboarc/rcb_topogym.py (Session.step L3685-3727: a success or a task
#                    failure ends the episode; Session.replay L3934-3961; _GradingReplay and REPLAY_TOLERANCES
#                    L2955-3095; strict_goal L3087; load_trajectory L129-178; CONTACT_RULE / FORCING /
#                    BREAKDOWN_PENETRATION_M L1249-1257), privileged/grade.py (one grading replay; success = the replay
#                    succeeds AND reaches the goal within the rows, strict_goal; a review holds it), standard/sim/server.py
#                    (finish L163-178, judge_end L233-258: the end state and the rest of the confirmation window with the
#                    last targets held; the task's own stable_duration_s raised out of reach, ae_setup L186-210),
#                    standard/grade.py (the live verdict, review, infrastructure). The predicates are TopoGym's
#                    (topogym/tasks/<family>/, placement.py), read in RoboARC @ 153eb8c source/topogym, whose SOURCE.json
#                    hash (tools/release/source_hash.py) is c9171f79, the runtime source every task's binding names.
#                    Per-instance numbers (goal sizes, heights, radii, windows) are the release tooling's texts written
#                    from the frozen instances (cmd_describe, rcb_topogym.py L4894); the instances themselves are in the
#                    image only.
#   IKEA suite       embodied_first_exam/benchmarks/roboarc/ikea/privileged/environment/rcb_ikea.py (SETTLE_S, REST_*,
#                    BREAKDOWN_DEPTH_M L43-50; END_POSE_RULES L74; load_trajectory / _check_members L240-330; status /
#                    final_check / replay L1308-1366), ikea/privileged/tests/grade.py (main L76-206), ikea/sim/server.py
#                    (module docstring, finish L588-606), ikea/standard/tests/grade.py; each scene's success.py in
#                    images/ikea-mujoco/scenes/<item>/.

[benchmark]
name = "RoboARC"
citation = "The RoboARC authors, 2026"   # upstream CITATION.cff (authors not yet named)
url = "https://github.com/mll-lab-nu/RoboARC"
repo = "mll-lab-nu/RoboARC"
commit = "153eb8c"                       # RoboARC 1.0.0: its source/topogym is the simulator source these tasks run

[license]
text = """
RoboARC ([mll-lab-nu/RoboARC](https://github.com/mll-lab-nu/RoboARC) @ `153eb8c`) is released under the MIT License
(Copyright (c) 2026 The RoboARC authors). The robot models are MuJoCo Menagerie's: ALOHA 2 (BSD-3-Clause, Trossen
Robotics), Franka Emika Panda (Apache License 2.0) and Robotiq 2F-85 (BSD-2-Clause, ROS-Industrial). The furniture part
meshes of the furniture-assembly scenes are CC BY 4.0 (Hugging Face dataset `MLL-Lab/embodied-first-exam-public`,
`ikea-mujoco/`). The simulator is MuJoCo 3.14.0 (Apache License 2.0). RGB images are rendered with Nyx (`gs-nyx`), used
in the images with its owners' permission; the studio lighting is a CC0 HDRI from Poly Haven. Puzzle designs modelled
after Hanayama's Huzzle Cast puzzles and the IKEA product names and designs are used with the owners' permission. No
non-commercial terms apply.
"""

[robots]
aloha-2 = "ALOHA 2: two 6-DoF ViperX 300 s arms with parallel-jaw grippers (MuJoCo Menagerie)"
franka-robotiq-2f85 = "Franka Panda 7-DoF arm with a Robotiq 2F-85 parallel gripper (MuJoCo Menagerie)"
franka-panda-bimanual = "Two 7-DoF Franka Panda arms, each with the Panda hand (MuJoCo Menagerie)"

# The mode texts are shared by the puzzle families and the IKEA suite; what differs is in each family's `vars`:
#   privileged_rule  how the replay is judged (puzzles: rcb_topogym.Session.replay + privileged/grade.py strict_goal;
#                    IKEA: rcb_ikea replay_cli + final_check, ikea/privileged/tests/grade.py)
#   file_rule        what makes the deliverable invalid (rcb_topogym.load_trajectory; rcb_ikea.load_trajectory)
#   max_rows         the task's row cap (puzzles: RCB_MAX_STEPS in tests/Dockerfile; IKEA: --max-rows in tests/test.sh)
#   step_cap         the standard episode's step cap (puzzles: rcb_topogym.MAX_STEPS = 200000, no RCB_STEP_LIMIT; IKEA:
#                    none, RCB_STEP_LIMIT unset)
#   standard_rule    how the end of the live episode is judged (standard/sim/server.py judge_end; ikea/sim/server.py finish)
# Missing file: privileged/grade.py L95-96 (puzzles), ikea/privileged/tests/grade.py L90-92 (a link counts as missing).
# Instance check: Session(strict=True) / InstanceMismatch (puzzles); scene_files, runtime and initial_state_sha256 (IKEA).
[modes.privileged]
success = """
The verifier, in a separate sandbox without network, replays `/app/output/trajectory.npz` once, open-loop, in a fresh
process from its own copy of the frozen start.

{vars[privileged_rule]}

A missing file scores 0. So does an invalid one:
{vars[file_rule]}
- more than {vars[max_rows]} rows.

Before the replay the verifier checks the rebuilt scene against the task's runtime binding (its files and its initial
state); a mismatch is an infrastructure failure, not a score.
"""

# Standard: standard/sim/server.py + standard/grade.py (puzzles), ikea/sim/server.py + ikea/standard/tests/grade.py
# (IKEA). RCB_AGENT_END "1" and RCB_WALL_CLOCK_S "10800" (= [agent] timeout_sec) in every standard compose file; the
# service ends the episode with reason "timeout" when its clock, started at the agent's first request, runs out.
[modes.standard]
success = """
The graded episode is the one live episode in the `sim` service; nothing is replayed, and there is no reset. The
episode ends when the agent sends `/finish` or when the agent's session ends (at the latest after {timeout}, which the
service counts from the agent's first request){vars[step_cap]}.

{vars[standard_rule]}

Before the agent is served, the service checks the scene against the frozen instance; a mismatch is an infrastructure
failure, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# The puzzle families (rcb_topogym.py tooling). Each base's text is the one the release tooling wrote from the frozen
# instance and the task's predicate (topogym/tasks/<family>/, RoboARC @ 153eb8c source/topogym: the simulator source
# whose SOURCE.json sha256 c9171f79 every runtime binding names); a family entry holds its most common text, a [tasks]
# entry each base that differs. Rules shared by every base: see the comment above [modes].

[families."blanket_flatten"]
# predicate: topogym/tasks/blanket_flatten/ (RoboARC @ 153eb8c, source/topogym)
success = """
Success needs all of these:
- Cover at least 95% of the blanket's unfolded material area in top-down projection. Overlapping layers count only
  once, holes do not count, and a large outer bounding box is insufficient.
- The sheet must lie flat on the tabletop, fully in contact with the table surface: keep every cloth point at most 30
  mm above the tabletop and no more than 8 mm below it.
- No material edge may stretch beyond 1.15 times its original length. Raised corners or pulling the blanket taut in
  the air do not count.
- Release all target parts and disengage any assisted grasp. Withdraw the robot until there is at least 5 mm of
  verified clearance from every target part; opening the fingers while still touching or surrounding the target is
  insufficient.
- During confirmation, every target point or rigid body's linear speed must be at most 30 mm/s and its displacement
  from the start of confirmation at most 3 mm.
- Confirmation window: all of these conditions hold together for at least 0.5 s of simulated time. If one stops
  holding, the window starts again.

How the grader measures it:
- Simulator breakdown (a cloth particle faster than 20 m/s): the episode ends as an infrastructure error, not the
  agent's failure, unless an arm was forcing (even for one tick) within the 0.25 s before it: then it is the agent's
  failure (forced_breakdown: what broke and what forced it).
- The blanket is 0.6 m x 0.48 m (0.288 m^2), so the coverage needs at least 0.2736 m^2 of its area in the top view.
  Heights are measured at the cloth particles' centres.
- The release clearance is measured from one box around all cloth particles, grown by 8 mm: every robot collision box
  must stay at least 5 mm from it, i.e. at least 13 mm outside the cloth's bounding box, above its highest point too.
- Forcing: an arm drive (not a gripper drive) at 95% or more of its torque cap while that arm's gripper, or a part it
  holds, presses on anything else with 20 N or more in total. Forcing alone never ends the episode and never changes
  the score.

Failures:
- Any cloth point falling more than 100 mm below the tabletop ends the episode in failure.
"""

[families."blanket_flatten".vars]
privileged_rule = """
The rows run in order, one per control step, with the instance's own thresholds. The replay stops at the first success
or failure: a success is the conditions above holding for the whole confirmation window, and the rows after it are not
run. If the rows end first, the trajectory scores 0. A success that the verifier's 2 s hold of the last targets after
the rows reaches is not credited either."""
file_rule = """
- not a readable `.npz` file;
- no `actions` array of shape (T, action dimension) with numeric, finite values and T at least 1;
- a `task` entry other than the task's family key;
- an `action_layout` entry other than the frozen instance's;"""
step_cap = ", or after 200,000 control steps (holds count)"
standard_rule = """
These ends are judged on the end state. The conditions above must hold when the episode ends and keep holding, with
the last targets held, until they have held for the whole confirmation window; the time they already held before the
end counts. Meeting them earlier in the episode does not count, and the service never reports success while the
episode runs. A task failure (above) ends the episode at once and scores 0, even after a success; so does a simulator
error caused by the agent's actions."""

