# cloth_unpleat_physical_demo 的运行模式参数。

defaults:
  - default
  - _self_

# 顶缘怎么走。三条路径共用同一套测量，所以数字可以直接对比 —— 判据的阈值要卡在
# 「做对了」和「做错了」之间，只有一边定不出来。做法与 cloth_fold 的标定相同。
#   unfold   顶缘绕下折痕转到平铺位置，就是任务本身
#   press    从顶缘正上方直接下压，把褶皱压塌（docx 1.2 点名的捷径：
#            「把褶皱直接压塌也能让高度达标，但层数与长度守恒检测不过」）
#   overpull 沿同一条弧线拉过头，越过平铺位置继续走。它三条判据都会过 ——
#            记录它是为了看整条布带被拖走了多少（band_shift），
#            以及确认那不是靠位置阈值就能挡住的东西
motion: unfold

# overpull 比正确行程多走多少倍弧长。
overpull_scale: 1.6

# 机械臂退开之后再空跑多少步才停止录制（dt=0.01，100 步 = 1 秒）。
# 让视频最后是一段布已经落定、机械臂已经让开的稳定画面，便于截图看结果。
# 这是录制上的事不是任务定义，所以在 run 而不在 task —— 松手后的物理沉降是
# task.physical.release_hold_steps，两者管的不是一回事。
final_hold_steps: 100
