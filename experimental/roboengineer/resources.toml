# Experimental proposal resources; not part of the accepted task registry.
# Quadrotor policy adaptation; CPU OSMesa rendering, no accelerator.
[[rule]]
match = "^quadrotor-landing-.*-standard$"
min_cpus = 6.0
min_memory_gb = 8.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 5.0
verifier_min_gpu_memory_gb = 0.0
measured = "native Harbor 0.23.0 oracle/nop verified on 8-vCPU/16-GiB AWS c7i.2xlarge, CPU MuJoCo/OSMesa; declared minima remain conservative estimates"

[[limit]]
match = "^quadrotor-landing-.*-standard$"
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 4.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 9.0
measured = "native Harbor oracle/nop passed with enforcement on both instances; conservative 4 GiB agent / 5 GiB simulator budgets and process/disk design defaults retained"

[[cap]]
match = "^quadrotor-landing-.*-standard$"
main = { cpus = 2.0, memory_gb = 6.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 6.0, pids = 8192 }

[[rule]]
match = "^control-transfer-.*-standard$"
min_cpus = 6.0
min_memory_gb = 12.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 6.0
verifier_min_gpu_memory_gb = 0.0
measured = "provisional caps; CPU adapter smoke runs only, native container peak measurements pending"
[[rule]]
match = "^control-transfer-(linearbot|g1).*"
min_cpus = 12.0
min_memory_gb = 30.0
min_gpu_memory_gb = 24.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "RTX 4090 24GB or larger CUDA GPU"
measured = "provisional training allocation; convergence and native GPU resource calibration pending"
[[limit]]
match = "^control-transfer-.*-standard$"
scope = "agent"
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
max_gpu_memory_gb = 0.0
max_memory_gb = 4.0
max_processes = 512
max_disk_gb = 20.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 12.0
measured = "provisional generous caps; native validation pending"
[[limit]]
match = "^control-transfer-(linearbot|g1).*"
scope = "agent"
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
max_gpu_memory_gb = 24.0
max_memory_gb = 20.0
max_processes = 512
max_disk_gb = 40.0
trial_max_gpu_memory_gb = 24.0
trial_max_memory_gb = 30.0
measured = "provisional training budget; not a measured minimum"
[[cap]]
match = "^control-transfer-.*-standard$"
main = { cpus = 2.0, memory_gb = 6.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 6.0, pids = 8192 }
[[cap]]
match = "^control-transfer-(linearbot|g1).*"
main = { cpus = 8.0, memory_gb = 24.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 6.0, pids = 8192 }
