schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robotangle-horseshoe-ring-easier-i00-privileged"
description = "RoboTangle horseshoe_ring (ALOHA 2, Genesis): produce one replayable trajectory. Separate and place the entire removable ring inside the green dashed goal region. Keep the horseshoes and chains on the puzzle/system side. Frozen scene instance (variation easier, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "aloha", "code-as-policy", "trajectory", "horseshoe_ring"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "19"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robotangle"             # RoboTangle on Genesis 1.2.1 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "horseshoe_ring"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "full"
difficulty = "easier"               # the variation's tier (docs/TAXONOMY.md)
grasp = "assisted (the contact_weld_v1 grasp regions on horseshoe_left, horseshoe_right, target_ring)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision placement_region_v3_grasp_contact_2mm)"
instance_seed = 0                 # scene = environment/instance.json (variation easier, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
