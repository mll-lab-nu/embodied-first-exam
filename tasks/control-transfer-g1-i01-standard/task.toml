schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, { source = "/data/", service = "sim" }, "/app/output/"]
[task]
name = "robot-coding-bench/control-transfer-g1-i01-standard"
description = "Train a blind 29-DoF Unitree G1 policy in mjlab/MuJoCo Warp and transfer to CPU MuJoCo over flat, sloped, rough and stepped terrain. Stand 2 s, then follow a public forward velocity command of 0.5–0.65 m/s for 18 s."
authors = [{name = "Robotic Engineering Bench contributors"}]
keywords = ["robotics", "policy", "adaptation", "mujoco"]
[metadata]
author_name = "Robotic Engineering Bench contributors"
author_org = "Robotic Engineering Bench"
collection = "roboEngineer"
embodiment = "humanoid"
task_type = "policy"
simulator = "mujoco"
robot = "unitree-g1"
family = "control-transfer/g1"
mode = "standard"
protocol = "eai-policy/1.1"
oracle = "none"
oracle_evidence = "No full oracle. The local trained reference passes 17 of 24 held-out cases; both plants remain incompletely solved. Native GPU training validation remains outstanding. Human review required."
instance_seed = 1
expert_time_estimate_hours = 4.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 12.0
min_memory_gb = 30.0
min_gpu_memory_gb = 24.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "RTX 4090 24GB or larger CUDA GPU"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 6.0
verifier_min_gpu_memory_gb = 0.0
measured = "provisional training allocation; convergence and native GPU resource calibration pending"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 24.0
max_memory_gb = 20.0
max_processes = 512
max_disk_gb = 40.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 24.0
trial_max_memory_gb = 30.0
measured = "provisional training budget; not a measured minimum"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 8.0, memory_gb = 24.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 6.0, pids = 8192 }

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"
# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "sim"
command = "python -m scripts.control_transfer.trusted.collect"
timeout_sec = 1800
[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 2400.0
cpus = 8
memory_mb = 24576
[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
