schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-clean-and-jerk-i00-privileged"
description = "Embodied Olympics clean-and-jerk (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Clean and jerk the barbell: lift it from its blocks to your shoulders, then to locked arms overhead, and hold it there motionless until the down signal. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "clean-and-jerk"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "clean_and_jerk"
category = "parkour-apparatus-balance"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 14.0
oracle = "full"
oracle_evidence = "Reference (real, lowcmd rows, a quasi-static whole-body plan) for a block clean & jerk: the 5 kg technique bar on two 0.35 m lifting blocks (axis 0.375 m above the platform; declared: on 0.20 m blocks the squat would need the hips flexed past where the hip links meet the pelvis, and 52 squats tried all fell onto a thigh or knocked the bar). On 0.20 m blocks the planner's bottom poses put the hips 15 to 46 mm into the pelvis, or the thumbs into the knees. Heavier bars: with the women's 15 kg bar every path of the clean's turnover passes a pose with the bar level with the elbow joint, where the best arm pose found (with a gripper whose grip was 0.11 m further from the wrist) needs 1.08 to 1.17 times the elbow and shoulder motors' torque (0.54 with 5 kg); 10 kg (the bar on two 2.5 kg technique discs) topples the robot backwards at the turnover. It squats (knees 1.2 rad, pelvis 0.8 rad), closes the H1-2's own Inspire hands (their default forces, 20 N per fingertip, 30 N the thumb; no factor) round the bar, stands up, cleans to the shoulders, presses overhead and holds to the down signal: success at 20.29 s, no arm into the robot's own body; live, replay and the state hash agree. 4 of 7 neighbours succeed (servo gains x0.97 / x1.03, a squat at knees 1.4 / pelvis 0.9); a shallower squat, the bar 1 cm nearer or farther and the plan 10 % slower fail. Negatives: nop (time), the 0.20 m blocks' deeper squat (falls onto a thigh), the right hand never closed (no clean), both hands opened above knee height (let go), pushed over backwards, off the platform, the barbell on the floor, a foot on a block; stress: random arm targets at the rack. Measured: success after 20.29 s of the 60 s limit, live and in a fresh replay, ending in the same state."

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
