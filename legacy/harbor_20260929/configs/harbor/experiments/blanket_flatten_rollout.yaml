# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: blanket_flatten_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: blanket-flatten-medium-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Unfold and spread the blanket flat on the table. Remove folds, rolls and
      self-overlaps so the fabric covers its unfolded footprint without excessive
      stretching. Release the blanket, withdraw the grippers and let it settle flat
      and still on the tabletop.
    simulator:
      task_id: blanket_flatten
      robot_id: auto
      variation_id: medium
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
