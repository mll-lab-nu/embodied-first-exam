# ---------------------------------------------------------------------------------------------------------------------
# Families. Each text states the task's update_task (file and lines in the comment) with the nominal parameters of its
# instance.json; "catch" = predicates.cup_catch (entry: previous local z > H + r >= local z, max |local xy| < h - r,
# >= 25 ms without any contact; then containment held 0.18 s), "contained" = predicates.containment (max |local xy| <
# h - 0.45 r, r - 0.004 < local z < H - 0.12 r, supported within 25 ms, relative speed < 0.09 m/s).

[families.d01_reciprocal_cup_relay]
# P/tasks/dual/reciprocal_cup_relay.py update_task L86-160: cup_catch (tool_half 0.06, tool_height 0.028, radius
# 0.018); free_interval > 0.045 and z > 0.30 / 0.31; right_entry_speed (horizontal tool speed at the entry) <
# receiver_min_speed 0.15 -> right_cup_not_moving_at_catch; displacement from right_start > 0.04; SECOND_REGION within
# 0.035 + containment in the right cup; reverse_release (last contact right cup only) offset > release_radius 0.035 ->
# throw_back_outside_second_region; cart containment (0.075, 0.06) and |cart.v| > 0.02 and no left-cup contact, 0.7 s.
# No ALLOW_* attributes: each tool may touch objects only (the ball). horizon 25.
success = """
The left cup is panda-0's tool and the right cup panda-1's; each cup is 0.12 m square inside with 28 mm walls, and its
frame has its origin at the centre of its floor's top surface. The ball's radius r is 18 mm.

Phases, in order:
1. `left_initial_catch`: the left cup catches the ball.
2. `left_to_right_flight`: the ball is free of all contact for more than 45 ms with its centre above z = 0.30 m.
3. `right_catch`: the right cup catches the ball, and the right cup's frame is more than 4 cm from where it started.
   If the catch holds while the right cup's horizontal speed, taken when the ball entered it, was below 0.15 m/s, the
   task fails.
4. `second_region`: the right cup's frame is within 35 mm of the second transfer point (0.13, 0.15, 0.24), with the
   ball contained in the right cup.
5. `right_to_left_flight`: the ball is free of all contact for more than 45 ms with its centre above z = 0.31 m. Its
   last contact before that must have been with the right cup alone, at a ball position within 35 mm (horizontally) of
   (0.13, 0.15); otherwise the task fails.
6. `left_catch_and_deliver`: the left cup catches the ball; after that the ball is contained in the cart (inner
   half-width 0.075 m, wall height 0.06 m), the cart slides at more than 0.02 m/s and the ball does not touch the left
   cup, for 0.7 s.

A catch: after at least 25 ms without touching anything, the ball's centre passes downward through the plane r above
the cup's rim height (cup frame) while more than r inside the inner walls in x and y; after that the ball is contained
in the cup for 0.18 s. Contained in a receptacle of inner half-width h and wall height H: in the receptacle's frame
(origin at the centre of its floor), the ball's centre is less than h - 0.45 r from the centre in x and in y and
between r - 4 mm and H - 0.12 r above the floor, the ball touched the receptacle within the last 25 ms, and its speed
relative to the receptacle is below 0.09 m/s.

Allowed contacts: each cup may touch the ball; no other robot part may touch anything.
Horizon: 25 s of simulated time (2,500 control steps).
"""

[families.d02_strike_catch_merge]
# P/tasks/dual/strike_catch_merge.py update_task L137-177: first_airborne (free_interval > 0.025) then contact with
# left_tool; cup_catch (tool_half 0.07, height 0.055 default, radius 0.016); relocation > 0.06 with containment (0.07,
# 0.055, 0.016); second catch with ball1 contained; basin containment (0.08, 0.075, 0.016) and no right_tool contact for
# both balls, 0.7 s; first_ball_spill in phases 2-4 (|local xy| > tool_half or local z < -0.01). horizon 25.
success = """
The left paddle is panda-0's tool and the right cup panda-1's; the cup is 0.14 m square inside with 55 mm walls, and its
frame has its origin at the centre of its floor's top surface. Ball 1 starts on the lane at y = -0.09 m, ball 2 on the
lane at y = 0.09 m; each ball's radius r is 16 mm. The lane gates open by themselves.

Phases, in order:
1. `first_redirect`: the paddle touches ball 1, after ball 1 has been free of all contact for more than 25 ms at some
   moment of this phase.
2. `first_catch`: the cup catches ball 1.
3. `loaded_cup_relocation`: the cup's frame is more than 0.06 m from where it was when phase 2 completed, with ball 1
   contained in the cup.
4. `second_redirect`: the paddle touches ball 2, after ball 2 has been free of all contact for more than 25 ms at some
   moment of this phase.
5. `second_catch`: the cup catches ball 2 while ball 1 is contained in the cup.
6. `both_delivery`: both balls are contained in the basin (inner half-width 0.08 m, wall height 0.075 m) and neither
   touches the cup, for 0.7 s.

A catch: after at least 25 ms without touching anything, the ball's centre passes downward through the plane r above
the cup's rim height (cup frame) while more than r inside the inner walls in x and y; after that the ball is contained
in the cup for 0.18 s. Contained in a receptacle of inner half-width h and wall height H: in the receptacle's frame
(origin at the centre of its floor), the ball's centre is less than h - 0.45 r from the centre in x and in y and
between r - 4 mm and H - 0.12 r above the floor, the ball touched the receptacle within the last 25 ms, and its speed
relative to the receptacle is below 0.09 m/s.

Task failure: during phases 3 to 5, ball 1's centre more than 0.07 m from the cup's centre in x or y, or more than 10
mm below the cup floor (cup frame).
Allowed contacts: the paddle and the cup may touch the balls; no other robot part may touch anything.
Horizon: 25 s of simulated time (2,500 control steps).
"""

[families.d03_cooperative_puck_course]
# P/tasks/dual/cooperative_puck_course.py update_task L116-186: strike = contact with the stage's tool while that
# tool's speed > 0.035 and > 0.06 s after the last strike; pass = free (no contact with that tool, > 0.035 s after the
# strike) and crossed(passages[stage]) with half 0.055, direction -1 for stage 1; goal crossed(goal, half 0.05).
# Nominal: volley_speed, volley_window, diagonal_angle = 0 (no extra rule). horizon 25.
success = """
The left paddle is panda-0's tool and the right paddle panda-1's. Each phase is a strike by one paddle followed by a
pass of the puck across a line.

Phases, in order:
1. `left_first_pass`: the left paddle strikes the puck; then the puck crosses the line x = 0.12 m heading +x within 55
   mm of y = -0.13 m.
2. `right_return_route`: the right paddle strikes it; then it crosses x = 0.12 m heading -x within 55 mm of y = 0.19 m.
3. `left_diagonal_pass`: the left paddle strikes it; then it crosses x = 0.12 m heading +x within 55 mm of y = 0.025 m.
4. `right_terminal_shot`: the right paddle strikes it; then it crosses the goal line x = 0.46 m heading +x within 50 mm
   of y = -0.02 m.

A strike: a contact of that phase's paddle with the puck while the paddle moves faster than 0.035 m/s, more than 60
ms after the previous strike. A crossing: the puck's centre passes the line during one physics step; it counts only
while the puck does not touch the paddle that struck it and more than 35 ms after the strike.

Allowed contacts: each paddle may touch the puck; no other robot part may touch anything.
Horizon: 25 s of simulated time (2,500 control steps).
"""

