the flip-up door and lift the cube that started behind the double doors (not the one you put there) up
into it.'''
scene_note = "the cabinet, the cubes and the robot's initial pose never change between resets."
scoring_note = '''Only the compartment you are currently on is scored. Each step pays a small share for
standing steadily and the bulk for progress on that one compartment; completing it pays a one-off bonus
and moves the scoring on to the next. Those bonuses grow with how many you have finished, and together
they are a large fraction of the bar — so stalling on the first compartment caps the episode well short
of it, however cleanly that compartment is opened.'''
