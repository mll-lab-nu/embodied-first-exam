# badminton: robot singles badminton in real time (docs/framework_zh.md §4.2, §8). Migrated from the legacy tree in
# stage 3 (scripts/olympiad/badminton, scripts/olympiad/shared/badminton; sim/bm.py: court, shuttle, robot, stroke
# controller, scripted opponent, referee; sim/bduel.py: the two-robot match; sim/wc.py: the legacy planner's exact
# snapshots and plan installation). The physics (shuttle drag, racket contact law, robots) is the legacy one; the
# serve is not: since 2026-10-07 the players' robots serve by the BWF service laws (D2, D4, D6, D7; README), so the
# legacy machine-serve recordings no longer apply and were retired from the golden set. The format names keep the
# legacy task names (badminton-match-wallclock-program-standard, badminton-duel-wallclock-program-standard).
# Since revision wallclock-8 / duel-10 (user decision 2026-10-08, "real physics, a smaller court"): every body obeys
# real-robot limits (the Franka Panda's FCI limits, a Festo EGC gantry), the racket's gain is the physically justified
# 4 (not 20), and the court is the BWF court x 0.4 with the net at its BWF height (D8, D9; README, docs/benchmarks/
# badminton-minicourt-20261008.md).

[sport]
name = "badminton"
title = "Robot badminton"
summary = "robot singles badminton on a small court (the BWF court's lengths x 0.4, the net at its BWF height 1.524 m) in real time (slowed down): a Franka Panda arm held to the real Panda's limits, with a racket, on an x-y gantry of ball-screw axes (2 m/s, 15 m/s^2), a point-mass shuttle with the real shuttle's high quadratic drag (terminal speed 6.8 m/s) and no bounce, a racket contact law of gain 4 (shuttles leave the racket at up to about 10 m/s); rally scoring, one game to 11 points; the players' robots serve (the rally winner serves next): the server tosses the shuttle (from rest or rising up to 0.5 m) at a point it chooses and hits it underhand, below 1.15 m, into the diagonal service court; format match-wallclock: you against a scripted computer opponent (levels 1-3, `game spec` match.opponent_level), format duel-wallclock: two players"
protocol = "realtime"
revision = "badminton-wallclock-12+duel-14+core-0.2"   # bump on any change that alters play (4/6: the players serve; 5/7: the players' images draw the arms with the Franka Panda's 25k visual meshes; 6/8: every undue delay is a service fault, no disqualification; 7/9: independent execution-scatter streams, swapped by the duel pair; 8/10: real physics on a small court: gain 4, the Panda's limits, the EGC gantry, the court x 0.4; 9/11: self-collision: the arm and racket collide with the robot's own stand and links, the stroke controller keeps clear of them; 10/12: the arm's setpoint generator brakes within the jerk in force, bodies/limits.JerkLimiter: no ringing at the torque-rate jerk caps; 11/13: the screening (docs/screening/badminton.md): a game to 11 in both formats, the Festo EGC-185-BS-KF-40P base (2 m/s, 15 m/s^2), no automatic return (move, act base), a placement-sensitive scripted opponent held to the same base that reads habits, blocks, lifts over a robot at the net and goes for winners, three levels; 12/14: the joint-velocity rule (the user's decision of 2026-10-13, as table tennis 15/12): the arm's setpoint generator and the stroke controller at 0.9 of the velocity limits, and the velocity reflex (a physical arm joint faster than 1.05 x its limit stops the robot for 1 s, the gantry braking within its limits, then it resumes from rest))
physics = "mujoco (robots at 1 ms: the arm through the Franka Panda's setpoint generator and torque limits, the base by PD within the gantry's force) + a point-mass shuttle with quadratic drag integrated at 1 ms (sim/bm.py)"
image = "ghcr.io/mll-lab-nu/efe:embodied-olympics-match-0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[arm]                                  # the real robot the arms are held to (bodies/franka_panda/body.toml, bodies/limits.py)
body = "franka_panda"                  # the scene's arm is MuJoCo Menagerie's Panda (panda_nohand)
joints = "^joint(?P<j>[1-7])(?P<arm>_b)?$"   # tools/arm_limits.py: the arm joints of the scene (the duel's B: _b)

[rulebook]
name = "BWF Laws of Badminton (BWF Statutes, Section 4.1, version 5.0)"
version = "2025-04-26"
url = "https://extranet.bwf.sport/docs/document-system/81/1466/1470/Section%204.1%20-%20Laws%20of%20Badminton%20-%2026%20April%202025%20V5.0%20(2)%20.pdf"

[[deviations]]
id = "D1"
rule = "7"
text = "one short game instead of best of three games to 21 (cap 30): first to 11 points (one game of the 5 x 11 scoring BWF has trialled), from 10-10 a two-point lead is needed, at most 15 (14-14: the next point wins); the match also ends after 400 hits (both sides) or 40 points played (lets included): the player ahead wins, at equal points the winner of the last point"
affects_result = true
[[deviations]]
id = "D2"
rule = "9.1.5-9.1.8"
text = "the robot has no free hand to hold and drop the shuttle: the server tosses it with the command toss {pos: [x, y, z], height: H} (the common racket-sport toss, docs/conventions/racket_serve_zh.md): when the command takes effect the shuttle appears at that point (0.5-1.8 m high, within 1.0 m horizontally of the server's base, on its half) and is released from rest (H = 0) or projected straight up to rise H (at most 0.5 m; the Laws do not forbid a small toss); until then it is held beside the server. The toss has no spin (a point mass has none, Law 9.1.5). Judged: the server's racket must hit it (a miss is a fault, Law 9.1.8), with the shuttle below 1.15 m at the hit (Law 9.1.6, judged at the shuttle's point: it has no size) and leaving the racket upwards (Law 9.1). Not judged: the racket hitting the base of the shuttle first and moving forwards throughout the service (Laws 9.1.5, 9.1.7)"
affects_result = true
[[deviations]]
id = "D3"
rule = "13.3-13.4"
text = "the shuttle is a point mass: a crossing of the net plane below the net top (between the posts) is a fault of the hitter; touching the net or reaching over it is not judged; a racket meets the shuttle only on its own half and only when it is that player's turn (no double hits)"
affects_result = true
[[deviations]]
id = "D4"
rule = "9.1.3-9.1.4"
text = "before every serve the referee puts both robots at rest in the ready pose at a fixed spot in their service courts (diagonally opposite: the right courts when the server's score is even, Law 10.1): x = +0.12 (right court) or -0.12 (left court), y = -1.6 in each robot's frame (the legacy spot 0.3 / 4.0 m x 0.4); after the serve there is no automatic return: a base stays where it struck until its player moves it (`move`). Standing still (Law 9.1.4) is judged on the base: a base more than 5 cm from its spot before the serve is delivered (hit, or faulted) is that player's fault; both at once: a let (Law 14.2.2). The base is a real gantry of ball-screw axes (Festo EGC-185-BS-KF-40P, spindle axes EGC-BS-KF technical data: 2.0 m/s, 15 m/s^2, feed force 3000 N, working stroke up to 3000 mm; jerk 25 x the acceleration, estimated; a low-level command is refused beyond its speed and per-axis acceleration) and moves within |x| <= 1.5, -3.53 <= y <= -0.5"
affects_result = true
[[deviations]]
id = "D8"
rule = "1.1-1.6, 1.10"
text = "a small court: every line of the BWF court at 0.4 of its length (singles court 2.072 x 5.36 m: side lines at |x| = 1.036, back lines at |y| = 2.68, short service lines 0.792 m from the net, doubles side lines (posts) at |x| = 1.22; the singles back line is also the long service line, as on a singles-only court); the net keeps its BWF height (1.524 m at the centre). Why: with real-robot limits the shuttle leaves the racket at about 10 m/s at most (D9), and the real shuttle's drag (terminal speed 6.8 m/s, kept) carries it about 4-5 m: the 13.40 m court cannot be played (a clear needs 40-50 m/s). The robot is human-sized (its racket meets shuttles 0.4-2.5 m high), so the net is not scaled. No official reduced format is this short (the shortest are the junior mini-badminton courts, about 11.9 m, nets 1.30-1.40 m; wheelchair singles' live depth 4.72 m per side): the scale follows the robot's measured range (docs/benchmarks/badminton-minicourt-20261008.md)"
affects_result = true
[[deviations]]
id = "D9"
rule = "-"
text = "the robots: a Franka Panda arm held to the real Panda's joint velocity, acceleration, jerk, torque and torque-rate limits (bodies/franka_panda) on a real gantry (D4); the racket is not simulated as a string bed: a contact law sends the shuttle along the face normal at 4 x the head speed along the normal (a real racket gives about 1.5 x; 4 lets the Panda's best swing, about 4.4 m/s, stand for that of a real fast badminton arm, ANYmal + DynaArm 2025, 10-12 m/s: the real-limits audit's option c)"
affects_result = true
[[deviations]]
id = "D5"
rule = "-"
text = "the last resort of the no-draw rule (equal points at the match limit and no point won) is not from the rulebook: the player who received first wins (format match-wallclock: the opponent)"
affects_result = true
[[deviations]]
id = "D6"
rule = "9.1.1, 16.6-16.7"
text = "undue delay has a fixed limit: the server must toss the shuttle within 3 s after the receiver is ready (1 s after play resumes, Law 9.4), else it is a service fault (the receiver wins the rally: its point and the next serve); every undue delay is such a fault, never a disqualification, instead of the umpire's warning and the referee's discretion (Laws 16.7.1-16.7.2)"
affects_result = true
[[deviations]]
id = "D7"
rule = "6"
text = "no toss: format duel-wallclock: the runner plays both orders of the first server (match.first_server); format match-wallclock: you serve the first point"
affects_result = true

[formats.match-wallclock]             # one model seat against the scripted opponent inside the world (bm.Match)
seats = ["A"]
opponent = true                       # success = winning a valid match (core/grading.py), as in the legacy task
levels = [1, 2, 3]                    # the opponent level (RCB_LEVEL; default 1; revision wallclock-11: L3 a ceiling level)
[formats.duel-wallclock]              # two seats (bduel.World), mirrored: each plays in its own frame
seats = ["A", "B"]
first = ["A", "B"]                    # the first server (Law 6, D7); the runner plays both orders

[modes]
action_levels = ["high", "low"]       # high: the racket command `act` (lowered to joint targets); low: joint targets
plays = ["program"]
b9_test = "test_b9_serves_returnable_by_an_informed_receiver"   # robot and mode rule 2 (the full study: docs/benchmarks/
                                      # badminton-minicourt-20261008.md; re-run in docs/screening/badminton.md)

[modes.high]                          # Agent as Athlete (docs/construction_zh.md step 3; screening: docs/screening/badminton.md)
skills = ["act", "toss", "move"]            # the racket's state at contact; the serve's toss
contract = "skill_api.py"             # CONTRACTS: ranges, timing, feedback, control authority, failures (P6)
implementation = "plugin.py:RacketLayer"   # the platform's stroke controller (sim/bm.py Match.plan_racket)

[modes.low]                           # Agent as Robotics Engineer: the player implements the same act skill (lowlevel/README.md)
implements = ["act"]
toolkit = "seat/toolkit.toml"         # the manifest (skilleval/toolkit.py: sha256-checked)
toolkit_path = "/opt/robot/toolkit.toml"   # where the seat has it
tools = ["joint_interface", "robot_model", "robot_meshes", "ik_library", "servo_model"]
forbidden = ["act"]                   # the core skill: never given at the low level
evaluator = "lowlevel/evaluator.py"   # hooks of skilleval/evaluate.py (API test, competition test)
reference = "lowlevel/reference"      # our act from the toolkit only, with rehearsals on the servo model (rule 4)
boundary = "lowlevel/boundary"        # the IK block: IK to the requested pose at a stance + the fastest move there, no swing (rule 5)
reference_results = "lowlevel/reference_results.json"   # platform / reference / boundary rows (tools/skill_eval.py --record)
thresholds = { reference_min = 0.8, boundary_max = 0.05 }   # API-test success rates (lowlevel/README.md; as table tennis)
eval_pip = ["scipy==1.18.1"]          # the evaluation image = the sim image + the seat's scipy (the deliverable may use it)
[modes.low.deliverable]               # robot and mode rule 10
path = "/app/output/skill/act.py"
signature = "act(t, pos, normal, vel, base=None, *, state, spec) -> one low-level command ({'type': 'traj', 'q': rows of 9 targets [base_x, base_y, q1..q7], row i for control step state['step'] + i} | {'type': 'none'}) or None"
optional = ["step(*, state, spec) -> a command or None (called every 20 ms between acts)"]
allowed = "numpy, scipy, mujoco, the toolkit under /opt/robot (robot_only.xml, assets, lib/bm_kinematics.py, lib/bm_servo.py) and files inside /app/output/skill; module-level memory between calls of one run; state = the low level's observe state (no images, no shuttle coordinates) with step, spec = game spec's joints, limits, toolkit, skill_contract; no network, no other files, no other processes"
memory = "per_case"                   # API test: a fresh process per request; competition test: one process per match
time_limits_s = { load = 30, act = 5, step = 1 }
[modes.low.cases]                     # skilleval/cases.py; rebuilt by `python3 lowlevel/evaluator.py record DIR` + `make-cases DIR`
hidden = "lowlevel/cases/hidden.jsonl.gz"   # simulator side only (the requests and their replay start states): never in the seat, not in generated tasks
public = "lowlevel/cases/public.jsonl"      # the practice subset (request, the robot's state, our implementation's plan)
practice_path = "/opt/robot/act_cases_public.jsonl"

[timing]
slowdown = 20                         # the legacy default (RCB_SLOWDOWN; official 1, 2, 5, 10, 20)
start_timeout_s = 1800                # the second seat may start up to 30 min after the first (legacy START_TIMEOUT_S)
ready_timeout_s = 300                 # each review after a point (legacy READY_TIMEOUT_S), else the late side loses

[actions.cli]                         # `game none`; act takes vectors: `game act '{"type": "act", "t": 0.8, ...}'`
high = { none = [] }
low = { none = [] }

[seat.low]                            # the low action level's toolkit (seat/toolkit.toml 1.2.0): the robot's own model, MuJoCo, the kinematics library, the servo model
files = { "/opt/robot/robot_only.xml" = "seat/robot_only.xml", "/opt/robot/assets" = "sim/scene/assets", "/opt/robot/lib/bm_kinematics.py" = "seat/lib/bm_kinematics.py", "/opt/robot/lib/bm_servo.py" = "seat/lib/bm_servo.py", "/opt/robot/toolkit.toml" = "seat/toolkit.toml", "/opt/robot/act_cases_public.jsonl" = "lowlevel/cases/public.jsonl" }
pip = ["mujoco==3.3.7", "absl-py==2.5.0", "etils==1.14.0", "fsspec==2026.9.0", "glfw==2.10.2", "PyOpenGL==3.1.10",
       "typing_extensions==4.16.0", "zipp==4.1.0"]   # = the sim image's MuJoCo and its closure (as table tennis)
run = ["python -c \"import mujoco; m = mujoco.MjModel.from_xml_path('/opt/robot/robot_only.xml'); assert (m.njnt, m.nu) == (9, 9)\"",
       "python -c \"import sys; sys.path.insert(0, '/opt/robot/lib'); import bm_kinematics as k, bm_servo; K = k.RacketKinematics(); q, e = K.solve([0.3, -1.0, 1.2], normal=[0, 1, 0], base=[0.0, -1.6]); assert e < 1e-3, e; bm_servo.RobotSim()\""]
note = "Your robot's own model is /opt/robot/robot_only.xml (MJCF: the base, the pedestal, the arm and the racket only, nothing of the world; meshes in /opt/robot/assets), with MuJoCo at the simulator's version. Your toolkit (/opt/robot/toolkit.toml) also holds two optional libraries: /opt/robot/lib/bm_kinematics.py (RacketKinematics: forward kinematics and Jacobians of the 9 joints, damped least-squares IK of the racket head centre and string-face normal with the base at a given position, the self-collision clearance, the base's go-to law) and /opt/robot/lib/bm_servo.py (RobotSim: your robot's own servo law on the robot-only model, to roll your joint targets out before you send them, from the observed state q, qd, q_target, servo; it models the joint-velocity rule: the servo runs the arm at 0.9 of its velocity limits, and an arm joint faster than 1.05 x its limit stops the robot for 1 s - game spec limits.velocity_rule, the state's servo.reflex). There is no act skill or stroke controller at this level: implementing act(t, pos, normal, vel[, base]) is your engineering task (game spec skill_contract; the practice requests /opt/robot/act_cases_public.jsonl: each the request, the robot's state and our implementation's plan). The act contract: the racket head centre at pos, its string-face normal along normal (either face) and its velocity vel at the contact step (base, when the request gives it: where your base stands at contact; it is passed as a fifth positional argument only when given) k_c = k_eff + round(t / 0.01) (k_eff: the step your act's command takes effect); within 2 cm, 3 degrees and 0.15 m/s + 10 % of |vel|, with no refused command. The match itself is graded as before. Start the match (`game start`) within the start window (timing.start_timeout_s, 30 minutes) even if your skill is not finished: a seat that has not started by then loses by no-show; you can keep improving the skill during the reviews between points"

[observation]
fields = ["score", "point", "ball", "t_since_played", "heard", "robot_base_xy", "q_arm", "racket_pos", "racket_normal",
          "ball_in_play", "ball_state", "serve_in_s", "you_receive_serve", "serve", "command", "pending_commands",
          "last_points", "last_shots", "opponent_level", "q_target", "you_serve", "q", "qd", "qd_target", "servo"]
renderer = "mujoco"                   # the sport draws its own views (the legacy 2 x 4 tiles, MuJoCo; plugin.Views)
frame_budget_ms = 4000                # one observation, 8 tiles of 480 x 360 (CPU osmesa, a loaded host)
columns = 4
# Since wallclock-5 / duel-7 the arms are drawn with the Franka Panda's visual meshes (presentation/
# presentation.toml players = "25k", bundled into the simulator; renderer rule 6). Measured 2026-10-08 (observations
# with new tiles, 30 control steps apart, osmesa, 6 CPUs, host load ~8-10 on 32 cores), median / p95 ms per observation
# at 2 llvmpipe threads: match scene 137 / 171 (duel 142 / 190), 25k meshes 154 / 195 (duel 192 / 220); 1 thread:
# 223 / 255 (223 / 249) and 254 / 281 (303 / 357)
render_threads = 2                    # llvmpipe threads per render process (LP_NUM_THREADS); one render process per seat
sim_cpus = 6                          # the sim container: 2 seats x 2 render threads + the world, the planners and the core

[spec]                                # the rule constants (the simulator's values; tests/test_badminton.py checks them)
match = "rally scoring, one game: first to 11 points; from 10-10 a player must lead by 2, and at 14-14 the next point wins (at most 15); the match also ends after 400 hits (both sides) or 40 points played (replayed lets included): then the player with more points wins, at equal points the player who won the last point"
play = "there is no bounce: hit the shuttle before it reaches the floor. Your shot is good if your racket meets the shuttle once, on your half, and the shuttle passes over the net and lands in your opponent's singles court (lines are in); after your hit your racket no longer touches it. You lose the point if your shot goes into the net (crosses the net plane below the top), comes down on your own side or lands out, or if a shuttle that is yours to hit lands in your court; an opponent's shot that would land out of your court wins you the point, so you may let it go. Serves (BWF Law 9): the winner of a rally serves the next point (after a let the same server; state.you_serve, state.serve). Before every serve both robots are put at rest in the ready pose at their spots: x = +0.12 in the right service court or -0.12 in the left one, y = -1.6 (your frame); both stand in their right courts when the server's score is even, else in their left ones (diagonally opposite); the spot is your base's home for the point. From 1 s after play resumes (the receiver is ready; state.serve.phase 'open') the server has 3 s to toss the shuttle with {'type':'toss','pos':[X,Y,Z],'height':H}: when the command takes effect (the same lead as an act) the shuttle appears at that point (0.5 <= Z <= 1.8, within 1.0 m horizontally of your base, Y <= -0.5) and is released from rest (H = 0 or omitted) or rises H straight up (0 <= H <= 0.5) before it falls (until then it is held beside the server). Then hit it with your racket (an act, which you may send before the toss): the serve is good if your racket meets the shuttle below 1.15 m, the shuttle leaves the racket upwards, passes over the net and lands in the receiver's diagonally opposite service court (between its short service line and its back line, lines in) or is returned. It is the server's fault (the receiver's point) if it does not toss the shuttle in time (undue delay: every time, never a disqualification), misses the shuttle, hits it above 1.15 m or not upwards, or the serve hits the net or lands outside that court. Both bases must stay within 5 cm of their spots until the serve is hit (or faulted): a base moving earlier is that player's fault (both at once: a let, replayed)"
opponent = "format match-wallclock: a scripted computer opponent. You serve the first point; the opponent serves when it won the last rally: from its service court at 1.05 m, upwards, high and deep or short into your diagonal service court, at most 18 m/s, always within your reach (level 1: 70 % high serves, towards the middle of the court; levels 2-3: 50 % high, wider and closer to the short service line); it stands still in its service court while you serve. It never makes an unforced error: it returns every shuttle it can reach, into your court. It is a robot too, on a base with the same limits as yours (2 m/s, 15 m/s^2 per axis): a reaction time after your hit it predicts the flight, its base moves until the shuttle is within its reach, and its arm then needs 0.55 s for a full stroke; with less than 0.3 s to spare it is under pressure (a weak, high lift into the middle of your court when hard pressed, a normal return in between, an attack when it has time); a shuttle it meets too late for a full stroke but with at least 0.45 s of arm time it still blocks (a weak lift); later still beats it, and shuttles arriving fast press it too. Its shots leave a robot waiting in the middle of your court time to reach them (level 1: 0.45 s to spare, levels 2-3: 0.25 s), except its kills: some of its attacks (level 1: 20 %, level 2: 50 %, level 3: 90 %) are played without that guarantee. It plays 70 % of its shots to the side away from your base, and when your base stands within 1.2 m of the net it lifts 70 % of its returns over your head (its clears pass above 2.8 m over your forward court). After its own stroke its base stays put for 0.35 s and then walks at 0.6 m/s to where it waits: 70 % of the way towards the mean landing point of your last 4 shots. It reads your habits: when 4 of your last 5 changes of side agree (always switching, or always staying) and your last 3 shots were all short or all deep, it predicts your next shot and moves 90 % of the way there at full speed. So where you place the shuttle (away from it, and not in a pattern) and where your base waits both matter. Level 1: reaction 0.30 s, reach 0.85 m, mild attacks (smashes up to 15 m/s, 70 % of the court's width); level 2: reaction 0.25 s, reach 0.85 m, level 2's attacks (up to 17 m/s, the court's full width); level 3: as level 2 with a reaction of 0.20 s, a reach of 0.9 m and a fast walk back (2 m/s). Its shots leave its racket at most at 18 m/s (what a racket of gain 4 gives)"
world = "metres; your own frame: x to your right, y towards the opponent, z up. Floor z = 0; a small court, the BWF court's lengths x 0.4 (the net at its BWF height): singles court |x| <= 1.036, |y| <= 2.68 (lines in); the net is the plane y = 0 with its top at z = 1.524 (posts at x = +-1.22); short service lines at |y| = 0.792; the centre line x = 0 divides each half into a right and a left service court. Your half is y < 0"
robot = "a Franka Panda arm held to the real Panda's limits (joint velocity 2.175 / 2.61 rad/s, acceleration 15 / 7.5 / 10 / 12.5 / 15 / 20 / 20 rad/s^2, jerk, torque 87 / 12 N m, torque rate 1000 N m/s: `game spec` arm_limits; its servo runs the arm at 0.9 of the velocity limits, and an arm joint faster than 1.05 x its limit triggers the robot's velocity reflex: it stops at that pose for 1 s - the gantry brakes to rest - and then resumes from rest, so the stroke under way is lost; the stroke controller avoids swings whose rehearsal triggers it and the act's stroke notes say so; final fields velocity_reflexes) on a 1.0 m pedestal whose base rides a gantry (|bx| <= 1.5, -3.53 <= by <= -0.5, up to 2 m/s and 15 m/s^2 per axis (a ball-screw gantry); it starts each point on the point's spot (+-0.12, -1.6), see play, and then waits where you put it (move) or where it last struck); the racket head centre is 0.56 m beyond the flange; the string face is a disc of radius 0.14 m. The racket meets shuttles 0.4-2.5 m above the floor. The arm needs time: from its ready pose (racket head 1.15 m high) a stroke is delivered reliably about 0.8-1 s ahead, and its head reaches about 2-2.3 m/s along a forward face normal (at 0.9 of the joint velocity limits)"
shuttle = "a point mass under gravity (9.81 m/s^2) and quadratic air drag, dv/dt = g - K |v| v with K = 0.212 per metre (terminal speed 6.8 m/s): hit at 40 m/s it slows to about 10 m/s within 0.3 s, and a high shuttle falls almost vertically at close to 6.8 m/s. No spin, no wind, no bounce"
racket_contact = "the racket meets the shuttle when the shuttle's centre crosses the string plane within 0.14 m of the head centre; the shuttle leaves exactly along the face normal n (the side the head moves towards, relative to the shuttle) at the speed 4 max(0, v_head.n) (1 - 0.3 (r/0.14)^2) + 0.15 max(0, -v_in.n), where v_head is the head velocity, r the contact's distance from the head centre and v_in the shuttle's incoming velocity; the rest of the head and incoming velocity is lost. A head speed along the normal of 1 m/s gives about 4 m/s, 2.5 m/s about 10 m/s (a lofted shot of 10 m/s flies about 4-5 m and 1.3-1.5 s)"
act = "high level: {'type':'act','t':T,'pos':[PX,PY,PZ],'normal':[NX,NY,NZ],'vel':[VX,VY,VZ]}: the racket's state at contact, T s after the act takes effect: the head centre, the string-face normal and the head velocity (m/s). Limits: 0 < T <= 5, |x| <= 2.136, -3.68 <= y <= -0.3, 0.2 <= z <= 3.0, speed <= 8 m/s. The act takes effect `act.lead_steps` control steps after the step at which it arrives (`game spec`; the stroke is planned meanwhile) and replaces the stroke under way; until then the robot keeps its current command. The controller drives the base to stand for a forehand at the contact point (or as far as it gets in time) and swings the arm within the joint speed and acceleration limits (a slower head when the time left does not allow the commanded one; the reply's stroke notes say so, and state.command gives the rehearsal's head velocity vel_rehearsed and position error pos_error_rehearsed_m); it knows nothing about the shuttle. The arm and racket cannot pass through the robot's own pedestal, platform and links (they stop the arm): the controller takes a swing that its rehearsal finds clear of them when it can (else the stroke notes say self-collision). The delivered state scatters by about 6 mm, 0.8 degrees and 3 % (seeded; each player's execution scatter is independent of the opponent's within a match: your acts draw your own stream, and the scripted opponent's choices draw others; format duel-wallclock: the two matches of a duel pair (the same seed, the first server swapped) swap the scatter sequences, so over the pair both players meet the same draws). {'type':'none'} cancels the stroke (the arm returns to its ready pose, the base stays where it is), with the same lead; act may carry 'base':[BX,BY], where the base stands at contact (default: the forehand stance for pos: (PX, PY) - 0.62 r (1, 1), r = max(0.30, 0.95 - 0.35 |PZ - 1.333|)); after a stroke the base stays where it struck (no automatic return); {'type':'move','base':[BX,BY]} sets where the base waits (it goes there once no stroke is under way; until a serve is delivered both bases must stay on their spots), with the same lead; {'type':'toss','pos':[X,Y,Z],'height':H} tosses the shuttle for your serve (see play), with the same lead"
lowlevel = "low level: {'type':'traj','q':[[base_x, base_y, q1..q7], ...]}: joint targets, one per 10 ms control step from the next step on (then the arm returns to its ready pose and the base holds its last target, or goes to the point of a `move`), each within the joint ranges and speed limits of `game spec` joints, the base's within the gantry's speed (2 m/s) and per-axis acceleration (15 m/s^2, from the targets' second differences), else refused; the arm's targets pass through the Panda's setpoint generator (acceleration and jerk limits: a target beyond them is reached later); none and serve as above, at the next step"
observation = "a PNG of 2 rows x 4 columns of 480 x 360 tiles: row 1 a camera behind and above your base line looking down the court, row 2 a camera at the side of the court (x < 0) looking along +x (your half on the right); the columns are frames 60 ms apart, newest on the right, with each frame's step and game time (view_steps, view_sim_times). No shuttle coordinates: the shuttle is drawn enlarged, an orange cork (12 cm ball centred on its position) with a white skirt behind it. `game spec` gives both cameras' poses and intrinsics (pinhole, 45 degree vertical field of view, focal length 434.6 px, principal point at the tile centre). The state gives your robot (robot_base_xy, q_arm, racket_pos, racket_normal), what you heard (tosses, serves and hits, with their times), whether the shuttle is coming to you, and the serve: you_serve, serve.court (right or left), serve.phase (waiting: the receiver is getting ready; open: the server may toss; tossed; done: the serve was delivered), serve.opens_in_s and serve.deadline_in_s for the server, serve.tossed_at_step; a point lost by a service fault says 'serve_fault:<reason>: ...' (undue_delay, missed, too_high, not_upwards, net, out, moved), the receiver's early move 'receive_fault:moved: ...'"
duel = "format duel-wallclock: another agent controls an identical robot across the net; in each player's frame its own half is y < 0. match.first_server serves the first point; then the winner of each rally serves (both players serve by the same rules, see play)"

[tiebreaks]
order = ["score", "last_point", "first_receiver"]
text = "first to 11 points (from 10-10 by 2, at most 15); at the match limit (400 hits or 40 points played) the player with more points; at equal points the player who won the last point that was not a let; then (last resort, not from the rulebook) the player who received first (format match-wallclock: the opponent)"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "an out-of-range, non-finite or malformed command is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_commands_are_refused"
[[exploits]]
id = "E2"
text = "low-level joint targets outside the joint ranges or faster than the joint speed limits are refused when they would take effect and change nothing"
test = "test_exploit_joint_limits"
[[exploits]]
id = "E3"
text = "acts cannot be stacked: a command sent before the previous act took effect is refused (HTTP 409)"
test = "test_exploit_no_stacked_acts"
[[exploits]]
id = "E4"
text = "the observation holds no shuttle position or velocity and no opponent state (only the images, what was heard and the player's own robot); the legacy privileged /oracle endpoint is gone"
test = "test_exploit_no_shuttle_state_in_observation"
[[exploits]]
id = "E5"
text = "doing nothing gains nothing: a player who never hits loses the points it receives, and a player who never serves faults on every serve (undue delay): it loses every point"
test = "test_exploit_idle_loses"
[[exploits]]
id = "E6"
text = "a racket meets the shuttle only on its own half and only on its turn: a robot standing at the net cannot hit the opponent's shot before it crosses, and cannot hit twice"
test = "test_exploit_no_reach_over_or_double_hit"
[[exploits]]
id = "E7"
text = "the rule constants the players are told (/spec, [spec]) are the simulator's"
test = "test_exploit_spec_is_the_simulator"
[[exploits]]
id = "E8"
text = "a lowered act replays exactly: the episode holds the low-level joint targets (planned by the legacy stroke controller at the effect step), and a fresh replay reproduces the live state"
test = "test_exploit_lowered_act_replays"
[[exploits]]
id = "E9"
text = "the serve is judged by the service laws: only the server tosses the shuttle, once per serve, from the step the receiver is ready, within the toss limits (else refused); a miss, a hit above 1.15 m or not upwards, a serve into the net or outside the diagonal service court is the server's fault; a base leaving its spot before the serve is that player's fault; the rally winner serves next from the court of its score's parity"
test = "test_exploit_serve_rules"
[[exploits]]
id = "E10"
text = "never serving does not pay: every serve not tossed in time is a service fault (the receiver's point and serve, any number of times, never a disqualification), so a player who wins rallies but never tosses the shuttle gives back every point it wins at its next serve and never leads by two points"
test = "test_exploit_never_serving_faults_every_serve"
[[exploits]]
id = "E11"
text = "the opponent's strokes tell nothing about your own scatter: each robot's execution scatter is its own seeded stream (duel: the first server's and the other's, swapped by the two matches of a pair, so over the pair both players meet the same draws; match: independent of the scripted opponent's serve and return choices). Until duel-8 the n-th act of either robot got the same draw, which a player acting later could pre-compensate"
test = "test_exploit_independent_scatter_streams"
[[exploits]]
id = "E12"
text = "every body obeys real-robot limits: the arm's setpoints stay within 0.9 of the Franka Panda's joint velocity limits and within its acceleration and jerk limits and its torques within the torque and torque-rate limits whatever it is commanded; a physical arm joint faster than 1.05 x its velocity limit stops the robot for 1 s (the velocity reflex, revision wallclock-12 / duel-14); a low-level traj that would drive the gantry beyond 2 m/s or 15 m/s^2 (per axis) is refused"
test = "test_exploit_real_robot_limits"
[[exploits]]
id = "E13"
text = "the arm and racket cannot pass through the robot's own pedestal, platform and links (self-collision, revision wallclock-9 / duel-11): joint targets into the stand leave the arm stopped at its surface and the contact is recorded in the final fields (self_collision; recorded only, no penalty); the stroke controller's swings keep clear of the stand (a low forehand whose nearest IK solution folds the forearm into the pedestal is played without contact)"
test = "test_exploit_self_collision"
[[exploits]]
id = "E14"
text = "no serve is a sure point against the scripted opponent (revision wallclock-11): a fast flat short serve to the front corner of its service court (about 5-6 m/s; a model scored 10 points in a row with one on the old opponent) is returned or blocked at every level"
test = "test_exploit_flat_short_serve"
[[exploits]]
id = "E15"
text = "the low-level toolkit is what its manifest says (seat/toolkit.toml, skilleval/toolkit.py: the robot model, its meshes, the kinematics library and the servo model match their sha256 and versions; the seat ships exactly them); the libraries import nothing of the simulator; the kinematics library reproduces the simulator's racket kinematics and its IK is deterministic; the servo model moves the robot as the simulator does"
test = "test_exploit_toolkit_is_the_manifest"
[[exploits]]
id = "E16"
text = "the robot's own model given at the low level (seat/robot_only.xml, /spec robot_model) reproduces the simulator's robot (base, pedestal, arm, racket) and holds nothing of the world"
test = "test_exploit_robot_model_is_the_simulator_robot"
[[exploits]]
id = "E17"
text = "the low level's API test: the seat gets only the public practice act requests (the request, the robot's state and our plan; no world state, no seed); the hidden evaluation cases and their replay start states stay on the simulator side and are left out of the generated tasks (skilleval/cases.py, tools/sportlib.py); every request is feasible under the real limits"
test = "test_exploit_act_cases_hidden_stay_in_the_simulator"
[[exploits]]
id = "E18"
text = "the low level's deliverable (the final /app/output/skill/act.py) is evaluated after the match in an isolated container (tools/skill_eval.py: no network, read-only, the skill as nobody) and in its own process (skilleval/sandbox.py: python -I, a scrubbed environment): it sees only what each call passes (no simulator, no shuttle state); a call that raises or overruns its time limit gives no command and is counted"
test = "test_exploit_act_skill_runs_isolated"
[[exploits]]
id = "E19"
text = "skill in the loop (RCB_SKILL_INLOOP, skilleval/inloop.py): the core skill cannot be bypassed: while a shuttle the robot may meet is in play the low level refuses joint commands (409) and accepts only act (lowered by the player's own skill, run in its sandbox on a private copy of its files, each call logged with their sha256) and the skill's own step() every 20 ms; a failed call is a no-op; the episode holds the lowered commands only and replays without the skill"
test = "test_exploit_skill_in_the_loop"

[players]
reference = "reference"               # camera-only (the legacy duel's cam_player.py) + a scripted serve: wins the default configuration
reference_class = "builtin_players:Reference"
check = []                            # the generic tests play the reference only (each match draws thousands of tiles)

[fairness]
policy = "reference"
matches_per_order = 20                # N = 40 (the minimum): one in-process duel takes minutes (planning + tiles);
                                      # a realtime sport's wide interval only warns
max_advantage_pp = 5
mirror = "statistical"                # seats are mirrored worlds (one scatter stream per robot, following the first server; the players serve, the first server alternates)

[official]
seeds = [1, 2, 3, 101, 111, 121, 202, 212, 222, 303, 313, 323]   # duel: 1-3; match: L1 101-121, L2 202-222, L3 303-323
levels = [1, 2, 3]                    # (revision wallclock-11, docs/screening/badminton.md: these public seeds are the
                                      # practice / round seeds; a frozen evaluation draws a hidden seed set, step 6)
slowdowns = { program = [1, 2, 5, 10, 20] }
first_any = true

[official.hidden_seeds]                 # registered hidden seed set (tools/seeds.py; public commitments: seed_commitments.json)
sha256 = "648163792ee2bd268c913ee0bddcb8371bfd72d6d71f1347a1ce62fbd850fac6"
counts = { "duel-wallclock" = 20, "match-wallclock/L1" = 20, "match-wallclock/L2" = 20, "match-wallclock/L3" = 20 }

[golden]
episodes = "golden"                   # recorded under the player-serve rules; the legacy machine-serve records are retired (README)

[[tasks]]
format = "match-wallclock"
action_level = "high"
id = "badminton-match-wallclock-program-standard"   # the legacy task name
[[tasks]]
format = "duel-wallclock"
action_level = "high"
id = "badminton-duel-wallclock-program-standard"    # the legacy task name
[[tasks]]
format = "match-wallclock"
action_level = "low"
id = "badminton-match-wallclock-program-lowlevel-standard"   # the low level (Agent as Robotics Engineer)

[score]                               # the continuous score (core 0.2.14, core/score.py): larger is better
name = "point_share"
text = "your points / all points played in the match (the opponent's or the other player's points included); 0.5 when no point was played"
from = "share"                        # own score / the sum of every side's score in Match.scores()
forfeit = 0.0                         # a side that forfeits gets the worst value
range = [0, 1]

[reference]                           # tools/check stage 5, the reference check (docs/screening/README.md)
match = "reference_check:reference_match"   # the step-4 loop (x20, every 5 steps): truth = true shuttle + 3 mm, camera = the reference unchanged
seeds = [101, 111, 121, 131, 141, 151, 161, 171, 181, 191, 201, 211, 221, 231, 241, 251, 261, 271, 281, 291]   # the screening record (docs/screening/badminton.md section 6): truth 20/6/0 of 20
camera_seeds = 5                      # the camera reference's playability report (the screening: camera 15/20 at L1)

[[reference.camera_wins]]             # model matches won with cameras only (screening step 5, revision wallclock-12)
format = "match-wallclock"
level = 1
who = "Claude Opus 5.5 (Claude Code, program play)"
score = "11:7"
evidence = "docs/screening/badminton.md#7-step-5-model-trial-runs"

[[reference.camera_wins]]             # (revision wallclock-11)
format = "match-wallclock"
level = 1
who = "Claude Opus 5.5 (Claude Code, program play), revision wallclock-11"
score = "11:8"
evidence = "docs/screening/badminton.md#7-step-5-model-trial-runs"

[capabilities]                        # docs/capabilities_zh.md §6
a1 = 2                                # the shuttle's flight only from the camera images (rays, a flight fit)
a2 = 2                                # high drag: the shuttle's flight, the racket contact law
a3 = 2                                # a robot arm on a sliding base, a stroke under joint limits and scatter
a4 = 2                                # real time: the shuttle does not wait; the act lead
b1 = 1                                # the scoring, service (who serves, courts, toss, faults) and fault rules, the match limit
b2 = 1                                # placement and not being predictable; screening (docs/screening/badminton.md,
                                      # revision wallclock-11): one fixed corner costs -0.43 of the point share (the
                                      # opponent reads a repeated spot and prepares its stroke) but a random side costs
                                      # nothing measurable (-0.01): reading the opponent's position is not rewarded
                                      # further, so secondary (was 2)
b3 = 0
physics = ["drag"]                    # high-drag flight (docs/capabilities_zh.md §6: 高阻力飞行); the shuttle has no
                                      # spin and no bounce in this simulator, so spin_bounce is not tested

[check]                               # tools/check limits: an in-process duel takes 6-15 min (planning + 2 seats' tiles)
stage_timeout_s = 36000               # stage 2 (~25 in-process matches) and stage 4 (40 duels, serial) take hours
live_player_timeout_s = 4500          # the live duel at x20 took 1888 s of 3000

