<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>Mitsuba vs MuJoCo &#183; FK-3DGS comparison gallery</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0b0d12;padding:26px 22px 60px}
.mm-page{max-width:1500px;margin:0 auto}

.mm-root{--mm-bg:#0b0d12;--mm-panel:#141822;--mm-line:#232a38;--mm-ink:#e6edf3;
  --mm-dim:#8b949e;--mm-acc:#7ee787;--mm-acc2:#58a6ff;--mm-warn:#f778ba;
  color:var(--mm-ink);font:15px/1.6 -apple-system,"PingFang SC","Segoe UI",sans-serif}
.mm-root *{box-sizing:border-box}
.mm-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 14px}
.mm-head h3{font-size:17px;margin:0;font-weight:600}
.mm-legend{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto}
.mm-key{font-size:11.5px;color:var(--mm-dim);background:var(--mm-panel);
  border:1px solid var(--mm-line);border-radius:20px;padding:3px 11px}
.mm-key i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px;vertical-align:1px}
.mm-sync{font-size:12.5px;color:var(--mm-dim);display:flex;align-items:center;gap:6px;
  background:var(--mm-panel);border:1px solid var(--mm-line);border-radius:20px;padding:4px 12px;cursor:pointer}
.mm-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}
.mm-col{background:var(--mm-panel);border:1px solid var(--mm-line);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column}
.mm-title{padding:10px 14px;border-bottom:1px solid var(--mm-line);display:flex;
  align-items:baseline;gap:9px}
.mm-title b{font-size:14.5px}
.mm-title span{font-size:11.5px;color:var(--mm-dim)}
.mm-stage{position:relative;background:#05060a;aspect-ratio:1/1;overflow:hidden;cursor:col-resize;touch-action:none;user-select:none;-webkit-user-select:none;
  user-select:none;touch-action:none;cursor:ew-resize}
.mm-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none;user-drag:none}
.mm-stage.mm-locked{cursor:default}
.mm-stage.mm-locked .mm-div{background:var(--mm-acc)}
.mm-stage img.mm-top{clip-path:inset(0 0 0 50%)}
.mm-div{position:absolute;top:0;bottom:0;width:2px;background:var(--mm-acc2);
  left:50%;transform:translateX(-1px);pointer-events:none;box-shadow:0 0 8px rgba(88,166,255,.6)}
.mm-div::after{content:"";position:absolute;top:50%;left:50%;width:26px;height:26px;
  margin:-13px 0 0 -13px;border-radius:50%;border:2px solid var(--mm-acc2);
  background:rgba(11,13,18,.75)}
.mm-tag{position:absolute;top:9px;font-size:11.5px;padding:3px 10px;border-radius:14px;
  background:rgba(11,13,18,.82);border:1px solid var(--mm-line);pointer-events:none;white-space:nowrap}
.mm-tag.l{left:9px}.mm-tag.r{right:9px}
.mm-tag i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.mm-ctl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--mm-line)}
.mm-ctl button{font:inherit;font-size:11.5px;color:var(--mm-dim);background:transparent;
  border:1px solid var(--mm-line);border-radius:16px;padding:4px 11px;cursor:pointer}
.mm-ctl button:hover{color:var(--mm-ink)}
.mm-ctl button.on{color:#0b0d12;background:var(--mm-acc);border-color:var(--mm-acc);font-weight:600}
.mm-pick{display:flex;gap:8px;padding:0 12px 10px;flex-wrap:wrap}
.mm-pick label{font-size:11.5px;color:var(--mm-dim);display:flex;align-items:center;gap:5px}
.mm-pick select{font:inherit;font-size:11.5px;background:var(--mm-bg);color:var(--mm-ink);
  border:1px solid var(--mm-line);border-radius:7px;padding:3px 7px}
.mm-meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;font-size:11.5px;color:var(--mm-dim)}
.mm-meta b{color:var(--mm-acc2);font-weight:600}
.mm-nav{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid var(--mm-line)}
.mm-nav button{font:inherit;font-size:14px;color:var(--mm-ink);background:var(--mm-bg);
  border:1px solid var(--mm-line);border-radius:8px;width:32px;height:28px;cursor:pointer}
.mm-nav .mm-idx{font-size:12px;color:var(--mm-dim);min-width:52px;text-align:center}
.mm-thumbs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.mm-thumbs img{width:44px;height:44px;object-fit:cover;border-radius:6px;opacity:.42;
  cursor:pointer;border:1px solid transparent;flex:0 0 auto;background:#05060a}
.mm-thumbs img.on{opacity:1;border-color:var(--mm-acc)}
.mm-foot{font-size:11.5px;color:var(--mm-dim);margin-top:12px;line-height:1.7}
.mm-foot code{background:var(--mm-panel);border:1px solid var(--mm-line);border-radius:5px;padding:1px 6px}

</style>
<div class="mm-page"><div id="mm"></div></div>
<script>
const MM_DATA = {"franka": {"title": "Franka Panda", "note": "Mitsuba: albedo x AO, uniform white environment", "mode": "classic", "mitsuba_ckpt": "outputs/franka_s2b_frfin_full/ckpts/final.pt", "mujoco_ckpt": "outputs/franka_final/ckpts/final.pt", "items": [{"i": 0, "sample": "test_sample_0", "cam": 0, "align_iou": 0.9721, "psnr_mitsuba_model": 36.13, "psnr_mujoco_model_on_mitsuba": 31.34, "psnr_mujoco_model": 32.86, "ao_ratio": 0.947}, {"i": 1, "sample": "test_sample_1", "cam": 1, "align_iou": 0.9598, "psnr_mitsuba_model": 41.56, "psnr_mujoco_model_on_mitsuba": 35.26, "psnr_mujoco_model": 35.21, "ao_ratio": 0.938}, {"i": 2, "sample": "test_sample_2", "cam": 2, "align_iou": 0.9686, "psnr_mitsuba_model": 37.86, "psnr_mujoco_model_on_mitsuba": 33.13, "psnr_mujoco_model": 34.05, "ao_ratio": 0.938}, {"i": 3, "sample": "test_sample_3", "cam": 3, "align_iou": 0.9718, "psnr_mitsuba_model": 36.92, "psnr_mujoco_model_on_mitsuba": 31.81, "psnr_mujoco_model": 33.51, "ao_ratio": 0.932}, {"i": 4, "sample": "test_sample_4", "cam": 4, "align_iou": 0.973, "psnr_mitsuba_model": 37.68, "psnr_mujoco_model_on_mitsuba": 32.37, "psnr_mujoco_model": 34.07, "ao_ratio": 0.949}, {"i": 5, "sample": "test_sample_5", "cam": 5, "align_iou": 0.9735, "psnr_mitsuba_model": 36.71, "psnr_mujoco_model_on_mitsuba": 31.81, "psnr_mujoco_model": 32.84, "ao_ratio": 0.924}, {"i": 6, "sample": "test_sample_6", "cam": 0, "align_iou": 0.978, "psnr_mitsuba_model": 37.7, "psnr_mujoco_model_on_mitsuba": 32.8, "psnr_mujoco_model": 35.29, "ao_ratio": 0.948}, {"i": 7, "sample": "test_sample_7", "cam": 1, "align_iou": 0.9722, "psnr_mitsuba_model": 35.5, "psnr_mujoco_model_on_mitsuba": 30.82, "psnr_mujoco_model": 33.2, "ao_ratio": 0.92}, {"i": 8, "sample": "test_sample_8", "cam": 2, "align_iou": 0.9639, "psnr_mitsuba_model": 40.26, "psnr_mujoco_model_on_mitsuba": 34.11, "psnr_mujoco_model": 33.99, "ao_ratio": 0.917}, {"i": 9, "sample": "test_sample_9", "cam": 3, "align_iou": 0.9663, "psnr_mitsuba_model": 37.94, "psnr ite environment", "mode": "antialiased", "mitsuba_ckpt": "outputs/g1_s2diff_v6full/ckpts/final.pt", "mujoco_ckpt": "outputs/g1dex5_v6_joint/ckpts/final.pt", "items": [{"i": 0, "sample": "test_sample_0", "cam": 0, "align_iou": 0.9661, "psnr_mitsuba_model": 38.25, "psnr_mujoco_model_on_mitsuba": 30.75, "psnr_mujoco_model": 32.87, "ao_ratio": 0.874}, {"i": 1, "sample": "test_sample_1", "cam": 1, "align_iou": 0.9603, "psnr_mitsuba_model": 40.13, "psnr_mujoco_model_on_mitsuba": 22.84, "psnr_mujoco_model": 28.94, "ao_ratio": 0.609}, {"i": 2, "sample": "test_sample_2", "cam": 2, "align_iou": 0.9628, "psnr_mitsuba_model": 35.8, "psnr_mujoco_model_on_mitsuba": 29.55, "psnr_mujoco_model": 32.38, "ao_ratio": 0.879}, {"i": 3, "sample": "test_sample_3", "cam": 3, "align_iou": 0.9559, "psnr_mitsuba_model": 40.66, "psnr_mujoco_model_on_mitsuba": 24.32, "psnr_mujoco_model": 30.15, "ao_ratio": 0.601}, {"i": 4, "sample": "test_sample_4", "cam": 4, "align_iou": 0.9639, "psnr_mitsuba_model": 39.81, "psnr_mujoco_model_on_mitsuba": 24.75, "psnr_mujoco_model": 28.07, "ao_ratio": 0.699}, {"i": 5, "sample": "test_sample_5", "cam": 5, "align_iou": 0.961, "psnr_mitsuba_model": 40.14, "psnr_mujoco_model_on_mitsuba": 23.27, "psnr_mujoco_model": 27.81, "ao_ratio": 0.617}, {"i": 6, "sample": "test_sample_6", "cam": 0, "align_iou": 0.9693, "psnr_mitsuba_model": 37.79, "psnr_mujoco_model_on_mitsuba": 30.38, "psnr_mujoco_model": 32.51, "ao_ratio": 0.849}, {"i": 7, "sample": "test_sample_7", "cam": 1, "align_iou": 0.9587, "psnr_mitsuba_model": 38.96, "psnr_mujoco_model_on_mitsuba": 24.43, "psnr_mujoco_model": 27.41, "ao_ratio": 0.635}, {"i": 8, "sample": "test_sample_8", "cam": 2, "align_iou": 0.9611, "psnr_mitsuba_model": 38.88, "psnr_mujoco_model_on_mitsuba": 30.73, "psnr_mujoco_model": 31.46, "ao_ratio": 0.829}, {"i": 9, "sample": "test_sample_9", "cam": 3, "align_iou": 0.9579, "psnr_mitsuba_model": 41.02, "psnr_mujoco_model_on_mitsuba": 22.4, "psnr_mujoco_model": 30.97, "ao_ratio": 0.564}, {"i": 10, "sample": "test_sample_10", "cam": 4, "align_iou": 0.9617, "psnr_mitsuba_model": 39.54, "psnr_mujoco_model_on_mitsuba": 22.48, "psnr_mujoco_model": 28.65, "ao_ratio": 0.601}, {"i": 11, "sample": "test_sample_11", "cam": 5, "align_iou": 0.965, "psnr_mitsuba_model": 39.09, "psnr_mujoco_model_on_mitsuba": 21.36, "psnr_mujoco_model": 28.45, "ao_ratio": 0.568}, {"i": 12, "sample": "test_sample_12", "cam": 0, "align_iou": 0.9568, "psnr_mitsuba_model": 43.48, "psnr_mujoco_model_on_mitsuba": 33.65, "psnr_mujoco_model": 34.4, "ao_ratio": 0.833}, {"i": 13, "sample": "test_sample_13", "cam": 1, "align_iou": 0.9557, "psnr_mitsuba_model": 39.61, "psnr_mujoco_model_on_mitsuba": 23.11, "psnr_mujoco_model": 27.59, "ao_ratio": 0.618}, {"i": 14, "sample": "test_sample_14", "cam": 2, "align_iou": 0.9554, "psnr_mitsuba_model": 41.47, "psnr_mujoco_model_on_mitsuba": 32.85, "psnr_mujoco_model": 35.17, "ao_ratio": 0.84}, {"i": 15, "sample": "test_sample_15", "cam": 3, "align_iou": 0.9584, "psnr_mitsuba_model": 43.32, "psnr_mujoco_model_on_mitsuba": 24.44, "psnr_mujoco_model": 29.37, "ao_ratio": 0.606}, {"i": 16, "sample": "test_sample_16", "cam": 4, "align_iou": 0.9619, "psnr_mitsuba_model": 39.04, "psnr_mujoco_model_on_mitsuba": 30.48, "psnr_mujoco_model": 30.84, "ao_ratio": 0.825}, {"i": 17, "sample": "test_sample_17", "cam": 5, "align_iou": 0.9514, "psnr_mitsuba_model": 43.21, "psnr_mujoco_model_on_mitsuba": 25.06, "psnr_mujoco_model": 29.73, "ao_ratio": 0.618}, {"i": 18, "sample": "test_sample_18", "cam": 0, "align_iou": 0.9649, "psnr_mitsuba_model": 38.62, "psnr_mujoco_model_on_mitsuba": 31.0, "psnr_mujoco_model": 33.5, "ao_ratio": 0.836}, {"i": 19, "sample": "test_sample_19", "cam": 1, "align_iou": 0.9586, "psnr_mitsuba_model": 41.11, "psnr_mujoco_model_on_mitsuba": 24.2, "psnr_mujoco_model": 30.33, "ao_ratio": 0.596}]}};
const MM_BASE = "pairs/";

const MM_LAYERS = {
  mujoco_gt:     {label:"MuJoCo GT",            dot:"#8b949e"},
  mujoco_model:  {label:"MuJoCo-domain model",  dot:"#58a6ff"},
  mitsuba_gt:    {label:"Mitsuba GT",           dot:"#f778ba"},
  mitsuba_model: {label:"Mitsuba-domain model ★", dot:"#7ee787"}
};
const MM_PRESETS = [
  {name:"model vs model",   l:"mujoco_model", r:"mitsuba_model"},
  {name:"GT vs GT",         l:"mujoco_gt",    r:"mitsuba_gt"},
  {name:"Mitsuba fidelity", l:"mitsuba_gt",   r:"mitsuba_model"},
  {name:"cross-domain gap", l:"mitsuba_gt",   r:"mujoco_model"}
];

function mmBuild(root, data, base){
  const cols = Object.entries(data);
  const state = {sync:true, cols:{}};
  root.classList.add("mm-root");
  root.innerHTML = `
    <div class="mm-head">
      <h3>Mitsuba domain vs MuJoCo domain &#183; same pose, same camera, same crop</h3>
      <div class="mm-legend">${Object.entries(MM_LAYERS).map(([k,v])=>
        `<span class="mm-key"><i style="background:${v.dot}"></i>${v.label}</span>`).join("")}</div>
      <label class="mm-sync"><input type="checkbox" checked> sync both columns</label>
    </div>
    <div class="mm-grid"></div>
    <div class="mm-foot"></div>`;
  const grid = root.querySelector(".mm-grid");
  root.querySelector(".mm-sync input").onchange = e => state.sync = e.target.checked;

  cols.forEach(([key, col]) => {
    const el = document.createElement("div");
    el.className = "mm-col";
    el.innerHTML = `
      <div class="mm-title"><b>${col.title}</b><span>${col.note}</span></div>
      <div class="mm-stage">
        <img class="mm-bot"><img class="mm-top"><div class="mm-div"></div>
        <div class="mm-tag l"></div><div class="mm-tag r"></div>
      </div>
      <div class="mm-ctl">${MM_PRESETS.map((p,i)=>
        `<button data-p="${i}"${i?"":' class="on"'}>${p.name}</button>`).join("")}</div>
      <div class="mm-pick">
        <label>left <select data-side="l">${Object.entries(MM_LAYERS).map(([k,v])=>
          `<option value="${k}">${v.label}</option>`).join("")}</select></label>
        <label>right <select data-side="r">${Object.entries(MM_LAYERS).map(([k,v])=>
          `<option value="${k}">${v.label}</option>`).join("")}</select></label>
      </div>
      <div class="mm-meta"></div>
      <div class="mm-nav">
        <button class="mm-prev">‹</button><span class="mm-idx"></span><button class="mm-next">›</button>
        <div class="mm-thumbs"></div>
      </div>`;
    grid.appendChild(el);

    const S = {key, col, el, i:0, l:MM_PRESETS[0].l, r:MM_PRESETS[0].r, x:50};
    state.cols[key] = S;
    const stage = el.querySelector(".mm-stage");
    const bot = el.querySelector(".mm-bot"), top = el.querySelector(".mm-top");
    const div = el.querySelector(".mm-div");
    const tagL = el.querySelector(".mm-tag.l"), tagR = el.querySelector(".mm-tag.r");
    const meta = el.querySelector(".mm-meta"), idx = el.querySelector(".mm-idx");
    const thumbs = el.querySelector(".mm-thumbs");

    col.items.forEach((it, i) => {
      const t = document.createElement("img");
      t.src = `${base}${key}/${String(it.i).padStart(2,"0")}_mitsuba_gt.jpg`;
      t.loading = "lazy"; t.onclick = () => go(i, true);
      thumbs.appendChild(t);
    });

    function paint(){
      const it = col.items[S.i];
      const p = n => `${base}${key}/${String(it.i).padStart(2,"0")}_${n}.jpg`;
      bot.src = p(S.r); top.src = p(S.l);
      tagL.innerHTML = `<i style="background:${MM_LAYERS[S.l].dot}"></i>${MM_LAYERS[S.l].label}`;
      tagR.innerHTML = `<i style="background:${MM_LAYERS[S.r].dot}"></i>${MM_LAYERS[S.r].label}`;
      top.style.clipPath = `inset(0 ${100-S.x}% 0 0)`;
      div.style.left = S.x + "%";
      idx.textContent = `${S.i+1} / ${col.items.length}`;
      meta.innerHTML =
        `<span>Mitsuba-domain model vs Mitsuba GT <b>${it.psnr_mitsuba_model} dB</b></span>` +
        `<span>&#183; MuJoCo-domain model vs the same Mitsuba GT <b>${it.psnr_mujoco_model_on_mitsuba} dB</b></span>` +
        `<span>&#183; camera-alignment IoU <b>${it.align_iou}</b></span>`;
      [...thumbs.children].forEach((t,i)=>t.classList.toggle("on", i===S.i));
      el.querySelectorAll(".mm-pick select").forEach(s =>
        s.value = s.dataset.side === "l" ? S.l : S.r);
      const hit = MM_PRESETS.findIndex(p=>p.l===S.l&&p.r===S.r);
      el.querySelectorAll(".mm-ctl button").forEach((b,i)=>b.classList.toggle("on", i===hit));
    }
    function go(i, self){
      S.i = (i + col.items.length) % col.items.length; paint();
      if (self && state.sync) Object.values(state.cols).forEach(o => {
        if (o !== S) { o.i = S.i % o.col.items.length; o.paint(); }
      });
    }
    S.paint = paint; S.go = go;

    el.querySelector(".mm-prev").onclick = () => go(S.i-1, true);
    el.querySelector(".mm-next").onclick = () => go(S.i+1, true);
    el.querySelectorAll(".mm-ctl button").forEach(b => b.onclick = () => {
      const p = MM_PRESETS[+b.dataset.p]; S.l = p.l; S.r = p.r; paint();
    });
    el.querySelectorAll(".mm-pick select").forEach(s => s.onchange = () => {
      if (s.dataset.side === "l") S.l = s.value; else S.r = s.value; paint();
    });
    const move = e => {
      const r = stage.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX);
      S.x = Math.max(0, Math.min(100, (cx - r.left) / r.width * 100)); paint();
    };
    /* The divider follows the cursor as soon as it is over the panel — no drag,
       no click. Dragging was awkward to demonstrate live, and pressing on an
       <img> started a native image drag instead. Click toggles a lock so a
       position can be held while talking; touch keeps drag-to-wipe. */
    let locked = false;
    stage.addEventListener("pointermove", e => {
      if (e.pointerType === "touch" || locked) return;
      move(e);
    });
    stage.addEventListener("click", () => {
      locked = !locked;
      stage.classList.toggle("mm-locked", locked);
    });
    stage.addEventListener("pointerdown", e => {          /* touch: drag to wipe */
      if (e.pointerType !== "touch") return;
      stage.setPointerCapture(e.pointerId); move(e);
    });
    stage.addEventListener("pointermove", e => {
      if (e.pointerType === "touch" && stage.hasPointerCapture(e.pointerId)) move(e);
    });
    stage.addEventListener("dragstart", e => e.preventDefault());
    paint();
  });

  root.querySelector(".mm-foot").innerHTML =
    `Move the cursor across a panel to wipe &#8212; click to lock the divider, click again to release. ` +
    `All four layers in a cell share one joint configuration and one camera &#8212; the MuJoCo GT is re-rendered through a free camera solved back from the dataset extrinsics, and the silhouette IoU is checked per sample.` +
    `<br>ckpt：` + cols.map(([k,c]) =>
      `<code>${k}</code> Mitsuba=<code>${c.mitsuba_ckpt}</code> · MuJoCo=<code>${c.mujoco_ckpt}</code>`).join("<br>");

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      const first = Object.values(state.cols)[0];
      first.go(first.i + (e.key === "ArrowRight" ? 1 : -1), true);
    }
  });
}

mmBuild(document.getElementById("mm"), MM_DATA, MM_BASE);
</script>
</html>
