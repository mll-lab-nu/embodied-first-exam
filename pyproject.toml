[project]
name = "embodied-first-exam"
version = "0.1.0"
description = "Embodied First Exam on Harbor: `harbor run --core|--all|--privileged|--standard|--standard-realtime`, or `efe run`"
requires-python = ">=3.12"
dependencies = ["harbor==0.23.0"]

[project.scripts]
efe = "efe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["scripts"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/efe-harbor.pth" = "efe-harbor.pth"
