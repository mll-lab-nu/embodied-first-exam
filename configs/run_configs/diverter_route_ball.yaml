# diverter_route_ball_inspect_demo 的运行模式参数。
#
# 几何与材料不在这里 —— 它们在 task 配置里，用点路径覆盖即可：
#   task.branch.angle_deg=25            （改导流角）
#   task.channel.inner_width=0.100      （改通道宽度，整套派生几何随之自洽）
#   task.ball.speed=0.180               （改球速）

defaults:
  - default
  - _self_

# 只建场景、一步都不走。构建时就互相穿透的几何在这一步暴露，
# 不会被第一次沉降掩盖过去。
static_only: false

# 用 set_dofs_position 把分流板的关节从一端扫到另一端再回来，然后退出。
# 这是运动学检查（限位是否生效、拨杆与侧壁是否干涉），不属于 episode——
# episode 里关节只能由接触驱动。
sweep_joint: false

# 关节扫描的步数（单程）。
sweep_steps: 90

# 放球滚一遍时分流板停在哪个相位：
#   seal_left  / seal_right  落座在对应一侧（球应从另一侧离开）
#   half                     半开（关节角 0），预期球卡在分岔口
#   config                   用 task.diverter.init_sealed_side
flap_phase: config

# 直接给挡板角度（度），覆盖 flap_phase。用来扫「物理成功带」：拓扑判据在
# 16..70deg 全说可达，但球能不能真的走通取决于瞄准质量，那只有跑物理才知道。
# null = 用 flap_phase。
flap_deg: null

# 放球滚一遍的步数上限。球从释放到出口 3.02s；600 步 = 6 秒，留出滚出后静止的时间。
rollout_steps: 600

# 每隔多少步打印一行轨迹采样（run.verbose=true 时）。
sample_every: 20

# 每次 rollout 结束后打印判据读数（几何层 S–T 连通性）。步骤 2 接上 verifier 后生效。
classify: false

# --- 变体（2026-09-02）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识。
variant_id: default
