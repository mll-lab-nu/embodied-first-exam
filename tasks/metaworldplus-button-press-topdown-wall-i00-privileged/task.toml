schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/metaworldplus-button-press-topdown-wall-i00-privileged"
description = "MetaWorld+ (Meta-World v3 button-press-topdown-wall, Sawyer arm): Reach past the wall and press the button downward. Produce one replayable trajectory of Meta-World's native actions on a frozen instance; graded on the state after the last action."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "mujoco", "metaworld", "sawyer", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "mujoco"
robot = "sawyer"
family = "metaworld/button-press-topdown-wall"
mode = "privileged"
oracle = "full"
instance_seed = 0             # Meta-World's reset randomization (object and goal positions)
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Meta-World's scripted policies solve these tasks and are publicly downloadable, so egress is closed to the model APIs.
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §2.7
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 1800.0
