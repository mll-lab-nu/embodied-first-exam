# tests/pleat_settle_spike.py 的运行模式参数。
#
# 布带的几何、材料与判据参数不在这里 —— 它们在 task 配置
# （cloth_unpleat）的 cloth / success 块，用点路径覆盖即可扫参：
#   task.cloth.pleat.crest_height=0.040
#   task.cloth.particle_size=0.006
#   task.cloth.mesh.spacing=0.010

defaults:
  - default
  - _self_

# 静置多少步（dt=0.01，所以 400 步 = 4 秒）。
# 褶皱塌陷或弹开都是慢过程，比布落到桌面慢得多，所以取值明显大于 cloth_fold
# 的 settle（120 步）—— 那一项只需要布落定。
settle_steps: 400

# 每隔多少步打印一行采样。曲线的形状本身是诊断：一路单调下降是塌陷，
# 前几十步掉一点然后稳住是正常的松弛。
sample_every: 25

# 建不建机械臂。默认不建：这一项没有任何东西碰布，不建能省下建场时间。
# 要看褶皱与手臂的相对高度时置 true。
include_robot: false

# ------------------------------------------------------------------ 判据
# 「静置之后这还算不算一个褶皱」。**判的东西与 demo 的起始护栏完全相同**
# （`task.grasp.max_start_spread_ratio` / `min_start_three_layer_cells`），
# 所以闸口过了 demo 就不会在同一处停下 —— 两边不该有各自的定义。
#
# 2026-08-23 之前这里判的是顶缘高度。换掉了：褶皱必然躺平（Genesis 忽略
# bending_compliance，实测跨七个数量级无变化），按高度判等于每次都判失败。
# 真正要紧的是材料还收着没有、三层还叠着没有，两者都直接量得到。
#
# verdict：intact / released（材料已经放出来了）/ layers_lost（三层散了）/
#          diverged（发散，优先于其余三种）。
#
# 下面两条只用于 diverged 那一支：
#   crest_keep_max / max_speed : 发散护栏，先于其余两条判。
#                    2026-08-23：布↔布摩擦调到 3.0 时布被甩到空中 —— 76 m/s、
#                    最低粒子在桌面上方 35mm、顶缘 212mm（建模 22mm），
#                    而只看顶缘高度的判据把这种情况报成了 `stands`。
#                    把已经飞出场景的布报成成功，比不报还糟。
crest_keep_max: 1.50
# 静置里没有任何东西在驱动布，所以任一粒子超过这个速率就不是在落定。
# 基线峰值 0.07，bending_relaxation=0.02 瞬时到过 0.14，都在线下。
max_speed: 1.0
