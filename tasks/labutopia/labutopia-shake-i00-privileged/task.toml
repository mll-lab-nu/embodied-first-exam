schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/labutopia-shake-i00-privileged"
description = "LabUtopia shake (Shake; a chemistry laboratory with a Franka Panda on Isaac Sim): produce one replayable trajectory of joint targets. Pick up the beaker, shake it, and hold it still. Frozen scene instance (LabUtopia's reset, seed 0); graded by two fresh-process replays with a copy of LabUtopia's own success check."
keywords = ["robotics", "labutopia", "isaac-sim", "laboratory", "chemistry", "franka-panda", "code-as-policy", "trajectory", "shake", "privileged"]

[metadata]
task_type = "trajectory"
simulator = "labutopia"           # LabUtopia @ 8df7278 on NVIDIA Isaac Sim 6.1.0 (PhysX on the CPU, RTX cameras)
robot = "franka-panda"
family = "shake"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "full"
level = 1                         # LabUtopia's own level for the task (config level1_shake)
instance_seed = 0                 # numpy's and Python's random generators before LabUtopia's reset
expert_time_estimate_hours = 1.5

[verifier]
timeout_sec = 5400.0              # two replays of about a minute (each limited to 2400 s, as before), then the video replay (the rest), whose renderer starts cold (5 to 27 minutes); 300 s of margin: tests/grade.py
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 5400.0           # a first run builds the simulator image from public sources, about 25 min on a fast link (tasks/labutopia/README.md, First build)
cpus = 8
memory_mb = 32768

[agent]
timeout_sec = 3600.0              # LabUtopia's budget, both modes (tasks/labutopia/README.md): a container's first simulator with its renderer takes 5 to 27 minutes to start
# LabUtopia's scripted controllers are in its public repository (and a standard-mode agent could rebuild the simulator
# from it): the agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0           # a first run builds the simulator image from public sources, about 25 min on a fast link (tasks/labutopia/README.md, First build)
cpus = 8
memory_mb = 39936
storage_mb = 20480
gpu_types = ["RTX 4090", "L40S"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
