schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-round-off-i00-privileged"
description = "Embodied Olympics round-off (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Do a round-off: go from your feet onto your hands, turn half round through the handstand and come down onto both feet together facing back the way you came, then stand. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "round-off"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "round_off"
category = "parkour-apparatus-balance"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 20.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: positive by injection (a straight fist handstand placed with the chest facing +x, hand support with real contacts for 0.05 s, then 2.6 m/s up and 4.1 rad/s about the left-right axis: it flies, turns upright and lands on both feet facing -x, 0.64 s from the feet leaving the floor to the landing; the rotation removed at touchdown, the walk at zero command stands it). The round-off is one element through the handstand, not a held handstand (FIG CoP): the hand support, the landing and the hands after it are judged every 1 ms; a foot counts as down until it has been off for more than 0.03 s, the second foot within 0.10 s of the first; the first foot must be down at most 0.70 s after the feet left the floor for the hand support. Negatives: nop, landing facing +x (a tinsica), sideways, one foot then the other, hands down at the landing, a jumped half-turn without hands, a crouch hop on the hands (not inverted), a landing that falls, outside the area, 0.8 s on the hands (a held handstand); a model run's kick-up handstand held about 2 s, then a step down, one foot 0.15 s before the other, fails: 'not a round-off: the hand support lasted too long' at 4.34 s. Every rule above is judged in the family's own 1 ms substep hook.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
