# demos/routing/ring_transfer_physical_demo.py 的运行模式参数。

defaults:
  - default
  - _self_

# 动作。三条共用同一套判定，阈值要卡在做对与做错之间：
#   carry          任务本身（搬运套索，默认）：在 A 旁钩起整环、悬着搬到 B 近侧、侧向推过 B、放下。终态 {B}。
#   transfer       另一条路线（借 A 撑开）：钩住远端帽套上 B，再捏住 A 侧帽提过 A 顶。只在近柱距几何下
#                  可用（离线门报告），第二版默认几何下不可用。
#   drape_outside  对照：远端帽落在 B **近侧**、不做第二段。俯视投影像围住了 B，
#                  绕数读 0；终态仍是 {A}。
#   lift_only      对照：用 carry 的捏取与反应式抬离把环从出生柱提离，放到两柱中点，不套目标柱。终态空集，判失败。
motion: carry

# 机械臂退开后再空跑多少步才停止录制（dt=0.01，100 步 = 1 秒）。
final_hold_steps: 100

# 诊断：跑完这个 waypoint（lift_low / over_anchor / clear / travel / approach / push / lower）就停住 final_hold_steps 步
# 并退出（exit 2），录像照常保存。null = 跑完整个流程。
stop_after: null

# --- 变体（2026-09-04）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）：
#   run.randomize_layout=true run.seed=3
# 默认关 = 确定性布局。demo 建场景后打印 `ring_transfer variant seed=…` 与 `ring_transfer checks …` 两行。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识（角点 sweep 用 corner_<id>）。
variant_id: default
