schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/live.mp4", service = "sim" },
  { source = "/data/live.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },
  { source = "/data/journal.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/video.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/tactilelab-fem-plug-insert-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): TactileLab fem_plug_insert (dual-arm X-Trainer whose right gripper carries two GelSight Mini tactile sensors, Isaac Lab 2.3 / Isaac Sim 5.1) on the same frozen instance as the privileged task. Carry the soft plug from its pick socket into the press-fit hole and seat it. The agent only gets a client: get_obs (wrist RGB and depth, the two tactile images, proprioception), submit (ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory and grades the live episode."
keywords = ["robotics", "tactilelab", "isaac-lab", "isaac-sim", "x-trainer", "tactile", "gelsight-mini", "standard-mode", "trajectory", "fem_plug_insert"]

[metadata]
task_type = "trajectory"
simulator = "tactilelab"
robot = "xtrainer-gsmini"
family = "fem_plug_insert"
dynamics = "static"
protocol = "eai-standard/2.2"
oracle = "full"
oracle_evidence = "solution/: the privileged twin's reference trajectory (its scripted demonstration recorded through the Session), streamed through the client as float64 ee_pose rows; graded 1 by the live episode on an L40S (2026-10-29); nop graded 0."
instance_seed = 0
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"
timeout_sec = 9143

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 16384
storage_mb = 10240
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
