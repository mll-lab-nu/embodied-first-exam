schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-badminton-matchlow-i01-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): singles badminton on a 0.4-scale court (BWF Laws, one game to 11) at the LOW level: a Franka Panda with a racket on a gantry base, driven by your own joint-level commands (no act skill), against the scripted opponent, one match against the scripted opponent at level 2 on the frozen instance of embodied-olympics-match-badminton-matchlow-i01-realtime (seed 8, S = 20). Full simulator in development (read and change any state, reset the whole match); the deliverable is a closed-loop Python program that plays a fresh unmodified match in the verifier, on the original S = 20 clock, seeing the full state instead of camera images."
keywords = ["robotics", "mujoco", "fullsim", "policy", "badminton"]
[metadata]
task_type = "policy"
simulator = "mujoco"
robot = "franka-panda"
family = "badminton_matchlow"
dynamics = "dynamic"
verifier_wall_clock = true
instance_seed = 8
opponent_level = 2
source_commits = ["02c93822a35e"]
source_task = "roboolympics/badminton-match-wallclock-program-lowlevel-standard"
exporter = "Embodied Olympics full-simulator exporter"
official = false
expert_time_estimate_hours = 1.0
oracle = "partial"
oracle_evidence = "full-state reference program (solution/): the badminton privileged twins' truth reference, each act lowered in process by the twin's act.py into joint rows; a local Harbor oracle run lost 0:11 (valid, replay identical); the nop (no program) scores 0"
validated = false

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [8, 202, 212]

[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240
[verifier]
timeout_sec = 9600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
