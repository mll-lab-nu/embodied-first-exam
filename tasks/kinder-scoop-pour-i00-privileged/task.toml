# Generated from scripts/kinder/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/kinder-scoop-pour-i00-privileged"
description = "KinDER ScoopPour3D-o30 (privileged mode): produce one replayable trajectory that reaches the goal, frozen scene instance i00."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", "mujoco", "tidybot", "mobile-manipulation", "physical-reasoning", "trajectory", "scoop-pour"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "tidybot-plus-plus"
# KinDER env kinder/ScoopPour3D-o30-v0
family = "scoop-pour"
mode = "privileged"
# scene = environment/instance.json (KinDER's seed + a digest of the scene it builds); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 4.0
oracle = "none"
oracle_evidence = "none known: GPT-6 Luna failed both modes, and no rollout of this instance is published; human review in PR #8"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container, built from tests/Dockerfile (docs/PROTOCOL.md §2.6): the agent's container,
# where it was root, is gone by then, and only /app/output/ crosses over. It replays locally, with no network.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# The model APIs and nothing else (scripts/set_agent_egress.py HOSTS): KinDER and its baselines are public.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 16
memory_mb = 16384

[environment.healthcheck]
# The agent's clock starts once the simulator is ready (docs/PROTOCOL.md §2.9). The agent starts the simulator in its own
# processes, so before Harbor sets up the agent it runs this warm-up in the agent's container: one launch of the simulator
# with the frozen instance through the task's own tooling, which pays the trial's one-time start-up (shader and kernel
# caches, the instance check) outside [agent].timeout_sec. It writes no session log, trace or output; its log, with the
# start and end times, is /logs/artifacts/rcb_warmup.log (a trial artifact).
command = '''
exec >> /logs/artifacts/rcb_warmup.log 2>&1
date -u +"%FT%T.%3NZ warm-up start"
RCB_SESSION_LOG= RCB_SESSION_LOG_KEEP= RCB_AGENT_TRACE_DIR= timeout -k 30 3300 python - <<'PY' || exit 1
from rcb_kinder import Session
s = Session("/app/instance.json")
PY
date -u +"%FT%T.%3NZ warm-up done"
'''
timeout_sec = 3600.0
retries = 2
