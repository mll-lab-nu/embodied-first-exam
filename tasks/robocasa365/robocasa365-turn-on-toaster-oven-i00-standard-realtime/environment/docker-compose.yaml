# Standard-realtime mode (PROTOCOL §4b): the simulator runs in the `sim` sidecar (the agent cannot open it), on its own clock
# once an episode starts (sim/rcb_realtime.py, the shared eai-standard/2.3 layer, with sim/server.py, this benchmark's
# adapter on casa_tool); the agent only reaches port 8000. No `expose`/`ports` on sim: under Harbor's egress control it
# shares main's network namespace (localhost:8000).
# CPU only, as the standard twin (MuJoCo physics, OSMesa rendering, about 0.12 s a 320 x 240 frame): no GPU reservation.
# Crash recovery: compose restarts the service, which resumes the same episode, paused, never a reset.
# Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the task's configuration;
# results under other settings are reported separately.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 6   # rcb-monitor
    mem_limit: 14336m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /tmp
    command: python /srv/rcb_realtime.py
    restart: on-failure:6          # a resume continues the episode, paused
    environment:
      RCB_INSTANCE: /srv/instance.npz
      RCB_DATA: /data
      RCB_STARTUP_TIMEOUT_S: "600"
      RCB_MAX_CONTROL_STEPS: "3000"     # an episode's control steps (150 s of robot time)
      PYTHONPATH: /srv
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-2}"                # S = 2: the world runs at 1/S of real speed (this task's measured RTF; PROTOCOL §4b)
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-10}"        # 10 resets (PROTOCOL §4b default); 0: one episode
      RCB_START_SHA: "47a28febb4d391f26fb58b4dd7f95837bf1314b3fb9779d1a00c7236bb407a64"   # the state its episodes start in (frozen/start_state.json)
      RCB_WALL_CLOCK_S: "3600"
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.3.0@sha256:53154417782408df8309194971b08b18c3682d2b337e2e3b2eb4c88fe025ab85
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
