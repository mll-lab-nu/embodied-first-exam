# Generated by scripts/labutopia/generate.py -- edit the generator, the shared sources, families.json or the instance, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/labutopia-heat-liquid-i00-privileged"
description = "LabUtopia heat_liquid (HeatLiquid; a chemistry laboratory with a Franka Panda on Isaac Sim): produce one replayable trajectory of joint targets. Put the beaker on the heater's plate and press the heater's button. Frozen scene instance (LabUtopia's reset, seed 1); graded by two fresh-process replays with a copy of LabUtopia's own success check."
authors = [{ name = "Canyu Chen" }]
keywords = ["robotics", "labutopia", "isaac-sim", "laboratory", "chemistry", "franka-panda", "code-as-policy", "trajectory", "heat_liquid", "privileged"]

[metadata]
author_name = "Canyu Chen"
task_type = "trajectory"
simulator = "labutopia"           # LabUtopia @ 8df7278 on NVIDIA Isaac Sim 6.1.0 (PhysX on the CPU, RTX cameras)
robot = "franka-panda"
family = "heat_liquid"
mode = "privileged"
oracle = "full"
level = 2                         # LabUtopia's own level for the task (config level2_HeatLiquid)
instance_seed = 1                 # numpy's and Python's random generators before LabUtopia's reset
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 3600.0              # two replays of about a minute, then the video replay, whose renderer starts cold (5 to 15 minutes)
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 32768

[agent]
timeout_sec = 5400.0              # LabUtopia's budget, both modes (docs/benchmarks/labutopia.md): a container's first simulator with its renderer takes 5 to 15 minutes to start
# LabUtopia's scripted controllers are in its public repository (and a standard-mode agent could rebuild the simulator
# from it): the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 32768
