# ---------------------------------------------------------------------------------------------------------------------
# Neural Landing: simulation.py: crash = a non-foot geom on the floor or tilt > 0.8 rad or |x| or |y| > 3 or z > 3 or a
# divergence; off_pad_contact = a foot contact farther than PAD_RADIUS 0.45 m from the pad centre; impact = vertical and
# horizontal speed just before the first touch (< 0.4, < 0.25); settled = feet touching and xy error < 0.15 and tilt <
# 0.15 and speed < 0.08, checked every 10 ms; SettlingTimer: the final uninterrupted settled run must reach 1 s (101
# samples) and last to the end (a break resets completion_time to None). HORIZON 16 s; 6 held-out cases.
[families."roboengineer/landing-random-pad"]
no_twin = "roboEngineer is graded on dynamics the agent is never shown; a privileged mode would expose them"
success = """
There are 6 held-out cases. Each is a 16 s episode: the drone starts 0.8 to 1.5 m up and lands on a round pad of radius
0.45 m on the floor, placed per case. A case succeeds when only the drone's feet touch the floor, and only inside the
pad; at the first touch the drone's vertical speed is below 0.4 m/s and its horizontal speed below 0.25 m/s; and the
drone is settled without a break for at least the last 1 s of the episode, checked every 10 ms: feet on the floor,
centre within 0.15 m (horizontally) of the pad's centre, tilt below 0.15 rad and speed below 0.08 m/s. The case fails if
another part of the drone touches the floor, a foot touches the floor outside the pad (even if the drone later slides
onto it), the tilt exceeds 0.8 rad, the drone goes more than 3 m from the origin along x or y, or it climbs above 3 m.
"""

# ---------------------------------------------------------------------------------------------------------------------
# G1: deploy.py rollout(): 20 s at 50 Hz; speed command from 2 s; fallen = pelvis clearance above the terrain < 0.45 or
# body z axis component < 0.5 or non-finite -> the episode ends; success = not fallen and elapsed >= 20 s and mean
# |x speed - command| over t >= 2 s < 0.25 and forward travel from 2 s > 0.65 * speed * 18 and |lateral| < 2.
[families."roboengineer/g1-terrain-walk"]
no_twin = "roboEngineer is graded on dynamics the agent is never shown; a privileged mode would expose them"
success = """
There are 12 held-out cases, three on each kind of ground: flat, sloped, rough and stepped. Each is a 20 s episode in
which the forward speed command (0.5, 0.6 or 0.65 m/s) starts at 2 s. A case succeeds when the G1 does not fall during
the 20 s, its mean absolute error between forward speed and the command from 2 s on is below 0.25 m/s, its forward travel
from 2 s on is more than 65 % of the commanded distance (speed × 18 s), and its sideways travel is less than 2 m. The G1
has fallen, which ends the case as a failure, when its pelvis comes within 0.45 m of the ground below it or its body
tilts more than 60° from upright.
"""
