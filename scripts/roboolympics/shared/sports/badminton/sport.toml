# badminton: robot singles badminton in real time (docs/framework_zh.md §4.2, §8). Migrated from the legacy tree in
# stage 3 (scripts/olympiad/badminton, scripts/olympiad/shared/badminton; sim/bm.py: court, shuttle, robot, stroke
# controller, scripted opponent, referee; sim/bduel.py: the two-robot match; sim/wc.py: the legacy planner's exact
# snapshots and plan installation). The physics (shuttle drag, racket contact law, robots) is the legacy one; the
# serve is not: since 2026-10-07 the players' robots serve by the BWF service laws (D2, D4, D6, D7; README), so the
# legacy machine-serve recordings no longer apply and were retired from the golden set. The format names keep the
# legacy task names (badminton-match-wallclock-program-standard, badminton-duel-wallclock-program-standard).

[sport]
name = "badminton"
title = "Robot badminton"
summary = "robot singles badminton on a regulation court in real time (slowed down): a Franka Panda arm with a racket on an x-y sliding base, a point-mass shuttle with high quadratic drag (terminal speed 6.8 m/s) and no bounce, a racket contact law; first to 5 points, rally scoring; the players' robots serve (the rally winner serves next): the server tosses the shuttle (from rest or rising up to 0.5 m) at a point it chooses and hits it underhand, below 1.15 m, into the diagonal service court; format match-wallclock: you against a scripted computer opponent (levels 1-2, `game spec` match.opponent_level), format duel-wallclock: two players"
protocol = "realtime"
revision = "badminton-wallclock-5+duel-7+core-0.2"   # bump on any change that alters play (4/6: the players serve; 5/7: the players' images draw the arms with the Franka Panda's 25k visual meshes)
physics = "mujoco (robots, PD-controlled joints at 1 ms) + a point-mass shuttle with quadratic drag integrated at 1 ms (sim/bm.py)"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "BWF Laws of Badminton (BWF Statutes, Section 4.1, version 5.0)"
version = "2025-04-26"
url = "https://extranet.bwf.sport/docs/document-system/81/1466/1470/Section%204.1%20-%20Laws%20of%20Badminton%20-%2026%20April%202025%20V5.0%20(2)%20.pdf"

[[deviations]]
id = "D1"
rule = "7"
text = "one short game: first to 5 points, from 4-4 a two-point lead is needed, at most 7 (6-6: the next point wins) instead of best of three games to 21 (cap 30); the match also ends after 300 hits (both sides) or 40 points played (lets included): the player ahead wins, at equal points the winner of the last point"
affects_result = true
[[deviations]]
id = "D2"
rule = "9.1.5-9.1.8"
text = "the robot has no free hand to hold and drop the shuttle: the server tosses it with the command toss {pos: [x, y, z], height: H} (the common racket-sport toss, docs/conventions/racket_serve_zh.md): when the command takes effect the shuttle appears at that point (0.5-1.8 m high, within 1.0 m horizontally of the server's base, on its half) and is released from rest (H = 0) or projected straight up to rise H (at most 0.5 m; the Laws do not forbid a small toss); until then it is held beside the server. The toss has no spin (a point mass has none, Law 9.1.5). Judged: the server's racket must hit it (a miss is a fault, Law 9.1.8), with the shuttle below 1.15 m at the hit (Law 9.1.6, judged at the shuttle's point: it has no size) and leaving the racket upwards (Law 9.1). Not judged: the racket hitting the base of the shuttle first and moving forwards throughout the service (Laws 9.1.5, 9.1.7)"
affects_result = true
[[deviations]]
id = "D3"
rule = "13.3-13.4"
text = "the shuttle is a point mass: a crossing of the net plane below the net top (between the posts) is a fault of the hitter; touching the net or reaching over it is not judged; a racket meets the shuttle only on its own half and only when it is that player's turn (no double hits)"
affects_result = true
[[deviations]]
id = "D4"
rule = "9.1.3-9.1.4"
text = "before every serve the referee puts both robots at rest in the ready pose at a fixed spot in their service courts (diagonally opposite: the right courts when the server's score is even, Law 10.1): x = +0.3 (right court) or -0.3 (left court), y = -4.0 in each robot's frame; the spot is the robot's home for the point (where its base returns between strokes). Standing still (Law 9.1.4) is judged on the base: a base more than 5 cm from its spot before the serve is delivered (hit, or faulted) is that player's fault; both at once: a let (Law 14.2.2). The base moves within |x| <= 3.25, -7.5 <= y <= -0.5 at up to 6 m/s and 20 m/s^2"
affects_result = true
[[deviations]]
id = "D5"
rule = "-"
text = "the last resort of the no-draw rule (equal points at the match limit and no point won) is not from the rulebook: the player who received first wins (format match-wallclock: the opponent)"
affects_result = true
[[deviations]]
id = "D6"
rule = "9.1.1, 16.6-16.7"
text = "undue delay has a fixed limit: the server must toss the shuttle within 3 s after the receiver is ready (1 s after play resumes, Law 9.4), else it is a service fault (the receiver's point); a player's third such fault disqualifies it (it loses the match) instead of the umpire's warning and the referee's discretion (Laws 16.7.1-16.7.2)"
affects_result = true
[[deviations]]
id = "D7"
rule = "6"
text = "no toss: format duel-wallclock: the runner plays both orders of the first server (match.first_server); format match-wallclock: you serve the first point"
affects_result = true

[formats.match-wallclock]             # one model seat against the scripted opponent inside the world (bm.Match)
seats = ["A"]
opponent = true                       # success = winning a valid match (core/grading.py), as in the legacy task
levels = [1, 2]                       # the opponent level (RCB_LEVEL; default 1)
[formats.duel-wallclock]              # two seats (bduel.World), mirrored: each plays in its own frame
seats = ["A", "B"]
first = ["A", "B"]                    # the first server (Law 6, D7); the runner plays both orders

[modes]
action_levels = ["high", "low"]       # high: the racket command `act` (lowered to joint targets); low: joint targets
plays = ["program"]

[timing]
slowdown = 20                         # the legacy default (RCB_SLOWDOWN; official 1, 2, 5, 10, 20)
start_timeout_s = 1800                # the second seat may start up to 30 min after the first (legacy START_TIMEOUT_S)
ready_timeout_s = 300                 # each review after a point (legacy READY_TIMEOUT_S), else the late side loses

[actions.cli]                         # `game none`; act takes vectors: `game act '{"type": "act", "t": 0.8, ...}'`
high = { none = [] }
low = { none = [] }

[observation]
fields = ["score", "point", "ball", "t_since_played", "heard", "robot_base_xy", "q_arm", "racket_pos", "racket_normal",
          "ball_in_play", "ball_state", "serve_in_s", "you_receive_serve", "serve", "command", "pending_commands",
          "last_points", "last_shots", "opponent_level", "q_target", "you_serve"]
renderer = "mujoco"                   # the sport draws its own views (the legacy 2 x 4 tiles, MuJoCo; plugin.Views)
frame_budget_ms = 4000                # one observation, 8 tiles of 480 x 360 (CPU osmesa, a loaded host)
columns = 4
# Since wallclock-5 / duel-7 the arms are drawn with the Franka Panda's visual meshes (presentation/
# presentation.toml players = "25k", bundled into the simulator; renderer rule 6). Measured 2026-10-08 (observations
# with new tiles, 30 control steps apart, osmesa, 6 CPUs, host load ~8-10 on 32 cores), median / p95 ms per observation
# at 2 llvmpipe threads: match scene 137 / 171 (duel 142 / 190), 25k meshes 154 / 195 (duel 192 / 220); 1 thread:
# 223 / 255 (223 / 249) and 254 / 281 (303 / 357)
render_threads = 2                    # llvmpipe threads per render process (LP_NUM_THREADS); one render process per seat
sim_cpus = 6                          # the sim container: 2 seats x 2 render threads + the world, the planners and the core

[spec]                                # the rule constants (the simulator's values; tests/test_badminton.py checks them)
match = "first to 5 points (rally scoring); from 4-4 a player must lead by 2, and at 6-6 the next point wins (at most 7); the match also ends after 300 hits (both sides) or 40 points played (replayed lets included): then the player with more points wins, at equal points the player who won the last point"
play = "there is no bounce: hit the shuttle before it reaches the floor. Your shot is good if your racket meets the shuttle once, on your half, and the shuttle passes over the net and lands in your opponent's singles court (lines are in); after your hit your racket no longer touches it. You lose the point if your shot goes into the net (crosses the net plane below the top), comes down on your own side or lands out, or if a shuttle that is yours to hit lands in your court; an opponent's shot that would land out of your court wins you the point, so you may let it go. Serves (BWF Law 9): the winner of a rally serves the next point (after a let the same server; state.you_serve, state.serve). Before every serve both robots are put at rest in the ready pose at their spots: x = +0.3 in the right service court or -0.3 in the left one, y = -4.0 (your frame); both stand in their right courts when the server's score is even, else in their left ones (diagonally opposite); the spot is your base's home for the point. From 1 s after play resumes (the receiver is ready; state.serve.phase 'open') the server has 3 s to toss the shuttle with {'type':'toss','pos':[X,Y,Z],'height':H}: when the command takes effect (the same lead as an act) the shuttle appears at that point (0.5 <= Z <= 1.8, within 1.0 m horizontally of your base, Y <= -0.5) and is released from rest (H = 0 or omitted) or rises H straight up (0 <= H <= 0.5) before it falls (until then it is held beside the server). Then hit it with your racket (an act, which you may send before the toss): the serve is good if your racket meets the shuttle below 1.15 m, the shuttle leaves the racket upwards, passes over the net and lands in the receiver's diagonally opposite service court (between its short service line and its back line, lines in) or is returned. It is the server's fault (the receiver's point) if it does not toss the shuttle in time (undue delay; the third time disqualifies the player: it loses the match), misses the shuttle, hits it above 1.15 m or not upwards, or the serve hits the net or lands outside that court. Both bases must stay within 5 cm of their spots until the serve is hit (or faulted): a base moving earlier is that player's fault (both at once: a let, replayed)"
opponent = "format match-wallclock: a scripted computer opponent. You serve the first point; the opponent serves when it won the last rally: from its service court at 1.05 m, upwards, high and deep or short into your diagonal service court, always within your reach (level 1: 70 % high serves, towards the middle of the court; level 2: 50 % high, wider and closer to the short service line); it stands still in its service court while you serve. It never makes an unforced error: it returns every shuttle it can reach, into your court and within your reach; shuttles far from it or fast beat it; level 2 reacts and moves faster and reaches further than level 1"
world = "metres; your own frame: x to your right, y towards the opponent, z up. Floor z = 0; singles court |x| <= 2.59, |y| <= 6.70 (lines in); the net is the plane y = 0 with its top at z = 1.524 (posts at x = +-3.05); short service lines at |y| = 1.98; the centre line x = 0 divides each half into a right and a left service court. Your half is y < 0"
robot = "a Franka Panda arm on a 1.0 m pedestal whose base slides on rails (|bx| <= 3.25, -7.5 <= by <= -0.5, up to 6 m/s and 20 m/s^2; home: the point's spot (+-0.3, -4.0), see play); the racket head centre is 0.56 m beyond the flange; the string face is a disc of radius 0.14 m. The racket meets shuttles 0.4-2.5 m above the floor; overhead contacts (1.8-2.5 m) allow the fastest, steepest shots"
shuttle = "a point mass under gravity (9.81 m/s^2) and quadratic air drag, dv/dt = g - K |v| v with K = 0.212 per metre (terminal speed 6.8 m/s): hit at 40 m/s it slows to about 10 m/s within 0.3 s, and a high shuttle falls almost vertically at close to 6.8 m/s. No spin, no wind, no bounce"
racket_contact = "the racket meets the shuttle when the shuttle's centre crosses the string plane within 0.14 m of the head centre; the shuttle leaves exactly along the face normal n (the side the head moves towards, relative to the shuttle) at the speed 20 max(0, v_head.n) (1 - 0.3 (r/0.14)^2) + 0.15 max(0, -v_in.n), where v_head is the head velocity, r the contact's distance from the head centre and v_in the shuttle's incoming velocity; the rest of the head and incoming velocity is lost. A head speed along the normal of 0.5 m/s gives about 10 m/s, 2 m/s about 40 m/s; the arm manages up to about 2.4 m/s"
act = "high level: {'type':'act','t':T,'pos':[PX,PY,PZ],'normal':[NX,NY,NZ],'vel':[VX,VY,VZ]}: the racket's state at contact, T s after the act takes effect: the head centre, the string-face normal and the head velocity (m/s). Limits: 0 < T <= 5, |x| <= 3.4, -7.5 <= y <= -0.3, 0.2 <= z <= 3.0, speed <= 8 m/s. The act takes effect `act.lead_steps` control steps after the step at which it arrives (`game spec`; the stroke is planned meanwhile) and replaces the stroke under way; until then the robot keeps its current command. The controller drives the base to stand for a forehand at the contact point (or as far as it gets in time) and swings the arm under the joint speed limits; it knows nothing about the shuttle. The delivered state scatters by about 6 mm, 0.8 degrees and 3 % (seeded; format duel-wallclock: both robots draw from one sequence, the n-th act of each robot gets the same scatter). {'type':'none'} cancels the stroke (the robot returns to its ready pose, the base to its spot), with the same lead; {'type':'toss','pos':[X,Y,Z],'height':H} tosses the shuttle for your serve (see play), with the same lead"
lowlevel = "low level: {'type':'traj','q':[[base_x, base_y, q1..q7], ...]}: joint targets, one per 10 ms control step from the next step on (then the robot returns to its ready pose and the base to its spot), each within the joint ranges and speed limits of `game spec` joints; none and serve as above, at the next step"
observation = "a PNG of 2 rows x 4 columns of 480 x 360 tiles: row 1 a camera behind and above your base line looking down the court, row 2 a camera at the side of the court (x < 0) looking along +x (your half on the right); the columns are frames 60 ms apart, newest on the right, with each frame's step and game time (view_steps, view_sim_times). No shuttle coordinates: the shuttle is drawn enlarged, an orange cork (12 cm ball centred on its position) with a white skirt behind it. `game spec` gives both cameras' poses and intrinsics (pinhole, 45 degree vertical field of view, focal length 434.6 px, principal point at the tile centre). The state gives your robot (robot_base_xy, q_arm, racket_pos, racket_normal), what you heard (tosses, serves and hits, with their times), whether the shuttle is coming to you, and the serve: you_serve, serve.court (right or left), serve.phase (waiting: the receiver is getting ready; open: the server may toss; tossed; done: the serve was delivered), serve.opens_in_s and serve.deadline_in_s for the server, serve.tossed_at_step; a point lost by a service fault says 'serve_fault:<reason>: ...' (undue_delay, missed, too_high, not_upwards, net, out, moved), the receiver's early move 'receive_fault:moved: ...'"
duel = "format duel-wallclock: another agent controls an identical robot across the net; in each player's frame its own half is y < 0. match.first_server serves the first point; then the winner of each rally serves (both players serve by the same rules, see play)"

[tiebreaks]
order = ["disqualification", "score", "last_point", "first_receiver"]
text = "a player disqualified for repeated undue delay (its third serve not tossed in time) loses; else first to 5 points (from 4-4 by 2, at most 7); at the match limit (300 hits or 40 points played) the player with more points; at equal points the player who won the last point that was not a let; then (last resort, not from the rulebook) the player who received first (format match-wallclock: the opponent)"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "an out-of-range, non-finite or malformed command is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_commands_are_refused"
[[exploits]]
id = "E2"
text = "low-level joint targets outside the joint ranges or faster than the joint speed limits are refused when they would take effect and change nothing"
test = "test_exploit_joint_limits"
[[exploits]]
id = "E3"
text = "acts cannot be stacked: a command sent before the previous act took effect is refused (HTTP 409)"
test = "test_exploit_no_stacked_acts"
[[exploits]]
id = "E4"
text = "the observation holds no shuttle position or velocity and no opponent state (only the images, what was heard and the player's own robot); the legacy privileged /oracle endpoint is gone"
test = "test_exploit_no_shuttle_state_in_observation"
[[exploits]]
id = "E5"
text = "doing nothing gains nothing: a player who never hits loses the points it receives, and a player who never serves faults on every serve (undue delay): it loses the match"
test = "test_exploit_idle_loses"
[[exploits]]
id = "E6"
text = "a racket meets the shuttle only on its own half and only on its turn: a robot standing at the net cannot hit the opponent's shot before it crosses, and cannot hit twice"
test = "test_exploit_no_reach_over_or_double_hit"
[[exploits]]
id = "E7"
text = "the rule constants the players are told (/spec, [spec]) are the simulator's"
test = "test_exploit_spec_is_the_simulator"
[[exploits]]
id = "E8"
text = "a lowered act replays exactly: the episode holds the low-level joint targets (planned by the legacy stroke controller at the effect step), and a fresh replay reproduces the live state"
test = "test_exploit_lowered_act_replays"
[[exploits]]
id = "E9"
text = "the serve is judged by the service laws: only the server tosses the shuttle, once per serve, from the step the receiver is ready, within the toss limits (else refused); a miss, a hit above 1.15 m or not upwards, a serve into the net or outside the diagonal service court is the server's fault; a base leaving its spot before the serve is that player's fault; the rally winner serves next from the court of its score's parity"
test = "test_exploit_serve_rules"
[[exploits]]
id = "E10"
text = "never serving does not pay: a player who wins rallies but never tosses the shuttle is disqualified at its third undue-delay fault and loses, even when ahead on points"
test = "test_exploit_never_serving_is_disqualified"

[players]
reference = "reference"               # camera-only (the legacy duel's cam_player.py) + a scripted serve: wins the default configuration
reference_class = "builtin_players:Reference"
check = []                            # the generic tests play the reference only (each match draws thousands of tiles)

[fairness]
policy = "reference"
matches_per_order = 20                # N = 40 (the minimum): one in-process duel takes minutes (planning + tiles);
                                      # a realtime sport's wide interval only warns
max_advantage_pp = 5
mirror = "statistical"                # seats are mirrored worlds (one shared scatter sequence; the players serve, the first server alternates)

[official]
seeds = [1, 2, 3, 101, 111, 121, 202, 212, 222]   # duel: 1-3; match: the legacy level seeds (L1 101-121, L2 202-222)
levels = [1, 2]
slowdowns = { program = [1, 2, 5, 10, 20] }
first_any = true

[golden]
episodes = "golden"                   # recorded under the player-serve rules; the legacy machine-serve records are retired (README)

[[tasks]]
format = "match-wallclock"
action_level = "high"
id = "badminton-match-wallclock-program-standard"   # the legacy task name
[[tasks]]
format = "duel-wallclock"
action_level = "high"
id = "badminton-duel-wallclock-program-standard"    # the legacy task name

[capabilities]                        # docs/capabilities_zh.md §6
a1 = 2                                # the shuttle's flight only from the camera images (rays, a flight fit)
a2 = 2                                # high drag: the shuttle's flight, the racket contact law
a3 = 2                                # a robot arm on a sliding base, a stroke under joint limits and scatter
a4 = 2                                # real time: the shuttle does not wait; the act lead
b1 = 1                                # the scoring, service (who serves, courts, toss, faults) and fault rules, the match limit
b2 = 2                                # placement against the opponent (deep corners, short), reading its position
b3 = 0
physics = ["drag"]                    # high-drag flight (docs/capabilities_zh.md §6: 高阻力飞行); the shuttle has no
                                      # spin and no bounce in this simulator, so spin_bounce is not tested

[check]                               # tools/check limits: an in-process duel takes 6-15 min (planning + 2 seats' tiles)
stage_timeout_s = 36000               # stage 2 (~25 in-process matches) and stage 4 (40 duels, serial) take hours
live_player_timeout_s = 4500          # the live duel at x20 took 1888 s of 3000
