# linkbar_rotate_to_zone_physical_demo 的运行模式参数。
#
# 场景几何与两块区域的角位置、颜色都在 task 配置里，不在这里——它们属于实例定义。
# 逐 episode 换实例就是覆盖这几项：
#   task.zones.target=color_1
#   task.zones.color_1.angle_deg=30 task.zones.color_2.angle_deg=60
#   task.zones.assignment.color_1=blue task.zones.assignment.color_2=red

defaults:
  - default
  - _self_

# 对照组。两条规则跑同一个 episode，动作成本相同，分开它们的是「读了什么」。
#   oracle         : 读指令说的颜色，在画面里找到涂那个颜色的区，转过去
#   nearest_zone   : 转向角度上更近的那块区域，不看颜色也不看指令
# 两块区域角位置独立随机后，nearest_zone 恰好对一半——离线部分见
# tests/check_linkbar_planner.py，这里是它在真实物理上的复核。
# 2026-09-09 之前还有第三条 nearest_colour（转到与销颜色最接近的那块区）：它在 2026-09-08
# 之前就是 oracle（那时销取目标区的颜色），09-08 销改成第三种颜色后掉到一半。现在梁上不留
# 任何颜色，这条规则没有输入，已删除。
oracle_mode: oracle

# full        : 完整 episode（决策 → 转 → 退刀 → 沉降 → 判定）
# rotate_only : 只跑到扫掠结束，不判定。原语自身的验收档（到位角、跟随误差、指位）
stage: full

# 故意的欠转／过转，用来造执行误差的对照 run。加在规则给出的目标角上，
# 规则本身仍是 oracle——演示的是「正确的计划 + 执行偏差」。
# 超过区域半宽（8°）应当判 outside_zone，落在半宽内应当照样成功。
target_offset_deg: 0.0

# 判定完成后再步进多少步。纯粹为了录像。60 步 = 0.6 秒。
final_hold_steps: 60

# --- 变体（2026-08-29）------------------------------------------------------
# 按 seed 在包络内随机布局（generation/layout_randomization.py 的注册条目）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识。
variant_id: default
