# Pipeline smoke test: HoldVLA in process on Panda buzz_wire_3d for 2 s of simulation (80 control steps).
policy:
  address: null                 # model server host:port; switching models changes only this line
  local: vla/configs/models/hold_panda.yaml   # model config run in process via LocalClient instead
task:
  id: buzz_wire_3d
  variation: base
  seeds: [0]
  sim_seconds: 2
run:
  execute_steps: null           # null = PolicySpec.execute_steps
  record: true
  output: runs/test_results/20260930_vla_smoke_hold_buzz_wire
env: {}                         # passed to topogym.make; grasp assist stays off (default)
