# Agent time cutoffs: THE table (docs/PROTOCOL.md §2.12). One row per benchmark, one number per mode, in seconds;
# optional exceptions per family and per task further down.
#
# The number is the agent's wall-clock limit: Harbor's `[agent] timeout_sec`, counted around the agent's run only
# (after the environment is built and started and the harness is installed); at the cutoff the agent is stopped and the
# trial is graded as it stands. Everything that states or follows the limit is written from this file by
# scripts/task_conventions.py (`normalize`): `[agent] timeout_sec` in task.toml, the closing `## Time limit` section of
# instruction.md ("You have N seconds to complete this task. ..."), the README's "Agent time budget" row and, in the
# standard modes, the sim service's `RCB_WALL_CLOCK_S`.
#
# To change a time:
#   1. edit the number in this file, and add a `[[history]]` entry at the bottom (date, who decided, old -> new):
#      CI and `apply` refuse a changed number without one;
#   2. python3 scripts/task_cutoffs.py apply     # rewrites the tasks, docs/CUTOFFS.md and tasks/dataset.toml (~3 min)
#   3. commit everything and open a pull request (CI runs ci_checks/check-cutoffs.py and the generators' checks).
# Never edit the number in a task, a template or a generator: ci_checks/check-cutoffs.py fails when a task disagrees
# with this table. Limits: a whole number of seconds, at most 14400 (PROTOCOL D8; RoboTangle's exception: 21600).
# The benchmark names are the labels of scripts/task_conventions.py BENCHMARKS; a mode a benchmark has no tasks in has
# no number.

[cutoff_sec]
"AutoBio"           = { privileged =  3600, standard =  3600 }
"BEHAVIOR-1K"       = { privileged =  7200, standard =  7200 }
"BiGym 2.0"         = { privileged =  3600, standard =  3600, standard-realtime = 3600 }
"DexJoCo"           = { privileged =  3600, standard =  3600 }
"DexToolBench"      = { privileged =  3600, standard =  3600 }
"HumanoidBench"     = { privileged =  3600, standard =  3600, standard-realtime = 3600 }
"KinDER"            = { privileged =  3600, standard =  3600 }
"LIBERO-MAX"        = { privileged =  1800, standard =  1800 }
"LabUtopia"         = { privileged =  3600, standard =  3600 }
"ManiGuard"         = { privileged =  3600, standard =  3600 }
"MetaWorld+"        = { privileged =  1800, standard =  1800 }
"MolmoSpaces"       = { privileged =  3600, standard =  3600 }
"MuJoCo Playground" = { privileged =  1800, standard =  1800 }
"MyoSuite"          = { privileged =  3600, standard =  3600, standard-realtime = 3600 }
"Panda Dynamic Scenes" = { privileged =  3600, standard =  3600 }
"RoboCasa"          = { privileged =  3600, standard =  3600 }
"RoboCasa-GR1"      = { privileged =  3600, standard =  3600 }
"RoboCasa365"       = { privileged =  3600, standard =  3600 }
"RoboDojo"          = { privileged =  3600, standard =  3600 }
"RoboFunOlympics"   = { privileged =  7200, standard =  7200 }
"RoboLab"           = { privileged =  3600, standard =  3600 }
"RoboOlympics"      = { standard-realtime = 7200 }
"RoboPaint"         = { privileged =  3600, standard =  3600 }
"RoboARC"           = { privileged = 10800, standard = 10800 }
"RoboTwin 2.0"      = { privileged =  1800, standard =  1800 }
"RoboWits"          = { privileged =  3600, standard =  3600 }
"VLABench"          = { privileged =  1800, standard =  1800 }
