name = "MuJoCo Playground"
citation = "Zakka et al., 2025"     # upstream README "Citation" (mujoco_playground_2025)
url = "https://playground.mujoco.org/"
repo = "google-deepmind/mujoco_playground"
commit = "4057c14"

