# README data for tasks/abc-sim/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   upstream  ABC Sim (amazon-far/abc @ d0832d1): abc_sim/task_specs.py (each catalogue task's evaluator_name and
#             evaluator_options), abc_sim/task_eval/<evaluator>.py (the success of evaluate_qpos_batch /
#             evaluate_model_data: the current state's, not `ever_success`), abc_sim/task_runtime/ball_tray.py (the tray's
#             countdown), abc_sim/env.py L451-458 (info["task_success"] = the evaluator's success after each env.step).
#   tooling   images/abc-sim/tools/rcb_abc.py: Session.step L297-340 (HOLD_STEPS = 30, L92: the success must hold 30
#             consecutive control steps; hang_mug adds hanging() L342-347; the ball tray's rule L314-330 with
#             TRAY_GRACE_S = 0.1, L93), Session.replay L454-466 (stops at the step the episode ends).
#   graders   privileged: images/abc-sim/tools/grade.py (one fresh-process replay); standard: images/abc-sim/tools/
#             standard/server.py finish() / judge_end() L361-400 and embodied_first_exam/standard/sidecar/grade.py L98-128;
#             realtime: images/abc-sim/tools/realtime/server.py L60-75, rcb_service.py _finalize() L1286-1333.
# The per-instance values (the count directive, the drawer search's target order, the start side of the in-hand transfer,
# the ball tray's duration and usable area) are read from each task's environment/instance.npz randomization record.
# Line numbers of upstream files are those at d0832d1.

[benchmark]
name = "ABC Sim"
citation = "Allshire et al., 2026"     # upstream README "Citation": abc2026, arXiv:2606.27375
url = "https://github.com/amazon-far/abc"
repo = "amazon-far/abc"
commit = "d0832d1"

