# Two-seat task (Harbor with seats): the sim sidecar (the basketball duel service, one metering proxy per seat: A on 18090, B on
# 18091; the real model credentials live only here) and two identical seats. Harbor installs and runs seat A's agent
# in seat_a and seat B's in seat_b; `main` stays idle. CPU MuJoCo + osmesa (cameras only): no GPU.
# Isolation: each seat shares a network only with sim (net_a / net_b, internal: no internet). egress_a / egress_b give
# a seat internet only while Harbor installs its agent (task.toml setup_networks).
services:
  main:
    depends_on: [sim]
  sim:
    image: ghcr.io/mll-lab-nu/eai-olympiad:0.1.0
    volumes:
      - ./sim:/srv:ro
    working_dir: /srv
    command: python3 /srv/launch.py
    cpus: 4
    mem_limit: 8g
    pids_limit: 256
    networks: [default, net_a, net_b]
    environment:
      RCB_DATA: /data
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # a second Claude subscription, used by the seats whose CLAUDE_ACCOUNT_<seat> is 2 (launch.py)
      CLAUDE_CODE_OAUTH_TOKEN_2: ${CLAUDE_CODE_OAUTH_TOKEN_2:-}
      CLAUDE_ACCOUNT_A: ${CLAUDE_ACCOUNT_A:-1}
      CLAUDE_ACCOUNT_B: ${CLAUDE_ACCOUNT_B:-1}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      CODEX_ACCOUNT_ID: ${CODEX_ACCOUNT_ID:-}
      # OpenAI-style model calls go to OpenRouter by default; THINK_OPENAI_ROUTE=azure sends them to Azure AI Foundry
      THINK_OPENAI_ROUTE: ${THINK_OPENAI_ROUTE:-openrouter}
      # per seat (optional; overrides THINK_OPENAI_ROUTE for that seat's proxy): azure or openrouter
      THINK_OPENAI_ROUTE_A: ${THINK_OPENAI_ROUTE_A:-}
      THINK_OPENAI_ROUTE_B: ${THINK_OPENAI_ROUTE_B:-}
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT:-}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
      # Azure replicas of the model to fail over between (see think_proxy.py); empty = no failover
      AZURE_DEPLOYMENTS: ${AZURE_DEPLOYMENTS:-}
      THINK_RETRY_WAITS_S: ""
      # chosen at run time (scripts/olympiad/run_duel.sh --seed / --first)
      DUEL_SEED: ${DUEL_SEED:-1}
      FIRST_PLAYER: ${FIRST_PLAYER:-A}
      PLAYER_MODE_A: ${PLAYER_MODE_A:-model}
      PLAYER_MODE_B: ${PLAYER_MODE_B:-model}
      CLOCK_S: "3600"
      START_TIMEOUT_S: "1800"
      RCB_ACT_RULE: program
      RCB_RENDER_VIDEO: ${RCB_RENDER_VIDEO:-1}
      SEAT_HOSTS: A=seat_a,B=seat_b
  seat_a:
    build:
      context: ./seat
    depends_on: [sim]
    command: ["sh", "-c", "sleep infinity"]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    networks: [net_a, egress_a]
    environment:
      SEAT: A
  seat_b:
    build:
      context: ./seat
    depends_on: [sim]
    command: ["sh", "-c", "sleep infinity"]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    networks: [net_b, egress_b]
    environment:
      SEAT: B
networks:
  net_a:
    internal: true
  net_b:
    internal: true
  egress_a: {}
  egress_b: {}
