# Generated by scripts/myosuite/generate.py -- edit the generator, the shared sources or the instance facts, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/myosuite-obj-hold-i00-privileged"
description = "MyoSuite obj_hold (MyoHand, 39 muscles, MuJoCo): produce one replayable trajectory of actuator commands. Hold the object at the goal: its centre within 0.010 m of the goal site for 50 consecutive control steps (1.0 s). Frozen scene instance (myoHandObjHoldFixed-v0, reset seed 0); graded by two fresh-process replays."
authors = [{ name = "Chi Gui" }]
keywords = ["robotics", "myosuite", "mujoco", "musculoskeletal", "myohand", "code-as-policy", "trajectory", "obj_hold", "privileged"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"
simulator = "myosuite"            # MyoSuite 2.12.2 on MuJoCo 3.6.0 (CPU)
robot = "myohand"
family = "obj_hold"
mode = "privileged"
oracle = "full"
instance_seed = 0                 # myoHandObjHoldFixed-v0: seed(0), then reset(seed=0)
expert_time_estimate_hours = 1.5

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 5400.0
# MyoSuite's trained baselines ship in its PyPI wheel (and a standard-mode agent could rebuild the simulator from it):
# the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
