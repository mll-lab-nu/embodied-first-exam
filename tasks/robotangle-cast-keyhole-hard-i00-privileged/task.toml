schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "robot-coding-bench/robotangle-cast-keyhole-hard-i00-privileged"
description = "RoboTangle cast_keyhole (ALOHA 2, Genesis): produce one replayable trajectory. Separate and place the entire silver keyhole piece inside the green dashed goal region. Keep the gold piece on the puzzle/system side. Frozen scene instance (variation cast_keyhole_hard, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "aloha", "code-as-policy", "trajectory", "cast_keyhole"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "19"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robotangle"             # RoboTangle on Genesis 1.2.1 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "cast_keyhole"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "full"
difficulty = "hard"               # the variation's tier (docs/TAXONOMY.md)
grasp = "assisted (the contact_weld_v1 grasp regions on keyhole_gold, keyhole_silver)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision cast_keyhole_placement_v4_grasp_contact_2mm); the author's qualification record for this variation matches, as metadata only (record profile: default task parameters, seed 0, ALOHA EE_ABS, CPU, 25 ms World tick / 40 substeps, bilateral-contact contact_weld_v1); this instance runs CPU 2.5 ms ticks x 4 substeps with joint-position actions and frozen contact_weld_v1 grasp assistance, which the record does not cover"
instance_seed = 0                 # scene = environment/instance.json (variation cast_keyhole_hard, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 7.0
min_gpu_memory_gb = 7.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / RTX 4090 24GB / L4 24GB (sm_86 or newer)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 5.0
verifier_min_gpu_memory_gb = 7.0
measured = "GPU 5.9 GB on L4, 10.3 GB on L40S, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: sim p90 4.0 GB, privileged container 4.6 GB, verifier p90 3.9 GB, mem_guard (docker memory per container, ws-1, 10-02..10); CPU author estimate"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 16.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 16.0
measured = "GPU: 10.3 GiB on a 48 GB card, 5.9 on 24 GB (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)) -> max(1.5 x peak, peak + 4); memory: the [environment] cap 16 GiB, which every past trial ran under (docker peak 4.6 GiB over 1 samples, mem_guard (docker memory incl. page cache, top-4 containers every 10 min, ws-1, 10-02..10)); processes 512 and disk 10 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 4.0, memory_gb = 20.0, pids = 8192 }

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 20480

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
