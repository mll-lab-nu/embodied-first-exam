# <= GAIT_TOL 0.05. Termination (terminated L305-317): IMU site z axis world z < up_z_min (Go1 0, Spot 0.85, Barkour
# 0), Barkour also a joint outside joint_box or the torso body below torso_min_z 0.18. Horizon 1000 (ENVS);
# control_dt 0.02 (Barkour 0.01). Segment counts from each instance.json `commands`.

