# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# GPU on sim: MuJoCo physics is CPU either way, but every image the agent asks for is rendered here, and EGL on the
# GPU takes ~0.5 ms a frame against ~130 ms for CPU osmesa. `graphics` is the capability that mounts the EGL ICD.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 7168m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    image: ghcr.io/mll-lab-nu/efe:humanoidbench-0.2.0
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
    command: python /srv/server.py
    restart: on-failure:6                               # a crash resumes the same episode, never a reset (rcb_service.py)
    environment:
      RCB_TASK: window
      RCB_INSTANCE: /srv/instance.npz
      RCB_TASK_TEXT: "Grasp the wiping tool — it starts in the air just in front of the hands and falls within the first second unless it is held — and wipe the window with it, moving steadily up and down."
      RCB_EPISODE: "Ends when the summed reward reaches the pass mark (success), when the robot falls (its pelvis drops too low), when the tool drops, after 1000 control steps, when your time is up (timeout), or on a simulator error."
      RCB_WALL_CLOCK_S: "3600.0"
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the standard
      # configuration; results under other settings are reported separately.
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-50}"       # HumanoidBench standard: 50 resets (tasks/humanoidbench/README.md); 0: one episode
      RCB_OBS_PROPRIO: "${RCB_OBS_PROPRIO:-1}"          # 1: + joint angles/velocities; 0: images only
      RCB_OBS_IMU: "${RCB_OBS_IMU:-1}"                  # 1: + pelvis IMU (angular velocity, gravity direction)
      RCB_OBS_ROOM_CAMERA: "${RCB_OBS_ROOM_CAMERA:-1}"  # 1: + room_camera, fixed in the room
      RCB_OBS_DEPTH: "${RCB_OBS_DEPTH:-0}"              # 1: + depth (m) from both head cameras, as from the H1's head RGB-D camera
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.3.0@sha256:53154417782408df8309194971b08b18c3682d2b337e2e3b2eb4c88fe025ab85
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
