# Generated by scripts/libero-max/generate.py -- edit the template or cases.json, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/libero-max-goal-akita-black-bowl-on-wooden-cabinet-top-obstacle-insertion-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): LIBERO-MAX (libero_goal, obstacle insertion; Franka Panda) on the same frozen instance as libero-max-goal-akita-black-bowl-on-wooden-cabinet-top-obstacle-insertion-i00-privileged: Place the bowl on top of the cabinet. Mid-task the scene changes (obstacle insertion). The agent only gets a client: two cameras (RGB, optional depth, calibrated) and the robot's own state; LIBERO's OSC control steps in chunks; one episode, no reset, no object poses; the sim service records the episode, replays it in a fresh simulator and grades it."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "libero", "libero-max", "robosuite", "franka-panda", "online-event", "code-as-policy", "trajectory", "standard-mode"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "robosuite"
robot = "franka-panda"
family = "libero-max/libero_goal/obstacle_insertion"
mode = "standard"
protocol = "eai-standard/2.1"
oracle = "full"
instance_seed = 195
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container, so nothing drives the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; for i in $(seq 1 400); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; [ $((i % 15)) -eq 1 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator, but LIBERO's demonstrations and LIBERO-MAX's policies are public upstream: the
# agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 600.0
