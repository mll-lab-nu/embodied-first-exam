# Cloth Unpleat（docx 1.2「展开单个褶皱」）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 与 cloth_fold（docx 1.1）的关系：**材料、抓取方式、桌面摩擦三块的取值直接沿用
# 1.1 的标定结果**，推导过程写在 `configs/task_configs/cloth_fold_topogym_tabletop_v1.yaml`，
# 本文件只写与 1.2 有关的部分，不重复那边的论证。两个任务的布是各自独立的实体，
# 所以取值复制而不是共享；哪天两者需要分开调，改一边不会牵动另一边。
#
# 场景：布带整体平铺，中部有一个竖起的褶皱（局部三层重叠），其余部分平整。
# 动作：夹爪捏住褶皱顶缘，把收在褶皱里的材料铺开。
# 状态变化：高度峰值从褶皱高度降至布厚、层数 3 → 1、铺展长度相应增加。

task:
  id: cloth_unpleat
  difficulty: smoke

coordinate_frame: task

board:
  name: cloth_unpleat_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# ---------------------------------------------------------------------- 布带
cloth:
  name: unpleat_band
  # 材料全长（沿 x 展开后的长度）与带宽（沿 y）。
  # 布带而不是方布：docx 1.2 的状态变化里「铺展长度」是一个一维的量，
  # 材料守恒要读得出来，布就得有一个明确的长度方向。
  #
  # 0.260 是按可达性反推的。褶皱收着的时候布带跨 x[-0.055, +0.135]，
  # 展开之后跨 x[-0.055, +0.205]，作业区是 x[-0.23, +0.31]、y[-0.30, +0.30]
  # （basic_env_demo 的 workspace），两端都在里面。
  material_length: 0.260
  width: 0.120
  center: [0.040, 0.000]
  # 铺放高度 = 一个粒子半径，布搁在桌面上的平衡高度（1.1 实测）。
  z: 0.002

  # ------------------------------------------------------------------ 褶皱
  # 褶皱是「没有压平的刀褶」：布带沿 +x 走到下折痕，向 −x 折回并抬起到顶缘，
  # 再越过下折痕落回桌面继续走。俯视图上下折痕与顶缘之间是三层
  # （底下的平铺段 + 两条折臂），两侧各是一层。
  #
  #                        顶缘（夹爪捏这里）
  #                         /\
  #              折臂1     /  \    折臂2
  #                       /    \
  #         -------------+      +----------------
  #            平铺段   下折痕            平铺段
  #
  # **收在褶皱里的材料量不是自由参数**：它 = 材料全长 − 俯视跨度 = 上折臂 + 下折臂 − width，
  # 由 width 与 crest_height 两个量算出来。当前取值下是 0.0698 m（占材料全长 27%），
  # 也就是展开后布带要长这么多。
  #
  # 2026-08-22 从 50×30 改到 28×24：原来 43% 的材料收在褶皱里，布带看得见的部分
  # 只有 147 mm 而材料有 260 mm，褶皱压过了整条布带。**代价是明确的**：铺展比量的
  # 就是「收了多少料」，收得少读数变化就小，正确与压塌之间的间距从 0.30 压到 0.11。
  # 三条判据仍分得开（见 success 块的实测表）。
  pleat:
    # 褶皱的俯视宽度（下折痕到顶缘的水平距离）。**它是收料量的主旋钮**：
    # 存料 ≈ 2 × width（下折臂横跨 2×width，上折臂横跨 width）。它同时定了：
    #   三层区占俯视跨度的比例 = width / 跨度 = 0.028 / 0.1902 = 0.147。
    #     `tests/check_cloth_unpleat_geometry.py` 在合成布上量到的初始单层率 0.792、
    #     压塌 0.750、展开 1.000 —— 单层率判据的三个读数就是这些；
    #   顶缘绕下折痕转的半径 = sqrt(width² + crest_height²) = 0.0369。
    # 试过 0.060：尾段只剩 0.024 m，重采样后段内间距掉到 4.6 mm，与其余段的 7.5 mm
    # 差太多，网格不再接近均匀。
    width: 0.028
    # 顶缘高度。三处约束：
    #   与布厚分得开：0.024 是布厚（两倍粒径 = 0.008）的 3 倍，是三层压平（0.010）的
    #     2.4 倍 —— 高度判据的两端；
    #   抓取：夹爪要能只捏到顶缘而不碰到正下方的平铺段，所以它必须明显大于
    #     grasp.attach_z_band（那一项还会按顶缘实测高度自动收窄，见下）；
    #   **抗下沉**：折臂的陡度 = crest_height / width。0.024/0.028 = 0.86，
    #     原来的 0.030/0.050 = 0.60。褶皱是画进网格再放手的，越平的帐篷越容易被
    #     自重压下去，而顶缘沉过头 episode 就不成立（min_crest_kept）。
    crest_height: 0.024

  # 控制网格。剖面按弧长重采样后沿 y 扫掠，生成器在
  # `topogym/tasks/deformation/cloth_profile_mesh.py`。
  #
  # **网格间距沿用 1.1 的 7.5 mm**：1.1 实测唯一保序的是「7.5 mm 间距 +
  # particle_size 0.004」，且那份配置写明「「间距等于 particle_size」不是充分条件，
  # 别再凭推理定这个组合」—— 所以这里是照抄那个已实测的间距，不是重新推导。
  #
  # **但顶点顺序对 1.2 不是必需的。** 三条判据（高度／单层率／铺展比）读的都是点云，
  # 不问哪个粒子是哪个；靠顶点顺序的只有拉伸诊断量与 band_shift 的精确形式，
  # 两者都有退路。1.1 不同，它的主判据是逐粒子到解析目标的距离，没有顺序就做不成。
  # 2026-08-22 实测：36×17 的控制网格出来 2344 个粒子，而一级细分应是 71×33 = 2343，
  # 多了一个（多半是段间边长不完全一致，某条边多劈了一次），网格算术因此用不了，
  # demo 会单独打一行 `stretch_tracking=off` 说明。
  #
  # 剖面重采样按段进行（每段取最接近目标间距的整数份），折痕因此一定落在顶点上。
  # 代价是段间间距略有差异，当前取值下沿材料方向是 7.32~7.62 mm、横向 7.50 mm。
  # 控制网格 36×17 = 612 个顶点。
  mesh:
    spacing: 0.0075
    output_dir: .cache/topogym/meshes/cloth_unpleat

  # ------------------------------------------------- 以下取值沿用 cloth_fold
  # 粒子尺度。同时是物理参数和判据参数（碰撞厚度 + 能不能分辨出层）。
  particle_size: 0.004
  # 材料：Genesis `PBD.Cloth` 的构造默认值整套。1.1 在 2026-08-21 把原来那组
  # （抄自绳子 prefab）换成官方默认值，原因是拉伸柔度差了 12000 倍、密度重 100 倍，
  # 读起来像橡皮泥。逐项对照表在 1.1 的配置里。
  rho: 4.0
  # 布↔布（粒子之间）的摩擦，不管桌面。三层叠着的时候靠它。
  static_friction: 0.15
  kinetic_friction: 0.15
  stretch_compliance: 1.0e-07
  bending_compliance: 1.0e-05
  stretch_relaxation: 0.3
  bending_relaxation: 0.1
  air_resistance: 0.001
  color: [0.90, 0.91, 0.93]
  # 织物贴图。光栅化器只保留 diffuse 颜色与 diffuse 贴图，所以织纹只能画进贴图本身。
  #
  # **条纹方向与 1.1 相反**：这里的条带垂直于材料方向（横跨布带），
  # 因为 1.2 要在画面上看见的是「收在褶皱里的材料被放出来」。条带沿材料方向排
  # 的话，展开前后画面几乎一样，什么也说明不了。实现上是网格的 UV 把材料方向
  # 放在 v 轴（`cloth_profile_mesh.sweep_profile_mesh`），贴图的条带本来就是
  # 沿 v 分带的（`world/textures.py` 的 `_base_colour`）。
  texture:
    enabled: true
    pattern: stripes
    accent_color: [0.20, 0.33, 0.55]
    # 0.030 在 0.260 长的布带上约 8 条，与 1.1 同一个视觉尺度。
    stripe_pitch: 0.030
    thread_pitch: 0.002
    pixels_per_thread: 8
    thread_shading: 0.45
    weft_tint: 0.94
    fibre_noise: 0.05
    cloud_noise: 0.08
    seed: 0
  # 布↔桌面的持续接触摩擦。Genesis 不提供：它的可形变体↔刚体摩擦按法向速度缩放、
  # 只在粒子正撞进表面时生效，躺在桌上的布几乎没有摩擦。实现是自己写的库仑模型
  # （`world/rope.py` 的 TabletopParticleFriction，只改速度不改位置）。
  #
  # **这一项在 1.2 比在 1.1 更要紧**：整个动作贴着桌面走，没有它，拉顶缘会把
  # 整条布带一起拖走，而「整片被拖走」与「褶皱被展开」在铺展长度上读数相同。
  tabletop_friction:
    enabled: true
    kinetic_mu: 0.4
    static_mu: 0.5
    # 粒子 z 低于「桌面 + 这个」才算接触。取值要夹在平铺高度（0.002）与
    # 第二层高度（0.006）之间，让底层受摩擦、被抬起的层不受。
    contact_band: 0.003
    max_load_factor: 3.0

# ------------------------------------------------------------------ 抓取护栏
grasp:
  # 吸附捕获容差：手到抓取点的距离超过它就拒绝吸附并如实失败。
  attach_tolerance: 0.008
  # 指垫停在抓取点上方多少。手指与布硬接触在 Genesis 1.1.0 上是 native segfault，
  # 这一项是「手指永远够不到布」的唯一保证，下限 = 2 倍 particle_size。
  touch_clearance: 0.008
  # 夹爪合拢到的半宽。必须 ≥ particle_size / 2，否则两指之间不存在粒子的可行位置。
  grasp_qpos: 0.004
  attach_radius: 0.018
  # **这一项是 1.2 新增的，1.1 没有。**
  # 1.1 的附着盘只按俯视距离取粒子，因为那里只有一层布。1.2 的顶缘正下方就是
  # 平铺段：只按俯视距离取，夹爪会把它够不到的那一层一起绑走，而「抓错层」
  # 恰恰是这个任务要能产生的失败模式。
  # 0.012 = 3 倍粒径，**这是上限而不是实际取值**：真正用的是
  # `min(这个值, 0.45 × 顶缘实测高度)`（`ClothUnpleatLayout.attach_z_band`）。
  # 顶缘会在静置里下沉，窗口跟着顶缘走；不按高度收窄的话，沉到 min_crest_kept
  # 那条线上时窗口底部会掉到平铺段（0.002）以下，把够不到的那层一起绑走。
  # 建模位置下实际取 0.0108，窗口 [0.015, 0.037]，平铺段在 0.002，留 13 mm。
  attach_z_band: 0.012
  # 静置之后顶缘还剩建模高度的百分之多少，低于它就如实失败、不做动作。
  #
  # 2026-08-22 的教训：褶皱是画进网格再放手的，动作开始之前它自己就会往下沉。
  # 第一次跑 demo 时抓取点取的是建模位置，结果 attach 在空气里，
  # `attached_indices` 直接报错。现在抓取点改为在静置后的粒子里找（layout.observe），
  # 而「找到的到底还是不是一个褶皱」就靠这一条。
  #
  # 0.50：三层压平是 0.010（布厚 + 两层间隙），占建模高度 0.024 的 0.42，所以 0.50 在
  # 「已经塌成三层」之上。低于它就不是难一点的 episode，而是另一个任务了。
  min_crest_kept: 0.50
  # 让粒子跟着夹爪走的方式在这个任务里没有开关：原语只做 `fix_particles_to_link`
  # 一种。1.1 四种各测一次，link_patch 全面胜出（跟随率 1.00、边最大拉伸只有其余的
  # 一半到五分之一、布不入桌），那个四选一开关只在 `tests/pbd_cloth_spike.py` 里
  # 还有意义，所以这里不留一个没人读的键。

physical:
  approach_z: 0.250
  move_steps: 120
  gripper_steps: 60
  max_follow_error: 0.045
  # 松手之后原地沉降多少步（dt=0.01，60 步 = 0.6 秒）。
  release_hold_steps: 60
  # 顶缘走一步多少米。沿用 1.1 标定的 0.0036：
  # 上限来自隧穿（实测每步 8 mm 以内安全），下限来自桌面蠕变（布在桌上的滑移
  # 按「每秒多少毫米」积累，动作拖得越久滑得越多）。
  # **1.2 的行程与 1.1 不同，所以写成速度而不是步数**，步数由弧长 ÷ 这个值算出来：
  # 按建模位置（未观测）算是 0.0888 m → 25 步。实跑时顶缘已经下沉，起弧半径与起始角
  # 都按静置后实测的顶缘重算，所以步数会略有出入 —— 这正是写成速度的原因。
  # 褶皱改小之后行程也随之变短（原来 42 步），这是收料变少的直接结果，不是调出来的。
  drag_step_m: 0.0036
  # 弧线半径相对材料距离的余量。顶缘与下折痕之间隔着固定长度的材料，
  # 手离下折痕比这段材料长就是在拉布，短太多布就松垂到桌上被横着拖走 ——
  # 与 1.1 的 fold_slack 是同一个约束。0.98 留 2% 给数值误差。
  arc_slack: 0.98

success:
  settle_steps: 120
  # 统计用的格子边长，与 1.1 相同（2 倍 particle_size）。
  cell: 0.008
  # ---------------------------------------------------------- 三条联合判据
  # docx 1.2 的原文：最大高度低于阈值 + 覆盖区域单层 + 总铺展长度 ≈ 材料全长，
  # 三项联合判定。防捷径：把褶皱直接压塌也能让高度达标，但层数与长度守恒不过。
  #
  # **下面三个数是在合成布上定的起点，不是仿真标定值。** 标定要跑三种走法
  # （unfold / press / overpull）之后把实测填回来，做法与 1.1 相同。
  # `tests/check_cloth_unpleat_geometry.py` 在合成布上量到的四端：
  #             原样立着   压塌     展开     拉过头
  #   最大高度     26.0mm   9.99mm   2.00mm   2.00mm
  #   单层率       0.792    0.750    1.000    1.000
  #   铺展比       0.732    0.713    1.000    1.000
  #   band_shift    0mm      0mm      0mm     80.0mm
  #
  # 最大高度（米，相对桌面）。**故意留得松**：压塌那种走法应当通过这一条，
  # 由另外两条拒绝它 —— 这正是 docx 要求三项联合的原因。
  # 0.016 两侧余量相当：褶皱立着 0.026（1.6 倍），压塌 0.010（1.6 倍）。
  max_height_m: 0.016
  # 覆盖格中恰好一层的比例。这是唯一不需要粒子编号的读数（真机只有点云）。
  single_layer_frac_min: 0.90
  # 铺展跨度 ÷ 材料全长。材料守恒使「褶皱消失」与「长度恢复」严格绑定。
  spread_ratio_min: 0.90
  # ---------------------------------------------------------- 只记录不判定
  # 整条布带的平移量：overpull（拉过头）与正确展开在上面三条上读数相同，
  # 差别只在这里。留作诊断量，是否升格为门槛等标定跑完再定。
  band_shift_max: null
  # 拉伸（复用 cloth_fold_verifier 的 stretch_report）与平整度方差同样只记录。
  stretch_max: null
  flatness_var_max: null
