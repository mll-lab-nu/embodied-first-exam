schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, { source = "/data/final.json", service = "sim" }, { source = "/data/episode.jsonl", service = "sim" }, { source = "/data/trajectory.npz", service = "sim" }, { source = "/data/replay.mp4", service = "sim" }, { source = "/data/server.log", service = "sim" }, { source = "/data/journal.f64", service = "sim" }, { source = "/data/startups.jsonl", service = "sim" }, { source = "/data/video.log", service = "sim" }, "/app/output/"]

[task]
name = "embodied-first-exam/abc-sim-inhand-transfer-i00-standard"
description = "ABC Sim in-hand transfer (two I2RT YAM arms, MuJoCo): Move the cream cheese stick to the left arm's side of the table, at least a hand's width past the middle, and set it down there. The robot as a service (eai-standard/3.0); graded by the live episode."
keywords = ["robotics", "abc-sim", "mujoco", "yam", "bimanual", "inhand_transfer", "standard"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"                # ABC Sim (abc_sim, amazon-far/abc @ d0832d1) on MuJoCo 3.6.0
robot = "i2rt-yam-bimanual"
family = "inhand_transfer"
dynamics = "static"
protocol = "eai-standard/3.0"
oracle = "full"
instance_seed = 0
expert_time_estimate_hours = 3.8

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/resources.md): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /opt/abc-tools/standard/finalize.sh"   # end + dump + exit the service, the live verdict into final.json, then the video
timeout_sec = 1800

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); docs/protocol/invariants.md H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 20480

# The robot's MCP tools (docs/protocol/eai-standard.md "MCP tools"): Harbor starts this server for the agent.
[[environment.mcp_servers]]
name = "efe-robot"
transport = "stdio"
command = "python3"
args = ["/opt/tools/efe_mcp/server.py"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
