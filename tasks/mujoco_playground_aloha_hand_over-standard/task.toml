schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/mujoco_playground_aloha_hand_over-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): MuJoCo Playground AlohaHandOver in plain MuJoCo: ALOHA 2 bimanual; produce one replayable trajectory in which the left arm picks up the box, hands it to the right arm, and the right arm holds it at the target, frozen instance (seed 60417). The agent only gets a client: camera RGB-D + proprioception and joint-target chunks; no reset, no object poses; the sim service records the episode and grades a fresh replay of it."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "mujoco", "mujoco-playground", "aloha", "bimanual", "handover", "code-as-policy", "trajectory", "standard-mode"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "mujoco"
robot = "aloha-2"
family = "mujoco_playground/AlohaHandOver"
instance_seed = 60417             # Playground's reset randomization (box xy offset, target position) with this seed
expert_time_estimate_hours = 2.0
mode = "standard"
protocol = "eai-standard/2.1"
oracle = "full"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; for i in $(seq 1 400); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; [ $((i % 15)) -eq 1 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[environment.healthcheck]
# The agent's clock starts once the simulator is ready (docs/PROTOCOL.md §2.9): Harbor runs this in the agent's container
# before it sets up the agent, until the sim service answers the client (Robot() connects once the scene is built and the
# episode has begun). The service's start-up, a crash and restart while starting included, is outside [agent].timeout_sec.
command = "python3 -c 'from rcb_client import Robot; Robot(timeout=10)'"
start_period_sec = 3600.0
start_interval_sec = 5.0
interval_sec = 5.0
timeout_sec = 60.0
retries = 3

[verifier.environment]
build_timeout_sec = 600.0
