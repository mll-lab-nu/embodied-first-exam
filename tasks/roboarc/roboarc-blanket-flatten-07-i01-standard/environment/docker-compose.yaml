# Standard mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# RoboARC renders camera images with Nyx and steps its cloth on CUDA: the GPU goes to the sidecar.
# Nyx renders through Vulkan: the device reservation below passes exactly one GPU (Nyx needs exactly one), and
# NVIDIA_DRIVER_CAPABILITIES=all makes the container toolkit mount the driver's graphics libraries, which the image's
# Vulkan ICD and EGL vendor files name (images/roboarc/Dockerfile). No `runtime: nvidia`: with the image's
# NVIDIA_VISIBLE_DEVICES=all it can expose every GPU of the host.
# Crash recovery (docs/protocol/standard_mode.md §13): run.sh exits non-zero when the service crashes, compose restarts the
# container (same container, same /data) and the service replays its journal into the same episode, never a reset.
# Grading: the live episode (environment/sim/finalize.sh writes its verdict); then one video-only replay on this GPU
# after the service has exited.
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 8   # rcb-monitor
    mem_limit: 9216m   # rcb-monitor
    pids_limit: 1024   # rcb-monitor
    x-gpu-memory-gb: 4   # GiB   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /tmp
    # The frozen instance comes from the image (images/roboarc/assets.json): the entrypoint stages it next to a copy of
    # runtime_binding.json and checks it (images/roboarc/stage_instance.py), then runs the command.
    entrypoint: ["sh", "-c", "python /opt/robotangle/stage_instance.py blanket-flatten-07-i01 /tmp/robotangle-instance --binding /srv/runtime_binding.json && exec \"$$@\"", "stage"]
    command: sh /srv/run.sh
    restart: on-failure:6          # N >= 3 (docs/protocol/standard_mode.md); a resume continues the episode
    environment:
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR
      OPENBLAS_CORETYPE: Haswell
      RCB_TASK: blanket_flatten
      RCB_INSTANCE: /tmp/robotangle-instance/instance.json
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "10800"
      RCB_STARTUP_TIMEOUT_S: "1800"  # >= 2 x the slowest measured scene build
      PYTHONPATH: /srv:/opt/topogym
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
      NVIDIA_DRIVER_CAPABILITIES: all
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
