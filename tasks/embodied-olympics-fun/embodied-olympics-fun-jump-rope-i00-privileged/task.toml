schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-jump-rope-i00-privileged"
description = "Embodied Olympics jump-rope (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Skip rope: turn the rope forwards with both hands, over your head and under your feet, and jump it with both feet together, 17 times within one minute. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "jump-rope"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "jump_rope"
category = "track-and-jumps"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 14.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: Both handles held across the palms of the G1's own Dex3-1 hands at the device's torques (no weld); nop: the hands keep both handles for the full minute (time). Positive by a declared magic action: the rope's segments moved along a forward-turning loop round the robot (its ties off) and the robot kicked up 0.15 s before each pass; the rope passes under the airborne feet and over the head 17 times, the robot flies and lands: success after the 17th landing and 1 s of standing (12.3 s). The real rope turned by the arms for 4 s (injected start, kicked take-offs) keeps both handles in the hands but makes only 0.8 turns: no counted jump with this real rope (a search over arm circles found none that turns it with the handles across the palms). Negatives: a jump with the rope behind, letting go of a handle, the rope beside the body, under one foot, to and fro, backwards, under the standing feet, stepping over, a one-footed take-off, several hops on one turn (counted once), over a still rope (twice), a fall, a last jump that does not end standing. Determinism: the same state hash twice.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
