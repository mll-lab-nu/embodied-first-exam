# README data for tasks/dexhand/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# DexHand has no upstream benchmark: the scenes, checkers and graders are this repository's. Sources checked for every
# success text (B = embodied_first_exam/benchmarks/dexhand):
#   checkers    each family's checker (a standard task's environment/sim/checker.py is byte-identical to the
#               B/privileged/environment/variants/<id>/checker.py its privileged Dockerfile copies); the families
#               without a checker.py keep the predicate in runtime.py; the six essential families share
#               B/privileged/environment/{checker,essential,essential_inhand,essential_articulated,
#               essential_rotary_multi}.py with the bounds of each task's catalog.json / instance.json
#   thresholds  each task's environment/sim/task.json (or instance.json / catalog.json) and scene.py constants
#   privileged  B/privileged/tests/grade.py main() (missing file -> missing_trajectory; > 64 MB -> bad_trajectory; one
#               fresh replay through checked_replay.py; instance_mismatch -> infra_error), the family's replay.py
#               (load_trajectory / hands.read_trajectory: width per hand, 1..MAX_ROWS rows, finite, task and
#               actuator_names must match; targets outside actuator_ctrlrange + 1e-6 -> bad_trajectory; the replay
#               breaks at session.done, i.e. the first success or failure)
#   standard    B/sim/server.py execute() L423-445 (RCB_AGENT_END=1: a latched success is recorded, the verdict state
#               put back and the physics goes on; a failure -> finish("task_failure"), the family's episode budget
#               -> finish("step_limit")), end_window() L378-396 (END_WINDOW_S = 3.0, only for "finished"/"timeout"),
#               finish() L399-415 (reason "error" -> success False), do_submit L536 (targets clipped to the ranges);
#               RCB_RESET_BUDGET in environment/docker-compose.yaml; B/standard/tests/grade.py verdict()
#               (success = final.json success, graded_by live, no infra_error, reason != "error").
# Each family's text states when its checks run (after each physics substep, or once per control step) as its own
# runtime.py step() does.

[benchmark]
name = "DexHand"
citation = "Wang et al., 2026"      # Embodied First Exam (arXiv:2611.12177): DexHand is one of its original suites
url = "https://www.embodied-first-exam.ai/suite/dexhand/"
repo = "mll-lab-nu/embodied-first-exam"
commit = "b2280d8"                  # the commit that added tasks/dexhand/ to this repository

