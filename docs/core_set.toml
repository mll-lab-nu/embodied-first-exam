# The core set: the task dirs the headline statistics are computed on. Every task dir on main, minus the easy set
# (docs/easy_set.toml) and minus the dirs the reference run codex-gpt6_luna-xhigh solved. Each mode dir (-privileged,
# -standard, -standard-realtime) is its own task. A Luna success in any mode of a base takes out the whole base,
# except a RoboSafeBench privileged twin, which takes out only itself (reported apart).
#   task       the task dir
#   base       the task name without its mode suffix
#   benchmark  the base's label (scripts/task_conventions.py BENCHMARKS)
#   mode       privileged | standard | standard-realtime
#   luna       "failed" (Luna's valid verdict) or "no result yet"
# Regenerated from the eval pool's Luna verdicts; checked by `python3 scripts/task_conventions.py core-set --check`.

