tuning_candidates:
  entry_turn_radius_delta_m: {default: 0.0, bounds: [-0.003, 0.005]}
  entry_run_delta_m: {default: 0.0, bounds: [-0.015, 0.015]}
  w_turn_radius_delta_m: {default: 0.0, bounds: [-0.003, 0.005]}
  w_high_height_delta_m: {default: 0.0, bounds: [-0.005, 0.010]}
  omega_radius_delta_m: {default: 0.0, bounds: [-0.005, 0.005]}
  stage_depth_offset_delta_m: {default: 0.0, bounds: [-0.010, 0.010]}
  tilted_stage_angle_delta_deg: {default: 0.0, bounds: [-5.0, 5.0]}
  coil_radius_delta_m: {default: 0.0, bounds: [-0.003, 0.005], applies_to: [F3_comb_w_omega_coil_v2]}
  terrace_rise_delta_m: {default: 0.0, bounds: [-0.005, 0.005], applies_to: [F3_stairs_sidew_omega_s_v2]}
coupled_constraints:
  - Preserve four full obstacles and their authored order; connectors do not count as stages.
  - Use tangent-continuous joins between different planes; no sharp wire corners.
  - Preserve all local return counts and the open 270-degree omega, rather than shrinking obstacles into cosmetic waves.
  - Derive comb lane pitch from its radius and retain clearance at every W valley.
  - A 270-degree wire arc does not prescribe a 270-degree roll of one wrist joint.
  - Place stage envelopes in separate corridors and check crossings between different stages.
  - The short helix remains open, with no intermediate mount crossing the ring path.
ik_design_priorities:
  - Jointly select grasp side, ring tilt and one arm branch for all four obstacles.
  - Check joint 7 margin throughout; baseline already spans about 327 degrees on that joint.
  - Resolve all stage transitions without resetting pose, changing grasp or stitching independent IK solutions.
verification: {geometry: pending, ik: pending, robot_collision: pending, physics: pending}

