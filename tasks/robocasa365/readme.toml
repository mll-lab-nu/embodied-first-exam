# README data for tasks/robocasa365/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text (clone of robocasa/robocasa @ 4f8a2980def75a55dff96b990745b83540425f09 and
# ARISE-Initiative/robosuite @ 5ce6643f3092639d08f7b0f90ed1c6a84f50552c, the commits images/robocasa365/Dockerfile pins):
#   upstream  robocasa/environments/kitchen/{atomic,composite/...}/<file>.py `_check_success` of each family, and the
#             helpers it calls in robocasa/utils/object_utils.py (OU):
#               check_obj_in_receptacle L587-601: env.check_contact(obj, recep) and |obj.xy - recep.xy| < th, th default
#                 0.7 x recep.horizontal_radius (MJCFObject.horizontal_radius, robocasa/models/objects/objects.py
#                 L387-391: the norm of the x and y half-sizes of the object's reg_bbox geom);
#               gripper_obj_far L645-652: |grip site (robots[0].eef_site_id["right"]) - obj body origin| > th (3-D), th
#                 default 0.25;
#               obj_inside_of L14-64: all 8 bbox corners inside one of the fixture's interior regions, tolerance 0.05 m;
#               check_obj_fixture_contact L623-629, check_obj_any_counter_contact L632-642 (any Counter fixture);
#             fixture states in robocasa/models/fixtures/: fixture.py get_joint_state L660-685 (normalised over the
#             joint range, inverted when the range starts below 0), is_open L712-721 (th 0.90), is_closed L723-732
#             (th 0.005), door_joint_names L751-752 (every joint with "door" in its name).
#             Thresholds that depend on an object's size were computed from the reg_bbox half-sizes in each task's
#             frozen instance (environment/instance.npz, `xml`), rounded to 0.1 cm.
#   call pattern  robosuite/environments/base.py step L467-521 -> _post_action L532-547 calls Kitchen.reward
#             (robocasa/environments/kitchen/kitchen.py L1530-1540: _check_success once) BEFORE Kitchen._post_action
#             (L1476-1493) runs every fixture's update_state; casa_tool.Session.step (privileged/environment/casa_tool.py
#             L610-622) then calls _check_success twice more; Session.reset L594-608 once. So three runs per control
#             step; the verdict is the third run's result (Session.success).
#   graders   privileged: embodied_first_exam/benchmarks/robocasa/privileged/tests/grade.py (copied into every
#             privileged task's verifier from the robocasa-files image) with casa_tool.py of
#             embodied_first_exam/benchmarks/robocasa365; standard: embodied_first_exam/benchmarks/robocasa365/sim/
#             server_casa.py and embodied_first_exam/benchmarks/robocasa/standard/tests/grade.py; realtime: the task's
#             environment/sim/server.py on embodied_first_exam/standard/sidecar/rcb_service.py and
#             embodied_first_exam/standard/realtime/rcb_realtime.py, graded by embodied_first_exam/standard/sidecar/grade.py.
# Line numbers below are those of the pinned upstream files unless a repository path is given.

