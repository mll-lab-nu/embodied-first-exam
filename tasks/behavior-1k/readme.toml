# README data for tasks/behavior-1k/*/README.md (scripts/task_conventions.py render_readme_v3)
# B/ = embodied_first_exam/benchmarks/behavior-1k/. Upstream = StanfordVL/BEHAVIOR-1K at tag v3.9.2 (b1979916ec15), the
# release in the base image stanfordvl/behavior:3.9.2 (images/behavior/Dockerfile, by digest).
# Each family's goal is bddl3/bddl/activity_definitions/<family>/problem0.bddl, :goal block (line numbers below), read by
# bddl3/bddl/parsing.py L280-281 (only the FIRST expression after :goal) and evaluated by bddl3/bddl/condition_evaluation.py:
#   forall = every instance (L205-210), exists = at least one (L254-259), forn (N) = EXACTLY N (L300-305),
#   forpairs over (A, B) = at least min(|A|, |B|) A's each relate to some B and at least that many B's each relate to some
#   A (L365-375; with equal counts: every A with a B and every B with an A).
# Predicates: OmniGibson/omnigibson/utils/bddl_utils.py evaluate_bddl_predicate L207-236 (a missing object or substance
# is False; real = it exists), object_states/: on_top.py L43-52, inside.py L240-263, next_to.py L16-58, under.py L42-52,
# touching.py L29-38, open_state.py L15-21 + L172-202 (open: a joint past 5 % of its range), toggle.py L116-117,
# covered.py L12-18 + L55-80 (one particle), filled.py L10 + L16-35 (20 % of the volume), contains.py L92-95 (one
# particle), cooked.py L10 + L35-36 (max temperature), frozen.py L42-43, on_fire.py L86-87, attached_to.py L311-313.
# Category names and room qualifiers come from each file's :objects and (inroom ...) lines; "_*" wildcard instances
# (bddl3/bddl/wildcard.py) stand for every object of that category in that room of the scene.
[benchmark]
