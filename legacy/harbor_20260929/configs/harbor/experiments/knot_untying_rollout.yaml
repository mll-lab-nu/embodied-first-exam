# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: knot_untying_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: knot-untying-medium-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Untie the knot and spread the rope on the table so that nonadjacent rope
      segments have no crossings or overlaps when viewed from above. Do not stretch
      or damage the rope to bypass the knot. Release it, withdraw the grippers and
      leave the whole rope still on the tabletop.
    simulator:
      task_id: knot_untying
      robot_id: auto
      variation_id: medium
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
