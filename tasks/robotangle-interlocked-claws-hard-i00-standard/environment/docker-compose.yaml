# Standard mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# TopoGym runs its physics on the GPU (CUDA) and renders camera images with Nyx: the GPU goes to the sidecar.
# Nyx renders through Vulkan: the device reservation below passes exactly one GPU (Nyx needs exactly one), and
# NVIDIA_DRIVER_CAPABILITIES=all makes the container toolkit mount the driver's graphics libraries, which the image's
# Vulkan ICD and EGL vendor files name (images/robotangle/Dockerfile). No `runtime: nvidia`: with the image's
# NVIDIA_VISIBLE_DEVICES=all it can expose every GPU of the host.
# Crash recovery (docs/STANDARD_MODE.md §13): run.sh exits non-zero when the service crashes, compose restarts the
# container (same container, same /data) and the service replays its journal into the same episode, never a reset.
# Grading (environment/sim/finalize.sh): one fresh-process replay on this GPU after the service has exited.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 16384m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    image: ghcr.io/mll-lab-nu/eai-robotangle:0.2.22
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
    working_dir: /tmp
    # The frozen instance comes from the image (scripts/robotangle/assets.json): the entrypoint stages it next to a copy of
    # runtime_binding.json and checks it (images/robotangle/stage_instance.py), then runs the command.
    entrypoint: ["sh", "-c", "python /opt/robotangle/stage_instance.py interlocked-claws-hard-i00 /tmp/robotangle-instance --binding /srv/runtime_binding.json && exec \"$$@\"", "stage"]
    command: sh /srv/run.sh
    restart: on-failure:6          # N >= 3 (PROTOCOL §4.1); a resume continues the episode
    environment:
      RCB_TASK: interlocked_claws
      RCB_INSTANCE: /tmp/robotangle-instance/instance.json
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "21600"
      RCB_STARTUP_TIMEOUT_S: "1800"  # >= 2 x the slowest measured scene build (docs/benchmarks/robotangle.md)
      PYTHONPATH: /srv:/opt/topogym
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
      NVIDIA_DRIVER_CAPABILITIES: all
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/PROTOCOL.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/eai-monitor:0.1.0@sha256:f2c910f53f79c2bfa4a71298b10c78383cae3afc40720ca562cc845b8d20fb0c
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor:/opt/rcb_monitor:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
