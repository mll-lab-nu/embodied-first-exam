# HumanoidBench subset — the single source of truth for every task under tasks/humanoidbench-*.
#
# WHY THIS FILE EXISTS
#   HumanoidBench registers 32 tasks (31 classes). Keeping all of them would buy duplicates (`stair` and `slide`
#   are the same reward function, byte for byte) and give-away scores (`pole` hands you 71% of its bar for
#   standing to attention). The 32 fall into 9 capability classes (`capability_class`), and 23 are kept
#   (docs/benchmarks/humanoidbench.md); this file is that decision in machine-readable form, and it drives
#   the generator.
#
# WHAT IT DRIVES
#   scripts/humanoidbench/gen_tasks.py turns each [[task]] here into a complete Harbor task directory
#   under tasks/, using templates/ for the boilerplate and shared/ for the tooling. Everything the tasks
#   have in common is written once, so `rcb_hb.py` and `grade.py` are byte-identical across all of them
#   (`gen_tasks.py check` enforces it).
#
# HOW TO ADD A TASK
#   Add a [[task]] block here (env_id lives here and nowhere else -- the shipped tooling reads it out of
#   the instance file, so a task directory never learns that other tasks exist), then follow README.md
#   "Adding a task": measure, instance, measure-standard, render, verify, check.
#
# ROLE
#   scored     part of the benchmark
#   fixture    kept for a reason other than scoring; `retire_when` says what ends that reason
#
# STATUS VALUES
#   todo       nothing generated yet
#   generated  files + instance exist; verified OUTSIDE the container (env builds, nop scores below the
#              bar, replay is bit-exact across repeats). This is what gen_tasks.py verify checks.
#   verified   additionally exercised INSIDE the task image: `harbor run -a nop` = 0, plus an all-zero
#              trajectory pushed through the real tests/grade.py in the container, where the verifier's
#              episode_return must equal facts.json's nop_return to the last digit. That equality is the
#              thing being checked, not just the verdict -- since the image has no reward function, it is
#              also the proof that tests/rewards.json restored upstream's exact formula. Tasks with an
#              oracle also need oracle = 1 (sit_simple: 820.28/750 through the full Harbor pipeline).
#
# WHERE THE NUMBERS LIVE
#   Nothing measurable is hand-written here. Success bars, action/observation dimensions, episode limits
#   and the all-zero-trajectory floor are read out of the simulator by `gen_tasks.py measure` and land in
#   facts.json beside this file; `gen_tasks.py verify` re-measures and fails on drift. This file holds
#   only what a human decided: which tasks, why, and how to describe them. `hold_rate` used to be written
#   here and is now derived from facts.json for the same reason -- it is the selection criterion, so it has
#   to be the measurement and not a recollection of one.
#
# ==== HOW TO WRITE `scoring_note` =====================================================================
#   This field is the ONLY thing that tells the agent what its episode is judged on: the image has every
#   get_reward() deleted (images/humanoidbench/scrub_oracles.py), so there is no formula to read and
#   s.step() hands back None where the reward used to be. That makes this field a spec, and it has a line
#   it must not cross.
#
#   SAY      what the episode is judged on, in words -- which quantities, how they combine (a product
#            gates, a weighted sum gives partial credit, a one-off bonus is all-or-nothing), the ORDER OF
#            MAGNITUDE of a target ("about 1 m/s", "close to two metres"), what terminates the episode,
#            and the episode length when it is not 1000.
#   DO NOT   paste tolerance parameters (`bounds=`, `margin=`, `value_at_margin=`), the exact weight on
#            each term, the reward's per-step scale ("a step is worth around 1"), or what a particular
#            policy scores ("doing nothing earns essentially zero", "opening the door alone earns a
#            substantial share"). Those are the answer key: with them the task is to invert an expression,
#            without them it is to control a robot. Saying what the pass mark REQUIRES is fine ("the bar
#            cannot be reached without opening the door").
#
#   The test to apply: could a competent engineer, told only this, build a sensible measure of their own
#   and optimise it? If yes it is enough. Could they skip the robot and solve for the numbers? Then it is
#   too much. `difficulty` has no such limit -- it renders into README.md, which never enters the image.
#
#   `ends_note` is the sentence on how the episode ends early. Privileged mode appends it to scoring_note;
#   standard mode leaves it out, because its Rules already list `[task.standard] ends`.
# ======================================================================================================

# ==== [task.standard] =================================================================================
#   Each task's standard-mode twin (tasks/*-standard/, docs/PROTOCOL.md §4, eai-standard/2.1): the same instance and
#   success rule, but the agent sees only head-camera RGB, joint angles/velocities, a pelvis IMU and room_camera
#   (the standard configuration; a run may turn them off or add depth), through a client. Its prose, per task:
#     ends            how the episode can end early other than by success ("when the robot falls (...)");
#                     leave it out if it cannot
#     hidden          what the agent is not given, read after "Not ": "where the robot is in the room, not ..."
#     tier            the same for README.md: "no root pose, no ..."
#     camera_note     README.md: what the head cameras and room_camera see
#     task_statement, scoring_note   only where the privileged wording leans on privileged state
#     room_camera_pose, room_camera_comment   a fixed free camera ("lookat_x,y,z,distance,azimuth,elevation")
#                     for tasks that leave the default one's view (the recording camera frozen at t=0)
#   The SAY / DO NOT rule above applies to every one of them.
#
# Per task, for the human review of a task without an oracle (docs/PROTOCOL.md §2.7): `oracle_evidence`, the
# positive example a reviewer checks, or why none is known. A task with oracles/<family>/<mode>/ has an oracle instead.
# The agent's egress allowlist is scripts/set_agent_egress.py's HOSTS (the model APIs only), read by gen_tasks.py:
# upstream is a public commit, so anything more lets the agent fetch back the reward the image deletes.
# ======================================================================================================

[defaults]
seed = 0
instance_tag = "00"
agent_timeout = 3600.0
verifier_timeout = 900.0
keywords = ["robotics", "humanoidbench", "code-as-policy", "trajectory"]
cpus = 16                   # the privileged-mode agent's container: searching is what it is for
review_pr = 9               # the pull request whose human review covers the tasks without an oracle (0: not opened yet)

# =====================================================================================================
# C1 · flat-ground periodic gait
# =====================================================================================================
[[task]]
family = "walk"
role = "scored"
robot = "h1"
env_id = "h1-walk-v0"
paper_category = "loco"
capability_class = "C1 · flat-ground periodic gait"
status = "verified"
expert_hours = 2.0
completion_rate = "133%"
evidence = "paper SAC 854, FastTD3 928, bar 700"
oracle_evidence = "Claude Opus 5.5's privileged-mode trajectory (834.80 / 700), run `claude_code-claude_opus_5_5-medium` on the results site; today's privileged verifier scores it 1, and so does the standard service when it is sent through the client; published RL passes as well (SAC 854, FastTD3 928)"
one_liner = "walks the Unitree H1 forward and keeps it walking"
task_statement = "walk the robot forward and keep walking, without falling."
scene_note = "flat ground, and the robot's initial pose never changes between resets."
scoring_note = '''Each step is judged on three things at once — how fast the centre of mass is moving
forward, how upright the robot is (head at standing height, torso vertical), and how little actuator
force it is using — and they multiply. Not being upright is what makes a step worth nothing; heavy
actuator force costs part of it. The
forward-speed target is on the order of 1 m/s.'''
ends_note = "The episode ends early if the pelvis drops near the ground."
obs_layout = "qpos(26) + qvel(25), robot state only"
task_notes = ""
difficulty = '''- **The reward is a three-way product**: `small_control × stand_reward × move`. The `move` term rises
  linearly from 0 at standstill to 1 at 1 m/s of forward centre-of-mass speed, then is remapped to
  `(5·move + 1)/6`. Standing still therefore caps the episode near 170/700 — staying upright earns
  almost nothing by itself. Clearing the bar takes a *sustained* ~0.7 m/s.
- **A gait is a limit cycle, and greedy search cannot find one.** Any first step out of a standing pose
  is locally worse than not taking it: the centre of mass has to leave the support polygon before it
  gains anything. A search that only accepts locally improving actions structurally never takes that
  step. Planning with a horizon *can*, which is exactly what happened below.
- **Nothing is given away**: the published random-policy baseline is 2.38/700, and holding the starting
  pose scores 11.84 (1.7% of the bar).

**Measured with a real agent** (`mini-swe-agent` + `claude-sonnet-5`, one attempt, full 1 h budget,
~$6, 200 steps): **passed, 784.54 / 700**, deterministic replay. What it reported trying, in order:
open-loop sine CPG (falls before step 100), CPG + LQR linearised at the initial state (survives all
1000 steps but caps near 200), CMA-ES over the CPG/Fourier parameters (plateaus at 190-210 -- it
concluded the parameterisation, not the search budget, was the limit), and finally receding-horizon
CEM-MPC against the task's own reward, which cleared the bar.

🚩 **That run had the reward function.** It is the reason the image no longer does: the winning approach
was to optimise the formula directly, which measures reading comprehension of a dense reward rather than
control. Re-run under the scrubbed image, the same approach needs the agent to *write* the objective
first.'''

[task.standard]
ends = "when the robot falls (its pelvis drops near the ground)"
hidden = "where the robot is in the room, not how fast it is moving"
tier = "no root pose, no base velocity"
camera_note = "the head cameras see flat floor and the horizon (there is nothing else in the scene). `room_camera` stands behind and above the start and looks down the course (`RCB_ROOM_CAMERA_POSE` in the compose file): the robot stays in frame from x = 0 to 20 m."
room_camera_pose = "4,0,0.11,10,0,-26"
room_camera_comment = "room_camera behind and above the start, looking down the course: the robot stays in frame from x=0 to 20 m"

# =====================================================================================================
# C2 · constrained gait (terrain / obstacles)
# =====================================================================================================
[[task]]
family = "stair"
role = "scored"
robot = "h1"
env_id = "h1-stair-v0"
paper_category = "loco"
capability_class = "C2 · constrained gait"
status = "verified"
expert_hours = 3.0
completion_rate = "98.5%"
evidence = "paper 134, FastTD3 690, bar 700"
oracle_evidence = "none known: no run has passed it, and published RL reaches 98.5% of the bar (paper 134, FastTD3 690, bar 700)"
one_liner = "walks the Unitree H1 over a row of staircases"
task_statement = "walk the robot forward over the stairs, up each flight and down the other side, without falling."
scene_note = "the stairs and the robot's initial pose never change between resets."
scoring_note = '''The same three multiplied requirements as walking on the flat — forward speed (the
target is on the order of 1 m/s), staying upright, low actuator force — with one change that matters:
the height part of "upright" is measured as the head's height *above the feet*, not above the ground,
because the ground rises and falls under you and so cannot be the yardstick, and the torso tilt it
accepts is looser than on the flat.'''
ends_note = '''Termination is also different: the episode ends only when the torso tips close to
horizontal, rather than when it drops to a fixed height.'''
obs_layout = "qpos(26) + qvel(25), robot state only"
task_notes = ""
difficulty = '''- **A gait plus a terrain constraint.** Everything that makes `walk` hard applies, and on top of it the
  foot placement has to match the step geometry. The failure mode is different too: `walk` fails by
  never starting, `stair` fails by losing footing part-way up.
- **The uprightness termination is lenient.** `torso_upright < 0.1` ends the episode only once the torso
  is close to horizontal (more than about 84° from vertical).
- **One of the two tasks closest to their own bar.** The best published result misses it by 1.5%
  (`balance_simple`: 1.4%), which makes it a clean test of whether an agent is a little better or a
  little worse than the state of the art rather than hopelessly far from it.'''

[task.standard]
ends = "when the robot falls (its torso tips close to horizontal)"
hidden = "where the robot is in the room, not the stairs' geometry"
tier = "no root pose, no stair geometry"
camera_note = "the head cameras see the first flight of stairs straight ahead. `room_camera` stands behind and above the start and looks down the course (`RCB_ROOM_CAMERA_POSE` in the compose file): the robot stays in frame from x = 0 to 20 m."
room_camera_pose = "4,0,0.11,10,0,-26"
room_camera_comment = "room_camera behind and above the start, looking down the course: the robot stays in frame from x=0 to 20 m"

[[task]]
family = "hurdle"
role = "scored"
robot = "h1"
env_id = "h1-hurdle-v0"
paper_category = "loco"
capability_class = "C2 · constrained gait"
status = "verified"
expert_hours = 3.0
completion_rate = "127%"
evidence = "paper 143, FastTD3 887, bar 700"
oracle_evidence = "no rollout of this instance; published RL passes the bar (FastTD3 887 / 700)"
one_liner = "runs the Unitree H1 over a line of hurdles"
task_statement = "run the robot forward down the walled track and over the hurdles, without touching the side or back walls and without falling."
scene_note = "the hurdles and the robot's initial pose never change between resets."
scoring_note = '''Forward speed, staying upright (head at standing height, torso vertical) and low
actuator force, multiplied together — but the speed target is a sprint rather than a walk, on the order
of 5 m/s. On top of that,
touching any barrier's collision geometry multiplies that entire step down to a small fraction of its
value: contact is a gate to be respected, not a penalty to be traded off. Only the walls that line the
track on both sides and behind the start count as barriers here; the hurdles themselves carry no such
penalty, but they are solid and have to be cleared.'''
ends_note = "The episode ends early if the pelvis drops near the ground."
obs_layout = "qpos(26) + qvel(25), robot state only"
task_notes = ""
difficulty = '''- **A multiplicative gate, not a penalty.** Contact with the side or back walls discounts the whole step
  by ×0.1 (the hurdles themselves are not gated).
  Approaches that trade a little contact for a lot of speed do not work here; the gate has to be
  respected exactly.
- **Running, not walking.** The speed term is scaled to 5 m/s, so a comfortable walking gait leaves most
  of the per-step reward on the table even when nothing is hit.
- **The only task in the subset that requires leaving the ground.** Clearing a hurdle needs a ballistic
  phase with the right take-off timing — a qualitatively different motion from the contact-scheduled
  gaits of `walk` and `stair`, which is why both are kept.'''

[task.standard]
ends = "when the robot falls (its pelvis drops near the ground)"
hidden = "where the robot is on the track, not where the hurdles and walls are"
tier = "no root pose, no hurdle or wall positions"
camera_note = "the head cameras see the walled track and the line of hurdles ahead. `room_camera` stands behind and above the start and looks down the course (`RCB_ROOM_CAMERA_POSE` in the compose file): the robot stays in frame from x = 0 to 20 m."
room_camera_pose = "4,0,0.11,10,0,-26"
room_camera_comment = "room_camera behind and above the start, looking down the course: the robot stays in frame from x=0 to 20 m"

# =====================================================================================================
# C3 · quasi-static posture and stabilisation
# =====================================================================================================
[[task]]
family = "balance_simple"
role = "scored"
robot = "h1"
env_id = "h1-balance_simple-v0"
paper_category = "loco"
capability_class = "C3 · quasi-static stabilisation"
status = "verified"
expert_hours = 3.0
completion_rate = "98.6%"
evidence = "paper 64, FastTD3 788, bar 800"
oracle_evidence = "none known: no run has passed it, and published RL reaches 98.6% of the bar (paper 64, FastTD3 788, bar 800)"
one_liner = "keeps the Unitree H1 standing on a balance board"
task_statement = "stand on the balance board and stay on it, upright and still, for the whole episode."
scene_note = "the board, its fulcrum and the robot's initial pose never change between resets."
scoring_note = '''A good step asks for only three things, multiplied together — low actuator force,
staying upright (head at full standing height on the board, torso vertical), and near-zero horizontal
velocity — so scoring well for one step is not the difficulty. The difficulty is
that the episode ends the moment the pelvis drops too low, anything but the fulcrum sphere touches the
ground — the board included — or the sphere touches anything other than the ground and the board, and
every step after that is worth nothing.'''
obs_layout = "qpos(33) + qvel(31), robot + board state"
task_notes = ""
difficulty = '''- **A survival problem, not a scoring problem.** Per-step reward is easy to collect; what is hard is
  collecting it 1000 times in a row. An all-zero trajectory already scores 37 before terminating at
  step 62, and holding the start pose lasts 78 steps, so the shape of a good step is not the obstacle.
- **The support is unstable.** The board pivots on a sphere, so the contact geometry moves in response
  to the robot's own actions — an open-loop plan that ignores the coupling diverges, while a feedback
  controller recorded open-loop reproduces exactly (MuJoCo on CPU is bit-exact).
'''

[task.standard]
ends = "when the robot falls, when anything but the fulcrum under the board touches the ground (see Scoring)"
hidden = "where the robot is in the room, not the board's pose"
tier = "no root pose, no board pose"
camera_note = "the head cameras see floor and horizon only; the board under the feet never enters their view. `room_camera` (the recording camera frozen at its starting pose) sees the robot from outside."

[[task]]
family = "balance_hard"
role = "scored"
robot = "h1"
env_id = "h1-balance_hard-v0"
paper_category = "loco"
capability_class = "C3 · quasi-static stabilisation"
status = "verified"
expert_hours = 4.0
completion_rate = "31%"
evidence = "paper 57, FastTD3 244, bar 800"
oracle_evidence = "none known: no run has passed it, and published RL reaches 31% of the bar (paper 57, FastTD3 244, bar 800)"
one_liner = "keeps the Unitree H1 standing on a board balanced on a rolling sphere"
task_statement = "stand on the balance board and stay on it, upright and still, for the whole episode."
scene_note = "the board, the roller beneath it and the robot's initial pose never change between resets."
scoring_note = '''A good step asks for only three things, multiplied together — low actuator force,
staying upright (head at full standing height on the board, torso vertical), and near-zero horizontal
velocity — so scoring well for one step is not the difficulty. The difficulty is
that the episode ends the moment the pelvis drops too low, anything but the rolling sphere touches the
ground — the board included — or the sphere touches anything other than the ground and the board, and
every step after that is worth nothing.'''
obs_layout = "qpos(40) + qvel(37), robot + board + roller state"
task_notes = ""
difficulty = '''- **Same reward function as `balance_simple`, three times the gap to the bar.** The published best goes
  from 98.6% to 31% with no change to the scoring code — only the support changes, from a board on a
  fixed pivot to a board on a free-rolling sphere (task DoF 7 → 14). That is the point of keeping
  both: it isolates how much of a task's difficulty is the reward and how much is the physics, and it
  is the one place where "same reward function" was not grounds for cutting the second task.
- **The support drifts.** A rolling fulcrum integrates the robot's errors instead of merely reflecting
  them, so a correction that works once stops working a second later; there is no fixed operating point
  to stabilise around.
- **An all-zero trajectory terminates at step 44**, earlier than on the simple board.'''

[task.standard]
ends = "when the robot falls, when anything but the roller under the board touches the ground (see Scoring)"
hidden = "where the robot is in the room, not the board's or the roller's pose"
tier = "no root pose, no board or roller pose"
camera_note = "the head cameras see floor and horizon only; the board and the roller under the feet never enter their view. `room_camera` (the recording camera frozen at its starting pose) sees the robot on the board from outside."

# =====================================================================================================
# C4 · navigation and passage
# =====================================================================================================
[[task]]
family = "door"
role = "scored"
robot = "h1"
env_id = "h1-door-v0"
paper_category = "manip"
capability_class = "C4 · navigation and passage"
status = "verified"
expert_hours = 3.0
completion_rate = "55%"
evidence = "paper 285, FastTD3 332, bar 600"
oracle_evidence = "Claude Opus 5.5's privileged-mode trajectory (676.02 / 600), run `claude_code-claude_opus_5_5-medium` on the results site; today's privileged verifier scores it 1, and so does the standard service when it is sent through the client"
one_liner = "walks the Unitree H1 through a closed door"
task_statement = "walk to the door, press the handle, pull the door open towards the robot, and walk through it."
scene_note = "the door and the robot's initial pose never change between resets."
scoring_note = '''This one is a weighted sum rather than a product, so partial credit is real: getting
the door open and getting the torso past the doorway are the two large terms, with reaching for the
handle, moving the handle, and posture as small ones. The bar cannot be reached without opening the
door.'''
ends_note = "The episode ends early if the pelvis drops too low."
obs_layout = "qpos(28) + qvel(27), robot + door + handle state"
task_notes = ""
difficulty = '''- **Runs on the 19-DoF `h1`.** The door has 2 DoF and no dexterous hands are involved, so the agent
  works the handle and the door with its forearms.
- **Two skills in sequence.** The door opens towards the robot, so it has to be pulled round while the
  robot steps out of its way. Without opening it the other terms fall short of the bar, and the passage
  term pays in full only once the torso is well past the doorway.
- **Partial credit is real.** Opening the door without getting through already earns a large share of
  each step, which is meant to distinguish an agent that gets *part* of a multi-stage problem right from
  one that gets none of it.'''

[task.standard]
ends = "when the robot falls (its pelvis drops too low)"
hidden = "where the robot is in the room, not the door's or the handle's angle"
tier = "no root pose, no door or handle state"
camera_note = "the head cameras see the door right in front of the robot. `room_camera` looks at the doorway from the side (`RCB_ROOM_CAMERA_POSE` in the compose file): the robot, the door and the floor beyond it stay in frame from x = -0.5 to 4 m."
room_camera_pose = "1.8,0,0.9,7,105,-25"
room_camera_comment = "room_camera beside the doorway: the robot, the door and the floor beyond it stay in frame from x=-0.5 to 4 m"

[[task]]
family = "maze"
role = "scored"
robot = "h1"
env_id = "h1-maze-v0"
paper_category = "loco"
capability_class = "C4 · navigation and passage"
status = "verified"
expert_hours = 4.0
completion_rate = "30%"
evidence = "paper 290, FastTD3 359, bar 1200"
oracle_evidence = "none known: no run has passed it, and published RL reaches 30% of the bar (paper 290, FastTD3 359, bar 1200)"
one_liner = "walks the Unitree H1 along a maze's corridors from checkpoint to checkpoint"
task_statement = "walk the robot along the maze's corridors from checkpoint to checkpoint, in order, turning at each corner, without hitting the walls."
scene_note = "the maze layout and the robot's initial pose never change between resets."
scoring_note = '''Most of the bar is not accumulated, it is jumped to: reaching a checkpoint pays a
one-off bonus, and the bonuses grow with how many you have already reached, so the later corners are
worth far more than the first. Between checkpoints each step pays a small amount for posture, for moving
in the current corridor's direction (the speed target is on the order of 2 m/s) and for nearing the next
checkpoint; touching a wall multiplies that per-step amount down to a fraction (the bonuses are not
reduced). Walking correctly but never reaching a checkpoint leaves the episode below the bar.'''
ends_note = "The episode ends early if the pelvis drops near the ground."
obs_layout = "qpos(26) + qvel(25), robot state only"
task_notes = '''The direction the robot should currently be heading, and which checkpoint it is working
towards, are part of the task's internal state — they advance as checkpoints are reached and are frozen
into this instance at their initial values, so every reset starts you at the first checkpoint, where the
robot stands.
'''
difficulty = '''- **Discrete, step-function reward.** Checkpoint bonuses (n×100 for the n-th) dominate the 1200 bar, so
  the return is nearly binary per corner: you either reach a checkpoint or you get none of its value.
  There is no gradient leading to the first corner beyond a proximity term worth a fraction of a step.
- **Two turns, so the gait has to be steerable.** Each needs the walking controller to change heading
  and then re-stabilise — a stronger requirement than walking in a straight line.
- **Wall contact is a ×0.1 gate**, so cutting corners is not a viable shortcut.
- **Planning cannot see far enough.** A receding-horizon planner optimising the per-step return has no
  signal pointing at a checkpoint bonus dozens of steps away, which is why this survives the approach
  that solved `walk`.'''

[task.standard]
task_statement = "walk the robot along the maze's corridors from checkpoint to checkpoint, in order, turning at each corner, without hitting the walls. Each checkpoint is a small ball about 1 m up; from the first step on, the next one to reach is red and those already reached are green. The robot starts on the first checkpoint, so that ball is green from the first step, and every reset starts there again."
ends = "when the robot falls (its pelvis drops near the ground)"
hidden = "where the robot is in the maze, not where the checkpoints are"
tier = "no root pose, no checkpoint positions"
camera_note = "the head cameras see the corridor ahead. `room_camera` looks straight down on the whole maze (`RCB_ROOM_CAMERA_POSE` in the compose file): every corridor and the robot are in frame."
room_camera_pose = "3,3,0,15,0,-89"
room_camera_comment = "room_camera straight above the maze: every corridor and the robot are in frame"

# =====================================================================================================
# C5 · whole-body power and momentum
# =====================================================================================================
[[task]]
family = "highbar_simple"
role = "scored"
robot = "h1"
env_id = "h1-highbar_simple-v0"
paper_category = "manip"
capability_class = "C5 · whole-body power and momentum"
status = "verified"
expert_hours = 4.0
completion_rate = "an unknown fraction"
evidence = "neither upstream's curves (which cover only highbar_hard) nor FastTD3 (h1hand only) report this family"
oracle_evidence = "none known: no run has passed it, and no published RL result covers it (neither upstream's curves (which cover only highbar_hard) nor FastTD3 (h1hand only) report this family)"
one_liner = "swings the Unitree H1 up on a high bar"
task_statement = '''the robot starts hanging from a high bar. Swing up: get inverted and drive the feet
as high as you can.'''
scene_note = "the bar, the grip and the robot's initial hanging pose never change between resets."
scoring_note = '''Three multiplied requirements: how far the torso is towards *inverted*, how high the
feet are, and low actuator force. Read the first one carefully — it rewards being upside down, so hanging
the right way up scores nothing at all no matter how steady it is. The feet-height term saturates only
when the feet are well above the bar. On
this robot the forearms are fixed to the bar, so it cannot fall off.'''
ends_note = "The episode still ends if the head drops too low, which an inverted hang under the bar can do."
obs_layout = "qpos(26) + qvel(25), robot state only"
task_notes = ""
difficulty = '''- **Energy injection, not stabilisation and not a gait.** Reaching an inverted pose from a hang takes
  pumping: small oscillations amplified by applying torque at the right phase. The code an agent has to
  write is a timed, large-amplitude joint trajectory — structurally unlike the feedback controllers of
  C3 or the contact schedules of C1/C2.
- **Hanging quietly scores zero.** Because the uprightness term is negated, the do-nothing basin is not
  a local optimum worth defending — it is exactly 0 (measured: 0.08/750 over a full 1000 steps), so
  there is no partial credit to coast on.
- **A receding horizon does not contain the answer.** Pumping pays off only after several swing cycles,
  so a planner optimising the next few dozen steps sees nothing but wasted effort. This is the clearest
  structural reason the task survives the CEM-MPC approach that solved `walk`.
- **This is the subset's ceiling, and it is kept on purpose.** A benchmark whose every task is solved
  saturates the moment models improve. Note the evidence here is the thinnest of the subset: neither upstream's
  curves (which cover only `highbar_hard`, whose best final return is 12 of 750) nor FastTD3 (h1hand only)
  report this family, so "very hard" is a reasonable prior but not an established fact.
- **Cleanest determinism in the subset**: 19 DoF, no objects, and upstream forces the reset noise to
  zero for this family — see the caveat below.'''
caveat = '''⚠️ **This family can only ever have one instance.** `HighBarBase.reset_model()` sets the
environment's `randomness` to 0, so every reset produces the identical pose. There is no `i01`/`i02` to
generate; that is upstream behaviour, not a defect in the instance.'''

[task.standard]
ends = "when the robot's head drops too low (an inverted hang under the bar can do that)"
hidden = "the robot's position or heading in the room"
tier = "no root pose"
camera_note = "the head cameras see floor and horizon only. `room_camera` (the recording camera frozen at its starting pose) sees the robot hanging from the bar."

