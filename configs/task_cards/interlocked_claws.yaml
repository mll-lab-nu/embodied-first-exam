schema_version: 1
task_id: interlocked_claws
title_zh: 嵌合体脱困
objective: separate
success: Place the entire brown claw piece wholly inside the green dashed area and hold still for the instance stability duration; keep all remaining puzzle parts on the system side. Continued grasping is allowed.
variant_generation:
  version: claw_seed_v1
  config: configs/interlocked_claws_variants.yaml
  catalog: assets/tasks/interlocked_claws/seed_families_v1/catalog.json
  sample_entrypoint: topogym.tasks.interlocked_claws.variants:sample
  materialize_entrypoint: topogym.tasks.interlocked_claws.variants:generate
  restore_entrypoint: topogym.tasks.interlocked_claws.variants:prepare_episode
  spec_type: topogym.generation.episode_spec.EpisodeSpec
  status: candidate_generation_only
  implemented_families: [claw_weave]
  unimplemented_families: [helical_crown, orthogonal_gate]
  dataset_enabled: false
baseline:
  asset_id: cspace_claw_wang_v1
  assembly_pose_id: reference_start
  layout:
    yaw_deg: 0.0
  clearance_offset_m: 0.0
axes:
- path: assembly_pose_id
  unit: id
  status: candidate
  validated_range: null
- path: layout.yaw_deg
  unit: deg
  status: candidate
  validated_range: null
- path: clearance_offset_m
  unit: m
  status: candidate
  validated_range: null
assets:
- location: assets/tasks/interlocked_claws/cspace_claw_wang_v1/reference_scene.json
  status: local_source
- location: assets/tasks/interlocked_claws/cspace_claw_wang_v1/piece-0.obj
  status: local_source
- location: assets/tasks/interlocked_claws/cspace_claw_wang_v1/piece-1.obj
  status: local_source
- location: https://qinengwang-aiden.github.io/demos/constraint_demos/data/claw/manifest.json
  status: public_reference
physics:
  backend: genesis_1.2.1_rigid
  qualification: unqualified
  profile_policy: fixed per probe; save actual solver settings with results
  grasp_model: source ideal pregrasped weld assumption; friction-only grasp not verified
initialization:
  description: pregrasped reference assembly; visible placement supports
robot:
  family: ALOHA 2 / dual ViperX 300 with original grippers
  arms: 2
  dual_arm_qualified: false
  local_probe_fixture_allowed: true
rejection_rules:
- Initial interpenetration
- Reference path blocked by collision approximation
- Grasp region unreachable
first_probe: Original mesh and complete source motion imported; continuous interpiece
  clearance certificate and complete ideal-grasp-assisted reference execution passed
  at two timesteps. Force-driven straight-pull controls expose nonconvex contact
  instability and mesh/SDF depth disagreement; retain unqualified status independently
  of the complete demo. See docs/develop/tasks/interlocked_claws_zh.md.

terminal:
  revision: placement_region_v1
  implementation: topogym.tasks.placement.PlacementGoalMixin
  goal_complete: false
  qualification: pending_real_placement_and_reachability
  target_selection: ['assembly.bodies[0].name']
  extent: all_visual_and_collision_geometry_or_all_FEM_vertices
  region: fixed_at_reset_from_actual_table_and_instance_geometry
  numeric_region_metadata: owner_evidence
  limited_policy_input: visible_green_boundary_and_static_instruction
  holding_allowed: true
  thresholds_calibrated: false
  historical_success_labels_apply_to_previous_rules: true
