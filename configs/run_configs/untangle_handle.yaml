# untangle_physical_handle_demo（离散版）的运行模式参数。
#
# 物理与场景参数用点路径覆盖，不在这里：
#   task.rope.model=fem_ipc_tube
#   task.rope.fem.E=200000.0   task.rope.fem.nu=0.4   task.rope.fem.friction_mu=0.4
#   env.genesis.logging_level=warning

defaults:
  - default
  - _self_

# 结束后立刻关窗。统一由 keep_open 表达，这一项作为兼容保留。
close_on_finish: false

# 只抓这一根绳（按 rope.strands 里的名字）。null = 让 oracle 自己选。
grasp_rope: null

# 抓取次数上限。
max_moves: 8
# 单次抓取的重试上限。null = 用 task.physical_handle 的配置值。
max_grasp_attempts: null
# 两次抓取之间的静置步数。null = 用配置值。
between_moves_settle_steps: null
# 开场静置步数。
settle_steps: 60

# 低分辨率绳：把 rope 的网格与求解迭代降一档，用于快速迭代看动作是否正确。
# 具体数值在 task 配置的 rope.lite 块里，不写在 Python 里。
lite: false

# 每 N 步采一次绳的健康指标并打印。
probe: false
probe_every: 5

# --- 数据生成相关（本轮不重新设计，原样保留）-----------------------------
randomize_layout: false
difficulty: default
variant_id: default
# 录制 H5 数据集到该路径。null = 不录。
record_dataset: null
dataset_every_n_steps: 1
