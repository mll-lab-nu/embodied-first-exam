# Exported by RoboOlympics tools/export_fexam.py from curling-match-program-standard (sports/curling/sport.toml): do not edit.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/roboolympics-curling-match-i01-standard"
description = "STANDARD, turn-based (RoboOlympics / Embodied Agent Olympics, our own service): curling, one match (format match) against the scripted opponent at level 3, program play (eai-standard-turn/1.0: nothing moves while a player thinks; each side has a chess clock of 60 minutes of real time that runs only on its own turn, with no limit per move; a short review after each of its own actions, on its clock). Camera images and the service's replies only. Frozen development instance (seed and level fixed, not an official seed). two teams slide granite stones down a sheet of ice towards the house, 4 ends of 5 stones per team; you skip one team and throw every one of its stones (release speed, direction and spin); in the `match` format the other team is a scripted computer team, in the `duel` format another player. Exported from RoboOlympics task curling-match-program-standard by tools/export_fexam.py."
authors = [{ name = "RoboOlympics (CHIGUI0)" }]
keywords = ["robotics", "roboolympics", "sports", "curling", "curling-fcv1", "standard-mode", "vision", "turn-based"]

[metadata]
author_name = "RoboOlympics"
task_type = "trajectory"
simulator = "curling-fcv1"
robot = "stone-delivery-mechanism"
family = "curling_match"
mode = "standard"
dynamics = "dynamic"              # scene dynamics (docs/PROTOCOL.md §2.14): scripts/task_dynamics.toml
protocol = "eai-standard-turn/1.0"
instance_seed = 7
opponent_level = 3
clock_s = 3600
start_window_s = 1800
revision = "curling-4"
play = "program"
action_level = "low"
source_task = "roboolympics/curling-match-program-standard"
source_commits = ["30554cb116dc"]
exporter = "roboolympics tools/export_fexam.py"
player_mode = "unmetered"
official = false
expert_time_estimate_hours = 0.5
oracle = "full"
oracle_evidence = "level 3 is the strongest scripted team, chosen as the hardest level (hub target: standard below 50 %). Vanilla Harbor 0.23.0 on mll-4090-1, 2026-10-16: our camera-only reference player won this instance 2:1 in repeated oracle runs with the same stones (equal state_sha; curling's stepping is bit-exact across machines); it won 2 of the 8 development seeds 7-9, 11-15 tried at level 3 (the screening: the truth-state reference 45 % at level 3, docs/screening/curling.md)"

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 8.0
min_memory_gb = 5.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 7.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 0.0
measured = "RoboOlympics' exported turn-based matches (scripts/roboolympics/exported.toml): the same sim service and agent image as its exported realtime matches (sim up to 6 CPUs, agent 2; turn-based play needs no real-time cores, so these are upper bounds); CPU only"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 4.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 12.0
measured = "as RoboOlympics' exported realtime matches (the same agent image and sim service): agent 4 GiB, whole trial + the sim service's 8 GiB; processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 2.0, memory_gb = 6.0, pids = 8192 }
sim = { cpus = 6.0, memory_gb = 8.0, pids = 256 }

[metadata.seeds]
# the instances this task may run from (docs/PROTOCOL.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 7
allowed = [7]
oracle = [7]

[verifier]
timeout_sec = 1260.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running (a program would keep playing; the match is graded as it stands).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then SIGUSR1 ends the match: the service replays it in a fresh process, checks the replay and writes the verdict
# ("graded_ready"), then the spectator video.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 300); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1080

[agent]
timeout_sec = 7200
# The agent reaches the model APIs, the package registries and the sim (localhost:8000, Harbor's egress control).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 6144

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
