# cloth_fold_half: pinch the overhanging flap, roll it over the fold line onto the pinned half, release (nominal scene).
name: cloth_fold_half
table_z: 1.102
max_steps: 6000
scene:
  fixture_physics: true
  gel: {stiffness: 650.0, damping: 0.5, friction: 1.5}
soft:
  settle_ticks: 45
  solver: {substeps: 10, iterations: 5}
  pinch_overlap: 0.00035
  penetration_fail: true
  pad_mu: 1.0
world:                           # overrides of softbody_geom.soft_scenes.CLOTH_FOLD_PINCH (the 90-degree layout is its default)
  layout: {yaw_deg: 90.0, root_xy: [0.1, -0.15]}
success:
  hold: 30
  align_y: 0.008
  align_edge: 0.030
  over_dz: 0.002
  rest_speed: 0.006
  open_gap: 0.016
  min_contacts: 1
  attach_columns: 2
policy:
  init_limit: 5
  final_hold: 30
  reach_tol: 0.004
  max_refine: 2
  settle_ticks_move: 25
  move: {steps: 120, speed: 0.04, tol: [0.002, 0.02], timeout: 300}
  pre_mode: 2
  in_dx: 0.006
  in_idle: 120
  arc_segments: 8
  roll_approach_y: -1.0
  roll_release_deg: 120.0
  roll_approach_gap: 0.02        # the hand opens only this far for the approach (a full open sweeps the pedestal front)
  roll_open_gap: 0.014           # partial open at the release
  roll_tilt_deg: 0.0
  roll_margin: 0.98
  roll_pre_dy: 0.07
  roll_out_dy: 0.13
  roll_clear_dy: 0.10
  roll_clear_dz: 0.06
  final_settle: 90
