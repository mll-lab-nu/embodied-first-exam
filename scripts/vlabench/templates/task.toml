# Generated by scripts/vlabench/generate.py -- edit the template or tasks.json, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/vlabench-{{dash}}-i00-privileged"
description = "VLABench {{task}} (Franka Panda): {{instruction_toml}} Produce one replayable trajectory of joint-position control steps on a frozen scene instance; graded by VLABench's own success check at the trajectory's end."
authors = [{ name = "{{author}}" }]
keywords = ["robotics", "vlabench", "mujoco", "franka-panda", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "{{author}}"
author_org = "{{org}}"
task_type = "trajectory"
simulator = "vlabench"
robot = "franka-panda"
family = "vlabench/{{task}}"
mode = "privileged"
oracle = "full"
instance_seed = {{seed}}             # VLABench's episode configuration for this task, seeded build
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[agent]
timeout_sec = 3600.0
# VLABench's experts (get_expert_skill_sequence) are removed from the image but public upstream, so the agent reaches
# the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
