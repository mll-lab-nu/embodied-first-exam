# Toolkit manifest: badminton x Franka Panda + racket on a 1.0 m pedestal on an x-y base, LOW level ("Agent as Robotics
# Engineer", docs/construction_zh.md step 3; schema: skilleval/toolkit.py). Everything the low-level seat is given for
# its robot is listed here, the same for every player; anything else (the high level's act skill and stroke
# controller, the simulator, the shuttle's state) is not available. The seat has this file as /opt/robot/toolkit.toml;
# /spec (toolkit) and the task's instructions name it. Changing it changes the task: bump [toolkit] version and
# sport.toml [sport] revision, refresh the sha256 (python3 -m skilleval.toolkit check sports/badminton/seat/toolkit.toml
# --fix) and re-run the evaluations (tools/check badminton --stages 6). tests/test_badminton.py
# (test_exploit_toolkit_is_the_manifest) checks it and the libraries.
#
# The base: the Festo EGC-185-BS-KF-40P ball-screw gantry (2 m/s, 15 m/s^2 per axis; since the screening's base study,
# revision wallclock-10; before: the EGC-185-TB-KF belt axes, 5 m/s, 50 m/s^2). The toolkit is written so that a new base changes only data:
# robot_only.xml is cut from the scene (robot_model.py), the libraries' base constants are one block each
# (bm_kinematics.BASE, bm_servo.BASE_KP / BASE_KD) and both libraries take the limits and gains from game spec.

[toolkit]
id = "badminton-franka-base-low"
version = "1.2.0"
sport = "badminton"
level = "low"
configuration = "Franka Emika Panda (MuJoCo Menagerie panda_nohand, Apache-2.0) + badminton racket on the flange, on a 1.0 m pedestal on an x-y base (sport.toml [arm] franka_panda: the Panda's real limits; the base's limits in /spec limits.base), revision wallclock-10+"
definition = "RoboOlympics two-mode definition (docs/construction_zh.md step 3, control foundation B: joint interface + robot tool library)"
decision = "2026-10-11 (screening, the low level of badminton, after table tennis): the low level gets the robot's own model, an IK library and the robot's own servo law as a model (bm_servo: the documented law of /spec limits.controller, the robot only), as table tennis's toolkit 2.0.0; the low level's task is to implement the high level's act(t, pos, normal, vel) from these tools"
optional = true                              # every tool but the joint interface is optional

[[tools]]
name = "joint_interface"
kind = "interface"
api = ["act traj {q: rows of 9 targets [base_x, base_y, q1..q7]}: row i = the target of control step k_eff + i (k_eff: the step the command takes effect), 1-600 rows; after the last row the arm returns by itself to its ready pose and the base holds the last row's position (no automatic return; a later move sets where it waits)",
       "act none: the arm returns to its ready pose, the base stays where it is",
       "act move {base: [x, y]}: where the base waits (it goes there by the base's go-to law once no traj is under way)",
       "act toss {pos, height} (your serve)",
       "observe: q, qd, q_target, qd_target, servo {q, qd, qdd, tau, q_target_prev, steady, reflex {s_left, q, stop} | null, base_sp {q, qd, qdd} | null, n_reflex}, command, step, robot_base_xy, q_arm, racket_pos, racket_normal, heard, t_since_played, ball_state, ball_in_play, score, point, serve (+ the cameras: the shuttle)"]
rate = "100 Hz: one target per joint per 10 ms control step (plugin.LowLayer, Badminton._take_effect)"
checks = ["joint ranges (the model's; the base's travel)", "consecutive rows within the joint speed limit x 10 ms (the first one: of q_target)",
          "the base's rows within its speed (norm) and acceleration (norm and per axis; from the second differences, the first rows joining q_target and qd_target)",
          "1-600 rows, finite numbers"]
servo = "the robot's 1 kHz servo (game spec limits.controller): the arm through a jerk-limited setpoint within 0.9 of the real velocity limits (game spec limits.velocity_rule) and the real acceleration and jerk limits, torque = M qdd_sp + kp e + kd de + gravity/Coriolis + the base's acceleration fed forward, within 87 / 12 N m and 1000 N m/s; the base by PD within its drive force; the joint-velocity reflex: a physical arm joint faster than 1.05 x its limit stops the robot for 1 s (the arm held at the pose of the trigger, the gantry braking within its limits through a setpoint generator that stays engaged until the robot is next put at its spot), then it resumes from rest"

[[tools]]
name = "robot_model"
kind = "model"
file = "/opt/robot/robot_only.xml"
source = "seat/robot_only.xml"               # robot_model.py cuts it out of the match scene (exploit E16)
sha256 = "8cb05ccee38f5a33cb803cf2b2927ac2c5b3881eab0bf51e85f9893da6bbfbc1"
api = ["MJCF of the base, pedestal, arm and racket only (nothing of the world): joints base_x, base_y, joint1..joint7, site racket_center (the head centre; the racket body's local +x = the string-face normal, +z = along the shaft), the robot's self-collision pairs, 9 motors; meshes in /opt/robot/assets"]
frame = "the match frame: x to your right, y towards the opponent, z up; floor z = 0 (duel: each seat's own frame)"
license = "MuJoCo Menagerie panda_nohand, Apache-2.0 (LICENSE.menagerie-franka)"

[[tools]]
name = "robot_meshes"
kind = "data"
file = "/opt/robot/assets"
source = "sim/scene/assets"
sha256 = "182ce5a806fed0aad6a58b45754d88ee384cdc5640ae934f53b4c7f20bc4282b"
api = ["the mesh files robot_only.xml loads (MuJoCo Menagerie panda_nohand)"]
license = "Apache-2.0 (LICENSE.menagerie-franka)"

[[tools]]
name = "ik_library"
kind = "library"
file = "/opt/robot/lib/bm_kinematics.py"
source = "seat/lib/bm_kinematics.py"
sha256 = "4aeddd3a6308efd537aa00b01aa4675df852550ed354562bc241135173a34a8e"
version = "1.0.0"
module = "bm_kinematics"
class = "RacketKinematics"
needs = ["numpy", "mujoco==3.3.7"]           # both in the low-level seat image ([seat.low] pip)
api = ["fk(q9) -> (pos, R)", "jacobian(q9) -> (6, 9)", "racket_velocity(q9, qd9) -> (v, w)", "within_limits(q9)",
       "solve(pos, normal=None, R=None, q0=None, base=(bx, by), ...) -> (q_arm7, err)",
       "solve_near(pos, normal=None, R=None, q_ref=None, base=(bx, by), vel_limit=None, ...) -> (q_arm7, err)",
       "pair_distances(q9) -> {self-collision pair: metres}", "clearance(q9, exclude=()) -> least of them", "close_pairs(q9, below=0.04) -> names (structurally close at a pose, e.g. the wrist at the ready pose)",
       "base_goto(b, v, goal, a_prev) -> (b, v)", "base_plan(b, v, goal, n, a) -> (rows, arrived)", "base_rows_problem(rows, b0, v0) -> None | why"]
algorithm = "damped least squares on MuJoCo's own Jacobians (mj_jacSite) of the robot-only model: head centre position + string-face normal (roll free), full rotation, or position only, the base held at a given position; joint ranges by clipping; solve_near: q_ref and 12 fixed starts, the accurate solution with the least speed-weighted travel. clearance: MuJoCo's collision detection on the model's self-collision pairs. The base: the documented go-to law of its return to the spot, with the limits of game spec base"
deterministic = "no randomness at run time (the 12 starts are fixed at import), no threads, a fixed iteration budget"
same_as_high_level = "the act skill solves its IK with the same damped-least-squares step (sim/bm.py ik): the low level gets the same IK quality as the platform's skill, not a better one; the platform's multi-start ordering, its clearance-ranked fallbacks and its swing are not in the library"
choice = "own numpy IK: the seat has mujoco + numpy only; mink needs a QP solver stack, pinocchio a compiled package and a URDF that would have to match the MJCF"
license = "the repository's"

[[tools]]
name = "servo_model"
kind = "controller"
file = "/opt/robot/lib/bm_servo.py"
source = "seat/lib/bm_servo.py"
sha256 = "9c9bb0ee771e356d3366aed9edc2c894ce1eefd94d6d5a053af144b4779882ce"
version = "1.2.0"
module = "bm_servo"
class = "RobotSim"
needs = ["numpy", "mujoco==3.3.7"]
api = ["RobotSim(xml, gains=, base_force=, base_limits=spec limits.base).reset(q9, qd9, q_target9, servo)", "RobotSim.step(q_target9): one 10 ms control step", "RobotSim.rollout(rows) -> per row (head pos, normal, vel, q, qd)", "RobotSim.racket() -> (pos, normal, vel)", "RobotSim.contact_steps: 1 ms steps with a self-collision contact", "RobotSim.reflexes: joint-velocity reflexes in the rollout"]
algorithm = "the robot's own servo law exactly as game spec limits.controller documents it (the simulator's bm.Phys.servo: the Panda's jerk-limited setpoint generator at 0.9 of the velocity limits + torque-rate limiter, the base's PD within its force, the base's acceleration fed forward, the joint-velocity reflex with the gantry's braking; 1.2.0 since sport revision wallclock-12 / duel-14), at 1 kHz on the robot-only model: the same motion as the robot in the match (no world contact exists in badminton: the shuttle is not a body; tests: test_exploit_toolkit_is_the_manifest rolls rows out against the simulator: bit for bit from rest, < 0.2 mm of the racket head from a moving start, where the match reads the previous 1 ms step's inertia, also through a reflex in progress at the observation or fired within the rollout)"
reads = "only the robot's own state (q, qd, the targets in force, the servo's state) and the rows it is given: no shuttle, no court, no opponent"
deterministic = "float64 numpy and MuJoCo's integrator; no randomness, no threads"
license = "the repository's"

[limits]                                     # /spec limits; the same checks for the platform's act and the player's commands
source = "bodies/franka_panda/body.toml (the Panda's joint velocity, acceleration, jerk, torque and torque-rate limits, manufacturer S1-S3) and the base's (sim/bm.py BASES festo_egc_bs: Festo EGC-185-BS-KF-40P ball-screw axes, 2.0 m/s, 15 m/s^2 per axis, 3000 N, x stroke 3 m; jerk 25 x the acceleration, estimated)"
enforced_by = "bodies/limits.py (JerkLimiter, TorqueRateLimiter) in the robot's servo (sim/bm.py Phys.servo), the low level's row checks (plugin.Badminton._take_effect, sim/bm.py base_rows_problem, Phys.check_target)"

[forbidden]                                  # the sport's core skill: the player develops it
skills = ["act: our implementation, the high level's act {t, pos, normal, vel} (the racket's state at contact) - the player implements act itself",
          "the stroke controller: bm.Match.plan_racket, _swing, _swing_targets, _stroke_for, _rollout_contact, ik_multi's clearance-ranked multi-start and swing_score (the base's stance, the limits-aware swing, timing, rehearsals, speed scaling, self-collision avoidance), the plan worker (plugin.plan_job, sim/wc.py)"]
modules = ["sim/bm.py", "sim/wc.py", "sim/bduel.py", "lowlevel/evaluator.py"]   # not in the seat image
develop = "act(t, pos, normal, vel): where the base stands at contact, the swing trajectory (joint targets over time within the real limits) that delivers the requested racket state at the requested time, head speed and face control at contact, compensating the servo's lag, keeping clear of the robot's own pedestal, the follow-through, re-planning when a new act replaces the stroke under way"
privileged = "no simulator handle and no shuttle state: the shuttle only from the cameras"

[boundary]
baseline = "lowlevel/boundary"               # IK to the requested racket pose at a stance + the fastest legal move there, no swing (ignores t and vel)
threshold = 0.05                             # its API-test success rate must stay at or below this (rule 5)

[versions]
mujoco = "3.3.7"
numpy = "2.2.6"                              # the simulator image's; the seat installs numpy with mujoco
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
