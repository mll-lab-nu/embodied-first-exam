# Limited-mode twin of {{task_dir}}. Generated from scripts/humanoidbench/templates/limited/task.toml --
# edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{task_dir}}-limited"
description = "LIMITED MODE (robot as a service, rcb-limited/1.1): HumanoidBench {{family}} on the same frozen instance as {{task_dir}}. The agent only gets a client: observe (head-camera RGB + joint proprioception), step (one action or a batch). No reset by default, no privileged state, no reward; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "humanoidbench", "mujoco", "{{robot}}", "{{paper_category_long}}", "limited-mode", "trajectory", "{{family}}"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "humanoidbench"
robot = "{{robot_slug}}"
family = "{{family}}"
tier = "perception"                # head-camera RGB + joint angles/velocities; {{limited_tier}}, no reward
mode = "limited"
protocol = "rcb-limited/1.1"
instance_seed = {{seed}}
expert_time_estimate_hours = {{limited_expert_hours}}

[verifier]
timeout_sec = {{verifier_timeout}}
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 280); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; sleep 2; done; cat /data/final.json"
timeout_sec = 600

[agent]
timeout_sec = {{agent_timeout}}
# The agent container holds no simulator and no reward, but upstream is a public commit: keep the agent phase
# off the network like every HumanoidBench task (model API opted in per run: --allow-agent-host <host>).
network_mode = "allowlist"
allowed_hosts = []

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
