# Generated by scripts/autobio/generate.py -- edit the generator, the shared sources, families.json or the instance, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  { source = "/data/replay3.log", service = "sim" },           # and its third, which renders replay.mp4
  "/app/output/",
]

[task]
name = "robot-coding-bench/autobio-pickup-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): AutoBio pickup (Pick up centrifuge tube) on the same frozen instance as autobio-pickup-i00-privileged: Pick up the 50 mL centrifuge tube (orange screw cap) that stands in the blue rack: hold it by its cap and lift it at least 9.5 cm. The agent only gets a client: cameras (RGB, optional depth, calibration), the robot's proprioception, joint position chunks, arm kinematics; one episode, no reset, no object or instrument state; the sim service records the episode, replays it in fresh processes and grades it."
authors = [{ name = "Canyu Chen" }]
keywords = ["robotics", "autobio", "mujoco", "laboratory", "biology", "aloha-2-arm", "code-as-policy", "trajectory", "pickup", "standard-mode"]

[metadata]
author_name = "Canyu Chen"
task_type = "trajectory"
simulator = "autobio"             # AutoBio @ 0850421 on MuJoCo 3.3.0 (CPU)
robot = "aloha-2-arm"
family = "pickup"
mode = "standard"
protocol = "eai-standard/2.2"
oracle = "full"
difficulty = "easy"              # AutoBio's own level for the task
success_rule = "first"
instance_seed = 0                 # AutoBio's reset(seed=0) of Pickup
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json, video
timeout_sec = 5400

[agent]
timeout_sec = 3600.0
# AutoBio's scripted experts are in its public repository and its recorded demonstrations on Hugging Face (and a
# standard-mode agent could rebuild the simulator from the repository): the agent reaches the model APIs and nothing
# else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
