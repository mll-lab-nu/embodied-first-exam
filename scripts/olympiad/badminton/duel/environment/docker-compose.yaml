# Multi-seat task (Harbor with seats): the sim sidecar (simulator, referee, one metering proxy per seat: A on
# 18090, B on 18091; the real model credentials live only here) and two identical seats. Harbor installs and runs
# seat A's agent in seat_a and seat B's in seat_b; `main` stays idle. CPU MuJoCo + osmesa: no GPU.
# Isolation: each seat shares a network only with sim (net_a / net_b, internal: no internet). egress_a / egress_b give
# a seat internet only while Harbor installs its agent; Harbor disconnects both (task.toml setup_networks) before
# either agent runs. The seats have identical resources; no volumes are mounted into a seat.
services:
  main:
    depends_on: [sim]
    cpuset: ${DUEL_MAIN_CPUS:-}
  sim:
    image: ghcr.io/mll-lab-nu/eai-olympiad:0.1.0
    volumes:
      - ./sim:/srv:ro
    working_dir: /srv
    command: python3 /srv/launch.py
    cpus: 8
    cpuset: ${DUEL_SIM_CPUS:-}
    mem_limit: 8g
    pids_limit: 1024
    networks: [default, net_a, net_b]
    environment:
      RCB_DATA: /data
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      CODEX_ACCOUNT_ID: ${CODEX_ACCOUNT_ID:-}
      # OpenAI-style model calls go to OpenRouter by default; THINK_OPENAI_ROUTE=azure sends them to Azure AI Foundry
      THINK_OPENAI_ROUTE: ${THINK_OPENAI_ROUTE:-openrouter}
      # per seat (optional; overrides THINK_OPENAI_ROUTE for that seat's proxy): azure or openrouter
      THINK_OPENAI_ROUTE_A: ${THINK_OPENAI_ROUTE_A:-}
      THINK_OPENAI_ROUTE_B: ${THINK_OPENAI_ROUTE_B:-}
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT:-}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
      # Azure replicas of the model to fail over between (see think_proxy.py); empty = no failover
      AZURE_DEPLOYMENTS: ${AZURE_DEPLOYMENTS:-}
      # chosen at run time with DUEL_SEED / FIRST_RECEIVER
      SLOWDOWN: "${RCB_SLOWDOWN:-20}"
      DUEL_SEED: ${DUEL_SEED:-1}
      FIRST_RECEIVER: ${FIRST_RECEIVER:-A}
      PLAYER_MODE_A: ${PLAYER_MODE_A:-model}
      PLAYER_MODE_B: ${PLAYER_MODE_B:-model}
      WALLCLOCK_PLAN_LEAD_S: "0.4"
      RCB_PLAN_TIMEOUT_S: "30"
      RCB_REPLAY_TIMEOUT_S: "300"
      RCB_VIDEO_TIMEOUT_S: "300"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      LP_NUM_THREADS: "2"            # llvmpipe (OSMesa) render threads per process
      READY_TIMEOUT_S: "300"
      START_TIMEOUT_S: "1800"
      RCB_ACT_RULE: program
      RCB_RENDER_VIDEO: ${RCB_RENDER_VIDEO:-1}
      # spectator broadcast log /data/broadcast.jsonl (never read by the replay or the grader); 0 = off
      RCB_BROADCAST: ${RCB_BROADCAST:-1}
      DUEL_SERVER_CPUS: ${DUEL_SERVER_CPUS:-}
      DUEL_WORLD_CPUS: ${DUEL_WORLD_CPUS:-}
      DUEL_PLAN_A_CPUS: ${DUEL_PLAN_A_CPUS:-}
      DUEL_PLAN_B_CPUS: ${DUEL_PLAN_B_CPUS:-}
      DUEL_RENDER_A_CPUS: ${DUEL_RENDER_A_CPUS:-}
      DUEL_RENDER_B_CPUS: ${DUEL_RENDER_B_CPUS:-}
      DUEL_PROXY_A_CPUS: ${DUEL_PROXY_A_CPUS:-}
      DUEL_PROXY_B_CPUS: ${DUEL_PROXY_B_CPUS:-}
      NAME_A: seat A
      NAME_B: seat B
      SEAT_HOSTS: A=seat_a,B=seat_b
  seat_a:
    build:
      context: ./seat
    depends_on: [sim]
    command: ["sh", "-c", "sleep infinity"]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    cpuset: ${DUEL_SEAT_A_CPUS:-}
    networks: [net_a, egress_a]
    environment:
      SEAT: A
  seat_b:
    build:
      context: ./seat
    depends_on: [sim]
    command: ["sh", "-c", "sleep infinity"]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    cpuset: ${DUEL_SEAT_B_CPUS:-}
    networks: [net_b, egress_b]
    environment:
      SEAT: B
networks:
  net_a:
    internal: true
  net_b:
    internal: true
  egress_a: {}
  egress_b: {}
