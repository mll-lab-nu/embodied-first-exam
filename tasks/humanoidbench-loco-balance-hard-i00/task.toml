# Generated from scripts/humanoidbench/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/humanoidbench-loco-balance-hard-i00"
description = "HumanoidBench balance_hard: produce one replayable trajectory that keeps the Unitree H1 standing on a board balanced on a rolling sphere, frozen scene instance 00."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "humanoidbench", "code-as-policy", "trajectory", "h1", "locomotion", "balance_hard"]

[metadata]
author_name = "pingyue"
# trajectory | policy (see docs/PROTOCOL.md)
task_type = "trajectory"
simulator = "humanoidbench"
robot = "unitree-h1"
# HumanoidBench env h1-balance_hard-v0; paper category locomotion; C3 · quasi-static stabilisation
family = "balance_hard"
# privileged (state-based perception) | perception (RGB-D models)
tier = "privileged"
# scene = environment/instance.npz (frozen MuJoCo state); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 900.0
# grade.py replays locally against the frozen instance; it has no reason to reach the network, and the
# reward formula is live in this process, so deny it outright.
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Deleting get_reward() from the image (images/humanoidbench/scrub_oracles.py) buys nothing if the agent
# can fetch it back -- upstream is pinned at a public commit, so one `curl raw.githubusercontent.com/...`
# or `pip download humanoid-bench` restores the whole answer key. Measured: with the default `public`
# baseline an agent-phase curl pulled basic_locomotion_envs.py and found 5 `def get_reward`.
# Deny by default. The model API is opted into per run -- `harbor run --allow-agent-host openrouter.ai`
# -- which Harbor merges only when the phase is already an allowlist (trial/network_policy.py
# merge_extra_allowlists warns and ignores the flag under `public`, which is how this was found).
network_mode = "allowlist"
allowed_hosts = []

[environment]
build_timeout_sec = 1800.0
# the deliverable is reachable by search; one episode is ~0.41 s of one core
cpus = 16
memory_mb = 16384
