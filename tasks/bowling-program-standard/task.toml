schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/bowling-program-standard"
description = "PROGRAM PLAY, turn-based (eai-standard-turn/1.0): a 10-frame game of ten-pin bowling on a regulation MuJoCo lane (oiled front end, dry back end; 10 rigid pins, a 7 kg ball), instance seed chosen at run time (RCB_SEED; lane condition and release scatter). The agent rolls each ball with a release (board, launch angle, speed, rev rate, axis rotation; seeded scatter) from camera images only, and may write a program that observes and bowls without a new model response per ball; one action in flight at a time. A 60-minute chess clock runs on the agent's turns (reviews included, simulation excluded); a review after each ball. Success: a valid game with total >= 200."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "mujoco", "bowling", "ten-pin", "turn-based", "chess-clock", "vision", "physics"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded game itself
simulator = "mujoco"
robot = "none (ball release primitive)"
family = "bowling"
mode = "standard"
protocol = "eai-standard-turn/1.0"           # turn-based extension of standard mode
oracle = "full"
oracle_evidence = "solution/: the privileged reference player's precomputed releases for each official seed (300 on 20260930, 2 and 3), played through the service's HTTP calls; other seeds: a fixed release"
revision = "turn-1-program"
parameters = "RCB_SEED (default 20260930)"
expert_time_estimate_hours = 0.7

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 600); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 700

[agent]
timeout_sec = 7200.0           # preparation, then the game on a 60-minute chess clock

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
