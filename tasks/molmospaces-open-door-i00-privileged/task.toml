schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/molmospaces-open-door-i00-privileged"
description = "MolmoSpaces open-door (a Rainbow Robotics RB-Y1 mobile manipulator, MuJoCo 3.5.0) in privileged mode: produce one replayable trajectory. Pull the door open. Frozen episode: upstream benchmark procthor-10k/rby1_benchmarks/door_opening_benchmark, episode 0."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "molmospaces", "mujoco", "rainbow-rby1", "code-as-policy", "trajectory", "open-door"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "molmospaces"          # MolmoSpaces (molmo-spaces 0.2.9) on MuJoCo 3.5.0, CPU physics
robot = "rainbow-rby1"
family = "open-door"
mode = "privileged"
# scene = environment/instance.json (one upstream benchmark episode + its t = 0 state hash); identity = the dataset.toml digest
expert_time_estimate_hours = 2.0
oracle = "none"
oracle_evidence = "no reference solution (MolmoSpaces' planners and grasp files are not shipped); positive example graded 1 by the separate verifier: molmospaces-open-door-i01-privil__7zEbSdU (run codex-gpt6_luna-medium, batch molmospaces-luna-rby1-r2c of 2026-10-03: an earlier round on the same episode, kept with the run's records, not on the results site); human review in PR #47"

[verifier]
timeout_sec = 1800.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in two fresh processes, with no network.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[agent]
timeout_sec = 3600.0
# The model APIs and nothing else (scripts/set_agent_egress.py HOSTS): MolmoSpaces, its experts and its trajectories are public.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
