# Generated by RoboOlympics tools/generate.py --upstream (do not edit). The sim sidecar runs the v0.2 core;
# the agent (main) shares its network namespace under Harbor's egress control and reaches it at
# localhost:8000 (keep [agent] network_mode = "allowlist": with public egress main could not reach it).
# The seat is unmetered (Harbor records the model's usage): no metering proxy, no credential here. CPU only.
# cap_drop NET_RAW: without it a process could set SO_MARK to the egress proxy's own mark on a socket and
# bypass the allowlist (Linux >= 5.17 lets CAP_NET_RAW set SO_MARK; Docker grants NET_RAW by default).
services:
  main:
    depends_on: [sim]
    cap_drop: [NET_RAW]
  sim:
    image: ghcr.io/mll-lab-nu/eai-olympiad:0.1.0
    cap_drop: [NET_RAW]
    volumes:
      - ./sim:/srv:ro
    working_dir: /srv
    command: python3 /srv/core/launch.py
    cpus: 6
    mem_limit: 8g
    pids_limit: 256
    environment:
      RCB_DATA: "/data"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      RO_PLUGIN: "/srv/sport/plugin.py"
      RO_SPORT: "tabletennis"
      RO_FORMAT: "match"
      RO_SEATS: "A"
      RO_SEED: "101"
      RO_FIRST: "A"
      RO_LEVEL: "1"
      RO_SLOWDOWN: "10"
      RO_RENDERER: "mujoco"
      RCB_ACTION_LEVEL: "high"
      RCB_PLAY: "program"
      RCB_ACT_RULE: "program"
      CLOCK_S: "3600"
      START_TIMEOUT_S: "1800"
      READY_TIMEOUT_S: "300"
      SEAT_HOSTS: ""
      RCB_RENDER_VIDEO: "1"
      RCB_BROADCAST: "1"
      RCB_VIDEO_TIMEOUT_S: "300"
      RO_VIDEO_RENDERER: ""
      LP_NUM_THREADS: "2"
      PLAYER_MODE_A: "unmetered"
