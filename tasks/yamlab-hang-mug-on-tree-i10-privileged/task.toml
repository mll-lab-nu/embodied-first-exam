# Generated by scripts/yamlab/mk_tasks.py -- edit the template or scripts/yamlab/instances.json, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "robot-coding-bench/yamlab-hang-mug-on-tree-i10-privileged"
description = "YAMLab HangMugOnTree-v0 (two I2RT YAM arms with parallel grippers, Isaac Lab / Isaac Sim 5.1): produce one replayable trajectory of YAMLab's 14-D joint-position actions. Task: pick up the mug with the left arm, hand it over to the right arm, and hang it on the mug tree. Frozen scene instance: `mug` = `Mug/mug_010` and `mug_tree` = `MugTree/mug_tree_010`, the recorded initial state of YAMLab teleoperation demonstration hangmug_010.hdf5 demo_1; graded by YAMLab's own staged success check (evaluation thresholds)."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "yamlab", "isaac-lab", "isaac-sim", "bimanual", "i2rt-yam", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "yamlab"              # YAMLab @ ec0455d on Isaac Lab @ f4aa17f / Isaac Sim 5.1 (PhysX on the CPU, RTX rendering)
robot = "i2rt-yam-bimanual"
family = "hang_mug_on_tree"
mode = "privileged"
oracle = "full"
expert_time_estimate_hours = 1.5

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 8.0
min_memory_gb = 16.0
min_gpu_memory_gb = 5.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 9.0
verifier_min_gpu_memory_gb = 5.0
measured = "GPU 3.8-4.0 GB per trial, anon memory 11.1-11.8 GB, CPU p90 5.8-8.7 cores over 12 trials, live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 AWS hosts + ws-1, 10-10); vram_profile peaks 5.5-6.5 GB on 24 GB cards; board 0048: about 11 GB RAM and 8 CPUs per simulator; verifier 7.2 GB, mem_guard (docker memory per container, ws-1, 10-02..10)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 24.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 24.0
measured = "GPU: 10.4 GiB on a 48 GB card, 6.5 on 24 GB (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)) -> max(1.5 x peak, peak + 4), at least 16 for Isaac Sim; memory: the [environment] cap 24 GiB, which every past trial ran under (docker peak 16.0 GiB over 4 samples, mem_guard (docker memory incl. page cache, top-4 containers every 10 min, ws-1, 10-02..10)); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 8.0, memory_gb = 29.0, pids = 16384 }

[metadata.seeds]
# the instances this task may run from (docs/PROTOCOL.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 13000.0             # two fresh-process replays at tests/grade.py's limit for the longest accepted trajectory
                                  # (replay_timeout(100,000 rows) = 1200 s + rows / 20 = 6200 s each; the first Isaac start in
                                  # the verifier compiles shaders, 629 s measured) + 600 s; a usual trajectory (up to 12,000
                                  # rows) keeps the old 1800 s per replay
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # Isaac Sim starts and renders offline: every asset is in the image (images/yamlab/web_assets.txt)

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576

[agent]
timeout_sec = 3600.0              # YAMLab budget, both modes (docs/benchmarks/yamlab.md): every Python process pays ~1.5-2.5 min of Isaac Sim launch + scene build
# YAMLab's teleoperation demonstrations (which solve these exact instances) and its MimicGen datasets are public upstream,
# so the agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 29696

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
