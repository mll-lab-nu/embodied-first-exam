schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/referee.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/trajectory.first.npz", service = "sim" },
  { source = "/data/replay.first.mp4", service = "sim" },
  { source = "/data/replay.first.last.png", service = "sim" },
  { source = "/data/ticks.f64", service = "sim" },
  { source = "/data/calls.jsonl", service = "sim" },
  { source = "/data/submitted.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/embodied-olympics-fun-catch-and-shoot-i00-realtime"
description = "REALTIME MODE (robot as a service on a clock that does not stop, eai-standard/2.3, slowdown S = 1): Embodied Olympics catch-and-shoot on the same frozen instance as embodied-olympics-fun-catch-and-shoot-i00-privileged. Catch and shoot: catch the chest pass that comes to you from the left wing with your two hands, then shoot from where you stand so that the ball enters the basket from above. Once an attempt starts the venue does not wait; the agent drives the robot from a program of its own through the client: the robot's two head cameras (depth on one), its joint sensors and IMUs, the venue's fixed camera, and action chunks (walking, running, joint targets, Unitree LowCmd, the hands' grip). 5 resets, the last attempt graded; no object state, no referee state during an attempt. The sim service records every executed control step and grades the last attempt live with the family's referee (no grading replay)."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "realtime-mode", "trajectory", "catch-and-shoot"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "unitree-h1-2"
family = "catch_and_shoot"
category = "basketball-and-rackets"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.3"
instance_seed = 0
expert_time_estimate_hours = 14.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: The chest pass is thrown by a physical two-wheel passing machine on the left wing, where a passer would stand, 4.0 m from the aim point: the shared ball machine block, copied byte for byte. It uses the football preset's 0.40 m pneumatic wheels on 15 N m speed-controlled motors with a size-7 ball: contact stiffness 42 kN/m from K = 2 pi r p at 0.56 bar, the pressure printed on match balls; restitution 0.85. A force-limited gate and ram feed the ball into the wheels. Nothing is pinned and no velocity is written after reset; the test checks the Task source and that the world has no pins or mocap bodies. The machine is trimmed in this world: the ball leaves the wheels at 2.00 s at 9.00 m/s, 12.7 degrees up, and passes 2 mm from the aim point 0.44 s later at 8.4 m/s. The test's positive is a declared magic action: real: the open two-hand catch pose before the pass; injected: the passed ball put at rest between the palms within 0.6 m; real: the arms squeeze and both hands close (the catch); injected at the shot: the ball's 52-degree shot velocity; the flight, the ring and the referee are real; the same state hash twice. Nop: not caught (deterministic). The real pass at the open hands is not caught. Negatives: hands opened, a shot 1 m wide, held to time, walking with the ball, a dragged pivot foot, a third step, a touch before the pass, the pass at the thigh, retouched after the release, up through the ring, a fall. In the ball-held arm stress the hands are penetrated by at most 0.9 mm. Collision stress scan: the machine raises no flags in the nop, torque, sweep and walk episodes. Flags appear only when the robot is placed in the machine's throat and drives its shoulder into it. The ram is pushed 5 cm past its stop, and the pinched ball gains 50 J. Header shows the same issue in the shared block. RTF (physics only, start command held, 4 x 10 s): 0.91 on a slower host, about 2.0-2.5 on the workstation (free-throw 0.84 in the same run).; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades the live
# episode (no grading replay). The loops run on the clock, inside timeout_sec: the verdict ("finalized":
# true, written before any video is rendered) may take until 840 s (the end waits through a crash-recovery resume);
# then the hook waits for the video, one render pass from the trajectory ("video_pending"), until 870 s -- a video that
# is not ready by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md). The agent's
# container holds no simulator, no referee and no instance.
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 20480

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
