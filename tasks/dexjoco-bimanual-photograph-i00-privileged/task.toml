# Generated by scripts/dexjoco/generate.py -- edit the generator or the instance, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/dexjoco-bimanual-photograph-i00-privileged"
description = "DexJoCo bimanual_photograph (two Franka Panda arms, each with a 16-DoF Allegro hand, MuJoCo): produce one replayable trajectory. Hold the camera with the left hand in front of the logo and press its shutter with the right hand. Frozen scene instance (the initial state of a DexJoCo human demonstration)."
authors = [{ name = "Chi Gui" }]
keywords = ["robotics", "dexjoco", "mujoco", "allegro", "dexterous-manipulation", "code-as-policy", "trajectory", "bimanual_photograph"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"
simulator = "dexjoco"
robot = "franka-allegro-bimanual"
family = "bimanual_photograph"
mode = "privileged"
oracle = "full"
expert_time_estimate_hours = 2.5

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # the verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 5400.0
network_mode = "allowlist"        # the reference demonstrations are public on Hugging Face (PROTOCOL §2.7)
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 1800.0
