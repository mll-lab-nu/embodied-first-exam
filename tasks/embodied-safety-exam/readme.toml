name = "Embodied Safety Exam"
citation = "Wang et al., 2026"      # Embodied First Exam (arXiv:2611.12177): Embodied Safety Exam is one of its original suites
url = "https://www.embodied-first-exam.ai/suite/embodied-safety-exam/"
