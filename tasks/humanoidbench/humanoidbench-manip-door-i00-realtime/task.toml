# Realtime task of humanoidbench-manip-door-i00-privileged (docs/protocol/README.md §3).
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/trajectory.first.npz", service = "sim" },
  { source = "/data/replay.first.mp4", service = "sim" },
  { source = "/data/replay.first.last.png", service = "sim" },
  { source = "/data/ticks.f64", service = "sim" },
  { source = "/data/calls.jsonl", service = "sim" },
  { source = "/data/submitted.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/humanoidbench-manip-door-i00-realtime"
description = "REALTIME MODE (robot as a service on a clock that does not stop, eai-standard/2.3): HumanoidBench door on the same frozen instance as humanoidbench-manip-door-i00-privileged. Time does not stop: once an episode starts, the robot runs at 50 Hz in real time and holds its last targets while the agent thinks, so the agent streams joint-position targets from a controller program of its own through the client (/observe, /submit with a plan from step `at`, /reset; head-camera RGB, joint proprioception, a pelvis IMU, a fixed room camera). Up to 50 resets, no privileged state, no reward; the sim service records every executed control step and grades the last episode as it ran (the live episode; nothing is replayed)."
keywords = ["robotics", "humanoidbench", "mujoco", "h1", "manipulation", "realtime-mode", "trajectory", "door"]

[metadata]
task_type = "trajectory"
simulator = "humanoidbench"
robot = "unitree-h1"
family = "door"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.3"
instance_seed = 0
expert_time_estimate_hours = 6.0
oracle = "none"
oracle_evidence = "Claude Opus 5.5's privileged-mode trajectory (676.02 / 600 on image 0.1.6, MuJoCo 3.1.6), run `claude_code-claude_opus_5_5-medium` on the results site; it is open-loop, so it does not carry over to image 0.2.0's physics (9.24 / 600 there); in realtime, the same rows planned into the episode from step 0 (submit's `at`) run at the same control steps and are graded the same; human review in PR #83"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it: the
# live episode's verdict, nothing replayed. The loops run on the clock, inside timeout_sec: the verdict
# ("finalized": true, set before any video is rendered) is in within seconds, or later after a crash-resume, which
# re-runs the journal (840 s at most); then the hook waits for the video, one pass over the trajectory after the verdict
# ("video_pending"), until 870 s -- a video that is not ready by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator and no reward, but upstream is a public commit: like every HumanoidBench
# task, the agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
