defaults:
  - ring_lip_install
  - _self_

install:
  center: [-0.08, 0.07]
  tube_radius: 0.006
  groove_inner: 0.085
  groove_outer: 0.131
  lip_opening: 0.024
  floor_z: 0.012
  wall_z: 0.029
  lip_top_z: 0.035
  spawn_z: 0.043
  base_inner: 0.066
  base_outer: 0.153
  base_bottom: 0.003
  source_center: [-0.22, -0.30]
  source_z: 0.0075
  pickup_angle_deg: 180.0
  release_s: 2.0
  rope:
    fem:
      E: 2000000.0
      friction_mu: 0.55
    mesh:
      maxvolume: 0.00000012

gripper_demo:
  contact_friction: 0.9
  open_half_gap: 0.04
  grasp_half_gap: 0.0055
  push_half_gap: 0.0
  pickup_assist: true
  pickup_patch_radius: 0.014
  lift_height: 0.30
  placement_offset: [0.018, 0.006]
  robot_mode: kinematic_ik

env:
  cameras:
    agentview:
      fov: 51
      lookat: [-0.16, -0.08, 1.20]
    front_oblique:
      fov: 46
      lookat: [-0.10, -0.08, 1.03]
    wrist:
      fov: 80
      attach:
        offset_pos: [0.090, 0.075, 0.045]
        offset_lookat: [0.0, 0.0, 0.140]

run:
  output: runs/ring_lip_install/gripper_pick_push
  mode: full
  probe: true
  preview: false
  render: false
