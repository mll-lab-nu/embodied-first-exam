schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-javelin-i00-privileged"
description = "Embodied Olympics javelin (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Throw the javelin held by its cord in your right hand over the shoulder from behind the arc so that its head strikes the ground first, inside the sector, at least 20.0 m from the arc, then leave the runway behind the arc and stand. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "javelin"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "javelin"
category = "throwing-catching-striking"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 12.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: The cord lies across the palm of the H1-2's own right Inspire hand (its default forces, 20 N per fingertip, 30 N the thumb), held by contact and friction. A fast overhand swing pulls the cord out of the hand: its load back-drives the finger drives to their self-locking limits and pulls the cord out across the fingers at about 1.14 s (before the commanded opening at 1.18 s), at 12-13 m/s pointing down, at 1x and equally at 2x these forces (so no factor up to 2x helps); a swing searched by CMA-ES (about 60 generations) reaches 9.8 m head first (the mark is 20 m). Positive by a declared magic action: real arm raised above the shoulder holding the javelin, the hand opened; injected once, the javelin moved 0.12 m up and given 17 m/s at 35 deg: it lands head first 31.6 m from the arc; the real walk back off the runway and stand; the same state hash twice. Negatives: nop, a release below the shoulder, the hand opened at the start, the back turned, walking over the arc, leaving the runway while it flies, tail first, outside the sector, short, touched after the release, out in front of the arc's ends, a fall. Stress: random arm targets with the hand closed: at most 0.4 mm into the fingers. The clean release (TR 38.1(a), held with one hand, not slung or hurled): the release is the javelin's last contact with any part of the robot after the hold ends (then 0.02 s free), with at most 0.2 s of unheld contact on the right arm in between; after it, brushes by the right arm in the 0.2 s grace may change its velocity by at most 0.5 m/s in all (the contact impulses, summed, over its mass). A model run's 21.2 m throw (the hold ended at 5.3 m/s, then batted by the opening hand to 20.8 m/s) fails: release at its last continuous contact (7.078 s, 8.6 m/s), then 'struck after the release' (5.1 m/s by contact at 7.109 s). Every rule above is judged in the family's own 1 ms substep hook.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
