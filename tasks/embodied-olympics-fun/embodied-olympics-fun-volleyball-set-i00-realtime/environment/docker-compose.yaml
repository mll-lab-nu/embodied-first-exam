# Realtime mode (PROTOCOL §3): the simulator runs in the `sim` sidecar (the agent cannot open it), on its own clock
# once an attempt starts (sim/rcb_realtime.py, the shared eai-standard/2.3 layer, with the standard twin's sim/server.py);
# the agent only reaches port 8000. No `expose`/`ports` on sim.
# GPU on sim: the physics is MuJoCo on the CPU, but every image the agent asks for is rendered here, and on a clock that
# does not stop a render is time the simulator cannot step: EGL on the GPU takes milliseconds a frame, OSMesa about 1.6 s
# in these venues. `graphics` is the capability that mounts the NVIDIA EGL driver (the image has the loader and manifest).
# Crash recovery: compose restarts a crashed service (same container, same /data) and the service replays its journal
# into the same attempt, paused, never a reset.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 8192m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    x-gpu-memory-gb: 4   # GiB   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /tmp
    command: python /srv/rcb_realtime.py
    restart: on-failure:6                               # a crash resumes the same episode, never a reset (rcb_service.py)
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_DATA: /data
      OMP_NUM_THREADS: "1"                              # one thread per numeric library: the world steps on one core
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RCB_WALL_CLOCK_S: "7200"
      RCB_STARTUP_TIMEOUT_S: "300"                      # the scene builds in under a second
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the standard
      # configuration; results under other settings are reported separately.
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-1}"                # S = 1: the world runs at 1/S of real speed (one S for every family; PROTOCOL §2)
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-5}"       # 5: Embodied Olympics' attempts (tasks/embodied-olympics-fun/README.md); 0: one attempt
      RCB_SESSION_LOG: ""
      PYTHONPATH: /srv
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
