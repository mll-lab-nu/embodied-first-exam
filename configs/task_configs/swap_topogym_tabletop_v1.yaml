# Swap layout expressed in the TopoGym tabletop V1 task frame.
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。

task:
  id: swap
  difficulty: smoke
  success_tolerance_xy: 0.045

coordinate_frame: task

slot_size: [0.056, 0.056, 0.006]
slot_color: [0.96, 0.96, 0.92]
slots_visible: true
slots_collision: true
slot_marker:
  enabled: true
  # 方形环靶标（与方形 slot/方块协调；旧圆环 target_ring 已弃，留档：
  # style: target_ring / radii: [0.034, 0.027, 0.020]）。中性灰系，弃红白。
  style: square_ring
  collision: false
  height: 0.0004
  z_gap: 0.00006
  sides: [0.048, 0.038, 0.028]
  colors:
    - [0.05, 0.06, 0.08]
    - [0.72, 0.73, 0.75]
    - [0.05, 0.06, 0.08]
slots:
  - {name: slot_0, index: 0, pos: [0.00, -0.184, 0.003]}
  - {name: slot_1, index: 1, pos: [0.00, -0.092, 0.003]}
  - {name: slot_2, index: 2, pos: [0.00, 0.000, 0.003]}
  - {name: slot_3, index: 3, pos: [0.00, 0.092, 0.003]}
  - {name: slot_4, index: 4, pos: [0.00, 0.184, 0.003]}

blocks:
  block_red:
    label: A
    initial_slot: 0
    size: [0.038, 0.038, 0.038]
    color: [1.00, 0.06, 0.03]
  block_blue:
    label: B
    initial_slot: 1
    size: [0.038, 0.038, 0.038]
    color: [0.02, 0.20, 1.00]
  block_purple:
    label: C
    initial_slot: 2
    size: [0.038, 0.038, 0.038]
    color: [0.70, 0.10, 1.00]
  block_green:
    label: D
    initial_slot: 4
    size: [0.038, 0.038, 0.038]
    color: [0.02, 0.85, 0.12]

goal:
  empty_slot: 4
  blocks:
    block_red: 0
    block_blue: 1
    block_purple: 2
    block_green: 3

oracle:
  block_to_move: block_green
  source_slot: 4
  target_slot: 3

# Heights are relative to the task-frame table surface.
primitive:
  approach_z: 0.230
  grasp_z: 0.1299
  lift_z: 0.330
  place_z: 0.1299
  steps_per_phase: 80
  gripper_steps: 30

physical:
  finger_links: [left_finger, right_finger]
  finger_friction: 2.0
  block_friction: 0.8
  # 抓取时每指目标 qpos（gap≈2*qpos）。block 宽 0.038 → gap 0.032 留约 3mm/侧轻压，
  # 让手指停在方块表面而不是闭到 0（全闭=怼进刚体靠力限硬夹，不物理）。
  grasp_qpos: 0.016
  noslip_iterations: 5
  settle_steps: 40
  close_hold_steps: 30
  # 放置到位后夹着方块停顿再松手（更自然的"放稳再松手"观感，2026-07-13）。
  place_hold_steps: 40
  release_hold_steps: 30
  lift_check_delta: 0.05
  min_lift_delta: 0.025
  max_grasp_xy_error: 0.025
  place_tolerance_z: 0.03

mdp:
  max_episode_steps: 150
  lift_height: 0.07
  reward:
    reach: 1.0
    place: 2.0
    lift: 1.0
    success: 10.0
    action: 0.01
    step: 0.01
