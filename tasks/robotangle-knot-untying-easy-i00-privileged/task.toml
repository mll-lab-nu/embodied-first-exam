schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robotangle-knot-untying-easy-i00-privileged"
description = "RoboTangle knot_untying (ALOHA 2, Genesis): produce one replayable trajectory. Untie and spread the rope on the tabletop until its top-down projection has no crossings or overlaps, then release it. Frozen scene instance (variation knot_untying_easy, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "aloha", "code-as-policy", "trajectory", "knot_untying"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "19"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robotangle"             # RoboTangle on Genesis 1.2.1 (CUDA physics, Nyx RGB)
robot = "aloha-2"
family = "knot_untying"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "full"
difficulty = "easy"               # the variation's tier (docs/TAXONOMY.md)
grasp = "physical (no assisted grasping)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision terminal_v5_fixed_contact_active_clearance_1mm)"
instance_seed = 0                 # scene = environment/instance.json (variation knot_untying_easy, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
