schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-tabletennisg1-matchcpu-i01-privileged"
description = "PRIVILEGED (Embodied Olympics): table tennis between two Unitree G1 humanoids (tabletennis_g1, revision g1tt-10+core-0.5), one match against the platform's G1 at level 4 (the BOSS) on the frozen instance of embodied-olympics-match-tabletennisg1-matchcpu-i01-realtime (seed 4). Full simulator in development (any level, seed and state); the deliverable is a closed-loop Python program that drives every joint of its G1 in a fresh unmodified match in the verifier (the sport's in-process runner: the world waits for the program at every control step, 0.5 s per call), seeing the full state as well as the camera images. Ported from Embodied Olympics tabletennis_g1."
keywords = ["robotics", "embodied-olympics", "sports", "tabletennis", "humanoid", "unitree-g1", "mujoco", "fullsim", "policy", "joint-level"]
[metadata]
task_type = "policy"
simulator = "mujoco"
robot = "unitree-g1"
family = "tabletennisg1_match"
resource_tier = "cpu"
tier_twin = "embodied-olympics-match-tabletennisg1-matchgpu-i01-privileged"
dynamics = "dynamic"
instance_seed = 4
opponent_level = 4
revision = "g1tt-10+core-0.5"
source_commits = ["45ed806a5"]
source_task = "roboolympics/tabletennis_g1-match-wallclock-program-engineer-standard"
official = false
expert_time_estimate_hours = 2.0
oracle = "full"
oracle_evidence = "the sport's camera-only reference player (solution/program.py: builtin_players:OpenReference in its in-process form, the learned striker of the release on CPU; it ignores the truth) won 5:3 on a Xeon Platinum 8488C (Embodied First Exam's local Harbor runs: see the benchmark README; replay identical); nop 0"
validated = true

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240
[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 12
memory_mb = 16384

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
