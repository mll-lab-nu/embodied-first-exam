defaults:
  - staged_lock
  - _self_
env:
  # Renderer, room, lighting and table finishes inherit the shared preset.
  appearance:
    - {pattern: lock_disc_1, color: [0.76, 0.53, 0.23], metallic: 0.65, roughness: 0.4}
    - {pattern: lock_disc_2, color: [0.20, 0.43, 0.60], metallic: 0.65, roughness: 0.4}
    - {pattern: lock_disc_3, color: [0.72, 0.34, 0.22], metallic: 0.65, roughness: 0.4}
    # Neutral steel: darker reflectance separates the shaft/fins from the pale
    # table and gripper, while moderate roughness retains broad metal highlights.
    - {pattern: lock_key, color: [0.32, 0.35, 0.38], metallic: 1.0, roughness: 0.28, embed_urdf_pbr: true}
    - {pattern: lock_endpoint, color: [0.10, 0.34, 0.28], metallic: 0.45, roughness: 0.45}
    - {pattern: lock_goal_label, color: [0.96, 0.96, 0.88], metallic: 0.0, roughness: 0.65}
    - {pattern: lock_goal_bolts, color: [0.58, 0.62, 0.63], metallic: 0.8, roughness: 0.35}
run:
  output: runs/staged_lock_task/nyx_default
