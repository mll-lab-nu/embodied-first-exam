scoring_note = '''A large share of each step is paid only while the tool is in contact with the glass —
while it is not, that share is zero, so the bar cannot be reached without contact. The rest pays for
moving the tool vertically at a target speed on the order of half a metre per second, for keeping both
hands near the tool, and for standing with the head about 40 cm from where it started.'''
ends_note = "The episode ends immediately if the pelvis drops or the tool falls, i.e. if it is dropped."
obs_layout = "qpos(87) + qvel(84), robot + tool state (the tool's free joint and its wiper's ball joint)"
task_notes = ""
difficulty = '''- **Tool use with sustained contact.** The subset's one tool-use task, scored on the tool's contact
  with a surface. The tool is not the goal, it is the means: the
  robot has to grasp it, then control the *tool's* contact with a surface while moving. Losing the grip
  ends the episode.
- **61 actuators.** Two Shadow hands take the action from 19 numbers to 61 — the same capability class
  as `push` at triple the search dimension.
- **A zero-valued contact gate.** Wiping without touching the glass scores nothing for the contact half
  of the reward.
- **An all-zero trajectory terminates at step 17**, tied with `cube` for the fastest failure in the
  subset: the tool is dropped almost immediately.'''

[task.standard]
