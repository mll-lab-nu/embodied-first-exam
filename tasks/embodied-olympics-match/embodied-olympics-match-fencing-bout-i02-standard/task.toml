# Exported by Embodied Olympics from fencing-bout-wallclock-program-standard (sports/fencing/sport.toml): do not edit.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
]

[task]
name = "embodied-first-exam/embodied-olympics-match-fencing-bout-i02-standard"
description = "STANDARD (Embodied Olympics / Embodied Agent Olympics, our own service): robot epee fencing, one bout against the scripted opponent at level 2, program play (eai-standard-turn/1.0: the world waits for the player whose turn it is; the player's chess clock of 60 minutes of real time runs on its own turns, reviews included, and a player whose clock runs out loses). Camera images and the player's own state only. Frozen development instance (seed and level fixed, not an official seed). two Unitree G1 humanoids (the robot library's, NVIDIA's SONIC whole-body policy on the legs, waist and free arm, the point skill on the sword arm) holding real epees fence one FIE direct-elimination bout (15 touches or 9 minutes of fencing time, no draws; unwillingness to fight, FIE t.124) phrase by phrase: every phrase starts on guard 1.95 m apart, both fencers choose one of nine tactical intentions (lunge, low lunge, point in line, reactive line, stop-hit, counter-attack, delayed lunge, retreat, draw), each starts after a random 0-50 ms, and the phrase is played out as it was measured in MuJoCo (2916 phrases: every pair of intentions and delays); format bout: you against a scripted fencer that reads your choices (levels 1-2, `game spec` opponent), format duel: two players choosing at the same time. Exported from Embodied Olympics task fencing-bout-wallclock-program-standard."
keywords = ["robotics", "embodied-olympics", "sports", "fencing", "mujoco", "standard-mode", "vision", "turn-based"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "unitree-g1"
family = "fencing_bout"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard-turn/1.0"
instance_seed = 35
opponent_level = 2
chess_clock_s = 3600
revision = "fencing-7+core-0.2"
play = "program"
action_level = "low"
source_task = "roboolympics/fencing-bout-wallclock-program-standard"
source_commits = ["a6712a675343"]
exporter = "Embodied Olympics task exporter"
player_mode = "unmetered"
official = false
expert_time_estimate_hours = 0.5
oracle = "full"
oracle_evidence = "in process (fencing-7): the oracle beats level 2 on this seed 15:13; over 40 player seeds the reference wins this instance 42.5 %, the equilibrium mix 50 % (fresh-seed means 48.0 %, 53.9 %); none of the nine constant intentions nor a random player wins it; live on vanilla Harbor 0.23.0 (2026-10-15, the exported task) the oracle won 15:13 in 32 phrases, replay identical (the world is deterministic)"

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [35, 202, 212]

[verifier]
timeout_sec = 2040.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running (a program would keep playing; the match is graded as it stands).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then SIGUSR1 ends the match: the service writes the verdict of the live match ("graded_ready"; no grading replay)
# then the spectator video.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 960); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1860

[agent]
timeout_sec = 7200
# The agent reaches the model APIs, the package registries and the sim (localhost:8000, Harbor's egress control).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
