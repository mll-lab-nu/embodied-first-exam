schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robosuite-cube-stack-i00-privileged"
description = "robosuite cube_stack: produce one replayable trajectory for frozen scene instance 00."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "robosuite", "franka-panda", "code-as-policy", "trajectory", "cube_stack"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robosuite"
robot = "franka-panda"
family = "cube_stack"
mode = "privileged"
oracle = "full"
instance_seed = 0                 # scene = environment/instance.npz (frozen MuJoCo state); identity = dataset.toml digest
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 900.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
