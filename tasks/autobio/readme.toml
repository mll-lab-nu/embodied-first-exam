# mani_thermal_mixer.py check L320-367: score = 0.5 * temperature + 0.3 * time + 0.2 * speed, each max(0, 1 - |current
# - target| / |target - initial|) (1 when target = initial), initial 60 s, 25 C, 900 rpm; success = score >= 1, i.e.
# all three set values equal the targets. Rule `final`: judged after the last row (privileged) / at the end (standard).
[families.thermal_mixer]
privileged = """
After the last row of the replay, the thermal mixer's panel settings (set time, set temperature, mixing speed) all
equal the target settings named in the Task section. The panel starts at 60 s, 25 °C and 900 rpm. AutoBio's check is
a score in [0, 1] (0.5 × temperature + 0.3 × time + 0.2 × speed, each the fraction of the way from the start setting
to the target); success needs a score of 1. Meeting it earlier in the replay does not count.
"""
success = """
At the last control step, the thermal mixer's panel settings (set time, set temperature, mixing speed) all equal the
target settings named in the Task section. The panel starts at 60 s, 25 °C and 900 rpm. AutoBio's check is a score in
[0, 1] (0.5 × temperature + 0.3 × time + 0.2 × speed, each the fraction of the way from the start setting to the
target); success needs a score of 1.
"""

