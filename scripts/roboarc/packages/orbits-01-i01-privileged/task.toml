schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/topogym-orbits-01-i01-privileged"
description = "TopoGym orbits (aloha, Genesis): produce one replayable trajectory. Separate and place the entire cord and wooden handle together inside the green dashed goal region. Keep the fixed post, stopper ball and base on the puzzle/system side. Frozen scene instance (variation orbits_very_easy, seed 0)."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "aloha", "code-as-policy", "trajectory", "orbits"]

[metadata]
author_name = "jianwen"
tooling_version = "18"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "topogym"             # TopoGym on Genesis 1.2.1 (CPU float64 physics, Nyx RGB)
robot = "aloha"
family = "orbits"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "none"
oracle_evidence = "No reference solution (no solution/). The frozen instance was validated by the build: it builds in a fresh process (seed < 2^31) and holds still under hold checks in a fresh container, and a verifier replay grades without a grader error. No graded positive yet. Human review per family (protocol \u00a72.7)."
difficulty = "very_easy"               # the variation's tier (docs/rcb/TAXONOMY.md)
grasp = "assisted (his contact_weld_v1 grasp regions on cord)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision placement_region_v2_default_success)"
instance_seed = 0                 # scene = environment/instance.json (variation orbits_very_easy, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
