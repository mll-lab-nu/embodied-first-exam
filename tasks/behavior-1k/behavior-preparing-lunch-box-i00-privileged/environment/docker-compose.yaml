# Isaac Sim needs an RTX-class NVIDIA GPU even headless. Harbor's local docker sandbox rejects [environment].gpus, but
# merging this onto the main service passes one GPU through (`count: 1`). The licensed BEHAVIOR dataset is mounted
# read-only from the host: $RCB_BEHAVIOR_DATA (omnigibson-robot-assets/, behavior-1k-assets/,
# 2026-challenge-task-instances/, omnigibson.key) is a precondition of every BEHAVIOR run (tasks/behavior-1k/README.md).
# Isaac's shader/asset cache gets a volume of this trial only: no fixed name, so compose names it after the trial's
# project, side-by-side trials never share it, and Harbor's teardown (`compose down --volumes`) deletes it. The first
# Isaac launch in the trial compiles shaders into it (~4 min measured on ws), later launches reuse it.
services:
  main:
    pids_limit: 16384   # rcb-monitor
    build:
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:behavior-0.1.2"]   # our prebuilt image: its layers are reused when you can pull it, else Docker builds the recipe
    environment:
      OMP_NUM_THREADS: "8"   # thread pools capped (PyTorch sizes its pool to the host: 128 on a 256-core
      MKL_NUM_THREADS: "8"   # host, spinning on every small tensor op); user 2026-09-27
      RCB_TEXTURE_BUDGET: ${RCB_TEXTURE_BUDGET:-0.1}   # Isaac's texture memory as a fraction of the GPU (rcb_behavior.py
                                                       # _cap_texture_memory); default 0.1 since protocol v1.1.5 so that GPU
                                                       # memory does not grow with the card (Isaac's own default: 0.6)
    shm_size: "8gb"
    volumes:
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
      - ${RCB_BEHAVIOR_DATA:?set RCB_BEHAVIOR_DATA to the directory holding your licensed BEHAVIOR dataset (tasks/behavior-1k/README.md)}:/data:ro
      - rcb_behavior_cache:/cache
      # The simulator's sources and this task's tooling are read-only (2026-10-14, failure analysis item 24: agents edited
      # OmniGibson and robot files in their own container, so their live runs diverged from the grader's). Docker fills
      # each empty volume from the image at the first mount, then mounts it read-only; the robot assets are in the dataset
      # mount above, read-only too. No fixed names: each trial gets its own copies, deleted with the trial.
      - rcb_behavior_src:/behavior-src:ro
      - rcb_tools:/opt/tools:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.2.0@sha256:65442d9e9eeb493d785a59d48a321345e2b48186946cc9d55beb684182514b4b
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_behavior_cache:
  rcb_behavior_src:
  rcb_tools:
