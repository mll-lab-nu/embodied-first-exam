# The core's realtime test fixture (core/tests/test_core.py): a synthetic world with no physics, written against the
# interface only, that exercises the stage-0 hooks a real sport may use: several seats per side and two entities per
# seat, N sides with a ranking and retirement, a delayed effect, observation queries and the team channel.
[sport]
name = "fixture"
protocol = "realtime"
revision = "fixture-1"
image = "ghcr.io/mll-lab-nu/efe:embodied-olympics-match-0.1.0"
status = "sport"

[observation]
fields = ["unit", "pos", "view"]

[team_channel]
max_bytes = 40
min_interval_s = 0.2
max_messages = 50
