    uniform_scale: 0.75
    yaw_deg: 90
    centering_reference: wooden_base_center
    origin_xy_m: [-0.1356786, -0.019]
    common_approach_targets_checked: 11
    single_arm_poses_checked: 22
    simultaneous_ring_poses_checked: 4
    qualification: finite IK and static collision checks only; continuous paths and grasping unverified

success: Place the entire cord and wooden handle wholly inside the green dashed area and hold still for the instance stability duration; keep all remaining puzzle parts on the system side. Continued grasping is allowed.

terminal:
  revision: placement_region_v1
  implementation: topogym.tasks.placement.PlacementGoalMixin
  goal_complete: false
  qualification: pending_real_placement_and_reachability
  target_selection: ['cord', 'handle']
