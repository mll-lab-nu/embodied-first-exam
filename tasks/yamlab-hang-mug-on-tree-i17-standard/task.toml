# Generated by scripts/yamlab/mk_tasks.py -- edit the template or scripts/yamlab/instances.json, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/yamlab-hang-mug-on-tree-i17-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): YAMLab HangMugOnTree-v0 on the same frozen instance as the privileged task (`mug` = `Mug/mug_017` and `mug_tree` = `MugTree/mug_tree_017`). Task: pick up the mug with the left arm, hand it over to the right arm, and hang it on the mug tree. The agent only gets a client: get_obs (RGB, depth + proprioception of both arms), submit (joint_position or ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "yamlab", "isaac-lab", "isaac-sim", "bimanual", "i2rt-yam", "standard-mode", "trajectory"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "yamlab"
robot = "i2rt-yam-bimanual"
family = "hang_mug_on_tree"
mode = "standard"                  # robot as a service: RGB, depth + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.2"
oracle = "full"
expert_time_estimate_hours = 3.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 8.0
min_memory_gb = 16.0
min_gpu_memory_gb = 5.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 8.0
verifier_min_memory_gb = 15.0
verifier_min_gpu_memory_gb = 5.0
measured = "GPU 3.8-4.0 GB per trial, anon memory 11.1-11.8 GB, CPU p90 5.8-8.7 cores over 12 trials, live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 AWS hosts + ws-1, 10-10); vram_profile peaks 5.5-6.5 GB on 24 GB cards; board 0048: about 11 GB RAM and 8 CPUs per simulator; verifier 7.2 GB, mem_guard (docker memory per container, ws-1, 10-02..10)"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json
timeout_sec = 5400                # = the agent budget: a 1.5 h episode replayed twice (~60-120 control steps/s) plus two Isaac starts

[agent]
timeout_sec = 5400.0              # YAMLab budget, both modes (docs/benchmarks/yamlab.md)
# YAMLab's teleoperation demonstrations (which solve these exact instances) and its MimicGen datasets are public upstream,
# so the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576
