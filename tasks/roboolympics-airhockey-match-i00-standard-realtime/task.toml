# RoboOlympics Air hockey against the scripted opponent, standard-realtime mode (docs/PROTOCOL.md §4b, docs/benchmarks/roboolympics.md).
# Generated by scripts/roboolympics/gen_tasks.py from tasks.toml, sports.toml and templates/ -- edit those, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/match.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/commands.jsonl", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/ticks.f64", service = "sim" },
  { source = "/data/calls.jsonl", service = "sim" },
  { source = "/data/submitted.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/roboolympics-airhockey-match-i00-standard-realtime"
description = "STANDARD-REALTIME MODE (robot as a service on a clock that does not stop, eai-standard/2.3): RoboOlympics air hockey, one match against a scripted opponent (level 1, frozen seed 101). The world runs at 1/10 of real speed (S = 10, the benchmark's official slowdown) and never waits: the agent sees only camera images and its own robot through the client, and drives the robot with the sport's commands (`mallet`, `stop`, `ready`) from a program of its own. Between rallys a break of 12 s of game time (120 s of wall time) in which the clock runs on and nothing plays; no reset, no privileged state. The sim service records every command at the step it took effect, replays the match in a fresh process and grades it: success = a finished match that the agent won."
authors = [{ name = "RoboOlympics (CHIGUI0)" }]
keywords = ["robotics", "roboolympics", "sports", "airhockey", "mujoco", "standard-realtime-mode", "vision", "real-time"]

[metadata]
author_name = "RoboOlympics"
task_type = "trajectory"
simulator = "mujoco"
robot = "kuka-iiwa14"
family = "airhockey_match"
mode = "standard-realtime"
protocol = "eai-standard/2.3"
instance_seed = 101
opponent_level = 1
slowdown = 10
revision = "airhockey-program-v4+players-25k+core-0.2"
play = "program"
action_level = "low"
source_task = "roboolympics/airhockey-match-wallclock-program-standard"
expert_time_estimate_hours = 0.5
oracle = "full"
oracle_evidence = "solution/: the sport's RoboOlympics reference player (camera images, proprio and /spec only) through the agent's client; it wins this instance (PR #106)"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container (a program would keep playing).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the match ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which replays and grades it.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; for i in $(seq 1 400); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; [ $((i % 15)) -eq 1 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 7200
# The agent reaches the model APIs and the sim (localhost:8000, Harbor's egress control) and nothing else.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096

[verifier.environment]
build_timeout_sec = 600.0
