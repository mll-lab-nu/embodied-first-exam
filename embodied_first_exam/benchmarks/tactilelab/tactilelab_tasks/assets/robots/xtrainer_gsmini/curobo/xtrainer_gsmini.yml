# xtrainer_gsmini.yml - cuRobo robot configuration for the X-Trainer with GelSight-Mini fingers.
# Arm, wrist, ignore lists and buffers follow the stock X-Trainer configuration; the J1_7/J1_8/J2_7/J2_8
# collision spheres cover the printed GelSight-Mini fingers (greedy sphere cover of finger + sensor shell,
# nothing within 0.5 mm of the gel face).
# Paths are relative to this file's directory; the loader (tactilelab_tasks.backends.curobo_planner) makes them
# absolute before handing the dictionary to cuRobo.
# Position-mode FK readout order.
