# Generated by scripts/libero-max/generate.py -- edit the template or cases.json, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/libero-max-goal-flat-stove-on-sensor-noise-onset-i00-privileged"
description = "LIBERO-MAX (libero_goal, sensor-noise onset; Franka Panda): Turn on the stove. Mid-task, once the gripper comes within 0.18 m of the flat_stove_1, the scene changes (sensor-noise onset). Produce one replayable trajectory of LIBERO's native OSC control steps on a frozen instance; graded by LIBERO's success check at the trajectory's end."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "libero", "libero-max", "robosuite", "franka-panda", "online-event", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "robosuite"
robot = "franka-panda"
family = "libero-max/libero_goal/sensor_noise_onset"
mode = "privileged"
oracle = "full"
instance_seed = 195             # LIBERO-MAX's policy seed for the case (the scene is the frozen LIBERO-PRO initial state)
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
