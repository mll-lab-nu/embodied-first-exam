# Embodied Olympics tasks exported by Embodied Olympics' own exporter (a private repository, MIT): its simulator
# service runs unchanged inside each task (PROTOCOL §3; tasks/embodied-olympics-match/README.md: the benchmark
# Embodied Olympics - Match). Written by that exporter on this checkout, then `python3 scripts/task_conventions.py` on
# them (seeds, resources, README; the cutoff is each task's own `[agent] timeout_sec`, which a re-export must keep:
# 7200 s, 14400 s for soccerssl-match-i01, badminton-match-i04, badminton-duelrl-i01 and foosball-match-i01).
# `patched`: files this repository changed after the export (PROTOCOL §3: sent upstream; a re-export must keep them).
# Every task: the standard modes are graded by the live episode: core/service.py, core/grading.py = tests/grade.py,
# core/realtime.py (real-time: the control step's own error), spectator/sport_video.py (where present),
# docker-compose.yaml (RO_VERDICT_REPLAY=0), task.toml, README.md.
# Every task: provenance text only (no code, number or field a grader or simulator reads): machine names,
# review-server links and the exporter repository's name in comments, docstrings, scene-file comments and free-text
# metadata fields (policy / weights / reference-parameter notes, sport.toml comments, oracle_evidence), the bundle
# hashes of those files, and the files-only image pin.
# Every task: image names and pins only: efe:embodied-olympics-match-* tags (the digests the export names under the
# efe:olympiad-*, efe:olympiad-soccer-* and efe:soccer-joint-* tags) in the Dockerfiles, sport.toml / toolkit.toml image
# fields, test docstrings and README, the bundle hashes of those files, and the files-only image pin
# embodied-olympics-match-files 0.3.0 (it also carries the paths and bytes of embodied-olympics-match-sim-files).

# The protocol each mode of these tasks serves (PROTOCOL §3): ci_checks/check-protocol.py accepts it for the
# directories listed below only.
[protocols]
standard-realtime = "eai-standard-realtime/1.0"   # the real-time matches: Embodied Olympics' own service and referee
standard = ["eai-standard-turn/1.0",              # the turn-based matches: the world waits for the player whose turn it
            "eai-standard-lockstep/1.0"]          # is, a chess clock per player (Embodied Olympics' own service and referee);
                                                  # G1 table tennis's standard twins: the same service, the world in
                                                  # lockstep (environment/sim/core/lockstep.py, Embodied First Exam's)

