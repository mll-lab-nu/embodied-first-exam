# Generated from scripts/kinder/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/kinder-balance-beam-i00"
description = "KinDER BalanceBeam3D-o3: produce one replayable trajectory that reaches the goal, frozen scene instance i00."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", "mujoco", "tidybot", "mobile-manipulation", "physical-reasoning", "trajectory", "balance-beam"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "tidybot-plus-plus"
# KinDER env kinder/BalanceBeam3D-o3-v0
family = "balance-beam"
tier = "privileged"
# scene = environment/instance.json (KinDER's seed + a digest of the scene it builds); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Off the network like every task here (docs/LEAKAGE.md); the model API is opted into per run with
# `harbor run --allow-agent-host <host>`.
network_mode = "allowlist"
allowed_hosts = []

[environment]
build_timeout_sec = 1800.0
cpus = 16
memory_mb = 16384
