schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robotangle-cast-coil-easier-i00-privileged"
description = "RoboTangle cast_coil (ALOHA 2, Genesis): produce one replayable trajectory. Assemble the gold and silver pieces into a cube with flush outer faces, then release both on the table. Frozen scene instance (variation easier, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "aloha", "code-as-policy", "trajectory", "cast_coil"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "19"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robotangle"             # RoboTangle on Genesis 1.2.1 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "cast_coil"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "full"
grasp = "assisted (the contact_weld_v1 grasp regions on coil_gold, coil_silver)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision release_settling_v2_grasp_contact_2mm)"
instance_seed = 0                 # scene = environment/instance.json (variation easier, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 7.0
min_gpu_memory_gb = 7.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / RTX 4090 24GB / L4 24GB (sm_86 or newer)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 5.0
verifier_min_gpu_memory_gb = 7.0
measured = "GPU 5.9 GB on L4, 10.3 GB on L40S, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: sim p90 4.0 GB, privileged container 4.6 GB, verifier p90 3.9 GB, mem_guard (docker memory per container, mll-4090-1, 10-02..10); CPU author estimate"

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
