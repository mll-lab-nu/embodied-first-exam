# ============================================================================
# ring_transfer 专用 robot 配置：指关节 PD 增益加大（kp 100→500，kv 10→30）。
#
# 为什么与 base 不同：ring_transfer 的捏取要在指垫离桌 4mm 处合拢，指垫与桌面刚体影子
# 有接触摩擦，base 的 kp=100 只能以每 10 步 0.2mm 的速度爬（carry.log：400 步只从 0.038
# 到 0.0135）——视频里就是「夹爪半天合不上」。指质量 0.015kg，kp 500 仍远低于力上限 100N。
#
# 与 franka_panda_position_ik.yaml 的关系：本文件是 base 的完整拷贝，**只有 controller.kp /
# kv 的最后两项（手指）刻意不同**。加载器整份加载、不做 base+override 合并，所以必须整份
# 复制。**维护提醒**：改动 base 的其它段请同步到本文件。
# ============================================================================

robot:
  name: franka_panda
  asset: xml/franka_emika_panda/panda.xml
  joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - finger_joint1
    - finger_joint2
  arm_joint_count: 7
  gripper_joint_count: 2
  ee_link: hand

home:
  qpos: ${common.robot_setup.home.qpos}
  settle_steps: ${common.robot_setup.home.settle_steps}

controller:
  type: position
  kp: [4500, 4500, 3500, 3500, 2000, 2000, 2000, 500, 500]
  kv: [450, 450, 350, 350, 200, 200, 200, 30, 30]
  force_lower: [-87, -87, -87, -87, -12, -12, -12, -100, -100]
  force_upper: [87, 87, 87, 87, 12, 12, 12, 100, 100]

ik:
  enabled: true
  default_ee_quat: [0.0, 1.0, 0.0, 0.0]
  # ---------------------------------------------- 求解预算（`continuous_ik` 路径）
  # 全仓所有物理 demo 共用这条路径，2026-08-24 之前这三项写死在
  # `topogym/robot/franka.py` 里，从来没人调过。
  #
  # 实测：把命令位姿抬高 4mm，手只上去 0.2mm（hand_gap 的 dz 从 −1.0 变成 −4.5mm），
  # 而同一时刻控制器把 IK 给的关节角追到了 0.5° 以内 —— 两档一样。
  # 也就是**控制器没问题，是求解停早了**：返回的关节角正解不等于目标位姿。
  #
  # 留原值以保持所有已标定任务的行为不变；扫参用点路径覆盖：
  #   robot_control.ik.max_solver_iters=200
  max_samples: 1
  max_solver_iters: 50
  max_step_size: 0.15

gripper:
  open_qpos: 0.04
  closed_qpos: 0.00

action_protocol:
  mode: ee_delta
  dims: [dx, dy, dz, dyaw, gripper]
  max_delta_xyz: 0.03
  max_delta_yaw: 0.20
  workspace:
    x: ${common.manipulation_space.workspace.x}
    y: ${common.manipulation_space.workspace.y}
    z: ${common.manipulation_space.workspace.z}

control_loop:
  steps_per_action: 20
  interpolation: linear
  use_plan_path: false
  plan_waypoints: 80
