# Gate Cage Ball（docx 4.1）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 工业原型：直线振动送料轨上的插板阀。一颗哑光陶瓷轴承球沿轨道匀速往复，机器人把
# 闸板插入槽口把它截留在盒内。
#
# 几何主轴沿 y：闸板板面因此垂直于 y，而 franka 的指滑轴在 default_ee_quat 下映射到
# 世界 y，夹爪正好捏住板的两个大面（像从书架上取一本书）。
#
# 两端刻意不对称，这是任务成立的前提：
#   近端（-y）敞口 = 球唯一的出入口，也是闸板要封的那个面
#   远端（+y）实壁 = 球撞上后换向
# 都堵死则球本来就出不去，插板不改变任何状态；都敞开则没有「里面」。
#
# 2026-08-17 第四次修订：球改为**匀速往复驱动**（tasks/connectivity/ball_shuttle.py），
# 不再靠重力斜坡。进料坡与回程坡整个删除，随之消失的还有坡角、静止起步能否滚动、
# 换向有无能量损耗这一整类问题。速度成为单一旋钮，由它推出的时序是精确值而非积分值。
#
# 终态因此是自明的：
#   成功 -> 球在盒内持续往复撞击闸板与远端壁
#   失败 -> 球从敞口滚出轨道（出轨后驱动即停止，球带着原速离开）
#
# 三个旋钮，彼此正交：
#   ball.speed        -> 同时缩放「球到门时刻」与「窗口长度」
#   entry_start_y     -> 只决定球何时到门     entry_delay = 入口段长 / v
#   flat_end_y        -> 只决定窗口多长       window = 2*(封闭区长 - 球半径) / v
#
# 两条可解性判据（GateCageBallLayout.checks()，随机化拒绝、建场景、demo 启动共用）：
#   A  window ≥ insert_duration + timing.safety_margin        球进来后封得住
#   B  entry_delay + window − insert_duration ≥ t_ready + timing.ready_margin
#                                                             臂就位时最晚下板时刻还没过
# entry_delay − t_ready 的正负（臂先到还是球先到）只报告不约束：它就是三条触发规则
# 拉开差距的机制，按它调几何等于把基线分数写进场景定义。
# t_ready / insert_duration 由 motion.* 的步数乘 timing.sim_dt 得到。

#
# 现值：v=0.120m/s，臂就位 2.40s，球到门 3.33s（悬停 0.93s），窗口 2.00s（余量 0.55s）。
# y 总跨度 [-0.420, +0.165]，比上一版的 1.015 缩短到 0.585。
#
# 依赖的实测（tests/ball_roll_spike.py，2026-08-17）：
#   刚体对刚体零回弹，落 100mm 后 rebound_ratio = -0.001。故换向不能靠碰撞，
#   要么靠坡（已弃用），要么由驱动器翻转方向（现方案）。
#   平地滚动零阻力：球出轨后会一直滚走，失败态因此明显。

task:
  id: gate_cage_ball
  difficulty: smoke

coordinate_frame: task

# ------------------------------------------------------------------ 轨道本体
channel:
  # 轨道中心线 x。随机化区间 [0.055, 0.095]（工作区）。
  center_x: 0.000

  # 内净宽（x 向）。球径 60mm，两侧各留 15mm。
  inner_width: 0.090
  wall_thickness: 0.015
  # 封闭区侧壁高出轨底的高度。球顶在轨底上方 60mm；90mm 留足余量。
  wall_height: 0.090
  # 入口段（门外那截）的侧壁高度。这一段只需要把球导直，不需要围住它，
  # 做矮之后盒体与引道在视觉上分得开，wrist/front 视角也不会被挡。
  # 45mm 仍高于球心（39mm），球爬不出去。
  entry_wall_height: 0.045
  floor_top_z: 0.009
  floor_thickness: 0.009
  # 轨道最外端（球的起点在这附近，门外）。入口段长 = door_y - entry_start_y。
  # 2026-09-08：−0.420 → −0.550，入口段 42 → 55 cm。会上要「给更多时间观察滚动」：
  # 配上放慢的球速（见 ball.speed），球在画面里滚 5.5–11 秒才到门口，此前是 2.6–5.3 秒。
  # 桌沿复核：桌子 y 向 1.4 m、桌沿在 ±0.70；出轨点 = 起点 − 2 × 球半径，最大的球时
  # −0.622，离桌沿 7.8 cm，而球以 10 cm/s 出轨后按 offtrack_decel 0.090 滚 5.6 cm 就停。
  entry_start_y: -0.600
  # 门口所在的 y（闸板板面就在这一面上）。
  door_y: 0.000
  # 敞口朝哪一端。0 = 封闭区在 +y（本文件其余数字描述的那一面），1 = 整条槽沿 y 翻面。
  # **本任务的第一条防捷径离散轴**（2026-09-09）：在此之前时机是唯一的隐藏信息，
  # 而「球从画面的哪一侧滚来、闸板要封哪一面」是固定的，策略可以背下来。
  # 翻面之后两端的可辨特征仍在画面里（实壁那一端有端墙、侧壁高 9 cm；敞口那一端侧壁只有 4.5 cm
  # 且没有端墙），读法不依赖相机站在哪。
  #
  # 便宜的原因：本段其余叶子表达的都是**离门多远**而不是绝对位置（`entry_start_y: -0.550`
  # 读作「引道从门外 55 cm 处起」），所以这里每一条时序公式都是两个这样的叶子之差、
  # 对镜像不变。真正经过它的只有「吐出或读取一个实际 y」的那几处，都走
  # `GateCageBallLayout.lane_y` / `.depth`。
  open_end: 0
  # ------------------------------------------------------------ 引道斜面
  # 引道那一段的槽底是斜面，远端高、门口低；球从松开点静止出发，**靠重力**滚向门口
  # （2026-09-10 定稿，此前是驱动器按坡角档位写速度）。坡只铺到导柱条带的外缘（door_y − 2.1 cm），
  # 门前留 2.1 cm 平段，所以坡长 = 引道长 − 2.1 cm。
  #
  # 坡角按**档**抽（slope_tier，末尾 variation 块），三档是一条有质变的难度轴（2026-09-10 晚定）：
  #   档 0   1.0°   球到门 2.9–3.1 s，**晚于臂就位 2.70 s，第一趟就能拦**
  #   档 1   2.5°   球到门 1.2–2.0 s，早于臂就位——第一趟赶不上，得等它撞墙弹回来的第二趟
  #   档 2   5.0°   球到门 0.8–1.4 s，同上，且更快
  # 每档有自己的松开点下限（min_run）：档 0 要滚程 ≥ 48 cm 才能保证到门晚于臂就位。
  # 引道 60 cm 时抬高 1.0 / 2.6 / 5.2 cm，base_camera（一像素 5.24 mm）里 2 / 5 / 10 px；
  # 档 0 在画面里几乎看不出坡——这是"第一趟就能拦"要付的代价，如实记：
  # 球从静止靠重力起步，到门时刻只由滚程与坡角定，这张桌子上 ≥ 1.5° 的坡都赶不上 2.70 s。
  # 球到门的速度由松开点与坡角一起定：v = √(2·a·s)，a = (5/7)·g·sinθ（实心球纯滚动，
  # 09-10 实测 52.8 对预测 52.9 cm/s）。
  slope_tier: 1
  slope_tiers:
    - {deg: 1.0, min_run: 0.48}
    - {deg: 2.5, min_run: 0.18}
    - {deg: 5.0, min_run: 0.18}
  # 由 slope_tier 派生；不走随机化的路径时保持 2.5°。
  entry_slope_deg: 2.5

  # 封闭区的远端内壁 y。封闭区长度（flat_end_y - door_y）是**窗口长度**那个旋钮，
  # 且只影响它：window = 2*(封闭区长 - 球半径)/v。缩短它就是缩短允许下板的时间。
  # 随机化时不直接抽它：由 flat_end_frac 在 [max(flat_end_y_min, 判据 A 取等的长度),
  # flat_end_y_max] 里定位（GateCageBallLayout.flat_end_y_from_frac），球速越快下界越长。
  flat_end_y: 0.250
  flat_end_y_min: 0.200
  flat_end_y_max: 0.300
  # 封闭区长度在允许区间内的归一化位置，[0, 1]；只在随机化时被写入。
  flat_end_frac: 0.5

  color: [0.60, 0.60, 0.59]
  floor_color: [0.50, 0.50, 0.49]

far_wall:
  thickness: 0.015
  height: 0.075

# -------------------------------------------------------------------- 闸板槽
# 四根**直**导柱，门口两侧各两根，前后夹出一条给闸板下滑的缝。柱顶不做引入倒角：
# 闸板靠自身宽度被两侧插槽同时捕获（见 gate.width 的注释），不靠漏斗找正。
#
# 缝宽 0.018 对板厚 0.012 = 单边 3mm 间隙。取消倒角之后这 3mm 就是插入的全部余量，
# 因此规划必须按 bar_through_hole 的做法瞄**实测的板位**而不是预先算好的手部坐标
# （那次实测 IK 的绝对跟踪误差是 7.5mm，比这里的余量还大）。若实跑发现过紧，
# 放宽的旋钮就是 guide_gap。
gate_slot:
  guide_gap: 0.018
  post_width: 0.021
  post_thickness: 0.012
  post_height: 0.135
  color: [0.42, 0.42, 0.41]

# ---------------------------------------------------------------------- 闸板
gate:
  # 板宽必须大于两侧插槽内缘之间的距离（= channel.inner_width 0.090），
  # 这样板落下时两端同时插进左右两条槽里，被两侧共同卡住。
  # 0.126 > 0.090，两端各深入插槽 18mm。
  width: 0.126
  thickness: 0.012
  # 板底与板顶的 z（插到底时）。板底停在槽底上方 3mm：球径 60mm 过不去，
  # 而板不碰槽底就不存在卡死，这是用几何替掉力控。
  seated_bottom_z: 0.012
  # 板顶要高过侧壁顶（0.099），否则封门后顶上留一道缝。
  seated_top_z: 0.108
  # 钢的量级；1.13kg，由 assisted attachment 承载。
  rho: 7800.0
  friction: 0.8
  # 夹爪直接捏板身上部：板沿 y 厚 12mm，对应 grasp_qpos 约 0.005。
  # 不做单独的握把块——那会是第二个自由刚体，没有任何约束把两者连在一起。
  # 偏暖的浅灰，在全灰盒体上把「被操作件」和固定件区分开。装饰做不到这件事：
  # 装饰是 fixed=True 的，闸板一被拿走条纹就留在原地。
  color: [0.74, 0.71, 0.60]

# 闸板的停放架：开局闸板竖直插在这里，机器人先取板再搬到门口。
gate_rack:
  # 随机化时不直接抽 center_x：由 x_frac 在 [x_min, 导柱外侧面 − channel_gap − 半底座长]
  # 里定位（GateCageBallLayout.rack_x_from_frac），轨道 center_x 挪了区间自动跟。
  # center_y 也不直接抽：由 side（门的哪一侧）与 y_jitter（沿轨道抖动）派生，见下。
  center_x: -0.170
  center_y: 0.000
  # 停放架在门的哪一侧。0 = 引道那一侧（−y），1 = 封闭区那一侧（+y）。
  # **防捷径镜像轴**（2026-09-09）：此前架子恒在门口旁 ±3 cm，「先往哪儿去取板」是常数，
  # 策略可以背下来；分到门两侧 15 cm 之后必须先看一眼架子在哪。
  #
  # 只能沿 y 做，不能横跨轨道做（2026-09-09 算过）：镜像到轨道 +x 侧后架心到机械臂底座
  # 0.753–0.880 m，超过本任务自己的 reach.max_hover_dist 0.700，Franka 够不着；
  # 沿 y 取 ±15 cm 时是 0.474–0.566 m，与今天的 0.450–0.538 同档。
  # 这条与 channel.open_end 互相独立：架子的 y 是任务坐标系里的绝对位置、不过 lane_y，
  # 所以「架子在引道侧还是封闭区侧」四种组合都会出现。
  side: 0
  # 架心离门的距离（米）。搬运距离因此从今天最长的 21.7 cm 变成 28.0 cm（含抖动），
  # 而搬运仍是固定的 motion.steps_per_phase = 30 步，每步位移 7.2 → 8.7 mm。
  # 「30 步跟不跟得住 28 cm」是实测项不是包络项（同 2026-09-03 那条：
  # 不把执行链的缺陷写进包络），checks() 的 carry_span 只当编辑守卫。
  side_offset: 0.150
  # 架子沿轨道方向的抖动（米）；只在随机化时被写入，派生时叠到 side_offset 上。
  y_jitter: 0.000
  x_min: -0.220
  # 架子近缘到导柱外侧面的最小净距。
  channel_gap: 0.010
  # 架子 x 在允许区间内的归一化位置，[0, 1]；只在随机化时被写入。
  x_frac: 0.5

  base_size: [0.105, 0.066, 0.009]
  # 夹爪块高度。板高 96mm 立在架上，夹得高一点更稳。
  # 上限由取板高度定：指垫在 0.085，指尖约 0.065，夹爪顶 0.009+0.045=0.054，留 11mm。
  jaw_height: 0.045
  color: [0.45, 0.45, 0.44]

# ------------------------------------------------------------------------ 球
ball:
  # 半径（米）。**单调裕度轴**（2026-09-08，档位见末尾 variation 块）：0.024 / 0.030 / 0.036。
  #
  # 难度不在窗口上。窗口 = 2 × (封闭区长 − 球半径) / 球速，封闭区 11–20 cm 而半径才 2.4–3.6 cm，
  # 球径只让窗口从 2.10 s 变到 1.90 s——10% 的差，当不了难度轴。
  # 真正随球径变的是**「不能下板」的那一段**：判定器把「板压在球身上」写成
  # |球 y − 板 y| < 球半径 + 半个板厚（gate_cage_ball_verifier.py 的 under_plate），
  # 所以门口的禁区宽度直接随球径放大：±3.0 / ±3.6 / ±4.2 cm，按 12 cm/s 就是球每经过一趟
  # 有 0.50 / 0.60 / 0.70 s 不能下板，从最小到最大涨四成。球越大越难，机制在这里。
  #
  # **槽道、闸板、导柱一概不动**：每侧净空 2.1 / 1.5 / 0.9 cm、侧壁高出球顶 4.2 / 3.0 / 1.8 cm、
  # 入口壁高出球心 2.1 / 1.5 / 0.9 cm，三档都成立（checks() 的 ball_fits_channel 与
  # wall_contains_ball 两行守住）。驱动器每步把横向速度写成 0（_ball_drive 的 velocity[0]），
  # 净空不进入动力学，只是画面上球更贴壁或更松。让槽道跟着球径缩放要付板质量 ±23%、
  # 取板高度 ±1 cm 的重标定代价，换来的窗口差只有 10%，不值（2026-09-08 算过）。
  radius: 0.030
  # 哑光陶瓷轴承球的量级。不用铬钢：真实铬钢球是强镜面反射，对视觉跟踪不利。
  rho: 3900.0
  friction: 0.4
  # 哑光灰白，与深色轨底对比明显，便于跟踪。
  color: [0.88, 0.88, 0.86]
  # 【仅 drive: true 的旧路径】驱动器写给球的到门速度（米/秒）。2026-09-10 起正式布局靠重力，
  # 到门速度由松开点与坡角定（GateCageBallLayout.ball_speed 的自由分支），这条叶子不再被读。
  speed: 0.075
  # 【仅 drive: true 的旧路径】出生速度 ÷ 到门速度。
  # 球在坡上按 v(s)² = v0² + 2·a·s 加速，a 由「出生点到坡末端的距离」现算，所以到门时刻
  # 仍是闭式解 entry_delay = 2·s_ramp/(v0 + v_door) + 门前平段/v_door，两条可解性判据不用改。
  # 加速段只作用在**入门那一程**：球一旦进过门，驱动器就恒定在 v_door，
  # 出门的球照旧带着原速离开轨道再滞行停住（失败画面不变）。这就是「驱动器分两段」，
  # 不这么分的话球会在门口被位置型速度曲线来回拉扯。
  entry_speed_ratio: 1.00
  # 开局位置（门外，入口段上）。往 +y 方向出发。
  # 随机化时不直接抽它：由 release_frac 在「轨底起点 + spawn_entry_margin」到
  # min(整球在门外 spawn_geom_margin, 至少滚够 spawn_min_observe_s 的位置, 判据 B 取等的位置) 里定位
  # （GateCageBallLayout.release_y_from_frac）。球速与封闭区长度变了区间自动跟。
  release_y: -0.250
  spawn_entry_margin: 0.020
  # 出生点离门的界，自由球（drive: false）只看两条：
  # 几何：整个球必须在门外。
  spawn_geom_margin: 0.020
  # 松开点到坡末端至少这么远（米）——**按坡角档查表**（channel.slope_tiers 的 min_run），
  # 派生时写到这里。档 1/2 取 18 cm（更短的球在 13 s 悬停上限到时已不到 10 cm/s，moving_at_cap 会拒）；
  # 档 0 取 48 cm（要到门晚于臂就位）。构造式的界，不靠拒绝。
  spawn_min_run: 0.180
  # 【仅 drive: true 的旧路径】观察：球在画面里至少要滚这么久。
  # 09-08 把 spawn_door_margin 从 2 cm 提到 8 cm，为的是把「最短能滚多久」从 0.53 s
  # 抬到 1.21 s——那是拿一个距离代替一个时间，而两者成正比这个前提在引道变斜之后就不成立了
  # （陡档的球起步慢，同样的距离买到更多秒数）。所以下限直接写成 1.20 s，
  # 距离按档派生（GateCageBallLayout._distance_for_observe）。
  #
  # 这不是新口径，是把 09-08 的意图从反推的常数改成直接声明；同时它让「球先到」这条机制
  # 不被坡挤掉：坡把到门时刻拉长 1.29–1.6 倍，若下限仍按 8 cm 的距离算，
  # 球先到的比例会从 16.6% 掉到 8.8%（1000 seed 实测），greedy 那条对照就接近退化了。
  spawn_min_observe_s: 1.20
  # 球在可出生段内的归一化位置，[0, 1]；只在随机化时被写入。
  release_frac: 0.5

  # ---------------------------------------------------- 自由滚动探针（2026-09-10）
  # drive: false 时驱动器离开轨道：球靠重力滚下引道、以松开高度决定的速度穿过平的封闭区。
  # 求解器刚体对刚体零回弹（09-10 复测：coup_restitution 0 与 1.0 落球 rebound_ratio 都是 −0.001），
  # 所以替身只做一件事：球撞墙停死那一刻，按撞墙前速度 × wall_restitution 反向写一次，然后再交回重力。
  # 每撞一次掉一截能量，爬引道越来越低，每一趟过门都比上一趟慢、停留更久；planner 挑第一趟封得住的。
  # 与 offtrack_decel 同一类：求解器缺的物理，用一个写明的常数补，只在该起作用的地方起作用。
  # 只认三个面：远端墙、关闭闸板的外侧面（被关在外面）、闸板的内侧面（被关在里面）；
  # 板底下那条带（球半径 + 半板厚）内停住的球不弹——那是被板压住，判定器记作 pinched。
  drive: false
  # 每次撞墙保留的速度比例。0.85 → 动能保留 72%。
  # 2026-09-10 从探针的 0.80 定到 0.85，两头夹出来的：
  #   e 太小（0.80）：球到 13 s 悬停上限已慢到几乎一直在门内，fixed_delay 取上限值能到 43%（离线）/
  #     9/10（seed 0–9 实测）——那是悬停上限这个执行参数在给对照打分；
  #   e 太大（0.90）：衰减慢，快球要撞十几次才慢到停留 ≥ 1.45 s，短封闭区 × 远松开点在上限内
  #     没有一趟封得住，首抽拒绝率 33.7%、解析角点 480/1152 被拒。
  # 0.85 时三档坡 × 三档封闭区 × 最大球下滚程 10–33 cm 全可行（构造式，不靠拒绝）；
  # 上限时球速 ≥ 14.8 cm/s，可用趟序号分散到第 2–8 趟，任何固定延时的上限约 25%。
  # checks() 的 moving_at_cap 守下限、window_margin 守上限。
  wall_restitution: 0.85
  # 撞墙判定的下限（米/秒）：一步内速度掉一半以上、且撞前高于这个数才算撞墙。
  # 球在坡顶自然停住每步只掉 6 mm/s，不会误判。
  impact_speed_floor: 0.05

  # 驱动器判定「被挡住」需要连续多少步没有推进。1 步是噪声，连续几步才是墙。
  stall_steps: 3
  # 出轨之后的减速度（米/秒²）。求解器没有滚动阻力（spike 实测 2.4s 内速度不掉），
  # 球出轨后会一直滚到掉下桌子；这一项替代桌面的滚动阻力，让它滚一段后静止。
  # 取恒定减速而非黏滞阻尼：滚动阻力本来就是库仑型的，停止距离 = v²/(2a)，
  # 因此换更快的球速时会自然地滚得更远。
  # 0.090（等效滚阻系数 0.0092）下：v=0.120 滚 80mm 用 1.33s；v=0.180 滚 180mm 用 2.00s。
  # 出轨点到桌沿有 220mm，两种速度都停得住。
  offtrack_decel: 0.090

# 本任务不带任何装饰件。理由见 tasks/connectivity/gate_cage_ball.py 的
# _add_visual_details：支架配方（底板/地脚螺栓/斜撑/唇边）在这里没有对应结构，
# 而画在闸板上的标记会因为装饰是 fixed=True 而在闸板被拿走后留在原地。
# 「哪个是被操作件」改由闸板自身的颜色表达。

# ------------------------------------------------------------------ 动作高度
# 全部是**手部连杆**的 z（指垫在其下方 HAND_TO_PAD_Z = 0.1029 处），任务坐标系。
# 抓取时手在 0.188 -> 指垫 0.085，落在板身上部（板跨 z 0.009..0.105，架子夹爪只到
# 0.042，所以 0.085 处板是裸露的）。
motion:
  approach_z: 0.240
  grasp_z: 0.188
  # 搬运高度：板底必须越过导柱顶（0.135）。抓取时板心比手低 0.131，板半高 0.048，
  # 故手至少要到 0.135+0.048+0.131 = 0.314。取 0.320。
  carry_z: 0.320
  # 悬停高度：板底在 0.146，高出导柱顶 11mm，等触发后直落。
  hover_z: 0.325
  # 落座：板心 0.060 = (12+108)/2，手 = 0.060+0.131。
  seated_z: 0.191
  clear_z: 0.320
  steps_per_phase: 30
  # 从 home 扑到停放架上方那一步单独的步数。它是唯一一个**终点旁边站着一块没人扶的板**的移动，
  # 也是最长的一段（`_move` 不论距离都花固定步数，所以架子越远走得越快，不是走得越久）。
  # 2026-09-09 实测：架子挪到门的两侧之后，seed 4（架心离底座 0.558 m，侧镜像轴的远角）
  # 在 30 步下手还在水平收敛就下到了板高，指尖从板顶边缘扫过，把板沿 y 推了 10 mm——
  # 超过架子夹爪 3 mm 的余隙，于是合爪夹了个空（finger_qpos −0.0010），只剩 attachment 把板拎起来。
  # 每步位移减半立刻就好（finger_qpos 0.0075、plate_yaw 0.04°，全场最健康的一组读数）。
  # 取 60 而不是把 steps_per_phase 整个调大：其余四步要么很短、要么板已被 attachment 刚性握住，
  # 一起放慢会让 t_ready 白涨 1.5 s。
  # 代价照实记：t_ready 2.40 → 2.70 s，两条可解性判据与 hover_wait 都跟着重算（本文件不写死这些数，
  # 它们由 motion.* 的步数现算）。
  approach_steps: 60
  gripper_steps: 30
  # 插入放慢：单步位移越小，卡住时的冲击越小。这个步数也直接决定 insert_duration，
  # 而触发规则拿它当截止时间用。
  insert_steps: 100
  close_hold_steps: 30
  insert_settle_steps: 30
  release_hold_steps: 60
  finger_links: [left_finger, right_finger]
  finger_friction: 2.0
  # 板厚 12mm，每指 0.005 = 总过盈 2mm。
  grasp_qpos: 0.005
  min_lift_delta: 0.010
  # 合爪后指位的下限。assisted carry 下 lift_delta 证明不了任何事，指行程才是
  # 「夹到板」与「夹了个空」的分界。板厚 12mm 每指应被挡在 0.006，合爪指令 0.005；
  # 2026-09-03 角点实测：夹到板 0.0063–0.0075，空夹（板已被撞离）0.0018 / −0.0010。
  # 0.004 在两者之间；空夹时 attachment 照样把板拎起来，只有这一项能判出来。
  min_finger_qpos: 0.004
  # 板宽 126mm，偏摆 θ 会让两端各扫 63*sin(θ)，槽内单边只有 3mm 余量 -> 2.7° 就吃光。
  max_plate_yaw_deg: 2.0
  # 悬停等待的步数上限。超过即判 trigger_never_fired，不会无限等下去。
  # 2026-09-08：900 → 1300。入口段加长到 55 cm、球速降到 0.050 之后，臂就位后要等的
  # 时间（hover_wait = 球到门时刻 − 臂就位时刻）最长到 8.2 s，900 步 = 9 s 只剩 0.8 s 余量。
  # 这一条现在由 checks() 的 hover_within_cap 行守着，不再靠「碰巧够」。
  max_hover_steps: 1300

# ---------------------------------------------------------------- 时序常量
# 可解性判据要把球的时间量和机械臂的时间量放在一起比，而机械臂的时间量是
# motion.* 的步数乘步长。步长本来只在 env 配置（env.sim.dt），触发规则的富余本来只在
# run 配置；变体校验函数只拿得到 task 配置，所以两者在这里作为任务定义的一部分再声明
# 一次。demo 建场景时断言 timing.sim_dt == env.sim.dt，不一致直接报错。
timing:
  sim_dt: 0.01
  # 触发规则在「球回到门口的时间 − insert_duration」之上还要求的富余（秒）。
  # 它吸收的是指令下降与 IK 实际跟踪之间的差；bar_through_hole 上实测这一项到过 7.5mm。
  # 判据 A 用它。
  safety_margin: 0.15
  # 判据 B 的富余：臂就位之后最晚下板时刻至少还剩这么多秒。
  ready_margin: 0.10

# ---------------------------------------------------------------- 可达
# 门口悬停点距 Franka 底座的上限。底座位置来源同 diverter 的 reach 段
# （common_configs/manipulation_space_tabletop_v1.yaml 的 robot_setup.mount.pos）。
# 现值 center_x 0.075 时 0.645 m（4.1 的取板点实测可达）；包络上限 0.095 时 0.665。
reach:
  base_xy: [-0.570, 0.0]
  max_hover_dist: 0.700

physical:
  # 复位到 home 位之后的静置步数。机械臂在本任务里不参与球的运动，但仍然要被驱动：

  # 场景里加了 Franka 而不给关节目标，一步进就会在重力下瘫掉。
  # 这些步数里球也在滚，所以静置完成后球会被放回释放点（episode 复位，不是运行中传送）。
  settle_steps: 40

success:
  # 判定用的自由空间栅格分辨率（米）。球心做 flood-fill，能触达场地边界即未困住。
  grid_pitch: 0.008
  # 释放后继续步进这么多步做物理复核。
  settle_steps: 120

# ------------------------------------------------------------------ 指令
# 常量句：本任务没有防捷径离散轴，隐藏的信息是时机（球速与起点逐 seed 变），
# 时机在画面里，不在语言里。
goal:
  instruction: "Slide the gate into its slot to trap the ball inside the cage."

# ---------------------------------------------------------------- 变体
# 逐 episode 随机的轴（generation/layout_randomization.py 读这一段）。
# 每条 uniform 各有自己的区间；区间依赖其他轴的量（封闭区长度依赖球速、球起点依赖窗口、
# 架子 x 依赖轨道 x）抽归一化位置再由 derived 派生，构造式满足两条可解性判据，不靠拒绝。
# 没有防捷径离散轴：时机本身就是隐藏信息——球速与起点逐 seed 变后，「到位就插」（greedy）
# 与「等固定秒数再插」（fixed_delay）两条对照规则的成功率落到中间水平。
variation:
  # 防捷径镜像轴：敞口朝哪一端。整条槽沿 y 翻面，两端的可辨特征不变（channel.open_end 的注释）。
  - {kind: choice, path: channel.open_end, values: [0, 1]}
  # 单调裕度轴：球的大小。越大，门口「不能下板」的禁区越宽（ball.radius 的注释）。
  - {kind: choice, path: ball.radius, values: [0.024, 0.030, 0.036]}
  # 引道坡角的档位。档 0 第一趟就能拦、档 1/2 得等弹回来的第二趟（channel.slope_tier 的注释）。
  - {kind: choice, path: channel.slope_tier, values: [0, 1, 2]}
  # 布局：轨道左右平移。2026-09-10 从 [0.055, 0.095] 挪到 0 附近——base_camera 站在 x=+0.30 看向 x=0，
  # 画面中心是 x≈0；门口到底座 0.55–0.59 m（此前 0.63–0.67）。
  - {kind: uniform, path: channel.center_x, lo: -0.020, hi: 0.020}
  # 布局：停放架沿轨道方向的抖动（叠在 side 选出的那一侧上）
  - {kind: uniform, path: gate_rack.y_jitter, lo: -0.030, hi: 0.030}
  # 防捷径镜像轴：停放架在门的哪一侧（gate_rack.side 的注释）
  - {kind: choice, path: gate_rack.side, values: [0, 1]}
  # 布局：封闭区长度在 [flat_end_y_min, flat_end_y_max] 内的归一化位置。自由球不需要按球速反推下界——
  # 封闭区越长每趟停留越久、封得住的趟来得越早，20–30 cm 全都可解（09-10 离线扫过）。
  - {kind: uniform, path: channel.flat_end_frac, lo: 0.0, hi: 1.0}
  # 布局：松开点在可出生段内的归一化位置。这就是速度轴：v = √(2·a·s)。
  - {kind: uniform, path: ball.release_frac, lo: 0.0, hi: 1.0}
  # 布局：停放架 x 在允许区间内的归一化位置
  - {kind: uniform, path: gate_rack.x_frac, lo: 0.0, hi: 1.0}
  # 派生：slope_tier -> channel.entry_slope_deg + ball.spawn_min_run（最先，松开点的界依赖它），
  #       flat_end_frac -> channel.flat_end_y，release_frac -> ball.release_y，
  #       x_frac -> gate_rack.center_x，side + y_jitter -> gate_rack.center_y
  - {kind: derived, fn: "topogym.tasks_legacy.connectivity.gate_cage_ball:derive_task_cfg"}
  # 校验：checks() 十五行（可用趟的停留、离上限还有多久、上限时球还在动、出生段、架子净距与可达、
  #       approach 净空、球与槽道、镜像后的取板距离……）
  - {kind: validate, fn: "topogym.tasks_legacy.connectivity.gate_cage_ball:validate_task_cfg"}
