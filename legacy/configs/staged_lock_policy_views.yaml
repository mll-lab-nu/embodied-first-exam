defaults:
  - staged_lock_nyx
  - _self_
env:
  cameras:
    # Primary exterior: raised from the previous side_oblique view.
    agentview:
      res: [1280, 720]
      pos: [-0.68, -1.06, 2.02]
      lookat: [-0.10, 0.10, 1.16]
      up: [0, 0, 1]
      fov: 42
      near: 0.01
      far: 12.0
    # Complementary exterior on the goal side, offset from the insertion axis.
    front_oblique:
      res: [1280, 720]
      pos: [0.90, -0.30, 1.72]
      lookat: [-0.02, 0.10, 1.14]
      up: [0, 0, 1]
      fov: 60
      near: 0.01
      far: 12.0
    wrist:
      res: [640, 360]
      fov: 78
      attach:
        # A raised bracket clears the long key's handle at deepest insertion.
        offset_pos: [-0.110, 0.000, 0.045]
        # Fingertip plane is local z=0.1029; aim 11.7 cm beyond it.
        offset_lookat: [0.000, 0.000, 0.220]
        offset_up: [-1.0, 0.0, 0.0]
run:
  output: runs/staged_lock_task/nyx_policy_views
  record_cameras: [agentview, wrist, front_oblique]
  exterior_cameras: [agentview, front_oblique]
