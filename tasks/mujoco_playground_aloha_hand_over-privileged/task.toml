schema_version = "1.3"
artifacts = ["/app/output/", "/logs/agent/rcb/"]

[task]
name = "robot-coding-bench/mujoco_playground_aloha_hand_over-privileged"
description = "MuJoCo Playground AlohaHandOver in plain MuJoCo: ALOHA 2 bimanual; produce one replayable trajectory in which the left arm picks up the box, hands it to the right arm, and the right arm holds it at the target, frozen instance (seed 60417)."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "mujoco", "mujoco-playground", "aloha", "bimanual", "handover", "code-as-policy", "trajectory"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "mujoco"
robot = "aloha-2"
family = "mujoco_playground/AlohaHandOver"
mode = "privileged"
oracle = "full"
instance_seed = 60417             # Playground's reset randomization (box xy offset, target position) with this seed
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 1800.0
