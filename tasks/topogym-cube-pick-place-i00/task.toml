schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "topogym/topogym-cube-pick-place-i00"
description = "TopoGym cube_pick_place (panda_robotiq, Genesis): produce one replayable trajectory. Pick up the cube, hold it at least 5 cm above the table for at least 0.2 s, place it back at its original position, open the gripper, withdraw at least 5 cm and let it settle. Merely reaching or closing the gripper is not completion. Frozen scene instance (variation base, seed 0)."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "panda_robotiq", "code-as-policy", "trajectory", "cube_pick_place"]

[metadata]
author_name = "jianwen"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "topogym"             # TopoGym on Genesis 1.2.1 (CUDA physics, Nyx RGB)
robot = "panda_robotiq"
family = "cube_pick_place"
tier = "privileged"               # privileged (state-based perception) | perception (RGB-D models)
instance_seed = 0                 # scene = environment/instance.json (variation base, eval index 0); identity = dataset.toml digest
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 17100.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 5400.0             # TopoGym budget: 1.5 h of wall clock
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
