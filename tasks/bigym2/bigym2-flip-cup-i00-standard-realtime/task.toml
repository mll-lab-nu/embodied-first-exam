schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/ticks.f64", service = "sim" },
  { source = "/data/calls.jsonl", service = "sim" },
  { source = "/data/submitted.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/bigym2-flip-cup-i00-standard-realtime"
description = "STANDARD-REALTIME MODE (robot as a service on a clock that does not stop, eai-standard/2.3): BiGym 2.0 flip-cup on the same frozen instance as bigym2-flip-cup-i00-privileged. Turn the upside-down cup the right way up and gently set it back down. Time does not stop: once the episode starts, the robot runs at 50 Hz in real time and holds its last command (standing still) while the agent thinks, so the agent streams whole-body commands from a controller program of its own through the client (the robot's three onboard cameras and its proprioception). One episode, no reset, no object state, no success signal; the sim service records every executed control step and grades the episode as it ran with BiGym's own success check (the live episode; nothing is replayed)."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "bigym2", "mujoco", "unitree-g1", "humanoid", "standard-realtime-mode", "trajectory", "flip-cup"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "bigym2"
robot = "unitree-g1-dex1"
family = "flip-cup"
mode = "standard-realtime"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): scripts/task_dynamics.toml
slowdown = 1                      # standard-realtime: the world runs at 1/S of real speed (docs/protocol/README.md §4b); RCB_SLOWDOWN's default
protocol = "eai-standard/2.3"
instance_seed = 0
expert_time_estimate_hours = 3.0
oracle = "none"
oracle_evidence = "no reference solution (BiGym 2.0 ships no expert or planner; its demonstrations and its agents' programs stay off the agent's network); positive example graded 1 by the separate verifier: bigym2-flip-cup-i00-privileged__ebButi4 (run codex-gpt6_luna-medium, 2026-10-08, on an earlier text of the privileged task; regraded by its current verifier); human review in PR #123"

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 2.0
min_memory_gb = 4.0
min_gpu_memory_gb = 1.5
gpu_required = true
gpu_class = "any"
recommended_gpu = "any 8 GB+ NVIDIA GPU (RTX 4090 / L4)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 1.5
measured = "GPU 0.7-1.2 GB, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: privileged container 3.0 GB, mem_guard (docker memory per container, ws-1, 10-02..10); CPU author estimate (MuJoCo + two ONNX policies on the CPU)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 6.0
trial_max_memory_gb = 16.0
measured = "GPU: 1.2 GiB (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)) -> max(1.5 x peak, peak + 4); memory: no samples of the agent's container; floor 8 GiB (at most the 16 GiB cap); whole trial: + the sim service's 8 GiB (from the minimum: no samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 4.0, memory_gb = 16.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 10.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it: the
# live episode's verdict, nothing replayed (board 0151). The loops run on the clock, inside timeout_sec: the verdict
# ("finalized": true, set before any video is rendered) is in within seconds, or later after a crash-resume, which
# re-runs the journal (840 s at most); then the hook waits for the video, one pass over the trajectory after the verdict
# ("video_pending"), until 870 s -- a video that is not ready by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator, but BiGym 2.0's demonstrations and its agents' programs are public: the agent
# reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
