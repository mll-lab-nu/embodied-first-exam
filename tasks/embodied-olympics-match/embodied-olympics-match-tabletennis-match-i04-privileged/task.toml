schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-tabletennis-match-i04-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): table tennis, one match against the scripted opponent at level 4 on the frozen instance of embodied-olympics-match-tabletennis-match-i04-realtime (seed 34). Full simulator in development (read and change any state, reset the whole match); the deliverable is a closed-loop Python program that plays a fresh unmodified match in the verifier, on the original S = 10 clock, seeing the full state instead of camera images."
keywords = ["robotics", "mujoco", "fullsim", "policy", "tabletennis"]
[metadata]
task_type = "policy"
simulator = "mujoco"
robot = "franka-panda"
family = "tabletennis_match"
dynamics = "dynamic"
verifier_wall_clock = true
instance_seed = 34
opponent_level = 4
revision = "wallclock-15+duel-wallclock-12+low-inloop-1+core-0.2"
source_commits = ["e25d8cc11861"]
source_task = "roboolympics/tabletennis-match-wallclock-program-standard"
exporter = "Embodied Olympics full-simulator exporter"
official = false
expert_time_estimate_hours = 1.0
oracle = "partial"
oracle_evidence = "full-state reference program (solution/): the camera-only reference player's serve and stroke planner fed the true ball state (the earlier table-tennis twins' smoke controller); a local Harbor oracle run lost 4:6 (valid, replay identical); the nop (no program) scores 0"
validated = false

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 10240
[verifier]
timeout_sec = 10000.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
