# cloth_fold_inspect_demo 的运行模式参数。

defaults:
  - default
  - _self_

# 从多高把布放下来（米）。null = 用 task 配置里的值。
#
# 任务本身把布生成在静止高度（0.002，一个粒子半径），落下去也几乎不动 ——
# 而**录制是每一步抓一帧，静止场景录出来是一串一模一样的画面**。
# 从 0.08 放手能看到布飘落、触桌、铺开的全过程，而**布怎么垂、怎么起褶，
# 正是区分「布」和「橡皮泥」最直接的画面**：布会波动、落定后有细褶；
# 橡皮泥整块砸下去、平平地摊着。
# 这属于查看方式而非场景定义，所以在这里而不在 task 配置里。
drop_from: 0.08

# 落定之后再空跑多少步，让视频结尾是一段稳定画面而不是刚好卡在半空。
hold_steps: 90

# 把布直接摆成「折完之后应该是什么样」——不是仿真出来的，是判据用的解析目标位置
# （折线那边的点不动，另一边镜像过去、抬高一个布厚）。用来肉眼确认目标本身合理。
show_target: false
