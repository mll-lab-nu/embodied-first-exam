experiment: harbor_smoke_scripted
attempts: 1
concurrency: 1
timeout_sec: 1800
usage: {mode: "off"}
instances:
  - name: cube-transfer-pipeline-seed0
    fixture: cube_transfer
    evaluation: pipeline_smoke
    mode: limited
    instruction: >-
      This is a pipeline smoke test, not a cube puzzle score. Read the initial RGB,
      execute a short EE_DELTA segment moving the TCP up slightly, inspect the new
      recordings, then execute a second short segment moving it down. View the final
      PNGs and stop. Keep movements small (roughly 2 mm total each way).
    simulator:
      task_id: cube_transfer
      robot_id: panda_robotiq
      variation_id: base
      seed: 0
      control_mode: EE_DELTA
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.025
      solver_substeps: 40
      control_decimation: 1
      max_physics_steps: 1000
