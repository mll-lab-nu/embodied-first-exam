# cable_routing_physical_handle_demo 的运行模式参数。
#
# 物理与场景参数用点路径覆盖，不在这里：
#   task.rope.model=fem_ipc_tube
#   task.rope.fem.E=200000.0   task.rope.fem.nu=0.3   task.rope.fem.friction_mu=0.4
#   task.rope.fem.rest_shape=straight
#   task.rope.fem.sanity_check_enable=false
#   task.physical_handle.grasp_yaw=1.57
#   env.genesis.logging_level=warning

defaults:
  - default
  - _self_

# 结束后立刻关窗。统一由 keep_open 表达，这一项作为兼容保留。
close_on_finish: false

# 只走路线的前 N 个路点，用于抓取环节的快速验证。null = 走完整条。
# 只有走完整条时才装终点插座的 latch，也才做路线签名判定。
max_waypoints: null

# 开场静置步数。
settle_steps: 60

# 松手后再跑这么多步，并打印 RELEASE_PROBE（释放后横截面的累计自转角）。
# 用途见 docstring：区分线圈来自储存的扭转还是静止构型/弯曲刚度。0 = 不跑。
release_end_steps: 0

# 手跟不上规划点时不中止（跟随误差与绳接触的安全判定仍然生效）。
allow_target_lag: false

# 低分辨率绳：把网格与求解迭代降一档，用于快速看路线是否正确。
# 具体数值在 task 配置的 rope.lite 块里，不写在 Python 里。
lite: false

# 每 N 步采一次诊断量并打印 PROBE 行：手的实际速度、绳的最低粒子相对桌面、
# 绳的展开度与单步跳变、P2 处缠绕的互嵌深度。
probe: false
probe_every: 15

# 运动步数的缩放。两者都按 1.0 时是正常物理。
# viewer_speedup > 1：步数除以它，看得快，物理会变粗。
# slow_factor > 1：步数乘以它，看得慢，用于诊断绳的动态。
viewer_speedup: 1.0
slow_factor: 1.0

# --- 数据生成相关（本轮不重新设计，原样保留）-----------------------------
randomize_layout: false
difficulty: default
variant_id: default
# 录制 H5 数据集到该路径。null = 不录。
record_dataset: null
dataset_every_n_steps: 10
