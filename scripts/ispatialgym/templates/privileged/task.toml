schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/$name"
description = "PRIVILEGED MODE: iSpatialGym $task (upstream subtask $subtask, instance 0). The goal is an image: make the scene look like /app/goal.png, the head camera's view once the task is done. The simulator runs in the agent's container from the frozen start, every object's state readable and resets unlimited, but nothing there holds the goal, a target or a success check; the deliverable is one trajectory, which a separate verifier with the goal replays twice in fresh processes and grades."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "ispatialgym", "spatial-intelligence", "goal-image", "omnigibson", "isaac-sim", "r1pro", "privileged-mode", "trajectory", "$family_kw"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "ispatialgym"
robot = "r1pro"
family = "$task"
mode = "privileged"                # the simulator in the agent's container; the goal and the success check only in the verifier
dynamics = "static"               # objects move only by the robot or gravity (docs/benchmarks/ispatialgym.md)
oracle = "none"
oracle_evidence = "upstream's goal image of this instance is the last frame of a successful replay of upstream's own demonstration of it (kmy17518/ispatialgym-eval-data@15cb9a7, ispatialgym-eval-instances/README.md, Goal images)"
instance_seed = 0
expert_time_estimate_hours = $expert_hours

[verifier]
timeout_sec = $verifier_s               # two fresh-process replays (a scene load + at most $max_steps steps each) with margin
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = [$allowed_hosts]

[environment]
build_timeout_sec = 3600.0
cpus = 12
memory_mb = 40960
