# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: orbits_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: orbits-hard-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Free the complete cord and wooden handle from the fixed ring-and-post
      assembly. Place the entire cord and handle inside the green dashed goal area
      and hold them still briefly. Keep the rings, posts and other fixed components
      outside the area on the puzzle/system side. Holding the target is allowed;
      placing only the handle in the area is not completion.
    simulator:
      task_id: orbits
      robot_id: auto
      variation_id: hard
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
