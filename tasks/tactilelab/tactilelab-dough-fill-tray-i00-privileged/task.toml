schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/tactilelab-dough-fill-tray-i00-privileged"
description = "TactileLab dough_fill_tray (dual-arm X-Trainer whose right gripper carries two GelSight Mini tactile sensors, Isaac Lab 2.3 / Isaac Sim 5.1, PhysX on the GPU): produce one replayable trajectory. Pick the scraper from its rack and spread the dough heap evenly over the tray. Frozen scene instance (the fixed nominal scene, seed 0)."
keywords = ["robotics", "tactilelab", "isaac-lab", "isaac-sim", "x-trainer", "tactile", "gelsight-mini", "code-as-policy", "trajectory", "dough_fill_tray"]

[metadata]
task_type = "trajectory"
simulator = "tactilelab"
robot = "xtrainer-gsmini"
family = "dough_fill_tray"
dynamics = "static"
oracle = "full"
oracle_evidence = "solution/: the scripted demonstration policy of this task, recorded through the Session; graded 1 by one fresh-process replay (this task's grading kind: the dough's MPM is not bit-exact) on an L40S (verifier, 2026-10-29); nop graded 0."
instance_seed = 0
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 8189.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# no process the agent left behind keeps running (or holds the GPU) once its time is up
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 14336
storage_mb = 10240
gpu_types = ["L40S", "L40", "RTX 6000 Ada"]

[verifier.environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 20480
storage_mb = 20480

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
