# Standard-realtime mode (PROTOCOL §4b): the simulator runs in the `sim` sidecar (the agent cannot open it), on its own clock once an
# episode starts (sim/rcb_realtime.py); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# GPU on sim: MuJoCo physics is CPU either way, but every image the agent asks for is rendered here, and EGL on the
# GPU takes ~0.5 ms a frame against ~130 ms for CPU osmesa. `graphics` is the capability that mounts the EGL ICD.
services:
  main:
    depends_on: [sim]
  sim:
    image: {{image}}
    volumes:
      - ./sim:/srv:ro
    command: python /srv/rcb_realtime.py
    restart: on-failure:6                               # a crash resumes the same episode, paused, never a reset
    environment:
      RCB_TASK: {{family}}
      RCB_INSTANCE: /srv/instance.npz
      RCB_TASK_TEXT: {{standard_task_text}}
      RCB_EPISODE: {{standard_episode_text}}
      RCB_WALL_CLOCK_S: "{{agent_timeout}}"
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the standard
      # configuration; results under other settings are reported separately.
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-1}"                # 1: real time (official); S: one step every S x control_dt s, reported apart
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-{{reset_budget}}}"       # HumanoidBench's: {{reset_budget}} resets (PROTOCOL §4.5 exception; the mode's default is 0); 0: one episode
      RCB_OBS_PROPRIO: "${RCB_OBS_PROPRIO:-1}"          # 1: + joint angles/velocities; 0: images only
      RCB_OBS_IMU: "${RCB_OBS_IMU:-1}"                  # 1: + pelvis IMU (angular velocity, gravity direction)
      RCB_OBS_ROOM_CAMERA: "${RCB_OBS_ROOM_CAMERA:-1}"  # 1: + room_camera, fixed in the room
      RCB_OBS_DEPTH: "${RCB_OBS_DEPTH:-0}"              # 1: + depth (m) from both head cameras, as from the H1's head RGB-D camera
{{room_camera_pose_line}}{{image_hw_line}}      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
