schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/episode.json", service = "sim" },             # the live result the service dumped at the episode end
  { source = "/data/server.log", service = "sim" },               # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },              # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },           # crash recovery: one line per service start
  { source = "/data/startup_binding.json", service = "sim" },
  { source = "/data/replay.verdict.json", service = "sim" },
  { source = "/data/replay.frame_map.jsonl", service = "sim" },
  { source = "/data/replay.recording_manifest.json", service = "sim" },
  { source = "/data/replay.json", service = "sim" },              # the collect hook's fresh-process replay
  { source = "/data/replay.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robotangle-lock-picking-easy-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.4): RoboTangle lock_picking on the same frozen instance as the privileged task. Insert the tabbed key through all three rotor plates and the final END plate, while respecting their slots and stops. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "panda_robotiq", "standard-mode", "trajectory", "lock_picking"]

[metadata]
author_name = "Jianwen Lyu"
task_type = "trajectory"
simulator = "robotangle"
robot = "franka-robotiq-2f85"
family = "lock_picking"
mode = "standard"                  # RGB + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.4"
oracle = "full"
difficulty = "easy"
grasp = "assisted (the contact_weld_v1 grasp regions on lock_key)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision terminal_v4_bore_contact_default_success)"
tooling_version = "19"
instance_seed = 0
expert_time_estimate_hours = 3

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 7.0
min_gpu_memory_gb = 7.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / RTX 4090 24GB / L4 24GB (sm_86 or newer)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 6.0
verifier_min_gpu_memory_gb = 7.0
measured = "GPU 5.9 GB on L4, 10.3 GB on L40S, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: sim p90 4.0 GB, privileged container 4.6 GB, verifier p90 3.9 GB, mem_guard (docker memory per container, ws-1, 10-02..10); CPU author estimate"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, one fresh-process replay with the video, write final.json
timeout_sec = 27000              # the end (a resume replay included) <= 1 h, the replay <= the agent's budget

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
