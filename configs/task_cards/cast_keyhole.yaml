physics:
  backend: genesis_1.2.1_rigid
  qualification: unqualified
  local_probe_status: contact_suite_and_full_route_force_bench_passed
  profile_policy: fixed per probe; save actual solver settings with results
  grasp_model: explicit assisted grasp only after contact, when applicable
initialization:
  description: Authored perpendicular lower-bore interlock, both long axes along the table; not the factory pose. Free bodies with 0.5 mm floor clearance. This relative initial pose has a certified extraction; official panel correspondence and measured dimensions remain unverified.
robot:
  family: Panda + Robotiq 2F-85
  current_role: stationary bootstrap scale reference
  planned_manipulation_family: ALOHA dual ViperX300
  planned_arm_count: 2
  planned_camera_views: [cam_high, cam_low, cam_left_wrist, cam_right_wrist]
  selection_reason: Each plate needs independent support; a single arm requires a fixture and additional regrasp clearance.
  arms:
  - 1
  - 2
  dual_arm_qualified: true
  dual_arm_qualification_scope: one complete pregrasp execution with simultaneous-contact-gated assisted welds; end separated and held, no pickup/release or friction-only qualification
  dual_arm_ik_qualified: true
  dual_arm_ik_scope: pregrasp complete trajectory, sampled robot and interpolated-joint collision checks
  local_probe_fixture_allowed: true
rejection_rules:
- Claiming the photo-derived prototype is measured or reproduces the official factory-start trajectory
- Slot closed by convexification
- Treating camera motion or separate-part display resets as disassembly
first_probe: Inspect the reconstructed fork and closed stepped bore; free settling, then measured turn clearances and official route
evidence:
  contact_suite: runs/environment-solvability/cast_keyhole/diagram_reference_v1/contact_qualification.json
  partial_route: runs/environment-solvability/cast_keyhole/diagram_reference_v1/route_probe/report.json
  full_route_candidate: runs/environment-solvability/cast_keyhole/diagram_reference_v1/full_route_candidate/certificate.json
  historical_top_candidate_unresolved_stage: transfer_to_penultimate_notch
