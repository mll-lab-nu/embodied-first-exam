# cloth_unpleat_physical_demo 的主配置。
#
# env 用 world_tabletop_v1：布走 PBD，不是 FEM+IPC。判据的门槛也是在这组 sim
# 参数（dt=0.01 / substeps=4）下标定的，换一组就不成立。

defaults:
  - config
  - override task_configs@task: cloth_unpleat_topogym_tabletop_v1
  - override env_configs@env: world_tabletop_v1
  - override run_configs@run: cloth_unpleat
  - _self_
