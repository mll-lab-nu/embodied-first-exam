# tests/ring_transfer_spike.py 的主配置。
#
# 场景取任务本身的配置（task_configs/ring_transfer_topogym_tabletop_v1），spike 与
# 之后的 demo 只在 run 层不同；env 用 world_tabletop_fem_v1（FEM+IPC 预设：
# substeps=4，IPC 侧由 genesis_ipc_vertex_constraints 的补丁按 substep_dt 前进）。
# 材料与接触参数扫参走 task.rope.fem.* 点路径，例如 task.rope.fem.friction_mu=0.6。

defaults:
  - config
  - override task_configs@task: ring_transfer_topogym_tabletop_v1
  - override env_configs@env: world_tabletop_fem_v1
  - override run_configs@run: ring_transfer_spike
  - _self_
