schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/baseball-batting-wallclock-program-standard"
description = "PROGRAM PLAY, parameterized: the pitcher level (RCB_LEVEL 1-4), slowdown (RCB_SLOWDOWN) and instance seed (RCB_SEED) are chosen at run time; the verifier reports them and whether they form an official configuration. The agent may write an autonomous batting program that observes the cameras and swings without a new model response per pitch, and may watch, stop, fix and restart it at any time (also during a pitch) and during the frozen review after every pitch. One act in flight at a time. WALL-CLOCK REAL TIME in a slowed world: robot baseball batting, 5 plate appearances against a scripted pitcher (MuJoCo scene, a 4-parameter kinematic swing rig with a 0.84 m / 0.9 kg bat; published ball model with drag and Magnus lift, bat-ball impulse model). Observation: 2 cameras x 4 frames, no ball coordinates. Success: at least 4 bases (walk/single 1, double 2, home run 4) in a valid game, with deterministic replay and no simulator, model-API or metering failure."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "robotics", "mujoco", "baseball", "batting", "interactive", "real-time", "wall-clock", "vision", "spatial-reasoning", "physics"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded game itself
simulator = "mujoco"
robot = "swing-rig"
family = "baseball_batting"
mode = "standard"
protocol = "eai-standard-realtime/1.0"           # real-time extension of standard mode
oracle = "full"
oracle_evidence = "solution/: a scripted camera-only batter; checked valid at L1-L4 and x1-x20; passes the 4-base line at x2-x20 (5 home runs typical), at x1 its observations arrive too late to swing"
revision = "wallclock-3-program-v2-param"
parameters = "RCB_LEVEL (1-4, default 1), RCB_SLOWDOWN (default 20), RCB_SEED (default 301)"
expert_time_estimate_hours = 0.75

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 600); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then for j in $(seq 1 300); do grep -q '\"video\": \"pending\"' /data/final.json || break; sleep 1; done; head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 1000

[agent]
timeout_sec = 7200.0           # preparation, then the game at the slowest official configuration (x20)

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
