# README data for tasks/robocasa-gr1/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   upstream  robocasa/robocasa-gr1-tabletop-tasks @ 4840e67 and robosuite @ 51cc017 (the commits that
#             images/robocasa-gr1/Dockerfile pins): robocasa/environments/tabletop/{tabletop_24dc,
#             tabletop_cabinet_pnp,tabletop_drawer_pnp,tabletop_microwave_pnp}.py `_check_success` and
#             robocasa/utils/object_utils.py (OU) helpers;
#             fixtures in robocasa/models/fixtures/{cabinets,microwave}.py; robosuite @ 51cc017 (base.py check_contact
#             L634-646; robots/fixed_base_robot.py L118: eef_site_id = the gripper's grip_site). Line numbers
#             below are those of the pinned upstream files.
#   ours      embodied_first_exam/benchmarks/robocasa/ (published as robocasa-files-0.7.0, images/robocasa-files/
#             FILES.json, same SHA-256): privileged/environment/casa_tool.py, privileged/tests/grade.py,
#             sim/server_casa.py, standard/tests/grade.py.
#   instances environment/instance.npz of each task: config (no horizon set; Tabletop default ignore_done=True,
#             tabletop.py L279-280, so robosuite never ends an episode), ep_meta fixture_refs counter =
#             table_main_group, the object names (the distractor_obj body exists in exactly the 9 families whose
#             posttrain distractor config lists "distractor_obj", tabletop_24dc.py L891-930, used at L968-976),
#             and the spawn geoms of the tiered containers.
# Every upstream check used here is a pure function of the state (no timers, no latches), so the verdict is the one
# state's.

[benchmark]
name = "RoboCasa-GR1"
citation = "NVIDIA et al., 2025"     # upstream README "Citation": GR00T N1, arXiv:2503.14734; built on RoboCasa
url = "https://github.com/robocasa/robocasa-gr1-tabletop-tasks"
repo = "robocasa/robocasa-gr1-tabletop-tasks"
commit = "4840e67"

[license]
text = """
The scenes, task definitions and success checks are those of RoboCasa's GR1 tabletop tasks
([robocasa/robocasa-gr1-tabletop-tasks](https://github.com/robocasa/robocasa-gr1-tabletop-tasks) @ `4840e67`, MIT
License, copyright 2025 the NVIDIA GEAR group; paper: NVIDIA et al., 2025, "GR00T N1: An Open Foundation Model for
Generalist Humanoid Robots", arXiv:2503.14734), built on robosuite
([ARISE-Initiative/robosuite](https://github.com/ARISE-Initiative/robosuite) @ `51cc017`, MIT License). Assets are
downloaded when the image is built and are not in this repository: RoboCasa's fixture, texture and object archives
(CC BY 4.0) and NVIDIA's
[PhysicalAI-DigitalCousin-Assets](https://huggingface.co/datasets/nvidia/PhysicalAI-DigitalCousin-Assets)
(`lightwheel` and `sketchfab` object meshes), licensed **CC BY-NC 4.0: non-commercial use only**.
"""

[robots]
fourier-gr1 = "Fourier GR1 humanoid (two arms, waist and two six-command dexterous Fourier hands; fixed base)"

# privileged/tests/grade.py main L57-121: missing file -> missing_trajectory; check_file L46-54 (casa_tool.load_npz
# L237-249: <= 8 MB, .npy members only, <= 64 members, no pickle; ndim 2, 1 <= T <= MAX_STEPS = 3000 (casa_tool L78),
# finite) and the child's as_actions(actions, 24) (casa_tool L782-790; exit 2) -> invalid_trajectory; replay
# L27-38 in a fresh subprocess (L92-99): Session(/tests/instance.npz) (load_instance hash check), Session.replay
# L643-655 = reset (one _check_success, initial_success L581-582), then step() per row (clip to limits L593,
# _check_success twice L595-596); success = not initial_success and success after the last row (L106); a failed
# replay -> grader_error, 0.
[modes.privileged]
success = """
The graded file is `/app/output/trajectory.npz`: an `actions` array of shape (T, 24) with 1 ≤ T ≤ 3000, one row per
control step (1/20 s); values outside the channel limits are clipped. The verifier, in a separate sandbox without
network, replays it once, open-loop, in a fresh process from its own copy of the frozen start, and checks the
conditions above once, with the environment's own `_check_success`, on the state after the last row. Meeting them
earlier in the replay does not count, no step is simulated after the last row, and a scene that already met them at
the start would not count either.

A missing file scores 0, and so does an invalid one: not a plain `.npz` of at most 8 MB holding only arrays (at most
64), no `actions` array, a shape other than (T, 24), a NaN or infinite value, or T outside 1 to 3000. A replay that
does not run to its end (a simulator error, or a frozen instance that fails its hash check) scores 0.
"""

# environment/docker-compose.yaml: RCB_AGENT_END "1", no RCB_MAX_CONTROL_STEPS / RCB_STEP_LIMIT (server_casa.py L67:
# no cap), restart on-failure:6. sim/server_casa.py: /finish -> finish("finished") L1203-1207; collect hook SIGUSR1 ->
# finish("timeout") L1235-1239; an exception while executing -> finish("error") L1225-1231; no reset endpoint; the
# success is only recorded, never shown (_hidden_success L101-107). finalize L1045-1094: success = S.check() on the
# live state after the last executed control step AND not initial_success AND reason != "error" AND reason in
# END_STATE_REASONS (L1071-1072). _start_mismatch L1246-1262 (RCB_INSTANCE_SHA, RCB_START_SHA, solved at start) ->
# _give_up(instance_mismatch, infra) L1283; _resume_or_start L1265-1311: more than MAX_RESUMES = 2 (L156) crashes ->
# sim_crashed_on_call (all in calls: the agent's 0) or sim_crashed (infra); resume_failed (infra).
# standard/tests/grade.py L59-63: success = graded_by live AND success AND live_success AND not infra AND reason !=
# "error"; infra = infra_error OR finalize_error OR not finalized; no final.json -> infra_error.
[modes.standard]
success = """
Graded is the one live episode in the simulator service: no reset, no step limit, nothing replayed. It ends when the
agent sends `POST /finish` or when its session ends (at the latest after {timeout}); the conditions above are then
checked once, with the environment's own `_check_success`, on the state after the last executed control step. A
success earlier in the episode neither ends it nor counts, and the service never reports success while the episode
runs. Control steps run by hold chunks belong to the episode like any others.

An episode ended by a simulator error during an agent's call scores 0, as do more than two service crashes that all
happened while serving the agent's calls. Before the agent is served, the scene is checked to start at the frozen
instance (instance and start-state hashes, not already solved). A mismatch there, a crash the episode cannot be
resumed from, or a missing verdict is an infrastructure error, not a score.
"""

