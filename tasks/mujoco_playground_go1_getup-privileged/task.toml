# Generated by scripts/mujoco-playground/generate.py -- edit the template or the instance, not this.
schema_version = "1.3"
artifacts = ["/app/output/", "/logs/agent/rcb/"]

[task]
name = "robot-coding-bench/mujoco_playground_go1_getup-privileged"
description = "MuJoCo Playground Go1Getup in plain MuJoCo (Unitree Go1, joint position control every 0.02 s): The Unitree Go1 has fallen over. Make it get up and stand upright at its standing height. Produce one replayable trajectory of joint position targets on a frozen instance (Playground's reset with seed 5); graded by an upright stance held for the trajectory's last 0.5 s (two fresh-process replays)."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "mujoco", "mujoco-playground", "unitree-go1", "quadruped", "locomotion", "getup", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "mujoco"
robot = "unitree-go1"
family = "mujoco_playground/Go1Getup"
mode = "privileged"
oracle = "full"
instance_seed = 5             # the PRNGKey of Playground's reset (and, for the joystick tasks, its command process)
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# MuJoCo Playground's trained policies are public upstream, so the agent reaches the model APIs and nothing else
# (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
