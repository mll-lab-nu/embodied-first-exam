schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/episode.json", service = "sim" },             # the live result the service dumped at the episode end
  { source = "/data/server.log", service = "sim" },               # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },              # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },           # crash recovery: one line per service start
  { source = "/data/startup_binding.json", service = "sim" },
  { source = "/data/replay.verdict.json", service = "sim" },
  { source = "/data/replay.frame_map.jsonl", service = "sim" },
  { source = "/data/replay.recording_manifest.json", service = "sim" },
  { source = "/data/replay.json", service = "sim" },              # the collect hook's fresh-process replay
  { source = "/data/replay.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robotangle-interlocked-claws-very-easy-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.4): RoboTangle interlocked_claws on the same frozen instance as the privileged task. Separate and place the entire brown claw piece inside the green dashed goal region. Keep the other claw piece on the puzzle/system side. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "aloha", "standard-mode", "trajectory", "interlocked_claws"]

[metadata]
author_name = "Jianwen Lyu"
task_type = "trajectory"
simulator = "robotangle"
robot = "aloha-2"
family = "interlocked_claws"
mode = "standard"                  # RGB + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.4"
oracle = "full"
difficulty = "very_easy"
grasp = "assisted (the contact_weld_v1 pre-weld: the grippers start closed on piece_0, piece_1)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision placement_region_v3_grasp_contact_2mm)"
tooling_version = "19"
instance_seed = 0
expert_time_estimate_hours = 3

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, one fresh-process replay with the video, write final.json
timeout_sec = 27000              # the end (a resume replay included) <= 1 h, the replay <= the agent's budget

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
