schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-hurdles-freestanding-i00-privileged"
description = "Embodied Olympics hurdles-freestanding (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Run the 50 m hurdles over four free-standing hurdles: go over each one in your lane, never beside it, under its top, or after pushing it away, leave at least one of them standing, and bring your torso to the finish line. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "hurdles-freestanding"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "hurdles_freestanding"
category = "track-and-jumps"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 12.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: rule (stricter than TR 22.6 in one way): leg knocks stay legal, but at least one hurdle must be cleared cleanly; the attempt fails the moment the last standing hurdle leaves its standing pose (a top-bar point more than 0.10 m from where it stood). Positive by injection: the H1-2 given 2.0 m/s forward and 5.5 m/s up over each free-standing 1.067 m hurdle, nothing touched, a real walk to the line; and three hurdles knocked down legally by a trailing leg in the air with the fourth cleared cleanly succeeds (hurdles_clean 1). Negatives: all four knocked down legally fails at the fourth knock; the archived success that knocked all four over with its thighs, replayed on the core it ran on, succeeds under the old module and fails under this one at the fourth knock (t = 86.75 s); knocked with a hand (walking into one), standing on its top bar (climbing), shoved along the track or out of the lane by a foot, moved by something else, knocked in the air then a foot under the bar, a leg swung over from the ground, feet under the bar, beside it, a leg beside it, left the lane, down; nop fails on time with the hurdles still for 140 s; determinism by state hash. Hurdle statics in physics: toppling force 3.81 kgf (3.6 stands, 4.0 falls). Feasibility on the H2-class motor core (hips and knees 360 N m braking peak, ankle 67 / 40 N m), the robot's own motors, a searched standing take-off checked against the real colliding hurdle: an upright clean flight (no touch until touchdown) clears up to 0.914 m (search limit 0.90-0.93 m) but the robot then falls; the best clean clearance with a standing landing found is 0.553 m, below every official height (0.686 m the lowest), so the 1.067 m men's height is kept.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
