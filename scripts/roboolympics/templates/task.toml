# RoboOlympics {{title}} against the scripted opponent, standard-realtime mode (docs/PROTOCOL.md §4b, docs/benchmarks/roboolympics.md).
# Generated by scripts/roboolympics/gen_tasks.py from tasks.toml, sports.toml and templates/ -- edit those, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/match.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/commands.jsonl", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/ticks.f64", service = "sim" },
  { source = "/data/calls.jsonl", service = "sim" },
  { source = "/data/submitted.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{name}}"
description = "STANDARD-REALTIME MODE (robot as a service on a clock that does not stop, eai-standard/2.3): RoboOlympics {{title_lower}}, one match against a scripted opponent (level {{level}}, frozen seed {{seed}}). The world runs at 1/{{slowdown}} of real speed (S = {{slowdown}}, the benchmark's official slowdown) and never waits: the agent sees only camera images and its own robot through the client, and drives the robot with the sport's commands ({{action_list}}) from a program of its own. Between {{unit}}s a break of {{break_s}} s of game time ({{break_wall_s}} s of wall time) in which the clock runs on and nothing plays; no reset, no privileged state. The sim service records every command at the step it took effect, replays the match in a fresh process and grades it: success = a finished match that the agent won."
authors = [{ name = "RoboOlympics (CHIGUI0)" }]
keywords = ["robotics", "roboolympics", "sports", "{{sport}}", "mujoco", "standard-realtime-mode", "vision", "real-time"]

[metadata]
author_name = "RoboOlympics"
task_type = "trajectory"
simulator = "mujoco"
robot = "{{robot}}"
family = "{{family}}"
mode = "standard-realtime"
protocol = "eai-standard/2.3"
instance_seed = {{seed}}
opponent_level = {{level}}
slowdown = {{slowdown}}
revision = "{{revision}}"
play = "program"
action_level = "{{action_level}}"
source_task = "roboolympics/{{source}}"
expert_time_estimate_hours = 0.5
oracle = "full"
oracle_evidence = "solution/: the sport's RoboOlympics reference player (camera images, proprio and /spec only) through the agent's client; it wins this instance (PR #{{review_pr}})"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container (a program would keep playing).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the match ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which replays and grades it.
# The loops run on the clock, inside timeout_sec: the verdict ("finalized": true, set before any video is rendered) may
# take until 840 s; then the hook waits for the replay video ("video_pending") until 870 s -- a video that is not ready
# by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = {{agent_timeout_sec}}
# The agent reaches the model APIs and the sim (localhost:8000, Harbor's egress control) and nothing else.
network_mode = "allowlist"
allowed_hosts = {{allowed_hosts}}

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096

[verifier.environment]
build_timeout_sec = 600.0
