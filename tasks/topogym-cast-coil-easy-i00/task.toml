schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/topogym-cast-coil-easy-i00"
description = "TopoGym cast_coil (aloha, Genesis): produce one replayable trajectory. Assemble the gold and silver Cast Coil pieces into their matching interlocking configuration, then release both. Frozen scene instance (variation cast_coil_easy, seed 0)."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "aloha", "code-as-policy", "trajectory", "cast_coil"]

[metadata]
author_name = "jianwen"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "topogym"             # TopoGym on Genesis 1.2.1 (CUDA physics, Nyx RGB)
robot = "aloha"
family = "cast_coil"
tier = "privileged"               # privileged (state-based perception) | perception (RGB-D models)
difficulty = "easy"               # the variation's tier (docs/rcb/TAXONOMY.md)
grasp = "assisted (his contact_weld_v1 grasp regions on coil_gold, coil_silver)"
success_rule = "his default success (goal_complete True; terminal revision release_settling_v2_grasp_contact_2mm)"
instance_seed = 0                 # scene = environment/instance.json (variation cast_coil_easy, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 65700.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
