# RoboOlympics tasks exported by RoboOlympics' own exporter (CHIGUI0/roboolympics tools/export_fexam.py; private, MIT):
# its simulator service runs unchanged inside each task (PROTOCOL §4c; docs/benchmarks/roboolympics.md, "Tasks exported
# by RoboOlympics"). They are not rendered by gen_tasks.py, which skips the directories listed here (and fails one that
# is missing); written by `python3 tools/export_fexam.py --hub <this checkout> <this checkout>/tasks` in RoboOlympics,
# then `python3 scripts/task_conventions.py` on them (seeds, resources, README; the cutoff is each task's own `[agent]
# timeout_sec`, which a re-export must keep: 7200 s, 14400 s for soccerssl-match-i00 and badminton-match-i01 / i02).
# `patched`: files this repository changed after the export (PROTOCOL §4c: sent upstream; a re-export must keep them).

# The protocol each mode of these tasks serves (PROTOCOL §4c): ci_checks/check-protocol.py accepts it for the
# directories listed below only.
[protocols]
standard-realtime = "eai-standard-realtime/1.0"   # the matches: RoboOlympics' own service and referee
standard = "skilleval-api-test/1"                 # the skill tasks (task_type = "policy"), graded offline

[[tasks]]
name = "roboolympics-badminton-actskill-i00-standard"
source_task = "roboolympics/badminton-match-wallclock-program-lowlevel-standard"
revision = "badminton-wallclock-12+duel-14+core-0.2"
source_commits = ["0d7f680cc049"]
patched = ["tests/sim/skilleval/sandbox.py", "tests/sim/skilleval/evaluate.py", "tests/sim/skilleval/probe/probe.py",
           "tests/engineer_grade.py", "tests/test.sh"]   # 2026-10-14, board 0111: the skill's processes end before the grade

