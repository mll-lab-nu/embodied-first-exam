schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/pandadyn-d06-moving-bank-relay-i00-privileged"
description = "Panda Dynamic Scenes D06 Moving bank relay (two Franka Pandas, ManiSkill 3 / SAPIEN, CPU PhysX at 1000 Hz): produce one replayable trajectory of 100 Hz joint-target actions. Task: Strike the sliding puck back with the right paddle so that it returns through the gap it came through, bounces off the moving bank board and hits the left paddle. Strike it back again so that it comes through the other gap, next to the side rail, onto the left paddle held at a new place and angle; then send it with the left paddle back out through that gap and across the goal line in front of the middle of the backstop. Frozen scene instance i00 (nominal parameters, seed 0); graded by the task's own staged success check in two fresh-process replays."
keywords = ["robotics", "pandadyn", "maniskill", "sapien", "franka-panda", "bimanual", "dynamic-manipulation", "code-as-policy", "trajectory", "privileged"]

[metadata]
task_type = "trajectory"
simulator = "maniskill"           # Panda Dynamic Scenes on ManiSkill 3.0.1 / SAPIEN 3.0.3 (CPU PhysX at 1000 Hz, enhanced determinism)
robot = "franka-panda-bimanual"
family = "d06_moving_bank_relay"
dynamics = "dynamic"              # scene dynamics (docs/protocol/tasks.md): the task's own declaration
oracle = "full"
instance_seed = 0
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 3000.0              # a fresh-process replay at tests/grade.py's limit (300 s + rows / 10: 650 s for the
                                  # longest episode, 3500 rows) and the filmed replay (twice that) + margin; measured: a replay
                                  # takes 10-80 s, a filmed one 1-4 min
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # the scene is procedural: everything is in the image

# Resources (docs/protocol/resources.md): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (docs/protocol/tasks.md)
# The agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 5
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
