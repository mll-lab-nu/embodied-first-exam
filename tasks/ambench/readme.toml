at that height passes. The first such step ends the replay as a success.
"""
success = """
At the last control step, both: the can's origin is 0 to 5 cm higher than the cabinet's top surface (at least 0, less
than 5 cm), and the can moves slower than 0.1 m/s. Only the height is compared, not the horizontal position, and a can
still held at that height passes.
