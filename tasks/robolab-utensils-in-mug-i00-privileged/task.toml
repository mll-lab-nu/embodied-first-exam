schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robolab-utensils-in-mug-i00-privileged"
description = "NVIDIA RoboLab utensils_in_mug (Franka + Robotiq 2F-85, Isaac Lab 2.3 / Isaac Sim 5.1): produce one replayable trajectory. Put the fork and spoon in the ceramicmug. Frozen scene instance (the state after RoboLab's canonical seed-0 reset)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robolab", "isaac-lab", "isaac-sim", "franka", "code-as-policy", "trajectory", "utensils_in_mug"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robolab"             # NVIDIA RoboLab v0.3.1 on Isaac Lab 2.3.2 / Isaac Sim 5.1 (PhysX on the CPU, RTX rendering)
robot = "franka-robotiq-2f85"
family = "utensils_in_mug"
mode = "privileged"               # privileged state, resets and primitives through the tooling (docs/PROTOCOL.md §3)
oracle = "none"
oracle_evidence = "No reference solution: RoboLab ships no expert or planner. Positive examples graded 1 by the separate verifier: robolab-utensils-in-mug-i00__8k6TcYT (robolab-utensils-in-mug-i00-privileged, run codex-gpt6_luna-xhigh, robolab-lunacx-0925-2038, ws3; https://embodied-agent-interface-v2-internal.github.io/runs/robolab/codex-gpt6_luna-xhigh/utensils_in_mug/unlimited/). Human review per family (PROTOCOL §2.7)."
instance_seed = 0                 # scene = environment/instance.json (the full scene state after the seeded reset + its hash); identity = dataset.toml digest
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 2400.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 5400.0              # RoboLab budget, both modes (docs/benchmarks/robolab.md): every Python process pays ~2 min of Isaac Sim launch + scene build
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 24576

[environment.healthcheck]
# The agent's clock starts once the simulator is ready (docs/PROTOCOL.md §2.9). The agent starts the simulator in its own
# processes, so before Harbor sets up the agent it runs this warm-up in the agent's container: one launch of the simulator
# with the frozen instance through the task's own tooling, which pays the trial's one-time start-up (shader and kernel
# caches, the instance check) outside [agent].timeout_sec. It writes no session log, trace or output; its log, with the
# start and end times, is /logs/artifacts/rcb_warmup.log (a trial artifact).
command = '''
exec >> /logs/artifacts/rcb_warmup.log 2>&1
date -u +"%FT%T.%3NZ warm-up start"
RCB_SESSION_LOG= RCB_SESSION_LOG_KEEP= RCB_AGENT_TRACE_DIR= timeout -k 30 3300 python - <<'PY' || exit 1
import json
from rcb_robolab import Session
I = json.load(open("/app/instance.json"))
s = Session(I["task"], instance="/app/instance.json")
s.close()
PY
date -u +"%FT%T.%3NZ warm-up done"
'''
timeout_sec = 3600.0
retries = 2

[verifier.environment]
build_timeout_sec = 1800.0
