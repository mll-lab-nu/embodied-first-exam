# swap_crossing_sign_physical_pinch_demo 的运行模式参数。
#
# 继承 run_configs/default.yaml 的通用字段，再加本 demo 自己的开关。
# 判据同 default.yaml：同一份 task / env 配置配上不同的 run.*，物理结果应当相同 ——
# 因此绳子材料、网格、抓取步数不在这里，它们在 task 配置里，
# 用点路径覆盖，例如 `task.pinch.cover_overshoot=0.09`。

defaults:
  - default
  - _self_

# --- 用哪条规则决定第二步压哪根绳 ----------------------------------------
# 两者共用一个接口，构成本任务的对照对（task_taxonomy_zh.md §4 要求每个任务
# 都要有可执行的 contrast pair）：
#   oracle        第二步压**另一根** -> 符号翻转，预期成功
#   restack_same  第二步把**同一根**压回去 -> 终点构型相近但符号不变，预期失败
# restack_same 预期是「跑完整两步然后被判失败」，不是「跑不动」——它是一次测量。
oracle_mode: oracle

# --- trace ---------------------------------------------------------------
# 每步把绳的状态写进一个文本文件。null = 关闭；"auto" = 自动生成带时间戳的
# 文件名；其他字符串按路径用。
trace: null
trace_every: 1

# --- 任务控制 ------------------------------------------------------------
# 抓放次数上限。null = 用 oracle.max_moves（本任务恒为 2）。
max_moves: null

# --- 变体（2026-09-07）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进日志与 episode 元数据的变体标识（角点 sweep 覆盖成 corner_<id>）。
variant_id: default
