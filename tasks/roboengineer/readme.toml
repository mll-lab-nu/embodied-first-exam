# README data for tasks/roboengineer/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text (each task's own copy; the copies of one evaluator are byte-identical):
#   verdict    embodied_first_exam/benchmarks/roboengineer/standard/tests/grade.py verdict() (Control Transfer) and
#              .../standard/tests/variants/9e936dca4e/grade.py verdict() (Neural Landing): success = every held-out case
#              succeeded, replay_verified, scores finite in [0, 100]; final_reward = mean case score.
#   selection  environment/sim/scripts/control_transfer/trusted/session.py finalize() L243-301 (the sealed round, else
#              the latest round completed before the cutoff; each held-out case in two fresh processes, unrendered,
#              metrics + feedback + state hash must match, else infra_error); quadrotor_landing/native/service.py
#              select_submission() L36-43 and trusted/grade.py (two replays per case).
#   families   go2-*: sim/quadrupedbench/simulation.py score() L137-208, jump_metrics() L97-135, episode() L42-60,
#              rollout() L282-336 (contacts, divergence, `enabled`);
#              anycar tracking and compact laps: trusted/anycar.py score_trajectory() L182-261, rollout() L263-320;
#              anycarbench/model.py L166-181 (barriers), L285-294 (collision, body contact); control_public/anycar.py
#              DT = 0.02, HORIZON = 24; anycarbench/compact_routes.json (45 m loops, 30 s horizon);
#              anycar-drift-park: trusted/anycar_drift.py Monitor.step()/metrics() L101-193, episode_parameters()
#              L195-204; anycarbench/drift.py DEFAULT_COURSE; control_public/anycar_drift.py HORIZON = 16;
#              anycar-tight-drift-park: trusted/anycar_drift_v3.py Monitor (same lines, plus the rotation checks),
#              episode_parameters() L217-225; anycarbench/drift_v3.py DEFAULT_COURSE;
#              neuralfly-*: trusted/fly.py rollout() L94-200; control_public/fly.py DURATION = 6 * 2 pi, DT = 0.02,
#              Vehicle.step() contact L183-201;
#              landing-random-pad: quadrotor_landing/trusted/simulation.py L150-255, trusted/scoring.py SettlingTimer;
#              public/model.py (DT 0.01, HORIZON 16, SETTLE_TIME 1, PAD_RADIUS 0.45);
#              g1-terrain-walk: sim/scripts/control_transfer/components/sim2realbench/g1/deploy.py L103-203,
#              terrain.py make_spec() (12 held-out cases: flat, slope, rough, steps; 0.5 / 0.6 / 0.65 m/s).

[benchmark]
name = "roboEngineer"
citation = "Wang et al., 2026"      # Embodied First Exam (arXiv:2611.12177): roboEngineer is one of its original suites
url = "https://www.embodied-first-exam.ai/suite/roboengineer/"
repo = "mll-lab-nu/embodied-first-exam"
commit = "b2280d8"                  # the commit that added tasks/roboengineer/ to this repository

[license]
text = """
roboEngineer is an original suite of Embodied First Exam. Its components carry their own terms: AnyCar's car mechanism
([LeCAR-Lab/anycar](https://github.com/LeCAR-Lab/anycar) @ `20fc50a`, Apache License 2.0 as its README declares) and
F1DB's circuit outlines ([f1db/f1db](https://github.com/f1db/f1db) @ `7cf634e`, CC BY 4.0; `anycarbench/NOTICE`);
the Unitree G1 model and training task of [unitreerobotics/unitree_rl_mjlab](https://github.com/unitreerobotics/unitree_rl_mjlab)
@ `1425b15` (Apache License 2.0); MuJoCo Menagerie's Unitree Go2 (BSD 3-Clause, Unitree Robotics) and Skydio X2
(Apache License 2.0) models. The Neural Fly force fit is made from the flight logs of
[aerorobotics/neural-fly](https://github.com/aerorobotics/neural-fly) @ `0ed5024`, which are **for personal and
educational use only** (written permission from the authors is needed for further use); the fit is not distributed.
The Neural Landing residual is converted from the checkpoint of
[GuanyaShi/neural_lander_sim_1d](https://github.com/GuanyaShi/neural_lander_sim_1d) @ `30ab04c`, which states no
licence. The simulator is MuJoCo (Apache License 2.0).
"""

[robots]
anycar = "AnyCar 1/10-scale racing car (contact wheels, suspension, steering)"
unitree-go2 = "Unitree Go2 quadruped"
unitree-g1 = "Unitree G1 29-DoF humanoid"
intel-aero-partial = "Intel Aero quadrotor (partly calibrated) with the Neural Lander ground-effect residual"
neural-fly-partial = "Neural Fly quadrotor airframe, approximated as a symmetric X quadrotor"

# session.py finalize() (Control Transfer) / native/service.py select_submission() + finalize() (Neural Landing);
# session.py L100 / L154-156 (a round still running at the cutoff: aborted_at_cutoff, never eligible); grade.py
# verdict(): no_submission -> success 0, infra_error 0; a digest, schema or replay failure -> infra_error 1.
[modes.standard]
success = """
The evaluator grades one policy: the deployment round the agent sealed or, without a seal, the latest round that
completed before the agent's session ended (at the latest after {timeout}). A round still running at that moment is
not graded, and with no completed round the score is 0. The evaluator runs that policy on every held-out case, each in
two fresh processes without rendering; the two runs must give the same state hash, metrics and noisy observations. The
task succeeds when every held-out case succeeds. `final_reward` is the mean case score (0 to 100); it does not decide
success. A case in which the simulation diverges fails. A failure of the evaluator itself (a missing or mismatched
asset or instance, a worker crash, two runs that disagree) is an infrastructure error, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Go2: simulation.py score(): failed = any bad_contact (a non-foot geom on the floor; weave: a pole touching the robot)
# or base z < 0.12 or |roll| or |pitch| > 1.1 at any physics step (0.002 s); stable = every step of the last 1 s with
# >= 3 feet on the ground, |v| < 0.25, |omega| < 0.35, |roll|, |pitch| < 0.22; rollout() L331-335: enabled false or a
# divergence -> success False.
[families."roboengineer/go2-attitude"]
no_twin = "roboEngineer is graded on dynamics the agent is never shown; a privileged mode would expose them"
success = """
There are 10 held-out cases. Each is a 10 s episode in which the roll and pitch commands start at 1 s. A case succeeds
when, over every simulation step from 1 s on, the root-mean-square error between the body's roll and pitch and the
commanded roll and pitch is below 0.08 rad, at least three feet touch the ground in at least 95 % of those steps, and
the base ends less than 0.25 m (horizontally) from where it started. The case fails if at any step a part of the robot
other than a foot touches the ground, the base drops below 0.12 m, or the roll or pitch exceeds 1.1 rad. A policy whose
`enabled` flag is false fails every case.
"""

[families."roboengineer/go2-weave"]
no_twin = "roboEngineer is graded on dynamics the agent is never shown; a privileged mode would expose them"
success = """
There are 10 held-out cases. Each is a 20 s episode with four poles on the line y = 0, at x = 0.9, 1.9, 2.9 and 3.9 m;
the Go2 starts at the origin facing +x. The base must pass each pole's x position in order, at least 0.16 m to its left
(+y) for the first pole, to its right for the second, and so on, alternating. A crossing on the wrong side or closer
than 0.16 m does not count for that pole. At the end of the episode the base must be more than 0.35 m past the last
pole (x above 4.25 m). The case fails if at any step a pole touches the robot, a part of the robot other than a foot
touches the ground, the base drops below 0.12 m, or the roll or pitch exceeds 1.1 rad. A policy whose `enabled` flag is
false fails every case.
"""

# jump_metrics(): a flight = consecutive steps from t >= 1 s with no robot geom touching the ground; it qualifies with
# airtime >= 0.08 s and base rise >= 0.07 m; the longest qualifying flight is graded.
[families."roboengineer/go2-forward-jump"]
no_twin = "roboEngineer is graded on dynamics the agent is never shown; a privileged mode would expose them"
success = """
There are 10 held-out cases. Each is a 6 s episode with a commanded forward distance between 0.70 and 1.00 m. A flight
is a stretch after 1 s in which no part of the robot touches the ground; it counts when it lasts at least 0.08 s and the
base rises at least 0.07 m during it, and the longest such flight is graded. A case succeeds when there is such a flight,
the base moves forward by at least 70 % of the commanded distance during it, the base's forward travel from the start
is within 0.15 m of the commanded distance both at touchdown and at the end of the episode, the sideways offset at the
end is below 0.15 m, and at every step of the last second at least three feet touch the ground, the base's speed is
below 0.25 m/s, its angular speed below 0.35 rad/s and its roll and pitch below 0.22 rad. The case fails if at any step a
part of the robot other than a foot touches the ground, the base drops below 0.12 m, or the roll or pitch exceeds 1.1
rad. A policy whose `enabled` flag is false fails every case.
"""

[families."roboengineer/go2-yaw-jump"]
no_twin = "roboEngineer is graded on dynamics the agent is never shown; a privileged mode would expose them"
success = """
There are 10 held-out cases. Each is a 6 s episode with a commanded left turn between 110° and 150°. A flight is a
stretch after 1 s in which no part of the robot touches the ground; it counts when it lasts at least 0.08 s and the base
rises at least 0.07 m during it, and the longest such flight is graded. A case succeeds when there is such a flight, the
heading turns by at least 70 % of the commanded angle during it, the heading change from the start is within 0.25 rad of
the command at touchdown and within 0.18 rad at the end of the episode, the base ends less than 0.25 m (horizontally)
from where it started, and at every step of the last second at least three feet touch the ground, the base's speed is
below 0.25 m/s, its angular speed below 0.35 rad/s and its roll and pitch below 0.22 rad. The case fails if at any step a
part of the robot other than a foot touches the ground, the base drops below 0.12 m, or the roll or pitch exceeds 1.1
rad. A policy whose `enabled` flag is false fails every case.
"""

