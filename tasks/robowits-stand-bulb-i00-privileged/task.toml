schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robowits-stand-bulb-i00-privileged"
description = "RoboWits stand_bulb (bimanual Marvin, Genesis): produce one replayable trajectory. Stand the tall object with curved bottom stably within the green target area. Frozen scene instance (RoboWits evaluation scene 0 of task 16)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robowits", "genesis", "marvin-bimanual", "dual-arm", "code-as-policy", "trajectory", "stand_bulb"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robowits"            # RoboWits @ 9cc30ae on Genesis 0.4.7 (CPU physics backend, EGL rendering)
robot = "marvin-bimanual"
family = "stand_bulb"
mode = "privileged"
oracle = "none"
oracle_evidence = "No reference solution: RoboWits ships no expert or planner for its seed tasks. Solvable: model trial robowits-stand-bulb-i00__BrTmH6k (robowits-lunaxh-0925-2042, privileged) graded success=1, deterministic=1 by the separate verifier; nop scored 0. These records are from earlier versions of the task (before protocol v1.0, on the same frozen instance and predicate); not re-run on this version (static validation only, 2026-10-01). Human review per family (protocol §2.7)."
instance_seed = 0                 # scene = environment/instance.json (entry 0 of RoboWits' eval_dataset_50/16.json + expected state hash); identity = dataset.toml digest
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 5400.0             # RoboWits budget: 1.5 h of wall clock (docs/benchmarks/robowits.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[environment.healthcheck]
# The agent's clock starts once the simulator is ready (docs/PROTOCOL.md §2.9). The agent starts the simulator in its own
# processes, so before Harbor sets up the agent it runs this warm-up in the agent's container: one launch of the simulator
# with the frozen instance through the task's own tooling, which pays the trial's one-time start-up (shader and kernel
# caches, the instance check) outside [agent].timeout_sec. It writes no session log, trace or output; its log, with the
# start and end times, is /logs/artifacts/rcb_warmup.log (a trial artifact).
command = '''
exec >> /logs/artifacts/rcb_warmup.log 2>&1
date -u +"%FT%T.%3NZ warm-up start"
RCB_SESSION_LOG= RCB_SESSION_LOG_KEEP= RCB_AGENT_TRACE_DIR= timeout -k 30 3300 python - <<'PY' || exit 1
import json
from rcb_robowits import Session
I = json.load(open("/app/instance.json"))
s = Session(I["task"], instance="/app/instance.json")
s.close()
PY
date -u +"%FT%T.%3NZ warm-up done"
'''
timeout_sec = 3600.0
retries = 2

[verifier.environment]
build_timeout_sec = 1800.0
