schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robolab-throw-away-snacks-i00-privileged"
description = "NVIDIA RoboLab throw_away_snacks (Franka + Robotiq 2F-85, Isaac Lab 2.3 / Isaac Sim 5.1): produce one replayable trajectory. Put away the snacks in the bin. Frozen scene instance (the state after RoboLab's canonical seed-0 reset)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robolab", "isaac-lab", "isaac-sim", "franka", "code-as-policy", "trajectory", "throw_away_snacks"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robolab"             # NVIDIA RoboLab v0.3.1 on Isaac Lab 2.3.2 / Isaac Sim 5.1 (PhysX on the CPU, RTX rendering)
robot = "franka-robotiq-2f85"
family = "throw_away_snacks"
mode = "privileged"               # privileged state, resets and primitives through the tooling (docs/PROTOCOL.md §3)
oracle = "none"
oracle_evidence = "No reference solution: RoboLab ships no expert or planner. Positive examples graded 1 by the separate verifier: robolab-throw-away-snacks-i00__uUNyxva (robolab-throw-away-snacks-i00-privileged, run codex-gpt6_luna-xhigh, robolab-lunacx-0925-2038, ws3; https://embodied-agent-interface-v2-internal.github.io/runs/robolab/codex-gpt6_luna-xhigh/throw_away_snacks/unlimited/); robolab-throw-away-snacks-i00-li__wASjqcg (robolab-throw-away-snacks-i00-standard, run codex-gpt6_luna-xhigh, robolab-lunaxh-limited-0928, lab; https://embodied-agent-interface-v2-internal.github.io/runs/robolab/codex-gpt6_luna-xhigh/throw_away_snacks/limited/). Human review per family (PROTOCOL §2.7)."
instance_seed = 0                 # scene = environment/instance.json (the full scene state after the seeded reset + its hash); identity = dataset.toml digest
expert_time_estimate_hours = 1.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 4.0
min_memory_gb = 13.0
min_gpu_memory_gb = 6.5
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 13.0
verifier_min_gpu_memory_gb = 6.5
measured = "GPU 4.0-5.5 GB per trial (one simulator), anon memory 7.6-10.3 GB, CPU p90 2.4-8 cores over 7 trials, live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 AWS hosts + mll-4090-1, 10-10); vram_profile peaks 14.5-15.7 GB include agents' extra simulator processes and Isaac's card-sized pools; author: one Isaac simulator per 32 GB of host RAM"

[verifier]
timeout_sec = 2400.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 5400.0              # RoboLab budget, both modes (docs/benchmarks/robolab.md): every Python process pays ~2 min of Isaac Sim launch + scene build
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 24576

[verifier.environment]
build_timeout_sec = 1800.0
