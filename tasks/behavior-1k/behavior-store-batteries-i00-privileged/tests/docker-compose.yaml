# The verifier replays in Isaac Sim with the same dataset mount ($RCB_BEHAVIOR_DATA, read-only) and one GPU. Its Kit
# cache is a TRUSTED volume of this verification only (no fixed name: compose names it after the verifier's project,
# and Harbor's teardown deletes it): Isaac keeps generated Python there that Kit imports at startup, so a cache the agent
# could write must never reach the grader. The first replay compiles shaders into it, the second reuses it.
services:
  main:
    environment:
      OMP_NUM_THREADS: "8"   # thread pools capped (PyTorch sizes its pool to the host: 128 on a 256-core
      MKL_NUM_THREADS: "8"   # host, spinning on every small tensor op); user 2026-09-27
      RCB_TEXTURE_BUDGET: ${RCB_TEXTURE_BUDGET:-}   # optional: Isaac's texture memory as a fraction of the GPU (rcb_behavior.py
                                                    # _cap_texture_memory); unset: Isaac's default (0.6)
    shm_size: "8gb"
    volumes:
      - ${RCB_BEHAVIOR_DATA:?set RCB_BEHAVIOR_DATA to the directory holding your licensed BEHAVIOR dataset (docs/benchmarks/behavior.md)}:/data:ro
      - rcb_behavior_cache_trusted:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  rcb_behavior_cache_trusted:
