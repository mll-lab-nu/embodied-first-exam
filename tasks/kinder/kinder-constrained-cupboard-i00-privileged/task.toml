schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/kinder-constrained-cupboard-i00-privileged"
description = "KinDER ConstrainedCupboard3D-o6 (privileged mode): produce one replayable trajectory that reaches the goal, frozen scene instance i00."
keywords = ["robotics", "kinder", "mujoco", "tidybot", "mobile-manipulation", "physical-reasoning", "trajectory", "constrained-cupboard"]

[metadata]
task_type = "trajectory"
simulator = "kinder"
robot = "tidybot-plus-plus"
# KinDER env kinder/ConstrainedCupboard3D-o6-v0
family = "constrained-cupboard"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (KinDER's seed + a digest of the scene it builds); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 4.0
oracle = "none"
oracle_evidence = "GPT-6 Luna's privileged-mode trajectory, run `codex-gpt6_luna-medium` on the results site, which today's privileged verifier scores 1; it moves the base diagonally by up to 0.14 m a step, beyond standard mode's 0.1 m disc, so it is no standard-mode example, and none is known yet; human review in PR #8"

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [0, 1, 2]

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container, built from tests/Dockerfile (docs/protocol/README.md Appendix H.1): the agent's container,
# where it was root, is gone by then, and only /app/output/ crosses over. It replays locally, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 1800.0
# The model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS): KinDER and its baselines are public.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 16
memory_mb = 7168
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
