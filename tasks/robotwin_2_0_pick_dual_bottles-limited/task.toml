schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robotwin_2_0_pick_dual_bottles-limited"
description = "LIMITED MODE (robot as a service, rcb-limited/1.0): RoboTwin 2.0 pick_dual_bottles on the same frozen instance as the unlimited task (seed 60417). Pick up one bottle with one arm, and pick up another bottle with the other arm. The agent only gets a client: observe (RGB + proprioception), step (qpos or ee action). No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "robotwin", "sapien", "aloha-agilex", "dual-arm", "limited-mode", "trajectory", "pick_dual_bottles"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "robotwin"
robot = "aloha-agilex"
family = "pick_dual_bottles"
tier = "perception"                # RGB + proprioception only; no object poses, no check_success, no reset
mode = "limited"
protocol = "rcb-limited/1.0"
instance_seed = 60417
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 280); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
