schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/topogym-fiber-bundling-hard-i00"
description = "TopoGym fiber_bundling (panda_robotiq, Genesis): produce one replayable trajectory. Manipulate the thick sheath to pass every fine fiber and the front sheath through the fixed copper ring; keep the rear terminal anchored. Frozen scene instance (variation fiber_bundling_hard, seed 0)."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "panda_robotiq", "code-as-policy", "trajectory", "fiber_bundling"]

[metadata]
author_name = "jianwen"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "topogym"             # TopoGym on Genesis 1.2.1 (CUDA physics, Nyx RGB)
robot = "panda_robotiq"
family = "fiber_bundling"
tier = "privileged"               # privileged (state-based perception) | perception (RGB-D models)
difficulty = "hard"               # the variation's tier (docs/rcb/TAXONOMY.md)
grasp = "physical (no assisted grasping)"
success_rule = "his default success (goal_complete True; terminal revision terminal_v4_fiber_ring_plane)"
instance_seed = 0                 # scene = environment/instance.json (variation fiber_bundling_hard, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 65700.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
