# Unlink C Ring layout expressed in the TopoGym tabletop V1 task frame.
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# docx 3.4：支架上固定一个闭合刚性圆环，C 形开口环与其互锁。开口是 unlink 的唯一
# gateway——闭合环身必须从开口通过，其余方向都是刚体碰撞死路。
#
# 本文件的尺寸不是随手取的，五条不等式互相咬合，改任何一条都要重跑
# `python tests/check_c_ring_clearance.py`：
#
#   1. 开口能过环身        gap_clear_width > 2 * fixed_ring.tube_radius
#   2. C 环套得进管身      c_ring 的孔半径 > fixed_ring.tube_radius
#   3. 抽出时不撞桌面      c_ring 静置中心高 - 抽出行程 - c_ring 外半径 > 余量
#   4. 静置时凸台不触桌    c_ring 静置中心高 - (major_radius + tab.length) > 余量
#   5. reset 时不撞机械臂  固定环顶与悬臂顶 < home 位指尖 task z 0.1608
#
# 第 5 条与 bar_through_hole 的 panel.top_z 同一条余量：高于 home 指尖的结构会在
# reset 的 set_dofs_position 瞬移里被扎进去，stacked_plate 当初就是这样出的求解器 NaN。
# 当前留 15.8mm（固定环顶 0.143，悬臂顶 0.145）。

task:
  id: unlink_c_ring
  difficulty: smoke

coordinate_frame: task

# ------------------------------------------------------------------------ 支架
# 立柱 + 水平悬臂。固定环不坐在立柱上，而是由悬臂牵出去一段距离：这样 C 环的整个
# 活动包络（悬挂、绕管轴转 90°、抽出、落下）都够不到立柱，立柱一次也不参与接触。
stand:
  # 从固定环中心指向立柱的水平方向，绕 +z。90° = 立柱在环的 +y 侧，即机器人的左手边。
  #
  # 不取 0°（立柱在桌子远端）：front 相机架在 +x 看回机器人，视线正好沿着悬臂的轴线过来，
  # 悬臂与立柱在画面里叠在两环正前方，看不出夹爪在对什么动作（2026-08-22 目视）。
  # 转到 +y 之后 front 相机正对 C 环的环面（法向 ±x），支架整体移出视线。
  #
  # 取 +y 而不取 -y：oblique 是默认录制机位，架在 (1.00, -0.80) 即 -y 侧；支架放 +y 落在
  # 两环背后，放 -y 会挡在前面。
  #
  # 对夹爪的影响：C 环面变为 yz 面，开口朝 +y（立柱那侧），实心的那半圈在 -y 侧、
  # 且管身在该处沿竖直方向——指尖朝下、水平合爪即可捏住。悬臂只占 y >= 0，-y 侧那半圈
  # 从上方无遮挡。净空性质与 yaw=0 时相同，整组只是转了 90°。
  yaw_deg: 90.0
  # 环心到立柱轴心的水平距离。下限见不等式：> c_ring 外半径 + clearance。
  arm_length: 0.080
  # 立柱与悬臂都是无关节的凸圆柱，直接 add_entity，不走 URDF。
  # 立柱直径 16mm（此前 24mm）：它不承任何力，细一些画面里少挡东西，也更接近实验室支架杆。
  # 该值不进入任何判据——top_z 只按轴向端面加半径乘倾角算，竖直立柱的半径不抬高轮廓。
  post_radius: 0.008
  arm_radius: 0.006
  # C 环包络与立柱／悬臂之间要求的最小净空。实测最紧处 13mm（抽出末段）。
  clearance: 0.008
  color: [0.55, 0.55, 0.54]

# -------------------------------------------------------------------- 固定闭环
# 环面法向 = 悬臂方向，即悬臂从环的正后方接到环的最高点。环面与悬臂垂直（而不是
# 共面）使 C 环面包含悬臂方向：C 环沿管轴平移是往侧向走，彻底离开立柱那条线。
fixed_ring:
  # 环心。z 由 C 环反推：z = c_ring 静置中心 + 孔间隙 + major_radius
  #                        = 0.058 + 0.021 + 0.030。
  center: [0.060, 0.000, 0.109]
  major_radius: 0.030
  # 管细一些，开口才不必开得很大。gap 的净宽是按它定的。
  tube_radius: 0.004
  # 每段圆柱的弧角，不配段数：按弧角配，弦近似的矢高 R(1-cos(seg/2)) 才与半径成
  # 正比，两个环的保真度一致。10° -> 36 段，矢高 0.11mm。
  segment_deg: 10.0
  # 相邻段各自伸长这么多，接缝处体积重叠、外观连续。体积重叠无害，只有共面才
  # z-fighting（tasks/_fixtures.py 的 add_v_block）。
  joint_overlap: 0.001
  mass: 0.30
  color: [0.62, 0.62, 0.61]

# ---------------------------------------------------------------------- C 形环
c_ring:
  major_radius: 0.030
  tube_radius: 0.005
  # 开口弧角。净宽 = 2*R*sin(gap/2) - 2*r = 11.99mm，对 8mm 的管身单边留 2mm。
  # 再小就过不去，再大则「不对准也能抽出」，防捷径失效。
  gap_deg: 43.0
  # 开口中心的方位角，从环的正上方起算、朝 +x 为正。90° = 开口朝水平方向。
  # 不能取 0°：那正是管身所在处，环会直接掉下来。
  gap_azimuth_deg: 90.0
  segment_deg: 10.0
  joint_overlap: 0.001
  # 出生时比静置位高这么多，落下去自行贴合。静置位（管身贴住孔的上缘）在几何上
  # 是零间隙，直接生成会被判为初始互嵌。
  spawn_drop: 0.002
  mass: 0.05
  color: [0.78, 0.45, 0.20]
  # 径向抓取凸台。_fixtures.py 的 _link_xml 把质心放在碰撞件包围盒的中心；不带凸台的
  # C 环，该中心只被开口横向拉偏 1.62mm、竖直方向不偏，而管身正在环心的正上方，
  # 于是它的静止姿态是「把这 1.62mm 转到正下方」，也就是开口朝向管身、离出生姿态 90°。
  # 凸台把包围盒往下拉 8.30mm，把静止姿态改到离出生姿态 11°。
  #
  # 2026-08-22 实测：两个静止姿态都没被走到，因为悬挂接触处的库仑摩擦把 C 环钉在了
  # 出生姿态上——默认接触摩擦 1.0 下阻力矩 mu*W*r = 12.3 mNm，重力矩 0.79 mNm，相差 15 倍，
  # 600 步静置里开口只动了 0.6°。**因此凸台不是维持互锁的原因**。它的作用是抓取特征，
  # 以及接触一旦变滑（摩擦扫参、换材料、随机化把 C 环调轻）时的裕度。
  # 缩短它是可选项，见 docs/develop/tasks/unlink_c_ring_zh.md §7。
  tab:
    # 与开口成 90°：开口在 90°，凸台在 180°（正下方）。
    azimuth_deg: 180.0
    length: 0.020
    radius: 0.005

# ------------------------------------------------------------------ 拓扑读数
# 判定契约见 docs/develop/framework/task_taxonomy_zh.md §4.3（C3 entangle）。
topology:
  # 投影方向不在这里配，由 _c_ring_geometry.bisector_projection 从两个环的法向导出：
  # 两法向互相垂直（C 环挂在闭合环的切向管段上），取其角平分线为视线，两个环都是 45°，
  # 谁也不是边对边——这是交叉计数有定义的前提。契约要求的「显式声明」由运行时打印与写入
  # to_info() 满足。
  #
  # 为什么不写死：整组场景随 stand.yaw_deg 转。此前写死的那个矩阵在 yaw=0 时正确，
  # 改成 yaw=90 后正好沿着 C 环自身的平面看过去，出生读数变成 Lk = -2（2026-08-22，
  # 由 tests/check_c_ring_clearance.py 拦下）。
  #
  # canonical closure：C 环是开曲线，linking number 只有把开口用一条直弦补上之后
  # 才有定义。这条弦上取几个采样点。
  closure_samples: 6
  # 判「卡住」的穿透深度阈值。两环最深的弦近似误差是 0.11mm，非 gateway 轨迹实测
  # 穿透 9mm，取 1mm 把两者分开。
  jam_depth: 0.001

# ---------------------------------------------------------- 生成的 URDF 落点
# 相对仓库根，由 world.rope.resolve_mesh_dir 解析。build 产物，已 gitignore。
urdf_output_dir: .cache/topogym/urdf/unlink_c_ring

# -------------------------------------------------------------------- 装饰
# 一律 collision=False（tasks/_visuals.py 的标准规则）：整组关掉不得移动任何一个接触点。
# 只装饰立柱——C 环是运动件，独立的无碰撞装饰实体要逐步同步位姿，不值当。
visual_details:
  pedestal:
    enabled: true
    # 底板按立柱直径的倍数给。立柱细到 16mm 后 1.6 倍只有 26mm，撑不住 139mm 的高度，
    # 看着像插在桌上；2.5 倍是 40mm。底板落在 y ∈ [0.060, 0.100]，与 C 环（y 至多 0.035）
    # 还差 25mm，不会在画面里贴上去。
    foot_scale: 2.5
    foot_thickness: 0.005
    color: [0.30, 0.32, 0.35]
