# Standard mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# `/data` is the licensed BEHAVIOR dataset here (read-only; $RCB_BEHAVIOR_DATA is a precondition of every BEHAVIOR run,
# tasks/behavior-1k/README.md), so the service writes its own record to `/out` (the container's own file system: it
# survives compose's restarts of the same container). Crash recovery (docs/protocol/standard_mode.md §13): run.sh exits
# non-zero when the service crashes and compose restarts the container, which resumes the same episode from its journal.
# The sidecar is TRUSTED: its Kit cache is a trusted volume of this trial only (no fixed name: compose names it after the
# trial's project, and Harbor's teardown `compose down --volumes` deletes it), never mounted where agent code runs.
services:
  main:
    pids_limit: 16384   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 12   # rcb-monitor
    mem_limit: 51200m   # rcb-monitor
    pids_limit: 16384   # rcb-monitor
    build:
      context: ./sim
      dockerfile: Dockerfile
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:behavior-0.1.2"]   # our prebuilt image: its layers are reused when you can pull it, else Docker builds the recipe
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
      - ${RCB_BEHAVIOR_DATA:?set RCB_BEHAVIOR_DATA to the directory holding your licensed BEHAVIOR dataset (tasks/behavior-1k/README.md)}:/data:ro
      - rcb_behavior_cache_trusted:/cache
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      OMP_NUM_THREADS: "8"   # thread pools capped (PyTorch sizes its pool to the host: 128 on a 256-core
      MKL_NUM_THREADS: "8"   # host, spinning on every small tensor op); user 2026-09-27
      RCB_TEXTURE_BUDGET: ${RCB_TEXTURE_BUDGET:-0.1}   # Isaac's texture memory as a fraction of the GPU (rcb_behavior.py
                                                       # _cap_texture_memory); default 0.1 since protocol v1.1.5 so that GPU
                                                       # memory does not grow with the card (Isaac's own default: 0.6)
      PYTHONHASHSEED: "0"           # the same set order in the service and its replays (with the tooling's stable hashes)
      RCB_TASK: canning_food
      RCB_INSTANCE: /srv/instance.json
      RCB_TOOL: /srv/rcb_behavior.py
      RCB_DATA: /out
      RCB_WALL_CLOCK_S: "7200"
      RCB_CAM_SIZE: "224"           # the robot's own cameras at 224x224: what the agent sees
      RCB_STARTUP_TIMEOUT_S: "1800" # startup watchdog: scene builds measured 130-404 s warm, +~250 s on this trial's cold Kit cache
      PYTHONPATH: /srv
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.2.0@sha256:65442d9e9eeb493d785a59d48a321345e2b48186946cc9d55beb684182514b4b
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
  rcb_behavior_cache_trusted:
