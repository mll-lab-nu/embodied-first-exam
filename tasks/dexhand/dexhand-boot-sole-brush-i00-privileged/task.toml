schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexhand-boot-sole-brush-i00-privileged"
description = "A rubber boot stands sole-up on a boot-rack peg in a collection tray with six dry soil clods lodged in its tread; pick up the shoe brush from the counter with the right hand of a Tianji Marvin two-arm robot (Sharpa Wave by default, or Wuji Hand 2.2), brush every clod off the sole into the tray and withdraw the brush; a clod outside the tray, a clod touched by the hand, a dropped brush, a displaced boot or any arm/stand contact fails the episode at once. Task: Brush all six soil clods off the upward-facing sole of the boot into the collection tray."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "tool_use", "brushing", "cleaning", "debris", "contact-rich", "free-objects"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "marvin-bimanual-sharpa-wave"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "boot_sole_brush"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration

oracle = "full"
oracle_evidence = "solution/trajectory.npz: the 1,688-row Sharpa Wave witness on the Marvin right arm (success at control 1,538, then 150 hold rows), authored by tracking the wave-2 floating-hand episode's hand-root poses with arm inverse kinematics (closed loop, joint integral; the brush-transfer segment re-timed 3x slower); two fresh-process replays succeed with identical state hashes, float32-rounded rows succeed, and no arm, stand or parked-hand contact occurs in any physics substep."
instance_seed = 0
expert_time_estimate_hours = 3.0
difficulty = "hard"
release_status = "provisional"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
