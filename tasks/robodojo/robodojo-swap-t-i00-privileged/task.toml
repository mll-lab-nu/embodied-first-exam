# Generated by scripts/robodojo/mk_tasks.py -- edit the template or scripts/robodojo/descr/, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/robodojo-swap-t-i00-privileged"
description = "RoboDojo swap_T (Memory; two ARX X5 arms with parallel grippers, Isaac Sim 5.1 / Isaac Lab): produce one replayable trajectory of RoboDojo's 14-D joint actions. Task: Pick up the two T-shaped blocks, exchange their positions, and set each down with the orientation the other one had, then return the arm(s) to the start pose. Frozen scene instance: RoboDojo's own evaluation layout arx_x5/0/swap_T_0.json; graded by RoboDojo's own reward check."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "robodojo", "isaac-lab", "isaac-sim", "bimanual", "arx-x5", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "robodojo"            # RoboDojo @ cb2a37d on its Isaac Lab 2.3 fork / Isaac Sim 5.1 (PhysX, RTX rendering)
robot = "arx-x5-bimanual"
family = "swap_T"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): scripts/task_dynamics.toml
oracle = "none"
oracle_evidence = "no positive example yet; no reference solution (RoboDojo releases no expert, and its training demonstrations carry no initial state); reported separately until one exists; human review in PR #142"
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 8.0
min_memory_gb = 20.0
min_gpu_memory_gb = 10.5
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 8.0
verifier_min_memory_gb = 19.0
verifier_min_gpu_memory_gb = 11.0
measured = "heaviest scene (pour_liquid_into_cup_random: GPU PhysX liquid + 15-20 clutter objects), one Isaac Session driven through 300 actions with frames from the three cameras, then the verifier's two fresh-process replays (the second filmed): main container docker peak 16.1 GiB (anon 14.9), GPU 9.0 GiB, CPU at its 8-core cap; verifier docker peak 15.7 GiB, GPU 9.6 GiB, 8 cores; rcb_monitor (peak_memory_gb 15.85, peak_gpu_memory_gb 9.0) + a per-container sampler (docker stats, cgroup anon, nvidia-smi every 10 s), RTX 4090, 10-10; determinism runs on all 54 tasks: 4.6-8.4 GB of GPU memory per Isaac process"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 32.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 32.0
measured = "GPU: 9.0 GiB per Isaac Session on the heaviest scene (rcb_monitor, pour_liquid_into_cup_random, RTX 4090, 10-10) -> max(1.5 x peak, peak + 4), at least 16 for Isaac Sim; memory: the [environment] cap 32 GiB, which every past trial ran under (docker peak 16.1 GiB of one Session on the heaviest scene; the agent may run a second Session); processes (peak 6) 512 and disk (peak 0.7 GiB) 20 GiB: design defaults"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 8.0, memory_gb = 39.0, pids = 16384 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 7800.0              # ONE fresh-process replay (owner, 2026-10-12; two and 15000 s before) at tests/grade.py's
                                  # limit for the longest accepted trajectory (replay_timeout(15,000 actions) = 1200 s +
                                  # actions / 2.5 = 7200 s) + 600 s; a usual trajectory (up to 1,500 actions) has 1800 s
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # Isaac Sim starts and renders offline: every asset is in the image

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 32768

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2.12); every Python process pays a few minutes of Isaac Sim launch + scene build
# RoboDojo's training demonstrations and policy checkpoints are public (Hugging Face), so the agent reaches the model APIs and the package registries,
# nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 39936

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
