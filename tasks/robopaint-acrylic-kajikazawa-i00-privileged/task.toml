schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robopaint-acrylic-kajikazawa-i00-privileged"
description = "RoboPaint acrylic stroke copy: embodied robotic painting (ManiSkill 3.0.1 Franka Panda with a round acrylic brush; the paint is libmypaint 1.6.1 with the mypaint-brushes preset tanda/acrylic-03-paint, an opaque paint whose mark width follows the pressure): produce one replayable trajectory that copies the painting shown in the picture target.png (a small acrylic painting after Katsushika Hokusai's woodblock print Kajikazawa in Kai Province, c. 1830-32) onto the main sheet with 10 premixed paints, in at most 377 strokes. Scored at a 1 mm scale against the picture after the best single shift of the sheet, at most 5 mm along each axis (success iff mean CIELAB ΔE <= 2.0, p90 ΔE <= 6.0, SSIM of L* >= 0.92, edge correlation >= 0.8, paint IoU >= 0.95 and at most 377 strokes; 1 - mean ΔE / 20 is the continuous score). s.score() is served by a separate scoring container. Process rules: paint with brush strokes the way a person paints; colouring in or filling areas with a thin line, zigzag, serpentine or contour-offset fills fail; the brush tip's path pressed on the main sheet with paint is at most 44300 mm in total, and at most 10 % of it in strokes longer than 2.5 x the diagonal of their bounding box."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "maniskill", "sapien", "painting", "acrylic-painting", "mypaint", "brush", "stroke-copy", "franka", "code-as-policy", "trajectory", "robopaint_acrylic_kajikazawa"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "maniskill"           # ManiSkill 3.0.1 / SAPIEN 3.0.3 (PhysX on the CPU) + libmypaint 1.6.1 (rcb_brush.py MyPaintPainter, CPU)
robot = "franka-panda"            # PandaStick with a paint brush: rigid handle + 15 mm collision-free tuft, TCP = the tuft's tip
family = "robopaint_acrylic_kajikazawa"
mode = "privileged"               # privileged (exact sheets, score, brush state) | standard (RGB only: the -standard twin)
oracle = "partial"                # solution/solve.sh replays the frozen reference plan; its recorded scores: oracle_evidence
oracle_evidence = "Reference solution in solution/, unchanged from the earlier version of this task (the picture score only; its Harbor oracle and nop runs, and what changed since: docs/benchmarks/robopaint.md, Oracle evidence). Under the process rules the verifier scores it 1 (tests/grade.py with rcb_brush_strict.py, two fresh replays, ws3, 2026-10-05): path_mm 14746 of the 44300 mm budget; its strokes are sweeps. Harbor oracle and nop runs on one pair per family: docs/benchmarks/robopaint.md (Validation)."
instance_seed = 0                 # scene = environment/instance.json (sheets, brush preset, paint wells, start joints, instance_sha; the exemplar is target.png)
expert_time_estimate_hours = 4.0
difficulty = "hard"             # RoboPaint tiers: acrylic stroke copy hard, oil paint-from-reference extreme
medium = "mypaint"                # the brush model: calligraphy (Wang et al. 2020) | broad_nib | mypaint
stroke_count = 290                # difficulty axes: the exemplar program's strokes (hidden), the stroke budget, paints, brush sizes, layers
stroke_budget = 377
palette_size = 10
brush_sizes_mm = [16.2, 9.4, 5.2, 3.0]
layers = 4
colour_regions = 82                # the exemplar's palette-colour areas >= 30 mm² (graders' regions)
source_image = "File:Kajikazawa in Kai province.jpg"
source_license = "Public domain"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 7200.0              # 2 h of wall clock (a replay of a few thousand control steps takes seconds)
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
