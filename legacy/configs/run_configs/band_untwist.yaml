# band_untwist_physical_pinch_demo 的运行模式参数。
#
# 继承 run_configs/default.yaml 的通用字段，再加本 demo 自己的开关。
# 判据同 default.yaml：同一份 task / env 配置配上不同的 run.*，物理结果应当相同 ——
# 因此绳子材料、网格、抓取步数不在这里，它们在 task 配置里，
# 用点路径覆盖，例如 `task.pinch.lift_clearance=0.06`。

defaults:
  - default
  - _self_

# --- 抓哪个绳头 -----------------------------------------------------------
# 三者共用一个接口（planning/band_untwist_planner.py），构成本任务的对照（task_taxonomy_zh.md §4
# 要求每个任务都要有可执行的 contrast pair）：
#   oracle     每步抓在某个交叉处**压在上面**那股的插头，按开局规划的序列把交叉逐个解开，预期成功
#   wrong_end  在 oracle 要解的那个交叉上抓**被压在下面**那股的插头，同样的动作——8 字上 1 -> 2，
#              预期判失败（crossing_added）；它是「跑完然后被判失败」的一次测量，不是「跑不动」
#   one_move   oracle 只给一步：两步的出生态会剩一个交叉（crossing_left），量出「全部解开才算成功」
oracle_mode: oracle

# --- trace ---------------------------------------------------------------
# 每步把绳的状态写进一个文本文件。null = 关闭；"auto" = 自动生成带时间戳的
# 文件名；其他字符串按路径用。
trace: null
trace_every: 1

# --- 任务控制 ------------------------------------------------------------
# 抓放次数上限。null = 开局在实测绳上规划出的序列长度（1 或 2，不给重试步）。
max_moves: null

# --- 变体（2026-09-03）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进日志与 episode 元数据的变体标识。
variant_id: default
