schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  { source = "/data/replay3.log", service = "sim" },           # and its third, which renders replay.mp4
  "/app/output/",
]

[task]
name = "robot-coding-bench/molmospaces-open-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): MolmoSpaces open on the same frozen episode as molmospaces-open-i00-privileged. Open the cabinet. The agent only gets a client: camera images (RGB, depth) and proprioception, joint-position chunks, upstream's kinematic model, done. No reset, no object state; the sim service records the episode and grades it with upstream's success check."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "molmospaces", "mujoco", "franka-robotiq-2f85", "standard-mode", "trajectory", "open"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "molmospaces"
robot = "franka-robotiq-2f85"
family = "open"
mode = "standard"                  # robot as a service: images + proprioception only; no object poses, no success check, no reset
protocol = "eai-standard/2.2"
expert_time_estimate_hours = 3.0
oracle = "none"
oracle_evidence = "no reference solution (MolmoSpaces' planners and grasp files are not shipped); positive example graded 1 by the separate verifier: molmospaces-open-i01-privileged__hkZsZtE (run codex-gpt6_luna-medium, batch molmospaces-luna-v3 of 2026-10-03: an earlier round on the same episode, kept with the run's records, not on the results site); human review in PR #47"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json, video
timeout_sec = 1800

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
