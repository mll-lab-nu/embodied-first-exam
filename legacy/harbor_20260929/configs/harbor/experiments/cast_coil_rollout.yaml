# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: cast_coil_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: cast-coil-medium-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Assemble the separated gold and silver Cast Coil pieces into their
      interlocking, alternating four-layer target configuration. Align both pieces
      fully; contact or grasping alone is not completion. Release both pieces, withdraw
      the grippers and leave the assembled puzzle stable on the table.
    simulator:
      task_id: cast_coil
      robot_id: auto
      variation_id: medium
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
