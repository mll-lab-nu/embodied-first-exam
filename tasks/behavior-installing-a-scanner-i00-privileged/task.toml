schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/behavior-installing-a-scanner-i00-privileged"
description = "BEHAVIOR-1K v3.9.2 (2026 BEHAVIOR Challenge) installing_a_scanner (R1Pro mobile manipulator, OmniGibson / Isaac Sim): produce one replayable trajectory. On the table in the private office stand a scanner (switched off) and a laptop; stand the scanner next to the laptop and switch the scanner on. Frozen scene instance (challenge public_test instance 301)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "behavior", "omnigibson", "isaac-sim", "r1pro", "mobile-manipulation", "code-as-policy", "trajectory", "installing_a_scanner"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "behavior"            # BEHAVIOR-1K v3.9.2 = OmniGibson 3.9.2 on Isaac Sim (the 2026 challenge stack)
robot = "r1pro"
family = "installing_a_scanner"
mode = "privileged"               # privileged state, unlimited resets, thin primitives (docs/PROTOCOL.md §3)
oracle = "none"
oracle_evidence = "No reference solution: BEHAVIOR-1K ships no expert or planner that replays on this frozen instance. Solvable: model trial behavior-installing-a-scanner-i0__pytvepD (behavior-lunaxh-t8-0927, privileged) graded success=1, deterministic=1 by the separate verifier on a pre-v1.0 version of this task (dev/qineng 912567fa; grader verdict and frozen instance unchanged since); agent log https://embodied-agent-interface-v2-internal.github.io/runs/behavior-1k/codex-gpt6_luna-xhigh/installing_a_scanner/unlimited/, verifier replay https://huggingface.co/datasets/eai-v2-internal/agent-runs/resolve/main/behavior-1k/codex-gpt6_luna-xhigh/installing_a_scanner/unlimited/replay.mp4; not re-run on this version (static validation only). Human review per family (protocol §2.7)."
instance_seed = 301               # scene = environment/instance.json (2026 challenge public_test instance 301 + its state hash); identity = dataset.toml digest
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 5400.0              # two fresh-process replays: ~3 min Isaac + scene load each, then 7-11 control steps/s
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 14400.0             # BEHAVIOR budget: every Python process pays ~3 min of Isaac Sim + scene load, ~10 steps/s (docs/benchmarks/behavior.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 24576

[verifier.environment]
build_timeout_sec = 1800.0
