schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-balance-board-i00-privileged"
description = "Embodied Olympics balance-board (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Stay balanced on the roller board for 30.0 s: neither end of the deck nor any part of you may touch the floor. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "balance-board"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "balance_board"
category = "parkour-apparatus-balance"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 6.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: the start is just after a mount: the deck 3 degrees from level with its left end low, the robot standing square on it and tilted with it, its centre of mass 4.2 cm left of the roller's line of contact; left alone the deck is down at 0.8 s. Positive by injection (a spring-damper force on the torso, a helper's hand, for the 30 s: the deck brought level, at most 3.0 degrees); negatives: the do-nothing agent, the walking policy, the weight over one end, left alone after 20 s, off the board, lying on the deck. A feedback tuned for an exactly level start, which holds the board there without visible motion, falls at 0.85 s from this start, as does a linear ride; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
