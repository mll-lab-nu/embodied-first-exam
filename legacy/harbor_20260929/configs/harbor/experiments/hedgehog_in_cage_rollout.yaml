# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: hedgehog_in_cage_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: hedgehog-in-cage-medium-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Extract the spiked hedgehog ball from the cage. Place the whole ball,
      including every spike, inside the green dashed goal area and hold it still
      briefly. Keep all cage components outside the area on the puzzle/system side.
      Holding the target with the gripper is allowed.
    simulator:
      task_id: hedgehog_in_cage
      robot_id: auto
      variation_id: medium
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
