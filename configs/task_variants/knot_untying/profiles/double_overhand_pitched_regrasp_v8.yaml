# Keep the tail anchor during the final support shift, then replan from observed geometry.
task:
  variant: double_overhand_open_v1
  route_profile: double_overhand_pitched_regrasp_v8
  reference_yaw_deg: 45.0
  route_settings:
    approach_finger_qpos_m: 0.018
    preopen_upper_with_tail_anchor: true
    preopen_lift_m: 0.06
    preopen_shift_m: [0.12, 0.0, 0.0]
    preopen_anchor_withdraw_m: [0.0, -0.06, 0.07]
    preopen_maximum_extra_lift_m: 0.08
    preopen_regrasp_clearance_m: 0.14
    preopen_clearance_shift_m: [0.12, 0.0, 0.0]
    maximum_regrasps: 4
    regrasp_on_material_limits: true
    track_regrasp_translation: true
    check_robot_clearance: true
    regrasp_pitch_candidates_deg: [0.0, -20.0, 20.0, -30.0, 30.0, -45.0, 45.0, -60.0, 60.0]
    regrasp_hover_heights_m: [0.02, 0.04, 0.06, 0.08]
