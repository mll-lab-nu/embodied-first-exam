[robots]
unitree-g1-dex1 = "Unitree G1 humanoid (29 DoF) with Dex1-1 two-finger grippers; legs and waist driven by NVIDIA's GR00T-WBC walking policy"

[modes.privileged]
# grade.py L76-104: no file -> missing_trajectory; over 64 MB, not an npz, no `actions` -> bad_trajectory; `task` of
# another task -> wrong_task; not (T, row width), T > horizon, NaN/inf -> bad_trajectory (all 0, grader_error 0).
# L106-112: a replay process that fails or times out, instance_ok false (instance_mismatch) -> grader_error 1.
# rcb_bigym2.replay(): rows until upstream ends the episode (held success, task failure, physics error, horizon) or the
# rows run out; success = upstream is_success there. Rows are clipped into the action bounds (Episode.step).
success = """
Graded file: `/app/output/trajectory.npz`, as `s.save_trajectory(...)` writes it: this task's name and at most
{vars[horizon]} rows of finite actions, one row per 50 Hz control step (values outside the action bounds are
clipped). After the agent's session it is replayed once, open-loop, from the frozen start (`tests/instance.json`) in
a fresh process of a separate verifier container without network. The replay runs until upstream ends the episode
(the success held for 1 s, a failure above, or the horizon of {vars[horizon]} control steps, {vars[seconds]} s) or
the rows run out. The task is passed if, at that point, upstream's success has been held for 1 s and the robot has
not fallen at any time in the replay. Rows after the end are not run. Only the trajectory is scored (`gen.py` and
`NOTES.md` are not). A missing file, a file for another task, or one that is not such an array scores 0. A replay
that crashes or times out, or a frozen start that does not rebuild, is reported as `grader_error` (infrastructure),
not as a score.
"""

[modes.standard]
# server.py: AGENT_END (run_on): the held success never ends the episode; a failure above, a physics error or the
# pelvis 10 m away end it as a failure; the horizon is the step cap (step_limit), judged as it stands. End-state ends
# (finished, timeout, step_limit) run end_window_steps = 50 control steps of the hold row (rcb_bigym2 hold_row: the
# last command, vx = vy = wz = 0) from the end state; the success is success_now at the window's last step (a failure
# in it -> 0). rcb_service._end(): error, reset -> 0. Reset budget: RCB_RESET_BUDGET default (0).
success = """
Graded: the live episode, judged by the simulator service; nothing is replayed. Reaching the goal does not end the
episode and is not shown to the agent. The episode ends at the agent's `/finish`, at the horizon ({vars[horizon]}
control steps, {vars[seconds]} s of robot time), when the agent's time ({timeout}) runs out, or at a failure above,
which scores 0. After it ends, the robot holds its last command, standing still, for 1 s more (50 control steps).
The task is passed if at the end of that second upstream's success predicate has held for 50 consecutive control
steps and the robot has not fallen at any time in the episode or the hold; a failure during the hold scores 0.
Resets granted: {resets}. A reset starts a new episode from the frozen start; only the episode after the last reset
is graded. A simulator error raised by the agent's own call ends the episode with 0. An episode that does not start
from the frozen instance, or a service crash outside the agent's calls, is an infrastructure failure, not a score.
"""

[modes.realtime]
# As [modes.standard] (rcb_realtime.py extends rcb_service.Service; the same adapter and end window), plus the clock
# (paused until the first /submit, one control step every control_dt x slowdown s; when the plan runs out its last row
# is held, walking velocity included) and its error rule (after the first command a simulator error or a crash inside a
# control step is the agent's; before it, a kill, a failed resume, a reset that does not rebuild: infrastructure).
success = """
Graded: the live episode, judged by the simulator service; nothing is replayed. The clock does not stop: an episode
starts paused at the frozen start, and from the agent's first `submit` one control step runs every 20 ms × S of wall
time (slowdown S = {slowdown}) whether or not the agent sends anything; when the planned rows run out, the last row
is held, its walking velocity included. Reaching the goal does not end the episode and is not shown to the agent. The
episode ends at the agent's `/finish`, at the horizon ({vars[horizon]} control steps, {vars[seconds]} s of robot
time), when the agent's time ({timeout}) runs out, or at a failure above, which scores 0. After it ends, the robot
holds its last command, standing still, for 1 s more (50 control steps). The task is passed if at the end of that
second upstream's success predicate has held for 50 consecutive control steps and the robot has not fallen at any
time in the episode or the hold; a failure during the hold scores 0. Resets granted: {resets}; only the episode after
the last reset is graded. After the agent's first command, a simulator error or a simulator crash inside a control
step is the agent's 0; anything before the first command, a killed service, a failed resume or a reset that does not
rebuild the scene is an infrastructure failure, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families: one upstream G1 task each. `horizon` / `seconds`: bigym/loco/tasks.py episode length / 10 control steps.
# Every family: success = the predicate held for 1 s with no fall in the episode (fall: tilt past ~53 deg or pelvis
# below 0.30 m; it does not end the episode); failure (ends the episode at once, 0): the pelvis more than 10 m from the
# scene's origin, plus the task's own `_fail`.

[families.reach-target-dual]
# envs/reach_target.py ReachTargetDualG1 (L239-): _success L123-127, Target.is_reached L62-72: the gripper's hand
# position (get_hand_pos, the *_end_effector site between the finger pads) within reach_tolerance 0.05 m (tasks.py
# REACH, L133) of the target's centre; the left target for the left gripper, the right for the right. No task _fail.
vars = { horizon = 700, seconds = 14 }
success = """
Success predicate (upstream `ReachTargetDualG1`), both at once: the point between the left gripper's finger pads is
within 5 cm of the red sphere's centre, and the point between the right gripper's pads within 5 cm of the green
sphere's centre (5 cm is the spheres' radius). Held for 1 s (50 consecutive control steps), with no fall in the
episode: the pelvis tilting past about 53° or dropping below 0.30 m makes the episode a failure without ending it.

Failure (ends the episode at once with 0): the pelvis more than 10 m from the scene's origin.
"""

[families.move-two-plates]
# envs/move_plates.py MoveTwoPlatesG1: _success L49-72 for each plate: within _SUCCESSFUL_DIST 0.05 m of a slot site of
# the target rack, its up axis within _SUCCESS_ROT 20 deg of world -y, touching the target rack, not touching the table,
# held by neither gripper; _fail L74-80: a plate touching the floor.
vars = { horizon = "2,300", seconds = 46 }
success = """
Success predicate (upstream `MoveTwoPlatesG1`), for each of the two plates at once:
- its centre is within 5 cm of one of the slots of the right dish rack;
- its face points within 20° of the robot's right as seen from where it starts, the way the plates face at the
  start (a plate turned around does not count);
- it touches the right rack and does not touch the table;
- no finger of either gripper touches it.
Held for 1 s (50 consecutive control steps), with no fall in the episode: the pelvis tilting past about 53° or
dropping below 0.30 m makes the episode a failure without ending it.

Failures (each ends the episode at once with 0): a plate touches the floor; the pelvis is more than 10 m from the
scene's origin.
"""

