schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robosuite-cube-stack-i01"
description = "robosuite cube_stack: produce one replayable trajectory for frozen scene instance 01."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "robosuite", "franka-panda", "code-as-policy", "trajectory", "cube_stack"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robosuite"
robot = "franka-panda"
family = "cube_stack"
tier = "privileged"               # privileged (state-based perception) | perception (RGB-D models)
instance_seed = 1
instance_sha256 = "2a8d7b70e0e4c25d9e8692b250e9bb0114f3b68129d4de25327c679c72191bb8"    # sha256 of tests/instance.npz; CI checks it
image = "robosuite"
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
