# README data for tasks/myosuite/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text: MyoSuite 2.12.2 (MyoHub/myosuite tag v2.12.2 = 5635e1a; the PyPI wheel the
# image installs, read unpacked), files under myosuite/envs/myo/ named in each family's comment; the tooling
# embodied_first_exam/benchmarks/myosuite/:
#   rules       privileged/environment/rcb_myosuite.py: HOLD_S L68, RULE L110-112, TRACK_* L114-116, Session.step
#               L436-491 (hold: `solved` for hold_steps in a row, `done` a failure; event: the first `solved`, bimanual
#               with its contact check L477, L508-512; table_tennis: a lost rally is a failure, L456-457, _rally_lost
#               L681-689; track: judged at track_steps), AGENT_END rules L493-506, baoding's 1000 target points
#               L484-490, replay L560-571 (until the episode ends or the rows run out)
#   privileged  privileged/tests/grade.py main L114-218: missing -> missing_trajectory; not an npz, an entry larger than
#               MAX_ROWS (360 s x STEPS_PER_S, L41-47) allows, wrong family, not (T, nu), T = 0 or > MAX_ROWS, NaN/inf ->
#               0; one fresh-process replay (REPLAY_TIMEOUT_S 780); no result -> replay_failed, grader_error 1;
#               instance hash mismatch -> grader_error 1 (infra_error = grader_error, L50-51)
#   standard    sim/server.py finish() L568-596 (AGENT_END: /finish or timeout run out a begun hold, the last command
#               held, at most hold_steps; at_limit -> step_limit; reason error -> 0), ctrl_step L621-633; reset budget
#               RCB_RESET_BUDGET in environment/docker-compose.yaml (10)
#   realtime    tasks/myosuite/myosuite-table-tennis-i00-realtime/environment/sim/server.py L129-130 (end_judgement
#               "events" for the event rule), the shared rcb_realtime.py / rcb_service.py layer; RCB_SLOWDOWN 1,
#               RCB_RESET_BUDGET 10 in its docker-compose.yaml

[benchmark]
name = "MyoSuite"
citation = "Caggiano et al., 2022"
url = "https://github.com/MyoHub/myosuite"
repo = "MyoHub/myosuite"
commit = "5635e1a"

[license]
text = """
MyoSuite ([MyoHub/myosuite](https://github.com/MyoHub/myosuite), version 2.12.2, tag `v2.12.2` = `5635e1a`) is
released under the Apache License 2.0, as are the models it bundles (MyoSim, the MPL prosthetic arm, the object,
furniture and YCB models). The MyoDex reference motions (the `dex_*` families) derive from the GRAB motion-capture
dataset; MyoSuite asks their users to comply with GRAB's licence, which allows non-commercial scientific research
only. The simulator is MuJoCo (Apache License 2.0).
"""

[robots]
myohand = "MyoHand: musculoskeletal model of the human forearm and hand, 39 muscles"
myoarm = "MyoArm: musculoskeletal model of the human shoulder, arm and hand"
myoarm-torso = "MyoArm with torso: MyoSuite's table tennis player, 273 muscles and two pelvis slides, holding a paddle"
myoarm-mpl = "MyoArm (63 muscles) next to a motorized prosthetic arm (MPL, 17 motors)"
myolegs = "MyoLegs: musculoskeletal model of the human legs and pelvis"
myoleg-osl = "MyoLeg with a powered knee-ankle prosthesis (OSL) on the right leg, 54 muscles"

[modes.privileged]
success = """
Graded file: `/app/output/trajectory.npz` with `actions`, a numeric array with one row per control step and one column
per actuator (muscles first, in the layout the tooling gives), as `s.save_trajectory(...)` writes it, at most
{vars[rows]} rows. After the agent's session it is replayed once, open-loop, from the frozen start in a fresh process
of a separate verifier container without network. The replay runs the rows in order until the episode ends as above;
later rows are not run. If the rows run out before the episode has ended in success, the task fails. A missing file,
a file that is not such an array, a file for another family, a wrong row width, an empty array, more rows than the
limit, a non-finite value, or an `.npz` entry larger than the row limit allows scores 0. A replay that gives no result
(it times out or dies), or a frozen start that does not rebuild with its recorded hash, is reported as
`grader_error` (infrastructure), not as a score.
"""

[modes.standard]
success = """
Graded: the live episode, judged by the simulator service; nothing is replayed. No success signal is shown to the
agent. The episode ends at the agent's `/finish`, at a failure above, at the episode's own end where the rule above
has one, or when the agent's time ({timeout}) runs out. Resets granted: {resets}. A reset starts a new episode from
the frozen start; only the episode running at the end is graded. A simulator error raised by the agent's own call
ends the episode with 0. An episode that does not start from the frozen instance, or a service crash outside the
agent's calls, is an infrastructure failure, not a score.
"""

[modes.realtime]
success = """
Graded: the live episode, judged by the simulator service; nothing is replayed. The clock does not stop: an episode
starts paused at the frozen start, and from the agent's first `submit` one control step runs every 10 ms × S of wall
time (slowdown S = {slowdown}) whether or not the agent sends anything; when the planned rows run out, the last row is
held. No success signal is shown to the agent. The episode ends at the agent's `/finish`, at a failure above, or when
the agent's time ({timeout}) runs out. Resets granted: {resets}. A reset starts a new episode from the frozen start;
only the episode running at the end is graded. After the agent's first command, a simulator error or a simulator crash
inside a control step is the agent's 0; anything before the first command, a killed service, a failed resume or a
reset that does not rebuild the scene is an infrastructure failure, not a score.
"""

