# Generated by scripts/libero-max/generate.py -- edit the template or cases.json, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/{{name}}-privileged"
description = "LIBERO-MAX ({{suite}}, {{event_words}}; Franka Panda): {{instruction_toml}} Mid-task, once the gripper comes within {{trigger_m}} m of the {{trigger_object}}, the scene changes ({{event_words}}). Produce one replayable trajectory of LIBERO's native OSC control steps on a frozen instance; graded by LIBERO's success check at the trajectory's end."
authors = [{ name = "{{author}}" }]
keywords = ["robotics", "libero", "libero-max", "robosuite", "franka-panda", "online-event", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "{{author}}"
author_org = "{{org}}"
task_type = "trajectory"
simulator = "robosuite"
robot = "franka-panda"
family = "libero-max/{{suite}}/{{event}}"
mode = "privileged"
oracle = "full"
instance_seed = {{seed}}             # LIBERO-MAX's policy seed for the case (the scene is the frozen LIBERO-PRO initial state)
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# LIBERO's demonstrations and LIBERO-MAX's policies are public upstream, so the agent reaches the model APIs and nothing
# else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
