schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/live.mp4", service = "sim" },
  { source = "/data/live_timeline.jsonl", service = "sim" },
  { source = "/data/live_segments.jsonl", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robotwin_2_0_place_container_plate-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): RoboTwin 2.0 place_container_plate on the same frozen instance as the privileged task (seed 60417). Place the container onto the plate. The agent only gets a client: /observe (RGB-D video, camera calibration, proprioception) and /submit (joint_position or ee_pose action chunks). No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "robotwin", "sapien", "aloha-agilex", "dual-arm", "standard-mode", "trajectory", "place_container_plate"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "robotwin"
robot = "aloha-agilex"
family = "place_container_plate"
mode = "standard"
protocol = "eai-standard/2.1"
oracle = "full"
instance_seed = 60417
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 3.0
min_memory_gb = 7.0
min_gpu_memory_gb = 8.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "RTX 4090 24GB / L4 24GB"
verifier_min_cpus = 3.0
verifier_min_memory_gb = 6.0
verifier_min_gpu_memory_gb = 8.0
measured = "GPU 6.9 GB oracle peak on RTX 4090, 5.8 GB L4, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: sim p90 3.2 GB, privileged agent container p90 6.4 GB, verifier 4.2 GB, mem_guard (docker memory per container, ws-1, 10-02..10); CPU author estimate"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 13.0
trial_max_memory_gb = 16.0
measured = "GPU: 8.6 GiB on a 48 GB card, 6.9 on 24 GB (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)) -> max(1.5 x peak, peak + 4); memory: agent container docker peak 3.3 GiB over 15 samples (mem_guard (docker memory incl. page cache, top-4 containers every 10 min, ws-1, 10-02..10)) -> max(1.5 x peak, peak + 4, 8), at most the 16 GiB cap; whole trial: + the sim service's 8 GiB (docker peak 4.0 GiB, 23 samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 4.0, memory_gb = 16.0, pids = 8192 }
sim = { cpus = 6.0, memory_gb = 10.0, pids = 8192 }

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "sim"
command = "end=$(( $(date +%s) + 860 )); i=0; while [ $(date +%s) -lt $end ]; do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; if [ -f /data/server.pid ]; then [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; i=$((i + 1)); fi; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL §2.11
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
