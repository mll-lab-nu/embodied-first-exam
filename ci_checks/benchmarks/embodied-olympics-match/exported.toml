# Table tennis on two Unitree G1s (sport tabletennis_g1, a different sport from `tabletennis`'s Franka Panda): Embodied
# Olympics' generated task tabletennis_g1-match-wallclock-program-engineer-standard (core 0.5, which has no exporter of
# its own), turned into one Harbor 0.23.0 task by Embodied First Exam against level 4 (owner 11-01: one task, the hardest opponent). `patched` = the files
# changed from the generated task: the seat unmetered (core/metering/think_clock.py), the session's end decides
# (core/realtime.py collect, core/phases.py, tests/eo_judge/verdict.py: no-show / abandoned, RO_COLLECT_ENDS_MATCH), graded by the live match (core/service.py,
# tests/eo_judge/verdict.py and evidence.py: RO_VERDICT_REPLAY=0), the containers on one network namespace (the
# compose file, environment/Dockerfile: localhost addresses), the instruction's session rule, in the CPU tier (matchcpu) the
# seat without its GPU (the release's GPU serves only its training kit), solution/ro_client.py (the reference plays observe, act, wait in
# lockstep). The x1 world's minimum (sport.toml [machine] min_world_vcpu, VCPUMIN in the release): 12 vCPU passes on a
# Xeon Platinum 8488C (scripts/task_resources.toml); the image's sport.toml is unchanged (its release lock).

