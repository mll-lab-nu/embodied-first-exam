name: Protocol change
description: Propose a change to the task protocol (docs/protocol/) or the eai-standard/3.0 wire protocol (docs/protocol/eai-standard.md, docs/protocol/eai-standard.openapi.yaml).
title: "[protocol] <change>"
labels: ["protocol-change"]
body:
  - type: textarea
    id: motivation
    attributes: {label: Motivation}
    validations: {required: true}
  - type: textarea
    id: change
    attributes: {label: Exact change, description: "Fields, endpoints, rules; for the wire protocol, the /spec capability that says a service offers it."}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Affected tasks and clients, description: "Which tasks, services and clients change, and who updates them."}
    validations: {required: true}
