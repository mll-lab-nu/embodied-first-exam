schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/canvas.png", service = "sim" },            # the replayed main sheet that was scored
  { source = "/data/canvas_practice.png", service = "sim" },   # the replayed practice sheet (never scored)
  { source = "/data/canvas_live.png", service = "sim" },       # the live episode's main sheet
  { source = "/data/canvas_live_practice.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robopaint-strict-lettering-minim-i00-standard"
description = "RoboPaint-strict lettering, STANDARD MODE (robot as a service, eai-standard/2.2): embodied robotic lettering (ManiSkill 3.0.1 Franka Panda holding a broad-edge (chisel) dip pen) on the same frozen instance as the privileged task: copy the lettering shown in the picture target.png onto the main sheet in at most 7 strokes, with a practice sheet for test strokes. The agent only gets a client: get_obs (camera RGB + proprioception), submit (ee_pose or joint_position chunks). No reset, no sheet readout, no pen model, no score; the sim service records the episode, which is replayed twice and scored against the picture (after the best single shift of the sheet, at most 5 mm along each axis: success iff IoU >= 0.86, boundary F within 1 mm >= 0.80, every stroke of the exemplar covered >= 0.75, stray ink <= 0.04 and at most 7 strokes). Process rules (RoboPaint-strict): letter with pen strokes the way a scribe writes; colouring in or filling the letters, zigzag, serpentine or contour-offset fills fail: a pen-tip path on the main sheet longer than 1110 mm made of marks narrower than 0.67 mm on average is colouring in."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "robopaint-strict", "maniskill", "sapien", "lettering", "calligraphy", "broad-edge", "italic", "franka", "standard-mode", "trajectory", "robopaint_strict_lettering_minim"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "maniskill"
robot = "franka-panda"
family = "robopaint_strict_lettering_minim"
mode = "standard"                  # camera RGB + proprioception only; no sheet readout, no score, no reset, no pen model
protocol = "eai-standard/2.2"
oracle = "partial"                # solution/: the privileged oracle's joint targets, streamed through the client
oracle_evidence = "The RoboPaint pair's reference solution, unchanged (solution/ streams the privileged reference's joint targets; its RoboPaint record: the oracle_evidence of robopaint-lettering-minim-i00-standard). The same trajectory scores 1 under the process rules in the strict verifier, whose replay CLI the collect hook runs (ws3, 2026-10-05): path_mm 368 and mark_width_mm 2.25, against the colouring-in limits 1110 mm and 0.67 mm. Harbor oracle and nop runs on one pair per family: docs/benchmarks/robopaint-strict.md (Validation)."
instance_seed = 0
expert_time_estimate_hours = 4.0
difficulty = "medium"          # RoboPaint tiers: line easy; lettering medium (one short word, broad edge) / hard / extreme (pointed pen, long words)
medium = "broad_nib"
hand = "italic"
letters = 5
stroke_count = 7
pen_control = "wrist yaw (pen angle)"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # dump + exit the service, replay twice in fresh processes (+ video), score, write final.json
timeout_sec = 3600

[agent]
timeout_sec = 7200.0              # 2 h of wall clock, same as the privileged twin
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
