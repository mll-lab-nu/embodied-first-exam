# Realtime mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches
# port 8000. No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace. The sidecar
# renders the cameras over EGL on an NVIDIA GPU (physics on the CPU). Crash recovery: the service exits non-zero when it
# crashes, compose restarts the container (same /data) and the service resumes the same episode from its journal.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 10240m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    x-gpu-memory-gb: 5   # GiB   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the shared layer's files
      context: sim
      dockerfile: Dockerfile
    working_dir: /tmp
    command: python /srv/rcb_realtime.py
    restart: on-failure:6          # a resume continues the episode, paused
    environment:
      RCB_INSTANCE: /srv/instance.npz
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "300"   # the scene builds in 1-5 s
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
      RCB_TASK_INFO: /srv/task.json
      PYTHONPATH: /opt/abc-tools/realtime:/srv:/opt/abc:/opt/abc-tools
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-1}"                # S = 1: the world runs at 1/S of real speed
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-10}"        # 10 resets (this benchmark's choice; the mode's default is 0); 0: one episode
      RCB_GL: "${RCB_GL:-auto}"                     # auto: EGL on the GPU when it works, else OSMesa
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
