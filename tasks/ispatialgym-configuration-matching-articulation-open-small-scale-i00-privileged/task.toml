schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "robot-coding-bench/ispatialgym-configuration-matching-articulation-open-small-scale-i00-privileged"
description = "PRIVILEGED MODE: iSpatialGym configuration_matching_articulation_open_small_scale (upstream subtask configuration_matching_articulation_open_small_scale_blender, instance 0). The goal is an image: make the scene look like /app/goal.png, the head camera's view once the task is done. The simulator runs in the agent's container from the frozen start, every object's state readable and resets unlimited, but nothing there holds the goal, a target or a success check; the deliverable is one trajectory, which a separate verifier with the goal replays twice in fresh processes and grades."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "ispatialgym", "spatial-intelligence", "goal-image", "omnigibson", "isaac-sim", "r1pro", "privileged-mode", "trajectory", "configuration-matching"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "ispatialgym"
robot = "r1pro"
family = "configuration_matching_articulation_open_small_scale"
mode = "privileged"                # the simulator in the agent's container; the goal and the success check only in the verifier
dynamics = "static"               # objects move only by the robot or gravity (docs/benchmarks/ispatialgym.md)
oracle = "none"
oracle_evidence = "upstream's goal image of this instance is the last frame of a successful replay of upstream's own demonstration of it (kmy17518/ispatialgym-eval-data@15cb9a7, ispatialgym-eval-instances/README.md, Goal images)"
instance_seed = 0
expert_time_estimate_hours = 1.0

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 6.0
min_memory_gb = 16.0
min_gpu_memory_gb = 6.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 6.0
verifier_min_memory_gb = 16.0
verifier_min_gpu_memory_gb = 6.0
measured = "privileged prototype trials, GPT-6 Luna, RTX 4090, 2026-10-16 (docker stats and nvidia-smi per process every 30 s, 9 trials and their verifiers): the agent container peaked at 14.2 GiB of memory, 14.6 GiB of GPU memory and 12 cores (an agent may run two Isaac processes of about 13 GiB / 4.6 GiB each), the verifier at 14.4 GiB and 12 cores; limits max(1.5 x peak, peak + 4), memory kept at 32 GiB for two processes"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 22.0
max_memory_gb = 32.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 22.0
trial_max_memory_gb = 32.0
measured = "privileged prototype trials, GPT-6 Luna, RTX 4090, 2026-10-16 (docker stats and nvidia-smi per process every 30 s, 9 trials and their verifiers): the agent container peaked at 14.2 GiB of memory, 14.6 GiB of GPU memory and 12 cores (an agent may run two Isaac processes of about 13 GiB / 4.6 GiB each), the verifier at 14.4 GiB and 12 cores; limits max(1.5 x peak, peak + 4), memory kept at 32 GiB for two processes"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 12.0, memory_gb = 40.0, pids = 16384 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 5400               # two fresh-process replays (a scene load + at most 2382 steps each) with margin
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 12
memory_mb = 40960

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
