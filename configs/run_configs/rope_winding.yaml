# rope_winding_physical_handle_demo 的运行模式参数。
#
# 物理与场景参数用点路径覆盖，不在这里：
#   task.winding.direction=cw       方向反转的失败对照例（winding = -turns）
#   task.winding.turns=1            task.winding.wind_radius=0.055
#   task.winding.wind_speed=0.0012  唯一的耗时旋钮（步数 = 段长 ÷ 速度）
#   task.rope.fem.rest_shape=spawn  task.rope.fem.E=200000.0
#   env.genesis.logging_level=warning
#
# 缠绕方向刻意**不**在这里开旋钮：本组的判据是「同一份 task/env 配置配上不同的
# run.* 应当产生相同的物理」，而换方向直接换掉整条轨迹。它是 task.winding.direction。

defaults:
  - default
  - _self_

# 只走缠绕路线的前 N 个路点，用于分段验证（入绕 / 第一圈 / 第二圈 / 放置）。
# null = 走完整条；只有走完整条才装目标端口的 latch，也才做 winding 判定。
max_waypoints: null

# 开场静置步数。
settle_steps: 60

# 手跟不上规划点时不中止（跟随误差与绳接触的安全判定仍然生效）。
allow_target_lag: false

# 低分辨率绳：把网格与求解迭代降一档，用于快速看轨迹是否正确。
# 具体数值在 task 配置的 rope.lite 块里。
lite: false

# 每 N 步采一次诊断量并打印 PROBE 行：手的实际速度、插头高度、绳的最低节点、
# 绳的展开度与单步跳变、**实时 winding number**、柱面接触粒子数。
probe: false
probe_every: 15

# 运动步数的缩放。两者都按 1.0 时是正常物理。
viewer_speedup: 1.0
slow_factor: 1.0

# --- 变体（2026-09-05）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）：
#   run.randomize_layout=true run.seed=3
# 默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进日志与 episode 元数据的变体标识（角点 sweep 用 corner_<id>）。
variant_id: default
# 录制 H5 数据集到该路径。null = 不录。
record_dataset: null
dataset_every_n_steps: 10
