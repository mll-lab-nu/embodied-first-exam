[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 13.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 32.0
measured = "the v5 pilot's seat caps (6 cores, 16 GB, processes 512: design default); whole trial: + the sim's and the practice service's 8 GB caps; provisional"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 6.0, memory_gb = 16.0, pids = 8192 }
sim = { cpus = 6.0, memory_gb = 8.0, pids = 256 }
practice = { cpus = 4.0, memory_gb = 8.0, pids = 256 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 101
allowed = [101]
oracle = [101]

[verifier]
timeout_sec = 3960.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running (a program would keep playing; the match is graded as it stands).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then SIGUSR1 ends the match: the service writes the verdict of the live match ("graded_ready"; no grading replay,
# board 0151), then the spectator video (replay.mp4), then the walking-policy audit (sim/audit/policy_fingerprint.py),
# which replays the match only when seat A won it live: it can only take a win away (tests/fexam_reward.py).
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 1800); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000; timeout 1100 python3 /srv/audit/policy_fingerprint.py /data/episode.jsonl /srv --every 20 --out /data/fingerprint.json > /data/fingerprint.log 2>&1; tail -c 400 /data/fingerprint.log; exit 0"
timeout_sec = 3780

[agent]
timeout_sec = 14400
# The agent reaches the model APIs, the package registries, the match service (localhost:8000) and its practice service
# (localhost:8100) under Harbor's egress control.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 6
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
