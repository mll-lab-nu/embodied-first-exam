defaults:
  - blanket_flatten_cross_twist
  - _self_

task:
  preparation:
    fold_target: nested_arcs
    inner_fold_radius_m: 0.0045
    preparation_layer_clearance_m: 0.009
    folds:
      - {name: diagonal_corner, normal_xy: [1.0, 1.0], fraction: 0.80, angle_deg: 175.0, seconds: 2.0}
      - {name: longitudinal_1, normal_xy: [1.0, 0.0], fraction: 0.50, angle_deg: 178.0, seconds: 3.5}
      - {name: transverse_1, normal_xy: [0.0, 1.0], fraction: 0.68, angle_deg: 178.0, seconds: 3.5}
      - {name: longitudinal_2, normal_xy: [-1.0, 0.0], fraction: 0.50, angle_deg: 170.0, seconds: 3.0}
    twist_angle_deg: 240.0
    twist_axial_scale: 0.80
    twist_seconds: 5.0
    twist_end_fraction: 0.12

run:
  output: runs/environment_bootstrap/blanket_flatten/corner_cross_twist_v8
