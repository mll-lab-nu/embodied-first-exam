schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/ticks.f64", service = "sim" },
  { source = "/data/calls.jsonl", service = "sim" },
  { source = "/data/submitted.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/bigym2-drawer-top-open-i00-standard-realtime"
description = "STANDARD-REALTIME MODE (robot as a service on a clock that does not stop, eai-standard/2.3): BiGym 2.0 drawer-top-open on the same frozen instance as bigym2-drawer-top-open-i00-privileged. Open the top drawer of the kitchen cabinet. Time does not stop: once the episode starts, the robot runs at 50 Hz in real time and holds its last command (standing still) while the agent thinks, so the agent streams whole-body commands from a controller program of its own through the client (the robot's three onboard cameras and its proprioception). One episode, no reset, no object state, no success signal; the sim service records every executed control step, replays them in a fresh simulator and grades the episode with BiGym's own success check."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "bigym2", "mujoco", "unitree-g1", "humanoid", "standard-realtime-mode", "trajectory", "drawer-top-open"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "bigym2"
robot = "unitree-g1-dex1"
family = "drawer-top-open"
mode = "standard-realtime"
protocol = "eai-standard/2.3"
instance_seed = 0
expert_time_estimate_hours = 3.0
oracle = "none"
oracle_evidence = "no reference solution (BiGym 2.0 ships no expert or planner; its demonstrations and its agents' programs stay off the agent's network); positive example graded 1 by the separate verifier: bigym2-drawer-top-open-i00-privi__BR52Quk (run codex-gpt6_luna-medium, 2026-10-08, on an earlier text of the privileged task; regraded by its current verifier); human review in PR #123"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; for i in $(seq 1 400); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; [ $((i % 15)) -eq 1 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator, but BiGym 2.0's demonstrations and its agents' programs are public: the agent
# reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0
