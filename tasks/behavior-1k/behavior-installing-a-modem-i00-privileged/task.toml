schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/behavior-installing-a-modem-i00-privileged"
description = "BEHAVIOR-1K v3.9.2 (2026 BEHAVIOR Challenge) installing_a_modem (R1Pro mobile manipulator, OmniGibson / Isaac Sim): produce one replayable trajectory. Install the modem. A modem, switched off, sits on the coffee table in the living room; the room also has two cabinets and a television. Switch the modem on and put it on the same cabinet as the television, next to it. Frozen scene instance (challenge public_test instance 301)."
keywords = ["robotics", "behavior", "omnigibson", "isaac-sim", "r1pro", "mobile-manipulation", "code-as-policy", "trajectory", "installing_a_modem"]

[metadata]
task_type = "trajectory"          # trajectory | policy   (see docs/protocol/README.md)
simulator = "behavior"            # BEHAVIOR-1K v3.9.2 = OmniGibson 3.9.2 on Isaac Sim (the 2026 challenge stack)
robot = "r1pro"
family = "installing_a_modem"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
replays = 3                       # fresh-process replays, any success counts (docs/protocol/README.md §4): the simulator
                                  # does not replay bit-wise
oracle = "none"
oracle_evidence = "No reference solution and no verified positive example yet: BEHAVIOR-1K ships no expert or planner that replays on this frozen instance, and no model trial has solved this task. Solvable by a human with this robot: the 2026 BEHAVIOR Challenge publishes 200 teleoperated demonstrations of this activity on the R1Pro in this scene model (80 s on average); demonstration video (63 s): https://www.youtube.com/embed/zHEfUkrCWfc (challenge task list https://behavior.stanford.edu/challenge/tasks/index.html). Supplementary task (added 2026-10-07); human review in PR #75 (protocol §4)."
instance_seed = 301               # scene = environment/instance.json (2026 challenge public_test instance 301 + its state hash); identity = dataset.toml digest
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 113800.0            # up to 3 fresh-process replays, each capped at 28000 s by tests/grade.py (1200 s start
                                  # + 1.5 steps/s for at most 40,000 rows, floor 3600 s), + the video replay after the verdict
                                  # (the same cap: PROTOCOL §4) + 30 min (tests/grade.py VERIFIER_TIMEOUT_S); slowest replay
                                  # measured: 1.88 steps/s (filmed, 2026-10-09), Isaac start up to 1,115 s
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # PROTOCOL H.6: the verifier has no network

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 7200.0             # BEHAVIOR budget: every Python process pays ~3 min of Isaac Sim + scene load, ~10 steps/s (tasks/behavior-1k/README.md)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 29696
storage_mb = 32768
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
