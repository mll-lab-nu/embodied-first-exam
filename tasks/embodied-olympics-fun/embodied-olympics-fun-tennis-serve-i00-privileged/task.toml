schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-tennis-serve-i00-privileged"
description = "Embodied Olympics tennis-serve (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Serve: from behind your baseline, release the tennis ball from your left hand, strike it with the racket held in your right hand before it reaches the ground, and send it over the net into the service box diagonally opposite. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "tennis-serve"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "tennis_serve"
category = "basketball-and-rackets"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 10.0
oracle = "full"
oracle_evidence = "Reference: an underarm key-pose technique with the H1-2's own Inspire hands at their default forces (20 N per fingertip, 30 N the thumb; the racket's handle across the right palm, the ball in the left hand; no weld), the right arm's swing keys, three key times and the release searched by CMA-ES (any arm more than 3 mm into the body rejected), then a narrow search around the first success. The left hand opens at 1.27 s while the robot stands at rest, the racket meets the ball and sends it off at 12.3 m/s over the net into the box at (14.40, 2.22); success at 3.20 s; deepest self-overlap 0.1 mm; live, replay and the state hash agree. It is fragile in time: it also succeeds with all servo gains x0.97 and x1.03, but the key times 10 ms earlier or later miss (0 of 2). Measured: success after 3.2 s of the 20 s limit, live and in a fresh replay, ending in the same state."

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
