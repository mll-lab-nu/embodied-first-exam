# Generated by scripts/autobio/generate.py -- edit the generator, the shared sources, families.json or the instance, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/autobio-pickup-i00-privileged"
description = "AutoBio pickup (Pick up centrifuge tube; a biology laboratory bench on MuJoCo): produce one replayable trajectory of joint position targets. Pick up the 50 mL centrifuge tube that stands in the rack. Frozen scene instance (AutoBio's reset, seed 0); graded by two fresh-process replays with AutoBio's own check."
authors = [{ name = "Canyu Chen" }]
keywords = ["robotics", "autobio", "mujoco", "laboratory", "biology", "aloha-2-arm", "code-as-policy", "trajectory", "pickup", "privileged"]

[metadata]
author_name = "Canyu Chen"
task_type = "trajectory"
simulator = "autobio"             # AutoBio @ 0850421 on MuJoCo 3.3.0 (CPU)
robot = "aloha-2-arm"
family = "pickup"
mode = "privileged"
oracle = "full"
difficulty = "easy"              # AutoBio's own level for the task
success_rule = "first"
instance_seed = 0                 # AutoBio's reset(seed=0) of Pickup
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# AutoBio's scripted experts are in its public repository and its recorded demonstrations on Hugging Face (and a
# standard-mode agent could rebuild the simulator from the repository): the agent reaches the model APIs and nothing
# else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
