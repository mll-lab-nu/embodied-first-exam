# Generated by scripts/myosuite/generate.py -- edit the generator, the shared sources or the instance facts, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/myosuite-bimanual-i00-privileged"
description = "MyoSuite bimanual (MyoArm + MPL, 63 muscles, MuJoCo): produce one replayable trajectory of actuator commands. Hand the object over: pick it up with the MyoHand, pass it to the prosthetic hand, and place it on the goal pillar. Frozen scene instance (myoChallengeBimanual-v0, reset seed 0); graded by two fresh-process replays."
authors = [{ name = "Chi Gui" }]
keywords = ["robotics", "myosuite", "mujoco", "musculoskeletal", "myoarm-mpl", "code-as-policy", "trajectory", "bimanual", "privileged"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"
simulator = "myosuite"            # MyoSuite 2.12.2 on MuJoCo 3.6.0 (CPU)
robot = "myoarm-mpl"
family = "bimanual"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): scripts/task_dynamics.toml
oracle = "none"
oracle_evidence = "no positive example yet (two model attempts failed: Codex + GPT-6 Luna, effort high, run `codex-gpt6_luna-high` and Claude Code + Claude Opus 5.5 (run `claude_code-claude_opus_5_5-default`, 2026-10-06)); the task is reported separately until one exists (PROTOCOL §7, Open 4); human review in PR #65"
instance_seed = 0                 # myoChallengeBimanual-v0: seed(0), then reset(seed=0)
expert_time_estimate_hours = 4.0

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 2.0
min_memory_gb = 8.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 2.0
verifier_min_gpu_memory_gb = 0.0
measured = "memory: privileged container median 6.2 GB, sim p90 1.4 GB, verifier 1.4 GB, mem_guard (docker memory per container, an RTX 4090 workstation, 10-02..10); CPU-only; CPU author estimate"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 10.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 10.0
measured = "memory: the [environment] cap 8 GiB, which every past trial ran under (docker peak 8.0 GiB over 18 samples, mem_guard (docker memory incl. page cache, top-4 containers every 10 min, an RTX 4090 workstation, 10-02..10)); processes 512 and disk 10 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 4.0, memory_gb = 12.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# The agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS). MyoSuite's
# trained baselines ship in its PyPI wheel (and a standard-mode agent could rebuild the simulator from it): reachable
# since 2026-10-11, left to the instruction's honour rule (PROTOCOL §2.11).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 12288

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
