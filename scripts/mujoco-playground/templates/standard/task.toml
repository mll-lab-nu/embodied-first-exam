# Generated by scripts/mujoco-playground/generate.py -- edit the template or the instance, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/video.log", service = "sim" },             # the collect hook's video pass, which renders replay.mp4
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{name}}-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): MuJoCo Playground {{env}} ({{robot_name}}) on the same frozen instance as {{name}}-privileged: {{task_toml}} The agent only gets a client: four cameras that follow the robot (RGB, optional depth), the robot's joints and IMU, joint position chunks at 50 Hz, the feet's kinematics; {{resets}} resets (only the last episode is graded), no world state; the sim service records the episode and grades it live (no grading replay)."
authors = [{ name = "{{author}}" }]
keywords = ["robotics", "mujoco", "mujoco-playground", "{{robot_tax}}", "quadruped", "locomotion", "{{kind}}", "code-as-policy", "trajectory", "standard-mode"]

[metadata]
author_name = "{{author}}"
author_org = "{{org}}"
task_type = "trajectory"
simulator = "mujoco"
robot = "{{robot_tax}}"
family = "mujoco_playground/{{env}}"
mode = "standard"
protocol = "eai-standard/2.2"
oracle = "full"
instance_seed = {{seed}}
expert_time_estimate_hours = {{expert_hours_std}}

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, write the live verdict into final.json, then the video
timeout_sec = 1200                # the service's end (<= 900 s) + one video pass of at most the horizon (finalize.sh: RCB_COLLECT_BUDGET_S)

[agent]
timeout_sec = {{agent_timeout}}.0
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
