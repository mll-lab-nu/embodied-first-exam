# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: slotted_post_ring_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: slotted-post-ring-hard-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Free the removable metal ring from the slotted post and cord assembly.
      Place the entire ring inside the green dashed goal area and hold it still
      briefly. Keep the post, cord, beads, discs and other puzzle components outside
      the area on the puzzle/system side. Holding the target with the gripper is allowed.
    simulator:
      task_id: slotted_post_ring
      robot_id: auto
      variation_id: hard
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
