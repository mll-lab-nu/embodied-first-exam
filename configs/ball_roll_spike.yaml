# tests/ball_roll_spike.py 的主配置。
#
# env 用 world_tabletop_v1：与 fem_ipc_rope_spike 不同，本脚本**要**走 tabletop 预设，
# 因为它量的就是球在那张桌面上、按那组 sim 参数（dt=0.01 / substeps=4）的滚动行为。
# 换一组 sim 参数量出来的数不能用来定 4.1 的围栏尺寸。

defaults:
  - config
  - override task_configs@task: gate_cage_ball_topogym_tabletop_v1
  - override env_configs@env: world_tabletop_v1
  - override run_configs@run: ball_roll_spike
  - _self_
