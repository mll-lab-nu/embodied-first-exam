defaults:
  - config
  - override task_configs@task: staged_lock_topogym_tabletop_v1
  - override env_configs@env: world_tabletop_v1
  - override run_configs@run: staged_lock
  - _self_
env:
  preset:
    locked: false
  genesis:
    backend: cuda
  sim:
    dt: 0.005
    substeps: 4
  cameras:
    front:
      res: [1280, 720]
      pos: [1.20, 0.0, 1.65]
      lookat: [-0.10, 0.10, 1.13]
      up: [0, 0, 1]
      fov: 52
      near: 0.01
      far: 12.0
    side_oblique:
      res: [1280, 720]
      pos: [-0.45, -1.18, 1.57]
      lookat: [-0.10, 0.12, 1.25]
      up: [0, 0, 1]
      fov: 50
      near: 0.01
      far: 12.0
    lock_detail:
      res: [960, 540]
      pos: [-0.20, -0.65, 1.36]
      lookat: [0.32, 0.20, 1.105]
      up: [0, 0, 1]
      fov: 35
      near: 0.01
      far: 12.0
    wrist:
      res: [640, 360]
      # Same +z forward convention as the other tasks, mounted on the opposite
      # flange face: local -x is above this task's horizontal grasp.
      fov: 75
      attach:
        offset_pos: [-0.080, 0.000, 0.025]
        offset_lookat: [0.000, 0.000, 0.350]
        offset_up: [-1.0, 0.0, 0.0]
robot_control:
  ik:
    max_solver_iters: 200
recording:
  enabled: true
  fps: 20
  every_n_steps: 10
