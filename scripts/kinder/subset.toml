# KinDER subset -- the single source for every tasks/kinder-* directory (`gen_tasks.py render` writes them).
#
# Which tasks: KinDER's Dynamic3D tasks (MuJoCo, a TidyBot++ mobile manipulator) whose goal a camera can see or a
# sentence can name, and (the section at the end) the families a screening of all of KinDER found hard, one variant
# each (docs/benchmarks/kinder.md). Each ships twice: full mode (tasks/kinder-<family>-i00: the simulator and its
# state, one replayable trajectory) and limited mode (-limited: the robot as a service, its own sensors only).
#
# task_statement is all an agent is told about the goal, in both modes, so it must name the goal exactly as KinDER
# checks it (the task JSON's goal_state): which objects, which place, and when it counts. It says what is visible;
# never how to do it.
#
# Every MuJoCo task is set in KinDER's MimicLabs lab (rcb_kinder.SCENE_BG: images only, the physics is the same bit for bit).
# task_view is the camera limited mode serves as room_camera; a task sets it here only where upstream's own looks
# down from high overhead, which would hand the agent a map: a camera where a lab would put one instead, looking
# down less than 45 degrees.

[defaults]
instance_tag = "i00"
seed = 0                  # KinDER draws the scene from this seed; the instance pins it (instance.json)
max_steps = 1000          # upstream's episode length for these tasks (TidyBot3DConfig.horizon): 100 s at 10 Hz
agent_timeout_sec = 3600
verifier_timeout_sec = 900
# The only hosts the agent may reach, both modes: the model APIs (Codex with a ChatGPT login, the OpenAI and
# Anthropic APIs, OpenRouter). KinDER and its baselines are public: anything more lets a limited-mode agent install the
# simulator it is not given, and either mode fetch upstream's planners (docs/LEAKAGE.md).
agent_allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com",
                       "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[[task]]
family = "tossing"
env_id = "kinder/Tossing3D-o1-v0"
task_view = { position = [1.0, -2.6, 2.4], lookat = [1.4, 1.2, 0.2], fovy = 65 }   # upstream: 5.5 m up, 72 deg down
expert_hours = 3.0
task_statement = """get the green cube lying on the floor into the yellow bin on the far side of the low wall that
runs across the room. The task succeeds the moment the cube's centre is inside the bin's goal region, the translucent
green box marked in the bin."""

[[task]]
family = "balance-beam"
env_id = "kinder/BalanceBeam3D-o3-v0"
expert_hours = 3.0
task_statement = """put the two small green cubes and the larger dark-red cube on the seesaw so that it balances. The
task succeeds the moment all three cubes' centres are inside the translucent green region marked on the seesaw's
beam and the beam is within 5° of level."""

[[task]]
family = "dynamo"
env_id = "kinder/Dynamo3D-o3-v0"
task_view = { position = [-1.0, -1.2, 2.8], lookat = [2.2, 1.9, 0.0], fovy = 70 }  # upstream: 6.75 m up, straight down
expert_hours = 2.0
task_statement = """drive the robot into the translucent green square marked on the floor; three chairs stand in the
way and can be pushed. The task succeeds the moment the centre of the robot's base is inside the square. (The red, blue
and yellow squares only mark where the chairs started.)"""

[[task]]
family = "sweep-into-drawer"
env_id = "kinder/SweepIntoDrawer3D-o5-v0"
expert_hours = 4.0
task_statement = """get the five small dark-red cubes on top of the kitchen island into the middle drawer of the
island's upper row of drawers, which starts closed; a wiper lies next to the cubes. The task succeeds the moment all
five cubes' centres are inside that drawer, each at least 2.5 cm from the drawer's two side walls."""

[[task]]
family = "scoop-pour"
env_id = "kinder/ScoopPour3D-o30-v0"
expert_hours = 4.0
task_statement = """move all 30 small dark-red cubes from the yellow bin into the green bin; a scoop is in the
scene. The task succeeds the moment every cube's centre is inside the green bin, at least 1 cm from each of its inner
walls and at least 0.5 cm below its rim."""

[[task]]
family = "shelf"
env_id = "kinder/Shelf3D-o2-v0"
expert_hours = 3.0
task_statement = """pick up the dark-red cube and the dark-green cube from the floor and put both in the top compartment
of the brown cupboard, which has three compartments one above another. The task succeeds the moment both cubes rest on
that compartment's floor."""

# ----------------------------------------------------------------------------------------------------------------------
# From the screening (09-29, GPT-6 Luna once per mode on every KinDER family): the ones it failed in limited mode. The
# variant is the hardest that upstream's baselines (kinder-baselines) configure. Where upstream sets no episode length
# (PyBullet), max_steps is its baselines' evaluation horizon for the variant, else their default 3000.
# `limited_statement` is the limited twin's goal sentence where the full one names the goal by world coordinates or
# state names, and must name the same goal.

[[task]]
family = "constrained-cupboard"
env_id = "kinder/ConstrainedCupboard3D-o6-v0"
expert_hours = 4.0
task_statement = """put the six brown rods lying on the floor (30 cm long) into the six 40 cm-tall compartments of the row
of eleven narrow cupboards standing side by side, one rod each, as the state names pair them: rod `cuboid_i` into
cupboard `cupboard_i` for i = 0 to 5, whose tall compartment is the upper one in `cupboard_0` to `cupboard_2` and the
lower one in `cupboard_3` to `cupboard_5`. The task succeeds the moment every rod's centre is inside its compartment:
above that compartment's shelf, below the shelf over it, and within the cupboard's 10 cm width and 30 cm depth."""
limited_statement = """put the six brown rods lying on the floor (30 cm long) into the row of eleven narrow cupboards standing
side by side ahead of the robot, one rod each, each into a cupboard's 40 cm-tall compartment: taking the rods in order of
their distance from where the centre of the robot's base starts, nearest first, they go into the 11th, 5th, 2nd, 8th,
4th and 1st cupboard of the row, counted from the robot's left as it faces the row at the start. The task succeeds the
moment every rod's centre is inside its compartment: above that compartment's shelf, below the shelf over it, and
within the cupboard's 10 cm width and 30 cm depth."""

[[task]]
family = "sweep-simple"
env_id = "kinder/SweepSimple3D-o10-sweep_the_blocks_to_the_left_side_of_the_kitchen_island-v0"
expert_hours = 3.0
task_statement = """get the ten small dark-red cubes scattered on the floor into the translucent grey box marked on the
floor at the end of the kitchen island (the free-standing white-topped counter) nearest the robot; a wiper stands on the
floor next to the cubes. The task succeeds the moment all ten cubes' centres are inside that box."""

[[task]]
family = "sort-blocks"
env_id = "kinder/SortClutteredBlocks3D-o4-sort_the_cluttered_blocks_into_bins-v0"
expert_hours = 3.0
task_statement = """sort the four small cubes clustered in the middle of the white table into the four open bins on it by
colour: the dark-red cube into the red bin, the dark-green one into the green bin, the dark-blue one into the blue bin
and the yellow one into the yellow bin. The task succeeds the moment every cube's centre is inside the bin of its own
colour, at least 1 cm from each of its inner walls, at least 1 cm below its rim and at least 0.5 cm above its floor."""

[[task]]
family = "obstruction-3d"
env_id = "kinder/Obstruction3D-o4-v0"
max_steps = 3000
expert_hours = 4.0
task_statement = """put the purple block (`target_block`) on the thin purple pad on the wooden table (`target_region`); three
of the four small red blocks (`obstruction0`, `obstruction1`, `obstruction3`) sit on the pad and the fourth
(`obstruction2`) is elsewhere on the table. The task succeeds the moment the robot holds nothing, the block's underside
is within 5 mm of the pad's top surface, and all four of its bottom corners lie within the pad's outline enlarged by
5 mm on every side."""
limited_statement = """put the purple block on the thin purple pad on the wooden table; three of the four small red blocks
sit on the pad and the fourth is elsewhere on the table. The task succeeds the moment the robot holds nothing, the
block's underside is within 5 mm of the pad's top surface, and all four of its bottom corners lie within the pad's
outline enlarged by 5 mm on every side."""

[[task]]
family = "packing-3d"
env_id = "kinder/Packing3D-p3-v0"
max_steps = 3000
expert_hours = 4.0
task_statement = """put the three flat green parts on the grey table, a square (`part0`) and two right triangles (`part1`,
`part2`), each with a small red peg on top, into the purple tray in the middle of the table (`rack`). The task succeeds
the moment the robot holds nothing and every part rests in the tray: its flat body (peg excluded) lies within the
tray's inner outline, its underside is within 5 mm of the tray floor's height and its top is no more than 5 mm above
the tray's rim, it is within 5 mm of the tray without penetrating it, and no two parts (pegs included) overlap."""
limited_statement = """put the three flat green parts on the grey table, a square and two right triangles, each with a small red
peg on top, into the purple tray in the middle of the table. The task succeeds the moment the robot holds nothing and
every part rests in the tray: its flat body (peg excluded) lies within the tray's inner outline, its underside is
within 5 mm of the tray floor's height and its top is no more than 5 mm above the tray's rim, it is within 5 mm of the
tray without penetrating it, and no two parts (pegs included) overlap."""
