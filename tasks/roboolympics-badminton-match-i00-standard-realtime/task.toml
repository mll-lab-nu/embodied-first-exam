schema_version = "1.3"
artifacts = [
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/roboolympics-badminton-match-i00-standard-realtime"
description = "STANDARD-REALTIME (RoboOlympics): robot badminton against a scripted opponent, program play (eai-standard-realtime/1.0, world slowed 10x, opponent level 1, seed 101): robot singles badminton on a regulation court in real time (slowed down): a Franka Panda arm with a racket on an x-y sliding base, a point-mass shuttle with high quadratic drag (terminal speed 6.8 m/s) and no bounce, a racket contact law; first to 5 points, rally scoring; the players' robots serve (the rally winner serves next): the server tosses the shuttle (from rest or rising up to 0.5 m) at a point it chooses and hits it underhand, below 1.15 m, into the diagonal service court; format match-wallclock: you against a scripted computer opponent (levels 1-2, `game spec` match.opponent_level), format duel-wallclock: two players. Generated by RoboOlympics tools/generate.py --upstream from task badminton-match-wallclock-program-standard (core 0.2)."
authors = [{ name = "RoboOlympics" }]
keywords = ["program-play", "badminton", "sports", "realtime", "vision", "roboolympics-v0.2", "roboolympics"]

[metadata]
revision = "badminton-wallclock-5+duel-7+core-0.2"
author_name = "RoboOlympics"
task_type = "trajectory"
simulator = "mujoco"
robot = "franka-panda"
family = "badminton_match"
mode = "standard-realtime"
protocol = "eai-standard-realtime/1.0"
play = "program"
action_level = "high"
oracle = "full"
oracle_evidence = "solution/: the sport's reference player (camera images and /spec only); tools/check runs it live and it wins the default configuration"
instance_seed = 101
opponent_level = 1
slowdown = 10
source_task = "roboolympics/badminton-match-wallclock-program-standard"
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 240); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 700

[agent]
timeout_sec = 7200.0
# egress: the model APIs only (the agent reaches the sim at localhost:8000 through Harbor's egress control)
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
