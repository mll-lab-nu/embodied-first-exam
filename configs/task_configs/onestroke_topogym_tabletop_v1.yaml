# OneStroke 布局，使用 TopoGym tabletop V1 task 坐标系。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。

task:
  id: onestroke
  difficulty: smoke

coordinate_frame: task

board:
  name: onestroke_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

grid:
  rows: 3
  cols: 3
  # table/task 坐标系下左上角 cell 的中心点。
  top_left_cell_pos: [-0.180, 0.075, 0.007]
  cell_size: [0.058, 0.058, 0.014]
  # 物理插墙需要真实横向余量：wall block 薄边现在是 12 mm。
  # 44 mm gap 给每侧约 16 mm 余量，避免夹爪下降/释放时擦到相邻色块，
  # 也让录像里能清楚看出 wall 是否落在两个色块之间。
  cell_gap: 0.044
  colors:
    - [[1.00, 0.16, 0.10], [1.00, 0.16, 0.10], [0.72, 0.74, 0.76]]
    - [[1.00, 0.16, 0.10], [0.72, 0.74, 0.76], [0.00, 0.55, 1.00]]
    - [[0.72, 0.74, 0.76], [0.00, 0.55, 1.00], [0.00, 0.55, 1.00]]

puzzle:
  color_a: A
  color_b: B
  empty_label: gray
  labels:
    - [A, A, gray]
    - [A, gray, B]
    - [gray, B, B]

wall_block:
  # 长度略短于 cell 边长 58 mm，给端部留下余量，避免释放后被相邻色块边角挤歪。
  size: [0.050, 0.012, 0.022]
  color: [0.02, 0.06, 0.10]
  count: 5

supply:
  name: supply_tray
  enabled: false
  pos: [0.095, -0.005, 0.003]
  size: [0.085, 0.335, 0.006]
  color: [0.92, 0.92, 0.94]
  block_start_pos: [0.095, 0.120, 0.011]
  block_spacing: 0.060

edge_slots:
  width: 0.014
  length_padding: 0.010
  height: 0.004
  collision: false
  visualization: false
  # 默认保持真实凹槽：collision=false，不在两个色块之间生成隐形平台。
  # 若将 collision 改成 true，则会生成不可见承托体用于诊断稳定放置。
  z: 0.012
  color: [0.02, 0.06, 0.10]
  targets:
    - {name: target_edge_0, index: 0, cell_a: [0, 1], cell_b: [0, 2]}
    - {name: target_edge_1, index: 1, cell_a: [0, 1], cell_b: [1, 1]}
    - {name: target_edge_2, index: 2, cell_a: [1, 0], cell_b: [1, 1]}
    - {name: target_edge_3, index: 3, cell_a: [1, 0], cell_b: [2, 0]}
    - {name: target_edge_4, index: 4, cell_a: [1, 1], cell_b: [1, 2]}

oracle:
  supply_pick_z: 0.151
  carry_z: 0.300
  insert_z: 0.081

physical:
  finger_links: [left_finger, right_finger]
  finger_friction: 1.4
  wall_friction: 1.0
  noslip_iterations: 5
  settle_steps: 50
  motion_steps: 115
  gripper_steps: 65
  close_hold_steps: 35
  motion_settle_steps: 30
  place_hold_steps: 60
  release_hold_steps: 100
  # 松爪后先原地小幅上抬，让手指脱离 wall block，再进入正常 retreat；
  # 这是机械臂动作，不是对 wall block 做 set_pose。
  release_lift_clearance: 0.030
  release_lift_steps: 55
  lift_check_delta: 0.05
  min_lift_delta: 0.020
  max_grasp_xy_error: 0.025
  place_tolerance_xy: 0.010
  place_tolerance_z: 0.006
  place_tolerance_yaw: 0.12
  place_tolerance_tilt: 0.18
  grasp_yaw_offset: 1.57079632679
  # 释放姿态的 yaw 预补偿。默认保持 0，让夹爪按几何边界平行放下；
  # 若某个 runtime 有稳定释放偏航，可用 CLI --target-yaw-bias 做诊断覆盖。
  target_yaw_bias: 0.000
  # world/task XY 下的物理释放目标补偿。几何目标仍然是两个相邻 cell center 的中点；
  # 这里给 +x 方向 6 mm 预补偿，用来抵消释放后 wall block 稳定向 -x 漂移的趋势。
  # 若某个 Genesis/runtime 漂移方向不同，可用 CLI --target-xy-bias 做单次覆盖。
  target_xy_bias: [0.006, 0.000]
  release_clearance: 0.000
  placement_preload: 0.001
