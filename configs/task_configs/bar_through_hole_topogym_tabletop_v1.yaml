# Bar Through Hole layout expressed in the TopoGym tabletop V1 task frame.
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# docx 2.3：刚性杆水平穿过隔板上的孔。防捷径 = 面板矮到可以把杆从上方绕过去，
# 终点位置相近但两端同侧，判失败。因此面板高度是任务设计的一部分，不是随手取值。
#
# 2026-08-12 三处修订：
#   1. 杆与孔都改成正六棱柱。六边形按 across_flats（对边距）标注 —— 六角棒料与
#      六角孔在工业上就是按对边距给尺寸的。取平面朝下的姿态：杆躺在一个面上不会滚，
#      所以起止托座不再需要防滚挡块，也因此落座时杆轴高出孔下沿一个 inradius。
#   2. 杆变细：对边距 0.018（对角 0.0208），此前是直径 0.024 的圆柱。
#   3. 场景放开：面板加宽、孔与杆的间隙加大、抓取点与托座拉开、各方向净空加大。

task:
  id: bar_through_hole
  difficulty: smoke

coordinate_frame: task

# ---------------------------------------------------------------- 面板（隔板）
# 孔为正六边形，由凸块组合而成：4 块框（左右立柱 + 下槛 + 上楣）围出六边形的
# 外接矩形，再由 4 块沿斜边旋转的倒角块削去四个角三角形。不用带孔 mesh：
# gs.morphs.Mesh(convexify=True) 会把孔填实（见 tasks/routing/cable_routing.py
# 的 _add_routing_post docstring）。
panel:
  enabled: true
  # 面板中平面的 x。EE 全程停在 x < panel.x 一侧，前臂不越过面板——
  # cable_routing 的教训是绕到障碍物 +x 侧会让前臂横扫过去（净空只剩 14mm）。
  x: 0.130
  thickness: 0.030
  # 0.240 → 0.280 → 0.400：隔板加长，读起来是一堵墙而不是一块窄立板。
  # 沿 y 加长不影响任何既有余量：EE 全程在 y≈0，桌面 y 跨度 1.400（±0.700）。
  # 高度不能一起加，见下方 top_z。
  width: 0.400
  # 顶面 150mm。上限由 home pose 决定：默认 home 指尖在 task z≈0.1608，
  # 高于它就会像 stacked_plate 那样在 reset 时扎进结构 → 求解器 NaN。留 11mm 余量。
  top_z: 0.150
  color: [0.42, 0.45, 0.48]

aperture:
  # 正六边形对边距 0.032（对角 0.0370）。杆对边距 0.018 → 单边间隙 7mm，
  # 比改动前的 6mm 更松，且杆更细，整体余量明显放开。
  across_flats: 0.032
  # 孔中心高度。孔跨 z [0.070, 0.102]。
  center_z: 0.086
  # 倒角块超出角三角形的外扩量，纯粹为了埋进框里、不留缝。
  corner_overlap: 0.004

# ------------------------------------------------------------------------ 杆
bar:
  # 正六棱柱，对边距 0.018 / 对角 0.0208。改动前是直径 0.024 的圆柱。
  across_flats: 0.018
  # 0.180 → 0.200：配合放开后的布局，穿过后两端各留更多。
  length: 0.200
  # 铝的量级。assisted attachment 运动学承载，质量不与夹爪较劲，
  # 因此按 physical_realism_guidelines_zh.md P7「密度用真实材料量级」取值。
  rho: 2700.0
  color: [0.72, 0.74, 0.77]
  # 生成的棱柱网格落点（相对仓库根，由 rope.resolve_mesh_dir 解析）。
  mesh_output_dir: runs/generated_meshes/bar_through_hole
  # 起始静置位姿（轴心）。z = 托座顶(0.012) + 杆 inradius(0.009)。
  rest_pos: [-0.050, 0.000, 0.021]
  # 抓点到杆心的 x 距离。由插入终态反推：杆心要到 panel.x 才跨骑，
  # 而手部半深≈25mm + 面板半厚 15mm + 余量。0.065 → 0.075（放开）。
  grasp_offset: 0.075

# -------------------------------------------------------------------- 托座
# V 形块（两片斜夹板 + 立柱），由 topogym/tasks/_fixtures.py 的通用构件生成。
# 2026-08-16 由平顶托座改成 V 槽：平顶只定高度，杆重力静置就横漂 5.2mm、合爪再拧
# 3.3°，而孔的间隙只有 7mm。V 槽让杆不爬坡就不能横移，两项都消掉。
#
# seat_axis_z 给的是「杆轴最终停在哪」，槽底(apex)由它和杆的截面反推。这样改杆的
# 尺寸会带着槽一起动，而不是悄悄改变杆的落点。
# half_angle_deg 从竖直方向量起：45 = 机加工标准的 90° 夹角 V 块，六棱柱按两条下棱
# 落在两个斜面上；改成 30 会让六棱柱的两个下斜面与槽面贴合（面接触），代价是对滚转
# 角敏感。默认取通用的 45。
# 两个近端托座把杆心夹在中间（静置不倾覆），且都避开抓取点，手指下降处杆是裸露的。
cradles:
  near_a:
    enabled: true
    # 抓点在 x=-0.125；本托座在 -0.070，间距 55mm。
    x: -0.070
    # 杆的静置轴高，与 bar.rest_pos 的 z 一致。
    seat_axis_z: 0.021
    length_x: 0.030
    half_angle_deg: 45.0
    # 斜面顶端 = apex + jaw_width*cos45。近端 apex 只有 0.0068，16mm 的斜面顶到
    # 0.0181，仍低于杆轴 0.021，夹板不会挡住指垫下降的那一段。
    jaw_width: 0.016
    jaw_thickness: 0.006
    post_width: 0.024
    color: [0.32, 0.34, 0.36]
  near_b:
    enabled: true
    # 与 near_a 一起把杆心(-0.050)夹在两托座之间。
    x: 0.020
    seat_axis_z: 0.021
    length_x: 0.030
    half_angle_deg: 45.0
    jaw_width: 0.016
    jaw_thickness: 0.006
    post_width: 0.024
    color: [0.32, 0.34, 0.36]
  far:
    enabled: true
    # 终态杆端在 x=0.230，本托座接住远端。
    x: 0.200
    # 与孔的落座高度一致：孔下沿(0.070) + 杆 inradius(0.009)。杆变成「孔 + V 槽」
    # 两点支撑，两处给出同一个轴高。
    seat_axis_z: 0.079
    length_x: 0.040
    half_angle_deg: 45.0
    # 这一片的宽度由插入路径定：横推时杆底在 0.081，斜面顶端 apex(0.0648)+0.0113
    # = 0.0761，留 4.9mm 净空。加宽到 0.023 以上就会刮到横推中的杆。
    jaw_width: 0.016
    jaw_thickness: 0.006
    post_width: 0.030
    color: [0.32, 0.34, 0.36]

# ---------------------------------------------------------------- 工业风装饰
# 一律 collision=False，逐项可关；关掉任何一项都不会改变物理。
# 配方同 stacked_plate（docs/develop/visual/stacked_plate_visual_upgrade_zh.md）。
visual_details:
  # 六段拼成的六角法兰环，沿孔缘一圈。faces 列出要贴的面板面：
  # near = 机器人一侧（-x），far = 杆穿过去之后所在的一侧（+x）。
  # 两面同款，隔板正反看起来一致。
  flange:
    enabled: true
    band: 0.010
    depth: 0.004
    color: [0.55, 0.57, 0.60]
    faces: [near, far]
  # 面板四角铆钉，同样两面都有：一侧是螺栓头，另一侧读作螺母。
  bolts:
    enabled: true
    radius: 0.004
    height: 0.004
    inset: 0.018
    color: [0.24, 0.25, 0.27]
    faces: [near, far]
  # V 块立柱的工业支架外观。立柱与斜夹板本身一点没动（槽底高度、footprint 不变），
  # 这里全是 collision=False 的包裹件，关掉不改变任何接触。
  # 高度 < 0.030 的块只画底板和地脚螺栓（阈值在 tasks/_visuals.py）：
  # 近端立柱只有 6.8mm，画斜撑看不出来；只有 far 立柱（64.8mm 高）画全套，
  # 顶部那圈唇边正好落在立柱与斜夹板的交接处。
  pedestal:
    enabled: true
    # 底板 xy 相对承载块的放大倍数。1.5 留出的边沿刚好够放下地脚螺栓。
    foot_scale: 1.5
    foot_thickness: 0.006
    # 地脚螺栓自动落在底板边沿的中线上，不需要单独的 inset。
    bolt_radius: 0.0035
    bolt_height: 0.004
    # 斜撑：从底板外缘斜拉到承载块上部侧面。
    brace_thickness: 0.005
    # 顶部机加工唇边。collar_gap 让它停在顶面下方 1mm —— 与顶面共面会 z-fighting，
    # 而且真正接杆的必须是承载块的顶面。
    collar: 0.005
    collar_thickness: 0.008
    collar_gap: 0.001
    color: [0.30, 0.32, 0.35]
    bolt_color: [0.20, 0.21, 0.23]

oracle:
  mode: insert          # insert | bypass（bypass = 防捷径对照：从上方绕过去）
  # 绕行对照与正常插入用**完全相同的起止 xy**，只有搬运高度不同——docx 要求的
  # contrast pair 正是「终点位置几乎相同，唯一差别是轨迹同伦类」。
  # 杆会落到面板顶上而不是穿过孔，交点落在六边形之外 → threading_count = 0。
  # 不把杆送到面板远侧：那需要手越过面板平面，正是 cable_routing 记录过的前臂扫掠风险。
  bypass_lift_z: 0.300

# Heights are relative to the task-frame table surface, and are hand-link z
# (the pads sit HAND_TO_PAD_Z = 0.1029 below).
primitive:
  approach_z: 0.210
  # 指垫 0.0211 ≈ 杆心 0.021（居中夹）；指尖 0.0116 离桌面。
  grasp_z: 0.124
  # 杆抬升 0.045 ≫ min_lift_delta 0.025。
  lift_z: 0.169
  # 杆心 0.090，比孔中心(0.086)高 4mm。抬高是为了横推时越过 far V 槽的斜面顶端
  # (0.0761)：杆底此时在 0.081，净空 4.9mm。孔内仍然装得下 —— 杆的上棱在
  # (±0.0104, 0.090)，代入六边形三条边界都有余量，顶面 0.099 离孔顶 0.102 还差 3mm。
  insert_z: 0.193
  # 杆心 0.080，杆底 0.071，离孔下沿 1mm：释放时不是砸下去。
  seat_z: 0.183
  clear_z: 0.240
  steps_per_phase: 90
  # 插入放慢：单步位移越小，卡住时的冲击越小。
  insert_steps: 140
  gripper_steps: 30

physical:
  finger_links: [left_finger, right_finger]
  finger_friction: 2.0
  bar_friction: 0.8
  # 平面朝下的六棱柱，左右是棱（对角半宽 0.0104）。每指留约 2mm 压量
  # （P7：不怼到 0）。真正承载的是 assisted attachment，指面只需看起来夹住。
  grasp_qpos: 0.008
  close_hold_steps: 30
  # 合爪后指位的下限。assisted carry 下 lift_delta 证明不了任何事（attachment 会
  # 把杆抬起来，指垫碰没碰到都一样），指行程是唯一能区分「夹到杆」和「夹了个空」
  # 的读数。null = 不判，但照样打印。先跑一次看 finger_qpos 打出来多少，再把门设在
  # 那个值和指令位 grasp_qpos(0.008) 之间。杆的对角半宽是 0.0104，夹到杆时指位应当
  # 明显高于 0.008。
  min_finger_qpos: null
  # 手腕对准所用的步数。这一相把末端执行器转到能让杆轴平行于插入方向的姿态，
  # 杆因为被夹着而跟着转。不是在夹爪里改杆的姿态：那样物体的转动不对应任何机械臂
  # 动作，录出来的 IL 数据里对准这一步就是凭空发生的，策略学不到。
  align_axis_steps: 60
  insert_settle_steps: 30
  # 预载释放会踢一下，给足静置步数（onestroke 用 100）。
  release_hold_steps: 100
  settle_steps: 40
  min_lift_delta: 0.025
  # 抓起来那一刻允许的杆轴偏差。这一道门问的是「合爪有没有把杆掀翻」，不是「对没
  # 对准」—— 对准是后面手腕那一相的事，所以这里放宽。2026-08-16 之前是 2.0，
  # 那时对准靠在夹爪里改杆的姿态，等于用这道门去要求一个不该在这里满足的条件。
  max_grasp_tilt_deg: 15.0
  # 手腕对准之后必须达到的偏差，才允许往孔里推。真正卡尺寸的是这一道：
  # 半长 100mm、孔上下各约 7mm 余量 → 几何上约 4°，取 1° 留足裕度。
  # 不过关就在撞面板之前中止，不会硬顶进去。
  max_align_tilt_deg: 1.0
  max_grasp_xy_error: 0.025
  # 释放后再步进这么多步做物理复核（释放测试）。
  release_check_steps: 200
  release_max_drift: 0.005

success:
  tilt_tolerance_deg: 10.0
  seated_z_tolerance: 0.015
  min_end_clearance: 0.030
