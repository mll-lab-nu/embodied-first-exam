  - Cord initially surrounds the wrong post or crosses solid wood
  - Bight starts above the lowest ring or outside the fixture
  - Video animation or static preview claimed as physical robot execution
first_probe: implement continuous cord self-contact and handle attachments; verify stable initial contact and one bight-over-ring transition
scene:
