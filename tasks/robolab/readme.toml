# README data for tasks/robolab/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   upstream  NVIDIA RoboLab @ 9db0aaf (v0.3.1, images/robolab/Dockerfile): robolab/tasks/benchmark/<task>.py (each
#             family's `success` termination term and its params), robolab/core/task/conditionals.py,
#             predicate_logic.py, hull_check.py, robolab/core/world/world_state.py (contact, support, bounding boxes),
#             robolab/core/environments/env.py L65-118 (a termination freezes the env; the result is the success term).
#             Line numbers below are those of the pinned upstream files.
#   tooling   embodied_first_exam/benchmarks/robolab/rcb_robolab.py: GRIPPER_CONTACT L664 ("gripper" = either inner
#             finger, RoboLab's alias group: world_state.py L588-619), ON_TABLE L670 + Session.__init__ L965-970
#             (take_measuring_spoon_out, cooking_clear_plate: object_outside_of_and_on_surface with surface "table"),
#             SETTLE_STEPS = 30 L674, MAX_STEPS = 100,000 L654, episode_length_s stretched past MAX_STEPS L953-960,
#             AGENT_END / _hide_success_term L1122-1135, step L1142-1162, settle L1201-1208, replay L1210-1225,
#             cmd_replay L2109-2137.
#   graders   privileged tests/grade.py (identical in every task) and tests/test.sh (--repeat 3);
#             embodied_first_exam/benchmarks/robolab/sim/server.py finish() L89-127 and ctrl_step() L370-379;
#             standard tests/grade.py (identical in every task).

