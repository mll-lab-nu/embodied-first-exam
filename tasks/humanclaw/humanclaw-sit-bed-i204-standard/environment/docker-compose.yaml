# HumanCLAW runs in the `sim` sidecar (GPU: EGL rendering, the motion model on CUDA); the agent reaches port 8000 only.
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 8   # rcb-monitor
    mem_limit: 6144m   # rcb-monitor
    pids_limit: 1024   # rcb-monitor
    x-gpu-memory-gb: 5   # GiB   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    build:   # environment/sim/Dockerfile: the HumanCLAW recipe, sim/ at /srv
      context: sim
      dockerfile: Dockerfile
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:humanclaw-0.1.0"]   # our prebuilt image: pull it, or build images/humanclaw once by hand (BUILD_ONLY: the recipe needs a token)
    command: python /srv/server.py
    restart: on-failure:6                               # a crash resumes the same episode, never a reset
    shm_size: "4gb"
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_TASK_TEXT: "Find the bed and move until your body is touching the target, with zero distance to the target object. Finally, sit on the bed."
      RCB_EPISODE: "Ends at your stop action (the only way to succeed), at the 100th action whatever it is, when your time is up (timeout), or on a simulator error."
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "900"
      RCB_RESET_BUDGET: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
