# swap_crossing_sign (docx 3.2 交换两根线的上下关系) 的布局，写在 TopoGym tabletop V1 任务帧里。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 与 untangle_continuous 的关系：**场景完全相同**，本文件由它的配置逐字复制而来，
# 只改了 task.id、oracle 与 success 三处，以及 pinch 里新增的 cover_overshoot。
# untangle_continuous 的冻结配置本来就是 n_strands=2 / length=1，即恰好一处交叉，
# 正是本任务需要的场景。差别在目标与判据：
#   untangle_continuous  交叉数 1 -> 0        （把两根分开）
#   swap_crossing_sign   交叉数仍为 1，over/under 翻转（换谁压着谁）
# 因此 tasks/entangle/swap_crossing_sign.py 是别名模块而非独立场景构建器；
# 等配置真正发散时再拆（docs/develop/tasks/task_environment_buildout_zh.md §5.1）。
#
# 下面所有 PBD/FEM 调参记录都沿用自 untangle_continuous，是实测值，不要凭空改。
# 设计文档：docs/develop/physics/untangle/untangle_continuous_plan_zh.md

task:
  id: swap_crossing_sign
  # 本任务只对**单个交叉**有定义（要翻转的就是那一个交叉的符号），
  # 所以 braid.length 固定为 1，不开难度轴。difficulty 保留为元数据字段。
  difficulty: easy

coordinate_frame: task

board:
  name: swap_crossing_sign_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# 插线板：绳子"从这里长出来"的锚定端。collision: false —— 绳子的锚定端粒子按设计
# 埋在板体内部（视觉上是出线口），真正的固定是代码侧 fix_particles，不靠刚体接触。
# 打开碰撞会让埋入段与板体互相穿透、在 settle 时炸开。
power_strip:
  name: power_strip
  # y 长度必须盖住所有出线口：3 根绳 × channel_spacing 0.085 → 跨度 170mm，
  # 0.260 两侧各留 45mm 余量，看起来才像一条真插线板而不是刚好卡住三根线。
  # x 深 0.035、中心 -0.2325 → 占 x[-0.250, -0.215]，后沿正好贴 workspace 边界；
  # 绳子锚定端 braid.x_start=-0.225 落在板体内部（视觉上是出线口）。
  # 高度 0.020→0.028，配合加长后的板身，不至于显得像一块薄板。
  pos: [-0.2325, 0.000, 0.014]
  size: [0.035, 0.260, 0.028]
  color: [0.16, 0.17, 0.20]
  collision: false

braid:
  # MVP 冻结：**2 根绳**，braid 长度 2/3/5 = easy/default/hard。
  # n_strands 暂不进难度轴（等 P4 跑通再定，见设计文档 §7.4）。
  #
  # 2026-08-03 从 3 改成 2，两根成为**正式配置**（原先只是 `--strands 2` 的命令行覆盖）。
  # 理由：两根就已经完整表达"谁压着谁"这个任务语义 —— 一个交叉需要且只需要两根绳，
  # 第三根不增加任务种类，只增加同时在跑的 PBD 粒子数和 debug 时的变量数。
  # 三根仍然可用：`--strands 3` 覆盖。
  n_strands: 2
  # 2026-08-04 从 3 改成 1。一个交叉已经完整表达"谁压着谁"这个任务语义，
  # 而 demo 的用途是看单次 undo 的全过程；三个交叉只是把同一个动作重复三遍，
  # 每次都要等绳重新静置。
  # 难度轴：`--difficulty easy/default/hard` = 1/3/5。easy 与本值相同，
  # 不传 --difficulty 就用这里的值。原先 easy=2 与本值不一致，
  # 是「要一处交叉却跑出三处」的原因。三交叉的旧基线现在是 default 档。
  # 离线验证：length=1 在 seed 0~3 上 verify 全绿，crossing_count 均为 1。
  length: 1
  # 主轴：-x 端锚在插线板出线口内侧，+x 端自由。
  x_start: -0.225
  x_end: 0.200
  center_y: 0.000
  # 通道间距。3 根绳 → y 跨度 ±0.085 = 170mm，远在 workspace y[-0.30,0.30] 内。
  # 0.055→0.085（reviewer 要求拉开线间距）。上限约 0.101：再宽就会触发
  # braid.verify_braid_spec 的 crossing_window_too_steep——车道越宽，同样的换道
  # 窗口里要横移越多，换道就越陡。
  # 实测代价只落在 hard 难度最陡的那一处（len5 max 转角 37→43 度），
  # p95 转角基本不动（len3 9.5→10.2，len5 19.8→19.0），所以肉眼观感不变差。
  channel_spacing: 0.085
  # 绳中心线初始高度。同离散版 untangle 的 rope.z（已验证稳定）：半径 0.004 → 底面
  # 在 z=0.003，留 3mm 净空。
  # 原值 0.005（只留 1mm）会爆解：样条在控制点稀疏处会下冲到 base_z 以下约 3mm，
  # 绳管扎进桌面 2.7mm，PBD 第一步用巨大冲量解穿透 → 网格被拉成飞出去的大色板。
  # 下冲现在由 tasks/entangle/untangle_continuous.py 里的 z-clamp 兜底（钳到贴桌静止高度），
  # 这里的 3mm 净空让 clamp 基本不需要生效。
  base_z: 0.007
  # 上方绳在交叉处抬高多少（中心线间距）。
  # **充要条件 = 2×半径 + particle_size = 12mm**：表面粒子在半径 4mm 处，PBD 碰撞只在
  # 粒子中心距 < particle_size(4mm) 时才触发，所以 12mm 恰好是"spawn 时两绳不相互作用"
  # 的临界；braid.verify_braid_spec 强制这条。
  # 而 12mm 同时也是碰撞生效时的**静止间距**，所以取 12mm ⇒ spawn 位置 = 静止位置，
  # 几乎不用沉降。
  # 留档：2026-08-02 曾收紧到 16mm（2×particle_size 的"余量"），过度保守 —— 8mm 粗的
  # 两根绳之间隔了 8mm 空气，肉眼像"隔着一层空气"，而且多出来的 4mm 落差还额外给
  # settle 注入动能。2026-08-03 回到 12mm。
  over_lift: 0.012
  # 交叉集中在主轴的这一段，两头留出锚定引出段和自由尾巴。
  # 上界 0.85 是硬约束：它留下的 64mm 自由尾巴是 lift-test / pull_free_end 要抓的地方，
  # 不能为了让曲线更平滑而挤掉。下界从 0.15 放到 0.10 只动锚定侧（锚定带只占 12mm），
  # 拉长交叉间距 → 换道和 z 斜坡都更缓。
  braid_span: [0.10, 0.85]
  # 换道窗口占单个交叉 x 槽位的比例。用比例而非绝对宽度：绝对宽度在 length=5 时
  # 会和相邻交叉窗口重叠（5 交叉的槽位比 2 交叉窄 2.5 倍）。
  # 0.8→0.95：窗口越宽，同样的换道幅度和抬升摊在越长的 x 上，拐角越缓。
  # 实测 p95 转角 len2/3/5 = 6.6/12.0/21.4 度 → 4.4/9.5/19.8 度。
  crossing_fill: 0.95
  # 每根绳一个颜色，评测分辨率下要能清晰区分（验收标准 #5）。沿用离散版三色。
  strand_colors:
    - [1.00, 0.06, 0.03]
    - [0.02, 0.85, 0.12]
    - [0.02, 0.20, 1.00]

rope:
  # 2026-08-08 默认切 FEM+IPC（迁移验收全过，见 rope_backend_migration_zh.md）。
  # 回退 PBD：改回 pbd_elastic_tube 并把 env 指回 world_tabletop_v1.yaml。
  model: fem_ipc_tube
  # FEM + IPC 后端的材料与接触参数。单源 = prefabs.rope_fem
  # （2026-08-10 从 rope_backends/fem_ipc.py 的 _DEFAULTS 搬来，见该处注释）。
  fem:
    E: ${prefabs.rope_fem.E}
    nu: ${prefabs.rope_fem.nu}
    rho: ${prefabs.rope_fem.rho}
    friction_mu: ${prefabs.rope_fem.friction_mu}
    contact_d_hat: ${prefabs.rope_fem.contact_d_hat}
    follow_strength: ${prefabs.rope_fem.follow_strength}
    rest_shape: ${prefabs.rope_fem.rest_shape}
    sanity_check_enable: ${prefabs.rope_fem.sanity_check_enable}
    newton_max_iterations: ${prefabs.rope_fem.newton_max_iterations}
    newton_tolerance: ${prefabs.rope_fem.newton_tolerance}
  # 绳↔桌面摩擦。**和下面 elastic.*_friction 是两个独立的旋钮**：
  #   elastic.*_friction   -> 绳↔绳（PBD 粒子间）
  #   table_friction       -> 绳↔桌面（写进桌子刚体 geom 的 coup_friction）
  # 耦合器对"可变形体 vs 刚体"读的是刚体 geom 的 coup_friction
  # （legacy_coupler._func_collide_in_rigid_geom），与 PBD 材质摩擦无关。
  # 这个区分正好解开本任务的两难：绳↔绳必须低（高了会把压着的另一根拖着走），
  # 绳↔桌必须高（低了绳子在桌面上乱滑）。
  # Genesis 默认 0.1；只作用于本任务的桌子实例（走 create(table_material=...) 覆写）。
  # **注意：这个值对"绳子躺在桌上滑不滑"几乎没有影响**——Genesis 的绳↔刚体摩擦是冲击式的
  # （切向削减量 ∝ 法向速度，且只在正撞进表面时生效），静止接触时归零。实测从 0.1 提到 0.8
  # 对持续摆动/乱滑毫无改善。真正管用的是下面的 tabletop_friction。
  # 这里保留一个较高值只是让"撞上桌面那一瞬"的行为合理。
  table_friction: 0.8
  # 绳↔桌面的**持续接触**摩擦，自己实现的库仑模型（world/rope.py 的
  # TabletopParticleFriction），只改速度不改位置。
  # 背景与推导见 docs/develop/physics/pbd_tabletop_friction_zh.md。
  # 这是让"被扰动的绳会停下来"的唯一机制——PBD.Elastic 没有任何耗散项
  # （*_relaxation 是约束松弛因子，不是阻尼；对照 PBD.Cloth 才有 air_resistance）。
  tabletop_friction:
    enabled: true
    # 减速度 = mu * g，与速度无关。0.4/0.5 是塑料线缆搁在桌面的量级。
    # 调参方向：绳子像粘在桌上、settle 时摊不开 -> 调低；仍然滑来滑去 -> 调高。
    kinetic_mu: 0.4
    static_mu: 0.5
    # 粒子 z 低于「桌面 + 这个」才算接触。约等于一个绳半径，刚好覆盖躺平截面的下缘。
    # 被机械臂提起的绳段 z 高，自然落在带外、完全不受影响。
    contact_band: 0.005
    # 整根绳的重量压在少数触桌粒子上的集中系数上限。八边形平躺约 3/8 顶点触桌 -> ~2.7。
    # 封顶别调太高：绳子被提起时触点变少、这个比值反而涨，但那时重量在夹爪上，不该加大摩擦。
    max_load_factor: 3.0
  # 自由端的刚体抓握接头。**不插任何东西**，唯一作用是给夹爪一个刚体去抓。
  # 为什么必须有它（见 untangle_continuous_solver_divergence_zh.md）：
  #   1. 夹爪闭在**刚体**上走的是刚体求解器的完整接触；直接闭在 PBD 粒子上走的是
  #      coupler 的软速度投影，不保证不穿透，穿深了 SDF 法向还会翻面把粒子弹出去。
  #   2. 绳子用 Genesis 原生 fix_particles_to_link 跟随接头——它存的是**相对 link**
  #      的位姿、**跟随姿态**，且由求解器内部推进，不经过外部写位置。
  #      我们此前自制的焊接带存的是**世界坐标固定偏移**：attach 时绳子平躺，带子就被
  #      永久钉成水平，抬起时必须在带边缘几毫米内完成 ~90 度转向，把半径 4mm 的绳
  #      折到 5~7mm 曲率半径 —— 那就是爆解的根源。
  # 尺寸沿用离散版 physical_handle 验证过的可抓尺度（半径 8.5mm、高 32mm）。
  # 自由端的刚体接头 —— 和离散版 untangle 用**同一个工业插头几何**
  # （prefabs.rope_endpoint_connector：销 + 法兰 + 环槽抓取柱 + 圆帽），
  # 区别是它**不插任何东西**、侧躺在桌面上让机械臂直接拿。
  # 摆放：绕 y 轴 -90deg，柱轴沿 x 躺平 —— 圆帽（线缆进入端）朝锚定端，
  # 销朝外悬空。躺平时最粗的法兰触桌，所以轴心高度 = 桌面 + flange_radius。
  # 为什么要有它：夹爪夹**刚体**走的是刚体求解器的完整接触；直接夹 PBD 粒子
  # 走的是耦合器的软速度投影，挡不住穿透（见 blowup debug log）。绳子靠
  # fix_particles_to_link 跟随，它带朝向，不会像手写焊接带那样被永远压平。
  free_end_connector:
    enabled: true
    #
    # 尺寸比 prefab 放大约 1.35x（**本任务局部覆盖，不改 prefab** —— 那份是离散
    # untangle / cable_routing 共用的，它们的插头是**直立插进插孔**的，约束不同）。
    # 放大的两个实打实的理由，都只在「躺平」这个姿态下才出现：
    #   1. 躺平时夹爪指垫中心落在插头**轴心**高度 = flange_radius。11mm 时指垫
    #      底缘离桌只剩 ~2.5mm（指垫半高约 8.5mm），几乎蹭桌；15mm 给到 ~6.5mm。
    #   2. 指垫沿柱轴方向约 ±7.5mm，而原抓取柱只有 ±7mm —— 指垫正好**悬到法兰上**
    #      （法兰 Ø22mm 比柱 Ø15mm 粗），先撞法兰再谈夹柱。放大后柱 ±10mm，
    #      指垫完全落在柱面内，法兰退到 x=+10mm 之外。
    # 直立版没有这两个问题：法兰在柱**下方**，顶抓不会碰到，轴心高度也不由它决定。
    pin_depth: 0.013
    pin_radius: 0.0075
    flange_radius: 0.015     # 躺平时触桌的最粗处 -> 轴心离桌 15mm
    flange_height: 0.006
    column_radius: 0.010     # Ø20mm 抓取柱；grasp_qpos_handle 取同值
    column_height: 0.020     # 柱跨 x=±10mm，容得下 ±7.5mm 的指垫
    grip_rings: ${prefabs.rope_endpoint_connector.grip_rings}
    radial_segments: ${prefabs.rope_endpoint_connector.radial_segments}
    rho: 700.0
    friction: 1.6
    color: ${prefabs.rope_endpoint_connector.color}
  # 锚定端粒子选取半径。同离散版：固定"一带"(2~3 圈)粒子而不是单圈，
  # 分散刚体↔PBD 耦合、消掉接缝硬 hinge。
  anchor_radius: 0.012
  # 物理参数单源 = configs/prefab_configs/topogym_prefabs_v1.yaml（prefabs.rope_pbd）。
  # 与离散版 untangle / cable_routing 同源，连续版不做任何物理改动。
  radius: ${prefabs.rope_pbd.radius}
  particle_size: ${prefabs.rope_pbd.particle_size}
  mesh:
    # ------------------------------------------------------------------
    # **这个值不能随便降低。**它同时被两个互相冲突的约束夹着：
    #
    # (a) 碰撞屏障不漏：Genesis 的 PBD 碰撞是粒子级的（每个粒子是半径
    #     particle_size/2 的球），要形成不漏的面需要 segment_length <= particle_size。
    #     9mm 时沿绳方向有 5mm 无覆盖的缝，实测两绳穿模约 4~5mm。
    #
    # (b) 弯曲时不触发**假自碰撞**：Genesis 的自碰撞排除规则是
    #     `rest_dist > particle_size`（pbd_solver._func_solve_collision），它只看
    #     静止距离，分不清"这是我自己的邻居"还是"这是另一根绳"。对角邻居的静止
    #     距离 = sqrt(segment_length^2 + 环向间距^2)，只要它略大于 particle_size，
    #     绳子一弯、内侧被压缩就会触发"自己推自己"，与拉伸约束打架。
    #
    # 实测曲线（radius=4mm, particle_size=4mm, radial_segments=8）：
    #   seg=4mm  对角 5.04mm  弯曲半径 <19.4mm 即触发   <- 场景里到处都是，会爆解
    #   seg=6mm  对角 6.74mm  弯曲半径 < 9.8mm 即触发
    #   seg=9mm  对角 9.51mm  弯曲半径 < 6.9mm 即触发   <- 8mm 粗的绳弯不到，安全
    #
    # 我们场景的实际弯曲半径：交叉处上方绳跨过下方绳约 10mm，抓取点折弯更小。
    # 所以 (b) 要求 segment_length >= 9mm，(a) 要求 <= 4mm —— **没有中间地带**。
    #
    # 取 9mm：接受约 4mm 的绳-绳穿模（可承受：拓扑判定用中心线 z，不受影响），
    # 换取弯曲不爆解（灾难性）。
    # 留档：2026-08-02 曾降到 4mm 试图堵 (a)，结果 (b) 被触发——夹爪抓起绳子时
    # 抓取点折弯即爆解飞出，交叉处也被自己撑变形、上下关系糊掉。已回滚。
    # ------------------------------------------------------------------
    segment_length: 0.009
    radial_segments: 8
    maxvolume: ${prefabs.rope_pbd.maxvolume}
    # 自己的目录：管网格每次 build 都重写同名 obj，与 untangle_continuous 共用
    # 一个目录会让两个任务同时跑时互相覆盖。几何目前相同，但共用没有收益。
    output_dir: .cache/topogym/meshes/swap_crossing_sign
  pbd:
    max_stretch_solver_iterations: ${prefabs.rope_pbd.pbd.max_stretch_solver_iterations}
    max_bending_solver_iterations: ${prefabs.rope_pbd.pbd.max_bending_solver_iterations}
    max_volume_solver_iterations: ${prefabs.rope_pbd.pbd.max_volume_solver_iterations}
  elastic:
    rho: ${prefabs.rope_pbd.elastic.rho}
    # 与离散版 untangle 同值，理由也同：prefab 原值 0.35/0.25 会让一根绳移动时
    # 把压着的另一根"拖着走"；这里保留一点点摩擦，只为让绳落到绳上后静置自然、
    # 不打滑。（就地覆写，不动被 cable_routing 共用的 prefab。）
    #
    # 留档：2026-07-29 曾抬到 0.18/0.12 试图压住摆动，是**误诊**——摆动的真凶是
    # 机械臂无控制器塌陷 + settle 判据 bug，摩擦完全无关，反而复现了离散版当年
    # 特意避开的"拖着走"。摆动现在由 settle.damp_every 主动抽动能解决。
    # 若仍有残余拖拽，按离散版注释的建议可继续下探直至 0.0 做隔离验证。
    static_friction: 0.05
    kinetic_friction: 0.02
    stretch_compliance: ${prefabs.rope_pbd.elastic.stretch_compliance}
    bending_compliance: ${prefabs.rope_pbd.elastic.bending_compliance}
    volume_compliance: ${prefabs.rope_pbd.elastic.volume_compliance}
    stretch_relaxation: ${prefabs.rope_pbd.elastic.stretch_relaxation}
    bending_relaxation: ${prefabs.rope_pbd.elastic.bending_relaxation}
    volume_relaxation: ${prefabs.rope_pbd.elastic.volume_relaxation}

# 抓绳身 + 搬运的动作原语（PBDParticleAttachmentDragPrimitive）。
# 抓取是 kinematic weld 不是摩擦夹持：本 benchmark 要隔离的是拓扑推理，
# 抓取成功率恒 100%，把低层控制误差排除出评测变量（设计文档 §3.5）。
pinch:
  # 绳↔机器人 PBD 接触。**默认关闭**，理由见 tasks/entangle/untangle_continuous.py
  # 的 _robot_material() docstring：本仓其他绳索任务夹的都是刚体 handle，
  # 只有连续版要抓绳中段、让刚体手指直接压在 PBD 粒子上——而 kinematic 焊接
  # 每步又把这些粒子按回原位，两者对着干，绳中段直接炸出求解域
  # （untangle_connector_flyout_debug_zh.md 的 A/B 表已经实锤过一次）。
  # 抓取本来就是 kinematic 焊接（设计文档 §3.5 有意剔除低层控制混杂），
  # 手指接触不提供任何信号。夹爪照常闭合，视觉上仍是明确的"夹住"。
  # 想做真实夹持力学时把这个设成 true，并准备好重新面对上面那个爆解。
  robot_rope_contact: false
  # 焊到手上的粒子带沿绳的半宽，单位是**归一化弧长**（绳全长=1）。
  # 绳长约 0.44m，0.02 ≈ 8.8mm ≈ 一个绳直径，抓的是"一小段绳身"而不是一个点。
  grasp_half_width: 0.02
  # 焊接带边缘的渐变比例（占半宽的比例）。0 = 整条带完全刚性，1 = 只有正中心全握。
  # **这是防爆解的关键参数。**完全刚性的焊接带是一根夹板：带内的绳既不能弯也不能转，
  # 于是运动需要的所有弯曲全被挤到带的两端。实测这会把半径 4mm 的绳折到 6~9mm 的
  # 曲率半径——比绳自身还细，真实线缆做不到这种弯，而且会把 Genesis 的自碰撞规则
  # （按静止距离判定，分不清"自己的邻居"和"另一根绳"）逼进绳子内部触发。
  # 用 Tukey 窗：核心保持平坦（抓得住），边缘余弦渐隐（绳子平滑地离开手）。
  grasp_taper: 0.6
  # 抓取点相对交叉点沿绳往自由端偏移多少（归一化弧长）。往自由端那侧拽，
  # 甩动的是松弛的尾巴，而不是去拖拽被两端约束住的中段。
  grasp_offset: 0.06
  # 搬运时抬到"当前场景最高点 + 这个余量"。要大于绳直径，横move 时才不会
  # 犁过其他绳子。
  lift_clearance: 0.040
  # 绳尾（抓取点到自由端那一段）相对其他绳顶面的余量。
  # 抬升高度不能只看"跨过其他绳"——绳子是从抓取点垂下去的，抓取点之后还有一截
  # 尾巴。实测尾巴弧长 92~101mm，而只按 lift_clearance 算出来的抬升是 59mm，
  # 于是恒有 33~42mm 绳尾拖在桌面上，横移时就沿机械臂方向把下面的绳推走。
  # planner 按尾巴弧长算，两个约束取大。
  #
  # ============ 当前是 H7 判别实验（2026-08-03，见 blowup debug log §4）============
  # 正值让抬升 > 尾巴弧长，尾巴就**够不到桌面、垂直悬空**，于是抓取点变成 Λ 形顶点：
  # 一侧 19° 缓升、另一侧 90° 垂落，161° 的转角挤在极短弧上 = 发卡弯。trace 实测
  # carry_up 阶段 97% 的最小弯曲半径落在焊接带、最小 4.4mm（绳半径才 4mm），随后爆解。
  #
  # -0.030 是最小的翻转量：抬升 129→89mm，尾尖 +37mm→-3mm（刚好搭回桌面），
  # 而抓取点仍在其他绳上方 62mm。只翻转被测变量。
  #   若 bend_r 回到 10mm 量级 -> H7 成立，爆解是抬升策略造成的，
  #     需要设计同时满足"尾巴不拖地"和"抓取点不发卡"的方案（候选：抓取点更靠自由端）。
  #   若 bend_r 仍在 4~6mm -> H7 否定，回来查焊接带本身或别的机制。
  # 已知副作用：尾巴会重新拖过下面的绳（这正是 08-02 加正值要解决的问题）。
  # 回退：改回 0.010。
  tail_clearance: -0.030
  # 放置点相对车道末端(braid.x_end)往回收多少 —— 也就是把绳沿自己的车道**摊直**到多长。
  # **这是真正解开交叉的机制。**抬起来再放下并不解开：交叉点在离自由端 135~156mm 弧长处，
  # 只抬"抓取点"越过其他绳（63mm）根本没把交叉点抬离下面那根绳；而要抬到交叉点离地需要
  # ~220mm，那已超过绳子从锚点能够到的范围（会被拉断）。
  # 摊直则用绳子自身长度当约束：445mm 的绳两端在**同一车道**里相距 400mm，就没有多余
  # 长度绕到别的车道去。物理上也是人的做法 —— 理线是把它拉直，不是把它拎出来。
  # 25mm -> 放置点 x=175mm，锚点到它 400mm，绷紧比 0.899、松弛 45mm（摊直但不绷）。
  # 留档：原值 120mm 是给**中段抓取**调的（那时要靠回收降绷紧比）；抓自由端后它留下
  # 140mm 松弛塞在 305mm 跨度里，绳子必然蜿蜒、重新跨回去。
  place_pullback: 0.025

  # 手的任何路点都不能要求绳子比它本身更长。
  # 绳弧长 525mm，两端相距 433mm —— 出生就已经 82% 伸展，全部余量只有 ~92mm。
  # 在自由端原地抬到 219mm，最短的 braid（length=2）需要 101% 的绳长：那不是抬起来，
  # 是拉断。把手往锚定端收就能把高度换回来，所以每个路点都沿「锚点->目标」方向
  # 夹回可达范围（只往里收，绝不往外推）。
  # 0.90：出生态 0.825 之上留一点余量，又不至于把手收得太靠近锚点。
  max_taut_ratio: 0.90
  # 横移目标越过自己车道中心多少米（0 = 正好停在车道中心）。
  #
  # 手到达车道中心不等于绳到达车道中心：交叉点在自由端后方 120~156mm 弧长处，
  # 整个横移过程中都滞后于手，到位时仍差一截。viewer 实测放下时被移动的绳
  # 仍与下方那根重叠。越过车道中心（朝远离下方那根绳的方向）把滞后的一段
  # 也带过分界线，松手后绳会自行回松一些。
  #
  # 代价很小：锚点与目标同在一条车道上，y 方向的偏移几乎垂直于「锚点→目标」
  # 方向。400mm 跨度上偏 40mm 只多消耗 2mm 伸展量，远在 max_taut_ratio 之内。
  #
  # channel_spacing 是 85mm，所以 0.040 略小于半个车道间距，落在两条车道之外、
  # 不会进入另一条车道。n_strands >= 3 时朝外越界可能进入相邻车道，
  # 与 §8 记录的三绳限制一致。
  lane_overshoot: 0.040
  # ---- 本任务新增 ----
  # cover（第二步）把绳放到**另一根绳自由端再往外** cover_overshoot 处，
  # 而不是放回自己的车道。lane_overshoot 是「躲开」，这个是「压上去」，方向相反。
  #
  # 0.070 取自 rope.free_end_connector.min_clearance：两个插头至少要留这么远，
  # 否则终态两个刚体接头会挤在一起，交叉点也会被推到绳子最末端、测不干净。
  #
  # 这个值给得偏大不会出事：绳出生时就已经伸展到 99%（实测控制线弧长 0.4376m，
  # 两端弦长 0.4334m），planner 的 within_reach 一定会把目标沿「锚点→目标」方向
  # 收回到 max_taut_ratio 之内。给大只是让收回后仍确保越过对方，不会落在半路。
  cover_overshoot: 0.070
  # 放下时手离**对方绳身**的最小俯视距离。cover_overshoot 保证的是「落点在对方
  # 自由端之外」，不是「落点离对方绳身够远」—— reach 夹取会把落点沿「锚点→目标」
  # 方向拉回，而拉回去的地方正是对方的尾巴所在。第一次跑就是这样：手下来时指头
  # 蹭到已放下的那根，把它弹开了。
  #
  # 比的是**夹爪的占地**，不是绳半径：真正撞上去的是手指。
  # 插头法兰半径 0.0085 + 绳碰撞半径 0.006 + 余量 0.02 ≈ 0.035。
  #
  # planner 会从 cover_overshoot 起逐步加大瞄偏量直到满足这个净空，取**最小**的
  # 那个可行值 —— 加大瞄偏会让两绳提前相交、抬升需求变高，所以不能一味加大。
  place_clearance: 0.035
  # 夹爪闭合到的半宽（米），指间距 = 2×这个值。
  # **必须大于绳子的碰撞直径，那个值不是视觉直径 8mm 而是 12mm**：
  # 最外层粒子在离中心线 4mm（管半径）处，每个粒子自己再带 particle_size/2 = 2mm
  # 的碰撞半径，所以碰撞包络是 2×(4+2) = 12mm。
  # 原值 0.005（指间距 10mm）每侧挤入 1mm：刚体手指持续把粒子往外推，kinematic
  # 焊接每步又把它们按回原位，两者正面冲突 —— 位置突变被反推成巨大速度，
  # 焊接带（也就是绳子中段）直接炸出去。
  # 0.008 → 指间距 16mm，比碰撞包络宽 4mm，手指干净地"框住"绳子而不接触。
  # 从张开的 80mm 合到 16mm，视觉上仍然是明确的"夹住"动作。
  grasp_qpos: 0.008
  # 下面几个是原语自身的参数，需要在 viewer 里实测微调。
  approach_z: 0.250
  touch_clearance: 0.004
  lift_delta: 0.060
  move_steps: 260
  gripper_steps: 120
  # 手到粒子带中心的允许偏差；超了算没抓到。
  attach_tolerance: 0.030
  max_follow_error: 0.045
  motion_settle_steps: 20
  release_hold_steps: 30
  # 夹爪闭合到的半宽（米）。现在夹的是**刚体接头**（半径 8.5mm），不是 PBD 粒子，
  # 所以按接头尺寸给：0.0075 会夹紧到略小于接头半径，产生稳定的刚体接触摩擦。
  # （离散版 physical_handle 同尺寸、同值，已验证。）
  # = rope.free_end_connector.column_radius（放大后的本任务值，不是 prefab 值）。
  # 手指闭到柱面、零预紧 —— 承力的是 on_close 装上的 assisted attachment，不是摩擦。
  grasp_qpos_handle: 0.010
  # HandleDragPrimitive 的抓取校验：抬升测试至少要把接头抬起这么多，
  # 且接头相对手的跟随误差不超过 max_handle_error，否则判定没抓住。
  min_lift_delta: 0.014
  max_handle_error: 0.035
  close_hold_steps: 100
  # 抬起后将插头绕水平轴旋转的角度，使出线口（圆帽）转向下方。0 = 关闭。
  #
  # 依据（debug-log/untangle_continuous_solver_divergence_zh.md §12）：插头躺平握持时，
  # 圆帽水平朝向锚定端，而松弛的绳从支点接近竖直垂下，出线口处形成约 90 度转角，
  # 实测 bend_r 4.7mm，小于绳半径 4mm。历次求解发散均始于该位置。
  #
  # 取值推导。设绳的出线方向与竖直方向夹角为 a，本参数为 p，则出线口转角为
  # |(90° − p) − a|。a 的上界是锚点到插头的弦方向，用 §10 的三组路点数据
  # （弧长 525mm）算得 61°~65°：
  #     length=2  抬升 219mm  绷紧比 0.900  弦 472mm  水平 419mm  -> 62°
  #     length=3  抬升 198mm  绷紧比 0.900  弦 472mm  水平 429mm  -> 65°
  #     length=5  抬升 183mm  绷紧比 0.712  弦 374mm  水平 326mm  -> 61°
  # 绳存在松弛，实际出线方向比弦更接近竖直，因此 a ∈ [0°, ~62°]：
  # lift_test 阶段 a 接近 0，carry / cross 路点 a 接近上界。代入：
  #     p=0   -> 转角 90°~28°，最大 90°，对应 bend_r 5.3mm
  #     p=60  -> 转角 30°~32°，最大 32°，对应 bend_r 13.6mm
  #     p=90  -> 转角  0°~62°，最大 62°，对应 bend_r 7.3mm
  # p≈59° 使最大转角最小（约 31°）。对照运行取 60。
  #
  # 默认 0：先运行仅含 quat 修复的基线，确认「水平握持产生 90 度转角」是否成立，
  # 再改为 60 对照。每轮只改一处。
  carry_pitch_deg: 0.0
  # 旋转分摊的 sync 调用次数。AttachmentManager 在每个物理步前后各 sync 一次，
  # 260 次对应 130 个物理步，即 lift_test 的时长（move_steps // 2）。
  # 速率核对：60 度 / 260 次，固定粒子带最外圈粒子（距转轴 12mm）每次位移 0.05mm，
  # 低于搬运本身的 0.85mm/step，不会产生 §12.3 中 11.79mm 的单步位移。
  carry_pitch_steps: 260
  # 每次放下之后重新静置的**步数上限**（不是固定步数——走 settle_scene，
  # 收敛就提前退出，带速度阻尼）。
  # 刚被抬起、横移、放下的绳子是一根单端锚定的摆，而这些绳几乎没有阻尼，
  # 原来的固定 120 步（1.2 秒）远不够；在还在摆的绳子上数交叉既不准，
  # 也会让下一次抓取瞄到过期位置。给到和 spawn settle 同一量级。
  between_moves_settle_steps: 800
  # 判定"粒子炸了"的阈值：粒子离自己那根绳中心线多远算离群。
  # 健康粒子最多在管半径 0.004 处；0.030 = 7 倍半径，只会抓到真正发散的。
  blow_up_tolerance: 0.030

oracle:
  # 固定两步：① separate 把上面那根摘下来（交叉 1->0），② cover 把另一根压上去。
  # 不是「每个交叉给几次余量」——本任务的交叉数恒为 1，步数由动作语义定死。
  # 超过就算失败，而不是继续试。
  max_moves: 2

# 几何判定参数（verification/swap_crossing_sign_verifier.py）。
# 交叉检测本身与 untangle_continuous 共用同一套实现，所以前两个键含义不变；
# separation_threshold 在本任务里的用途不同 —— 见该键自己的注释。
success:
  # 每根绳的俯视中心线采样多少段。绳长约 0.44m，80 段 ≈ 5.5mm/段，比绳径 8mm 细，
  # 足以分辨交叉；再密只是让粒子分箱变稀、中心线更抖。
  centerline_samples: 80
  # 一次物理交叉会横跨好几段中心线，逐段判相交会把同一个交叉数很多遍。
  # 这个半径内的命中合并成一个。取略大于绳径（0.008）。
  crossing_merge_radius: 0.012
  # 本任务里这个值**不进终态判据**（终态两根绳必须接触），它判的是中间态：
  # 第一步之后两根绳是否真的分开过（separated_seen）。终态要求交叉数为 1，
  # 用最近距离判成功会自相矛盾。
  # 2×绳径 = 0.016 表示两绳之间至少还能塞下一根绳，肉眼看就是明确分开而不是刚好不压着。
  separation_threshold: 0.016

# 建好场景后先让重力把上方绳压到下方绳上，再开始数交叉/动机械臂。
settle:
  steps: 800
  # 判定"静下来了"：单步内 95% 分位的粒子位移（米）。用分位数不用最大值——PBD 有
  # 数值噪声底，单个粒子的抖动会否决一根其实已经静止的绳子（第一版就是这么误报的）。
  # 用位移不用速度，是为了不依赖求解器内部量；dt=0.01 时 0.0002 m/step ≈ 2 cm/s。
  #
  # 0.0002 这个值仍是**估计**：真正该定多少，要用 trace_every 看衰减曲线定——
  # 曲线还在降说明 steps 不够，曲线走平说明那就是噪声底、限值不能定在它以下。
  max_particle_step: 0.0002
  # >0 时每这么多步打印一次 p95/max，用来看衰减曲线。调参时开，平时设 0。
  trace_every: 50
  # 每这么多步把所有粒子速度清零，主动抽走动能。0 = 关闭。
  # **现已关闭**：这是在没有桌面摩擦时用来强行抽动能的替代品（fake），现在
  # rope.tabletop_friction 提供了真正的库仑摩擦，就不该再留着——留着会掩盖
  # "摩擦到底有没有起作用"。
  # 保留这个参数是为了回退：如果关掉后 settle 反而不收敛，说明"改速度安全"这个
  # 判断有误，把它调回 25 可以恢复原行为。
  damp_every: 0
  # 兜底：跑满 steps 还没收敛就报错，而不是把还在摆的绳子交给机械臂。
  require_converged: true
