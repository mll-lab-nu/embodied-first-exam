# Generated by scripts/dexhand/generate.py.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/", { source = "/data/final.json", service = "sim" }, { source = "/data/episode.jsonl", service = "sim" }, { source = "/data/trajectory.npz", service = "sim" }, { source = "/data/replay.mp4", service = "sim" }, { source = "/data/server.log", service = "sim" }, { source = "/data/journal.f64", service = "sim" }, { source = "/data/startups.jsonl", service = "sim" }, { source = "/data/video.json", service = "sim" }, { source = "/data/video.log", service = "sim" }]

[task]
name = "robot-coding-bench/dexhand-paper-staple-i00-standard"
description = "Square up three loose, misaligned A5 sheets with a dexterous hand (Sharpa Wave by default, or Wuji Hand 2.2) on a Tianji Marvin arm, slide their corner into a NOVUS B2 desk stapler's throat against its paper stop, press the spring-loaded head (about 10 N rising to 25 N) through its full stroke and let it spring back; a sheet pushed off the desk, a knocked-over stapler or an arm link hitting the desk fails the episode at once."
authors = [{ name = "Embodied Exam contributors" }]
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "office_tools", "arm-mounted-hand", "articulated-mechanism", "edge-alignment", "office-tools", "paper", "pushing", "stapler"]

[metadata]
author_name = "Embodied Exam contributors"
task_type = "trajectory"
simulator = "mujoco"
robot = "marvin-bimanual-sharpa-wave"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "paper_staple"
mode = "standard"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): scripts/task_dynamics.toml
protocol = "eai-standard/2.2"
oracle = "full"
oracle_evidence = "solution/trajectory.npz replays the validated Sharpa Wave authoring trajectory on the Marvin right arm (942 controls; success after 742, then 200 unexecuted hold rows of slack). Two fresh-process replays succeed with identical state hashes. The standard oracle submits the same rows through the public client."
expert_time_estimate_hours = 3.0
difficulty = "hard"
release_status = "provisional"

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 2.0
min_memory_gb = 5.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 4.0
verifier_min_gpu_memory_gb = 0.0
measured = "wave-3 integration smoke of the Marvin-arm families (Harbor 0.23, eai-dexhand:0.2.0, CPU-only, 2026-10-15; one privileged and one standard Sharpa oracle per family; docker cgroup memory.peak): privileged verifier 3.40-3.51 GiB with two concurrent replays, standard sim sidecar 2.13-2.65 GiB, agent containers < 0.05 GiB; one fresh replay process 1.75-1.81 GiB max RSS (os.wait4); x1.2 rounded up to a GB, the values of pot_shelf_transfer (the same robot); two cores for the two concurrent verifier replays"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 16.0
measured = "memory: 8 GiB lets an agent run three or four 1.8 GiB Marvin simulator sessions next to its harness; measurements as in the [[rule]]; processes 512 and disk 10 GiB: design defaults, not yet measured; whole trial: + the sim service's 8 GiB cap (peaks <= 2.65 GiB)"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 2.0, memory_gb = 10.0, pids = 8192 }
sim = { cpus = 2.0, memory_gb = 8.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode, write its live verdict (no replay), then one video pass
timeout_sec = 1920                # the end wait, the video and a margin (generate.py std_collect_s)

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
