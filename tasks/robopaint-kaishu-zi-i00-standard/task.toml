schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/canvas.png", service = "sim" },            # the replayed main sheet that was scored
  { source = "/data/canvas_practice.png", service = "sim" },   # the replayed practice sheet (never scored)
  { source = "/data/canvas_live.png", service = "sim" },       # the live episode's main sheet
  { source = "/data/canvas_live_practice.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robopaint-kaishu-zi-i00-standard"
description = "RoboPaint 楷书 臨帖, STANDARD MODE (robot as a service, eai-standard/2.2): embodied robotic calligraphy (ManiSkill 3.0.1 Franka Panda with a Chinese writing brush; the mark is the dynamic virtual brush of Wang et al., IROS 2020, re-implemented) on the same frozen instance as the privileged task: copy the exemplar character 字 in regular script, shown in the picture target.png, onto the main sheet in at most 6 strokes, with a practice sheet for test strokes. The agent only gets a client: get_obs (camera RGB + proprioception), submit (ee_pose or joint_position chunks). No reset, no sheet readout, no brush model, no score; the sim service records the episode, which is replayed twice and scored against the picture after the best single shift of the sheet, at most 5 mm along each axis (success iff IoU >= 0.80, boundary F within 1 mm >= 0.75, every stroke of the exemplar covered >= 0.80, stray ink <= 0.04 and at most 6 strokes). Process rules: write with brush strokes the way a person writes; colouring in or filling the shapes, zigzag, serpentine or contour-offset fills fail: a brush-tip path on the main sheet longer than 1510 mm made of marks narrower than 1.91 mm on average is colouring in."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "maniskill", "sapien", "calligraphy", "chinese-calligraphy", "kaishu", "brush", "franka", "standard-mode", "trajectory", "robopaint_kaishu_zi"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "maniskill"
robot = "franka-panda"
family = "robopaint_kaishu_zi"
mode = "standard"                  # camera RGB + proprioception only; no sheet readout, no score, no reset, no brush model
protocol = "eai-standard/2.2"
oracle = "partial"                # solution/: the privileged oracle's joint targets, streamed through the client
oracle_evidence = "Reference solution in solution/ (streams the privileged reference's joint targets), unchanged from the earlier version of this task (the picture score only; its Harbor oracle and nop runs, and what changed since: docs/benchmarks/robopaint.md, Oracle evidence). The same trajectory scores 1 under the process rules in the verifier, whose replay CLI the collect hook runs (ws3, 2026-10-05): path_mm 501 and mark_width_mm 6.38, against the colouring-in limits 1510 mm and 1.91 mm. Harbor oracle and nop runs on one pair per family: docs/benchmarks/robopaint.md (Validation)."
instance_seed = 0
expert_time_estimate_hours = 6.0
difficulty = "hard"             # RoboPaint tiers: line easy; kaishu <= 5 strokes medium, 6+ strokes hard, works extreme
medium = "calligraphy"
stroke_count = 6                  # difficulty axes: strokes (= the stroke cap), structure, characters
structure = "top-bottom"
characters = 1

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # dump + exit the service, replay twice in fresh processes (+ video), score, write final.json
timeout_sec = 3600

[agent]
timeout_sec = 7200.0              # 2 h of wall clock, same as the privileged twin
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
