# env/reward_manager/func_parser.py (implementations). Shared semantics: RM check_once L247-279 (a list inside a stage
# is an OR of its items, a list inside that OR an AND); step L357-494 (only the first stage is tested at an action,
# items in order with the first failing item stopping the test, a passed stage is popped; a query counts the actions
# at which all its items hold and a count above its aim marks the env failed; trigger_check / trigger_query test their
# items only when the condition fires, a rising edge being a condition true now and false at the previous test, false
# before the first action; a passed trigger_check is popped, a failed one waits for the next edge); get_reward
# L527-587 (every list empty, every query count equal to its aim). "Home" is FP all_robot_back_to_origin L1631-1644
