# bar_through_hole_physical_insert_demo 的运行模式参数。

defaults:
  - default
  - _self_

# 只建场景、在 home 位静置，不跑动作。
# 先用它：home 位与几何互相穿透的问题在这一步就会暴露 —— stacked_plate 当初
# 就是在这里出的求解器 NaN，后来才有了抬高 home 的机器人配置。
inspect_only: false

# 覆盖 task.oracle.mode。三个取值：
#   insert     = 穿过通的那个孔（oracle）
#   bypass     = 从面板上方绕过（反捷径用例，预期判失败，threading_count = 0）
#   wrong_hole = 无视画面永远瞄中间那个孔（2026-09-08 加）。判定仍按实际通的那个孔算，
#                所以只在抽到中间孔的实例上成功，预期约 1/3——与 cloth_fold 的 fixed_corner、
#                linkbar 的 nearest_zone 同形。
# null = 用 task 配置里的值。
oracle_mode: null

# inspect_only 的静置步数。用它量「杆自己会不会漂」：杆是贴着托座面生成的，
# 任何横向蠕变都直接从对准预算（孔 inradius - 杆 inradius）里扣。
inspect_settle_steps: 200

# --- 变体（2026-09-04）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）：
#   run.randomize_layout=true run.seed=3
# 默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识（角点 sweep 用 corner_<id>）。
variant_id: default
