[robots]
franka-panda = "Franka Emika Panda arm (7 joints) with its two-finger gripper, VLABench's model on a fixed base"

# privileged/tests/grade.py main L71-84: no file -> missing_trajectory; load_npz (pickle-free, <= 8 MiB, .npy members
# only) and `actions` finite (T, 9), 1 <= T <= MAX_STEPS = 4000 -> invalid_trajectory; replay L85-110 (one fresh process,
# timeout 3600 s): vlb_tool Session.replay steps each row (clipped into the actuator bounds), raising EpisodeOver at a row
# after the native termination (exit 2 -> invalid_trajectory); success = status()["success"] after the last row, i.e.
# the termination condition at the last control step. Session() refusing the instance (hash mismatch), a replay crash
# (a dm_control PhysicsError included) or its timeout -> grader_error = 1 (L111-113).
[modes.privileged]
success = """
Positions are object origins in the world frame of the instruction (metres, z up). A control step is 0.1 s (100 physics
steps of 1 ms), and VLABench checks the condition after every control step.

The graded file is `/app/output/trajectory.npz`: key `actions`, a finite (T, 9) array with 1 ≤ T ≤ 4000, one row of
joint and finger targets per control step (rows are clipped into the actuators' bounds). The verifier replays it once,
open-loop, in a fresh process from the frozen start. VLABench ends the episode at the first control step after which
the condition holds. The trajectory passes when that is its last row. A row after that step makes the trajectory
invalid (score 0), and a replay whose rows run out before the condition holds scores 0. A missing file, a file that is
not a pickle-free npz of at most 8 MiB, or an `actions` array of another shape, with a non-finite value or with more
than 4000 rows scores 0. A replay that fails with an error, runs over 3600 s, or finds a frozen scene that does not
rebuild with the recorded model and initial-state hashes is a grader error, not a score.
"""

# environment/sim/server.py (RCB_AGENT_END=1, RCB_MAX_CONTROL_STEPS=9000, RCB_RESET_BUDGET=0 in the compose file):
# step() L171-173 returns VLABench's condition after every control step (vlb_tool's success check); done is never set
# (the termination is replaced, vlb_tool L208-210), so no "failed" end. rcb_service _step L939-957 / _end L959-976: the
# ends "finished" (POST /finish), "step_limit" (9000 rows) and "timeout" (session end) are judged by _judged L682-685:
# the condition after the last control step (end_judgement "state"), or any control step's for the EVENT_TASKS
# (end_judgement "events", the families' `standard` texts); reason "error" -> 0 (sidecar/grade.py L113);
# sim_crashed_on_call -> 0; instance_mismatch, sim_crashed, resume_failed, no finalized verdict -> infra_error.
[modes.standard]
success = """
Positions are object origins in the world frame of the instruction (metres, z up). A control step is 0.1 s (100 physics
steps of 1 ms), and the service checks the condition after every control step. It never reports it, and a success does
not end the episode.

Graded is the one live episode (no reset). It ends at the agent's `POST /finish`, after 9,000 control steps, when the
agent's session ends, or on a simulator error. Unless stated otherwise above, it passes when the condition holds after
the last control step of the episode. A simulator error raised by the agent's calls, or simulator crashes during its
calls that the service cannot resume from, end the episode with 0. A frozen scene that does not rebuild with the
recorded model and initial-state hashes, or service crashes outside the agent's calls, are infrastructure errors, not a
score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families. One instance each (instance_seed 0); the condition is the instance's episode.task.conditions
# (instance.json), plus the task class's own should_terminate_episode where it has one. "Inside the box spanned by the
# keypoint sites" = CommonContainer.contain (an axis-aligned box, bounds included); a flat container's contain is
# FlatContainer.contain (the radius branch when the asset has a horizontal_radius_site, else the keypoint footprint).

# add_condiment: conditions above(target_entity bbq_sauce, platform pan_seen) + pour(target_entity bbq_sauce, threshold
# 0). AboveCondition: bottle origin z >= pan origin z, then pan.contain((x, y, z_pan + 0.01)); pan_seen
# (tablewares/pans/pan_0) is a FlatContainer with a horizontal_radius_site 0.1247 m from its origin, so the test is
# the horizontal distance < radius (the height test 0 < 0.01 < 0.1 always holds). PourCondition: bottom_site z -
# top_site z > 0 (sites of condiment/bbq_sauce/bbq_sauce1).
[families."vlabench/add_condiment"]
success = """
Condition (VLABench's `above` and `pour`, both at once): the BBQ sauce bottle's (`bbq_sauce`) origin is at least as high
as the pan's (`pan_seen`) origin and less than the pan's radius (its `horizontal_radius_site`, about 12.5 cm)
horizontally from it; and the bottle's `bottom_site` is higher than its `top_site`. No sauce is simulated.
"""

