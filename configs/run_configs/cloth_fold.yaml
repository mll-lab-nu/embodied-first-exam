# cloth_fold_physical_demo 的运行模式参数。
#
# 这个 demo 目前没有自己的诊断开关：轨迹由材料决定（planner）、速度是标定值
# （task.physical.fold_step_m）、判据门槛在 task.success —— 都不属于「这一次怎么跑」。
defaults:
  - default
  - _self_

# 机械臂退开之后再空跑多少步才停止录制（dt=0.01，所以 100 步 = 1 秒）。
# 让视频最后是一段**布已经落定、机械臂已经让开**的稳定画面，便于截图看折的结果。
# 这是录制上的事不是任务定义，所以在 run 而不在 task —— 松手后的物理沉降是
# task.physical.release_hold_steps，两者管的不是一回事。
final_hold_steps: 100

# 走法。fold = 任务本身（oracle）；drag = 同一条弧线的俯视投影、手全程贴桌面不抬（docx 1.1 点名的
# 「贴地拖拽不提起」，预期 folded=False）；fixed_corner = 无视指令永远按 far_left 规划（判定仍按指令的角，
# 预期只在抽到 far_left 的 episode 里成功，约 1/4）；fixed_fold = 无视指令的折痕位置永远角对角折
# （判定仍按指令的 goal.fold_fraction，预期只在抽到 1.0 的 episode 里成功，约 1/3）。
motion: fold

# 变体（task yaml 末尾的 variation 块）。randomize_layout=true 时按 seed 抽；difficulty 只有 envelope 一档；
# variant_id 是角点 sweep 写进日志的标签。
randomize_layout: false
difficulty: envelope
variant_id: default
