experiment: harbor_smoke_api
attempts: 1
concurrency: 1
timeout_sec: 1800
usage: {mode: observed}
instances:
  - name: cube-transfer-api-seed0
    fixture: cube_transfer
    evaluation: pipeline_smoke
    mode: limited
    instruction: >-
      This is a pipeline smoke test. Use your image tool to inspect frames extracted from segment_0 video.
      Write segment_1.py that uses measured proprioception and EE_DELTA actions to
      move the TCP upward about 2 mm over four control steps, then return None.
      Submit it and inspect its recorded video frames and step logs. Only then write segment_2.py
      to move the TCP down about 2 mm over four control steps. Inspect segment_2
      final video frames and finish. Do not attempt to grasp the cube. Mention the viewed
      camera names and result paths in your final answer.
    simulator:
      task_id: cube_transfer
      robot_id: panda_robotiq
      variation_id: base
      seed: 0
      control_mode: EE_DELTA
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.025
      solver_substeps: 40
      control_decimation: 1
      max_physics_steps: 1000
