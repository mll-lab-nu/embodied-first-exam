schema_version = "1.3"
artifacts = [
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage_A.json", service = "sim" },
  { source = "/data/think_calls_A.jsonl", service = "sim" },
  { source = "/data/think_usage_B.json", service = "sim" },
  { source = "/data/think_calls_B.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/baseball-duel-wallclock-program-standard"
description = "Two-player baseball, pitcher against batter, in a shared continuous wall-clock world; slowdown chosen at run time (RCB_SLOWDOWN; DUEL_SEED, FIRST_RECEIVER = the seat that bats first). One inning with outs, base runners and runs: in each half-inning one seat bats with the swing rig until it has 3 outs, the other pitches (type, speed, spin and target within stated limits, with execution scatter); if level, extra innings with runners on first and second base until decided, at most 1, then the winner of the last pitch wins: no draws; a half-inning also ends at 4 runs; a plate appearance reaching 15 pitches is an out; score = runs. PROGRAM PLAY: each agent may write an autonomous program that observes and acts without a new model response per action, and may watch, fix and restart it at any time and during reviews (300 s per review, else forfeit). Up to 30 minutes to start after the opponent. Equal isolated seats; one act per seat in flight. Technical failures invalidate the trial."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "robotics", "mujoco", "baseball", "batting", "pitching", "interactive", "arena", "multi-seat"]

[metadata]
revision = "baseball-duel-2-program-v2-param"
author_name = "Chi Gui"
category = "robotics-sports-arena"
task_type = "trajectory"
simulator = "mujoco"
robot = "swing-rig"
family = "baseball_duel"
mode = "standard"
protocol = "eai-standard-realtime/1.0"           # real-time extension of standard mode
oracle = "full"
oracle_evidence = "solution/: one scripted camera-only player (pitcher and batter) on both seats plays valid games (checked at x10 and x20, both first batters)"
parameters = "RCB_SLOWDOWN (default 20), DUEL_SEED (default 1), FIRST_RECEIVER (A or B: the seat that bats first)"
timing_policy = "report_only"
duel_seed = 1
expert_time_estimate_hours = 0.75

[[seats]]
name = "A"
service = "seat_a"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress_a"]

[[seats]]
name = "B"
service = "seat_b"
agent_kwargs = { think_proxy_url = "http://sim:18091/v1" }
setup_networks = ["egress_b"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; for j in $(seq 1 620); do grep -q '\"video\": \"pending\"' /data/final.json || break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1400

[agent]
timeout_sec = 7200.0           # preparation (start window up to 30 min), the game at x20 and the reviews

[environment]
build_timeout_sec = 1200.0
cpus = 1                      # main (idle); sim and the seats are sized in docker-compose.yaml
memory_mb = 1024
