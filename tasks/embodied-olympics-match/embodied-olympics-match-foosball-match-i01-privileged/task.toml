schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-foosball-match-i01-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): table football on a physical table (ITSF rules, one game to 5 goals): the four motorised rods of one team against the scripted computer team, one match against the scripted computer team at level 3 on the frozen instance of embodied-olympics-match-foosball-match-i01-realtime (seed 7, S = 20). Full simulator in development (read and change any state, reset the whole match); the deliverable is a closed-loop Python program that plays a fresh unmodified match in the verifier, on the original S = 20 clock, seeing the full state instead of camera images."
keywords = ["robotics", "mujoco", "fullsim", "policy", "foosball"]
[metadata]
task_type = "policy"
simulator = "mujoco"
robot = "foosball-rods"
family = "foosball_match"
dynamics = "dynamic"
verifier_wall_clock = true
instance_seed = 7
opponent_level = 3
source_commits = ["d71e9f642ead"]
source_task = "roboolympics/foosball-match-wallclock-program-standard"
exporter = "Embodied Olympics full-simulator exporter"
official = false
expert_time_estimate_hours = 1.0
oracle = "full"
oracle_evidence = "full-state reference program (solution/): the sport's reference player (builtin_players.Reference) fed the true ball state (0.03 s lead) and the opponent's true figures in place of the cameras; a local Harbor oracle run won 5:3 (valid, replay identical); the nop (no program) scores 0"
validated = true

[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240
[verifier]
timeout_sec = 7800.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
