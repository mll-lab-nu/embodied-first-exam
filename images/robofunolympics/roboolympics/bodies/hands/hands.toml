# Hands and tools on the common wrist mount (bodies/README.md). A hand is an MJCF fragment whose root body is named
# "hand"; body.py attaches it to the mount body <arm>_mount (+z away from the wrist) and prefixes every name with the
# robot's prefix + "hand_" (so geom "blade" becomes e.g. "A_hand_blade"). Collision: "contact" geoms take part in the
# sport's own contact rules (contype 1, conaffinity 1: the sport adds its <pair>s); every other hand geom is part of
# the robot (contype 4, conaffinity 0: it touches the ball and the world but never the robot itself).
# status: ready = used by a sport and tested there; draft = geometry only, the sport that needs it finishes it.
# Limits (audit 2026-10-08, G10): no hand is actuated yet (the gripper's fingers and the suction cup have no motor).
# The sport that first actuates one declares the real tool it stands for here, with sources, and drives it through
# bodies/servo.py: e.g. the Franka Hand (30-70 N continuous grip, 80 mm stroke, 50 mm/s per finger; product manual
# R50010 v1.2), the RB-Y1 gripper (0.05 m/s, rby1-sdk URDF), the R1 Pro gripper (0-100 mm stroke).

[paddle]
file = "paddle.xml"
status = "ready"
sports = ["tabletennis"]
contact = ["blade"]
site = "center"                       # the blade centre; face normal = the hand body's local +x
note = "the table-tennis paddle of the Franka tasks (15 x 15 x 1.5 cm blade, 0.14 m beyond the flange, 0.14 kg)"

[racket]
file = "racket.xml"
status = "draft"
sports = ["tennis", "badminton"]
contact = ["strings"]
site = "center"
note = "an oval head on a 0.40 m shaft (tennis: head 0.27 x 0.20 m, 0.30 kg; badminton scales the head and mass)"

[board]
file = "board.xml"
status = "draft"
sports = ["volleyball"]
contact = ["board"]
site = "center"
note = "a flat 0.30 x 0.22 m board (forearm pass and set surface), normal = local +x"

[suction]
file = "suction.xml"
status = "draft"
sports = ["basketball dribble"]
contact = ["cup"]
site = "center"
note = "a switchable suction cup (0.08 m radius): the sport turns the grip on and off (a weld or adhesion actuator)"

[epee]
file = "epee.xml"
status = "draft"
sports = ["fencing"]
contact = ["blade", "tip"]
site = "tip"
note = "an epee: bell guard, a 0.90 m blade along +z, the point (tip) at its end"

[gripper]
file = "gripper.xml"
status = "draft"
sports = ["throwing"]
contact = ["finger_l", "finger_r"]
site = "center"
note = "a parallel gripper that holds and releases (two fingers on slide joints, 0-8 cm); the release is the sport's action"
