# Generated from scripts/kinder/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/{{task_dir}}"
description = "KinDER {{env_name}}: produce one replayable trajectory that reaches the goal, frozen scene instance {{instance_tag}}."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", {{keywords}}, "physical-reasoning", "trajectory", "{{family}}"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "{{robot_id}}"
# KinDER env {{env_id}}
family = "{{family}}"
tier = "privileged"
# scene = environment/instance.json (KinDER's seed + a digest of the scene it builds); identity = the dataset.toml digest
instance_seed = {{seed}}
expert_time_estimate_hours = {{expert_hours}}

[verifier]
timeout_sec = {{verifier_timeout}}
network_mode = "no-network"

[agent]
timeout_sec = {{agent_timeout}}
# Off the network like every task here (docs/LEAKAGE.md); the model API is opted into per run with
# `harbor run --allow-agent-host <host>`.
network_mode = "allowlist"
allowed_hosts = []

[environment]
build_timeout_sec = 1800.0
cpus = 16
memory_mb = 16384
