schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/golf-putting-program-standard"
description = "PROGRAM PLAY, turn-based (eai-standard-turn/1.0): a 4-hole mini-golf putting round (par 9) on sloped greens with walls and an obstacle block (deterministic rolling-ball / cup model, MuJoCo scene rendering), instance seed chosen at run time (RCB_SEED; course layout and stroke scatter). The agent plays each stroke (aim, speed; seeded scatter) from camera images only, and may write a program that observes and putts without a new model response per stroke; one action in flight at a time. A 60-minute chess clock runs on the agent's turns (reviews included, simulation excluded); a review after each stroke. Success: a valid, complete round in 9 strokes or fewer (par)."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "mujoco", "golf", "putting", "mini-golf", "turn-based", "chess-clock", "vision"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded game itself
simulator = "mujoco"
robot = "none (putter stroke primitive)"
family = "golf_putting"
mode = "standard"
protocol = "eai-standard-turn/1.0"           # turn-based extension of standard mode
oracle = "full"
oracle_evidence = "solution/: the privileged reference player's precomputed strokes for each official seed (5, 6 and 5 strokes on 20260928, 13 and 14), played through the service's HTTP calls; other seeds: straight putts"
revision = "turn-1-program"
parameters = "RCB_SEED (default 20260928)"
expert_time_estimate_hours = 0.5

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 600); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 700

[agent]
timeout_sec = 7200.0           # preparation, then the game on a 60-minute chess clock

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
