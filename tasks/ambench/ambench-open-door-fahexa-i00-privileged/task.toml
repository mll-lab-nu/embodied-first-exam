# Generated by scripts/ambench/mk_tasks.py -- edit the template or scripts/ambench/descr/, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/ambench-open-door-fahexa-i00-privileged"
description = "AM-Bench OpenDoor-Am-FAHexa-Abs-PID-Direct-v0 (a fully actuated hexarotor with a 4-joint arm and a two-finger gripper, Isaac Lab / Isaac Sim 5.1): produce one replayable trajectory of AM-Bench's absolute end-effector pose actions at 120 Hz. Task: A free-standing door stands ahead of the hovering aerial manipulator: an oak door panel in a metal frame, hinged on its left edge (as seen from the robot), with a metal lever handle near its right edge on the robot-facing side. Open the door: swing the panel on its hinge, away from the robot, by more than 20 degrees from closed. Frozen scene instance: AM-Bench's seeded reset, seed 0; graded by AM-Bench's own success check in two fresh-process replays."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "ambench", "aerial-manipulation", "isaac-lab", "isaac-sim", "hexarotor", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "ambench"             # AM-Bench @ 60bf5b7 on Isaac Lab @ f4aa17f / Isaac Sim 5.1 (PhysX on the GPU, RTX rendering)
robot = "ambench-fahexa"
family = "open_door_fahexa"
mode = "privileged"
dynamics = "static"               # scene dynamics (PROTOCOL §2): nothing but the robot does work on the scene
oracle = "full"
instance_seed = 0
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 8.0
min_memory_gb = 16.0
min_gpu_memory_gb = 8.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 16.0
verifier_min_gpu_memory_gb = 8.0
measured = "freezing the instances, oracle trials and replays (RTX 4090, 2026-10-13/14, docker stats and nvidia-smi every 2-10 s, rcb_monitor): with one environment's PhysX buffers (the tooling's), a camera-free Isaac process (the default Session, the grader's replays) peaks at 2.0 GiB of memory and 1.2 GiB of GPU memory (Isaac Lab's default buffers: 2.9 / 3.2); the render worker that draws the cameras (Session(cameras=True), the verifier's filmed illustration) adds 11.9 GiB and 3.4 GiB (3.3-3.6 under every RTX preset tried); 6-10 cores while Isaac starts, about 1.5 after; the verifier runs one process at a time. The minimums cover one camera-on Session"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 28.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 28.0
measured = "a Session with cameras peaks at 14 GiB of memory and 4.6 GiB of GPU memory (its render worker included), a camera-free one at 2.0 / 1.2 (the rule's measurement); the agent may run two Sessions with cameras at once: at most 28 GiB, 9.2 GiB -> memory 28 GiB (the container's cap 34 GiB: 34 / 1.2 >= 28), GPU 16 GiB (at least 16 for Isaac Sim); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 8.0, memory_gb = 34.0, pids = 16384 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
# 4 x tests/grade.py's per-process limit for this episode (1799 rows: max(1800 s, 1500 s + rows / 4)): two fresh-process
# replays (camera-free), one rerun of a replay that died early or had GPU faults, and the filmed illustration
timeout_sec = 7800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # Isaac Sim starts and renders offline: every asset is in the image (images/ambench/web_assets.txt)

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 24576

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2.12)
# AM-Bench's scripted experts and its datasets are public upstream, so the agent reaches the model APIs and the package
# registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0           # a first run builds the simulator image from public sources (tasks/ambench/README.md, Before you run)
cpus = 8
memory_mb = 34816

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
