schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/referee.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/trajectory.first.npz", service = "sim" },
  { source = "/data/replay.first.mp4", service = "sim" },
  { source = "/data/replay.first.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/embodied-olympics-fun-shot-put-i00-standard-mcp"
description = "STANDARD MODE, MCP TOOLS ONLY (robot as a service, eai-standard/2.1): Embodied Olympics shot-put on the same frozen instance as embodied-olympics-fun-shot-put-i00-privileged. Put the shot that rests on your open right palm at your neck, from the shoulder with that hand alone, so that it lands inside the sector at least 6.0 m from the circle, then leave the circle from its rear half and stand. The agent only gets a client: the robot's two head cameras (depth on one), its joint sensors and IMUs, the venue's fixed camera, and action chunks (walking, running, joint targets, Unitree LowCmd, the hands' grip). 5 resets, the last attempt graded; no object state, no referee state during an attempt. The sim service records the attempt and grades it live with the family's referee (no grading replay)."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "standard-mode", "trajectory", "shot-put", "mcp"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "unitree-h1-2"
family = "shot_put"
category = "throwing-catching-striking"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.1"
instance_seed = 0
expert_time_estimate_hours = 10.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: No reference solution: a CMA-ES search over the four key poses, their times and the legs' drive keys (about 160 generations) finds legal puts of 6.1-6.8 m only with a hand passing through the robot's own body (the right thumb up to 4.7 cm into the right shoulder during the crouch, the left hand up to 6.8 cm into the right hip in the follow-through), which the robot's self-collision rules out; with a penalty for that, no clean put was found. Positive by a declared magic action. The real parts: the stance held by the walking policy with the shot on the open right palm, then after the release the walk backwards out of the rear half and the stand. The injected part, once at 0.5 s: the shot's velocity on the palm set to 8.0 m/s at 38 deg along the robot's heading. It leaves the palm at 7.9 m/s from 1.58 m (push fraction 0.78) and lands 6.29 m from the rim; the same state hash twice. Negatives: nop (time), a 1 m/s put (touched after the release), 30 deg to the side (outside the sector), the arm lowered or taken back, the other hand, the stop board, short, a fall after the landing.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades the live
# episode (no grading replay). The loops run on the clock, inside timeout_sec: the verdict ("finalized":
# true, written before any video is rendered) may take until 840 s (the end waits through a crash-recovery resume);
# then the hook waits for the video, one render pass from the trajectory ("video_pending"), until 870 s -- a video that
# is not ready by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md). The agent's
# container holds no simulator, no referee and no instance.
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0


# Robot control through the efe-robot MCP server only (mode standard-mcp; embodied_first_exam/standard/mcp/)
[[environment.mcp_servers]]
name = "efe-robot"
transport = "stdio"
command = "python3"
args = ["/opt/tools/efe_mcp/server.py"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
