# The agent's container is the simulator's (privileged mode): one GPU, the licensed BEHAVIOR dataset read-only at /bdata
# (the image links its parts into /data), Isaac's cache in a volume of this trial only (no fixed name: Harbor's teardown
# deletes it).
services:
  main:
    pids_limit: 16384   # rcb-monitor
    build:
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:ispatialgym-0.2.1"]   # our prebuilt image: its layers are reused when you can pull it, else Docker builds the recipe
    volumes:
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
      - ${RCB_BEHAVIOR_DATA:?set RCB_BEHAVIOR_DATA to the directory holding your licensed BEHAVIOR dataset (tasks/ispatialgym/README.md)}:/bdata:ro
      - rcb_ispatialgym_cache:/cache
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.3.0@sha256:53154417782408df8309194971b08b18c3682d2b337e2e3b2eb4c88fe025ab85
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_ispatialgym_cache:
