# Limited mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# TopoGym runs its physics on the GPU (CUDA) and renders camera images with Nyx: the GPU goes to the sidecar.
# Nyx renders through Vulkan, so the container needs the NVIDIA graphics libraries as well as compute: `runtime: nvidia`
# with NVIDIA_DRIVER_CAPABILITIES=all (`capabilities: [gpu]` alone injects compute only).
services:
  main:
    depends_on: [sim]
  sim:
    image: ghcr.io/luigivamper/rcb-topogym:0.2.3-cu128
    volumes:
      - ./sim:/srv:ro
    working_dir: /tmp
    command: python /srv/server.py
    environment:
      RCB_TASK: cast_keyhole
      RCB_INSTANCE: /srv/instance.json
      RCB_WALL_CLOCK_S: "21600"
      PYTHONPATH: /srv:/opt/topogym
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
      NVIDIA_DRIVER_CAPABILITIES: all
    runtime: nvidia
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
