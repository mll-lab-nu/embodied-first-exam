# Unlink C Ring layout expressed in the TopoGym tabletop V1 task frame.
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# docx 3.4：支架上固定一个闭合刚性圆环，C 形开口环与其互锁。开口是 unlink 的唯一
# gateway——闭合环身必须从开口通过，其余方向都是刚体碰撞死路。
#
# 本文件的尺寸不是随手取的，五条不等式互相咬合，改任何一条都要重跑
# `python tests/check_c_ring_clearance.py`：
#
#   1. 开口能过环身        gap_clear_width > 2 * fixed_ring.tube_radius
#   2. C 环套得进管身      c_ring 的孔半径 > fixed_ring.tube_radius
#   3. 抽出时不撞桌面      c_ring 静置中心高 - 抽出行程 - c_ring 外半径 > 余量
#   4. 静置时凸台不触桌    c_ring 静置中心高 - (major_radius + tab.length) > 余量
#   5. reset 时不撞机械臂  固定环顶与悬臂顶 < home 位指尖 task z 0.1608
#
# 第 5 条与 bar_through_hole 的 panel.top_z 同一条余量：高于 home 指尖的结构会在
# reset 的 set_dofs_position 瞬移里被扎进去，stacked_plate 当初就是这样出的求解器 NaN。
# 当前留 15.8mm（固定环顶 0.143，悬臂顶 0.145）。

task:
  id: unlink_c_ring
  difficulty: smoke

coordinate_frame: task

# ------------------------------------------------------------------------ 支架
# 立柱 + **平放的**闭合圆环：环平躺在立柱顶上，在正对立柱的那一侧环缘挂 C 环。
# 没有悬臂。
#
# 2026-08-22 由「竖立圆环 + 水平悬臂」改成这个形态。原形态在 viewer 里暴露的问题是
# 机械臂被立柱与悬臂卡住：离线 gate 核过 **C 环**包络与悬臂的净空，没核**手**的，
# 而抓取点正在悬臂正下方，手降下去必然撞上。平放的环把头顶结构整个去掉。
#
# 附带的好处比让路更大：环平放之后，抽出要绕的转轴（C 环法向）变成水平且指向机器人，
# 夹爪若从侧面正对 C 环的环面进去，**工具轴与转轴重合**，90° 滚转就是绕工具轴自转
# （joint 7，行程 ±166°）。原形态那条「手腕 90° 水平轴重定向、仓库无先例」的主风险
# 由此消失。
stand:
  # 从闭合环中心指向 C 环悬挂点的水平方位角（绕 +z）。立柱在正对面的环缘上，
  # 因此立柱与 C 环相距一个环直径。
  # 270° = C 环挂在环的 -y 缘、立柱立在 +y 缘，即机器人的左手边。这样：
  #   - front 相机（架在 +x、y=0）正对 C 环的环面（法向 ±x），立柱偏在画面一侧；
  #   - oblique 相机架在 -y，C 环在前、立柱在后；
  #   - 夹爪沿 ±x 进出，与转轴同向。
  hang_yaw_deg: 270.0
  # 立柱半径。它不承任何力，也不进入 top_z（竖直圆柱的顶面是平的，半径不抬高轮廓）。
  post_radius: 0.008
  # 立柱表面与 C 环最外点之间要求的最小净空。实际 37mm。
  clearance: 0.008
  color: [0.55, 0.55, 0.54]

# -------------------------------------------------------------------- 固定闭环
# 平放：环面水平、法向朝上。因此它只比自己的平面高出一个管半径——竖立时要高出一整个
# major_radius，这就是本形态给 home 位让出大量净空的原因。
fixed_ring:
  # 环心。z = C 环静置中心 + 孔间隙 = 0.090 + 0.031。
  # xy 使 C 环（挂在 -y 缘）落在 y=0 上，即机器人的正中线。
  center: [0.060, 0.045, 0.121]
  # 环半径同时决定立柱离 C 环多远（两者相距 2*major_radius = 90mm）。
  major_radius: 0.045
  tube_radius: 0.004
  segment_deg: 10.0
  joint_overlap: 0.001
  mass: 0.30
  color: [0.62, 0.62, 0.61]

# ---------------------------------------------------------------------- C 形环
# 竖直：环面为 yz 面，法向 ±x。
c_ring:
  # 放大到 40mm：管身正上方 31mm 处就是闭合环的平面，而横躺的手在抓取点上方约 40mm。
  # 环大一些，抓取点才能落到离那个平面足够远的下半圈。
  major_radius: 0.040
  tube_radius: 0.005
  # 开口净宽 = 2*R*sin(gap/2) - 2*r = 12.05mm，对 8mm 的管身单边留 2mm。
  gap_deg: 32.0
  # 开口方位角，从环的正上方（管身所在处）起算、朝 -y 为正。
  # 90° 而不是 270°：抽出时的滚转把方位角 θ 搬到 θ-90，抓取点从环底（180°）转到 90°，
  # 也就是 -y 侧——那一侧完全在闭合环的footprint 之外（环占 y ∈ [0, 0.090]）。
  # 取 270° 会把手转到 +y 侧，横躺的手会顶进闭合环的平面。
  gap_azimuth_deg: 90.0
  segment_deg: 10.0
  joint_overlap: 0.001
  # 出生时比静置位高这么多，落下去自行贴合。静置位在几何上是零间隙。
  spawn_drop: 0.002
  mass: 0.05
  color: [0.78, 0.45, 0.20]
  # 径向抓取凸台。**默认关闭。**
  # 它当初是为「防止 C 环自行脱开」加的，而 2026-08-22 的对照实测证明维持互锁的是
  # 悬挂接触的库仑摩擦（12.3 vs 0.79 mNm，15 倍），凸台贡献为零（见文档 §2.3、§6.4）；
  # 新形态下夹爪直接侧向捏管身，它也不再是抓取特征，而且正好挡在抓取方位角上。
  #
  # 备用方案：若侧向捏管身抓不稳，按用户建议在 C 环上加一根**沿环法向**的横杆
  # （不是这里的径向凸台）。那种朝向下手指绕横杆合拢，转轴、工具轴、横杆轴三者重合，
  # 是最省手腕的一种。届时新写，不复用这个字段。
  tab:
    enabled: false
    azimuth_deg: 180.0
    length: 0.020
    radius: 0.005

# ------------------------------------------------------------------ 拓扑读数
# 判定契约见 docs/develop/framework/task_taxonomy_zh.md §4.3（C3 entangle）。
topology:
  # 投影方向不在这里配，由 _c_ring_geometry.bisector_projection 从两个环的法向导出：
  # 两法向互相垂直（C 环挂在闭合环的切向管段上），取其角平分线为视线，两个环都是 45°，
  # 谁也不是边对边——这是交叉计数有定义的前提。契约要求的「显式声明」由运行时打印与写入
  # to_info() 满足。
  #
  # 为什么不写死：整组场景随 stand.hang_yaw_deg 转。此前写死的那个矩阵在一个朝向上正确，
  # 换个朝向后正好沿着 C 环自身的平面看过去，出生读数变成 Lk = -2（2026-08-22，
  # 由 tests/check_c_ring_clearance.py 拦下）。
  #
  # canonical closure：C 环是开曲线，linking number 只有把开口用一条直弦补上之后
  # 才有定义。这条弦上取几个采样点。
  closure_samples: 6
  # 判「卡住」的穿透深度阈值。两环最深的弦近似误差是 0.11mm，非 gateway 轨迹实测
  # 穿透 9mm，取 1mm 把两者分开。
  jam_depth: 0.001

# ---------------------------------------------------------- 生成的 URDF 落点
# 相对仓库根，由 world.rope.resolve_mesh_dir 解析。build 产物，已 gitignore。
urdf_output_dir: .cache/topogym/urdf/unlink_c_ring

# -------------------------------------------------------------------- 装饰
# 一律 collision=False（tasks/_visuals.py 的标准规则）：整组关掉不得移动任何一个接触点。
# 只装饰立柱——C 环是运动件，独立的无碰撞装饰实体要逐步同步位姿，不值当。
visual_details:
  pedestal:
    enabled: true
    # 底板按立柱直径的倍数给。立柱细到 16mm 后 1.6 倍只有 26mm，撑不住 139mm 的高度，
    # 看着像插在桌上；2.5 倍是 40mm。底板落在 y ∈ [0.060, 0.100]，与 C 环（y 至多 0.035）
    # 还差 25mm，不会在画面里贴上去。
    foot_scale: 2.5
    foot_thickness: 0.005
    color: [0.30, 0.32, 0.35]

# ------------------------------------------------------------------------ 动作
# gateway = docx 3.4 的正解；no_align = 防捷径对照，跳过对准直接下移搬走，
# 起止位置与正解几乎相同，唯一区别是开口从未对准管身。
oracle:
  mode: gateway

primitive:
  # 抓在环身上的哪个方位角。取 180°，即 C 环的正底部。两头都要合适：
  #   起始（180°）：在 y=0 的那条竖线上，而闭合环在 y=0 只有悬挂点一个点，
  #                 横躺的手无论多高都不会碰到环面；
  #   转完（90°）：落到 -y 侧，完全在闭合环的 footprint（y ∈ [0, 0.090]）之外。
  # 它离开口（90°）与另一侧各 90°，是离管身最远的位置，内侧手指不会碰到管身。
  grasp_azimuth_deg: 180.0
  # 抓取姿态由代码从几何算出，不写死：工具轴取 C 环法向中背离机器人的那一支，
  # 于是抽出的滚转与工具轴重合，是 joint 7 的自转。这里只留一个绕工具轴的预旋角，
  # 用来让指面横跨管身而不是顺着管身——指头合拢的方向由 Franka 的手部几何定，
  # 光看场景推不出来，要在 viewer 里看一眼再定。
  grasp_roll_deg: 0.0
  # 沿工具轴后退多少开始接近 / 松开后退多远。不是 z 偏移——本任务的工具轴是水平的。
  approach_clearance: 0.070
  retreat_clearance: 0.090
  steps_per_phase: 90
  # 对准与抽出各自加长：前者是 90° 滚转，后者净空很紧，都不能走快。
  align_steps: 160
  extract_steps: 120
  gripper_steps: 30
  close_hold_steps: 30
  align_settle_steps: 30
  release_hold_steps: 100
  # 合爪停位。管身直径 10mm，取略小于半径的停位让指面真的压上去。
  grasp_qpos: 0.004
  # 抓取证据。assisted carry 下零件必然跟着走，指行程是唯一能区分「夹到环」与
  # 「合于空处」的读数。首轮留 null：先量出实际值，再回填阈值。
  min_finger_qpos: null
  max_grasp_pos_error: 0.020
  # 对准门。gateway 全程最紧处 0.15mm、开口单边余量 2.00mm，过不了就在下移前中止——
  # 开口没对准还往下走是把环怼进管身，而 assisted carry 下那是穿模不是卡住。
  max_align_deg: 3.0
  # 抽出后沿**径向朝外**移开多远（远离闭合环的中心），与离线 gate 的
  # gateway_phases(carry=) 同值。不沿管轴走：那个方向会绕回闭合环下面，环的远缘压在头上。
  carry: 0.090
  # 移开之后再放下多少。抽出后 C 环下缘离桌 27mm。
  place_drop: 0.023

# -------------------------------------------------------------------- 物理复核
physical:
  # 机械臂回 home 的沉降步数。
  settle_steps: 40
  # 指面与 C 环的接触摩擦。C 环靠 assisted attachment 承载，指面只需看起来夹住，
  # 但摩擦仍要配：沉降与释放两段是真接触。范围由 physical_contact.validate_rigid_friction
  # 限在 [0.01, 5.0]。
  finger_links: [left_finger, right_finger]
  finger_friction: 2.0
  c_ring_friction: 1.0
  # 释放后稳定性测试。判据是**停下来了**，不是**没动**：抽出后的 C 环是一个立在桌面上的
  # 环，松手必然倒平，环心会掉约 31mm、横移约 35mm。那是预期行为，不是失败；不可接受的是
  # 它一直在动（滚出板外）或读数变了。
  # 因此量的是最后一段窗口内的位移：全程步进 release_check_steps，只在最后
  # release_settle_window 步里要求位移小于 release_max_drift。
  release_check_steps: 240
  release_settle_window: 60
  release_max_drift: 0.003

# 自由平移探针。契约对 C3 强制要求「分离后可沿任意方向平移离开」。
travel_test:
  # 推力按 C 环自重的倍数给，换质量时含义不变。
  force_scale: 3.0
  steps: 60
  settle_steps: 20
  # 判「自由」的位移门槛。解链前六个方向实测全部卡住（穿透 8.75–9.00mm），
  # 解链后应当全部远超此值。
  free_travel: 0.010

# ---------------------------------------------------------------------- 判定
success:
  # 判「已分离」的最小表面净空。仅仅不重叠还不够——读数为解链但两面仍贴着，
  # 那是抽到一半的位姿，不是终态。
  min_surface_gap: 0.002
