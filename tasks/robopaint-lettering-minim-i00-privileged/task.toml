schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robopaint-lettering-minim-i00-privileged"
description = "RoboPaint lettering: embodied robotic lettering (ManiSkill 3.0.1 Franka Panda holding a broad-edge (chisel) dip pen; the mark is the chisel edge swept along the path it takes): produce one replayable trajectory that copies the lettering shown in the picture target.png onto the main sheet with pen and ink, in at most 7 strokes. Scored against the picture (after the best single shift of the sheet, at most 5 mm along each axis: success iff IoU >= 0.86, boundary F within 1 mm >= 0.80, every stroke of the exemplar covered >= 0.75, stray ink <= 0.04 of its inked area and at most 7 strokes; the IoU is the continuous score). s.score() is served by a separate scoring container."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "maniskill", "sapien", "lettering", "calligraphy", "broad-edge", "italic", "franka", "code-as-policy", "trajectory", "robopaint_lettering_minim"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "maniskill"           # ManiSkill 3.0.1 / SAPIEN 3.0.3 (PhysX on the CPU) + the broad-edge nib model (rcb_brush.py, CPU)
robot = "franka-panda"            # PandaStick with a dip pen: rigid holder + a collision-free 6 mm 4 mm chisel nib; TCP = the middle of the edge
family = "robopaint_lettering_minim"
mode = "privileged"               # privileged (exact sheets, pen state, reset, scoring service) | standard (RGB only: the -standard twin)
oracle = "partial"                # solution/solve.sh replays the frozen reference plan; its recorded scores: oracle_evidence
oracle_evidence = "Reference solution in solution/. Oracle 1 and nop 0 in the release validation (ws3, 2026-09-28: lettering-u-oracle-final0928, lettering-u-nop-final0928), on earlier scoring and tooling. Changed since: the v2 registered scoring (0c61185b: scorer and success rule; the saved oracle trajectories re-scored, all pass; Harbor oracle and nop on minim and nun, this pair included), tooling snapshot 23 (ccb213d0: the scorer; re-scores bit-identical), the 2.2 inputs (cf95376f) and the rated limits (fe5fb9e6), both adding tooling queries only. Not re-run on this version (static validation only)."
instance_seed = 0                 # scene = environment/instance.json (agent's copy: sheets, pen, ink well, start joints, the rule, instance_sha)
expert_time_estimate_hours = 3.0
difficulty = "medium"          # RoboPaint tiers: line easy; lettering medium (one short word, broad edge) / hard / extreme (pointed pen, long words)
medium = "broad_nib"           # the pen model: broad_nib | pointed_pen (rcb_brush.py)
hand = "italic"               # difficulty axes: hand, letters, strokes (= the stroke cap), pen control
letters = 5
stroke_count = 7
pen_control = "wrist yaw (pen angle)"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 7200.0              # 2 h of wall clock (a replay of a few thousand control steps takes seconds)
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
