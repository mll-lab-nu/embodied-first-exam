schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/myosuite-soccer-i00-privileged"
description = "MyoSuite soccer (MyoLegs, 290 muscles, MuJoCo): produce one replayable trajectory of actuator commands. Score a goal: kick the ball into the goal, past the goalkeeper, within 10 s of simulated time (MyoChallenge 2025 Soccer P1: the ball's centre crosses the goal line between the posts and under the bar). Frozen scene instance (myoChallengeSoccerP1-v0, reset seed 0); graded by two fresh-process replays."
keywords = ["robotics", "myosuite", "mujoco", "musculoskeletal", "myolegs", "code-as-policy", "trajectory", "soccer", "privileged"]

[metadata]
task_type = "trajectory"
simulator = "myosuite"            # MyoSuite 2.12.2 on MuJoCo 3.6.0 (CPU)
robot = "myolegs"
family = "soccer"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "none"
oracle_evidence = "a successful model trial on this frozen instance: Claude Code + Claude Opus 5.5 (run `claude_code-claude_opus_5_5-default`, 2026-10-06), trial `myosuite-soccer-i00-privileged__DuXNvn4` (308 rows); today's verifier scores its trajectory 1 in two fresh trials (tasks/myosuite/README.md); human review in PR #65"
instance_seed = 0                 # myoChallengeSoccerP1-v0: seed(0), then reset(seed=0)
expert_time_estimate_hours = 5.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# The agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS). MyoSuite's
# trained baselines ship in its PyPI wheel (and a standard-mode agent could rebuild the simulator from it): reachable,
# left to the instruction's honour rule (PROTOCOL §5).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 12288
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
