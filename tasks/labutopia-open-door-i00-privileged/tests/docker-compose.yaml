# The verifier replays in Isaac Sim, which needs the GPU. Its Kit caches are its own container's: nothing the agent's
# container cached (Kit keeps generated Python there) reaches the grader.
services:
  main:
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
