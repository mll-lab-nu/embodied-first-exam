# README data for tasks/embodiedswe/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   graders   each task's tests/grader/<scene>.py (privileged) = environment/sim/grader/<scene>.py (standard), byte
#             for byte; both are byte-identical to EmbodiedSWE's robobench/suites/<suite>/grader/<scene>.py at the
#             pinned commit. Each grader's check_success() decides; it calls the scene's own predicates in
#             robobench/suites/<suite>/scenes/<scene>.py, with the thresholds of the scene cfg as the preset in
#             robobench/suites/<suite>/configs/envs.py builds it (presets override layout only, never a threshold,
#             unless a comment below says so). The image's scrub (images/embodiedswe/scrub_embodiedswe.py) changes
#             comments only; it asserts the code's AST is unchanged.
#   tooling   embodied_first_exam/benchmarks/embodiedswe/rcb_embodiedswe.py: TASKS (L69-98, the check each preset
#             uses; cut_success L101-112 and so101_success L115-133 for the three scenes without success()),
#             ToolOnlyMonitor L138-199 (spatula), the rollout verdict _final L908-935; privileged tests/grade.py (candidates,
#             ROLLOUT_S = 1800, GRACE_S = 30, MAX_SUBMISSIONS = 64, selection L210-214); sim/server.py (episode ends
#             ctrl_step L466-476 and L520-590, verdict and dump L268-307) and standard tests/grade.py (success = final.json success, no infra
#             error, reason != "error").
# Upstream line numbers are those of EmbodiedSWE @ 67f44e8 (robobench/...). Physics rates are each instance's
# physics_dt (environment/instance.json).

[benchmark]
name = "EmbodiedSWE"
citation = "Shen et al., 2026"      # upstream README "Citation" (arXiv 2609.27308)
url = "https://github.com/EmbodiedSWE/EmbodiedSWE"
repo = "EmbodiedSWE/EmbodiedSWE"
commit = "67f44e8"

[license]
text = """
EmbodiedSWE ([EmbodiedSWE/EmbodiedSWE](https://github.com/EmbodiedSWE/EmbodiedSWE) @ `67f44e8`): code under the
Apache License 2.0. The scenes load EmbodiedSWE's asset bundle (Hugging Face `EmbodiedSWE/robobench-assets`, revision
`62fab5b`), whose assets carry mixed licences, some of them **non-commercial (CC BY-NC)** or store-licensed (Fab /
Objaverse models); each asset's licence ships with the bundle. The simulator is NVIDIA Isaac Sim 5.1 with Isaac Lab
2.3.2, under NVIDIA's licence terms (use, no redistribution), built with RoboLab's recipe (Apache License 2.0). For
these reasons the task image is built locally and never published.
"""

[robots]
franka-panda = "Franka Emika Panda arm with its parallel-jaw gripper, under EmbodiedSWE's operational-space controller"
franka-panda-bimanual = "Two Franka Emika Panda arms with parallel-jaw grippers, each under EmbodiedSWE's operational-space controller"
unitree-g1-dex3 = "Unitree G1 humanoid with three-finger Dex3 hands, upper body driven by Pink IK (wrist poses and hand joints)"

# privileged tests/grade.py: candidates() (submissions in name order, at most 64, then `final`), freeze() (receipt
# check -> invalid_submission; no solve.py -> missing_solution; both score 0, not run), content_hash dedupe; rollout()
# (fresh process, ROLLOUT_S = 1800 s of wall clock from its start, SIGTERM, GRACE_S = 30, SIGKILL; no rollout.json while
# in phase "solve" -> no_verdict, 0); selection max(score, success, ran) = the first such (final last).
# rcb_embodiedswe.py rollout: start-state check (instance_mismatch only on the freezing GPU model -> infra_error), the
# grader records after every control step, solve(env) as `nobody` behind esw_proxy (env.step the only write), verdict
# _final() L908-921: success = check_success on the state when the run ends, progress = the rubric's peak.
[modes.privileged]
success = """
The graded runs: the verifier, in a separate sandbox without network, grades each checkpoint the agent froze with
`submit` (`/app/output/submissions/NNNNNN/`, at most 64) and the final `/app/output/solution/`. Each distinct candidate
runs once in a fresh process: the simulator is built from the frozen instance (seed 0, GPU PhysX) and the candidate's
`solve(env)` drives it from another process, without network or GPU, through a proxy env in which `env.step(action)`
is the only call that changes anything. The run ends when `solve` returns or raises, when its process ends, or 30 min
after the grading process started (start-up and import count). The conditions above are checked on the state at that
moment; a condition stated as having happened counts from the moment it happened in that run. There is no reset.

A candidate without `solve.py`, a checkpoint whose files differ from its receipt (`submission.json`), and a run whose
process ends without a verdict while solving score 0. Byte-identical candidates are graded once. The result is one
candidate: the one with the highest progress (EmbodiedSWE's rubric score for the task, the peak recorded during its
run), ties going to success, then to the earliest (the final folder counts last). That candidate's success is the
task's. The rebuilt start state is compared with the frozen instance; on the GPU model that froze it (NVIDIA L40S) a
mismatch is an infrastructure failure, not a score.
"""

# sim/server.py: RCB_AGENT_END=1 (docker-compose): ends at POST /finish ("finished"), the collect hook at the session's
# end ("timeout"), a tool contact ("tool_contact", success forced False in dump()), ctrl_steps() >= R.MAX_STEPS = 400,000
# ("step_limit"), a simulator error ("error"); finish() -> verdict() on the live state (grader check_success + rubric
# peak); success is never shown (hidden). standard tests/grade.py: ok = final.json success AND not infra_error AND
# finalized AND reason != "error". Start check: EP.give_up("instance_mismatch ...") -> infra_error.
[modes.standard]
success = """
The graded episode: the one live episode, as it ran; nothing is replayed. There is no reset. The episode ends when
the agent sends `/finish`, when the agent's session ends (at the latest after {timeout}), on a simulator error, at
400,000 control steps (a technical cap), or, where the task has a tool-only rule, at the first touch. The conditions
above are checked on the live state when the episode ends; a condition stated as having happened counts from the
moment it happened in the episode. Meeting the conditions earlier does not end the episode, and the service never
reports success while it runs.

An episode ended by a simulator error scores 0. The rebuilt start state is compared with the frozen instance before
the agent is served; on the GPU model that froze it (NVIDIA L40S) a mismatch is an infrastructure failure, not a score,
and so is an episode the service never finalizes.
"""

