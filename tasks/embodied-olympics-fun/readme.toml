#               L174-178 (only with every stage latched), step() L273-291 (the generic fall rule: TaskBase.fall_rule,
#               fall_z, legal_ground; the time limit: TaskBase.time_limit_s -> fail("time"); done at the first success
#               or failure; nothing changes the record once done); B/rfo/task.py TaskBase L9-24 (the defaults: 30 s,
#               fall_z 0.35 m, legal ground = the feet; each family's module B/rfo/tasks/<family>.py overrides them).
#               No family overrides TaskBase.timeout(): every success is called by the referee during the attempt.
#   divergence  B/rfo/world.py World.step() L839-891: NaN qpos, a bad acceleration, or the robot or a prop faster than
#               MAX_SPEED = 150 m/s (L109) -> Referee.void(UNSTABLE) L166-172: a failure, also over a success latched in
#               the same control step; a success latched in an earlier control step stands.
#   privileged  B/grade.py main() L71-135 (missing / bad / wrong-task files, the horizon, one fresh-process replay,
#               instance check -> infra); B/rcb_rfo.py replay() L205-249 (rows from the frozen start until the referee is
#               done or the rows run out; a row whose mode the robot lacks ends the replay there), read_trajectory()
#               L252-275 (MAX_ROWS = 40000, L55). Verifier: tests/Dockerfile, task.toml [verifier] environment_mode
#               "separate", network_mode "no-network".
#   standard    B/standard/server.py RoboFun.step() L196-204 (RCB_AGENT_END=1: a success only recorded; a failure call
#               ends the attempt; the time limit is the step cap), end_judgement "events" L83;
#               standard/sidecar/rcb_service.py Service._step() L940-958, _end() L960-973 (events: a success seen at any
#               control step of the episode counts; error / reset -> 0), _judged() L683-686, _reset() L1208-1240 (a reset
#               clears the episode's success; a reset that does not rebuild -> instance_mismatch, infra), crash and
#               instance rules in the module docstring L57-78. Reset budget: RCB_RESET_BUDGET default 5 in every
#               standard and realtime environment/docker-compose.yaml. Verifier: standard-files sidecar/grade.py over the
#               sidecar's final.json (tests/Dockerfile).
#   realtime    embodied_first_exam/standard/realtime/rcb_realtime.py docstring L9-18 (paused until the first /submit,
#               one control step every control_dt x slowdown, zero-order hold) and L86-98 (error and crash rules after
#               the first command); RCB_SLOWDOWN default 1 in each realtime compose file; control_dt 10 ms (rcb_rfo.py
