schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/metaworldplus-peg-unplug-side-i00-privileged"
description = "MetaWorld+ (Meta-World v3 peg-unplug-side, Sawyer arm): Pull the peg out of the side-facing socket. Produce one replayable trajectory of Meta-World's native actions on a frozen instance; graded on the state after the last action."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "mujoco", "metaworld", "sawyer", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "mujoco"
robot = "sawyer"
family = "metaworld/peg-unplug-side"
mode = "privileged"
oracle = "full"
instance_seed = 0             # Meta-World's reset randomization (object and goal positions)
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Meta-World's scripted policies solve these tasks and are publicly downloadable, so egress is closed to the model APIs.
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §2.7
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[environment.healthcheck]
# The agent's clock starts once the simulator is ready (docs/PROTOCOL.md §2.9). The agent starts the simulator in its own
# processes, so before Harbor sets up the agent it runs this warm-up in the agent's container: one launch of the simulator
# with the frozen instance through the task's own tooling, which pays the trial's one-time start-up (shader and kernel
# caches, the instance check) outside [agent].timeout_sec. It writes no session log, trace or output; its log, with the
# start and end times, is /logs/artifacts/rcb_warmup.log (a trial artifact).
command = '''
exec >> /logs/artifacts/rcb_warmup.log 2>&1
date -u +"%FT%T.%3NZ warm-up start"
RCB_SESSION_LOG= RCB_SESSION_LOG_KEEP= RCB_AGENT_TRACE_DIR= timeout -k 30 3300 python - <<'PY' || exit 1
from mw_tool import Session
s = Session("/app/instance.npz")
s.close()
PY
date -u +"%FT%T.%3NZ warm-up done"
'''
timeout_sec = 3600.0
retries = 2

[verifier.environment]
build_timeout_sec = 1800.0
