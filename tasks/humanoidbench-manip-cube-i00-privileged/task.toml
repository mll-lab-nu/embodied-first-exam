# Generated from scripts/humanoidbench/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/humanoidbench-manip-cube-i00-privileged"
description = "HumanoidBench cube: produce one replayable trajectory that reorients two cubes in the Unitree H1's hands, frozen scene instance 00."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "humanoidbench", "code-as-policy", "trajectory", "h1hand", "manipulation", "cube"]

[metadata]
author_name = "pingyue"
# trajectory | policy (see docs/PROTOCOL.md)
task_type = "trajectory"
simulator = "humanoidbench"
robot = "unitree-h1hand"
# HumanoidBench env h1hand-cube-v0; paper category manipulation; C7 · in-hand precision
family = "cube"
mode = "privileged"
# scene = environment/instance.npz (frozen MuJoCo state); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 4.0
oracle = "none"
oracle_evidence = "none known: no run has passed it, and published RL reaches 60% of the bar (paper 135, FastTD3 221, bar 370); human review in PR #9"

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 4.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 0.0
measured = "GPU 1.1-2.3 GB, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: privileged container median 2.2 GB (p90 11 GB when agents run parallel rollouts), sim 0.7 GB, mem_guard (docker memory per container, mll-4090-1, 10-02..10); CPU author estimate"

[metadata.resources.limits]
# agent-phase limits; exceeding one fails the trial. scope: trial = every container, agent = the agent's container (docs/PROTOCOL.md §2.10)
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 16.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app"]
sustain_sec = 60.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 16.0

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container, built from tests/Dockerfile (docs/PROTOCOL.md §2.6): the agent's container,
# where it was root, is gone by then, and only /app/output/ crosses over. It replays locally and the reward
# formula is live in it, so it gets no network either.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# Deleting get_reward() from the image (images/humanoidbench/scrub_oracles.py) buys nothing if the agent
# can fetch it back -- upstream is pinned at a public commit, so one `curl raw.githubusercontent.com/...`
# or `pip download humanoid-bench` restores the whole answer key. Measured: with the default `public`
# baseline an agent-phase curl pulled basic_locomotion_envs.py and found 5 `def get_reward`.
# So the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
# the deliverable is reachable by search; one episode is ~0.58 s of one core
cpus = 16
memory_mb = 16384
