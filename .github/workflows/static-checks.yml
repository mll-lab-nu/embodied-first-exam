name: static-checks
on:
  pull_request:
    paths: ["tasks/**", "ci_checks/**"]
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Static checks on all tasks
        run: bash ci_checks/run_all.sh
