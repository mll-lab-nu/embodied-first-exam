schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/robopaint-xingshu-xian-i00-privileged"
description = "RoboPaint 行书 臨帖 (Chinese brush calligraphy, running script): embodied robotic calligraphy (ManiSkill 3.0.1 Franka Panda with a Chinese writing brush; the mark is the dynamic virtual brush of Wang et al., IROS 2020, re-implemented): produce one replayable trajectory that copies the exemplar character 賢 in running script, shown in the picture target.png, onto the main sheet with brush and ink, in at most 7 strokes. Scored against the picture after the best single shift of the sheet, at most 5 mm along each axis (success iff IoU >= 0.80, boundary F within 1 mm >= 0.75, every region of the exemplar's ink covered >= 0.80, stray ink <= 0.04 of its inked area and at most 7 strokes (continuous brush contacts); the IoU is the continuous score). s.score() is served by a separate scoring container. Process rules: write with brush strokes the way a person writes; colouring in or filling the shapes, zigzag, serpentine or contour-offset fills fail: a brush-tip path on the main sheet longer than 2630 mm made of marks narrower than 1.88 mm on average is colouring in. The stroke cap counts strokes as written (a contact is cut where the brush moves more than 5 mm without marking; a stroke longer than 1930 mm counts as several), and strokes must be sweeps."
keywords = ["robotics", "robopaint", "maniskill", "sapien", "calligraphy", "chinese-calligraphy", "xingshu", "running-script", "brush", "franka", "code-as-policy", "trajectory", "robopaint_xingshu_xian"]

[metadata]
task_type = "trajectory"          # trajectory | policy   (see docs/protocol/README.md)
simulator = "maniskill"           # ManiSkill 3.0.1 / SAPIEN 3.0.3 (PhysX on the CPU) + the Wang et al. 2020 dynamic brush (rcb_brush.py, CPU)
robot = "franka-panda"            # PandaStick with a Chinese brush: rigid handle + 30 mm collision-free tuft, TCP = the tuft's tip
family = "robopaint_xingshu_xian"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "partial"                # solution/solve.sh replays the frozen reference plan; its recorded scores: oracle_evidence
oracle_evidence = "Reference solution in solution/, made by the calligraphy planner (README, Reference solution; tasks/robopaint/README.md, Targets). The verifier scores it 1 under the process rules (tests/grade.py with rcb_brush_strict.py, two fresh replays): path_mm 1234 and mark_width_mm 4.59, against the colouring-in limits 2630 mm and 1.88 mm. Harbor oracle 1 and nop 0 on both modes of this pair on its current files (2026-10-09): tasks/robopaint/README.md (Validation)."
instance_seed = 0                 # scene = environment/instance.json (agent's copy: sheets, brush, ink stone, start joints, the rule, instance_sha)
expert_time_estimate_hours = 4.0
difficulty = "hard"             # RoboPaint tiers: line easy; xingshu singles hard, works extreme
medium = "calligraphy"            # the brush model: calligraphy (Wang et al. 2020) | broad_nib | mypaint
stroke_count = 7                  # difficulty axes: strokes (= the stroke cap), structure, characters
structure = "top-bottom"              # single (独体) | left-right (左右) | top-bottom (上下) | enclosure (包围) | work (several characters)
characters = 1

[verifier]
timeout_sec = 3600.0              # one fresh replay of at most 72,000 control steps (rcb_brush.MAX_STEPS) at 67-102 steps/s, plus its scene build
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # PROTOCOL H.6: the verifier has no network

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (a replay of a few thousand control steps takes seconds)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 12288
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
