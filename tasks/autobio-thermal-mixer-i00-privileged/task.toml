# Generated by scripts/autobio/generate.py -- edit the generator, the shared sources, families.json or the instance, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/autobio-thermal-mixer-i00-privileged"
description = "AutoBio thermal_mixer (Operate thermal mixer panel; a biology laboratory bench on MuJoCo): produce one replayable trajectory of joint position targets. Set the thermal mixer by pressing the buttons of its panel: time 30 s, temperature 33 °C, mixing speed 600 rpm. Frozen scene instance (AutoBio's reset, seed 0); graded by two fresh-process replays with AutoBio's own check."
authors = [{ name = "Canyu Chen" }]
keywords = ["robotics", "autobio", "mujoco", "laboratory", "biology", "ur5e-robotiq-2f85", "code-as-policy", "trajectory", "thermal_mixer", "privileged"]

[metadata]
author_name = "Canyu Chen"
task_type = "trajectory"
simulator = "autobio"             # AutoBio @ 0850421 on MuJoCo 3.3.0 (CPU)
robot = "ur5e-robotiq-2f85"
family = "thermal_mixer"
mode = "privileged"
oracle = "full"
difficulty = "hard"              # AutoBio's own level for the task
success_rule = "final"
instance_seed = 0                 # AutoBio's reset(seed=0) of ThermalMixerManipulate
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# AutoBio's scripted experts are in its public repository and its recorded demonstrations on Hugging Face (and a
# standard-mode agent could rebuild the simulator from the repository): the agent reaches the model APIs and nothing
# else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
