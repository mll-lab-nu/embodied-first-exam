schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/", "/logs/agent/rcb/"]

[task]
name = "embodied-first-exam/dextoolbench_hammer_claw_hammer_swing_side-privileged"
description = "DexToolBench (SimToolReal) claw_hammer / swing_side in MuJoCo: KUKA iiwa 14 + Sharpa HA4 hand; produce one replayable joint-target trajectory that carries the claw hammer through the 40 demonstrated goal poses in order. Task: Pick up the hammer and swing it sideways, following the green ghost hammer through its poses in order."
keywords = ["robotics", "dextoolbench", "simtoolreal", "mujoco", "dexterous", "tool-use", "iiwa", "sharpa", "code-as-policy", "trajectory"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "kuka-iiwa14-sharpa-ha4"
family = "dextoolbench/hammer/claw_hammer/swing_side"
dynamics = "static"               # scene dynamics (docs/protocol/tasks.md): the task's own declaration
oracle = "partial"
oracle_evidence = "SimToolReal's pretrained policy, replayed in this scene, reaches 13/40 goals (solution/)"
instance_seed = 0                 # DexToolBench fixes the start pose and goals (from a human demo); no randomization
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"       # docs/protocol/invariants.md H.6: the verifier has no network

# Resources (docs/protocol/resources.md): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
# SimToolReal's pretrained policy solves this task and is publicly downloadable, so egress is closed to everything but the model APIs and the package registries.
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); docs/protocol/invariants.md H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 20480
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
