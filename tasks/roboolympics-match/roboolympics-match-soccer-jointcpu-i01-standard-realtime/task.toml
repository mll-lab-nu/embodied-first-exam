dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2.14): scripts/task_dynamics.toml
slowdown = 10                     # standard-realtime: the world runs at 1/S of real speed (docs/protocol/README.md §4b); RO_SLOWDOWN's default
protocol = "eai-standard-realtime/1.0"
instance_seed = 101
opponent_level = 5
resource_tier = "cpu"
tier_twin = "roboolympics-match-soccer-jointgpu-i01-standard-realtime"
start_window_s = 7200
review_timeout_s = 300
revision = "soccer-2v2-11"
play = "program"
action_level = "joint"
source_task = "roboolympics/soccer-match-wallclock-program-lowlevel-standard"
source_builder = "roboolympics/pilots/soccer_joint/make_v5_tasks.py"
source_commits = ["7ae66874c32e"]
exporter = "roboolympics pilots/soccer_joint/export_fexam_pair.py"
player_mode = "unmetered"
official = false
expert_time_estimate_hours = 2.0
oracle = "partial"
oracle_evidence = "soccer-2v2-11, level 5 = our joint-level RL team (sports/soccer/rl/joint/v2: an omnidirectional gait trained with PPO at the joint level, about 1e9 steps, and an RL-trained strategy layer). The three frozen GPU-tier programs of GPT-6 Astra from our v5 pilot (developed on soccer-2v2-10 against level 2, unchanged) win 30 % of 90 practice matches against level 5 v2 (40 % against v1; against v1 on further seeds 48/150 = 32 % and 43 % of 150); a mirror match of v1 is even (24/50); scripted levels 2 and 3 never beat it (0/20, 0/40). Our joint-level reference team (the oracle) lost to level 5 v1 0:10 in both tasks on vanilla Harbor 0.23.0 (valid, replay identical, replay.mp4)"

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 16.0
min_memory_gb = 24.0
min_gpu_memory_gb = 0.0
gpu_required = false
