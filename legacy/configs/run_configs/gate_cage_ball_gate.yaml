# gate_cage_ball_physical_gate_demo 的运行模式参数。

defaults:
  - default
  - _self_

# 用哪个触发规则。三者共用同一个接口（planning/gate_cage_ball_planner.py），构成官方对照组：
#   oracle      : 等球进来且封门来得及，再下板 —— 预期成功
#   greedy      : 到位就插，不看球 —— 臂先到的实例失败（球被关在外面），球先到的实例可能侥幸
#   fixed_delay : 从 episode 开始数够 fixed_delay_s 秒就插，不看球 —— 时机轴的捷径：
#                 起点与球速逐 seed 变后，它的成功率落到中间水平
trigger: oracle

# fixed_delay 规则的下板时刻（秒，从 episode 开始计）。刻意不随实例变——变了就不是固定延时了。
# 2026-09-08 重标：3.6 → 5.5（引道加长、球速放慢，球到门变成 1.15–10.20 s，中位 4.24）。
# 2026-09-09 再标：5.5 → **7.25**。引道变斜之后球起步慢，到门的时刻变成 1.21–10.58 s（中位 5.34），
# 而 t_ready 从 2.40 涨到 2.70 s（approach 单独放慢，见 task 配置 motion.approach_steps）。
# 7.25 s 是 1000 seed 上落在「可下板窗口」内最多的取值：289/1000。
#
# **任何固定延时的上限从 37.2% 掉到 28.9%**（更早：旧包络上是 60%）。这不是标定失手——
# 包络每拉宽一次，背一个数就更不管用，正是这条对照要显示的东西。
# 2026-09-10 晚 三档坡（1° 第一趟可拦 / 2.5° / 5°）、引道 60 cm 再标：9.75 s 是 1000 seed 上
# 落在「球在门内且回门来得及」的最多取值：484/1000。任何固定延时的上限 48.4%。
fixed_delay_s: 9.75

# oracle 的富余 safety_margin 与可解性判据一起搬进了 task 配置的 timing 段
# （校验函数只拿得到 task 配置），这里不再有它。

# ---------------------------------------------------------------- 关于对照组
# release_y / speed / flat_end_y 逐 seed 随机（task 配置末尾的 variation 块，2026-09-03），
# 区间按场景本身的合理范围与两条可解性判据取，**不按基线分数反推**：
#
# 1. 起点固定时球的时间线每个 episode 完全相同，最优策略退化成「等 N 步再插」这样一个
#    常数，不需要观测球。随机化后 fixed_delay 就是这个常数策略，它的分数是「不感知」的上限。
# 2. greedy 的成败由 entry_delay 与 t_ready 的大小关系单方面决定。包络跨过
#    entry_delay == t_ready 这条边界（离线 1000 seed 里球先到的约 46%），greedy 会在一部分
#    实例上侥幸成功，那正是它落到中间水平的机制，不该被消掉。
#
# 硬保证的只有可解性：GateCageBallLayout.checks() 的判据 A（窗口 ≥ 插入耗时 + safety_margin）
# 与判据 B（臂就位时最晚下板时刻还没过），随机化时按构造满足。

# --- 变体（2026-09-03）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识。
variant_id: default
