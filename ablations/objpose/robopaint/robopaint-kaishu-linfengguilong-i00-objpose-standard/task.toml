schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/canvas_live.png", service = "sim" },       # the live episode's main sheet, the one that was scored
  { source = "/data/canvas_live_practice.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  "/app/output/",
]

[task]
name = "embodied-first-exam/robopaint-kaishu-linfengguilong-i00-objpose-standard"
description = "RoboPaint 楷书 臨帖, STANDARD MODE (robot as a service, eai-standard/2.2): embodied robotic calligraphy (ManiSkill 3.0.1 Franka Panda with a Chinese writing brush; the mark is the dynamic virtual brush of Wang et al., IROS 2020, re-implemented) on the same frozen instance as the privileged task: copy the exemplar work 麟鳳龜龍 (4 characters in regular script, two columns read right to left), shown in the picture target.png, onto the main sheet in at most 71 strokes, with a practice sheet for test strokes. The agent only gets a client: get_obs (camera RGB + proprioception), submit (ee_pose or joint_position chunks). No reset, no sheet readout, no brush model, no score; the sim service records the episode and scores its main sheet against the picture after the best single shift of the sheet, at most 5 mm along each axis (success iff IoU >= 0.80, boundary F within 1 mm >= 0.75, every stroke of the exemplar covered >= 0.80, stray ink <= 0.04 and at most 71 strokes). Process rules: write with brush strokes the way a person writes; colouring in or filling the shapes, zigzag, serpentine or contour-offset fills fail: a brush-tip path on the main sheet longer than 7880 mm made of marks narrower than 0.99 mm on average is colouring in. The stroke cap counts strokes as written (a contact is cut where the brush moves more than 5 mm without marking; a stroke longer than 920 mm counts as several), and strokes must be sweeps."
keywords = ["robotics", "robopaint", "maniskill", "sapien", "calligraphy", "chinese-calligraphy", "kaishu", "brush", "franka", "standard-mode", "trajectory", "robopaint_kaishu_linfengguilong"]

[metadata]
task_type = "trajectory"
simulator = "maniskill"
robot = "franka-panda"
family = "robopaint_kaishu_linfengguilong"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.2"
oracle = "partial"                # solution/: the privileged oracle's joint targets, streamed through the client
oracle_evidence = "Reference solution in solution/ (streams the privileged reference's joint targets; tasks/robopaint/README.md, Targets). The same trajectory scores 1 under the process rules in the verifier (the graders' rcb_brush_strict.py, with which the sim service also scores the live sheet): path_mm 2828 and mark_width_mm 3.07, against the colouring-in limits 7880 mm and 0.99 mm. Harbor oracle 1 and nop 0 on both modes of this pair on its current files (2026-10-09): tasks/robopaint/README.md (Validation)."
instance_seed = 0
expert_time_estimate_hours = 6.0
difficulty = "extreme"          # RoboPaint tiers: line easy; kaishu <= 5 strokes medium, 6+ strokes hard, works extreme
medium = "calligraphy"
stroke_count = 71                 # difficulty axes: strokes (= the stroke cap), structure, characters
structure = "work"
characters = 4

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode: the service scores its live sheet (the verdict), then renders the video once
timeout_sec = 2820                # ending a service that is resuming (up to 1500 s) + one render pass of at most 72,000 control steps

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 5120
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
