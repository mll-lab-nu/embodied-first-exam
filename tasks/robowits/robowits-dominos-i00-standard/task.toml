schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/journal.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/server.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/robowits-dominos-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): RoboWits dominos on the same frozen instance as the privileged task (evaluation scene 0 of task 6). Push the red block onto the green target area. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
keywords = ["robotics", "robowits", "genesis", "marvin-bimanual", "dual-arm", "standard-mode", "trajectory", "dominos"]

[metadata]
task_type = "trajectory"
simulator = "robowits"
robot = "marvin-bimanual"
family = "dominos"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.2"
oracle = "partial"
oracle_evidence = "Reference solution solution/oracle_replay.py, which streams the privileged oracle's recorded joint rows (solution/oracle_qpos.npy) through the client. It scored 1 under Harbor -a oracle on an earlier version of this task: job robowits-dominos-i00-limited-oracle-v2b-0924-2125, trial robowits-dominos-i00-limited__pnfVz4w, 2026-09-25 (laptop, Intel; the protocol's 2.0 service, then named rcb-limited; success=1, live 1, replay 1, deterministic 1; an uncommitted tree just before dev branch f15dbdb7). Same since then: the frozen instance (state hash 4f933a76ce2ce34b) and the joint rows (equal to that run's recorded trajectory). Changed since then, so the label is partial: the grader (dev branch 82d76c61; this PR: the crash-recovery fields and infra_error), the sim adapter server.py (dev branch 6c0b439e: protocol 2.2; this PR: crash recovery), the shared layer rcb_limited.py / rcb_client.py (dev branch 42813008; this PR: the eai-standard/2.2 layer with crash recovery), the tooling rcb_robowits.py (as in the privileged twin), the collect hook, the client image and pins, and the oracle player (this PR: it recovers from a crash). Not re-run on this version (static validation only, 2026-10-01). 2026-10-14 (an AMD workstation): Harbor -a oracle on this version (run under a temporary -i01 task name; the files differ from it only in that name and in comments) scored 1 (trial robowits-dominos-i01-standard__6MwPrG7: live 1, replay 1, deterministic 1; 187 rows + the 90-step settle window), nop 0 (reason agent_exit)."
instance_seed = 0
expert_time_estimate_hours = 2.0

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [0, 1, 2]

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
# end the episode (SIGUSR1 to the live service, through a crash resume if one is under way): the service runs the settle
# window after the agent's last command on the live simulator and writes the live verdict (nothing is replayed), then
# renders the video once; wait for it (final.json video_done), then hand over the record (docs/protocol/standard_mode.md §13.3)
command = "python3 /srv/rcb_limited.py end /data --wait-key video_done --timeout 2280; cat /data/final.json"
timeout_sec = 2400                # service up (a resume replays the journal first), the settle window, then the video

[agent]
timeout_sec = 3600.0             # RoboWits budget (why: tasks/robowits/README.md)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 5120
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
