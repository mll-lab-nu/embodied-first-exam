# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: rope_threading_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: rope-threading-medium-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Thread the rope through the colored rings. Along the rope from material
      start to material end, the required crossings are cyan R1 in the negative
      direction, green R2 in the positive direction, then purple R3 in the positive
      direction. A positive crossing follows the ring normal; a negative one opposes
      it. For this layout the normals in world coordinates are approximately
      R1=(0.258819, 0.965926, 0), R2=(-0.372500, 0.928032, 0),
      R3=(-0.791688, 0.522715, 0.316228). Pass the rope fully through each aperture,
      without extra crossings, intersecting the ring material or damaging the rope.
      Keep the whole threaded rope still.
    simulator:
      task_id: rope_threading
      robot_id: auto
      variation_id: medium
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
