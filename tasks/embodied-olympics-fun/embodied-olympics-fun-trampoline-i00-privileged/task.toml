schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-trampoline-i00-privileged"
description = "Embodied Olympics trampoline (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. On the trampoline, bounce as you like, then do one tuck jump, land on both feet, stop the bounce (one more straight out-bounce at most) and stand still. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "trampoline"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "trampoline"
category = "parkour-apparatus-balance"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 8.0
oracle = "full"
oracle_evidence = "Reference: a scripted G1 tuck jump (a balanced crouch, a lowcmd push on the sprung bed, the tuck held mid-flight, a squat landing that sinks as the bed recoils, one straight out-bounce, an ankle-strategy stand-up, 3 s still), chosen from 12 settings: 0.457 s of flight, a centre-of-mass rise of 0.32 m. The bed passes the FIG IV TRA 1 impact test in simulation (60 kg sphere from 4.00 m: deflection 0.988 m, in 940-1010 mm; rebound 3.486 m, in 3410-3660 mm). Negatives: nop, a tuck without a jump, pike first, a bent out-bounce, a second flight, a fall, an injected roll spin, an injected push onto the padding. Measured: success after 7.55 s of the 30 s limit, live and in a fresh replay, ending in the same state."

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
