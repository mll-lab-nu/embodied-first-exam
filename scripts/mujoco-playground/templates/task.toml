# Generated by scripts/mujoco-playground/generate.py -- edit the template or the instance, not this.
schema_version = "1.3"
artifacts = ["/app/output/", "/logs/agent/rcb/"]

[task]
name = "robot-coding-bench/{{name}}-privileged"
description = "MuJoCo Playground {{env}} in plain MuJoCo ({{robot_name}}, joint position control every {{dt}} s): {{task_toml}} Produce one replayable trajectory of joint position targets on a frozen instance (Playground's reset with seed {{seed}}); graded by {{grading_toml}}"
authors = [{ name = "{{author}}" }]
keywords = ["robotics", "mujoco", "mujoco-playground", "{{robot_tax}}", "quadruped", "locomotion", "{{kind}}", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "{{author}}"
author_org = "{{org}}"
task_type = "trajectory"
simulator = "mujoco"
robot = "{{robot_tax}}"
family = "mujoco_playground/{{env}}"
mode = "privileged"
oracle = "full"
instance_seed = {{seed}}             # the PRNGKey of Playground's reset (and, for the joystick tasks, its command process)
expert_time_estimate_hours = {{expert_hours}}

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# MuJoCo Playground's trained policies are public upstream, so the agent reaches the model APIs and nothing else
# (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
