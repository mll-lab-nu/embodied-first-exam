schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexhand-pot-shelf-transfer-i00-privileged"
description = "Lift a freely moving 1 kg two-handle stockpot off a worktop with two dexterous hands on a fixed dual-arm robot, carry it into an open kitchen shelf, set it down upright at the target, release and withdraw both hands. Task: Lift the pot by its two handles with both hands, carry it into the shelf on the left and set it down upright on the shelf board at the target, then open both hands and move them away."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "bimanual_transport", "bimanual", "dual-arm", "transport"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "marvin-bimanual-sharpa-wave"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "pot_shelf_transfer"
dynamics = "static"               # scene dynamics (docs/protocol/tasks.md): the task's own declaration

oracle = "full"
oracle_evidence = "solution/trajectory.npz: the 8,850 authoring rows of the accepted episode (bit-for-bit replay of the recorded states). Harbor 0.23 oracle reward 1 in both modes on 2026-10-14 (two fresh-process replays with identical state hashes; standard: live = replay). solution/wuji/trajectory.npz is a validated Wuji Hand 2.2 trajectory of this instance (8,266 controls, motor targets only, physical contact only); the oracle uses it when the run selects wuji (privileged: DEXHAND_HAND=wuji; standard: the sim service's hand), and it replays to success in two fresh processes with identical state hashes."
instance_seed = 0
expert_time_estimate_hours = 4.0
difficulty = "hard"
release_status = "provisional"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/resources.md): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 9216
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
