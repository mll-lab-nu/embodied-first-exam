schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/darts-501-program-standard"
description = "PROGRAM PLAY, turn-based, parameterized: the opponent level (RCB_LEVEL 1-4) and instance seed (RCB_SEED) are chosen at run time; the verifier reports them and whether they form an official configuration. Best of 3 legs of 501 double-out (3 darts per visit, bust rule; WDF rules) against a deterministic scripted thrower that aims with the optimal-aim policy for its own scatter; it throws first in legs 1 and 3, the agent in leg 2. Regulation board in a MuJoCo scene (osmesa rendering); dart flight under gravity and quadratic drag (the drag constant is not given). Each dart is a release command (`game throw YAW PITCH SPEED`) with published seeded scatter; observations are camera images only (thrower's view, side view with the last dart's path, board close-up) and the caller's calls. The agent may write a program that measures its darts in the images and computes and sends its throws, and stays in the loop (review after every dart). 60-minute chess clock on the agent's turn. One action in flight. Success: win a valid match (deterministic replay, no simulator, model-API or metering failure)."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "darts", "501", "sports", "turn-based", "chess-clock", "vision", "physics", "strategy", "match", "mujoco"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded match itself
simulator = "mujoco"
robot = "none (dart release mechanism)"
family = "darts_501"
mode = "standard"
protocol = "eai-standard-turn/1.0"           # turn-based extension of standard mode
oracle = "full"
oracle_evidence = "solution/: a reference player from the camera images and the documented physics (it measures its darts in the board close-up and fits the drag); offline it wins all 12 official configurations"
revision = "darts-501-program-3"
parameters = "RCB_LEVEL (1-4, default 1), RCB_SEED (default 5011)"
expert_time_estimate_hours = 0.75

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 600); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 700

[agent]
timeout_sec = 7200.0           # preparation, then the match: 60 minutes on the agent's clock plus the simulation

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
