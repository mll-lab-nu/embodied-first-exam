schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/canvas.png", service = "sim" },            # the replayed main sheet that was scored
  { source = "/data/canvas_practice.png", service = "sim" },   # the replayed practice sheet (never scored)
  { source = "/data/canvas_live.png", service = "sim" },       # the live episode's main sheet
  { source = "/data/canvas_live_practice.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{NAME}}-standard"
description = "RoboPaint lettering, STANDARD MODE (robot as a service, eai-standard/2.2): embodied robotic lettering (ManiSkill 3.0.1 Franka Panda holding a pointed flexible dip pen) on the same frozen instance as the privileged task: copy {{TASK_PLAIN}}, shown in the picture target.png, onto the main sheet in at most {{N}} strokes, with a practice sheet for test strokes. The agent only gets a client: get_obs (camera RGB + proprioception), submit (ee_pose or joint_position chunks). No reset, no sheet readout, no pen model, no score; the sim service records the episode, which is replayed twice and scored against the picture (after the best single shift of the sheet, at most 5 mm along each axis: success iff IoU >= {{IOU}}, boundary F within 1 mm >= 0.80, every region of the exemplar (at most 30 mm each along its strokes) covered >= 0.75, stray ink <= 0.04 and at most {{N}} strokes)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "maniskill", "sapien", "lettering", "calligraphy", "pointed-pen", "copperplate", "round-hand", "franka", "standard-mode", "trajectory", "{{FAMILY}}"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "maniskill"
robot = "franka-panda"
family = "{{FAMILY}}"
mode = "standard"                  # camera RGB + proprioception only; no sheet readout, no score, no reset, no pen model
protocol = "eai-standard/2.2"
oracle = "{{ORACLE}}"                # solution/: the privileged oracle's joint targets, streamed through the client
oracle_evidence = "{{ORACLE_EVIDENCE_L}}"
instance_seed = 0
expert_time_estimate_hours = 4.0
difficulty = "{{DIFFICULTY}}"          # RoboPaint tiers: line easy; lettering extreme (臨摹 of engraved round hand: long connected contacts, shades, loops)
medium = "pointed_pen"
hand = "{{HAND}}"               # difficulty axes: hand, structure, letters, words, strokes (= the contact cap), regions, pen control
structure = "{{STRUCTURE}}"
words = {{NWORDS}}
regions = {{NREG}}
letters = {{NLETTERS}}
stroke_count = {{N}}
pen_control = "press depth (shades) + wrist yaw"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # dump + exit the service, replay twice in fresh processes (+ video), score, write final.json
timeout_sec = 5400                # ending a service that is resuming (up to 1500 s) + two replays of at most 72,000 control steps

[agent]
timeout_sec = 3600.0              # written by normalize from scripts/task_cutoffs.toml (PROTOCOL §2.12)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL §2.11
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
