# =====================================================================================================
# C7 · in-hand precision
# =====================================================================================================
[[task]]
family = "cube"
role = "scored"
robot = "h1hand"
env_id = "h1hand-cube-v0"
paper_category = "manip"
capability_class = "C7 · in-hand precision"
status = "verified"
expert_hours = 4.0
completion_rate = "60%"
evidence = "paper 135, FastTD3 221, bar 370"
oracle_evidence = "none known: no run has passed it, and published RL reaches 60% of the bar (paper 135, FastTD3 221, bar 370)"
one_liner = "reorients two cubes in the Unitree H1's hands"
task_statement = '''a cube starts just above and in front of each palm. Rotate both cubes to the goal
orientation without dropping them.'''
scene_note = '''the cubes' starting orientations, the goal orientation and the robot's initial pose never
change between resets.'''
scoring_note = '''A weighted sum: the largest term is how closely each cube's orientation matches the
goal, averaged over the two hands; then how close each hand is to its cube; then a small share for
standing steadily without moving. The orientation term is sharp — it falls away quickly as the
orientation drifts, so approximate alignment earns much less than it looks like it should — and it
compares orientations as quaternions, sign included: of the two ways to turn a cube onto the goal, only
one scores, because the other ends at the same orientation with the opposite sign, which counts as far
off.'''
ends_note = "The episode ends the moment either cube drops below a height, or the pelvis does."
obs_layout = "qpos(90) + qvel(87) + the goal orientation as a quaternion(4)"
task_notes = '''The goal orientation is not in `(qpos, qvel)` — upstream writes it into the MuJoCo model
(`body_quat`), drawn from the global `np.random` at reset. It is frozen into this instance, so it is the
same in your container and the verifier's, and it does not move between resets.
'''
difficulty = '''- **The only true in-hand reorientation in the benchmark.** Both hands work at once, and the object
  has to be rotated *within* the grasp — fingers must release and re-grip without letting the cube fall,
  which is a qualitatively different skill from `insert_normal`'s rigid-grip transport.
- **A sharp objective with a cliff on both sides.** The orientation term decays fast, and dropping a
  cube ends the episode; holding the start pose lasts only 84 steps.
- **Goal state outside `(qpos, qvel)`.** Upstream puts the target orientation in `model.body_quat[-1]`,
  drawn from the global `np.random` that `reset(seed=)` does not reach. The instance snapshot covers
  `body_quat` for exactly this task; without it, agent and verifier would
  be rotating towards different targets.
- **One instance only**: `env.py` forces `randomness = 0` for this family, as it does for
  `bookshelf_*` and `kitchen`.'''

[task.standard]
task_statement = "a cube starts just above and in front of each palm. Rotate both cubes, without dropping them, to the goal orientation: that of the translucent cube with the same faces floating above and between the hands."
ends = "when the robot falls (its pelvis drops too low), when either cube drops"
hidden = "where the robot is in the room, not the cubes' orientations, not the goal orientation"
tier = "no root pose, no cube poses, no goal orientation"
