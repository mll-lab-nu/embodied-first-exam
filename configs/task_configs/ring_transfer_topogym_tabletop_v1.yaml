# ring_transfer —— docx 2.6「绳圈从柱 A 转移到柱 B」，TopoGym tabletop V1 task 系。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 场景：底板上两根工业走线柱（与 cable_routing / rope_winding 同一 prefab：柱身 +
# 喇叭底座 + 顶盖），一条闭合弹性环（FEM+IPC 周期管，topogym/world/closed_band.py）
# 平铺在桌面、套在柱 A 上、长轴背离柱 B。终态：环套在柱 B 上、不再围住 A。
# linking signature (A:1, B:0) -> (A:0, B:1)，中间两次越过柱顶：B 顶落套、A 顶提离。
#
# 变体轴预留（2026-08-24 决定）：posts 是列表、ring.enclosure / goal.enclosure 是子集，
# 判定器输出每柱绕数；本轮只实现 |enclosure| = 1 的出生形与 A->B 这一条序列。
#
# 单夹爪能不能把柱 B 套进环，取决于「拉伸梯形」（_ring_transfer_geometry.py 模块文档）：
# 环被拉紧后在 A 处收拢到 2(r_post + r_tube) = 0.028 宽，远端由**张开的两指钩住**
# 撑到 grasp.spread 宽；B 必须落在两股之间。单点捏住远端帽做不到 —— 捏住的环是
# 两股并行的双线，只在 A 处有绕数（离线门第一版实测绳股离 B 轴 12.5mm < 14mm）。
# 该不等式把柱半径、指张开量、柱距三者绑在一起，下面每个数都标了它在这条链里的位置。

task:
  id: ring_transfer
  difficulty: smoke

coordinate_frame: task

board:
  name: ring_transfer_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# 立柱列表。每项 name / pos(xy, task 系) / radius / height。
#
# 2026-08-25 第二版（用户看过 demo 后：环再小、柱距再远、柱子更拟真、整体放大）。
# 默认 oracle 是 carry（搬运套索），它不拉伸、与柱距无关，所以下面的取值不再受
# transfer 拉伸梯形的约束；transfer 在这组几何下不可用（离线门只报告，不拦截）。
#
# 半径 0.016、高 0.100：工业走线柱的比例（cable_routing 的 0.012 x 0.10 量级），比第一版
#   粗高各三成。carry 要把整环抬到挡头顶以上：指尖 = 0.108 + 0.004 + 0.010 + 悬挂深度
#   (0.40 - 0.14)/2 = 0.130 → 0.252，手 0.355 <= 工作区 0.40。
# 挡头 head_radius 0.026 / head_height 0.008：**碰撞体**（外伸 0.010 >= 管径 0.008）。
#   2026-08-24 实测无挡头时环被拔滑越顶；gateway = 挡头顶。
# 底座 base_radius 0.030 / base_height 0.016：本任务不复用 prefab 的 0.016/0.010——
#   柱更粗，底座按比例放大，视觉上像螺栓固定的走线柱脚。
# 柱距 0.220（A -0.100、B +0.120）：远端帽在 A.x - 出生伸出量 0.104 = -0.204 >= -0.25+0.02；
#   推过 B 后的手位 0.180 <= 0.25 - 0.02。
# 颜色：深灰金属色柱身、黑色挡头与底座——去掉第一版的橙/蓝。
# 底座与柱身刻意互嵌（同 cable_routing 走线柱），因此 rope.fem.sanity_check_enable=false。
posts:
  - name: A
    pos: [-0.100, 0.000]
    radius: 0.016
    height: 0.100
    head_radius: 0.026
    head_height: 0.008
    base_radius: 0.030
    base_height: 0.016
    post_radial_segments: 32
    color: [0.42, 0.43, 0.45]
    trim_color: [0.10, 0.10, 0.11]
  - name: B
    pos: [0.120, 0.000]
    radius: 0.016
    height: 0.100
    head_radius: 0.026
    head_height: 0.008
    base_radius: 0.030
    base_height: 0.016
    post_radial_segments: 32
    color: [0.42, 0.43, 0.45]
    trim_color: [0.10, 0.10, 0.11]

# 闭合弹性环。出生高度不配置：管心 = rope.radius + contact_d_hat + 1mm，即管皮在势垒外 1mm，
# 沉降时自己落到桌面。直接出生在 rope.radius（管皮贴桌）会落在势垒内，第一步被顶起约 d_hat
# （2026-08-24 观察到的开局「向上跳一下」）。
ring:
  # 周长 0.40（第一版 0.53，用户要求环再小）：
  #   - 出生跑道形从 A 心伸出 (0.40 - 2 pi 0.045)/2 + 0.045 = 0.104，远端帽到 x=-0.204；
  #   - carry 悬挂深度 (0.40 - 2 x 0.070)/2 = 0.130，决定抬离高度（见 posts 注释）；
  #   - 围住 B 后松环伸出 0.104，到 x=0.016，离 A 挡头边 0.074 —— 终态不再贴着 A。
  #   下限：钩住远端帽要 loop_radius > spread/2，且环要套得进柱（见 loop_radius）。
  perimeter: 0.40
  # 半环宽 0.045（环宽 0.090）：两指张开 0.070 钩住时帽必须比它宽（hook_points / lift_points
  #   的前提），再留 10mm；下限另有 loop_radius >= r_post + r_tube + d_hat = 0.022。
  loop_radius: 0.045
  # 环从出生柱伸出的方向（xy，单位化）。背离 B：朝 B 伸会与 B 相交。
  long_axis: [-1.0, 0.0]
  # 初态围住的柱子集。本轮只支持单元素（多柱出生形是预留变体）。
  enclosure: [A]
  color: [0.12, 0.12, 0.13]

# 目标。instruction 本轮固定一句；enclosure 与 ring.enclosure 的差集推出跨越序列
# [(B, on), (A, off)]。
goal:
  enclosure: [B]
  instruction: "Move the elastic loop from post A onto post B."

rope:
  model: fem_ipc_tube
  radius: ${prefabs.rope_pbd.radius}
  fem:
    E: ${prefabs.rope_fem.E}
    nu: ${prefabs.rope_fem.nu}
    rho: ${prefabs.rope_fem.rho}
    friction_mu: ${prefabs.rope_fem.friction_mu}
    contact_d_hat: ${prefabs.rope_fem.contact_d_hat}
    follow_strength: ${prefabs.rope_fem.follow_strength}
    # 闭合环上 straight 不可用：rest_shape_straight 沿开放折线量弧长，接缝两侧顶点
    # 落到直杆两端、四面体翻转，整条声明被丢弃后静默退回 spawn（closed_band_spike 实测）。
    rest_shape: spawn
    # 柱身与喇叭底座刻意互嵌（静态体，无自由度），豁免 libuipc 零相交初始态检查。
    sanity_check_enable: false
    newton_max_iterations: ${prefabs.rope_fem.newton_max_iterations}
    newton_tolerance: ${prefabs.rope_fem.newton_tolerance}
  mesh:
    # 段长 0.005、径向 8 段：closed_band_spike 的推导 ——
    #   (a) 纵向 sagitta p^2/8R 不得超过横向 r(1-cos(pi/n))：最紧弯 R=0.040 时
    #       p=5mm 给 0.078mm < 0.304mm；
    #   (b) 自接触间隙 self_contact_clearance(4mm, 8, 5mm) = 3.06mm > d_hat 2mm。
    segment_length: 0.005
    radial_segments: 8
    maxvolume: ${prefabs.rope_pbd.maxvolume}
    output_dir: .cache/topogym/meshes/ring_transfer

# 抓取。五条 follow band 在建场景时按出生位置声明：
#   hook_left / hook_right = 远端帽两肩（transfer 拉伸段：两指伸进环内张开，各钩一带）；
#   near = 出生柱一侧的帽顶点（transfer 提离段：单点捏住，抬过 A 顶）；
#   lift_left / lift_right = 出生柱一侧帽的两肩（carry：两指张开钩住抬起整环）。
grasp:
  # 每条 follow band 的选取半径。
  band_radius: 0.012
  # 钩住时两指的张开量 = 远端被撑开的宽度，进拉伸梯形。Franka 最大 0.080；
  # 取 0.070 留指垫厚度，且必须 < 环宽 0.080。
  spread: 0.070
  # engage 前手心与 band 质心的允许偏差；超差拒绝焊接（rope-free-end-clearance-rule 第二条）。
  attach_tolerance: 0.020
  # 夹爪级净空：任一抓取点到任一柱面的最小距离（指半展 0.040 + 余量）。
  post_clearance: 0.050

# transfer（借 A 撑开梯形）的段参数。**第二版几何（柱距 0.22）下 transfer 不可用**：
# 越过 B 顶的平移段拉伸比 1.96（上限 1.2），离线门只报告不拦截。保留这一块是为近柱距
# 变体与对照 motion；主 oracle 见下面的 carry。
transfer:
  # 段 1a 绕 A 平转：远端帽在此高度沿半径 = 出生伸出量的圆弧绕 A 转，从长轴方向
  # 经 +y 转到 swing_end_deg。0.030 略离桌面，减少拖行摩擦但仍低于柱顶。
  swing_z: 0.030
  # 平转终止角（相对 A->B 方向，度）。B 到环轴线的横向偏移 = 柱距 x sin(角)，
  # 必须 > loop_radius + r_post + r_tube = 0.066：0.140 x sin55 = 0.115，余量 49mm。
  # 精确条件由离线门按绳股线段到 B 轴的距离检查（平转、抬升、平移、下放四段全程采样）。
  swing_end_deg: 55.0
  swing_waypoints: 8
  # 段 1b 抬升到 carry_z 后平移到落点上方：绳股从 A 切点直线到夹持点，经过 B 上方时
  # 底面须高于 B 顶 + r_tube + carry_margin。落点处的下限 carry_height_floor
  #   0.004 + (0.085 + 0.004 + 0.010 - 0.004) / (0.140 / 0.176) = 0.123，
  # 但平移途中夹持点离 A 更远、B 在拉线上的比例更小，同样的越顶高度要更高；
  # 离线门逐样本量绳股到 B 轴距离，取值以它通过为准。
  carry_z: 0.200
  carry_margin: 0.010
  # 落点：B 远侧，x = B.x + r_post + r_tube + landing_clearance。
  landing_clearance: 0.020
  # 段 2 提离：near band 抬到 A 挡头顶 + r_tube + lift_margin，再向 B 方向平移 shift 后释放。
  # shift 要让帽从 A 外侧（A.x - r_post - r_tube = -0.076）滑过挡头另一侧
  # （A.x + head_radius + r_tube = -0.034），即 >= 0.042；取 0.060 留余量。
  lift_margin: 0.020
  shift: 0.060
  # 驱动速度（米/步），沿用 rope_winding 的 travel_speed。
  drive_speed: 0.0020
  min_segment_steps: 20
  # 释放后静置步数：环回缩与落座。
  release_settle_steps: 200

# 第二条 oracle「搬运套索」（run.motion=carry / spike run.test=carry），2026-08-25 按用户提议加入：
# 两指张开钩住 A 与 B 之间那半个帽（near cap 两肩，lift_left/right band）→ 抬起，环从挡头
# 上方脱离 A、悬挂在两指下（底部 U 宽 = 指张开量）→ 到 B 近侧 → 沿 A->B 方向推过 B：
# U 底撞上柱身后两股分到柱子两侧（套马索）→ 放低、松手。不借 A 撑开、不拉伸，柱距无关。
# 与 transfer（借 A 撑开梯形）并列，哪条更稳由 spike 读数定。
carry:
  # 两指张开量（同 grasp.spread）。悬挂深度 = (周长 - 2 x spread)/2 = 0.130。
  spread: 0.070
  # 抬离 A 时环底部 U 高出 A 挡头顶的余量。环与 A 是链环关系，只能从挡头顶上方脱离——
  # 2026-08-25 实测只抬钩点到 0.235（底部 0.04）时环仍挂在 A 柱身上。
  # 指尖高度 = 0.108 + r_tube 0.004 + 0.010 + 0.130 = 0.252，手 0.355 <= 工作区 0.40。
  clear_margin: 0.010
  # 推向 B 时环底部 U 离桌面的高度：低于挡头下沿 0.100、高于底座锥顶 0.016，取柱身中段。
  hang_bottom_z: 0.050
  # 侧向绕开 A 的偏移（沿 across）。钩点在 A 与 B 之间的那半个帽（near cap 两肩），
  # 抬起后悬着的环已在 A 的 B 侧、离挡头边 14mm，直线走向 B 不经过 A，故取 0（不绕）。
  # 若钩点改到 A 的外侧则要设 >= 0.035 + 0.022 + 余量。
  detour: 0.0
  # 推之前停在 B 近侧柱面前多远，再沿 A->B 方向直推。
  approach_before: 0.050
  # 推过 B 轴多远再放低。要让 U 已经绕到柱子两侧、手在远侧。
  push_past: 0.060
  # 放低到的指尖高度（环落地后松手）。
  drop_z: 0.020

# 机械臂执行参数（demo 用；spike 不带臂，不读这一块）。
physical:
  # Franka hand 坐标系原点到指尖的距离；follow band 的目标 = 指令手位 - hand_above
  # （与 untangle_continuous_fem_demo 同值同做法）。
  hand_above: 0.103
  # 接近/退开高度（task z）：指尖高于挡头顶 0.108 即可，再留 8cm 给悬着的环。
  approach_z: 0.200
  # 开合夹爪的步数。
  gripper_steps: 30
  # 手到位后再静置几步，让 IK 收敛到位再做 attach_error 校验。
  touch_settle_steps: 20
  # 开局静置步数（spike 实测 50 步收敛）。
  settle_steps: 80

success:
  # 中心线读回的材料分桶数（= 出生环数 = 周长/段长，spike 同式）。
  centerline_bins: 80
  # 绕数取整容差：|w - round(w)| 超过即报投影退化。
  winding_tolerance: 0.1
  # 任一柱的最小表面间隙（米），负值 = 穿模。
  min_surface_gap: 0.0
  # 释放后静置期间中心线最大位移（米/步）低于该值视为落定。
  settle_tol: 0.0001
  # 只记录不判定
  max_stretch_ratio: null
