# Bar Through Hole layout expressed in the TopoGym tabletop V1 task frame.
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# docx 2.3：刚性杆水平穿过隔板上的孔。防捷径 = 面板矮到可以把杆从上方绕过去，
# 终点位置相近但两端同侧，判失败。因此面板高度是任务设计的一部分，不是随手取值。
#
# 2026-08-17：配色统一到中性灰工程塑料（与 gate_cage_ball 同一套，去蓝调，
# 件与件之间只靠明度区分）；近端两个 V 槽由 0.021 抬到 0.055，手部高度同步上移。
#
# 2026-08-12 三处修订：
#   1. 杆与孔都改成正六棱柱。六边形按 across_flats（对边距）标注 —— 六角棒料与
#      六角孔在工业上就是按对边距给尺寸的。取平面朝下的姿态：杆躺在一个面上不会滚，
#      所以起止托座不再需要防滚挡块，也因此落座时杆轴高出孔下沿一个 inradius。
#   2. 杆变细：对边距 0.018（对角 0.0208），此前是直径 0.024 的圆柱。
#   3. 场景放开：面板加宽、孔与杆的间隙加大、抓取点与托座拉开、各方向净空加大。

task:
  id: bar_through_hole
  difficulty: smoke

coordinate_frame: task

# ---------------------------------------------------------------- 面板（隔板）
# 孔为正六边形，由凸块组合而成：4 块框（左右立柱 + 下槛 + 上楣）围出六边形的
# 外接矩形，再由 4 块沿斜边旋转的倒角块削去四个角三角形。不用带孔 mesh：
# gs.morphs.Mesh(convexify=True) 会把孔填实（见 tasks/routing/cable_routing.py
# 的 _add_routing_post docstring）。
panel:
  enabled: true
  # 面板中平面的 x。EE 全程停在 x < panel.x 一侧，前臂不越过面板——
  # cable_routing 的教训是绕到障碍物 +x 侧会让前臂横扫过去（净空只剩 14mm）。
  x: 0.130
  # 板厚。2026-09-08：0.030 → 0.016。会上「板厚也要注意别太厚」——板越薄，从斜视机位
  # 越容易看穿通的那个孔，而盲孔近侧那 8 mm 凹坑仍是暗的，两者的差别才读得出来。
  # 顺带：`hand_short_of_panel` 那一行量的是板的近面，板变薄使近面外移 7 mm，这一行变松。
  thickness: 0.016
  # 0.240 → 0.280 → 0.400：隔板加长，读起来是一堵墙而不是一块窄立板。
  # 沿 y 加长不影响任何既有余量：EE 全程在 y≈0，桌面 y 跨度 1.400（±0.700）。
  # 高度不能一起加，见下方 top_z。
  width: 0.400
  # 顶面 150mm。上限由 home pose 决定：默认 home 指尖在 task z≈0.1608，
  # 高于它就会像 stacked_plate 那样在 reset 时扎进结构 → 求解器 NaN。留 11mm 余量。
  top_z: 0.150
  color: [0.60, 0.60, 0.59]

aperture:
  # 孔的边数（2026-09-08）。**16 = 圆孔**：在这个相机距离上读作圆，而不是拼图游戏里的
  # 六角孔（会上原话「太像拼图游戏」）。**必须与 bar.sides 相等**，checks() 的
  # profiles_match 行守住。6 = 六角变体，把这里和 bar.sides 一起设成 6 即可。
  #
  # 为什么不用 gs.morphs.Cylinder：棱柱让三件事一行都不用改——生成的网格本来就轴沿 +x
  # （Genesis 的圆柱默认轴沿 z，要加出生旋转）、convexify=True 对棱柱是精确的
  # （凸体的凸包是自己）、判定器读杆的轴向是 R @ (1,0,0)。16 边在 18 mm 的杆上边长 3.6 mm。
  sides: 16
  # 对边距 0.032。杆对边距 0.018 → 单边间隙 7mm。
  # 注意外接矩形随边数变：六角的最宽处是角（circumradius），16 边的最宽处是平边中点
  # （inradius），所以框子按实际顶点极值算（polygon_extents），不写死。
  across_flats: 0.032
  # 孔中心高度。孔跨 z [0.070, 0.102]。
  center_z: 0.086
  # 板上开几个孔，横排、等间距、关于板中线对称（2026-09-08）。
  count: 3
  # 相邻孔心距（米）。随机化区间 [0.080, 0.110]。最外侧孔外缘在 |y| = pitch + 孔内接圆半径
  # ≤ 0.110 + 0.019 = 0.129，板半宽 0.200，立柱还剩 0.071；最窄的中柱 = 0.080 − 2 × 0.019 = 0.042。
  pitch: 0.095
  # 哪一个孔是通的，从 −y 侧数起，0 / 1 / 2。**防捷径离散轴**：另外两个孔是盲孔，
  # 从远侧塞了盖板、近侧只剩 8 mm 深的暗坑。指令是常量句，通没通只能从画面上看。
  open_index: 1
  # 通孔的中心 y。**这是一份记录，不是真值**：真值由 open_index 与 pitch 现算
  # （`aperture_center_y`），`aperture_center()` 直接算，不读这个叶子；派生只是把算出来的
  # 值写进来，好让它进 episode 的 variant 记录，`checks()` 的 center_y_recorded 行守两者一致。
  #
  # 为什么不能让 aperture_center() 读这个叶子：任何不走随机化的路径（每一次固定布局的 demo）
  # 都不跑派生，叶子会停在 0.0，于是无论 open_index 是几，任务都瞄中线那个孔——
  # 2026-09-08 第一次跑就是这样，杆被送去撞盲孔，而判定器读同一个过期叶子，把它判成了成功。
  center_y: 0.0
  # 盲孔近侧凹坑的深度（米）。坑底涂 blind_color，从机器人这一侧看是一个浅浅的暗坑，
  # 通的那个能看到背景。会上要求「封没封必须在画面上一眼可辨」，这一项与孔缘描色、
  # 板厚三者一起达成，读不出来就先加深这个。
  blind_recess: 0.008
  blind_color: [0.12, 0.12, 0.13]
  # 倒角块超出角三角形的外扩量，纯粹为了埋进框里、不留缝。
  corner_overlap: 0.004

# ------------------------------------------------------------------------ 杆
bar:
  # 杆的边数（2026-09-08）。**必须与 aperture.sides 相等**——两者是同一种截面，
  # 不同的话「孔比杆宽多少」这个量就没有定义。见 aperture.sides 的注释。
  sides: 16
  # 正棱柱，对边距 0.018。2026-08-12 之前是直径 0.024 的圆柱，
  # 2026-08-12–09-08 是正六棱柱，09-08 起是 16 边棱柱（读作圆）。
  across_flats: 0.018
  # 0.180 → 0.200：配合放开后的布局，穿过后两端各留更多。
  # 2026-09-04 起是派生量：随机化时由 length_frac 在 [0.170, 0.230] 与「杆近端不进面板」
  # 两者的交集里定位（BarThroughHoleLayout.length_bounds），固定布局时就用这里的值。
  length: 0.200
  # 杆长的设计区间；派生时再与「杆近端不进面板」的上限取交集。
  length_range: [0.170, 0.230]
  # 杆长在允许区间内的归一化位置；0.5 在基准布局上还原 0.200。
  length_frac: 0.5
  # 铝的量级。assisted attachment 运动学承载，质量不与夹爪较劲，
  # 因此按 physical_realism_guidelines_zh.md P7「密度用真实材料量级」取值。
  rho: 2700.0
  color: [0.74, 0.71, 0.60]
  # 生成的棱柱网格落点（相对仓库根，由 rope.resolve_mesh_dir 解析）。
  mesh_output_dir: runs/generated_meshes/bar_through_hole
  # 起始静置位姿（轴心）。2026-09-04 由 rest_pos: [x, y, z] 拆成三个标量：
  # 随机化只能改标量叶子（layout_randomization 不走列表下标）。z 与近端两个 V 槽的
  # seat_axis_z 一致，槽底由截面反推。
  rest_x: -0.050
  rest_y: 0.000
  rest_z: 0.055
  # 抓点到杆心的 x 距离。由插入终态反推：杆心要到 panel.x 才跨骑，
  # 而手部半深≈25mm + 面板半厚 15mm + 余量。0.065 → 0.075（放开）。
  # 2026-09-04 起是派生量：随机化时由 grasp_frac 在 [0.060, min(0.090, length/2 − 0.015)]
  # 里定位（下界 = primitive.hand_half_depth + 面板半厚 + 20mm；上界保证指垫合在杆上，
  # 不越过杆端）。固定布局时就用这里的值。
  grasp_offset: 0.075
  # 抓取偏移的设计区间；派生时上限再与 length/2 − 0.015 取交集。
  grasp_offset_range: [0.060, 0.090]
  # 抓取偏移在允许区间内的归一化位置；0.6 在基准布局上还原 0.075。
  grasp_frac: 0.6

# -------------------------------------------------------------------- 托座
# V 形块（两片斜夹板 + 立柱），由 topogym/tasks/_fixtures.py 的通用构件生成。
# 2026-08-16 由平顶托座改成 V 槽：平顶只定高度，杆重力静置就横漂 5.2mm、合爪再拧
# 3.3°，而孔的间隙只有 7mm。V 槽让杆不爬坡就不能横移，两项都消掉。
#
# seat_axis_z 给的是「杆轴最终停在哪」，槽底(apex)由它和杆的截面反推。这样改杆的
# 尺寸会带着槽一起动，而不是悄悄改变杆的落点。
# half_angle_deg 从竖直方向量起：45 = 机加工标准的 90° 夹角 V 块，六棱柱按两条下棱
# 落在两个斜面上；改成 30 会让六棱柱的两个下斜面与槽面贴合（面接触），代价是对滚转
# 角敏感。默认取通用的 45。
# 两个近端托座把杆心夹在中间（静置不倾覆），且都避开抓取点，手指下降处杆是裸露的。
# 托座的 y 不在这里给：近端两个跟着 bar.rest_y，far 在面板中线（孔的 y = 0），
# 由 BarThroughHoleLayout.cradle_y 决定。2026-09-04 之前三个都硬写 0，rest_y 一偏杆就出生在槽外。
cradles:
  near_a:
    enabled: true
    # 抓点在 x=-0.125；本托座在 -0.070，间距 55mm。
    x: -0.070
    # 杆的静置轴高，与 bar.rest_z 一致。2026-08-17 由 0.021 抬到 0.055：
    # 立柱因此有 40.8mm，超过 _visuals 的 30mm 阈值，会画出完整的支架外观
    # （底板+地脚螺栓+斜撑+唇边），而不是一块贴地的小垫块。
    seat_axis_z: 0.055
    length_x: 0.030
    half_angle_deg: 45.0
    # 斜面顶端 = apex + jaw_width*cos45 = 0.0408 + 0.0113 = 0.0521，低于杆轴 0.055，
    # 夹板不会挡住指垫。抓点在 x=-0.125，与两个 V 槽的 x 也不重叠。
    jaw_width: 0.016
    jaw_thickness: 0.006
    post_width: 0.024
    color: [0.50, 0.50, 0.49]
  near_b:
    enabled: true
    # 与 near_a 一起把杆心(-0.050)夹在两托座之间。
    x: 0.020
    seat_axis_z: 0.055
    length_x: 0.030
    half_angle_deg: 45.0
    jaw_width: 0.016
    jaw_thickness: 0.006
    post_width: 0.024
    color: [0.50, 0.50, 0.49]
  far:
    # **2026-09-08 起关闭。** 会上定：这个托座是「不必要的难度来源」，改成杆穿过孔、
    # 由孔本身架住。实测支持这个改法而且比预期干净——插入原语把杆心推到孔心
    # （`aperture_center()[0]` = panel.x），所以杆的质心正好落在面板上，杆是**平衡**在
    # 孔里而不是楔住：关掉托座跑 oracle，`success=True`、`align_tilt=0.01°`、
    # 松手后 `drift=0.00000`。因此落座判据一个数都不用改（`seated_z` 仍是孔下沿 +
    # 杆 inradius，倾角门仍是 10°）。
    #
    # 保留这一段而不是删掉，是因为 `add_v_block` 与 `push_window` 都按 `enabled` 逐个跳过，
    # 关掉它就够；下面的数值是它当时的标定，留作记录。
    enabled: false
    # 终态杆端在 x=0.230，本托座接住远端。
    x: 0.200
    # 与孔的落座高度一致：孔下沿(0.070) + 杆 inradius(0.009)。
    seat_axis_z: 0.079
    length_x: 0.040
    half_angle_deg: 45.0
    # 这一片的宽度由插入路径定：横推时杆底在 0.081，斜面顶端 apex(0.0648)+0.0113
    # = 0.0761，留 4.9mm 净空。加宽到 0.023 以上就会刮到横推中的杆。
    jaw_width: 0.016
    jaw_thickness: 0.006
    post_width: 0.030
    color: [0.50, 0.50, 0.49]

# ---------------------------------------------------------------- 工业风装饰
# 一律 collision=False，逐项可关；关掉任何一项都不会改变物理。
# 配方同 stacked_plate（docs/develop/visual/stacked_plate_visual_upgrade_zh.md）。
visual_details:
  # 六段拼成的六角法兰环，沿孔缘一圈。faces 列出要贴的面板面：
  # near = 机器人一侧（-x），far = 杆穿过去之后所在的一侧（+x）。
  # 两面同款，隔板正反看起来一致。
  # 孔缘描边。2026-09-08 起**三个孔都描**、颜色改成鲜黄：会上说「封没封远看分不清，
  # 可试给孔描鲜艳颜色」。只描通的那个是不行的——那等于把答案画在漆上，而三个孔存在的意义
  # 正是要策略从几何上读「这个能看穿」。所以三个一样亮，区别留给凹坑与背景。
  flange:
    enabled: true
    band: 0.010
    depth: 0.004
    color: [0.95, 0.78, 0.10]
    faces: [near, far]
  # 面板四角铆钉，同样两面都有：一侧是螺栓头，另一侧读作螺母。
  bolts:
    enabled: true
    radius: 0.004
    height: 0.004
    inset: 0.018
    color: [0.34, 0.34, 0.33]
    faces: [near, far]
  # V 块立柱的工业支架外观。立柱与斜夹板本身一点没动（槽底高度、footprint 不变），
  # 这里全是 collision=False 的包裹件，关掉不改变任何接触。
  # 高度 < 0.030 的块只画底板和地脚螺栓（阈值在 tasks/_visuals.py）。
  # 2026-08-17 抬高近端托座后，三根立柱都超过该阈值（近端 40.8mm、far 64.8mm），
  # 因此三个都画全套：底板 + 地脚螺栓 + 斜撑 + 顶部唇边。
  pedestal:
    enabled: true
    # 底板 xy 相对承载块的放大倍数。1.5 留出的边沿刚好够放下地脚螺栓。
    foot_scale: 1.5
    foot_thickness: 0.006
    # 地脚螺栓自动落在底板边沿的中线上，不需要单独的 inset。
    bolt_radius: 0.0035
    bolt_height: 0.004
    # 斜撑：从底板外缘斜拉到承载块上部侧面。
    brace_thickness: 0.005
    # 顶部机加工唇边。collar_gap 让它停在顶面下方 1mm —— 与顶面共面会 z-fighting，
    # 而且真正接杆的必须是承载块的顶面。
    collar: 0.005
    collar_thickness: 0.008
    collar_gap: 0.001
    color: [0.45, 0.45, 0.44]
    bolt_color: [0.34, 0.34, 0.33]

oracle:
  mode: insert          # insert | bypass（bypass = 防捷径对照：从上方绕过去）
  # 绕行对照与正常插入用**完全相同的起止 xy**，只有搬运高度不同——docx 要求的
  # contrast pair 正是「终点位置几乎相同，唯一差别是轨迹同伦类」。
  # 杆会落到面板顶上而不是穿过孔，交点落在六边形之外 → threading_count = 0。
  # 不把杆送到面板远侧：那需要手越过面板平面，正是 cable_routing 记录过的前臂扫掠风险。
  bypass_lift_z: 0.300

# Heights are relative to the task-frame table surface, and are hand-link z
# (the pads sit HAND_TO_PAD_Z = 0.1029 below).
#
# 2026-09-04：grasp_z / lift_z / insert_z / seat_z 四个手写绝对高度删掉，改由
# BarThroughHoleLayout 从几何推导（grasp_hand_z / lift_hand_z / insert_hand_z / seat_hand_z）：
#   grasp   杆心 rest_z（居中夹）+ HAND_TO_PAD_Z                       基准 0.158
#   lift    grasp + lift_height                                          基准 0.203
#   insert  横推高度窗口的中点 + HAND_TO_PAD_Z                          基准 0.192（原手写 0.193）
#   seat    孔下沿 + seat_drop + bar_inradius + HAND_TO_PAD_Z            基准 0.183
# 横推高度窗口（push_window）：杆心在横推段允许的 z 区间——下界 = far 托座斜面顶端 +
# 杆 inradius（杆底不刮夹板），上界 = 孔心 + (孔 inradius − 杆 inradius)（杆顶不撞孔上沿）。
# far 托座的 seat_axis_z 跟着孔下沿走，所以窗口宽度 = across_flats − 0.02412：
# 0.029 → 4.88mm、0.032 → 7.88mm、0.038 → 13.88mm。原来的 0.193 把 7.88mm 切成 4.9 / 3.0，
# 中点取法两侧各 3.94mm。
primitive:
  approach_z: 0.244
  # 杆抬升 0.045 ≫ min_lift_delta 0.025（与抬高托座前相同）。
  lift_height: 0.045
  # 释放前杆底离孔下沿的高度：不是砸下去。
  seat_drop: 0.001
  # 横推段杆心离窗口两端各至少留这么多；checks() 的 push_window 行守 2 倍这个值。
  # 2.4mm 对应 across_flats 的下界 0.029（窗口 4.88mm；原计划 0.027 只剩每侧 1.45mm）。
  push_clearance_min: 0.0024
  # 手沿 x 的半深。落座时手前缘 = panel.x − grasp_offset + 这个值，必须停在面板近面之前。
  hand_half_depth: 0.025
  clear_z: 0.240
  steps_per_phase: 90
  # 插入放慢：单步位移越小，卡住时的冲击越小。
  insert_steps: 140
  gripper_steps: 30

physical:
  finger_links: [left_finger, right_finger]
  finger_friction: 2.0
  bar_friction: 0.8
  # 平面朝下的六棱柱，左右是棱（对角半宽 0.0104）。每指留约 2mm 压量
  # （P7：不怼到 0）。真正承载的是 assisted attachment，指面只需看起来夹住。
  grasp_qpos: 0.008
  close_hold_steps: 30
  # 合爪后指位的下限。assisted carry 下 lift_delta 证明不了任何事（attachment 会
  # 把杆抬起来，指垫碰没碰到都一样），指行程是唯一能区分「夹到杆」和「夹了个空」
  # 的读数。null = 不判，但照样打印。杆的对角半宽是 0.0104，夹到杆时指位应当
  # 明显高于 0.008。
  # 2026-09-04 回填：seed 0–9 与 64 角点共 148 格实测 finger_qpos 0.0090–0.0094，
  # 只随 bar.rest_y 变（−0.03 → 0.0090，+0.03 → 0.0094）；夹空合到指令位 0.008。
  # 门取两者中间 0.0086。见 docs/develop/tasks/bar_through_hole_zh.md §5.3。
  min_finger_qpos: 0.0086
  # 手腕对准所用的步数。这一相把末端执行器转到能让杆轴平行于插入方向的姿态，
  # 杆因为被夹着而跟着转。不是在夹爪里改杆的姿态：那样物体的转动不对应任何机械臂
  # 动作，录出来的 IL 数据里对准这一步就是凭空发生的，策略学不到。
  align_axis_steps: 60
  insert_settle_steps: 30
  # 预载释放会踢一下，给足静置步数（onestroke 用 100）。
  release_hold_steps: 100
  settle_steps: 40
  min_lift_delta: 0.025
  # 抓起来那一刻允许的杆轴偏差。这一道门问的是「合爪有没有把杆掀翻」，不是「对没
  # 对准」—— 对准是后面手腕那一相的事，所以这里放宽。2026-08-16 之前是 2.0，
  # 那时对准靠在夹爪里改杆的姿态，等于用这道门去要求一个不该在这里满足的条件。
  max_grasp_tilt_deg: 15.0
  # 手腕对准之后必须达到的偏差，才允许往孔里推。真正卡尺寸的是这一道：
  # 半长 100mm、孔上下各约 7mm 余量 → 几何上约 4°，取 1° 留足裕度。
  # 不过关就在撞面板之前中止，不会硬顶进去。
  max_align_tilt_deg: 1.0
  max_grasp_xy_error: 0.025
  # 释放后再步进这么多步做物理复核（释放测试）。
  release_check_steps: 200
  release_max_drift: 0.005

success:
  tilt_tolerance_deg: 10.0
  seated_z_tolerance: 0.015
  min_end_clearance: 0.030

# ---------------------------------------------------------------- 可达
# 落座时手心距 Franka 底座的上限。底座位置来源同 gate / unlink_c_ring 的 reach 段
# （common_configs/manipulation_space_tabletop_v1.yaml 的 robot_setup.mount.pos）。
# 手心 x = panel.x − grasp_offset；包络最远角（panel.x 0.160、grasp_offset 0.060、|y| 0.030）
# 为 0.671 m。
reach:
  base_xy: [-0.570, 0.0]
  max_hand_dist: 0.700

# ------------------------------------------------------------------ 指令
# 常量句：没有防捷径离散轴——绕过面板顶由 threading_count = 0 判失败，物理本身保证。
goal:
  instruction: "Push the bar through the hole that goes all the way through the panel."

# ---------------------------------------------------------------- 变体
# 逐 episode 随机的轴（generation/layout_randomization.py 读这一段）。
# 没有防捷径离散轴：绕过面板顶由 threading_count = 0 判失败，物理本身保证。
# 角点门：6 条连续轴 → 64 个角点（tests/check_variant_corners.py）。
variation:
  # 单调裕度轴（难度候选）：孔的对边距。横向单边净空 = (across_flats − 0.018)/2 = 3.0 .. 10mm。
  # 下界 2026-09-08 从 0.029 放到 0.024。原来卡住它的是横推高度窗口的下沿——那条下沿取
  # 「所有启用的托座里最高的斜面顶端」，而 far 托座的座高跟着孔下沿走，孔越小它越高。
  # far 托座退役之后，只剩两个近端托座（在杆的出生高度 0.055，远低于孔心 0.086），
  # 窗口变成对称的 ±(孔内接圆 − 杆内接圆)，下界随之松开。
  # 实测（2026-09-08，关掉 far 托座跑 oracle）：0.029 / 0.027 / 0.024 三档都
  # `success=True`、松手后 `drift=0.00000`；0.022 被 push_window 行拦下（窗口 4.0mm < 门 4.8mm），
  # 所以判据自己的几何底在 0.0228。取 0.024 是实测过的最紧值，包络顶点由角点 sweep 复核。
  - {kind: uniform, path: aperture.across_flats, lo: 0.024, hi: 0.038}
  # 防捷径离散轴：三个孔里哪一个是通的。信息只在画面里——三个孔缘一样亮，
  # 区别是通的那个能看穿。实测（2026-09-09）通孔与盲孔的孔内亮度：
  # front 768×768 上 0.60 对 0.16，策略相机 256×256 上 0.63 对 0.24，差 0.38，
  # 亮 2.5 倍。指令是常量句，说不出该走哪个孔。
  - {kind: choice, path: aperture.open_index, values: [0, 1, 2]}
  # 布局：三个孔的间距。上限 0.110 由「最外侧孔外缘 + 立柱」定（0.110 + 0.019 = 0.129，
  # 板半宽 0.200）；下限 0.080 由最窄中柱定（0.080 − 2 × 0.019 = 0.042）。
  - {kind: uniform, path: aperture.pitch, lo: 0.080, hi: 0.110}
  # 布局：杆（连同前面两个托座）在桌上的位置
  - {kind: uniform, path: bar.rest_x, lo: -0.080, hi: -0.020}
  - {kind: uniform, path: bar.rest_y, lo: -0.030, hi: 0.030}
  # 布局：面板（连同后面托座）的位置
  - {kind: uniform, path: panel.x, lo: 0.100, hi: 0.160}
  # 归一化：杆长。区间上限还受「杆近端不进面板」限制（rest_x −0.020 × panel.x 0.100 时上限 0.190），
  # 抽 [0,1] 再派生，构造式满足、不靠拒绝。
  - {kind: uniform, path: bar.length_frac, lo: 0.0, hi: 1.0}
  # 归一化：抓取偏移。上限 length/2 − 0.015 随杆长变化（短杆 0.170 时上限 0.070）。
  - {kind: uniform, path: bar.grasp_frac, lo: 0.0, hi: 1.0}
  # 派生：length_frac → bar.length，grasp_frac → bar.grasp_offset，
  #       cradles.near_a.x = rest_x − 0.020、near_b.x = rest_x + length/2 − 0.030
  #       （两式在基准布局上还原 −0.070 / 0.020）。
  #       far 托座 2026-09-08 关闭，它的 x 与座高不再派生。
  #       aperture.center_y = 通孔的位置，由 open_index 与 pitch 推（aperture_center_y）。
  - {kind: derived, fn: "topogym.tasks_legacy.routing.bar_through_hole:derive_task_cfg"}
  # 校验：BarThroughHoleLayout.checks() 八行（横推窗口、杆端与面板、near_b 与面板、抓点在杆上、
  #       抓点避开 near_a、手停在面板前、面板顶低于 home 指尖、可达）。
  #       原第九行 far_cradle_matches_sill 随该托座一起退役（2026-09-08）。
  - {kind: validate, fn: "topogym.tasks_legacy.routing.bar_through_hole:validate_task_cfg"}
