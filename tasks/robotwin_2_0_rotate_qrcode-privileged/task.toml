schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robotwin_2_0_rotate_qrcode-privileged"
description = "RoboTwin 2.0 rotate_qrcode (ALOHA-AgileX dual arm, SAPIEN): produce one replayable trajectory. Use arm to catch the qrcode board on the table, pick it up and rotate to let the qrcode face towards the robot. Frozen scene instance (RoboTwin seed 28831)."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "robotwin", "sapien", "aloha-agilex", "dual-arm", "code-as-policy", "trajectory", "rotate_qrcode"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robotwin"            # RoboTwin 2.0 = SAPIEN 3 / PhysX + CuRobo
robot = "aloha-agilex"
family = "rotate_qrcode"
mode = "privileged"
oracle = "full"
instance_seed = 28831             # scene = environment/instance.json (RoboTwin seed + expected initial-state hash); identity = dataset.toml digest
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
