# Level 1 Peeling task: semantic peel zones plus kinematic film separation.

task:
  id: peeling
  difficulty: level1

board:
  name: peeling_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

substrate:
  name: peel_substrate
  enabled: false
  pos: [0.570, 0.000, 0.750]
  size: [0.380, 0.280, 0.000]
  color: [0.92, 0.92, 0.94]

# Larger layer means visually/semantically above smaller layers.
films:
  film_A:
    label: A
    pos: [0.540, 0.030, 0.753]
    size: [0.160, 0.100, 0.006]
    yaw: 0.0
    layer: 0
    fixed: true
    color: [0.02, 0.20, 1.00]
    peel_zone:
      corner: lower_right
      inset: [0.018, 0.018]
  film_C:
    label: C
    pos: [0.535, -0.035, 0.760]
    size: [0.110, 0.085, 0.006]
    yaw: 0.0
    layer: 1
    fixed: true
    color: [0.02, 0.85, 0.12]
    peel_zone:
      corner: upper_right
      inset: [0.016, 0.016]
  film_B:
    label: B
    pos: [0.620, 0.000, 0.767]
    size: [0.145, 0.090, 0.006]
    yaw: 0.0
    layer: 2
    fixed: true
    color: [1.00, 0.48, 0.00]
    peel_zone:
      corner: lower_right
      inset: [0.018, 0.018]

peel_zones:
  # Level 1 default: a lower film is blocked if any unpeeled higher film overlaps it.
  # This makes covered/under-layer films ungraspable even if one corner is geometrically visible.
  block_if_any_higher_overlap: true
  overlap_tolerance: 0.002
  z_offset: 0.009
  marker:
    enabled: true
    show_inactive: true
    zone_size: [0.060, 0.045]
    dash_size: [0.010, 0.010, 0.004]
    dash_count_per_side: 4
    active_color: [0.70, 0.20, 1.00]
    inactive_color: [0.02, 0.06, 0.10]

separation_slots:
  visible: false
  surface_z: 0.750
  surface_clearance: 0.004
  slot_size: [0.120, 0.075, 0.004]
  color: [0.70, 0.20, 1.00]
  slots:
    film_A:
      pos: [0.800, 0.145, 0.752]
    film_B:
      pos: [0.800, 0.000, 0.752]
    film_C:
      pos: [0.800, -0.145, 0.752]

oracle:
  sequence: [film_B, film_C, film_A]

primitive:
  approach_z: 0.964
  grasp_z: 0.899
  hand_surface_offset: 0.116
  grasp_clearance: 0.006
  lift_z: 1.004
  carry_z: 0.994
  release_clearance: 0.040
  retreat_z: 0.974
  move_steps: 70
  lift_steps: 45
  place_steps: 55
  gripper_steps: 25
  film_settle_steps: 14
  grasp_qpos: 0.006
  carry_yaw: 0.0

mdp:
  max_episode_steps: 120
  reward:
    success: 10.0
    remaining: 1.0
    wrong_order: 3.0
    action: 0.01
