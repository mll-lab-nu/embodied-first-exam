# Cloth Fold（docx 1.1「对折／折角」）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 变体（2026-09-06 起，2026-09-07 换轴）：文件末尾的 variation 块按 seed 抽抓哪个角（四选一，指令轴）、
# 折痕位置三档（单调裕度轴，同为指令轴）、布左右位置、弧线松紧，以及一个归一化分数（布前后位置）由
# `cloth_fold.derive_task_cfg` 按可达盘映射到可行区间。四行可行性判据在 `_cloth_fold_geometry.py`，
# 建场景 / 随机化 / 离线门 / 角点门共用。
# 记录：`docs/develop/tasks/cloth_fold_zh.md`。
#
# **本文件目前只到 spike 需要的程度。** 类别 1（形变与自身层叠）四类里唯一没有实现的一类，
# 而 `topogym/tasks_legacy/deformation/__init__.py` 写着「落地前需先确定可形变布料在 Genesis 中的
# 建模方案」。下面 cloth 块的材料值是**未标定的起点**，标定它们正是
# `tests/pbd_cloth_spike.py` 的工作；目标 footprint、判据阈值等要等 spike 的结论才写。
#
# 抓取模型：接近触发的运动学吸附（`PBDParticleAttachmentDragPrimitive`），
# 不让手指与布做硬接触。这不是偷懒，是领域标准做法（SoftGym picker 及其后续），
# 也是本仓 2026 年 peeling 那次 native segfault 之后的既定结论
# （`docs/develop/physics/peeling/peeling_segfault_debug_zh.md`）。

task:
  id: cloth_fold
  difficulty: smoke

coordinate_frame: task

board:
  name: cloth_fold_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# ---------------------------------------------------------------------- 布片
cloth:
  name: fold_cloth
  # 正方形单层平铺。0.240 见方的理由是抓取点和落点都要够得着：
  # 中心 x=0.040 时布跨 x[-0.080, +0.160]，机械臂作业区是 x[-0.23, +0.31]、
  # y[-0.30, +0.30]（basic_env_demo 的 workspace），抓取角 (+0.140, +0.100)
  # 与落点 (-0.060, -0.100) 都在里面。
  # 折角之后覆盖的是**三角形**（对角线以下那一半，288 cm²），不是长方形。
  size: [0.240, 0.240]
  # 布中心。原来是 `center: [x, y]` 一个列表，2026-09-06 拆成两个标量键：随机器与角点覆盖
  # 写不了列表元素（band_untwist 教训）。
  # center_x 是派生量：不直接随机，先抽 center_x_frac ∈ [0, 1]，再由 derive_task_cfg 换算到
  # [0.010, 上限] 里，上限 = 远角（抓取点与落点里 x 大的那个）刚好落在可达盘边上时的 center_x
  # （随抓哪个角、center_y、fold_fraction 变；基准布局下上限 0.0402，见 reach 段）。
  # 固定布局（run.randomize_layout=false）直接用下面的 0.040，不经派生。
  center_x: 0.040
  center_y: 0.000
  center_x_frac: 1.0
  # 铺放高度 = 一个粒子半径，正好是布搁在桌面上的平衡高度
  # （2026-08-17 实测：从 0.050 放手会落到 particle_size/2 停住）。
  z: 0.002
  # 控制网格。Genesis 会按 PBDOptions.particle_size 重网格化，所以它只是输入网格。
  # **网格间距必须与 particle_size 整除**，否则 Genesis 会重采样并打乱顶点顺序，
  # 而追踪材料点（折线位置、层归属、材料守恒）就全部做不成。2026-08-17 实测：
  #   particle_size 0.010 > 间距 7.5mm -> 1089 粒子，原样不动，顺序保留
  #   particle_size 0.004 ≈ 间距/2     -> 4225 粒子，整齐细分，顺序保留
  #   particle_size 0.006 卡在中间      -> 1398 粒子，重采样，**顺序打乱**（偏移 319mm）
  # 2026-08-18 又试了「让间距正好等于 particle_size」（61x61 + 0.004）：Genesis 仍然
  # 加了 34 个粒子并打乱顺序。**所以「相等」不是充分条件，别再凭推理定这个组合。**
  # 目前唯一实测保序的是 33x33 + particle_size 0.004（细分成 65x65 = 4225 粒子）。
  # 任何改动之后都要看日志里 `pbd_cloth_spike remesh` 那行确认 order_preserved=yes。
  # **三角形的对角线方向按抓哪个角选**（2026-09-06，`_cloth_fold_geometry.mesh_diagonal`）：折痕必须
  # 横穿对角线边。折痕顺着对角线边走时翻过去的那半布落地会侧滑 30–38 mm（far_right / near_left 用基准
  # 网格实测：折痕在线上 1 mm，移动半边误差 30 mm、46% 粒子不在位），对角线翻转后同一布局 3.7 mm 过。
  # 逐格交替对角线的对称网格被 Genesis 重网格成 4604 粒子、顶点顺序丢失，所以只能整张统一、按角选向。
  mesh:
    cols: 33
    rows: 33
    output_dir: .cache/topogym/meshes/cloth_fold
  # 粒子尺度。**这个值同时是物理参数和判据参数**：它既决定碰撞厚度（隧穿余量、
  # 夹爪闭合间隙的下限），又决定「层数 3 → 1」这类判据能不能分辨出层。
  # 调它必须连着自碰撞与层数统计一起验，不能只看稳定性。
  # 0.004：与网格间距相等（见上），且 2026-08-17 实测每步耗时与粒子尺度无关
  # （0.004/0.006/0.010 都是 9ms），所以加密是免费的——按判据精度选，不为速度让步。
  particle_size: 0.004
  # 材料：**整套采用 Genesis `PBD.Cloth` 的构造默认值**（2026-08-21）。
  #
  # 起因是组会反馈「布料材质有明显的橡皮泥感」。查下来，原来这一组值**字面上就是
  # 绳子 prefab 的值**（`prefab_configs/topogym_prefabs_v1.yaml:68-72`），只把
  # bending 放软了 6.7 倍 —— 配置自己的旧注释写着「先用 prefabs.rope_pbd.elastic
  # 的值做起点」。绳子就是该硬该沉的。
  #
  # 与官方默认值逐项对照（`bash_scripts/tests/genesis_cloth_api_probe.sh` 实测）：
  #   参数                 官方默认   原值      原值偏离
  #   stretch_compliance   1e-07     0.0012    软 12000 倍   <- 主因
  #   bending_compliance   1e-05     0.0200    软 2000 倍
  #   rho                  4.0       400.0     重 100 倍
  #   bending_relaxation   0.1       0.2       2 倍
  #   static_friction      0.15      0.35
  #   kinetic_friction     0.15      0.25
  #   stretch_relaxation   0.3       0.35      接近
  #   air_resistance       0.001     0.001     相同
  #
  # 柔度 = 多容易变形。**主因是拉伸柔度差了 12000 倍**：真实布料几乎拉不长
  # ——可以随便揉随便折，但拽不长。原来那块布拉伸毫不费力，再加上重 100 倍，
  # 就是一块又沉又能拉长的东西，正是橡皮泥。
  # （比值上也确实偏硬：官方的弯曲柔度是拉伸的 100 倍，原来只有 16.7 倍。但那是次因。）
  #
  # **整套照搬不挑不拣**：混着取会让结果没法解读，分不清哪一项起了作用。
  # 风险：1e-07 是极硬的约束，PBD 在 substeps=4 下可能收敛不了（表现为抖动或发散），
  # 看门狗会抓住；判据门槛也可能要重标。过不了就回退这一段、只留贴图。
  rho: 4.0
  # **这两个是布↔布（粒子之间）的摩擦，不管桌面。** 折叠之后两层之间靠它。
  # 布↔桌面完全是另一回事，见下面的 tabletop_friction。
  static_friction: 0.15
  kinetic_friction: 0.15
  stretch_compliance: 1.0e-07
  bending_compliance: 1.0e-05
  stretch_relaxation: 0.3
  bending_relaxation: 0.1
  air_resistance: 0.001
  # 蓝白条纹的底色（白），条纹色见 texture.accent_color。
  # 改成条纹不只是好看：**折叠在视频里看得见** —— 平色的布折过去之后，翻上来的
  # 那一半和它盖住的那一半长得一样，画面上分不出折没折；有条纹就能直接看到两半
  # 对上，被拖走或者揉起来也会在花纹上显出来，而不是只体现在数字里。
  color: [0.90, 0.91, 0.93]
  # 四个角各涂一块颜色的调色板（2026-09-08）。四角一样的方布加上「远左 / 近右」这类
  # 方位词，指的是哪个角随相机位置变——同一句指令换个机位就指到别的角上去了，策略
  # 从画面里无从分辨。改成给四个角涂色之后，「红色那个角」从任何机位看都是同一个角。
  # 取值照 linkbar 的六色调色板（zones.colors），少维护一份色表。六色里去掉蓝与橙：
  #   蓝 [0.15,0.45,0.85] 与条纹的深蓝 [0.20,0.33,0.55] 在俯视 768×768 上读成一条更宽的
  #     条纹而不是一块角标（2026-09-08 实测截图），换成紫；
  #   橙 [0.88,0.55,0.10] 夹在红与黄之间，三者同时在场时最难分。
  palette:
    red: [0.85, 0.15, 0.15]
    green: [0.20, 0.68, 0.28]
    yellow: [0.95, 0.85, 0.15]
    purple: [0.58, 0.25, 0.75]
  # 哪个角涂哪种颜色。**逐 episode 重抽**（文件末尾 variation 块的 distinct_choice，
  # 四个角取四种不重复的颜色）。固定不变的话策略可以背下「红 = 远左」，那就等于换了
  # 个说法的方位词；重抽之后，指令说的颜色只能到画面里去找。
  # 键名仍用方位词，因为它们同时是 grasp.corner 的取值、是几何上的身份。
  corner_paint:
    far_left: red
    far_right: purple
    near_left: green
    near_right: yellow
  # 织物贴图。**这是唯一能给布加表面细节的通道。**
  # Genesis 的光栅化器只保留 diffuse 颜色与 diffuse 贴图，粗糙度/金属度/法线/自发光
  # 全部是光追专用（`genesis/utils/mesh.py:235`），而光追在本安装不可用（缺 LuisaRender）。
  # 所以法线贴图给了也没用，织纹必须画进 diffuse 图本身。
  # 2026-08-21 之前布是一块纯色塑料，画面上整块布只有一个颜色、只靠光照梯度分明暗 ——
  # 这正是组会反馈说的「橡皮泥感」的视觉那一半。
  # 图是程序生成的（`topogym/world/textures.py`），每次建场按下面的参数在内存里画好
  # 直接交给 ImageTexture(image_array=...)，不落文件；固定种子，同参数逐字节相同。
  texture:
    enabled: true
    # plain = 单色织物；stripes = 在底色上按 stripe_pitch 打 accent_color 的条带。
    pattern: stripes
    accent_color: [0.20, 0.33, 0.55]
    # 条带宽度（米）。0.030 在 0.240 的布上是 8 条，折过去之后能清楚看到条纹相接。
    stripe_pitch: 0.030
    # 角上的色块沿两条边各伸多长（米）。0.060 是布边（0.240）的四分之一：
    # 小于 0.030 在 512×512 的斜视机位下不到 10 个像素、读不出是什么颜色；
    # 大于 0.080 四块颜色就连成一片、看不出是「角上」的标记。色块盖在条纹之上，
    # 条纹保留（fabric_weave 的 corner_colors 与 pattern 正交）。
    corner_size: 0.060
    # 相邻纱线的间距（米）。**比真实织物粗，是故意的**：真布约 0.3mm 的织纹在本场景的
    # 相机距离下不到一个像素，只会糊成灰色或者出摩尔纹，分辨不出来的织纹等于没有。
    # 0.002 是「在这个距离拍一张照片会看到的表观尺度」。
    thread_pitch: 0.002
    # 每根纱画多少像素。8 像素刚够画出「中间亮两边暗」的圆截面感 ——
    # 光栅化下这是唯一能读出立体的手段（法线贴图无效，见上）。
    pixels_per_thread: 8
    # 纱线截面明暗的强度。大了像网格，小了像纯色。
    thread_shading: 0.45
    # 纬纱比经纱暗多少。真布两个方向本来就有差别；没有这一项，两组纱会读成一张网格。
    weft_tint: 0.94
    # 逐像素的纤维颗粒，与大尺度的明暗云雾。后者是「整块布不是均匀一片」的来源，
    # 纯色之所以像模具倒出来的，很大一部分就是缺这个。
    fibre_noise: 0.05
    cloud_noise: 0.08
    seed: 0
  # 布↔桌面的**持续接触**摩擦。Genesis 不提供这个：它的可形变体↔刚体摩擦按法向速度
  # 缩放、只在粒子正撞进表面时生效，所以已经躺在桌上的布**几乎没有任何摩擦**，
  # 桌子刚体的 coup_friction 调多高都没用（untangle_continuous 实测 0.1→0.8 无改善）。
  # 2026-08-19 的对折之所以整片布被拖着走，就是因为这一项当时根本不存在——
  # 不是「太小」，是零。
  # 实现是 world/rope.py 的 TabletopParticleFriction（自己写的库仑模型，**只改速度
  # 不改位置**；改位置会被 PBD 重建成巨大速度，绳子被甩飞就是这么来的）。
  # 高于 contact_band 的粒子完全不受影响，所以被夹爪提起来的那半自动不参与。
  tabletop_friction:
    enabled: true
    # 减速度 = mu * g，与速度无关。0.4/0.5 沿用 untangle_continuous 标定过的量级
    # （塑料线缆搁在桌面）。布通常比线缆更涩，滑就往上调。
    kinetic_mu: 0.4
    static_mu: 0.5
    # 粒子 z 低于「桌面 + 这个」才算接触。取值要夹在两个高度之间：
    # 平铺的布在 0.002（一个粒子半径），对折之后上面那层在 0.006（再加一个直径）。
    # 0.003 让下层受摩擦、上层不受——上层本来就该能滑。
    contact_band: 0.003
    # 整块布的重量压在触桌粒子上的集中系数上限。平铺时所有粒子都触桌 -> 系数为 1，
    # 正好是教科书的 mu*g；提起一半时 -> 2，而那一半的重量在夹爪上，封顶挡住过阻尼。
    max_load_factor: 3.0

# ------------------------------------------------------------------ 抓取护栏
# 五条护栏里落在配置上的三条。推导写在每一条上，spike 的输出会改这里的数值。
grasp:
  # 吸附捕获容差：手到抓取点的距离超过它就拒绝吸附并如实失败
  # （`PBDParticleAttachmentDragPrimitive` 的 attach_error 校验）。
  # **给大了就是「磁力抓取」**：捕获半径大到能隔层吸附，「抓错层」这个真实失败模式
  # 就被抹掉了，与 docx 的防捷径原则冲突。上限应小于一个布厚。
  attach_tolerance: 0.008
  # 指垫停在抓取点上方多少。**这是「手指永远够不到布」的唯一保证**，
  # 所以它有下限：≥ 2 倍 particle_size = 0.008。
  # 2026-08-21 从 0.015 降到这个下限：合拢动作要看起来像在抓布，指垫离布 15mm
  # 时手指是在半空中合拢的。**再低就不行了** —— 手指与布硬接触在 1.1.0 上是
  # native segfault。
  touch_clearance: 0.008
  # 夹爪合拢到的半宽。原语的次序是「下降 → 校验够没够到 → 合拢 → 绑定粒子」，
  # 所以画面上是先合上再抓住，与真实抓取的观感一致。
  #
  # **但要说清做不到的事**：平铺在桌上的布，手指没法真的从两侧夹住 —— 要伸到布
  # 下面去，而下面是桌子。真机也是如此，所以这一类任务领域内普遍用吸附式抓取
  # （SoftGym picker 及其后续）。这里只是让手指在布正上方合拢。
  #
  # 值必须 ≥ particle_size / 2 = 0.002，否则两指之间不存在粒子的可行位置，
  # 求解器会注入发散的修正量——这就是「挤压爆炸」。0.004 留一倍余量。
  grasp_qpos: 0.004
  # 附着范围：以抓取点为中心多大范围内的点被夹爪带着走。
  attach_radius: 0.018
  # 捏取点就是角尖本身。曾经有过一条 `inset`（捏取点往里缩 0 / 10 / 20 mm）当单调
  # 裕度轴，2026-09-07 删掉：两轮 96 角点实测证明它不称职——无视它、永远捏角尖的
  # 策略得 100%（0 与 0.010 两档都是 32/32），而 0.020 档的失败全部挂在
  # particle_off_target_frac 上，机制是「捏取点外那块三角形本来就不在镜像位上」的
  # 判据失配，不是形变预测的负担。它产生的是门线附近的方差不是难度。
  # 单调裕度轴改为 goal.fold_fraction（折痕位置），见文件末尾 variation 块。
  # 抓哪里。**corner = 折角**：吸住一个角，折到对角，折痕是对角线。
  #
  # docx 1.1 的标题是「对折／折角」，两种都在这一条的范围内，而**单个夹爪只做得成
  # 折角**。2026-08-20 两种都实测过，差别是几何性的、不是调参能补的：
  #   折角   要翻过去的是三角形，它三个顶点里**有两个正好落在折线上**。整块布像
  #          一扇门绕门轴转，门轴两端钉死，只有被抓的那个顶点在动。
  #   对折   要翻过去的是长方形，远端那条 240mm 的边**完全没有约束**，只有中点被
  #          一个 18mm 的圆盘抓着。两个远端角离抓取点 120mm，没有东西拉它们，
  #          于是留在桌上被拖着走、堆在折线附近。
  # 抓边中点实测（86 步、同一套判据）：落位后 x 跨度 163mm（应为 120mm）、
  # 最高点 20.4mm（两层布应为 6mm）、抬起来的点只有 1672/4225（应为一半 2112）。
  # 三条判据全部不过，而且**与「贴桌面推」的读数几乎重合**——正确动作没做出正确结果，
  # 阈值就无处可放。抓角同样的分段读数是最高点 11.6mm、抬起 2073（正好一半）。
  # 要做边中点对折需要两个抓取点或两条手臂，不属于这一版。
  at: corner
  # 抓哪个角（2026-09-06，变体的指令轴）。以机械臂为准：far = 离底座远（+x），near = 近（−x）；
  # left = +y（机械臂面向 +x 时的左手边），right = −y。折向就是从这个角指向对角。
  #   far_left  (+x, +y)  基准；far_right (+x, −y)；near_left (−x, +y)；near_right (−x, −y)
  # 布是正方形、四角一样，策略只能从 goal.instruction 知道该抓哪个角——而 2026-09-08 起
  # 指令说的是这个角**涂的颜色**（cloth.corner_paint），不是方位词：颜色↔角的对应逐 episode
  # 重抽，所以指令与画面缺一不可。这四个键名仍是几何上的身份，只是不再进句子。
  corner: far_left
  # 手腕朝向（同 cloth_unpleat 的键）。across = 工具朝着折的方向，手指横跨角尖（人捏角就是这个
  # 姿势，也是 2026-08-20 起的做法）；arm_default = 不管朝向，让手臂用它自己最舒服的姿态。
  # 四个角的折向方位角是 ±45° / ±135°。2026-09-06 角点 c049（near_left、落点在可达盘边上 0.740）实测：
  # across 之下手腕朝向 +135° 到位（姿态误差 1.2°）、手的落后量与镜像格 c077 逐段相同，但翻过去的半布
  # 落地偏 15.8 mm、45% 粒子不在位、判失败；换 arm_default 同一格 5.3 mm、两层率 0.889 过。
  # 手腕朝向影响的不是手到哪，是指垫在布角上怎么摆、松手时压着哪一片。默认改为 arm_default，
  # 四角一视同仁；across 保留可切回。
  finger_axis: arm_default
  # 用哪种方式让这些点跟着夹爪走。四选一，2026-08-19 起由实测决定：
  #   overwrite_graded : 物理算完之后从 Python 改坐标，每个点「有多听话」按到中心的
  #                      距离从 1 递减到 0。**这是原来的默认**，实测手抬 40mm 布只
  #                      上来 16.4mm —— 平均只听四成。
  #   overwrite_rigid  : 同上，但每个点都完全听话。
  #   link_patch       : fix_particles_to_link —— 在算物理之前就告诉求解器这些点
  #                      跟着夹爪这个刚体走，约束进到求解里，还会跟着一起转。
  #                      绳子任务一直用的是这个（rope_backends/pbd.py:109）。
  #   link_single      : 同上，但只绑最近的一个点（SoftGym picker 的配置）。
  # 只绑一个点会丢掉两样东西：抓错层这个真实失败模式（docx 1.2 需要），
  # 以及对朝向的约束（布会绕着那个点转，而 docx 1.1 要判折线位置）。
  # 2026-08-20 四种各提一次 60mm，link_patch 全面胜出（跟随率并列第一，而边最大
  # 拉伸只有别人的一半到五分之一 —— 拉伸越小说明力是分摊到一片布上而不是揪着几个点）：
  #   link_patch       跟随 1.00  边最大拉伸 0.57  抬起 327 个粒子  布不入桌
  #   link_single      跟随 1.00  边最大拉伸 1.06  抬起 141        布不入桌
  #   overwrite_graded 跟随 0.96  边最大拉伸 1.01  抬起 149        布陷入桌面 0.09mm
  #   overwrite_rigid  跟随 1.00  边最大拉伸 2.90  抬起 264        布陷入桌面 0.79mm
  # 两种 overwrite 都会把布压到桌面以下：它们是物理算完之后改坐标，改出来的位置
  # 不受接触约束管；link_* 是在求解之前进约束，所以不会。
  attach_mode: link_patch

# ------------------------------------------------------------------ 指令
# 模板，{corner} 与 {extent} 由 ClothFoldLayout.instruction() 填成 "far left"、
# "halfway to the opposite corner" 这样的词（CORNER_WORDS / EXTENT_WORDS）。
# 派生只写标量、无空格的叶子（ring_transfer 教训：带空格的句子进不了角点 sweep 的 Hydra 覆盖）——
# 所以句子在这里拼，不写回叶子。
goal:
  instruction: "Fold the {corner} corner of the cloth {extent}."
  # {corner} 与 {extent} 由 render_instruction 填（CORNER_WORDS / EXTENT_WORDS）。
  instruction_fn: "topogym.tasks_legacy.deformation.cloth_fold:render_instruction"
  # 折痕位置。定义（2026-09-07）：
  #   f = 抓点到折痕的垂直距离 ÷ 布中心到角尖的距离 L
  #   L = 12√2 = 16.971 cm —— **半条对角线**，不是边长 24 cm 也不是半边长 12 cm。
  # 等价读法：f = 角实际走的距离 ÷ 角对角走完的距离（33.94 cm）。
  # 折线永远垂直于对角线，从布中心朝**被抓的那个角**外移 L × (1 − f)。
  #
  #   f     折痕离布中心   抓点到折痕   角走的距离   落点离对角角尖   动的材料   弧半径(slack .98)   步数
  #   1.00    0    cm       16.97 cm     33.94 cm      0    cm        50.0%        16.63 cm         145
  #   0.90    1.70 cm       15.27 cm     30.55 cm      3.39 cm        40.5%        14.97 cm         131
  #   0.80    3.39 cm       13.58 cm     27.15 cm      6.79 cm        32.0%        13.30 cm         116
  #
  # 不取大于 1：翻过去的布会越过对角角尖落到光桌面上，而 fold_targets 给每个移动粒子
  # 一律加一个布厚（fold_thickness = particle_size 4 mm），悬空那条带就有 4 mm 系统偏差，
  # 对 7.5 mm 的平均误差门是致命的。
  #
  # 下限为什么不再往下（2026-09-07 实测，判据的收紧量是「移动半误差」离 15 mm 单点容差的距离）：
  #   96 角点按档的最大移动半误差：f=1.000 → 7.48 mm、0.875 → 10.13、0.750 → 14.28。
  #   最吃亏的格（far_right、center_y +0.03、slack 1.0、center_x 0.01）逐档实测：
  #     f=0.900  6.41 mm（余量 8.59）    f=0.875  10.14（4.86）
  #     f=0.800  12.97 mm（余量 2.03）   f=0.750  14.13（0.87）
  #   0.750 太贴门：seed 0–9 里 far_right 那格实测 14.47 mm 判失败，比 96 角点的最大值还高
  #   —— 角点取的是轴端点，并不覆盖这个量的最坏情况。
  #   f=0.500 判失败，偏离比例 0.122（三次复跑逐位相同）：折痕落偏 15.3 mm，整片镜像过去的布
  #   偏约 30 mm，移动的那 12.5% 粒子几乎全部越过容差。记为 oracle 胜任边界，不进包络。
  fold_fraction: 1.0

physical:
  approach_z: 0.250
  # 注意：2026-08-20 实测在抓取角处这个抬升量**够不到**，四种附着方式一致只抬起
  # 33.1mm（55%），是手臂在该点的可达范围限制，与布无关。真要 60mm 得先挪基座或
  # 换抓取点；对折本身不走这条路径（见 fold_step_m），所以暂不动它。
  lift_delta: 0.060
  move_steps: 120
  gripper_steps: 60
  motion_settle_steps: 10
  max_follow_error: 0.045
  # 松手之后原地沉降多少步（dt=0.01，所以 60 步 = 0.6 秒）。属于任务本身：
  # 布落定之前判据读到的是还在动的构型。
  release_hold_steps: 60
  # 绕折线转半圈用多少步。**这个值是标定出来的，不是可调难度旋钮。**
  # 2026-08-20 在 435mm 弧长上扫 120/180/240 步（对应手速 0.363/0.242/0.181 m/s），
  # 每一项都是越快越好：
  #   步数   双层率  覆盖 IoU  对角位移   布峰值/手速
  #   120    0.860   0.870    1.19mm     1.5
  #   180    0.736   0.867    1.56mm     1.7
  #   240    0.542   0.796    2.67mm     2.5
  # 两条互相独立的原因，方向一致：
  # (1) 布在桌上的滑移是**蠕变**，按「每秒多少毫米」积累（三档实测 0.86~1.11mm/s
  #     基本不变），所以折得越久滑得越多。之前那个 18.5mm 是 1200 步 = 12 秒的结果，
  #     不是摩擦不够 —— 这一条推翻了「调大摩擦」那个方案。
  # (2) 布自己下落的速度**不随手变慢而变慢**（240/600/1200 步实测 0.41/0.79/0.99 m/s，
  #     反而更快，因为没被支撑的那部分掉的时间更长）。所以「放慢到准静态」不成立；
  #     反过来手快到 0.363 m/s 时布才刚好跟得上（比值 1.5），这才是准静态的那一头。
  # 上限来自隧穿：实测每步 8mm 以内安全，3.6mm 还有一倍余量。
  #
  # **写成速度而不是步数。** 标定跑的是抓角折（弧长 435mm），换成 docx 的抓边缘
  # 中点只有 308mm，同样的步数就变成了另一个速度。步数由 弧长 ÷ 这个值 算出来：
  # 按 0.0036 反推抓角几何得到 121 步，与实测最优的 120 一致，换算是自洽的。
  fold_step_m: 0.0036
  # 弧线半径相对材料距离的余量。1.0 就是正好绕折线转，手离折线比布料长就是在拉布，
  # 短太多布会松垂到桌上被横着拖走。0.98 留 2% 余量给数值误差。
  fold_slack: 0.98

# ------------------------------------------------------------------ 可达与工作区
# checks() 的 far_corner_reach 行：远角（抓取点与落点里 x 大的那个，手要在桌面高度抓它或把布放上去）
# 离机械臂底座的水平距离上限。base_xy 同 cloth_unpleat / rope_unwinding 的 reach 段（manipulation_space 的 mount.pos）。
# **max_hand_dist 0.740 是假设**：基准布局的远角 (0.160, 0.120) 离底座 sqrt(0.730² + 0.120²) = 0.7398，
# 是本任务一直在抓的点；有日志的实测点只有 08-20 inset 0.020 时的 0.717。与 cloth_unpleat / unroll 的 0.665
# 不是一个口径：那两个任务在这个距离上还要贴桌面拉 6–10 cm，这里手到远角只是抓或放，之后就沿弧线往布中心上方走。
# 固定布局复跑与角点子集（center_x 取窗口顶端的格）实测后写回。
reach:
  base_xy: [-0.570, 0.0]
  max_hand_dist: 0.740

# manipulation_space.workspace 的 x / y / z 字面量副本（checks() 的 cloth_in_workspace、apex_below_workspace_top
# 行读；角点门裸加载本文件时读不到 common 配置）。builder 断言与 common 相等。
workspace:
  x: [-0.25, 0.25]
  y: [-0.30, 0.30]
  z: [0.03, 0.40]

success:
  settle_steps: 120
  # 统计用的格子边长。覆盖面积、层数都在这个格子上栅格化，所以三条判据同格可比。
  # 0.008 = 2 倍 particle_size：再细就在数单个粒子的噪声，再粗就分不出折线位置。
  cell: 0.008
  # 阈值卡在「做对了」和「做错了」中间。两侧都是实测的
  # （runs/cloth_spike/20260819_174044，折角、121 步、同一套测量，只换手的走法）：
  #
  #   走法               平均误差  偏离比例  两层率  覆盖IoU  折痕偏差 | 静止半 移动半 折痕带
  #   fold（正确）        2.87mm    0.011    0.845   0.875   3.48mm  |  2.40   3.33   4.18
  #   drag（贴地拖）     25.95mm    0.443    0.202   0.703   6.03mm  |  9.22  42.87  11.38
  #   crumple（揉成团）  51.15mm    0.839    0.073   0.601  12.94mm  | 19.40  83.28  21.06
  #
  # **单看覆盖面积分不出对错**，这正是 docx 1.1 要求多条判据联合的原因：
  # 揉成一团覆盖 731 格、贴地拖 654 格、正确折角 529 格，三者都比平铺的 960 格小。
  #
  # 正确那次的误差分解值得记：静止半边 2.40mm 已经占了总平均 2.87mm 的大头，
  # 而它等于 anchor_shift（2.38mm）—— 也就是说**一次好折叠的误差主要来自整块布在
  # 桌面上的缓慢滑移，不是折叠本身没做好**。要把判据收得更紧，该动的是摩擦或缩短
  # 携带时间，不是改轨迹。折痕带 4.18mm ≈ 一个粒子直径，是折痕弯曲半径的固有下限，
  # 消不掉。
  #
  # ------------------------------------------------------------ 主判据
  # 「布上每个点离它该去的地方有多远」的平均值。每个点的目标位置直接算得出来：
  # 折线这边的点不动，那边的点沿折线镜像过去、抬高一个布厚。布的顶点编号从头到尾
  # 不变，所以点 i 该去哪是算术，不用跑 oracle 轨迹。
  #
  # **这是本领域的通用判据**（SoftGym 的 ClothFold 奖励就是两半对应粒子的距离，
  # 后续工作把它阈值化成二值成败），所以数值能和已发表结果对读。与 SoftGym 的两处
  # 差别是有意的：目标位置定在世界坐标而不是两半之间比对（两半之间比对看不见整块布
  # 被搬走，SoftGym 为此另加一项位移惩罚；定在世界坐标就把这种失败并进同一个数），
  # 且**所有点都算**，包括不动的那一半。
  #
  # 阈值待标定。可参照的两个换算，**都不能直接照搬**：
  #   按粒子直径换算 -> 0.004（我们粒子 4mm）。**这个方向是错的**：粒子大小是我们
  #     自选的仿真精度，把网格加密一倍、同一次折叠就会从及格变不及格。
  #   按布幅比例换算 -> 文献常用 0.0125m，若其布约 0.4m 则占 3.1%，对应我们 0.240m
  #     的布约 0.0075。**但 SoftGym 那块布的确切尺寸未经核实**，要引用这个换算必须
  #     先查其源码。
  # 0.0075 经 2026-08-20 折角标定确认可用，两侧余量相当：正确 2.87mm（2.6 倍余量），
  # 最好的错误 25.95mm（3.5 倍余量），几何中点 sqrt(2.87*25.95)=8.6mm 就在附近。
  # 三种读法一并记下，供对照文献：
  #   0.0075 = 布幅的 3.1% = 1.9 个粒子直径
  #   实测正确折角 2.87mm = 布幅的 1.2% = 0.72 个粒子直径
  # 顺带：2.87mm 无论按绝对值还是按「不到一个粒子直径」去读，都在文献那两个既定
  # 约定（0.0125m / 0.025m）之内。
  particle_error_mean_max: 0.0075
  # 单个点偏离多远算「明显没到位」，以及最多允许多大比例的点是这样。
  # **平均值单独用不住**：合成数据实测，95% 的布完美、5% 偏 60mm，平均只有 2.55mm，
  # 任何合理阈值都会放行，可布上明摆着有一坨。
  # 用「比例」而不是「高分位数」：分位数要事先猜缺陷占多大，同一个 5% 的乱团用
  # 95 分位读出来是 0.00mm —— 缺陷正好是它丢掉的那部分。也不用最大值，那会被
  # 一个飞出去的孤点主导。
  particle_off_target_m: 0.015
  # **这是三条里余量最窄的一条**：正确 0.011、合成的「5% 乱团」0.045，0.02 夹在
  # 中间但两侧都只有约 2 倍。真实的两种错法读 0.443 / 0.839，那一侧毫无压力；
  # 窄的是「正确」这一侧。等多种子跑完看散布再决定要不要放宽。
  particle_off_target_frac_max: 0.02
  # ------------------------------------------------------------ 结构判据
  # **该变成两层的那片区域里，有多大比例真的是两层。** 保留为判据有两个理由：
  #   分类学合同 4.1 要求「至少一个结构指标 + 至少一个形态指标的合取，禁止单一
  #   位置阈值」，而逐点距离是形态指标，独木不成合取；
  #   它是这里唯一**不需要点的编号**的读数 —— 真机只有点云没有顶点号，将来迁移用得上。
  #
  # 分母 2026-09-07 换过。原来是「恰好两层的格 ÷ 有布的格」，那个裸比值默认折法是
  # 角对角对折：8 mm 格子上，f=1.0 时该两层的 466 格 / 折好后总覆盖 467 格，上限 ≈ 1.0；
  # 但 f=0.9 是 394 / 555 = 0.71，f=0.8 是 311 / 636 = **0.49** —— 一个折得完美的
  # f=0.8 也过不了 0.60 的门。门在惩罚「折得短」而不是「折得差」。
  # 改成按**预测两层区**（移动那半布的目标位置落进的格集，判定器本来就算了）归一化，
  # 三档上限都是 1.0，问的是同一个问题。
  #
  # 门随之从 0.60 提到 0.80（2026-09-07，96 角点 × 4 组 + seed 0–9 实测）：
  #   oracle 最低 0.843（三档最低 0.876 / 0.843 / 0.871），中位 0.931
  #   drag   最高 0.755，中位 0.195
  # 换分母之后 drag 那一侧整体抬高（它把布推皱，皱起来的叠合恰好落在预测两层区里，
  # 而分母不再是被推得摊开的整块覆盖区），旧的 0.60 有 4/96 格 + 1/10 个 seed 过得去，
  # 这条门对「贴地拖」就失效了。0.80 两侧各留约 0.045。
  # 余量比旧口径窄（旧的是正确 0.845 / 最好的错误 0.202，两侧各差一倍），多种子后再看。
  two_layer_frac_min: 0.80
  # ------------------------------------------------------------ 以下只记录不判定
  # null = 关闭。留着槽位，想启用改配置即可。
  # 覆盖 IoU：是逐点距离的粗糙版（8mm 方格的俯视图 vs 每个点的精确三维目标），重复了。
  fold_iou_min: null
  # 折线位置误差 = 静止时落在折线上的那一排材料点，折完之后离目标折线多远。
  # **这不是上表里的「对角位移」** —— 对角位移量的是「整块布有没有被拖着走」，
  # 折线位置量的是「折线落在哪」，docx 1.1 点名要的是后者。两者在「整块布平移」
  # 这一种失败上读数相同，但在「布没动、折歪了」上只有折线位置看得见。
  # 目标位置定在世界坐标之后，整块布落偏会让每个点都偏，主判据自己就看得见，
  # 所以这一条不再单独作门槛，降为诊断量（它仍然告诉你失败是「整体挪位」这一种）。
  crease_offset_max: null
  # 折边直线度：docx 写在状态变化里（「折边形成直线」）而不在判定那一句里。
  # 平整度：docx 写作「约束」，但**不做门槛，只记录**。三种走法测出来 3.6/5.6/5.3e-06，方向是对的
  # （正确对折最平），但差距只有 1.5 倍，而上面三条是 2.6 倍以上；每种走法目前只跑过
  # 一次，1.5 倍分不清是真差异还是单次波动。等任务模块能跑多种子再决定要不要升级成门槛。
  crease_straightness_max: null
  flatness_var_max: null
  #
  # **这三个数是单次、无随机化布局下的标定，属于起点。** 任务模块接上多种子之后
  # 要用同样的三条重测，特别是 crumple：它那一次在第 83 步撞上 3 m/s 的发散护栏被中断
  # （只走完 35%），完整的揉搓可能堆出更多双层，双层率那条门槛届时可能要往上调。

# ------------------------------------------------------------------ 变体
# 每条轴各自独立区间；区间依赖其他轴的量抽归一化 frac 再由 derive_task_cfg 派生；
# 首抽拒绝率门 2%（tests/check_variant_rng.py）。角点 4 × 3 × 2^3 = 96 个。
variation:
  # 防捷径离散轴：抓哪个角。四角一样，只有指令说得清（grasp.corner 的注释）。
  - {kind: choice, path: grasp.corner, values: [far_left, far_right, near_left, near_right]}
  # 防捷径离散轴（视觉）：四个角各涂哪种颜色，四色不重复地抽一个排列（cloth.corner_paint 的注释）。
  # 没有任何几何后果，所以角点门对 distinct_choice 的规定「固定取前 len(paths) 个键」正合适，
  # 角点数仍是 96；要守的是「指令里的颜色词 = 该角涂的颜色」，那一条在离线门里。
  - {kind: distinct_choice,
     paths: [cloth.corner_paint.far_left, cloth.corner_paint.far_right,
             cloth.corner_paint.near_left, cloth.corner_paint.near_right],
     keys_of: cloth.palette}
  # 单调裕度轴 + 指令轴：折痕位置三档（2026-09-07 起，取代原来的 grasp.inset）。
  # 折得越短，移动的材料越少、弧半径越小（16.63 / 14.97 / 13.30 cm）、步数越少（145 / 131 / 116），
  # 而落点没有「角对角」这个天然对位线索，得从指令算出来。布是纯色正方形，画面里没有线索，
  # 所以它和 grasp.corner 一样只能由 goal.instruction 说清（EXTENT_WORDS）。
  # 对照 fixed_fold 无视它、永远角对角折，预期只在抽到 1.0 的格成功（约 1/3）。
  - {kind: choice, path: goal.fold_fraction, values: [1.0, 0.9, 0.8]}
  # 布局：布左右平移 ±0.030。布边最远到 y = 0.150，离工作区边 0.30 还有 0.15，不需要派生。
  - {kind: uniform, path: cloth.center_y, lo: -0.030, hi: 0.030}
  # 布局：弧线松紧。手停在离对角 材料长 × (1 − slack) 的地方；下限 0.96（差 6.8 mm）由 slack_within_gate 行
  # 与主判据的 7.5 mm 平均误差门绑定，计划文档的 0.93（差 11.9 mm）oracle 自己就判失败（2026-09-06 定）。
  - {kind: uniform, path: physical.fold_slack, lo: 0.96, hi: 1.00}
  # 归一化：布前后位置。区间 [0.010, min(0.070, 可达盘封顶)]，随抓哪个角 / center_y / fold_fraction 变
  #（near_* 角的远角是落点，折得越短它越靠近底座、窗口反而越宽），抽 [0,1] 再派生。
  - {kind: uniform, path: cloth.center_x_frac, lo: 0.0, hi: 1.0}
  # 派生：center_x_frac -> cloth.center_x（要角、center_y、fold_fraction）。
  - {kind: derived, fn: "topogym.tasks_legacy.deformation.cloth_fold:derive_task_cfg"}
  # 校验：ClothFoldLayout.checks() 四行（远角可达、出生布在工作区内、最高点低于工作区顶、
  #       松紧差距 ≤ 平均误差门）。原第五行 attach_disc_has_cloth 随 grasp.inset 一起删：
  #       inset 没了它恒为 0.120 ≥ 0.018，是死行。
  - {kind: validate, fn: "topogym.tasks_legacy.deformation.cloth_fold:validate_task_cfg"}
