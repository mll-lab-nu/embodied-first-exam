[broadcast]                           # spectators: the broadcast log every 5 control steps, the replay video's camera
every = 5
camera = { name = "broadcast", pos = [0.0, -9.0, 6.5], lookat = [0.0, 0.0, 0.0], fovy_deg = 45, width = 640, height = 360 }

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # the ball and the opponents only from the head cameras (ray casting from the robot's pose)
a2 = 1                                # the ball's rolling, the kick's reach, robot contact and falls
a3 = 2                                # walking and kicking through the walking controller: positioning decides every touch
a4 = 1                                # real time (x10): the world does not wait; latency and stale images
b1 = 2                                # kick-off, pushing, ball holding, illegal defence, game stuck, shoot-out
b2 = 2                                # positioning against the opponents, when to shoot or defend
b3 = 0                                # not declared (soccer-2v2-9 screening, 代你决定 2026-10-12): no coordinated plan beats every robot going for the ball (head to head with the in-walk kick: striker + cover 4/3/33, striker + presser 7/4/29 of 40), so coordination is not measured; nor passing or division of labour (owner's decision 2026-10-12; docs/screening/soccer.md sections 12-13); team tactics are the wheeled 5 v 5's
physics = ["locomotion", "contact"]
