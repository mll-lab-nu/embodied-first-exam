schema_version = "1.3"
artifacts = ["/app/output/", "/logs/agent/rcb/"]

[task]
name = "robot-coding-bench/dextoolbench_spatula_spoon_spatula_flip_over-privileged"
description = "DexToolBench (SimToolReal) spoon_spatula / flip_over in MuJoCo: KUKA iiwa 14 + Sharpa HA4 hand; produce one replayable joint-target trajectory that carries the spoon spatula through the 40 demonstrated goal poses in order."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "dextoolbench", "simtoolreal", "mujoco", "dexterous", "tool-use", "iiwa", "sharpa", "code-as-policy", "trajectory"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "mujoco"
robot = "kuka-iiwa14-sharpa-ha4"
family = "dextoolbench/spatula/spoon_spatula/flip_over"
mode = "privileged"
oracle = "partial"
oracle_evidence = "SimToolReal's pretrained policy, replayed in this scene, reaches 6/40 goals (solution/; README of dextoolbench_spatula_spoon_spatula_flip_over-privileged)"
instance_seed = 0                 # DexToolBench fixes the start pose and goals (from a human demo); no randomization
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0
# SimToolReal's pretrained policy solves this task and is publicly downloadable, so egress is closed to the model APIs.
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
