schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robopaint-strict-oil-milkmaid-i00-privileged"
description = "RoboPaint-strict oil painting from a reference: embodied robotic painting (ManiSkill 3.0.1 Franka Panda with an oil-paint brush; the paint is libmypaint 1.6.1 with the mypaint-brushes preset tanda/oil-03-paint, wet paint that smudges and blends): produce one replayable trajectory that paints the picture target.png (a square crop of Johannes Vermeer's The Milkmaid, c. 1658-60) onto the main sheet with 16 premixed paints, in at most 450 strokes. Scored at a 1 mm scale against the picture (success iff mean CIELAB ΔE <= 6.9, p90 ΔE <= 14.5, SSIM of L* >= 0.69, edge correlation >= 0.49, paint IoU >= 0.96 (all after the best single shift of the sheet, at most 5 mm along each axis, inside the central area 8 mm in from the sheet's edges) and at most 450 strokes; 1 - mean ΔE / 20 is the continuous score); the thresholds are the reference solution's robot execution with a margin. s.score() is served by a separate scoring container. Process rules (RoboPaint-strict): paint with brush strokes the way a person paints; colouring in or filling areas with a thin line, zigzag, serpentine or contour-offset fills fail; the brush tip's path pressed on the main sheet with paint is at most 31700 mm in total, and at most 10 % of it in strokes longer than 2.5 x the diagonal of their bounding box."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "robopaint-strict", "maniskill", "sapien", "painting", "oil-painting", "mypaint", "brush", "paint-from-reference", "franka", "code-as-policy", "trajectory", "robopaint_strict_oil_milkmaid"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "maniskill"           # ManiSkill 3.0.1 / SAPIEN 3.0.3 (PhysX on the CPU) + libmypaint 1.6.1 (rcb_brush.py MyPaintPainter, CPU)
robot = "franka-panda"            # PandaStick with a paint brush: rigid handle + 15 mm collision-free tuft, TCP = the tuft's tip
family = "robopaint_strict_oil_milkmaid"
mode = "privileged"               # privileged (exact sheets, score, brush state) | standard (RGB only: the -standard twin)
oracle = "partial"                # solution/solve.sh replays the frozen reference plan; its recorded scores: oracle_evidence
oracle_evidence = "The RoboPaint pair's reference solution, unchanged (solution/; its RoboPaint record: the oracle_evidence of robopaint-oil-milkmaid-i00-privileged). Under the process rules the strict verifier scores it 1 (tests/grade.py with rcb_brush_strict.py, two fresh replays, ws3, 2026-10-05): path_mm 10564 of the 31700 mm budget; its strokes are sweeps. Harbor oracle and nop runs on one pair per family: docs/benchmarks/robopaint-strict.md (Validation)."
instance_seed = 0                 # scene = environment/instance.json (sheets, brush preset, paint wells, start joints, instance_sha; the exemplar is target.png)
expert_time_estimate_hours = 4.0
difficulty = "extreme"          # RoboPaint tiers: acrylic stroke copy hard, oil paint-from-reference extreme
medium = "mypaint"                # the brush model: calligraphy (Wang et al. 2020) | broad_nib | mypaint
stroke_count = 300                # difficulty axes: the reference solution's strokes, the stroke budget, paints, brush sizes, the picture
stroke_budget = 450
palette_size = 16
brush_sizes_mm = [10.7, 8.0, 5.5]
picture_detail = 2.276          # mean |grad L*| per mm of the picture at the 1 mm judging scale
palette_floor_de = 4.33          # mean ΔE of the picture to its nearest premixed paint (no blending)
reference_de_mean = 6.20
reference_ssim_L = 0.727
source_image = "File:Johannes Vermeer - Het melkmeisje - Google Art Project.jpg"
source_license = "Public domain"
source_artist = "Johannes Vermeer"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 7200.0              # 2 h of wall clock (a replay of a few thousand control steps takes seconds)
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
