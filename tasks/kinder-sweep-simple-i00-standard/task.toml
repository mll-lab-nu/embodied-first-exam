# Standard-mode twin of kinder-sweep-simple-i00-privileged. Generated from scripts/kinder/templates/standard/task.toml -- edit subset.toml or
# the template, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/kinder-sweep-simple-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): KinDER SweepSimple3D-o10-sweep_the_blocks_to_the_left_side_of_the_kitchen_island on the same frozen instance as kinder-sweep-simple-i00-privileged. The agent only gets a client: /observe and /submit (the robot's camera RGB-D + joint encoders + base odometry; delta actions in chunks). 10 resets (the last episode graded), no privileged state, no goal check; the sim service records every episode, replays the last one in a fresh simulator and grades it."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", "mujoco", "tidybot", "mobile-manipulation", "physical-reasoning", "standard-mode", "trajectory", "sweep-simple"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "tidybot-plus-plus"
family = "sweep-simple"
mode = "standard"
protocol = "eai-standard/2.1"
instance_seed = 0
expert_time_estimate_hours = 6.0
oracle = "none"
oracle_evidence = "GPT-6 Luna's privileged-mode trajectory of 2026-10-04 (it moves the base diagonally by up to 0.14 m a step, beyond standard mode's 0.1 m disc) and its graded standard-mode episode with 50 resets recorded before protocol v1.0, run `codex-gpt6_luna-medium` on the results site; today's privileged verifier scores both 1, and the standard service scores the episode 1 when it is sent through the client; human review in PR #8"

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 4.0
min_gpu_memory_gb = 2.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "any 8 GB+ NVIDIA GPU (RTX 4090 / L4)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 2.0
measured = "GPU 1.2-1.3 GB (oracle 1.2 GB on RTX 4090), vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: privileged container p90 2.8 GB, sim 1.1 GB, mem_guard (docker memory per container, ws-1, 10-02..10); CPU author estimate"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 6.0
trial_max_memory_gb = 14.0
measured = "GPU: 1.3 GiB (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)) -> max(1.5 x peak, peak + 4); memory: agent container docker peak 2.8 GiB over 11 samples (mem_guard (docker memory incl. page cache, top-4 containers every 10 min, ws-1, 10-02..10)) -> max(1.5 x peak, peak + 4, 8), at most the 16 GiB cap; whole trial: + the sim service's 6 GiB (docker peak 1.1 GiB, 1 samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 4.0, memory_gb = 16.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 8.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/PROTOCOL.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it.
# The loops run on the clock, inside timeout_sec: the verdict ("finalized": true, set before any video is rendered) may
# take until 840 s; then the hook waits for the replay video ("video_pending") until 870 s -- a video that is not ready
# by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator, but KinDER is public: the agent reaches the model APIs and the package registries, nothing else
# (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
