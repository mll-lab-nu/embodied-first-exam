# ============================================================================
# stacked_plate 专用 robot 配置：抬高初始 home，避开竖直大圆盘。
#
# 为什么与 base 不同：
#   共享 home（common.robot_setup.home = RoboMME/ManiSkill 的 ready keyframe）是给
#   矮小桌面物件设计的——夹爪指尖朝下停在 z≈0.27。stacked_plate 的盘是竖直大圆
#   （R=0.115、顶缘 z≈0.245），对称布局时中间盘正好坐在 y=0，reset_home 瞬移会让
#   朝下的手指扎进盘里 → 初始互穿、solver NaN。盘在 X 上摊得太宽（±0.115），靠前移
#   让位得推到 Franka reach 外，不可行；唯一可行的是从 Z 上让开：把 home 抬到盘顶之上。
#
#   stacked_plate 是 TopoGym 原创拓扑任务，RoboMME 里没有孪生任务，所以“对齐 RoboMME
#   的 ready pose”这条约束不约束它——给它一个 task-local 抬高 home 完全正当，不动共享
#   基线、不影响 swap/cable/maze/untangle/peeling 的首帧与已录数据。
#
# 与 franka_panda_position_ik.yaml 的关系：
#   本文件是那份 base 的完整拷贝，**只有 home.qpos 一处刻意不同**。加载器会把
#   --robot-config 整份 load 成 robot_control 段（无 base+override 合并），所以必须整份
#   复制。**维护提醒**：若改动 base 的 controller / ik / gripper / action_protocol /
#   control_loop，请同步到本文件；本文件唯一有意偏离的就是 home.qpos。
# ============================================================================

robot:
  name: franka_panda
  asset: xml/franka_emika_panda/panda.xml
  tool_model: ${common.robot_setup.gripper_model}
  joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - finger_joint1
    - finger_joint2
  arm_joint_count: 7
  gripper_joint_count: 2
  ee_link: hand

home:
  # 与共享 ready keyframe 唯一的差别：joint2 从 0.3927 收到 0.15（上臂更竖直），把 EE
  # 从 z≈0.27 抬到盘顶(0.245)之上，指尖不再扎进中间盘。其余关节沿用 ready pose。
  # 定稿值（in-sim 验证：reset 不互穿、整段无 NaN、抓取滚转正常）；EE 落在 workspace
  # z 上限 0.40 之内。若日后盘几何(半径/高度)变动，只需微调这一位 joint2。
  qpos: [0.0, 0.1500000000, 0.0, -1.9634954085, 0.0, 2.3561944902, -0.7853981634, 0.04, 0.04]
  settle_steps: ${common.robot_setup.home.settle_steps}

controller:
  type: position
  kp: [4500, 4500, 3500, 3500, 2000, 2000, 2000, 100, 100]
  kv: [450, 450, 350, 350, 200, 200, 200, 10, 10]
  force_lower: [-87, -87, -87, -87, -12, -12, -12, -100, -100]
  force_upper: [87, 87, 87, 87, 12, 12, 12, 100, 100]

ik:
  enabled: true
  default_ee_quat: [0.0, 1.0, 0.0, 0.0]

gripper:
  robotiq: ${common.robot_setup.robotiq}
  open_qpos: 0.04
  closed_qpos: 0.00

action_protocol:
  mode: ee_delta
  dims: [dx, dy, dz, dyaw, gripper]
  max_delta_xyz: 0.03
  max_delta_yaw: 0.20
  workspace:
    x: ${common.manipulation_space.workspace.x}
    y: ${common.manipulation_space.workspace.y}
    z: ${common.manipulation_space.workspace.z}

control_loop:
  steps_per_action: 20
  interpolation: linear
  use_plan_path: false
  plan_waypoints: 80
