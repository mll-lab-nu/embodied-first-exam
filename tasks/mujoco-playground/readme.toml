[robots]
unitree-go1 = "Unitree Go1 quadruped, 12 joint position actuators"
boston-dynamics-spot = "Boston Dynamics Spot quadruped, 12 joint position actuators"
google-barkour-vb = "Google Barkour vB quadruped, 12 joint position actuators"
aloha-2 = "ALOHA 2 bimanual robot (two ViperX 300 S arms, 6 joints and a gripper each; 14 position actuators)"
franka-panda = "Franka Emika Panda arm with its two-finger gripper (7 joint and 1 finger position actuators)"

# ---------------------------------------------------------------------------------------------------------------------
# Modes. Family vars used here: nu (actuators per row), tmax (privileged rows), std_end / std_more (standard episode),
# ctrl_ms (realtime control step).

# grade.py (quadrupeds) main(): missing file -> missing_trajectory; np.load(allow_pickle=False)["actions"] as float64,
# ndim 2, width 12, len <= horizon, all finite, else bad_trajectory (all success 0, grader_error 0); one fresh-process
# replay (rcb_quadruped.py replay: Session(check_hash=False), replay() -> check() over the whole trajectory); replay
# died / timed out -> replay_failed, not instance_ok -> instance_mismatch, any exception -> grader_error 1, infra_error 1.
# variants/72df271117 (ALOHA) and c5bde2d42e (Panda): the same file rules with width ra.N and len <= MAX_STEPS = 3000;
# Session("/tests/instance.json") raises on a start-state hash mismatch -> grader_error 1; s.replay(A) -> check() of the
# state after the last row. Session.step clips each row to the actuator ranges (rcb_quadruped L267, rcb_aloha L156,
# rcb_panda L137).
[modes.privileged]
success = """
Graded file: `/app/output/trajectory.npz`, array `actions` of shape (T, {vars[nu]}) with T at most {vars[tmax]}: one row
of actuator targets per control step, all finite (values outside the actuator ranges are clipped). After the agent's
session the verifier, in a separate sandbox without network, replays it once, open-loop, from its own copy of the
frozen start (`tests/instance.json`), and checks the condition on that replay. Only the trajectory is scored (`gen.py`
is not). A missing file, a file that is not an `.npz` with a numeric `actions` array, or an array of another width, with
more rows or with a NaN or infinite value scores 0. A replay that does not rebuild the frozen start (its state hash
differs) and any other error inside the grader, such as a replay that dies or times out, are reported as a grader
error, not as the agent's score.
"""

# Quadrupeds (sim/server.py, RCB_AGENT_END=1): POST /finish or the `done` action -> finish("finished"); the horizon ->
# finish("step_limit"); a termination (joystick, stand_on_two: S.fell_at) -> finish("fell"); SIGUSR1 from the collect
# hook -> finish("timeout"); a 500 in a call -> finish("error"). finish(): success = S.check()["success"] and reason !=
# "error" and reason in END_STATE_REASONS ("finished", "timeout", "step_limit"). The hidden success is only logged
# (AE.hidden_success). Resets: RCB_RESET_BUDGET:-10 in every quadruped standard compose file; /reset 409 after
# finished / timeout (L597-598). Start hash: S.instance_ok false -> no episode, instance_mismatch, infra_error.
# standard/tests/grade.py: ok = success and graded_by live and not infra and reason != "error".
# ALOHA / Panda (sim/server_mj.py): /finish -> "finished", SIGUSR1 -> "timeout", a 500 -> "error"; no step cap and no
# reset (RCB_MAX_CONTROL_STEPS and RCB_RESET_BUDGET unset: 0); finalize(): success = S.check()["success"] on the live
# state and reason in END_STATE_REASONS, never for "error"; instance hash mismatch -> _give_up("instance_mismatch").
[modes.standard]
success = """
Graded: the live episode, judged by the simulator service when it ends; nothing is replayed. The condition is checked
on the episode's control steps as the service executed them. The service never reports success while the episode
runs, and meeting the condition does not end the episode. The episode ends at the agent's `/finish`{vars[std_end]}, or
when the agent's session ends (at the latest after {timeout}). {vars[std_more]} An episode ended by a simulator error
(a call that makes the simulation fail) scores 0. Before the agent is served, the service checks that the scene starts
at the frozen instance (its state hash); a mismatch, or a service that cannot record its verdict, is an
infrastructure failure, not a score.
"""

# Realtime (BarkourJoystick only): environment/sim/server.py Quadruped.step(): done = fell or s.done or success, success =
# check()["success"] and (joystick: s.done), info step_cap at the horizon. rcb_service._end with AGENT_END: success only
# for "finished" / "timeout" / "step_limit" (end_judgement "state"); a done without step_cap is "failed" -> 0.
# rcb_realtime.py docstring: paused until the first /submit, one control step every control_dt x slowdown s (Barkour
# control_dt = 0.01 s, rcb_quadruped ENVS), zero-order hold when the plan runs out; error rules L85-97.
# RCB_RESET_BUDGET:-10 and RCB_SLOWDOWN:-1 in the realtime compose file.
[modes.realtime]
success = """
Graded: the live episode, judged by the simulator service as it runs; nothing is replayed. The clock does not stop: an
episode starts paused at the frozen start, and from the agent's first `submit` one control step runs every
{vars[ctrl_ms]} ms × S of wall time (slowdown S = {slowdown}) whether or not the agent sends anything; when the planned
targets run out the last ones are held. The service never reports success while the episode runs, and meeting the
condition does not end the episode. The episode ends at the agent's `/finish`, after its last control step, at a
termination, or when the agent's session ends (at the latest after {timeout}); the condition is checked on the
episode's control steps as executed. The agent has {resets} resets, each starting a new, paused episode from the frozen
start; only the last episode (the one after the last reset) is graded, and no reset is possible after `/finish`. After
the agent's first command, a simulator error or a simulator crash inside a control step is the agent's 0; anything
before the first command, a killed service, a failed resume, a reset that does not rebuild the scene or an episode that
does not start from the frozen instance is an infrastructure failure, not a score.
"""

