# README data for tasks/mujoco-playground/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Upstream MuJoCo Playground (google-deepmind/mujoco_playground @ 4057c14) defines, for all 13 environments here, only a
# shaped training reward and a termination rule: no success test (checked in the clone: no `success` in
# _src/locomotion/{go1,spot,barkour} or in _src/manipulation/aloha, and in franka_emika_panda only in pick_cartesian.py,
# an environment not used here). Every pass condition below is this benchmark's own, and is checked in:
#   quadrupeds   embodied_first_exam/benchmarks/mujoco-playground/privileged/environment/rcb_quadruped.py
#                (constants L60-73, ENVS L101-133, Session.step L261-299, terminated L305-317, check L331-374)
#   ALOHA        .../privileged/environment/rcb_aloha.py (constants L55-63, check L165-171, _check_handover L173-183)
#   Panda        .../privileged/environment/rcb_panda.py (constants L42-47, check L146-153)
# Graders:
#   privileged   .../privileged/tests/grade.py (quadrupeds: shape check L104-107, one replay in a fresh process
#                `rcb_quadruped.py replay` L108-115); .../privileged/tests/variants/72df271117/grade.py (ALOHA) and
#                variants/c5bde2d42e/grade.py (Panda): shape check L42-43, one replay Session.replay L44-45.
#   standard     quadrupeds: .../sim/server.py (finish L346-363, after_step L378-391, RCB_AGENT_END=1 in every compose)
#                + .../sim/finalize.sh + .../standard/tests/grade.py (ok L58);
#                ALOHA / Panda: .../sim/server_mj.py (finalize L845-869, _end_from_signal L983-987; no
#                RCB_RESET_BUDGET and no RCB_MAX_CONTROL_STEPS in their compose files) + the verifier
#                embodied_first_exam/benchmarks/dextoolbench/standard/tests/grade.py (their tests/Dockerfile copies it
#                from the dextoolbench files image; ok L33).
#   realtime     tasks/mujoco-playground/mujoco_playground_barkour_joystick-realtime/environment/sim/server.py step()
#                L233-240 on standard/sidecar/rcb_service.py (_end L959-966) and embodied_first_exam/standard/realtime/
#                rcb_realtime.py (clock, error rules L85-97); verifier embodied_first_exam/standard/sidecar/grade.py.

