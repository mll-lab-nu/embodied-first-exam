[robots]
i2rt-yam-bimanual = "Two I2RT YAM arms (6 revolute joints and a parallel two-finger gripper each), side by side at a table"

# grade.py main() L104-123: missing -> missing_trajectory; np.load / ["actions"] fails -> bad_trajectory; a `family`
# member other than the instance's -> wrong_family; ndim != 2, T outside 1..MAX_ROWS = 20,000 (L32), width != 14, NaN/inf
# -> bad_trajectory; then one replay process (rcb_abc.py replay: Session.replay from the instance, stops when step()
# returns False); success = replay success AND instance_ok (start state hash = the instance's recorded sha); no result
# within REPLAY_TIMEOUT_S = 2400 s -> replay_failed, grader_error = infra_error = 1; instance_ok 0 -> grader_error.
[modes.privileged]
success = """
The verifier, in a separate sandbox without network, replays `/app/output/trajectory.npz` (array `actions`, shape
(T, 14) with 1 ≤ T ≤ 20,000, all values finite) once, open-loop, in a fresh process from its own copy of the frozen
instance, one row per 0.034 s control step. The rule above is checked after every control step. Where the condition
must hold for 30 consecutive control steps, the episode ends in success at the 30th of them. The replay stops at the
step the episode ends; later rows are not run. The task scores 1 when the replayed episode ends in success; a
trajectory whose rows run out first scores 0.

A missing file scores 0, and so does an invalid one: not a readable `.npz`, no `actions` array, a shape other than
(T, 14), a NaN or infinite value, T outside 1 to 20,000, or a `family` entry that names another family. A replay that
does not start at the instance's recorded state hash, or that gives no result within 40 min, is a grader error, not a
score.
"""

# standard/server.py: RCB_AGENT_END=1 (docker-compose), RCB_RESET_BUDGET default 0; ends: POST /finish -> finish
# ("finished"), the collect hook's SIGUSR1 -> finish("timeout") L659, a submit error -> finish("error") L751, the task's
# failure (ball tray: Session.step returns False) -> finish(S.reason) L423. finish() L370-375: success = reason in
# END_STATE_REASONS ("finished", "timeout", "step_limit"; rcb_agent_end.py L40) AND judge_end(); judge_end() L382-400:
# HOLD_STEPS steps of last_command() on a snapshot, success = S.success (success_run >= 30) at the window's end; ball
# tray: S.success and not S.done. Start: a fresh episode whose scene hash != the instance's -> instance_mismatch,
# infra_error (L690-700). sidecar/grade.py L107-113: success = final.json success AND live_success AND not infra AND
# reason != "error".
[modes.standard]
success = """
Graded: the live episode the simulator service ran; nothing is replayed. There is one episode and no reset. The
episode ends when the agent sends `/finish` or when its session ends (at the latest after {timeout}); the task's own
failure, where the rule above has one, and a simulator error also end it. Success is never shown and never ends the
episode. The verdict is on the state the episode ends in. Where the condition must hold for 30 consecutive control
steps, the service, after the agent is gone, keeps the robot's last command for 30 more control steps (1.02 s), and
the condition must hold at every one of them. An episode ended by the task's failure or by a simulator error scores 0.

The scene is checked to start at the frozen instance (its state hash) before the agent is served; a mismatch is an
infrastructure failure, not a score.
"""

# realtime/server.py L60-75 (end_judgement "state", end_window_steps = HOLD_STEPS except the tray, 0) on rcb_service.py
# _finalize() L1319-1333 (the window: K steps of sim.hold() after an end in END_STATE_REASONS, success at its last step);
# embodied_first_exam/standard/realtime/rcb_realtime.py docstring L9-18 (paused until the first /submit, one control step
# every control_dt x slowdown s, the last target held when the plan runs out); RCB_SLOWDOWN default 1, RCB_RESET_BUDGET 0.
[modes.realtime]
success = """
Graded: the live episode the simulator service ran; nothing is replayed. The clock does not stop: the episode starts
paused at the frozen start, and from the agent's first `submit` one control step runs every 0.034 s × S of wall time
(slowdown S = {slowdown}) whether or not the agent sends anything; when the planned targets run out, the last ones
are held. There is one episode and no reset. The episode ends when the agent sends `/finish` or when its session ends
(at the latest after {timeout}); the task's own failure, where the rule above has one, and a simulator error also end
it. Success is never shown and never ends the episode. The verdict is on the state the episode ends in. Where the
condition must hold for 30 consecutive control steps, the service, after the agent is gone, keeps the robot's last
command for 30 more control steps (1.02 s), and the condition must hold at every one of them. An episode ended by the
task's failure or by a simulator error scores 0.

The scene is checked to start at the frozen instance (its state hash) before the agent is served; a mismatch is an
infrastructure failure, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families: the pass condition. "Origin" = the object's free-joint position. Every family but the ball tray ends with the
# 30-step hold of rcb_abc.py (HOLD_STEPS); the modes say how it is applied.

# task_eval/ball_tray.py L22-24 (dropped_local_z_threshold_m = 0.008), L120-160 (inside_tray: |local xy| <= the usable
# half extents, here the instance's usable_half_extents_m 0.1290 / 0.1244 m; ball_dropped: local z < 0.008 m; success =
# alive, latched false at the first step off the tray); task_runtime/ball_tray.py L123-148 (the countdown starts at the
# first step _both_posts_gripped: the left fingers on one handle geom and the right fingers on the other, L334-341;
# duration = the instance's balance_duration_s = 11), L343-353 ("complete" at the deadline); rcb_abc.py L314-330 (held =
# both handles touched within TRAY_GRACE_S = 0.1 s; off the tray -> failure; started and not held -> failure, in agent_end
# mode only before the countdown completed; complete -> success, in agent_end mode a success that stands).
[families.ball_tray]
privileged = """
The ball stays on the tray, and both handles are held for the whole countdown. The countdown (11 s) starts at the
first control step at which the left gripper's fingers touch one handle bar and the right gripper's fingers touch the
other. During it, both handles count as held at a control step when both were touched within the last 0.1 s. The ball
is on the tray while its origin, in the frame of the tray's centre, is within 12.9 cm of the centre along the tray's
x axis and 12.4 cm along its y axis, and at least 8 mm above the centre along the tray's normal.

The episode ends in success at the control step the countdown completes. It ends as a failure at the first control
step at which the ball is off the tray (before or during the countdown), or at which a handle is not held during the
countdown. There is no hold window.
"""
standard = """
The ball stays on the tray, and both handles are held for the whole countdown. The countdown (11 s) starts at the
first control step at which the left gripper's fingers touch one handle bar and the right gripper's fingers touch the
other. During it, both handles count as held at a control step when both were touched within the last 0.1 s. The ball
is on the tray while its origin, in the frame of the tray's centre, is within 12.9 cm of the centre along the tray's
x axis and 12.4 cm along its y axis, and at least 8 mm above the centre along the tray's normal.

Success: when the episode ends, the countdown has completed and the ball has been on the tray at every control step.
The episode ends as a failure at the first control step at which the ball is off the tray (also after the countdown
has completed), or at which a handle is not held during the countdown; after the countdown, letting go of a handle is
no failure. There is no hold window.
"""
realtime = """
The ball stays on the tray, and both handles are held for the whole countdown. The countdown (11 s of simulated time)
starts at the first control step at which the left gripper's fingers touch one handle bar and the right gripper's
fingers touch the other. During it, both handles count as held at a control step when both were touched within the
last 0.1 s. The ball is on the tray while its origin, in the frame of the tray's centre, is within 12.9 cm of the
centre along the tray's x axis and 12.4 cm along its y axis, and at least 8 mm above the centre along the tray's
normal.

Success: when the episode ends, the countdown has completed and the ball has been on the tray at every control step.
The episode ends as a failure at the first control step at which the ball is off the tray (also after the countdown
has completed), or at which a handle is not held during the countdown; after the countdown, letting go of a handle is
no failure. There is no hold window.
"""

