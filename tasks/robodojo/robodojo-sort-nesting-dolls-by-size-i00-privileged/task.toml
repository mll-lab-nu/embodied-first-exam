schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/robodojo-sort-nesting-dolls-by-size-i00-privileged"
description = "RoboDojo sort_nesting_dolls_by_size (Generalization; two ARX X5 arms with parallel grippers, Isaac Sim 5.1 / Isaac Lab): produce one replayable trajectory of RoboDojo's 14-D joint actions. Task: Arrange the five nesting dolls upright in a straight row, ordered by size from the smallest at the smallest world x to the largest at the largest world x, and return the arms to their start pose. Frozen scene instance: RoboDojo's own evaluation layout arx_x5/0/sort_nesting_dolls_by_size_0.json; graded by RoboDojo's own reward check."
keywords = ["robotics", "robodojo", "isaac-lab", "isaac-sim", "bimanual", "arx-x5", "code-as-policy", "trajectory", "privileged"]

[metadata]
task_type = "trajectory"
simulator = "robodojo"            # RoboDojo @ cb2a37d on its Isaac Lab 2.3 fork / Isaac Sim 5.1 (PhysX, RTX rendering)
robot = "arx-x5-bimanual"
family = "sort_nesting_dolls_by_size"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "none"
oracle_evidence = "no positive example yet; no reference solution (RoboDojo releases no expert, and its training demonstrations carry no initial state); marked unvalidated (PROTOCOL §2 `validated`); human review in PR #142"
instance_seed = 0
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 7800.0              # ONE fresh-process replay at tests/grade.py's
                                  # limit for the longest accepted trajectory (replay_timeout(15,000 actions) = 1200 s +
                                  # actions / 2.5 = 7200 s) + 600 s; a usual trajectory (up to 1,500 actions) has 1800 s
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # Isaac Sim starts and renders offline: every asset is in the image

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 9000.0
cpus = 8
memory_mb = 32768

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2); every Python process pays a few minutes of Isaac Sim launch + scene build
# RoboDojo's training demonstrations and policy checkpoints are public (Hugging Face), so the agent reaches the model APIs and the package registries,
# nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 9000.0
cpus = 8
memory_mb = 39936
storage_mb = 10240
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
