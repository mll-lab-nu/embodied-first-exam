# darts: 501 double-out, best of 3 legs (docs/framework_zh.md §4.2, §8). Migrated from the legacy tree in stage 1
# (scripts/olympiad/darts, scripts/olympiad/shared/darts): the simulator darts.py (flight, scoring, the scripted
# opponent and the two match state machines) is unchanged but its release-speed limits (darts-6, D5), so the legacy
# recordings (all at 7 m/s) replay bit-exactly (golden/convert.py). The declarations below are data: the core, tools/generate.py, tools/check and the prompt read them.

[sport]
name = "darts"
title = "Darts (501)"
summary = "best of 3 legs of 501 double-out at a regulation board, each dart a release command (yaw, pitch, speed) with seeded scatter under gravity and quadratic drag; format 501: you against a built-in scripted thrower (opponent level 1-4, `game spec` opponent), format duel: two players at one board"
protocol = "turn"
revision = "darts-7+core-0.2"         # bump on any change that alters play (darts.py, the rules, the observation);
                                      # 6: release speed 5-7 m/s (D5); 7: real drag range (D6), per-match calibration
                                      # bias (D7), opponent levels 1.2 / 1.1 / 1.0 / 0.9 x your scatter
physics = "analytic dart flight (RK4, gravity + quadratic drag, darts.py) with a MuJoCo scene for the cameras"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "WDF Playing and Tournament Rules, 20th revised edition"
version = "2018"
url = "https://dartswdf.com/storage/uploads/fb05b306-c92c-4f08-b512-affb092a1b3d/2018-02-28_WDF_Playing_and_Tournament_Rules_rev20.pdf"

[[deviations]]
id = "D1"
rule = "WDF 1.02, 13.01"
text = "the darts are thrown by a release mechanism with a stated scatter, not by hand, and there are no practice darts"
affects_result = true
[[deviations]]
id = "D2"
rule = "WDF 1.05-1.06, 3.02-3.03"
text = "darts always stick where the point reaches the board: no bounce-outs, fall-outs or wire deflections"
affects_result = true
[[deviations]]
id = "D3"
rule = "WDF 12.01-12.03"
text = "the throw order is fixed instead of a throw for the bull: in format 501 the opponent throws first in legs 1 and 3; in the duel the configured first player (`game spec` first_player) throws first in legs 1 and 3, and both orders are played"
affects_result = true
[[deviations]]
id = "D4"
rule = "WDF 12 (play continues until a player checks out)"
text = "a cost limit: a leg nobody has checked out after 30 visits each goes to the lower remaining score; if level, to the player with more chess-clock time left (the scripted opponent uses no clock time, so it wins a level leg); if the clocks are level too, to the player who did not start the leg"
affects_result = true
[[deviations]]
id = "D5"
rule = "WDF 1.02 (the darts are thrown by hand)"
text = "the release mechanism (D1) is declared at a human elite throw, not a machine's: release speed 5 to 7 m/s, an estimate (no dart-throwing robot publishes its release speed; a skilled thrower releases at about 5.1 to 5.5 m/s, e.g. arXiv:2604.01130, https://arxiv.org/abs/2604.01130, after Venkadesan et al.); until darts-5: 4 to 9 m/s, where 9 m/s is far beyond a human throw and below about 5 m/s no dart reaches the top of the board at all. The cap holds for the commanded speed, the executed one scatters around it; the execution scatter is an estimate too"
affects_result = true
[[deviations]]
id = "D6"
rule = "WDF 1.02 (real darts thrown in still air)"
text = "the air drag of the dart is a = -k |v| v with k drawn per match in [0.002, 0.02] 1/m, an estimate of a real steel-tip dart: no published drag coefficient could be read (Pawar et al. 2024, Exp. Fluids 65:89, https://doi.org/10.1007/s00348-024-03824-x, is paywalled; its abstract says gravity dominates the translation); from the measured dart of James & Potts 2018, Sports Eng. 21:347 (https://shura.shu.ac.uk/21754/: 26.7 g, barrel 7.08 mm, flight panels 15.55 cm2 per planar pair, normal-force slope 1.69 per rad, angle-of-attack oscillation with damping ratio 0.1 and amplitudes up to about 45 deg), k = rho Cd A / (2 m) is about 0.002 for an aligned dart (skin friction of the flights and the body plus the nose, Cd A ~ 0.9e-4 m2) and 0.004 to 0.016 with the flights' wobble (0.003 to 0.023 for an 18 g dart); until darts-6: 0.02 to 0.05, the drag of a 34-53 mm disc broadside (Cd 1), several times a real dart's"
affects_result = true
[[deviations]]
id = "D7"
rule = "WDF 1.02, 13.01 (each player throws by hand; practice darts before the match)"
text = "each player's release mechanism (D1) has a calibration bias fixed for the match and not told to anyone: yaw + b_yaw and pitch + b_pitch (each uniform within +-0.5 deg) and speed x (1 + b_v) (uniform within +-1%), added to the command before the execution scatter; drawn from the seed, one mechanism per player (in the duel the first player's mechanism is stream 1 and the other's stream 2, and the pair of matches with the first player swapped swaps them, as it swaps the scatter streams); the scripted opponent of format 501 has none. A thrower infers it from where its own darts land, as a player finds their range in the practice darts that the rules allow (no practice darts here, D1)"
affects_result = true

[formats.501]                         # one model seat against the scripted thrower inside the world (darts.Match)
seats = ["A"]
opponent = true                       # success = winning a valid match (core/grading.py), as in the legacy task
levels = [1, 2, 3, 4]                 # the opponent level (RCB_LEVEL; default 1): scatter 1.2 / 1.1 / 1.0 / 0.9 x yours
                                      # (darts-7)
[formats.duel]
seats = ["A", "B"]
first = ["A", "B"]                    # the runner plays both first orders

[modes]
action_levels = ["low"]               # the dart's release command is the only level
plays = ["program"]

[timing]
clock_s = 3600                        # turn protocol: each seat's chess clock, on its own turn only
start_timeout_s = 1800

[actions.cli]                         # `game throw YAW PITCH SPEED`
low = { throw = ["yaw", "pitch", "speed"] }

[observation]
fields = ["legs", "leg", "leg_first_thrower", "remaining", "visit_by", "visit", "dart_in_visit",
          "darts_left_in_visit", "visit_start_score", "this_visit_so_far", "your_last_dart",
          "darts_since_your_last"]
renderer = "mujoco"
frame_budget_ms = 4000                # three tiles: oche 900 x 900, board 900 x 900, side 1024 x 576 (CPU, osmesa)
columns = 2                           # oche and board on top, side below
reply_images = "the reply to each dart shows the board close-up (the `board` camera, 900 x 900) with the darts of your current visit, the one just thrown included"

[spec]                                # the rule constants: darts.py uses the same values (tests/test_darts.py)
match = "best of 3 legs of 501 double-out; visits of 3 darts; the players take turns, one visit each; the first player throws first in legs 1 and 3, the other player in leg 2"
rules_501 = "each player starts each leg on 501 and each dart subtracts its score; the dart that brings the score to exactly 0 must land in a double or the bull (the bull counts as a double); the first player to check out wins the leg; a dart that leaves you on 1, below 0, or on 0 without a double is a bust: the visit ends at once and the score goes back to its value at the start of the visit"
visit_cap = "30 visits each per leg; then the lower remaining score wins the leg; if level, the player with more chess-clock time left; if level too, the player who did not start the leg"
release_point_m = [0.40, 0.0, 1.68]
throw = { yaw_deg = "horizontal release direction: 0 = along +x (perpendicular to the board), + = to your left", pitch_deg = "elevation above horizontal, + = up", speed_m_s = "release speed" }
limits = { yaw_deg = [-20.0, 20.0], pitch_deg = [-10.0, 40.0], speed_m_s = [5.0, 7.0] }
execution_scatter_1sigma = { yaw_deg = 0.35, pitch_deg = 0.30, speed_rel = 0.008 }
scatter_draws = "each player's execution scatter is independent of the opponent's within a match (its own seeded stream: your deviations cannot be read off the opponent's darts); the two matches of a duel pair (the same seed, the first player swapped) swap the scatter sequences, so over the pair both players meet the same draws"
gravity_m_s2 = 9.81
drag = "a = -k |v| v, k fixed for the match by the seed in [0.002, 0.02] 1/m (not given)"
drag_k_range_per_m = [0.002, 0.02]
calibration_bias = "your release mechanism has a calibration bias fixed for the match (not given, drawn from the seed, independent of your opponent's): the executed command is (yaw + b_yaw, pitch + b_pitch, speed x (1 + b_v)) plus the execution scatter, b_yaw and b_pitch uniform within +-0.5 deg, b_v uniform within +-1%; the scripted opponent of format 501 has none"
calibration_bias_halfwidth = { yaw_deg = 0.5, pitch_deg = 0.5, speed_rel = 0.01 }
sticks = "where the dart's tip reaches the board plane; darts do not deflect off wires or other darts"
board_face_plane_x_m = 2.37
bull_centre_m = [2.37, 0.0, 1.73]
radii_mm = { bull = 6.35, outer_bull = 15.9, treble_ring = [99.0, 107.0], double_ring = [162.0, 170.0], board_edge = 225.0 }
scoring = "bull 50 (a double), outer bull 25, treble ring 3x, double ring 2x, the other beds 1x the segment number; outside the double ring: no score; beyond the board edge: missed the board"
segments_clockwise_from_top = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5]
segment_width_deg = 18
world = { origin = "floor, centre of the throw line", "+x" = "towards the board", "+y" = "to your left", "+z" = "up" }
board_coordinates = "u = to your right (= -y), v = up (= z - 1.73), metres from the bull centre"
images = "one PNG of three tiles (observation.tiles: x, y, width, height): oche (your view from the throw line, looking at the bull), board (straight at the board face from 0.9 m; image right = your right, image up = up) and side (from your right, y = -3.4 m; image right = towards the board)"
board_darts = "the board shows the darts of the latest visit, yours or your opponent's, with yellow (dart 1), cyan (dart 2) and magenta (dart 3) flights; they are pulled out when the next visit begins; a dart that missed the board is not shown"
dart_model = "a stuck dart's tip is 6 mm inside the board; the dart lies along its arrival velocity; its flight (3 cm cross, 3.8 cm long) is centred 13.5 cm behind the tip"
act_reply = "after each dart: the caller's call, the leg, visit and dart number, and the board close-up with the darts of your current visit, the one just thrown included (observation.image_png_b64, as observe); the board of observe shows the latest visit, which after your third dart may soon be your opponent's"
caller = "the state lists the caller's calls of the darts thrown since your previous dart (darts_since_your_last) and of your last dart (your_last_dart, with the command you sent)"

[tiebreaks]
order = ["legs"]
text = "the first player to win 2 legs (best of 3) wins the match; within a leg the first player to check out wins it; a leg nobody has checked out after 30 visits each goes to the lower remaining score, then (last resort, not from the rulebook) to the player with more chess-clock time left, then to the player who did not start the leg"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "an out-of-range, non-finite or malformed throw is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_throws_are_refused"
[[exploits]]
id = "E2"
text = "throwing out of turn is refused (HTTP 409): the visit order cannot be gamed"
test = "test_exploit_out_of_turn"
[[exploits]]
id = "E3"
text = "the observation holds no dart or board coordinates, no drag constant, no seed and no scatter draw (only the images and the caller's calls)"
test = "test_exploit_no_hidden_state_in_observation"
[[exploits]]
id = "E4"
text = "a player who stops throwing loses: a forfeit (clock or abandonment) loses the match, also against the scripted opponent"
test = "test_exploit_stalling_loses"
[[exploits]]
id = "E5"
text = "busting on purpose gains nothing: the score returns to its value at the start of the visit and the visit ends"
test = "test_exploit_bust_gains_nothing"
[[exploits]]
id = "E6"
text = "the drag and the calibration bias differ between seeds and the scripted opponent is the same for every model (no memorised constants or opponents)"
test = "test_exploit_seeded_world"
[[exploits]]
id = "E7"
text = "the rule constants the players are told ([spec], /spec: release point, limits, scatter, board, opponent) are the simulator's"
test = "test_exploit_spec_is_the_simulator"
[[exploits]]
id = "E8"
text = "the reply image of a dart shows only the darts of the thrower's own current visit (never the opponent's darts, also not the scripted opponent's visit that follows inside the same call in format 501)"
test = "test_exploit_reply_image_is_own_visit"
[[exploits]]
id = "E9"
text = "the opponent's darts tell nothing about your own scatter: within a duel the two players' execution-scatter streams are independent (the first player's and the other's), and the two matches of a pair (the same seed, the first player swapped) swap them, so over the pair both meet the same draws (until darts-4 the n-th dart of either player scattered alike, and a player who threw later could pre-compensate its aim)"
test = "test_exploit_independent_scatter_streams"
[[exploits]]
id = "E10"
text = "the calibration bias (D7) is never revealed: the observation, the reply to a throw and /spec give only its form and ranges, never its values (nor the executed command)"
test = "test_exploit_bias_not_revealed"

[players]
reference = "reference"               # Sport.players() names: camera-only, wins the default configuration
reference_class = "builtin_players:Reference"
check = ["random"]                    # policies for the generic tests

[fairness]
# rival = the reference player with aim errors of its own (seeded by seed and seat; 1 sigma = the published execution
# scatter). Until revision darts-4 the scatter draws were common random numbers, so two copies of the deterministic
# reference threw identical darts and every leg went to its starter; since darts-5 the two players' streams are
# independent (the first player's stream 1, the other's 2), and the rivals' own aim errors keep the two first orders
# of a seed from being exact mirror images (more independent matches for the same N).
policy = "rival"
matches_per_order = 400               # N = 800: 95% CI about +-3.5 pp
max_advantage_pp = 5
mirror = "exact"                      # the scatter streams follow the first order, not the seat: swapping seats and the first order swaps the result

[official]
seeds = [1, 2, 3]                     # seeds 1 and 3 draw a small calibration bias (|b| <= 0.17 deg; the plain program
                                      # without correction wins L1 on both, 6-28 % over seeds 1-300): a model trial
                                      # needs several seeds per level (docs/screening/darts.md section 7)
levels = [1, 2, 3, 4]                 # format 501: every opponent level with every seed; all four pass the step-4 gates
                                      # (simple baselines lose the majority at each, the reference's wins fall with the
                                      # level: docs/screening/darts.md section 6); the default (RCB_LEVEL unset) is 1
first_any = true                      # duel: both first orders

[official.hidden_seeds]                 # registered hidden seed set (tools/seeds.py; public commitments: seed_commitments.json)
sha256 = "ccb0a3b5a8501299bdac75a1797a07cbf07059654fcb656f4546526adf8f4abf"
counts = { "501/L1" = 20, "501/L2" = 20, "501/L3" = 20, "501/L4" = 20, "duel" = 20 }

[check]                               # tools/check limits: stage 4 renders both seats' images, about 43 CPU s a duel
stage_timeout_s = 64800               # N = 800 duels in one container take about 9.6 h (the 3600 s default stopped it)

[golden]
episodes = "golden"                   # + the legacy records of the golden-data store, converted by golden/convert.py

[score]                               # the continuous score (core/score.py; grade.py reports it as points_per_dart too)
name = "points_per_dart"
text = "the side's points per dart thrown over the match (a bust visit scores 0; 0 before its first dart)"
from = "hook"                         # plugin.Darts.continuous_score
forfeit = 0.0
range = [0, 60]

[reference]                           # tools/check stage 5, the reference check (docs/screening/README.md)
match = "refcheck:reference_match"    # the built-in reference against the scripted thrower: truth (its true landings
                                      # + 1 mm) or camera (the board close-up of each dart's reply)
seeds = 300                           # per official level (truth; about 1 s a match)
camera_seeds = 40                     # the camera reference at level 1 (about 30 s a match)

[[tasks]]
format = "501"
action_level = "low"
[[tasks]]
format = "duel"
action_level = "low"

[broadcast]                           # spectators: the replay video's camera (the board and the throw line, from the right)
camera = { name = "broadcast", pos = [0.6, -2.4, 2.0], lookat = [1.7, 0.0, 1.5], fovy_deg = 42, width = 640, height = 360 }

[capabilities]                        # docs/capabilities_zh.md §6
a1 = 1
a2 = 2                                # darts-7: the per-match calibration bias and drag are inferred from one's own landings
a3 = 1                                # the execution (scatter) is the platform's; the player only keeps to the release envelope
a4 = 0
b1 = 2
b2 = 0                                # darts-7: no measurable effect of reading the opponent (opponent-aware play +-5 pp)
b3 = 0
physics = ["ballistics", "drag"]
