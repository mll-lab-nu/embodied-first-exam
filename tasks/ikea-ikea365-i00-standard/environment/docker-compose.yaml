# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# Physics: MuJoCo 3.14.0 on the CPU (the scene's own runtime). Cameras: RGB from Nyx (RoboARC's renderer, Vulkan; a
# separate render process, environment/sim/ikea_nyx.py), depth from MuJoCo's EGL raster, on the one GPU reserved below;
# NVIDIA_DRIVER_CAPABILITIES=all makes the container toolkit mount the driver's Vulkan and EGL libraries, which the image's
# ICD / vendor files name (images/ikea-mujoco/sim/Dockerfile). No `runtime: nvidia`.
# Crash recovery: run.sh exits non-zero when the service crashes, compose restarts the container (same container, same
# /data) and the service replays its journal into the same episode, never a reset.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 8192m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    image: ghcr.io/mll-lab-nu/eai-ikea-mujoco-sim:0.4.0
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6          # N >= 3 (PROTOCOL §4.1); a resume continues the episode
    environment:
      RCB_TASK: ikea365
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "10800"   # the agent's wall clock, from its first request (= [agent] timeout_sec), server.py
      RCB_STARTUP_TIMEOUT_S: "900"
      PYTHONPATH: /srv
      RCB_SESSION_LOG: ""
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      OMP_NUM_THREADS: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
    shm_size: "1gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/eai-monitor:0.1.0@sha256:f2c910f53f79c2bfa4a71298b10c78383cae3afc40720ca562cc845b8d20fb0c
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor:/opt/rcb_monitor:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
