# tests/closed_band_spike.py 的运行模式参数与场景几何。
#
# 材料与接触参数不在这里 —— 它们在 task 配置的 rope.fem 块里，单源 prefabs.rope_fem，
# 用点路径覆盖即可扫参：
#   task.rope.fem.E=50000.0
#   task.rope.fem.friction_mu=0.6
#   task.rope.fem.contact_d_hat=0.003
#   task.rope.fem.rest_shape=straight
# 网格分辨率同理：task.rope.mesh.segment_length / radial_segments，
# 取值理由见 configs/closed_band_spike.yaml。

defaults:
  - default
  - _self_

# 做哪一项测试。四项按依赖排序，前一项不过不跑后一项。
#   mesh   : 只建网格并写 OBJ，不进求解器。读数与
#            tests/check_closed_band_mesh.py 相同，用于在 GPU 机器上复核。
#   settle : 载入 FEM+IPC 并沉降平整 O 形。看四面体化是否通过、是否收敛、带是否脱销。
#   hold   : 沉降后静置，逐段测自交叉数。**本轮的关键判据** ——
#            8 字若无外力自行张开成 O，则该任务不需要机械臂即自解。
#   flip   : 驱动下瓣绕竖直轴转半圈。正确一侧自交叉 1->0，错误一侧 1->2。
test: settle

# 沉降上限步数，以及收敛判据（单步最大顶点位移低于该值即认为收敛，米）。
settle_steps: 400
settle_tol: 0.00005

# hold 测试的静置步数与采样间隔。500 步 @ dt=0.01 约 5 秒。
hold_steps: 500
hold_sample_every: 25

# flip 测试：转哪一边、转多少步、转完后再静置多少步。
#   correct : 与初态 band.half_turns 反向，预期自交叉 1 -> 0
#   wrong   : 与初态同向再加半圈，预期自交叉 1 -> 2
flip_side: correct
drive_steps: 400
flip_settle_steps: 200

# 下瓣抓取带的选取半径（米）。取到能覆盖整个下端半圆帽。
band_radius: 0.020

# 顶部半圆帽的按住带半径（米）。拧的时候按住，拧完释放 —— 拧一个环要两只手，
# 顶部不按住的话整个环只会绕竖直轴整体转，并沿挂销滑出去（2026-08-21 实测）。
crown_radius: 0.020

# 是否声明顶部按住带。设 false 则整个实体只剩一条 follow band，
# 用来把「两条 follow band」从其他可能原因里分出来（诊断用，正常跑保持 true）。
crown_hold: true

# 是否加载机械臂。本 spike 用不到它，但仓库里所有跑通过的 FEM+IPC 场景都带臂，
# include_robot=false 在 FEM 侧没有先例，因此留成开关而不是写死（诊断用）。
include_robot: false

# 录制相机。在 env.cameras 之外再加一台特写 —— 那几台的取景是整张桌子，
# 而这条带只有 160mm 长。pos/lookat 与 band 一样用 task 系。
# 名字不能与 env.cameras 里的任何一台重名（会在录制里把那台顶掉），因此叫 band；
# 录它要写 recording.camera=band，录全部写 recording.camera=all。
# 视角俯看带面，与自交叉判定用的投影方向一致，因此 8 字与 O 形在画面里就是判定读到的形状。
# recording.res 若设了会覆盖这里的 res。
camera:
  name: band
  res: [768, 768]
  pos: [0.010, -0.180, 0.230]
  lookat: [0.010, 0.000, 0.004]
  fov: 42

# 场景几何。docx 3.3 的闭合弹性带，**平铺在桌面上、上瓣套在一根立柱上**。
# 不取 docx 插图的壁挂自由悬垂：悬垂时交叉处两股相距 2*loop_radius（实测 40.4mm），
# 够不到接触门槛 10mm，8 字全程无势垒，释放后 25 步内回弹（2026-08-21 实测，
# rest_shape、E、d_hat 三项都改不动）。平铺时交叉是一股压在另一股上，
# 中心线间距 = 2*管半径 = 8mm，落在势垒内，重力提供法向力、桌面摩擦锁住 ——
# 与 cloth_fold 的折叠保持折叠是同一机理，也是这个求解器唯一能提供的势垒
# （IPC 侧本构写死 StableNeoHookean，Genesis 没有塑性 FEM 模型）。
# 坐标为 task 系（原点在桌面中心，z=0 为桌面）。
band:
  # 带的闭合周长（米）。与扭转圈数无关 —— 生成器解出长度使周长守恒。
  perimeter: 0.36
  # 两个半圆帽的半径（米），即带的瓣宽的一半。
  # 下限由立柱决定：loop_radius >= post_radius + rope.radius + contact_d_hat
  #             = 0.010 + 0.004 + 0.002 = 0.016。取 0.018 留 2mm 余量。
  loop_radius: 0.018
  # 立柱轴心的 xy（米，task 系）。带所在平面的高度不在这里配 —— 它恒等于
  # rope.radius（平铺时管心离桌面正好一个半径），由代码取，免得两处漂移。
  # 该取值下平铺 O 形从柱心向 +x 伸出 141.4mm，8 字缩到 125.2mm，
  # 两端都落在工作空间 x 范围 [-0.25, 0.25] 内。
  post_xy: [-0.060, 0.0]
  # 立柱半径与高度（米）。高度只要带抬不过柱顶即可，无需端盖。
  post_radius: 0.010
  post_height: 0.060
  # 要拧到的半圈数。**带按平整 O 形出生，8 字由求解器拧出来**，理由见
  # tests/closed_band_spike.py 的模块文档（直杆静止形状会把接缝扭转抄进静止态）。
  # +1 / -1 是 docx 3.3 的两种手性。
  half_turns: 1.0
  # 自交叉合并半径（米）。一处物理交叉跨若干中心线段，不合并会被逐段重复计数。
  # 取值量级同 untangle_continuous 的 success.crossing_merge_radius（0.012）。
  crossing_merge_radius: 0.012
