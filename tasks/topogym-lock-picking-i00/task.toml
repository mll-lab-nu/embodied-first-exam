schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "topogym/topogym-lock-picking-i00"
description = "TopoGym lock_picking (panda_robotiq, Genesis): produce one replayable trajectory. Insert the tabbed key through all three rotor plates and the final END plate, while respecting their slots and stops. Frozen scene instance (variation lock_picking_medium, seed 0)."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "panda_robotiq", "code-as-policy", "trajectory", "lock_picking"]

[metadata]
author_name = "jianwen"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "topogym"             # TopoGym on Genesis 1.2.1 (CUDA physics, Nyx RGB)
robot = "panda_robotiq"
family = "lock_picking"
tier = "privileged"               # privileged (state-based perception) | perception (RGB-D models)
instance_seed = 0                 # scene = environment/instance.json (variation lock_picking_medium, eval index 0); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 17100.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 5400.0             # TopoGym budget: 1.5 h of wall clock
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
