[robots]
sharpa-wave-floating = "A dexterous right hand on a six-DoF actuated wrist stage, no arm: Sharpa Wave (22 finger actuators) by default, or Wuji Hand 2.2 (20)"
sharpa-wave-floating-bimanual = "Two dexterous hands, each on its own six-DoF actuated wrist stage, no arms: Sharpa Wave (22 finger actuators each) by default, or Wuji Hand 2.2 (20 each)"
marvin-bimanual-sharpa-wave = "Tianji Marvin fixed stand with two 7-joint arms and a dexterous hand on each wrist: Sharpa Wave (22 finger actuators each) by default, or Wuji Hand 2.2 (20 each)"

[modes.privileged]
# B/privileged/tests/grade.py main(): reward 1 iff one fresh replay's verdict has success True and no bad_trajectory;
# MAX_BYTES 64,000,000; the family's replay.py: hands.read_trajectory (hand member default "sharpa", exact width per
# hand, 1 <= T <= MAX_ROWS, finite; optional task / actuator_names must match), actuator_ctrlrange check, the replay
# loop breaks at session.done; checked_replay.py: start state != instance.json start_state_sha -> instance_mismatch
# (infra_error 1, no row run). A step budget reached without success is the runtime's "episode_budget" failure.
success = """
The graded file is `/app/output/trajectory.npz`, as `s.save_trajectory` writes it: a finite numeric `actions` array
with one row of motor targets per control step ({vars[w_sharpa]} values for the Sharpa Wave hand, {vars[w_wuji]} for
the Wuji Hand 2.2), 1 to {vars[rows]} rows, and a `hand` member that names the hand (an archive without it counts as
Sharpa Wave). After the agent's session, the verifier rebuilds the frozen scene with that hand in a fresh process of a
separate container without network and replays the rows once, open-loop. The replay stops at the first success or the
first failure, and later rows are not run. The task is passed if the replay ends in success; rows that run out first,
or the step budget reached first, leave it failed. Only the motor targets are read: no other member of the archive
changes the verdict.

A missing file scores 0, and so does a rejected one: larger than 64 MB, a row width that does not match the hand, a
non-finite value, no rows or too many, a target outside its actuator's range, or a `task` or `actuator_names` member
that does not match this task. A frozen scene that does not build to its recorded start is an infrastructure error,
not a score.
"""

[modes.standard]
# B/sim/server.py: RCB_AGENT_END=1 and RCB_RESET_BUDGET (environment/docker-compose.yaml); execute() L423-445 (success
# latched -> verdict_restore, the physics goes on; failure -> task_failure; clock() >= BUDGET -> step_limit);
# end_window() L378-396 (finished / timeout only: hold_action() rows for up to END_WINDOW_S = 3 s while the success
# does not hold); finish() (reason "error" -> 0); do_submit() L536 np.clip to actuator_ctrlrange; reset_mismatch() and
# the start check (instance_mismatch, infra_error). B/standard/tests/grade.py verdict().
success = """
Graded is the live episode on the simulator service; nothing is replayed. The service runs the hand the runner
selects (Sharpa Wave unless the Wuji Hand 2.2 is selected; `spec()["hand"]` names it). The agent may reset up to
{resets} times, each reset starting a new episode from the same frozen start; only the last episode is graded. An
episode ends at the agent's `POST /finish`, when the agent's session ends (at the latest after {timeout}), at the first
failure above (a score of 0), at the step budget where the task has one, or on a simulator error (a score of 0). A
success neither ends the episode nor is shown to the agent.

Each stage before the last counts at the moment it is completed. The last stage, with its full hold, must be met on
the state the episode ends in: every check goes on after it is first met, and a failure after it still scores 0. If
it is not met at `/finish` or at the session's end, the robot holds its current targets for up to 3 s of simulated
time, and the episode passes if the last stage completes within that time without a failure. At the step budget it
must be met at that step. Targets outside an actuator's range are clipped. Each episode's start is checked against
the frozen instance; a mismatch is an infrastructure error, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families. vars: rows = the privileged archive's row limit (replay.py MAX_ROWS), w_sharpa / w_wuji = the row widths
# (replay.py WIDTHS). "at most" = <=, "more than" = >, as in the source.

[families.coffee_stir]
# environment/sim/checker.py (= B/privileged/environment/variants/f716640f13/checker.py): Checker.update L206-286
# (stage 0 -> 1: bowl() submerged and grasped = thumb + another finger L214; stage 1: theta reset when not submerged,
# accumulates while grasped and radius >= stir_min_radius_m, |delta| <= stir_max_step_rad; stage 2 at |theta| >=
# 2 pi stir_revolutions; placed L248-260: not held (no contact with any wrist_stage body), spoon_cup == 0,
# worktop contact, clearance of bowl_center and spoon_top >= place_clearance_m, axis tilt <= place_max_tilt_deg,
# spoon and cup speeds; hold >= rest_hold_steps L262); bowl() L103-109 (cup frame: CUP_FLOOR_Z - 0.004 <= z <=
# COFFEE_Z, radius <= CUP_INNER_R; scene.py: 0.008 / 0.064 / 0.050); violation() L145-204; task.json thresholds
# (cup_max_tilt_deg 10, cup_max_slide_m 0.02, cup_max_lift_m 0.005, drop_speed_m_s 0.2, below_table_margin_m 0.003,
# workspace, stir 6 / 0.008 / 0.785398, rest 0.02 / 0.5 / 50, place 0.1 / 15, max_steps 3000); runtime.py step()
# L112-149; replay.py MAX_ROWS 3000, WIDTHS 58 / 54.
vars = { rows = "3,000", w_sharpa = "58", w_wuji = "54" }
success = """
Three stages, in this order, checked once per control step (50 Hz):
1. In the hand and in the coffee: the thumb and at least one other finger touch the spoon, and the bowl centre, the
   bowl tip and the bowl neck (23 mm either side of the centre along the spoon) are all between 4 mm and 64 mm (the
   coffee surface) above the mug base and within 50 mm of the mug axis.
2. Stirred: the bowl centre has turned at least six full revolutions about the mug's vertical axis (world frame, net
   signed angle). The angle grows only while the thumb and another finger touch the spoon, the bowl is in the coffee
   as in stage 1 and the bowl centre is at least 8 mm from the axis; a change of more than 0.785 rad in one control
   step is not counted, and the count restarts from zero whenever the bowl leaves the coffee before the six turns are
   complete.
3. Laid down, for 50 consecutive control steps (1 s): nothing of the hand touches the spoon; the spoon touches the
   worktop and does not touch the mug; the bowl centre and the handle end are both at least 0.10 m from the mug axis
   horizontally; the spoon's axis is within 15° of horizontal; spoon and mug each move at most 0.02 m/s and turn at
   most 0.5 rad/s.

The coffee is not simulated: it exerts no force, and only the bowl's revolutions in it are measured.

The episode fails at once, checked after every 2 ms physics substep, when: the mug tilts more than 10°, slides more
than 20 mm or rises more than 5 mm; the spoon touches the floor, or touches the worktop before stage 2 is complete;
the spoon touches neither the hand, the mug nor the worktop while its centre of mass falls faster than 0.2 m/s; the
mug touches the floor; the bowl centre, bowl tip, bowl neck or handle end is more than 3 mm below the worktop top
(z = 0.75 m), or the mug base more than 5 mm below it; the bowl centre or the handle end leaves the box x 0 to 0.96 m,
y -0.48 to 0.48 m, z 0.70 to 1.60 m; a fingertip is inside the mug radius below the coffee surface; an arm link or
the stand, or the parked left hand, touches the mug, the spoon, the worktop or the floor; or the physics becomes
unstable. The step budget is 3,000 control steps (60 s).
"""

