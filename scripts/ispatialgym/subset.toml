# iSpatialGym subset: the single source for every tasks/ispatialgym-* directory (`mk_tasks.py render` writes them).
#
# Upstream's public pre-release (kmy17518/iSpatialGym, MIT) evaluates 13 instances of 7 families, one per task. They are
# the 14 tasks rcb picked from the 83 instances of its internal release (23 tasks) by the model-free steps below, less
# configuration_matching_attachment, which the public release does not support; step 4 drops disembedding too. No model's
# result enters the choice (docs/benchmarks/ispatialgym.md).
#   1. One task per success rule. Two tasks whose BDDL goal and measured targets are the same keep one:
#      camera_relocalization_standard is camera_relocalization_obstructed without the obstacle (the obstructed one stays);
#      of an open / close pair the opening twin stays (as in BiGym 2.0); a relation checked at two scales keeps the
#      small-scale task (tighter tolerances; the large-scale ones relate an object to a fixed scene fixture with the base
#      moving, what BEHAVIOR-1K's tasks already cover on the same robot and scenes). 23 -> 14.
#   2. Within a task, the first subtask in upstream's index (metadata/instances.jsonl) that is valid here: its instance
#      loads, holding still for the whole episode does not succeed, and two fresh replays of the same actions end in the
#      same state (`mk_tasks.py measure`, written to instances/<task>/facts.json).
#   3. Instance 0 of that subtask (the release has one per subtask).
#   4. Both modes must keep the answer out of the privileged agent's reach while its simulator stays the grader's (the
#      start instance holds no target, and the same rows give the same states as the scoring side's). Two tasks cannot:
#      configuration_matching_attachment, whose attach rule needs the pair of parts that join (the answer) to simulate
#      at all, and disembedding, whose start instance tells the target apart from the distractors (upstream declares
#      it alone and spawns it first). 14 -> 12, both modes each.
#
# `dropped` lists the 9 upstream tasks step 1 removes, with the task that covers each.

[defaults]
instance = 0
upstream = "kmy17518/iSpatialGym@fddcf756c8134bab1358e539f8b6c1f16ad3e1ec"            # public, MIT ("pre release", 13 eval instances)
upstream_b1k = "kmy17518/BEHAVIOR-1K@6a6194600939179671054e1ae5e78b0a158f996c"         # branch ispatialgym-eval
upstream_data = "huggingface.co/datasets/kmy17518/ispatialgym-eval-data@v1.0"
tolerance_scale = 3                                    # run_isg --mode policy's default
settle_eval = true                                     # upstream's settle-eval (not run_isg --mode policy's default): the goal and every target
                                                       # hold over the last 45 steps with the task's objects and the robot at rest; off, a blind
                                                       # sweep of a held object's poses succeeded (adversarial trial, 2026-10-16)

[[task]]
task = "alignment_axial"
description = "An object on a table or desk starts yawed 20–70° away; push it until its long axis lines up with the table edges."
family = "alignment"
subtask = "alignment_axial_board_game"

[[task]]
task = "alignment_vertical"
description = "An object hanging on a wall starts tilted 15–45° in the wall plane; push it upright."
family = "alignment"
subtask = "alignment_vertical_painting"

[[task]]
task = "camera_relocalization_obstructed"
description = "As in Standard, but an obstacle on the shortest path forces a different route."
family = "camera_relocalization"
subtask = "camera_relocalization_obstructed_hamper_1"

[[task]]
task = "configuration_matching_articulation_open_small_scale"
description = "Open a small articulated object, such as a blender or carton, to the goal angle while the other arm braces it."
family = "configuration_matching"
subtask = "configuration_matching_articulation_open_small_scale_blender"

[[task]]
task = "configuration_matching_block_design"
description = "Arrange four identical Kohs blocks so that their top faces form the goal 2×2 pattern."
family = "configuration_matching"
subtask = "configuration_matching_block_design_block_4"

[[task]]
task = "inter_object_relation_satisfaction_inside_small_scale"
description = "Lower the target into a container on the same surface."
family = "inter_object_relation_satisfaction"
subtask = "inter_object_relation_satisfaction_inside_small_scale_brussels_sprouts_bowl"

[[task]]
task = "inter_object_relation_satisfaction_nextto_small_scale"
description = "Move the target until it is next to the partner, keeping its orientation."
family = "inter_object_relation_satisfaction"
subtask = "inter_object_relation_satisfaction_nextto_small_scale_marker_colored_pencil"

[[task]]
task = "inter_object_relation_satisfaction_ontop_small_scale"
description = "Place the target centred on top of the partner; both start on the same surface."
family = "inter_object_relation_satisfaction"
subtask = "inter_object_relation_satisfaction_ontop_small_scale_pack_of_kielbasa_platter"

[[task]]
task = "inter_object_relation_satisfaction_touching_small_scale"
description = "Set the target down beside the partner, then push it until the two touch without moving the partner."
family = "inter_object_relation_satisfaction"
subtask = "inter_object_relation_satisfaction_touching_small_scale_box_of_sanitary_napkins_box_of_tissues"

[[task]]
task = "inter_object_relation_satisfaction_under_small_scale"
description = "Set the target down centred on the partner, so that the partner, such as a coaster or saucer, ends under it."
family = "inter_object_relation_satisfaction"
subtask = "inter_object_relation_satisfaction_under_small_scale_teacup_saucer"

[[task]]
task = "mental_rotation"
description = "The object is held in the right hand; the goal is a new orientation with its position unchanged."
family = "mental_rotation"
subtask = "mental_rotation_carving_knife"

[[task]]
task = "object_scaling"
description = "The object is held in the right hand; the goal is a change of its depth along the head camera's optical axis."
family = "object_scaling"
subtask = "object_scaling_apple"

[dropped]
camera_relocalization_standard = "camera_relocalization_obstructed: the same goal, without the obstacle"
configuration_matching_articulation_close_small_scale = "configuration_matching_articulation_open_small_scale: the closing twin"
configuration_matching_articulation_close_large_scale = "configuration_matching_articulation_open_small_scale: the closing twin of the large-scale one"
configuration_matching_articulation_open_large_scale = "configuration_matching_articulation_open_small_scale: the same rule at scene scale"
inter_object_relation_satisfaction_inside_large_scale = "inter_object_relation_satisfaction_inside_small_scale: the same relation at scene scale"
inter_object_relation_satisfaction_nextto_large_scale = "inter_object_relation_satisfaction_nextto_small_scale: the same relation at scene scale"
inter_object_relation_satisfaction_ontop_large_scale = "inter_object_relation_satisfaction_ontop_small_scale: the same relation at scene scale"
inter_object_relation_satisfaction_touching_large_scale = "inter_object_relation_satisfaction_touching_small_scale: the same relation at scene scale"
inter_object_relation_satisfaction_under_large_scale = "inter_object_relation_satisfaction_under_small_scale: the same relation at scene scale"
