# soccer_ssl: wheeled robot soccer 5 v 5 after the RoboCup Small Size League (Division B), built in parallel lines
# (olympiad_review/screening/soccer_ssl_interfaces_zh.md): A the robot (bodies/ssl_robot), B the field, ball, world and
# referee (sim/), C the overhead cameras (sim/camera.py), E the plugin, the skill contract (skill_api.py), the
# observation and the tasks (this file, plugin.py), D the scripted opponents and the reference player
# (builtin_players.py, opponents/). Proposal: olympiad_review/screening/soccer_ssl_proposal_zh.md.

[sport]
name = "soccer_ssl"
title = "Wheeled robot soccer 5 v 5 (RoboCup SSL Division B)"
summary = "wheeled robot soccer 5 v 5 under the RoboCup Small Size League rules (Division B): ten omnidirectional SSL robots after TIGERs Mannheim's v2020 (kicker, chip kicker, dribbler; their real speed, acceleration, kick and dribbler limits) and an orange golf ball on the 9 x 6 m field, two halves of 300 s of playing time, a shoot-out when level, an automatic referee for every rule an SSL auto-referee judges; you command your robots with three skills (move to a pose, optionally by a time and at a speed; kick flat or chipped along the robot's heading, now or the moment the ball reaches it; spin the dribbler) and see the game through the four overhead cameras of the shared vision, 40 ms late; in the `match` format you command the blue team against a scripted team, in the `duel` format another player commands the yellow team, in the `team` format each robot has its own player"
protocol = "realtime"
revision = "soccer_ssl-1"             # soccer_ssl-1: the first playable revision (world sim/world.py REVISION soccer_ssl-world-1, robot ssl_robot ssl-1)
physics = "MuJoCo 3.3.7 (1 ms physics steps, 10 ms control steps; ten planar SSL robots (bodies/ssl_robot: the library's PlanarBase servo at the real limits, an impulse kicker behind a break beam, a contact dribbler with a capped grip); a golf ball sliding and rolling on carpet (condim 6, elliptic cone), chip bounces; robot-robot, robot-ball, wall and goal contacts)"
image = "ghcr.io/mll-lab-nu/efe:olympiad-0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[body]                                # the robot library's SSL robot (bodies/__init__.py PLANAR): the generator copies it
name = "ssl_robot"                    # into the task's simulator (tools/sportlib.copy_body); the plugin refuses to run
                                      # without it (RCB_SSL_BODY=library). NOTE: tools/check stage 1 still looks it up
                                      # in BODIES only (shared PR pending: PLANAR bodies in tools/check)

[rulebook]
name = "Rules of the RoboCup Small Size League (Division B)"
version = "2026-09-19 (github.com/RoboCup-SSL/ssl-rules commit 2ff4be0c)"
url = "https://github.com/RoboCup-SSL/ssl-rules"
game_controller = "github.com/RoboCup-SSL/ssl-game-controller commit 45e4b3d (2026-10-05): placement positions, continue conditions, timings"

[[deviations]]
id = "S1"
rule = "§2.3, §4.1, §8.3, §8.4.1.2-8.4.1.3, appendix C (human referee, game controller operator, automatic referees)"
text = "a deterministic automatic referee in the simulator replaces the human referee, the game controller operator and the auto-referees; what the rulebook leaves to the human referee is judged by measurable definitions: pushing = during one contact episode (directly or through the ball, gaps <= 0.1 s) both robots travel more than 0.3 m towards the pushed robot (the pusher is not called again within 2 s); ball holding = two or more robots of a team within 0.15 m of the ball for 1 s; the end of dribbling ('observable separation') = the ball's centre more than 0.03 m beyond the robot's assumed 0.09 m radius; a new collision = a pair of robots in contact again after 0.1 s apart; the penalty ball 'moves only towards the goal' = it never goes back more than 0.05 m; when robots are still out of position 10 s into a kick-off or penalty preparation (the game controller's prepare time) the referee moves them to legal spots and counts one foul per team (the rulebook's 'disrespect procedures', §8.3.4, is unsporting behaviour at the human referee's discretion); after a stop the game continues 2 s after the robots keep their distance and the ball is steady (the game controller's rule), at the latest 10 s after the ball was placed (the game controller waits for a human); a ball resting in a defense area is judged as keeper held ball (§8.4.1.7) before no progress (§8.1); the stop speed limit is judged in the STOP state only (the rulebook's 'during Stop'); a non-stopping foul by the same robot (a crash: the same pair) is called at most once per 2 s, and touching the ball in the opponent defense area is not called while robots of both teams touch the ball (as the TIGERs AutoReferee's detectors: cool-down 2.0 s; 'two teams fighting for the ball'); the ball's height for the chip-goal rule (§7) is its lowest point above the carpet (TIGERs AutoReferee: the tracked ball's z is 0 on the ground; the game controller rejects a goal above 0.15 m); unsporting behaviour other than these is not judged; all thresholds are ESTIMATES, to be calibrated; these details were approved by the user on 2026-10-11 (ball holding: re-check its false positives in step 4)"
affects_result = true
[[deviations]]
id = "S2"
rule = "§2.3.1 (shared vision)"
text = "the players see the images of four overhead cameras (4.0 m above the carpet, one per quadrant, 800 x 600 each, like the shared SSL cameras; sim/camera.py) instead of the shared vision system's detections; the images show the world 40 ms (4 control steps) late, like SSL vision (about 45 ms); they are ideal: no noise, no lens distortion, no motion blur, even lighting (real SSL vision measures about 3.47 mm of robot position noise and occasional failed detections); both teams see the same images; the detections are a controlled-experiment condition only"
affects_result = true
[[deviations]]
id = "S3"
rule = "§5.2 (ball placement)"
text = "the referee places the ball (Division B may leave the placement to the referee): 1 s after the stop it puts the ball at rest on the placement position (the game controller's positions); robots never place the ball, so there is no placement interference, placement failure or placement counter"
affects_result = false
[[deviations]]
id = "S4"
rule = "§4.4.2, §5.1.2, §9, §11, §12, §2.4 (timeouts, halt, substitution requests, forced timeout, challenge flags, communication flags, keeper id changes)"
text = "no halt, timeouts, forced timeouts, challenge flags or substitution budget; the keeper is robot 0 for the whole match; the half-time break is the review (the world frozen); at the start of each half and of each shoot-out kick the referee sets the robots on their spots (the robot handlers' work in a break); robots leave and enter only through the robot handler's `substitute` command (§9.1.2, §9.2: from the substitution area, or any robot named after a card) or a card removal (S11)"
affects_result = false
[[deviations]]
id = "S5"
rule = "§4.4.1 (overtime), §10 (shoot-out)"
text = "no overtime: level after two halves goes straight to the shoot-out (5 penalty kicks each, then sudden death); each team shoots at the goal it attacked in the second half and the team that kicked off first shoots first (the rulebook does not say); robot 1 kicks and robot 0 keeps; after 10 rounds without a winner a coin toss drawn from the seed decides (the rulebook's note gives the human referee time instead)"
affects_result = true
[[deviations]]
id = "S6"
rule = "§3.2.6-3.2.7 (communication)"
text = "match and duel formats: one program commands the whole team, as in real SSL; the team format (one player per robot; teammates talk only through the team channel: at most 512 bytes per message, one message per robot every 0.2 game seconds, 3000 per robot and match, as in the humanoid soccer) is an experimental condition SSL does not have"
affects_result = true
[[deviations]]
id = "S7"
rule = "§3.2.5 (vision pattern)"
text = "the robots carry the standard SSL colour pattern (blue or yellow centre, four id dots) for the players to read from the overhead images (bodies/ssl_robot)"
affects_result = false
[[deviations]]
id = "S8"
rule = "§2.1.2 (field surface), §2.2 (ball)"
text = "the carpet and the ball are modelled with TIGERs' fitted ball model (sliding 3.4 m/s^2, rolling 0.45 m/s^2, chip bounce restitution 0.54): the rulebook names no carpet; the ball is a solid sphere (sliding turns to rolling at 5/7 of the speed, real SSL balls measure about 0.6); no air drag (about 2 % of the weight at 6.5 m/s); the goals' energy-absorbing foam and the walls' contact are ESTIMATES (sim/ball.py, sim/field.py)"
affects_result = true
[[deviations]]
id = "S9"
rule = "§3.1 (number of robots), §5.5.1 (yellow card)"
text = "5 v 5 (Division B allows up to 6 per team); a team's allowed robots are counted from 5, so every yellow or red card takes a robot off (with 6 allowed, the first card of a 5-robot team would take nothing off)"
affects_result = true
[[deviations]]
id = "S10"
rule = "§8.4.1.4 (tipping over or dropping parts)"
text = "not modelled: the robots' bases are planar joints (they cannot tip over) and lose no parts; never an advantage"
affects_result = false
[[deviations]]
id = "S11"
rule = "§5.5.1 (removing a robot after a card), §9.2"
text = "after a card the team names the robot to take off with the robot handler's command `substitute` (to = off: taken off at the next control step); a team that still has too many robots on the field 10 s after the card has one taken off by the referee (the robot that committed the card's last foul, else its highest-numbered field robot), then the game continues with a force start; in the rulebook the team's robot handler takes the robot off"
affects_result = true
[[deviations]]
id = "S12"
rule = "§2.1.2 (field dimensions)"
text = "the walls are 0.1 m high (the rulebook before 2026-02-25; the current text no longer gives the height) and 0.05 m thick (ESTIMATE)"
affects_result = false
[[deviations]]
id = "S13"
rule = "§3.2 (robots)"
text = "the robots are our own model of TIGERs Mannheim's v2020 robot from its published dimensions (no team publishes a URDF; bodies/ssl_robot): the base is driven as a whole (no wheels) at the published speed and acceleration (3 m/s, 3 m/s^2), braking at the same 3 m/s^2 (the real robot brakes at up to 6: stricter), no coupling between turning and acceleration (looser); the kicker is an impulse on the ball when it blocks the break beam, with the real speed scatter (3 %) and an estimated 1 deg of direction scatter; the dribbler: S16"
affects_result = true
[[deviations]]
id = "S14"
rule = "§2.3.1, §3.2.6 (vision and robot data)"
text = "each robot's own state (pose and velocity in your frame, dribbler speed, capacitor, armed kick, break beam, its target) comes from its own sensors without delay and exactly (real robots fuse onboard sensors with the delayed vision: millimetres of error); the ball and the other robots only through the camera images"
affects_result = true
[[deviations]]
id = "S15"
rule = "§4.4 (duration)"
text = "the world runs at 1/10 of real speed (game time is real SSL time; the players' wall clock is 10 x slower) and freezes after every goal, at half time, before the shoot-out and after every shoot-out kick for the players' reviews (at most 600 s each)"
affects_result = true

[[deviations]]
id = "S16"
rule = "§3.2.4 (dribbling device)"
text = "the dribbler is the official model 'contact + capped adhesion' (user decision 2026-10-11): the bar touches the ball physically and, while the bar spins and the ball is in the dribbler opening, a horizontal spring-damper pulls the ball to the holding point with at most 0.5 N (no lift, never welded: a push of about 0.75 N takes the held ball; bodies/ssl_robot assist.py). It lets go above release thresholds calibrated so that ZJUNlict's dribbling test (accelerating at 3 m/s^2 with the ball) loses the ball where their v2023 robot does: backwards 2.3 m/s, sideways 2.6 m/s, turning 9.3 rad/s (ZJUNlict 2024 TDP, table 1; the v2019 robot 3.9 / 3.9 / 12.9). Reason: the rigid contact alone loses the ball sideways at 0.55 m/s and turning at 3 rad/s. With the bar above about 8000 rpm the contact alone lets a robot back up with the ball to about 2.8 m/s (between the two real generations, 2.3 and 3.9 m/s); the bar speed is not capped. The adhesion can be switched off for control experiments (bodies/ssl_robot/body.toml [dribbler_assist] enabled = false)"
affects_result = true

[formats.match]                       # one seat (blue) against the scripted yellow team inside the world (plugin.scripted_team)
seats = ["A"]
opponent = true                       # success = winning a valid match (core/grading.py)
levels = [1, 2, 3]                    # RCB_LEVEL; 1 = warm-up, 2 and 3 official (proposal §10.5)
default_level = 2
[formats.match_onboard]               # the second perception mode (S17): onboard front cameras, the scripted team.
                                      # PREVIEW, not official (10-13): no task, no hidden seeds (no onboard reference yet)
seats = ["A"]
opponent = true
levels = [1, 2, 3]
default_level = 2
[formats.duel]                        # one player per team
seats = ["A", "B"]
first = ["A", "B"]                    # the team that kicks off first (and shoots first in a shoot-out)
[formats.duel_onboard]                # the second perception mode (S17), one player per team. PREVIEW, not official
                                      # (10-13): no task, no hidden seeds
seats = ["A", "B"]
first = ["A", "B"]
[formats.team]                        # one player per robot (S6); sides = the teams
seats = ["A0", "A1", "A2", "A3", "A4", "B0", "B1", "B2", "B3", "B4"]
sides = { A0 = "A", A1 = "A", A2 = "A", A3 = "A", A4 = "A", B0 = "B", B1 = "B", B2 = "B", B3 = "B", B4 = "B" }
first = ["A", "B"]

[[deviations]]
id = "S17"
rule = "§2.3.1 (shared vision), §3.2.6 (vision and robot data)"
text = "second perception mode (formats *_onboard; the main mode is the overhead cameras of S2): no shared vision; every robot sees only through its own front camera (0.13 m above the carpet, 0.072 m ahead of the centre, 15 deg down, 90 deg wide, 640 x 480, a frame every 3 control steps = 33 Hz, 40 ms late; ESTIMATES after the KIKS, RobôCIn and TIGERs onboard cameras of the SSL 'Vision Blackout' challenges; ideal images: no pitch jitter, noise or blur) and knows its own wheel odometry and gyro with their drift (encoder and gyro numbers of TIGERs v2020, ICM-42688, ZJUNlict; wheel radius error and slip ESTIMATES; sim/odometry.py) and the poses the robot handlers tell it at the start of each half and whenever the referee moves it, not its global pose; a move target is taken in the robot's odometry frame when the command takes effect. Real SSL plays with the shared vision; onboard play exists only as the 2019-2022 Vision Blackout technical challenge. The two modes are ranked separately"
affects_result = true

[team_channel]                        # core/channel.py: teammates only (team format), as in the humanoid soccer
max_bytes = 512
min_interval_s = 0.2
max_messages = 3000

[modes]
action_levels = ["high", "low"]       # high: the skill API (the tasks); low: the robot's servo interface only (move without
                                      # t / v_end), declared because every sport has a low level; no low tasks and no
                                      # engineer mode this round (proposal §5.4)
plays = ["program"]
b9_test = "test_b9_pass_receive_and_shoot_feasible"   # tests/test_plugin.py: a first feasibility probe (the full B9 is step ②)

[modes.high]                          # Agent as Athlete: the platform provides the skill API
skills = ["move", "kick", "dribble"]  # + the robot handler's substitute and the batch envelope (skill_api.py)
contract = "skill_api.py"             # CONTRACTS: the single source of the request ranges, timing, feedback, authority
implementation = "plugin.py:SkillLayer"

[timing]
slowdown = 10                         # proposal §5.3: 10 x (C: one 4-camera observation 68 ms; at 75 Hz of game time the
                                      # render worker is busy 51 %); to be confirmed after step ④
start_timeout_s = 1800
ready_timeout_s = 600                 # every review (proposal §5.3: 300 s was too tight in the humanoid soccer)
replay_timeout_s = 1800               # the fresh-process replay of a whole match (about 4-6 CPU minutes of world)
video_timeout_s = 1800
reaction_delay_steps = 2               # core 0.2.18: an act takes effect at max(next step, the seat's latest state + 2)
                                      # = 20 ms, the median measured in the official service at x10 (review LATENCY,
                                      # 10-13); every screening number of step 4 is at this D (screen/worldrun.py)

[actions.cli]                         # `game move N X Y THETA`, `game kick N SPEED MODE ARMED_FOR`, `game dribble N RPM`,
                                      # `game substitute N off|on`; t, v_end and batch: `game act JSON`
high = { move = ["entity", "x", "y", "theta"], kick = ["entity", "speed", "mode", "armed_for"], dribble = ["entity", "rpm"], substitute = ["entity", "to"] }
low = { move = ["entity", "x", "y", "theta"], kick = ["entity", "speed", "mode", "armed_for"], dribble = ["entity", "rpm"], substitute = ["entity", "to"] }

[observation]
fields = ["team", "frame", "vision", "robots", "referee", "events", "stoppage", "result"]
renderer = "mujoco"
frame_budget_ms = 300                 # four 800 x 600 tiles, no MSAA: 68 ms median, p90 about 130 ms at host load 60
                                      # (docs/screening/soccer_ssl/render/README.md); twice that
columns = 2                           # 2 x 2 tiles: the four quadrants as they lie on the field
render_threads = 2                    # llvmpipe threads per render worker (more do not help: C §2)
sim_cpus = 6                          # two seats' render workers + the world (as table tennis)

[spec]                                # the rule constants: /spec shows them, the prompt lists them
frame = "metres, seconds, radians; the world frame has its origin at the field centre, x along the 9 m length, y along the 6 m width; YOUR TEAM'S FRAME (every command, every coordinate of the observation): you attack +x (the goal at x = +4.5) and defend the goal at x = -4.5, y to the left when facing +x, theta counter-clockwise from +x; the camera images are in the world frame: observation.frame.attack_sign (+1 or -1) maps them (team x, y = attack_sign * world x, y); blue attacks +x in the world in the first half and the teams change ends at half time"
field = "Division B: field of play 9 x 6 m (lines 0.01 m wide, a line belongs to the area it bounds), walls 0.3 m beyond the field lines (0.1 m high), centre circle diameter 1 m, defense areas 2 m wide x 1 m deep in front of each goal, penalty marks 6 m from the goal they face (x = -+1.5); goals 1 m wide inside, 0.18 m deep, 0.16 m high, no crossbar, foam inside; substitution area: the field margin within 1 m of the halfway line"
ball = "an orange golf ball, 0.043 m, 0.046 kg; kicked flat it slides at about 3.4 m/s^2 and rolls at about 5/7 of its speed after about 0.7 s, then slows by 0.45 m/s^2; a chipped ball bounces with a vertical restitution of about 0.54"
robots = "five per team, numbers 0-4, robot 0 is the keeper; after TIGERs Mannheim's v2020: 0.178 m across, 0.148 m high, 2.62 kg, flat front 0.0715 m from the centre with the dribbler opening and the kicker; base: 3 m/s, 3 m/s^2 (also braking), jerk 150 m/s^3, 20 rad/s, 50 rad/s^2; kicker: flat up to 8.5 m/s, chip up to 5.5 m/s at 45 deg, speed scatter 3 %, direction 1 deg (1 sigma), the capacitor full in 2 s (a kick at v needs (v / v_max)^2 of the full charge and uses a quarter of that); dribbler: up to 17000 rpm; WITH THE BALL (accelerating at 3 m/s^2) a robot loses it at about 2.3 m/s backwards (up to about 2.8 m/s with the bar above 8000 rpm), 2.6 m/s sideways and 9.3 rad/s turning (the move skill turns at up to 20 rad/s: turn in steps when you hold the ball); it receives balls up to about 4-5 m/s; a push of about 0.75 N takes a held ball (S16); on top the SSL pattern: a 50 mm blue or yellow centre dot and four 40 mm pink / green dots for the id (spec vision_pattern)"
actions = "per robot (entity = its number as a string): move(x, y, theta[, t][, v_end]) the base to a pose in your frame, by game time t (state.t_sim; omit: as fast as possible), at velocity v_end (omit: at rest), planned at the real limits from where the robot is (no obstacle avoidance: it never looks at the ball or other robots); kick(speed, mode flat|chip, armed_for s) along the robot's heading, now (with the ball in the break beam) or the moment the ball blocks the beam within armed_for; dribble(rpm); substitute(to off|on) the robot handler; batch(commands) several robots at one boundary. A command takes effect at the next 10 ms control step and replaces the robot's previous command of the same skill; one act per robot in flight (429); a robot off the field: 409. The full contract: skill_contract in game spec"
observation = "the four overhead camera tiles (2 x 2: top-left = world x < 0, y > 0; 800 x 600 each; calibration in game spec cameras: straight down from 4.0 m, image right = world +x, image up = world +y; the robots' tops at 0.148 m), showing the world vision.latency_s = 0.04 s ago (vision.t_capture; frame.age_s = the image's age now); team (your colour, robots, keeper); frame.attack_sign; robots: each of YOUR robots' own state (on_field, pose, vel, vel_body, dribbler_rpm, kicker_charge, kicker_wait_max_s, kicker_armed, ball_in_beam, target, eta); referee: the game controller's information (stage, half, command, for_team, next_command, play_time, time_left, score, fouls, yellow_cards_left_s, red_cards, allowed_robots, on_field, placement, remove_robot_within_s, shootout); events of the current unit (the referee's calls with their locations; your robots' command results and kicker events); no ball or opponent coordinates"
vision = { latency_s = 0.04, cameras = 4, tile_px = [800, 600], camera_height_m = 4.0, noise = "none (ideal images, S2)" }
onboard = { height_m = 0.13, forward_m = 0.072, pitch_down_deg = 15.0, hfov_deg = 90.0, tile_px = [640, 480], frame_every_steps = 3, note = "formats *_onboard only (S17): each robot's front camera, its odometry (robots[N].odom, robots[N].odom_vel_body), the last pose it was told (robots[N].told); no global pose, no overhead images" }
game = "two halves of 300 s of playing time; the clock stops whenever no team may play the ball (stop, kick-off and penalty preparation); level after two halves: a shoot-out of 5 penalty kicks each, then sudden death (after 10 rounds a seeded coin toss); a team with 10 goals and a lead of more than one wins at once"
restarts = "kick-off (all robots in their own half outside the centre circle, one robot of the kicking team may be inside it; in play when the ball moved 0.05 m or after 10 s); free kick (the defenders keep 0.5 m from the ball; in play after 0.05 m or 10 s); force start; penalty kick (keeper on the goal line, the others 1 m behind the ball, 10 s, the ball may only move towards the goal); the referee places the ball 1 s after a stop, the game goes on 2 s after all robots keep the distance and the ball is steady, at the latest 10 s after the placement; after a goal the other team kicks off"
ball_out = "over a touch line: free kick for the other team 0.2 m inside the line where it crossed; over a goal line: goal kick (1 m from the goal line, 0.2 m from the touch line) or corner kick (0.2 m from both lines) for the team that did not touch last; aimless kick: touched in its own half, over the halfway line and out over the opponent goal line without another touch: free kick for the other team where it was kicked"
goals = "a goal counts if the ball fully entered the goal between the posts, its height (the lowest point of the ball above the carpet, as the auto-referees measure it) was never above 0.15 m after the scoring team's last touch, the team had no more robots on the field than allowed and committed no non-stopping foul in the last 2 s; else play goes on as for a ball over the goal line"
fouls = "stopping fouls (free kick for the other team): closer than 0.2 m to the opponent defense area in stop or before a free kick is taken (2 s grace), pushing, ball holding, keeper held ball (the ball 10 s in a defense area), dribbling more than 1 m from where the contact began, kicking the ball over the walls; a robot other than the keeper touching the ball while entirely inside its own defense area: penalty kick (no foul counted); double touch by the kicker of a kick-off or free kick: free kick for the other team (no foul counted); non-stopping fouls (each robot is called at most once per 2 s for the same foul): touching the ball inside the opponent defense area (not while robots of both teams touch the ball), accelerating the ball above 6.5 m/s, crashing (projected speed difference above 1.5 m/s at contact: the faster robot; both if their speeds differ by less than 0.3 m/s); with the ball out of play: closer than 0.5 m to the ball during an opponent kick-off or free kick, faster than 1.5 m/s in the STOP state (not during kick-off or penalty preparation; 2 s grace; the platform does not slow your robots); no progress for 10 s: force start"
cards = "every third foul of a team is a yellow card: one robot fewer for 120 s of playing time; name the robot to take off with substitute(to = off) within 10 s (else the referee takes one off: the card's last offender, else your highest-numbered field robot); when the card expires bring it back with substitute(to = on); a third card while two yellow cards are active is red (one robot fewer for the rest of the match)"
keeper = "robot 0 is the keeper"
match_format = "you (seat A) command the blue team against the scripted yellow team of level RCB_LEVEL 1-3 (1 warm-up; 2 and 3 official); the scripted team reads the true state with a reaction delay and commands its robots with the same skills and limits; success = winning the match"
duel_format = "seat A commands blue, seat B yellow; FIRST_PLAYER's team kicks off first (and shoots first in a shoot-out); play both orders"
team_format = "ten seats, one robot each (A0-A4 blue, B0-B4 yellow; the number is the robot's); every seat sees the same overhead cameras and only its own robot's state; teammates are reachable only through the team channel (POST /say)"
stoppages = "a goal, half time, full time before a shoot-out and every shoot-out kick end a unit: the world freezes and every player sends game ready WHY PLAN (at most 600 s)"

[tiebreaks]
order = ["goals", "shootout", "coin_toss"]
text = "more goals after two halves wins (or 10 goals with a lead of more than one, at once); if level, a shoot-out of 5 penalty kicks each (the team that kicked off first shoots first), then sudden death; after 10 rounds still level, (last resort, not from the rulebook) a coin toss drawn from the seed"
last_resort_in_prompt = true

[score]                               # the continuous score (core 0.2.14, core/score.py): larger is better
name = "goal_margin"
text = "goals scored minus goals conceded in the two halves (the shoot-out does not count; a match ends at 10 goals at the latest, so the margin lies within -10..10)"
from = "margin"                       # own - the other side's, from Match.scores() (regulation goals only)
forfeit = -10                         # a side that forfeits gets the worst margin
range = [-10, 10]

[[exploits]]
id = "E1"
text = "an out-of-range, non-finite or malformed command, one for a robot the seat does not command, an unknown skill or a batch with a bad command or two commands of one skill for one robot is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_commands_are_refused"
[[exploits]]
id = "E2"
text = "a command for a robot that is off the field (a card, a substitution) is refused (HTTP 409) and the world does not carry it out at the boundary either"
test = "test_exploit_off_field_robot_cannot_act"
[[exploits]]
id = "E3"
text = "the observation holds no ball or opponent coordinates, no seed and nothing of the scripted team; the robots' own events do not reveal the kick's real speed or direction error or the ball's velocity"
test = "test_exploit_no_world_state_in_observation"
[[exploits]]
id = "E4"
text = "the camera images show the world 4 control steps (40 ms) late, also right after a command, and the same images to both teams"
test = "test_exploit_images_are_delayed"
[[exploits]]
id = "E5"
text = "a kick moves the ball only when it blocks the robot's own break beam, along the robot's heading (no aiming); a move target beyond the walls is clipped (no robot leaves the field); the robots cannot do what the real robot cannot (speed, acceleration, kick speed)"
test = "test_exploit_skills_are_actions_at_the_real_limits"
[[exploits]]
id = "E6"
text = "the scripted team commands through the same checks: its malformed commands are refused and counted, it cannot command the other team"
test = "test_exploit_scripted_team_uses_the_same_checks"
[[exploits]]
id = "E7"
text = "a goal freezes the world for the reviews: a command sent before every review is in is not carried out, and play resumes only through the reviews"
test = "test_exploit_unit_end_freezes_the_world"
[[exploits]]
id = "E8"
text = "a robot seat of the team format commands only its own robot; a team seat only its own team's robots"
test = "test_exploit_seats_command_only_their_robots"
[[exploits]]
id = "E9"
text = "no draws: the tiebreaks name the referee's decision (goals, shoot-out, coin toss) and a finished match always has a winner"
test = "test_exploit_no_draw_tiebreaks"
[[exploits]]
id = "E10"
text = "after a card the team may name any robot to take off (substitute off); otherwise a robot leaves only from the substitution area; a robot comes back only when its team is below the allowed number"
test = "test_exploit_substitution_rules"

[[exploits]]
id = "E11"
text = "the onboard mode (S17) gives no global pose: no camera definitions in /spec, no pose, velocity or target in the robots' state, move targets taken in the odometry frame (an odometry error carries into the field), the told pose only after a handler move"
test = "test_exploit_onboard_mode_gives_no_global_pose"

[reference]                           # tools/check stage 5, the reference check (docs/screening/README.md)
match = "plugin:reference_match"      # one match of the reference (line D's player) against the scripted team
seeds = 20                            # truth reference: seeds 1..20 per official level (2, 3)
camera_seeds = 5                      # the camera reference at the lowest official level (about 1.7 h of CPU each)

[players]
reference = "reference"               # Sport.players() names (line D's builtin_players.py: camera-only)
reference_class = "builtin_players:ReferencePlayer"
check = []                            # no extra check policy: a match draws about 14000 observations per seat

[fairness]
policy = "reference"
matches_per_order = 20                # the contract's minimum; realtime: a CI wider than 5 pp warns
max_advantage_pp = 5
mirror = "statistical"                # the kick-off formation's seeded jitter differs between the teams

[official]                            # public seeds (a hidden set comes with core PR #85 at the freeze)
seeds = [1, 2, 3]
levels = [2, 3]
first_any = true

[official.hidden_seeds]                 # registered hidden seed set (tools/seeds.py; public commitments: seed_commitments.json)
sha256 = "0199230bdf2c189da8cb02edcf92f463735f9b17d837ee7e12a828d2bf38bd5e"
counts = { "duel" = 20, "match/L2" = 20, "match/L3" = 20, "team" = 20 }

[check]                               # an in-process match: about 4 CPU minutes of world and 14000 observations per seat
stage_timeout_s = 172800
live_player_timeout_s = 21600

[golden]
episodes = "golden"

[[tasks]]
id = "soccer_ssl-match-wallclock-program-standard"
format = "match"
action_level = "high"
agent_timeout_s = 14400               # the 4 h cap (ci_checks/check-task-fields.sh); a whole match measured 1035 s of game time
                                      # (two halves + a 10-round shoot-out) = 2.9 h at x10 + the reviews: TIGHT (report §3)
[[tasks]]
id = "soccer_ssl-duel-wallclock-program-standard"
format = "duel"
action_level = "high"
agent_timeout_s = 14400
[[tasks]]
id = "soccer_ssl-team-wallclock-program-standard"
format = "team"
action_level = "high"
agent_timeout_s = 14400

[broadcast]                           # spectators: the broadcast log every 5 control steps, the replay video's camera
every = 5
camera = { name = "broadcast", pos = [0.0, -7.0, 6.5], lookat = [0.0, 0.0, 0.0], fovy_deg = 50, width = 640, height = 360 }

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none (proposal §6.1; step ④: A1 up, A2 down)
a1 = 2                                # overhead images: colour patterns, ids, headings, a chipped ball's height;
                                      # primary since step 4: ball-position noise costs 1.3-5 goals (1 cm) and 6-12 goals (5 cm) a match
a2 = 1                                # sliding and rolling ball, chip bounces, rebounds off robots and walls;
                                      # secondary since step 4: both A2 ablations within the noise at L2 and L3 (decided 10-12)
a3 = 0                                # the platform executes the skills
a4 = 2                                # 6.5 m/s ball, 40 ms vision latency, real time
b1 = 1                                # 1 m dribbling, 6.5 m/s, defense areas, chip goals invalid, crashing, stop rules
b2 = 2                                # when to pass, shoot, chip, fall back; reading the opponent's defence
b3 = 2                                # passing, running off the ball, defensive roles for five robots
physics = ["friction_rolling", "spin_bounce", "collision", "inertia_latency"]
