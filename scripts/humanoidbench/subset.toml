paper_category = "manip"
capability_class = "C9 · long-horizon multi-subtask"
status = "verified"
expert_hours = 5.0
completion_rate = "41%"
evidence = "paper 763, FastTD3 822, bar 2000"
oracle_evidence = "none known: no run has passed it, and published RL reaches 41% of the bar (paper 763, FastTD3 822, bar 2000)"
one_liner = "puts five objects onto their assigned bookshelf slots with the Unitree H1"
task_statement = '''put each of the five objects onto its assigned place on the bookshelf, one at a time,
in order.'''
scene_note = '''the objects, their assigned destinations and the robot's initial pose never change between
resets. The five objects in play are tinted red, palest first and darkest last (the other seven are grey),
and each one's destination is shown from the start as a translucent copy of it in the same colour.'''
scoring_note = '''Only the object you are currently on is scored: each step pays for standing steadily,
for a hand being near that object and for its progress towards its assigned slot. Placing it pays a
one-off bonus that grows with how many you have placed — together the bonuses are most of the bar — and
moves the scoring on to the next one. So the return is cut into five plateaus and stalling on the first
caps the episode low.'''
ends_note = '''The episode ends early if the pelvis drops too low or if the object currently being scored
goes below about half a metre, and it ends once all five are placed.'''
obs_layout = "qpos(160) + qvel(147) + the (negative) body index of the object currently being scored(1)"
task_notes = '''Which object is currently being scored, and which five of the candidate objects are in
play, are part of the task's internal state, frozen into this instance. Only the scoring code moves on to
the next object, so in this container the observation's last entry never changes and `done` only ever
checks the first object (placing all five does not end the episode here); the grader's replay moves on
as each object is placed.
'''
difficulty = '''- **Five subtasks, the longest chain in the subset** (`cabinet` has four, `kitchen` four). Each one is
  a pick-and-place at shelf height with a different target slot, so the state machine has five distinct
  strategies rather than a repeated one.
- **The widest scene state in the benchmark**: 84 DoF of objects (twelve candidates, five in play) on
  top of 61 actuators.
- **Dropping the active object ends the episode**, so the chain is fragile in a way `cabinet`'s hinges
  and drawers are not — there is nothing to catch a mistake.
- **`bookshelf_hard` is deliberately not in the subset.** It is the same class with `fixed = False`,
  which permutes the five destinations; its completion rate (36% vs 41%) and its give-away (2.7% vs
  2.6%) are both within noise of this one, so it would spend a slot on the same problem. The "hidden
  state" objection to it is gone — the permutation lives in `vars(task)` and `body_pos`, both frozen —
  so if a second instance of this class is ever wanted, `hard` is ready.
- **One instance only**: `env.py` forces `randomness = 0` for this family.'''

