schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/dextoolbench_eraser_handle_eraser_wipe_c-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): DexToolBench (SimToolReal) handle_eraser / wipe_c in MuJoCo: KUKA iiwa 14 + Sharpa HA4 hand; produce one replayable joint-target trajectory that carries the handle eraser through the 31 demonstrated goal poses in order. The agent only gets a client: camera RGB-D + proprioception and joint-target chunks; no reset, no object poses; the sim service records the episode and grades a fresh replay of it."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "dextoolbench", "simtoolreal", "mujoco", "dexterous", "tool-use", "iiwa", "sharpa", "code-as-policy", "trajectory", "standard-mode"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "mujoco"
robot = "kuka-iiwa14-sharpa-ha4"
family = "dextoolbench/eraser/handle_eraser/wipe_c"
instance_seed = 0                 # DexToolBench fixes the start pose and goals (from a human demo); no randomization
expert_time_estimate_hours = 4.0
mode = "standard"
protocol = "eai-standard/2.1"
oracle = "partial"
oracle_evidence = "SimToolReal's pretrained policy, replayed in this scene, reaches 12/31 goals (solution/; README of dextoolbench_eraser_handle_eraser_wipe_c-privileged)"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; for i in $(seq 1 400); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; [ $((i % 15)) -eq 1 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §4
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0
