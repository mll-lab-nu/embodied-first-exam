# ring_transfer —— docx 2.6「绳圈从柱 A 转移到柱 B」，TopoGym tabletop V1 task 系。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 场景：底板上两根工业走线柱（与 cable_routing / rope_winding 同一 prefab：柱身 +
# 喇叭底座 + 顶盖），一条闭合弹性环（FEM+IPC 周期管，topogym/world/closed_band.py）
# 平铺在桌面、套在出生柱上、长轴背离另一根柱。终态：环套在另一根柱上、不再围住出生柱。
# linking signature (A:1, B:0) -> (A:0, B:1)，中间两次越过柱顶：B 顶落套、A 顶提离。
#
# 变体（2026-09-04，variation_axes_plain_zh.md §6.2 第 10 步）：两根柱由 `pair`
# （中点、柱距、朝向）派生，`post_shape` 是两柱共用的尺寸，`ring.on_post` 是出生柱、
# `goal.on_post` 派生为另一根。环长轴、捏取侧 / 捏取点、三个搬运高度全部由 Layout 按柱
# 推导（`_ring_transfer_geometry.py` 顶部的常量），yaml 不再写这些数。2026-08-24
# 预留的「多柱出生形（enclosure 子集）」放弃：抽样叶子必须是标量。
#
# 单夹爪能不能把柱 B 套进环，取决于「拉伸梯形」（_ring_transfer_geometry.py 模块文档）：
# 环被拉紧后在 A 处收拢到 2(r_post + r_tube) = 0.028 宽，远端由**张开的两指钩住**
# 撑到 grasp.spread 宽；B 必须落在两股之间。单点捏住远端帽做不到 —— 捏住的环是
# 两股并行的双线，只在 A 处有绕数（离线门第一版实测绳股离 B 轴 12.5mm < 14mm）。
# 该不等式把柱半径、指张开量、柱距三者绑在一起，下面每个数都标了它在这条链里的位置。

task:
  id: ring_transfer
  difficulty: smoke

coordinate_frame: task

board:
  name: ring_transfer_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# 柱对。两柱中心 = 中点 ± 柱距/2 · (cos heading, sin heading)。下面 posts.A/B 的 x/y 是
# 由此派生的位置（随机化时 derive_task_cfg 写回；固定布局下两处必须一致，Layout 断言）。
#
# 2026-08-25 第二版（用户看过 demo 后：环再小、柱距再远、柱子更拟真、整体放大）。
# 默认 oracle 是 carry（搬运套索），它不拉伸、与柱距无关，所以下面的取值不再受
# transfer 拉伸梯形的约束；transfer 在这组几何下不可用（离线门只报告，不拦截）。
#
# 柱距 0.220（A -0.100、B +0.120）：远端帽在 A.x - 出生伸出量 0.104 = -0.204 >= -0.25+0.02；
#   推过 B 后的手位 0.180 <= 0.25 - 0.02。
pair:
  # 中点。随机化时由 mid_x_frac / mid_y_frac 在派生窗口里取：窗口 = mid_*_range 与「carry 全部
  # 手位 + 出生环都在 workspace 内（余量 0.020）」以及「手位到底座 <= reach.max_hand_dist」的交集
  # （x 在 y 定下后按可达圆解）。基准 (0.010, 0)：spacing 0.22 时推过 B 的手位 x = 0.200，可达 0.770。
  mid_x: 0.010
  mid_y: 0.000
  mid_x_range: [-0.020, 0.040]
  mid_y_range: [-0.030, 0.030]
  mid_x_frac: 0.5
  mid_y_frac: 0.5
  # 柱距（两柱中心距）。
  spacing: 0.220
  # A→B 相对 +x 的角（度）。环长轴 = (sin, -cos)：0° 时 [0, -1]，整环在两柱连线的 -y 一侧。
  heading_deg: 0.0

# 两柱共用的尺寸。
# 半径 0.016、高 0.100（挡头顶 0.108）：工业走线柱的比例。carry 要把整环抬到挡头顶以上：
#   指尖 = 0.108 + 0.004 + 0.008 + 悬挂深度 0.140（实测）= 0.260，手 0.363 <= 工作区 0.40。
# 挡头 head_overhang 0.010（head_radius = radius + 0.010 = 0.026）/ head_height 0.008：**碰撞体**
#   （外伸 0.010 >= 管径 0.008）。2026-08-24 实测无挡头时环被拔滑越顶；gateway = 挡头顶。
# 底座 base_radius 0.030 / base_height 0.016：本任务不复用 prefab 的 0.016/0.010——
#   柱更粗，底座按比例放大，视觉上像螺栓固定的走线柱脚。
# 底座与柱身刻意互嵌（同 cable_routing 走线柱），因此 rope.fem.sanity_check_enable=false。
post_shape:
  radius: 0.016
  height: 0.100
  head_overhang: 0.010
  head_height: 0.008
  base_radius: 0.030
  base_height: 0.016
  post_radial_segments: 32

# 两根柱：位置（由 pair 派生）与颜色。深灰金属色柱身、黑色挡头与底座——去掉第一版的橙/蓝。
posts:
  A:
    x: -0.100
    y: 0.000
    color: [0.42, 0.43, 0.45]
    trim_color: [0.10, 0.10, 0.11]
  B:
    x: 0.120
    y: 0.000
    color: [0.42, 0.43, 0.45]
    trim_color: [0.10, 0.10, 0.11]

# 闭合弹性环。出生高度不配置：管心 = rope.radius + contact_d_hat + 1mm，即管皮在势垒外 1mm，
# 沉降时自己落到桌面。直接出生在 rope.radius（管皮贴桌）会落在势垒内，第一步被顶起约 d_hat
# （2026-08-24 观察到的开局「向上跳一下」）。
ring:
  # 周长 0.46（0.53 → 0.40 → 0.36 → 0.46；2026-08-25 为避免机械臂穿模加长）：
  #   - 出生跑道形从出生柱心沿长轴伸出 (0.46 - 2 pi 0.050)/2 + 0.050 = 0.123，直段长 0.073，
  #     捏取点要落在直段上且离柱足够远（Layout 的 pinch_along 规则）；
  #   - 悬挂深度：周长 0.36 时实测 0.136，按 (周长 - 0.04) 比例外推 0.19（carry.hang_depth，
  #     实测后改）；抬离指尖 0.093 + 0.004 + 0.008 + 0.19 = 0.295，手 0.398 <= 工作区 0.40；
  #   - 围住 B 后松环伸出 0.123，落向长轴一侧（放下位在 B 远侧，环从那里垂落），不碰 A。
  # 周长变了要重测 hang_depth，所以不作变体轴。
  perimeter: 0.46
  # 半环宽 0.050（环宽 0.100，接近圆）：transfer 的钩持要帽比 0.070 宽；carry 的捏取点在直段上，
  #   离柱心 0.050、离挡头边 0.024，合拢手指半宽 0.012 → 余量 12mm（checks 行 palm_clears_heads_at_grasp）。
  #   下限另有 loop_radius >= r_post + r_tube + d_hat（柱半径 0.022 时 0.028；checks 行 loop_clears_post）。
  loop_radius: 0.050
  # 环出生时套在哪根柱上（防捷径指令轴：两柱外观相同，策略必须读指令）。长轴方向不配置：
  # Layout 取垂直于柱对、朝 -y 一侧（heading 0° 时 [0, -1]），整环都在两柱连线之外，捏取点、
  # 手掌、悬挂的环都不在两柱之间（2026-08-25 用户原则：夹爪与机械臂不得穿模、不在两柱间抓）。
  on_post: A
  color: [0.12, 0.12, 0.13]

# 目标：环搬到哪根柱。随机化时 derive_task_cfg 把 on_post 写成 ring.on_post 的另一根；固定布局下
# 两处要成对（Layout 断言）。跨越序列由 layout.crossings() 推出。instruction 是模板，{start} / {goal}
# 由 Layout.instruction() 填柱名——派生只写标量叶子：带空格的句子进不了角点 sweep 的 Hydra 覆盖
# （09-05 首跑四个 B 出发的角点全在 `Error parsing override 'the'` 上退出）。
goal:
  on_post: B
  instruction: "Move the elastic loop from post {start} onto post {goal}."

rope:
  model: fem_ipc_tube
  # prefabs.rope_pbd.radius 的字面量副本（checks() 读；角点门裸加载本文件时 ${prefabs} 解析不了）。
  # builder 断言与 prefab 相等。
  radius: 0.004
  fem:
    E: ${prefabs.rope_fem.E}
    nu: ${prefabs.rope_fem.nu}
    rho: ${prefabs.rope_fem.rho}
    friction_mu: ${prefabs.rope_fem.friction_mu}
    # prefabs.rope_fem.contact_d_hat 的字面量副本（同 rope.radius）。
    contact_d_hat: 0.002
    follow_strength: ${prefabs.rope_fem.follow_strength}
    # 闭合环上 straight 不可用：rest_shape_straight 沿开放折线量弧长，接缝两侧顶点
    # 落到直杆两端、四面体翻转，整条声明被丢弃后静默退回 spawn（closed_band_spike 实测）。
    rest_shape: spawn
    # 柱身与喇叭底座刻意互嵌（静态体，无自由度），豁免 libuipc 零相交初始态检查。
    sanity_check_enable: false
    newton_max_iterations: ${prefabs.rope_fem.newton_max_iterations}
    newton_tolerance: ${prefabs.rope_fem.newton_tolerance}
  mesh:
    # 段长 0.005、径向 8 段：closed_band_spike 的推导 ——
    #   (a) 纵向 sagitta p^2/8R 不得超过横向 r(1-cos(pi/n))：最紧弯 R=0.040 时
    #       p=5mm 给 0.078mm < 0.304mm；
    #   (b) 自接触间隙 self_contact_clearance(4mm, 8, 5mm) = 3.06mm > d_hat 2mm。
    segment_length: 0.005
    radial_segments: 8
    maxvolume: ${prefabs.rope_pbd.maxvolume}
    output_dir: .cache/topogym/meshes/ring_transfer

# 抓取。三条 follow band 在建场景时按出生位置声明：
#   hook_left / hook_right = 远端帽两肩（transfer 拉伸段：两指伸进环内张开，各钩一带）；
#   near = 出生柱一侧的帽顶点（carry 捏取点；也是 transfer 提离段的捏取点）。
# 捏取流程（2026-08-25 用户定）：张开的两指跨到绳两侧 → 合拢到 grasp_qpos 夹住 → attach_error
# 校验 → **此时才** engage assist → 抬升搬运。夹持证据是 finger_qpos 停在 grasp_qpos。
grasp:
  # 每条 follow band 的选取半径。
  band_radius: 0.012
  # 捏取时每指的合拢目标 = 绳半径 + contact_d_hat：指垫停在势垒作用距离上，绳被两侧势垒夹住。
  # 取 0.004 时实测 finger_qpos 走到 -0.002——两指越过绳心，势垒没来得及起作用，绳被压穿。
  grasp_qpos: 0.006
  # carry 段是否再叠加 assist（follow band 把捏住的绳段钉在指尖）。2026-08-25 实测叠加时
  # 指垫与被钉住的刚性绳段互相顶，手指穿过绳（finger_qpos -0.0026），IPC 把穿透力经两向耦合
  # 反推到臂上，臂被拖偏 130mm。false = 纯靠指垫摩擦夹持（环重 0.1 N，摩擦 ≈0.42）；
  # near band 仍声明，只用来读「绳有没有从指间滑走」。
  #
  # 2026-08-26 定为 B 路线（用户）：assist 负责「握住」，视觉上指垫必须合在绳两侧。手指进 IPC
  # 时刚体手指会越过 IPC 副本走到 -0.002 穿绳（有/无 assist 两次实测一样），所以臂回到 IPC 之外
  # （physical.robot_rope_contact=off），合拢停在指令值 grasp_qpos（指垫离绳面 1mm），合拢后
  # 再焊 assist，lift_check 验证绳跟手走。
  assist: true
  # 捏取时指尖相对绳中心线的高度。inspect_clear3 实测：指尖点下探到离桌 9.4mm 时指垫已经贴桌
  # （指垫底面比指尖点低约 7mm），再往下不去。取 +0.006：指尖 11mm，指垫底离桌约 4mm，仍盖住
  # 绳截面 4~10mm，且不压在桌上（贴桌时合拢是拖着桌面滑，每 10 步只走 0.4mm）。
  pinch_lift: 0.006
  # 钩住时两指的张开量 = 远端被撑开的宽度，进拉伸梯形。Franka 最大 0.080；
  # 取 0.070 留指垫厚度，且必须 < 环宽 0.080。
  spread: 0.070
  # engage 前手心与 band 质心的允许偏差；超差拒绝焊接（rope-free-end-clearance-rule 第二条）。
  attach_tolerance: 0.020
  # 夹爪级净空：任一抓取点到任一柱面的最小距离（指半展 0.040 + 余量）。
  post_clearance: 0.050
  # ---- 捏取按实测收敛 + 抓取证据门（2026-08-25 inspect_clear2：descend 结束指尖离桌 19mm、
  # 绳顶 10mm，指垫在绳上方合拢，finger_qpos 正好停在指令值 0.006，环没离开桌面；位置门
  # attach_error 4.6mm 照样放行）。
  # hover / descend 结束后用实测残差修正指令，直到手位与目标差 < settle_tol（IK 会停早，
  # franka.py 有记录）；封顶 settle_max_steps。
  # hover 的 IK 残差实测停在 2.4mm，再等 150 步也不动；容差 0.003、封顶 40 步。
  settle_tol: 0.003
  settle_max_steps: 40
  # 合拢逐步走，连续 10 步 finger_qpos 变化 < 0.05mm 视为静止；封顶 close_max_steps。
  # （inspect_clear2：set_gripper 80 步走完手指仍在 0.036，之后才慢慢关——先把过程打印出来。）
  # inspect_clear4：无阻力时也要 300+ 步才收到 0.006（指关节 PD 响应慢），封顶 400。
  close_max_steps: 400
  # 合拢后先抬 lift_check，near band 中心必须跟着升 >= lift_check_min_rise，否则判「没夹住」退出。
  lift_check: 0.010
  lift_check_min_rise: 0.006

# transfer（借 A 撑开梯形）的段参数。**第二版几何（柱距 0.22）下 transfer 不可用**：
# 越过 B 顶的平移段拉伸比 1.96（上限 1.2），离线门只报告不拦截。保留这一块是为近柱距
# 变体与对照 motion；主 oracle 见下面的 carry。
transfer:
  # 段 1a 绕 A 平转：远端帽在此高度沿半径 = 出生伸出量的圆弧绕 A 转，从长轴方向
  # 经 +y 转到 swing_end_deg。0.030 略离桌面，减少拖行摩擦但仍低于柱顶。
  swing_z: 0.030
  # 平转终止角（相对 A->B 方向，度）。B 到环轴线的横向偏移 = 柱距 x sin(角)，
  # 必须 > loop_radius + r_post + r_tube = 0.066：0.140 x sin55 = 0.115，余量 49mm。
  # 精确条件由离线门按绳股线段到 B 轴的距离检查（平转、抬升、平移、下放四段全程采样）。
  swing_end_deg: 55.0
  swing_waypoints: 8
  # 段 1b 抬升到 carry_z 后平移到落点上方：绳股从 A 切点直线到夹持点，经过 B 上方时
  # 底面须高于 B 顶 + r_tube + carry_margin。落点处的下限 carry_height_floor
  #   0.004 + (0.085 + 0.004 + 0.010 - 0.004) / (0.140 / 0.176) = 0.123，
  # 但平移途中夹持点离 A 更远、B 在拉线上的比例更小，同样的越顶高度要更高；
  # 离线门逐样本量绳股到 B 轴距离，取值以它通过为准。
  carry_z: 0.200
  carry_margin: 0.010
  # 落点：B 远侧，x = B.x + r_post + r_tube + landing_clearance。
  landing_clearance: 0.020
  # 段 2 提离：near band 抬到 A 挡头顶 + r_tube + lift_margin，再向 B 方向平移 shift 后释放。
  # shift 要让帽从 A 外侧（A.x - r_post - r_tube = -0.076）滑过挡头另一侧
  # （A.x + head_radius + r_tube = -0.034），即 >= 0.042；取 0.060 留余量。
  lift_margin: 0.020
  shift: 0.060
  # 驱动速度（米/步），沿用 rope_winding 的 travel_speed。
  # 2026-08-26 从 0.002 提到 0.003（band 跟随实测手位，臂滞后不影响握持）。
  drive_speed: 0.0030
  min_segment_steps: 20
  # 释放后静置步数：环回缩与落座。
  release_settle_steps: 80

# 主 oracle「搬运套索」（run.motion=carry / spike run.test=carry），2026-08-25 按用户提议加入：
# 捏住 A 与 B 之间那半个帽的顶点（near band）→ 抬起，环从挡头上方脱离 A、悬挂在夹爪下
# （夹钳夹直约 20mm 绳段，绳水平离开夹钳后才弯垂，弯垂特征长度 (EI/w)^(1/3) ≈ 0.04，
# 所以悬挂环顶部被撑开约 0.08，底部 U 同宽）→ 到 B 近侧 → 沿 A->B 方向推过 B：
# U 底撞上柱身后两股分到柱子两侧（套马索）→ 放低、松手。不借 A 撑开、不拉伸，柱距无关。
# 底部 U 宽是推导值，spike 的 u_width 读数实测；不够 2(r_post + 2 r_tube + d_hat) = 0.052
# 则回退到内撑抓取（transfer on-phase 的 hook 机制）。
carry:
  # 夹钳夹直的绳段长度（指垫宽度量级）。悬挂深度的保守估计 = (周长 - 2 x clamp_width)/2。
  clamp_width: 0.020
  # spike 实测的悬挂深度（指尖到环最低点）。null = 用上面的保守估计。
  # 2026-08-25 周长 0.46 带臂实测：lift 149.4 / travel 155.4 / approach 140.0 mm（夹钳撑开
  # 得比外推宽，u_width 106~130 mm，所以比按比例外推的 0.19 浅）。取推向 B 时（approach）的
  # 读数 0.140；外推值 0.19 让环底高出 35~50 mm、从 B 挡头上方划过（top_crossed B、B 最小
  # 间隙 12.3 mm 从未碰到柱身）。抬离高度按它算偏保守无妨，推的高度必须按它算。
  hang_depth: 0.140
  # 悬挂环底部 U 的半宽（离线门用它查悬着的绳股是否碰 A 挡头）。推导 0.04，带臂实测
  # u_width 106~130 mm → 半宽取 0.065。
  hang_half_width: 0.065
  # 捏取点不配置（Layout 推导）：捏远离目标柱的那条直段（pinch_side），沿长轴离柱心
  # head_radius + hand_half_thickness + PINCH_HEAD_GAP 0.014（基准 0.026 + 0.030 + 0.014 = 0.070，
  # 手掌盒体离挡头边 14mm），封顶直段长 0.073（再远就上了远端帽）。
  # 抬离 A 时环底部 U 高出 A 挡头顶的余量。环与 A 是链环关系，只能从挡头顶上方脱离——
  # 2026-08-25 实测只抬钩点到 0.235（底部 0.04）时环仍挂在 A 柱身上。
  # 指尖高度 = 0.108 + r_tube 0.004 + 0.008 + hang_depth 0.140 = 0.260，手 0.363 <= 工作区 0.40。
  clear_margin: 0.008
  # 推向 B 时环底部 U 离桌面的高度不配置（Layout 推导）：base_height + HANG_BOTTOM_ABOVE_BASE 0.024
  # = 0.040。悬挂深度实测在 140~155 mm 之间浮动，U 底要留出 ±15 mm 仍打在柱身上：0.040 离底座
  # 锥顶 0.016 有 24 mm、离挡头下沿 0.100 有 60 mm（checks 行 hang_bottom_on_shaft，柱高 0.085 时 45 mm）。
  # 抬离 A 的方式（2026-08-25 inspect_lift 实测后定）：从捏取点**侧向**竖直抬起会把环勒在 A
  # 柱身上、A 远侧的绳段沿柱身爬到挡头下沿（near_A_max_z 106mm，挡头 100~108）并卡住，环被
  # 拉长 56%、臂被拖偏 142mm。环与 A 是链环关系，只能从 A **正上方**竖直提起：先抬一点
  # （lift_low_z，环其余部分留在桌上、无张力），水平移到 A 轴上方并朝远离捏取点那侧多走
  # unhook_past，再竖直抬到 clear 高度，底部 U（实测 106~130mm 宽）从挡头（直径 52mm）上方
  # 越过。
  # lift_low_z 不配置（Layout 推导）：挡头顶 + LIFT_LOW_ABOVE_HEAD 0.012 = 0.120，手指从 A 挡头顶
  # （0.108）上方经过（手掌底 0.197）；悬挂深度 0.140 > 0.120，环底部仍在桌上，抬这么高也不产生
  # 张力（checks 行 lift_low_below_hang；柱高 0.115 时 0.135，余量 5 mm，是柱高轴的上界来源）。
  unhook_past: 0.020
  # 反应式抬离（用户 2026-08-25 提议）：lift_low 之后每步读环的拉伸比与最低点——
  #   拉伸比 > stretch_max → 朝 A 轴心方向水平走 step_xy（最多走到 A + unhook_past）；
  #   否则                → 竖直上升 step_z；
  #   环最低点 > 挡头顶 + clear_margin → 抬离完成（lift verdict）。
  # 步数封顶 max_steps；false = 走 over_anchor / clear 固定 waypoint。
  reactive_lift: true
  reactive:
    stretch_max: 1.02
    step_xy: 0.003
    step_z: 0.003
    max_steps: 400
    # 中止条件（2026-08-25 inspect_clear2：空手时拉伸比恒 1.000，逻辑一路判「松弛→再升」，
    # 爬了 1.2m 到臂长以外，arm_err 709mm）。绳相对指尖滑走 > slip_abort、臂落后 > arm_err_abort、
    # 指尖高于 max_z（工作区上限）任一成立即报 ABORT 退出（exit 3）。
    slip_abort: 0.030
    arm_err_abort: 0.050
    max_z: 0.40
  # 推之前停在 B 近侧柱面前多远，再沿 A->B 方向直推。
  approach_before: 0.050
  # 推过 B 轴多远再放低。要让 U 已经绕到柱子两侧、手在远侧；同时手掌盒体（沿 x 半长 0.10）
  # 放低时不能罩到 B 挡头 —— 放下位的手掌底面 0.040 + 0.077 = 0.117 > 挡头顶 0.108，
  # checks 行 palm_clears_heads_at_drop。
  push_past: 0.080
  # 放低到的指尖高度不配置（Layout 推导）：max(hang_bottom_z, 挡头顶 + DROP_PALM_MARGIN 0.009 −
  # palm_bottom_above_tip 0.077)，基准 max(0.040, 0.040) = 0.040；柱高 0.115 时 0.056，手掌底面仍高出
  # 挡头顶 9 mm。0.020 时手掌底面 0.097 只比挡头顶高 4mm（2026-08-25 实测）。

# 机械臂执行参数（demo 用；spike 不带臂，不读这一块）。
physical:
  # 绳能不能看见夹爪（2026-08-25 用户要求真实接触、不穿模）：
  #   off     = 臂在 IPC 之外，绳直接穿过指垫，抓取只靠 assist；
  #   fingers = finger_links 里的 link 进 IPC（ABD，每步钉到 IK 位姿），指垫真的夹住绳、
  #             手掌穿不过绳；其余臂体仍归刚体求解器。机制同 cable_routing。
  # 2026-08-26 改回 off（B 路线）：fingers 模式下刚体手指越过 IPC 副本穿绳（finger_qpos -0.002），
  # 「夹住」的视觉靠合拢停在 grasp_qpos 实现，握持靠 assist。fingers 的参数保留供对照。
  robot_rope_contact: "off"
  # 只放两根手指，手掌留在 IPC 之外（rope_winding 验证过的组合）；手掌不穿模由离线门的
  # hand_clearance 几何检查保证。2026-08-25 三个 link 都进 IPC 时臂在绳松弛状态下就落后
  # 20mm、之后被拖偏 130mm。
  finger_links: [left_finger, right_finger]
  # 绳↔指垫的 IPC 摩擦。实际接触摩擦 = sqrt(rope.fem.friction_mu x 此值) = sqrt(0.3 x 0.6) ≈ 0.42。
  # rope_winding 取 0.004 是为了让绳蹭过指垫；这里是捏取，要握得住。assist 仍在（同一运动
  # 不冲突），接触负责不穿模与视觉。
  robot_rope_friction: 0.6
  # Franka hand 坐标系原点到指尖的距离；follow band 的目标 = 指令手位 - hand_above
  # （与 untangle_continuous_fem_demo 同值同做法）。
  hand_above: 0.103
  # 手指在垂直于开合方向上的半宽（指体约 20mm 宽）。
  finger_half_width: 0.012
  # 手掌盒体：沿开合方向的半长、垂直开合方向的半厚、底面高于指尖的量（rope_winding 的
  # 竖向足迹实测：指垫 0.045 | 手指顶 0.089 | 手掌体底面 0.122 → 77mm）。
  # 离线门 hand_clearance 用它检查抓取位与放下位的手掌是否罩到任一挡头
  # （2026-08-25 用户原则：夹爪与机械臂不得穿模）。
  hand_half_length: 0.100
  hand_half_thickness: 0.030
  palm_bottom_above_tip: 0.077
  # 接近/退开高度（task z）：指尖高于挡头顶 0.108 即可，再留 8cm 给悬着的环。
  approach_z: 0.200
  # 开合夹爪的步数。30 步只够手指从 0.040 走到 0.036（2026-08-25 实测），捏取动作还没完成
  # attach 就生效了；其它任务用 60，这里给 80 让合拢到 grasp_qpos 完整可见。
  gripper_steps: 80
  # 手到位后再静置几步，让 IK 收敛到位再做 attach_error 校验。
  touch_settle_steps: 20
  # 开局静置步数（spike 实测 50 步收敛）。home 姿态夹爪已是张开的，不再额外开合。
  settle_steps: 50
  # 抓着绳时每隔多少步打一行 probe（臂位误差、band 误差、A 接触、环最低点、绕数）。
  probe_every: 25

success:
  # 中心线读回的材料分桶数（= 出生环数 = 周长/段长，spike 同式）。
  centerline_bins: 72
  # 绕数取整容差：|w - round(w)| 超过即报投影退化。
  winding_tolerance: 0.1
  # 任一柱的最小表面间隙（米），负值 = 穿模。
  min_surface_gap: 0.0
  # 释放后静置期间中心线最大位移（米/步）低于该值视为落定。
  settle_tol: 0.0001
  # 只记录不判定
  max_stretch_ratio: null

# 底座位置同 rope_unwinding / gate / unlink_c_ring / bar 的 reach 段。基准布局推过 B 的手位离底座
# 0.770（08-26 带臂跑通），0.780 沿用 rope_unwinding 的假设，待 GPU 角点实测；它是 pair.mid_x
# 派生窗口的主要边界（柱距 0.22 朝向 0° 时上限 0.019，柱距 0.28 时 −0.011）。
reach:
  base_xy: [-0.570, 0.0]
  max_hand_dist: 0.780

# manipulation_space.workspace 的字面量副本（checks() 的 carry_in_workspace / spawn_in_workspace 行读；
# 角点门裸加载本文件时读不到 common 配置）。builder 断言与 common 相等。
workspace:
  x: [-0.25, 0.25]
  y: [-0.30, 0.30]
  z: [0.03, 0.40]

# ---------------------------------------------------------------- 变体
# 逐 episode 随机的轴（generation/layout_randomization.py 读这一段）。
# 角点门：7 条连续轴 × 2 根出生柱 → 256 个角点（tests/check_variant_corners.py）。
# 离线探针（2026-09-04，scratch）：256 角点全部可行，最紧的行是 lift_low_below_hang（柱高 0.115：
# 5 mm）、carry_in_workspace（柱高 0.115 的 clear 手位 0.378：余量 2 mm）、palm_clears_heads_at_grasp
# （柱半径 0.022 + 挡头外伸 0.014：5.6 mm）；hand_reach 与 pinch_on_straight 在窗口边界上恰好为 0。
variation:
  # 防捷径指令轴：环出生在哪根柱。goal.on_post 与 instruction 派生。
  - {kind: choice, path: ring.on_post, values: [A, B]}
  # 单调裕度轴（难度候选）：柱高。上界由 lift_low_below_hang 定（挡头顶 + 0.012 < hang_depth 0.140）。
  - {kind: uniform, path: post_shape.height, lo: 0.085, hi: 0.115}
  # 布局：柱身半径。上界：U 底撑开量 2(r + 2 r_tube + d_hat) = 0.064 <= 实测 U 宽 0.130（u_width_fits_target）。
  - {kind: uniform, path: post_shape.radius, lo: 0.013, hi: 0.022}
  # 布局：挡头比柱身大多少。下界 = 管径 0.008（head_overhang 行）；上界受捏取点与挡头净空限制
  # （pinch_along 封顶直段长后 palm_clears_heads_at_grasp 收到 5.6 mm）。
  - {kind: uniform, path: post_shape.head_overhang, lo: 0.008, hi: 0.014}
  # 布局：柱距。下界：悬挂股避开 A 挡头、手掌与两挡头净空；上界：工作区与可达（mid 窗口收窄到 3 cm）。
  - {kind: uniform, path: pair.spacing, lo: 0.180, hi: 0.280}
  # 布局：柱对朝向（A→B 相对 +x），环长轴随之转。
  - {kind: uniform, path: pair.heading_deg, lo: -30.0, hi: 30.0}
  # 归一化：柱对中点。窗口随柱距 / 朝向 / 可达变，抽 [0,1] 再派生，构造式满足、不靠拒绝。
  - {kind: uniform, path: pair.mid_x_frac, lo: 0.0, hi: 1.0}
  - {kind: uniform, path: pair.mid_y_frac, lo: 0.0, hi: 1.0}
  # 派生：goal.on_post / instruction → mid_y（窗口）→ mid_x（窗口，含可达圆）→ posts.A/B.x,y。
  - {kind: derived, fn: "topogym.tasks.routing.ring_transfer:derive_task_cfg"}
  # 校验：RingTransferLayout.checks() 十五行（环净空、出生环避开目标柱、挡头外伸、捏取点在直段上、
  #       手掌在抓取 / 越柱 / 放下位避开挡头、指尖高于挡头、lift_low 低于悬挂深度、U 底在柱身上、
  #       U 宽够套柱、悬挂股避开 A 挡头、手位与出生环在工作区内、可达）。
  - {kind: validate, fn: "topogym.tasks.routing.ring_transfer:validate_task_cfg"}
