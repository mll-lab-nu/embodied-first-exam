privileged = """
At one control step, the thermal cycler's lid hinge is within 0.01 rad of -1.9 rad (closed) and the lid's lever joint is
within 0.01 rad of -0.94 rad (locked); both joints start at 0. The first such step ends the replay as a success.
"""
success = """
At the last control step, the thermal cycler's lid hinge is within 0.01 rad of -1.9 rad (closed) and the lid's lever
joint is within 0.01 rad of -0.94 rad (locked); both joints start at 0.
"""

# mani_thermal_cycler.py check L239-248, case thermal_cycler_open: |lid| < 0.003 and |lever| < 0.003.
[families.thermal_cycler_open]
privileged = """
At one control step, the thermal cycler's lid hinge and the lid's lever joint are both within 0.003 rad of 0 (open and
unlocked); they start at -1.9 rad and -0.94 rad. The first such step ends the replay as a success.
"""
success = """
At the last control step, the thermal cycler's lid hinge and the lid's lever joint are both within 0.003 rad of 0
(open and unlocked); they start at -1.9 rad and -0.94 rad.
"""

# mani_pipette.py check L225-239: latch 1 (below_liquid): tip within 0.0065 m horizontally of the tube body origin,
# tip more than 0.005 m below the liquid surface, thumb command (ctrl) > 0.70; latch 2 (liquid_drawn, only after 1):
# tip below the surface and thumb command < 0.45; success: latch 2 and tip more than 0.05 m above the surface. The
# latches are kept across steps (reset in reset(), L208-209).
[families.pipette]
privileged = """
Three steps, in this order; the first two are latched once they happen:
1. Dip: the pipette's tip is within 6.5 mm horizontally of the tube's axis (its body origin), more than 5 mm below the
   liquid's surface, and the plunger thumb's command (the position target, not the joint's position) is above 0.70 rad.
2. Release: the tip is below the liquid's surface and the thumb's command is below 0.45 rad.
3. Lift: the tip is more than 0.05 m higher than the liquid's surface.
The first control step at which step 3 holds after steps 1 and 2 ends the replay as a success.
"""
success = """
Three steps, in this order; the first two count once they have happened:
1. Dip: the pipette's tip is within 6.5 mm horizontally of the tube's axis (its body origin), more than 5 mm below the
   liquid's surface, and the plunger thumb's command (the position target, not the joint's position) is above 0.70 rad.
2. Release: the tip is below the liquid's surface and the thumb's command is below 0.45 rad.
3. Lift: at the last control step, the tip is more than 0.05 m higher than the liquid's surface.
"""

