schema_version = "1.3"
artifacts = [
  { source = "/out/final.json", service = "sim" },
  { source = "/out/episode.jsonl", service = "sim" },
  { source = "/out/trajectory.npz", service = "sim" },
  { source = "/out/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/out/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/out/replay.mp4", service = "sim" },
  { source = "/out/replay.last.png", service = "sim" },
  { source = "/out/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/out/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/out/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/behavior-picking-up-trash-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): BEHAVIOR-1K v3.9.2 picking_up_trash on the same frozen instance as the privileged task (2026 challenge public_test instance 301). Put the three cans of soda from the living room inside the trash can in the kitchen. The agent only gets a client: get_obs (RGB-D + proprioception), submit (joint_position or ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory, resumes it after a crash, and the episode is graded on two fresh replays."
authors = [{ name = "qineng" }]
keywords = ["robotics", "behavior", "omnigibson", "isaac-sim", "r1pro", "mobile-manipulation", "standard-mode", "trajectory", "picking_up_trash"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "behavior"
robot = "r1pro"
family = "picking_up_trash"
mode = "standard"                  # robot as a service: RGB-D + proprioception, no object poses, no success predicate, no reset
protocol = "eai-standard/2.2"
oracle = "partial"
oracle_evidence = "solution/ streams the privileged oracle's joint targets (oracle_qpos.npy, 5115 rows) through the client. Recorded Harbor oracle runs: 3 of 3 scored 1 on ws3 (job v22-ws3-oracle-picking-up-trash-1741, best behavior-picking-up-trash-i00-li__eg8GdNj) on the dev/qineng 9eb18edf version of this task (rcb-limited/2.2, no crash recovery); 2026-09-25 behavior-picking-up-trash-i00-li__fyYUXt4 (laptop, an older version) scored 1 with live_matches_replay 1. The sim service, collect hook, grader and oracle client changed since (crash recovery); not re-run on this version (static validation only)."
instance_seed = 301
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode (waits through a resume), replay twice in fresh processes, write final.json
timeout_sec = 37800               # 10.5 h = the episode end (up to 2 h through a resume) + two replays as long as the privileged
                                  # grader allows (4 h each) + 30 min; measured on an 8-vCPU L40S: 626 s Isaac start, < 3.5 steps/s

[agent]
timeout_sec = 14400.0             # BEHAVIOR budget (Isaac Sim + scene load, ~10 steps/s), same as the privileged twin (docs/benchmarks/behavior.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576
