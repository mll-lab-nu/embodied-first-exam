# Realtime mode (eai-standard/2.3): the simulator runs in the `sim` sidecar (the agent cannot open it) on a clock
# that does not stop once the episode has started; the agent only reaches port 8000.
# No `expose`/`ports` on sim. CPU only: MuJoCo physics and OSMesa rendering; no GPU reservation.
# Crash recovery (docs/protocol/standard_mode.md): compose restarts a crashed service (same container, same /data) and the
# service replays its journal (and the notes it names) into the same episode, never a reset.
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 6   # rcb-monitor
    mem_limit: 7168m   # rcb-monitor
    pids_limit: 1024   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /tmp
    command: python /srv/rcb_ese_rt.py                  # server.py's adapter under rcb_realtime.py's clock
    restart: on-failure:6                               # a crash resumes the same episode, never a reset (rcb_service.py)
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_DATA: /data
      LP_NUM_THREADS: "1"
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "300"                      # the scene builds in a few seconds
      RCB_RESET_BUDGET: "0"                             # Embodied Safety Exam grades one episode: no reset
      # Knob: ${NAME:-default} takes NAME from the shell that runs harbor; results under another setting are reported apart.
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-1}"                # 1: real time (official); S: one step every S x control_dt s
      PYTHONPATH: /srv
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
