# Limited mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# GPU on sim: MuJoCo physics is CPU either way, but every image the agent asks for is rendered here, and EGL on the
# GPU takes ~0.5 ms a frame against ~130 ms for CPU osmesa. `graphics` is the capability that mounts the EGL ICD.
services:
  main:
    depends_on: [sim]
  sim:
    image: ghcr.io/jameskrw/rcb-humanoidbench:0.1.6
    volumes:
      - ./sim:/srv:ro
    command: python /srv/server.py
    environment:
      RCB_TASK: cube
      RCB_INSTANCE: /srv/instance.npz
      RCB_TASK_TEXT: "A cube starts just above and in front of each palm. Rotate both cubes, without dropping them, to the goal orientation: that of the translucent cube with the same faces floating above and between the hands."
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor, so one run can set them on the command
      # line (`RCB_RESET_BUDGET=3 harbor run ...`) without editing this file. The sim logs what it got (/spec).
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-0}"        # 0: one episode, as on a real robot; N: N resets
      RCB_OBS_PROPRIO: "${RCB_OBS_PROPRIO:-1}"          # 1: head-camera RGB + joint angles/velocities; 0: images only
      RCB_OBS_IMU: "${RCB_OBS_IMU:-0}"                  # 1: + pelvis IMU (angular velocity, gravity direction)
      RCB_OBS_ROOM_CAMERA: "${RCB_OBS_ROOM_CAMERA:-0}"  # 1: + room_camera, fixed in the room
      RCB_OBS_DEPTH: "${RCB_OBS_DEPTH:-0}"              # 1: + depth (m) from both head cameras, as from the H1's head RGB-D camera
      RCB_ROOM_CAMERA_POSE: "0.47,0,1.25,0.9,-129,-25"  # room_camera close on the hands: both cubes and the
                                                        # floating goal orientation
      RCB_IMAGE_HW: "512"                              # every camera at 512×512, not upstream's 256: at 256 a
                                                       # cube in room_camera is 15-35 px across
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
