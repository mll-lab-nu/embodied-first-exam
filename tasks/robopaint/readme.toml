success = """
Graded on the main sheet's ink (pixels with ink coverage ≥ 0.5 on the sheet's 1024 × 1024 raster, 0.222 mm per
pixel) against the exemplar's ink. The sheet is first moved by the whole-pixel shift, at most {vars[register_mm]} mm along each
axis, that gives the largest overlap of its ink with the exemplar's (a best shift on the edge of that window counts as
no shift); every measure is taken at that shift. Success needs all of these:

- IoU of the inked areas ≥ {vars[iou]};
- boundary F-score ≥ {vars[boundary_f]}: the harmonic mean of the share of the sheet's ink-edge pixels within 1 mm of the
  exemplar's edge and the share of the exemplar's edge pixels within 1 mm of the sheet's;
- each of the exemplar's {vars[regions]} regions is at least {vars[min_stroke_coverage]} covered by ink;
- stray ink (ink more than 1 mm from the exemplar's ink) at most {vars[max_stray_frac]} of the exemplar's ink area;
- at most {vars[max_strokes]} inked contacts with the main sheet (a contact is one continuous stretch of the tip below the
  sheet's surface; it is inked when the brush was loaded at the touch-down);
- no colouring in: the task fails when `path_mm` > {vars[max_path_mm]} mm and also `mark_width_mm` < {vars[min_mark_width_mm]} mm.
  `path_mm` is the total length of the tip's path in all inked contacts with the main sheet (100 Hz physics samples);
  `mark_width_mm` is the area each contact inks on its own (coverage ≥ 0.5; where contacts overlap, each counts its
  own), summed over the contacts and divided by `path_mm`;
- at most {vars[max_strokes]} counted strokes: each inked contact is cut into marked pieces wherever the tip moves more
