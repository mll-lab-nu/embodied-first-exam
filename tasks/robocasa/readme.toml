# README data for tasks/robocasa/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   upstream  RoboCasa @ 756598a (robocasa/robocasa, the commit images/robocasa/Dockerfile checks out): the env's
#             `_check_success` and the helpers it calls, in robocasa/utils/object_utils.py (OU) and
#             robocasa/models/fixtures/*.py; robosuite 1.5.1 (pip pin in the same Dockerfile): MujocoEnv.step
#             (robosuite/environments/base.py L420-474) and check_contact (robosuite/utils/sim_utils.py L8-40).
#             Fixture states (microwave and coffee machine on/off) are updated once per control step, after its last
#             physics substep: Kitchen._post_action -> update_state -> every fixture's update_state
#             (robocasa/environments/kitchen/kitchen.py L1303-1320, L1343-1351). None of the 29 checks keeps a timer or
#             changes state itself, so the number of `_check_success` calls per step does not matter here.
#             The frozen instances' configs set ignore_done = True (no horizon end; robosuite base.py L495-497).
#   graders   embodied_first_exam/benchmarks/robocasa/privileged/tests/grade.py and .../privileged/environment/casa_tool.py
#             (Session.reset / step / replay); .../sim/server_casa.py finalize() and .../standard/tests/grade.py.
#             These files match images/robocasa-files/FILES.json (robocasa-files-0.7.0) byte for byte (SHA-256).
# Helpers used below (upstream line numbers):
#   OU.gripper_obj_far L349-356: |grip site - object body origin| > 0.25 m (the right-hand eef site, the only gripper).
#   OU.check_obj_fixture_contact L340-346 and env.check_contact: any MuJoCo contact between the two models' contact
#     geoms in the current state.
#   OU.check_obj_in_receptacle L323-337: contact, and the x-y distance of the two body origins < th (default 0.7 x the
#     receptacle's horizontal radius, objects.py horizontal_radius L149-154).
#   OU.obj_inside_of L12-60: the 8 corners of the object's bounding box (objects.py get_bbox_points L156-192, at its
#     pose) inside the fixture's interior box (get_int_sites); th = 0.05 is added to the dot products with the box's
#     unnormalised edge vectors, so the slack along an edge of length L is 0.05 / L metres. partial_check=True: the
#     body origin only, th = 0.
# Line numbers below are those of the pinned upstream files.

