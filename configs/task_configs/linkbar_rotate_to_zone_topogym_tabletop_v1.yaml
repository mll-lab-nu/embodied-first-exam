# Linkbar Rotate To Zone（docx 4.4 改造版）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 场景：一根固定立柱上铰接一条连接梁，梁只能绕竖直轴转，梁端的销在一个水平圆上走。
# 圆上分居初始角两侧各有一块颜色区域；销与其中一块同色。机械臂转梁上的手柄，把销停进
# 同色区域即成功。
#
# 2026-08-27 改造前，本任务是「把销扣进两个同款插口之一，接对的那个把导轨小车锁住」，
# 成功判据为推小车不动。review 意见：小车静止在视频里辨识度低。改为颜色区域后，成功
# 与失败在单帧画面上就能分辨：销停在同色区里，或者停在异色区／区外。
# 旧判据与旧场景（小车、导轨、插口、weld 闩、行程测试）已整体删除，记录见
# docs/develop/tasks/linkbar_rotate_to_zone_zh.md。
#
# 派生量不写在这里，由 LinkbarRotateLayout 从下面几个数算出来：
#   zone_center(θ)  = pivot + arm_radius · (cos θ, sin θ)     区域中心（销的落点）
#   in_zone(angle)  = |wrap(angle − θ)| ≤ half_width_deg       判据与画出来的色块用同一个数
#
# 高度：立柱 0–0.078，转轴间隙 0.002，梁底 0.095，销 0.052–0.095，手柄 0.125–0.165。
# 这些数在旧版本里经过夹持与净空的实测（见 linkbar 段各注释），本次不动。

# 配色：桌面浅灰 0.78-0.82；固定立柱 0.50；梁 0.42-0.52 蓝灰；转轴 0.55。
# 销、销的套环、手柄盖三处取「本回合的目标区域色」，是这根杆的标识色。
# 两块区域的颜色在 zones.colors 里定义，与桌面、梁都拉得开。

task:
  id: linkbar_rotate_to_zone
  difficulty: smoke

coordinate_frame: task

# ---------------------------------------------------------------- 枢轴
# 整套几何的原点。
#
# x 取 +0.020 是被实测逼出来的，不是随手选的。停在共用 home 位姿的手部实测在
# task 帧 (+0.043, −0.000, +0.267)，指尖悬在手柄的高度带里。枢轴原为 −0.020 时，
# 手部相对枢轴的半径是 0.063，而手柄圆是 0.100——张开的夹爪正好横跨手柄圆，
# 连接梁扫回初始角附近时会撞上它（2026-08-20 实测：四段扫掠里有三段顶在机械臂上，
# 接触力约 20N，梁停在 +8.34° 再也过不去）。
#
# 挪到 +0.020 之后手部相对枢轴的半径是 0.023，落在轮毂（半径 0.030、顶面 0.097）
# 正上方，指尖高度还剩约 50mm 余量；手柄圆与指尖的水平净空从 26mm 增到 43mm。
#
# 不改共用 home（`shared home parity`：那是 RoboMME 的锚点）。若将来仍需让开，
# 按 stacked_plate 的先例配一份任务专属的抬高 home，而不是动 common 里的 qpos。
pivot:
  x: 0.020
  y: 0.0

# ---------------------------------------------------------------- 连接梁
linkbar:
  # 销走的圆半径。也是两块区域的半径——「同在旋转圆上」在这里是一个数。
  arm_radius: 0.170
  # 初始角。0° = 梁指向 +x（远离机械臂、朝 front 相机）。两块区域分居它两侧。
  init_angle_deg: 0.0

  beam:
    bottom_z: 0.095
    height: 0.020
    width: 0.026
    color: [0.42, 0.46, 0.52]

  pin:
    radius: 0.010
    # 销底距桌面 52mm。销不碰任何东西，色块是纯视觉的（collision=false）；这个高度
    # 保留旧值是为了不动梁的质心与夹持实测。
    bottom_z: 0.052
    collar_radius: 0.015
    collar_height: 0.008
    # 颜色不在这里写：销、套环、手柄盖三处取 zones.target 指向的区域色。

  axle:
    radius: 0.018
    # 转轴伸出梁顶多少。露出一截才看得出「梁绕它转」。
    rise: 0.010
    # 转轴底面与固定立柱顶面之间的轴承间隙。**不能为 0，更不能让转轴一路伸到桌面**：
    # 立柱已经在那里，同轴两根实心圆柱在立柱整个高度上互相穿透，等于在固定件与唯一
    # 需要自由转动的件之间做了一圈永久接触。2026-08-20 实测（转轴从 z=0 起）：伺服
    # 驱动的扫掠最多欠转 22°。
    clearance: 0.002
    color: [0.55, 0.56, 0.58]

  hub:
    radius: 0.030
    height: 0.024

  knob:
    # 手柄所在半径。取 0.100 < arm_radius：手柄在销的内侧。
    station: 0.100
    boss_radius: 0.016
    boss_height: 0.010
    # 圆柱手柄而不是方柱：方柱的对角线比端面宽，转动时会把指腹撑开（4.3 实测结论）。
    # 0.040：手柄越高，夹爪横移到它正上方时要抬得越高，手柄已在距 Franka 底座 0.690m
    # 处，抬高会吃可达余量。指腹约 14mm 高，40mm 的柱面够夹。
    radius: 0.011
    height: 0.040
    cap_radius: 0.014
    cap_height: 0.006
    # 指腹在手柄上的高度（自手柄底面起）。手柄 0.125–0.165，取中偏下。
    grasp_height: 0.025
    color: [0.12, 0.13, 0.15]

  mechanism:
    joint_name: linkbar_joint
    mass: 0.450
    # friction 是**驻车阻力**，取 0.10 N·m 有实测理由，而且本版本判据直接依赖它：
    # 松手后梁要靠它停在区域里。
    #
    # 2026-08-21 曾把它从 0.030 降到 0.015，用意是减小扫掠阻力以解打滑。那一刀是多砍
    # 的：真正解打滑的是夹持力（grasp_qpos 0.006→0.001，能力 0.23→0.48 N·m）。而摩擦
    # 正是让一个竖直自由铰链停在原地的东西——竖直轴上重力不产生力矩，但梁的质心偏出轴
    # 85mm，重力的反作用由关节约束承担，求解器残差会漏一点进自由方向。摩擦减半之后压
    # 不住，梁在 home 沉降的 40 步里自行转动，夹爪合到空处（2026-08-22 复现）。
    #
    # 0.10 不影响扫掠：阻力矩 = 0.04 × 0.63 rad/s + 0.10 ≈ 0.125 N·m，对 0.48 N·m 的
    # 夹持能力仍有 3.8 倍余量。
    joint_damping: 0.040
    joint_friction: 0.100
    joint_armature: 0.010
    contact_friction: 1.000
    # 关节**不设限位**。圆上有两块区域，限位只能描述其中一块。

# ---------------------------------------------------------------- 固定立柱
# 梁转在它上面。转轴从它上方穿出，于是关节的「固定半边」与「转动半边」在画面里是
# 分开的两件东西。顶面 0.078：轮毂底（0.093）下余 15mm。
pivot_column:
  radius: 0.026
  height: 0.078
  color: [0.50, 0.51, 0.53]

# ---------------------------------------------------------------- 颜色区域
# 防捷径的随机化轴有三条，逐 episode 覆盖即可：
#   target             哪块区域是目标（销取它的颜色）
#   left/right.angle   两块区域的角位置
#   assignment         哪块区域什么颜色
# oracle 读销的颜色就能解；「转向最近的区」「总是转同一个方向」被钉在随机水平。
zones:
  left:
    angle_deg: 55.0
  right:
    angle_deg: -45.0
  # 可用的颜色。名字只在配置里当键用，判据不看名字，看 target 指向的那块区域。
  colors:
    orange: [0.88, 0.55, 0.10]
    blue: [0.15, 0.45, 0.85]
  assignment:
    left: orange
    right: blue
  target: left
  # 区域的角半宽。画出来的色块与判据用同一个数：销中心与区域中心的角差 ≤ 它即在
  # 区内。8° 在半径 0.170 上是 23.7mm，销直径 20mm，销整体落在色块里才算。
  half_width_deg: 8.0
  # 色块的径向宽。销直径的两倍，俯视时销两侧各露出一截颜色。
  radial_width: 0.040
  # 一块扇区用几段直盒拼。7 段各 2.3°，弦与弧的偏差 <0.1mm。
  segments: 7
  thickness: 0.0010
  z_offset: 0.0006
  # 允许的扫掠幅度（相对 init_angle_deg 的绝对值）。下界保证「转过去」是一次真动作
  # 而不是抖一下；上界保证手柄不出机械臂工作区。两块区域必须分居 init 两侧，且互不
  # 重叠——LinkbarRotateLayout.validate 直接报错。
  min_sweep_deg: 35.0
  max_sweep_deg: 75.0

# ---------------------------------------------------------------- 摆动圆弧标记
# 两块区域之间那段圆弧的虚线：它是「两块区域是同一次转动能到的地方」的可读证据。
# 纯视觉，无碰撞。
swing_arc:
  enabled: true
  segments: 16
  tick_size: [0.012, 0.004, 0.0010]
  z_offset: 0.0006
  color: [0.46, 0.47, 0.49]

# ---------------------------------------------------------------- 指令
# 指令是常量：要读的信息（销是什么颜色）在场景里，不在语言里。
command:
  prompt: "Turn the bar so its pin rests on the zone that matches its colour."

# ---------------------------------------------------------------- 判据
success:
  # 松手后先沉降多少步再读。梁靠关节摩擦停住，这段时间给它把残余转动耗掉。
  settle_steps: 30
  # 读数时关节角速度上限（rad/s）。超过它说明梁还在动，本步的位置不算数。
  max_angular_speed: 0.05

# ---------------------------------------------------------------- 原语参数
# 全部是 hand link 在 task 帧的 z（指腹在其下方 HAND_TO_PAD_Z=0.1029 处）。
#
# 时长：本次 review 要求尽量短。已去掉行程测试（180 步）；下面的 hold/settle 也按
# 「看得清」而不是「看很久」取值。steps_arc 保留 240：缩短它会抬高扫掠角速度，触发
# max_lag 门或打滑，须实测通过后再降。
motion:
  # 接近／退刀高度。0.315 是被实测逼出来的：手柄加盖顶到 0.171，原值 0.300 对应的
  # 指腹在 0.197，指尖净空只剩约 6mm，横移最后一段贴着盖子过去，把梁推歪（2026-08-22）。
  # 现值指腹在 0.212，对盖顶余 41mm。
  approach_z: 0.315
  retreat_z: 0.315
  steps_per_phase: 80
  steps_arc: 240
  gripper_steps: 50
  close_hold_steps: 35
  arc_settle_steps: 30
  release_hold_steps: 30
  # 手柄半径 0.011，指腹被手柄顶在 0.0107 处停住。夹持力 = 指刚度(100) × 过行程，
  # 所以指令值越小夹得越紧。2026-08-21 由 0.006 改到 0.001：0.006 实测打滑 5.03°。
  grasp_qpos: 0.001
  finger_links: [left_finger, right_finger]
  finger_friction: 3.000
  knob_friction: 2.000
  # 到位角容差。区域半宽 8°，这里取一半，给松手漂移留余量。
  target_tolerance_deg: 4.0
  max_follow_error: 0.040
  # 扫掠过程中关节允许落后手部多少。区分「夹着转」与「推着走」。
  max_lag_deg: 6.0
  max_release_drift_deg: 5.0
  # 合爪停位低于它即判为「合在空处」。
  min_finger_qpos: 0.004

physical:
  settle_steps: 40

mdp:
  max_episode_steps: 60
  reward:
    success: 10.0
    wrong_zone_penalty: 1.0
    action: 0.01
