# KinDER subset -- the single source for every tasks/kinder-* directory (`gen_tasks.py render` writes them).
#
# Which tasks: KinDER's Dynamic3D tasks (MuJoCo, a TidyBot++ mobile manipulator) whose goal a camera can see or a
# sentence can name, and (the section at the end) other 3D families of KinDER, one variant each. Of all of these, the
# four with the most task objects (upstream's `oN`) stay (docs/benchmarks/kinder.md), with the fixture. Each ships twice (docs/PROTOCOL.md): privileged mode (tasks/kinder-<family>-i00:
# the simulator and its state, one replayable trajectory) and standard mode (-standard: the robot as a service,
# eai-standard/2.1, its own sensors only).
#
# task_statement is all an agent is told about the goal, in both modes, so it must name the goal exactly as KinDER
# checks it (the task JSON's goal_state): which objects, which place, and when it counts. It says what is visible;
# never how to do it.
#
# Every MuJoCo task is set in KinDER's MimicLabs lab (rcb_kinder.SCENE_BG: images only, the physics is the same bit for bit).
# task_view is the camera standard mode serves as room_camera (off in the standard configuration); a task sets it here
# only where upstream's own looks down from high overhead, which would hand the agent a map: a camera where a lab would
# put one instead, looking down less than 45 degrees.
#
# Per task, for its README and the human review of a task without an oracle (docs/PROTOCOL.md §2.7):
#   difficulty        what makes it hard, and how models did
#   oracle_evidence   the positive example a reviewer checks (the family's, both modes)
#   oracle_privileged, oracle_standard   instead, where oracles/<family>/<mode>/ holds an oracle: what it does
# The agent's egress allowlist is scripts/set_agent_egress.py's HOSTS (the model APIs and the package registries), read by gen_tasks.py:
# KinDER and its baselines are public, so anything more lets a standard-mode agent install the simulator it is not
# given, and either mode fetch upstream's planners.

[defaults]
instance_tag = "i00"
seed = 0                  # KinDER draws the scene from this seed; the instance pins it (instance.json)
max_steps = 1000          # upstream's episode length for these tasks (TidyBot3DConfig.horizon): 100 s at 10 Hz
agent_timeout_sec = 3600
verifier_timeout_sec = 900
review_pr = 8             # the pull request whose human review covers the tasks without an oracle (0: not opened yet)

[[task]]
family = "dynamo"
env_id = "kinder/Dynamo3D-o3-v0"
task_view = { position = [-1.0, -1.2, 2.8], lookat = [2.2, 1.9, 0.0], fovy = 70 }  # upstream: 6.75 m up, straight down
expert_hours = 2.0
difficulty = """Nonprehensile: three chairs stand between the robot and the floor square, and the base can push them. The
benchmark's fixture: the pipeline check, with an oracle in both modes."""
oracle_privileged = """`solution/oracle.py` steers the base from the state around the chairs' north side (three
waypoints, every move inside a 0.1 m disc) into the square: success at step 101."""
oracle_standard = """`solution/oracle_replay.py` sends the privileged oracle's 101 moves, turned into the odometry
frame (`solution/oracle_actions.npy`), through the client: success at step 101, no privileged information at run
time."""
task_statement = """drive the robot into the translucent green square marked on the floor; three chairs stand in the
way and can be pushed. The task succeeds the moment the centre of the robot's base is inside the square. (The red, blue
and yellow squares only mark where the chairs started.)"""

[[task]]
family = "sweep-into-drawer"
env_id = "kinder/SweepIntoDrawer3D-o5-v0"
expert_hours = 4.0
difficulty = """Nonprehensile, tool use, dynamics: open a closed drawer, then sweep five small cubes off the counter into it
with a wiper. KinDER's paper reports at most 0.14 success for its best method on this variant and 0.00 for sampling
MPC on the true simulator."""
oracle_evidence = """GPT-6 Luna's privileged-mode trajectory of 2026-10-04, run `codex-gpt6_luna-medium` on the results site, which today's privileged verifier scores 1 (it moves the base diagonally by up to 0.13 m a step, beyond standard mode's 0.1 m disc, so it is no standard-mode example); in standard mode, the graded episode of run `codex-gpt6_1_sol-high` of 2026-10-03 (960 control steps, no reset), which the standard service scored 1 (live, fresh replay, deterministic)"""
task_statement = """get the five small dark-red cubes on top of the kitchen island into the middle drawer of the
island's upper row of drawers, which starts closed; a wiper lies next to the cubes. The task succeeds the moment all
five cubes' centres are inside that drawer, each at least 2.5 cm from the drawer's two side walls."""

[[task]]
family = "scoop-pour"
env_id = "kinder/ScoopPour3D-o30-v0"
expert_hours = 4.0
difficulty = """Nonprehensile, tool use, dynamics: move 30 small cubes from one bin to another with a scoop, each ending well
inside the target bin."""
oracle_evidence = """the privileged-mode trajectories of runs `codex-gpt6_astra-high` (845 steps) and `codex-gpt6_sol-high` (770 steps) of 2026-10-04, each scored 1 by the privileged verifier (two replays, the same final state; verifier and instance unchanged since); no standard-mode example is known yet (docs/benchmarks/kinder.md, Open)"""
task_statement = """move all 30 small dark-red cubes from the yellow bin into the green bin; a scoop is in the
scene. The task succeeds the moment every cube's centre is inside the green bin, at least 1 cm from each of its inner
walls and at least 0.5 cm below its rim."""

# ----------------------------------------------------------------------------------------------------------------------
# From the rest of KinDER's 3D families. The variant is the hardest that upstream's baselines (kinder-baselines) configure. Where
# upstream sets no episode length (PyBullet), max_steps is its baselines' evaluation horizon for the variant, else
# their default 3000.
# `standard_statement` is the standard twin's goal sentence where the privileged one names the goal by world coordinates
# or state names, and must name the same goal.

[[task]]
family = "constrained-cupboard"
env_id = "kinder/ConstrainedCupboard3D-o6-v0"
expert_hours = 4.0
difficulty = """Geometric: six identical rods, each into the one narrow compartment it is owed (standard mode names them
by distance and by place in the row)."""
oracle_evidence = """GPT-6 Luna's privileged-mode trajectory, run `codex-gpt6_luna-medium` on the results site, which today's privileged verifier scores 1; it moves the base diagonally by up to 0.14 m a step, beyond standard mode's 0.1 m disc, so it is no standard-mode example, and none is known yet"""
task_statement = """put the six brown rods lying on the floor (30 cm long) into the six 40 cm-tall compartments of the row
of eleven narrow cupboards standing side by side, one rod each, as the state names pair them: rod `cuboid_i` into
cupboard `cupboard_i` for i = 0 to 5, whose tall compartment is the upper one in `cupboard_0` to `cupboard_2` and the
lower one in `cupboard_3` to `cupboard_5`. The task succeeds the moment every rod's centre is inside its compartment:
above that compartment's shelf, below the shelf over it, and within the cupboard's 10 cm width and 30 cm depth."""
standard_statement = """put the six brown rods lying on the floor (30 cm long) into the row of eleven narrow cupboards standing
side by side ahead of the robot, one rod each, each into a cupboard's 40 cm-tall compartment: taking the rods in order of
their distance from where the centre of the robot's base starts, nearest first, they go into the 11th, 5th, 2nd, 8th,
4th and 1st cupboard of the row, counted from the robot's left as it faces the row at the start. The task succeeds the
moment every rod's centre is inside its compartment: above that compartment's shelf, below the shelf over it, and
within the cupboard's 10 cm width and 30 cm depth."""

[[task]]
family = "sweep-simple"
env_id = "kinder/SweepSimple3D-o10-sweep_the_blocks_to_the_left_side_of_the_kitchen_island-v0"
expert_hours = 3.0
difficulty = """Nonprehensile, tool use: ten small cubes on the floor into a box marked at the kitchen island's end, with a
wiper at hand."""
oracle_evidence = """GPT-6 Luna's privileged-mode trajectory of 2026-10-04 (it moves the base diagonally by up to 0.14 m a step, beyond standard mode's 0.1 m disc) and its graded standard-mode episode with 50 resets recorded before protocol v1.0, run `codex-gpt6_luna-medium` on the results site; today's privileged verifier scores both 1, and the standard service scores the episode 1 when it is sent through the client"""
task_statement = """get the ten small dark-red cubes scattered on the floor into the translucent grey box marked on the
floor at the end of the kitchen island (the free-standing white-topped counter) nearest the robot; a wiper stands on the
floor next to the cubes. The task succeeds the moment all ten cubes' centres are inside that box."""
