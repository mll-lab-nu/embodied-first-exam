# README data for tasks/pandadyn/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every text below (paths relative to the repository root; P = images/pandadyn/panda_dynamics/):
#   phases         P/tasks/{single,dual}/<task>.py `update_task` (each phase's predicate, judged after every 1 ms physics
#                  step, only while it is the current phase: P/base_env.py `advance`, `phase_hold`; P/events.py
#                  EventLedger.hold = the condition true at every physics step for the stated time, a break restarts it)
#   shared rules   P/tasks/predicates.py (supported, containment, cup_catch, ball_on_plate, bilateral_grip, crossed,
#                  free_interval, face_up, inertial_flip); P/base_env.py `read_contacts` L508-638 (contact rules: two
#                  roles, self contact unless finger-finger, robot link vs scene / object / fixture unless
#                  ALLOW_FINGER_CONTACTS / ALLOWED_FINGER_FIXTURES, tool vs anything but objects / ALLOWED_TOOL_FIXTURES,
#                  penetration < -4 mm; a contact counts at impulse >= 1e-8), `_step_action` L450-499 (limit violations,
#                  out of bounds z < -0.2 or |xy| > 1.8, the horizon's "timeout" before physical_success), `evaluate`
#                  (success = physical_success and valid and no failure); P/telemetry.py `sample` (safety limits, with
#                  P/robots/panda_limits.py)
#   parameters     each privileged task's environment/instance.json `parameters` (nominal, resolved; the same file in
#                  every mode of a family)
#   graders        embodied_first_exam/benchmarks/pandadyn/privileged/tests/grade.py (privileged; replay by
#                  .../privileged/environment/rcb_pandadyn.py Session.replay / step: done = terminated (success or
#                  failure) or the step cap MAX_ROWS = 4500); embodied_first_exam/benchmarks/pandadyn/sim/server.py
#                  PandaDyn.step (RCB_AGENT_END=1: Session.run_on, end_judgement "events", the horizon as the step cap)
#                  + rcb_service.py _step / _end (standard); embodied_first_exam/standard/realtime/rcb_realtime.py
#                  (realtime clock and its error rule)

[benchmark]
name = "Panda Dynamic Scenes"
citation = "Wang et al., 2026"      # Embodied First Exam (arXiv:2611.12177): Panda Dynamic Scenes is one of its original suites
url = "https://www.embodied-first-exam.ai/suite/pandadyn/"
repo = "mll-lab-nu/embodied-first-exam"
commit = "b2280d8"                  # the commit that added tasks/pandadyn/ to this repository

[license]
text = """
Panda Dynamic Scenes is an original suite of Embodied First Exam. Its environment package (`images/pandadyn/panda_dynamics/`) is released
with this repository under the repository's MIT License. The simulation stack in the image: ManiSkill 3 and its Franka
Panda model (Apache License 2.0), SAPIEN (MIT), Ruckig community version (MIT), PyTorch (BSD 3-Clause). No
non-commercial terms apply.
"""

[robots]
franka-panda = "Franka Emika Panda (FER), one 7-joint arm with its standard two-finger hand"
franka-panda-bimanual = "Two Franka Emika Panda (FER) arms, each with 7 joints and its standard two-finger hand"

[modes.privileged]
# Shared failures: P/base_env.py read_contacts, _step_action; P/telemetry.py sample (joint position limit + 0.002 rad,
# measured joint speed x1.01, finger speed 0.051, TCP 1.7 m/s / 2.5 rad/s x1.01 measured and reference, torque 87/12 N m
# + 1e-4, torque rate 1000 N m/s + 0.1, reference joint v/a/j above the limits, 20 ms windowed joint acceleration, joint
# jerk and TCP acceleration 13 m/s^2 / 25 rad/s^2 (measured and reference) x1.05).
# Grading: privileged/tests/grade.py main / load_trajectory (missing_trajectory, wrong_task, bad_trajectory: 0;
# sim_error: 0; replay_failed, replay_timed_out (300 s + rows / 10), instance_ok = 0, any exception: grader_error =
# infra_error = 1); rcb_pandadyn.py Session.clip (joint limits, aperture [0, 0.08]), replay (stops at the first done),
# success() = physical_success and valid and no failure_reason.
success = """
Phases count only in order: each phase's condition is checked after every 1 ms physics step, and only once the phase
before it is complete. A condition "for t s" must hold at every physics step over t s; a break restarts it. Positions
are in the world frame (metres, z up, the table top is the plane z = 0); "horizontally" means in x and y.

Failures shared by every task (each ends the episode at once, in any phase):
- a forbidden contact: two arms touching each other (tools included); an arm touching itself, except its two fingers
  touching each other (a finger touching the arm's own tool counts); any robot part, tool included, touching anything
  the allowed contacts above do not list (the table, the floor and the arm pedestals included); any contact in the
  scene that penetrates deeper than 4 mm;
- a violation of the Franka Panda's safety limits by an arm, checked at every physics step: a joint more than 0.002 rad
  beyond its position limits; measured joint speeds above 101 % of the limits (2.175 rad/s for joints 1-4, 2.61 rad/s
  for joints 5-7); a finger faster than 0.051 m/s; the hand's TCP faster than 1.01 x 1.7 m/s or 1.01 x 2.5 rad/s,
  measured or in the servo's reference motion; a motor torque above 87 N m (joints 1-4) or 12 N m (joints 5-7), or one
  changing faster than 1000 N m/s; reference joint speeds, accelerations or jerks above the Panda's limits; measured
  joint accelerations or jerks, or measured or reference TCP accelerations (13 m/s², 25 rad/s²), averaged over 20 ms,
  above 105 % of the limits;
- an object leaving the workspace (its centre below z = -0.2 m or more than 1.8 m from the world origin horizontally),
  or a non-finite object position;
- the task's horizon (above) reached before the last phase is complete.

Graded file: `/app/output/trajectory.npz`, as `Session.save_trajectory(...)` writes it: `task` naming this task and
`actions`, a finite array with one row per 10 ms control step (8 values per arm: 7 joint-position targets and the total
gripper aperture) and at most 4,500 rows. Each row's joint targets are clipped to the joint limits and its aperture to
[0, 0.08] m before it runs. After the agent's session the verifier replays the file once, open-loop, in a fresh process
of a separate container without network, from its own copy of the frozen instance. The replay stops at the end of the
first control step in which the task has completed or failed (later rows are never run), or when the rows run out. The
task is passed if, at that point, the last phase is complete and no failure has been recorded. A missing file, a file
for another task, a file that is not such an array, a replay that ends without completing every phase, and a simulator
error on the agent's rows (for example the servo's trajectory generator failing) score 0. A rebuilt start that does not
match the frozen instance's state hash, a replay that gives no result or runs past its time limit (300 s plus 0.1 s per
row), or any other error in the grader is an infrastructure error, not a score.
"""

[modes.standard]
# Shared failures: as [modes.privileged]. server.py PandaDyn.step L183-194: a failure ends the episode (done, not
# success); the horizon (Session.horizon_end, its "timeout" failure included) and MAX_ROWS end it as the step cap
# (info step_cap -> rcb_service _step: "step_limit"). rcb_service.py _hidden_success / _judged / _end L960-967 with
# end_judgement "events": finished / timeout (SIGUSR1 at the session's end) / step_limit / failed -> success iff the task
# succeeded at some control step of the episode (seen_step); error (a simulator error) and reset -> 0. Reset budget:
# RCB_RESET_BUDGET default 3 in environment/docker-compose.yaml; only the episode after the last reset is graded.
# instance_mismatch, sim_crashed, resume_failed: infra_error (the shared sidecar grade.py); sim_crashed_on_call: 0.
success = """
Phases count only in order: each phase's condition is checked after every 1 ms physics step, and only once the phase
before it is complete. A condition "for t s" must hold at every physics step over t s; a break restarts it. Positions
are in the world frame (metres, z up, the table top is the plane z = 0); "horizontally" means in x and y.

Failures shared by every task (each ends the episode at once, in any phase):
- a forbidden contact: two arms touching each other (tools included); an arm touching itself, except its two fingers
  touching each other (a finger touching the arm's own tool counts); any robot part, tool included, touching anything
  the allowed contacts above do not list (the table, the floor and the arm pedestals included); any contact in the
  scene that penetrates deeper than 4 mm;
- a violation of the Franka Panda's safety limits by an arm, checked at every physics step: a joint more than 0.002 rad
  beyond its position limits; measured joint speeds above 101 % of the limits (2.175 rad/s for joints 1-4, 2.61 rad/s
  for joints 5-7); a finger faster than 0.051 m/s; the hand's TCP faster than 1.01 x 1.7 m/s or 1.01 x 2.5 rad/s,
  measured or in the servo's reference motion; a motor torque above 87 N m (joints 1-4) or 12 N m (joints 5-7), or one
  changing faster than 1000 N m/s; reference joint speeds, accelerations or jerks above the Panda's limits; measured
  joint accelerations or jerks, or measured or reference TCP accelerations (13 m/s², 25 rad/s²), averaged over 20 ms,
  above 105 % of the limits;
- an object leaving the workspace (its centre below z = -0.2 m or more than 1.8 m from the world origin horizontally),
  or a non-finite object position.

Graded: the live episode, judged by the simulator service as it runs; nothing is replayed. Each row the agent sends (8
values per arm, clipped to the limits) runs as one 10 ms control step; between the agent's calls the world is frozen.
The task is judged as an event: once the last phase is complete at some control step with no failure recorded by then,
the episode is a success, even if a failure above ends it afterwards; a failure before that scores 0. Completing the
task neither ends the episode nor is shown to the agent. Otherwise the episode ends at the agent's `/finish`, at the
task's horizon (whether or not every phase is done by then), after 4,500 control steps, or when the agent's time
({timeout}) runs out, and it is a success only if the task was completed by then. The agent has {resets} resets, each
starting a new episode from the frozen start; only the last episode (the one after the last reset) is graded. A
simulator error raised by the agent's own call ends the episode with 0. An episode that does not start from the frozen
instance, or a service crash outside the agent's calls, is an infrastructure failure, not a score.
"""

