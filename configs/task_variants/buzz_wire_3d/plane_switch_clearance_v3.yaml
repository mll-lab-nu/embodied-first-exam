tuning_candidates: {}
coupled_constraints:
- Preserve four full obstacles and their authored order; connectors do not count as
  stages.
- Use tangent-continuous joins between different planes; no sharp wire corners.
- Preserve all local return counts and the open 270-degree omega, rather than shrinking
  obstacles into cosmetic waves.
- Derive comb lane pitch from its radius and retain clearance at every W valley.
- A 270-degree wire arc does not prescribe a 270-degree roll of one wrist joint.
- Place stage envelopes in separate corridors and check crossings between different
  stages.
- The short helix remains open, with no intermediate mount crossing the ring path.
ik_design_priorities:
- Jointly select grasp side, ring tilt and one arm branch for all four obstacles.
- Check joint 7 margin throughout; baseline already spans about 327 degrees on that
  joint.
- Resolve all stage transitions without resetting pose, changing grasp or stitching
  independent IK solutions.
