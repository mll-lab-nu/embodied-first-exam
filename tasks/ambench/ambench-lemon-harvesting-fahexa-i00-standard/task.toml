schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/film.log", service = "sim" },              # the collect hook's film pass (the video; never decides anything)
  "/app/output/",
]

[task]
name = "embodied-first-exam/ambench-lemon-harvesting-fahexa-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): AM-Bench LemonHarvesting-Am-FAHexa-Abs-PID-Direct-v0 (a fully actuated hexarotor with a 4-joint arm and a two-finger gripper, Isaac Lab / Isaac Sim 5.1) on the same frozen instance as the privileged task. Task: One lemon and six limes are fixed to the front face of a wall in front of the hovering aerial manipulator, and a grey storage tote sits on a small table against the wall to the robot's left. Harvest the lemon: free it from the wall and get it into the tote. Success needs the lemon's reference point (the base of the fruit) inside the tote's nominal box while the gripper is fully open. The agent only gets a client: get_obs (RGB, depth + proprioception of the airframe and the arm), submit (AM-Bench's end-effector pose rows). No reset, no privileged state; the sim service records the episode as a trajectory and grades the live episode."
keywords = ["robotics", "ambench", "aerial-manipulation", "isaac-lab", "isaac-sim", "hexarotor", "standard-mode", "trajectory"]

[metadata]
task_type = "trajectory"
simulator = "ambench"             # AM-Bench @ 60bf5b7 on Isaac Lab @ f4aa17f / Isaac Sim 5.1 (PhysX on the GPU, RTX rendering)
robot = "ambench-fahexa"
family = "lemon_harvesting_fahexa"
dynamics = "static"               # scene dynamics (PROTOCOL §2): nothing but the robot does work on the scene
protocol = "eai-standard/2.2"
oracle = "full"
instance_seed = 0
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, write final.json from the live episode (no replay), then film once
timeout_sec = 4800                # = finalize.sh's HOOK_BUDGET_S (RCB_COLLECT_TIMEOUT_S; keep them equal): the episode end (up to
                                  # 2700 s through a resume) + ONE film pass (the video only, at most 1800 s: an Isaac start and
                                  # the render worker's, 1.5-6 min, + at most one episode, 7200 control steps at 10-15 steps/s)
                                  # + a margin; graded by the live episode since 2026-10-17 (7200 s with two replays before)

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2)
# AM-Bench's scripted experts are public upstream, so the agent reaches the model APIs and the package registries, nothing
# else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0           # a first run builds the simulator image from public sources (tasks/ambench/README.md, Before you run)
cpus = 2                          # the agent's container (the client only); the sim sidecar's caps: scripts/task_resources.toml
memory_mb = 4096
storage_mb = 10240
gpu_types = ["L40S", "L40", "RTX 4090", "RTX PRO 6000 Blackwell"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
