# README data for tasks/robotwin-2/*/README.md (scripts/task_conventions.py render_readme_v3)
# Success texts are read from RoboTwin 2.0 @ 6dde571 (third_party/RoboTwin): envs/<task>.py `check_success`, with
# envs/_base_task.py (table_z_bias = 0: no task passes table_height_bias and random_table_height is 0 in the tooling's
# BASE_ARGS, so every "0.74 + table_z_bias" is 0.74 m) and envs/robot/robot.py (gripper open > 0.8, closed < 0.2).
# Instance-dependent sides (which arm, which side an object started on) follow each task's instruction.md ## Goal.
# Positions are object origins (Actor.get_pose().p) unless a functional / contact point of the model is named.
[benchmark]
name = "RoboTwin 2.0"
citation = "Chen et al., 2025"
url = "https://github.com/RoboTwin-Platform/RoboTwin"
repo = "RoboTwin-Platform/RoboTwin"
commit = "6dde571"

[license]
text = """
The scenes, task definitions and success checks are RoboTwin 2.0's ([RoboTwin-Platform/RoboTwin](https://github.com/RoboTwin-Platform/RoboTwin),
MIT License, copyright 2025 Tianxing Chen; paper: Chen et al., 2025, "RoboTwin 2.0: A Scalable Data Generator and
Benchmark with Strong Domain Randomization for Robust Bimanual Robotic Manipulation", arXiv:2506.18088). The robot and
object assets come from RoboTwin's asset dataset on Hugging Face
([TianxingChen/RoboTwin2.0](https://huggingface.co/datasets/TianxingChen/RoboTwin2.0), revision `981c92a`,
`embodiments.zip` and `objects.zip`), downloaded when the image is built and not redistributed in this repository.
"""

[robots]
aloha-agilex = "ALOHA-AgileX dual-arm robot (two 6-joint arms with parallel-jaw grippers)"

[modes.privileged]
# tests/grade.py main / load_deliverable / probe_instance; tests/rcb_traj.py Session.replay, status (env.check_success
# once, after the last row), gripper_opening + _install_gripper_predicates (gripper_state="fingers"), MAX_T = 200,000.
# The latch of press_stapler (stage_success_tag) is reset by every rebuild (_base_task._init_task_env_ L160) and nothing
# calls check_success during the replay, so the one check is the end state's.
success = """
Positions are in the world frame: the table centre at the origin, +x to the robot's right, +y away from the robot, +z
up; the table top is at z ≈ 0.74 m. Where a gripper must be open or closed, a gripper counts as open when the position
targets of both its fingers command an opening above 0.8 (0 = closed, 1 = open) and as closed when both command less
than 0.2; the two gripper-command columns of a row are not read.

The graded file is `/app/output/trajectory.npz`: `actions`, a finite (T, 34) array with one row per physics step
(1/250 s) and at most 200,000 rows, and `task` = `{family}`. The verifier replays it once, open-loop, in a fresh process
from the frozen start (the scene is rebuilt from the instance and its initial-state hash is checked) and checks the
conditions above once, on the state after the last row; nothing earlier in the replay counts. A missing file, a file
that is not a readable npz, a wrong `task`, a wrong shape, a non-finite value, more than 200,000 rows or a simulator
error during the replay scores 0. A host on which the frozen instance does not rebuild is an infrastructure error, not
a score.
"""

[modes.standard]
# environment sim service = embodied_first_exam/benchmarks/robotwin-2/sim/server.py: finish() L232-252 (RCB_AGENT_END=1,
# END_STATE_REASONS finished / timeout; step limit unset: RCB_STEP_LIMIT not in the compose file), _check_success
# L108-113 (stage_success_tag cleared before every judgement), Session(..., gripper_state="command") L258-261 (RoboTwin's
# own gripper rule), simulator error L967-971 -> reason "error"; tests/grade.py main (reason "error" and
# sim_crashed_on_call are 0; instance_mismatch, sim_crashed, resume_failed, no live verdict are infra_error).
success = """
Positions are in the world frame: the table centre at the origin, +x to the robot's right, +y away from the robot, +z
up; the table top is at z ≈ 0.74 m. Where a gripper must be open or closed, a gripper counts as open when its last
command is above 0.8 (0 = closed, 1 = open) and as closed when its last command is below 0.2, whether or not the fingers
reach that opening.

Graded is the one live episode (no reset, no step limit). It ends at the agent's `POST /finish` or when the time
limit is up, and the conditions above are checked once, on the state at that moment; a success earlier in
the episode neither ends it nor counts. A simulator error raised by an agent's call ends the episode with 0, as do
repeated service crashes that all happened while serving the agent's calls. A host on which the frozen instance does
not rebuild, or a service crash the episode cannot be resumed from, is an infrastructure error, not a score.
"""

