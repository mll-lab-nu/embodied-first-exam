# Generated by scripts/labutopia/generate.py -- edit the generator, the shared sources, families.json or the instance, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "robot-coding-bench/labutopia-open-close-i00-privileged"
description = "LabUtopia open_close (OpenClose; a chemistry laboratory with a Franka Panda on Isaac Sim): produce one replayable trajectory of joint targets. Open the top drawer of the cabinet, let go of it, then close it again and let go. Frozen scene instance (LabUtopia's reset, seed 0); graded by two fresh-process replays with a copy of LabUtopia's own success check."
authors = [{ name = "Canyu Chen" }]
keywords = ["robotics", "labutopia", "isaac-sim", "laboratory", "chemistry", "franka-panda", "code-as-policy", "trajectory", "open_close", "privileged"]

[metadata]
author_name = "Canyu Chen"
task_type = "trajectory"
simulator = "labutopia"           # LabUtopia @ 8df7278 on NVIDIA Isaac Sim 6.1.0 (PhysX on the CPU, RTX cameras)
robot = "franka-panda"
family = "open_close"
mode = "privileged"
oracle = "full"
level = 2                         # LabUtopia's own level for the task (config level2_openclose)
instance_seed = 0                 # numpy's and Python's random generators before LabUtopia's reset
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 8.0
min_memory_gb = 23.0
min_gpu_memory_gb = 8.5
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "RTX 4090 24GB / L40S 48GB"
verifier_min_cpus = 8.0
verifier_min_memory_gb = 21.0
verifier_min_gpu_memory_gb = 8.5
measured = "oracle checks on RTX 4090 (driver 580), lab_001 pick: rendering container peak 17 GB RAM, about 7 GB GPU, 8 CPUs (start-up bursts to 16 cores for about 70 s); author: lab_003 families 21 GB at the peak (8 vCPU host)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 32.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 32.0
measured = "GPU: about 7 GiB, oracle on an RTX 4090 (author); no trial data -> max(1.5 x peak, peak + 4), at least 16 for Isaac Sim; memory: the [environment] cap 32 GiB, which every past trial ran under (no samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 8.0, memory_gb = 39.0, pids = 16384 }

[metadata.seeds]
# the instances this task may run from (docs/PROTOCOL.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 5400.0              # two replays of about a minute (each limited to 2400 s, as before), then the video replay (the rest), whose renderer starts cold (5 to 27 minutes); 300 s of margin: tests/grade.py
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 32768

[agent]
timeout_sec = 3600.0              # LabUtopia's budget, both modes (docs/benchmarks/labutopia.md): a container's first simulator with its renderer takes 5 to 27 minutes to start
# LabUtopia's scripted controllers are in its public repository (and a standard-mode agent could rebuild the simulator
# from it): the agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 39936

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
