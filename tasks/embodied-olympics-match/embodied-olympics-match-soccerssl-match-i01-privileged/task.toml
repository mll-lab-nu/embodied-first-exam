schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-soccerssl-match-i01-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): wheeled robot soccer 5 v 5 (RoboCup SSL Division B): you command the blue team (five omnidirectional SSL robots, the skills move / kick / dribble / substitute) against the scripted yellow team, one match against the scripted opponent at level 4 on the frozen instance of embodied-olympics-match-soccerssl-match-i01-realtime (seed 7, S = 10). Full simulator in development (read and change any state, reset the whole match); the deliverable is a closed-loop Python program that plays a fresh unmodified match in the verifier, on the original S = 10 clock, seeing the full state instead of camera images."
keywords = ["robotics", "mujoco", "fullsim", "policy", "soccer_ssl"]
[metadata]
task_type = "policy"
simulator = "mujoco"
robot = "ssl-robot"
family = "soccer_ssl_match"
dynamics = "dynamic"
verifier_wall_clock = true
instance_seed = 7
opponent_level = 4
source_commits = ["91156213b0de"]
source_task = "roboolympics/soccer_ssl-match-wallclock-program-standard"
exporter = "Embodied Olympics full-simulator exporter"
official = false
expert_time_estimate_hours = 1.0
oracle = "partial"
oracle_evidence = "full-state reference program (solution/): the sport's reference team (builtin_players.TeamPlayer, perception = truth) fed the true state of the formal match; the twin's opponent is the RL-trained yellow team (level 4); oracle runs were waived for the Embodied Olympics - Match twins: untested; the nop (no program) scores 0"
validated = false

[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
[verifier]
timeout_sec = 17700.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
