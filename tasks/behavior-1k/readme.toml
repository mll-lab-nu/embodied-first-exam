# ------------------------------------------------------------------------------------------------------------------
[modes.privileged]
# B/rcb_behavior.py: REST_* L103-105, RestWatch L147-165, goal_object_names L181-190 (+ Session.__init__ L1307-1313),
# Session.step L1380-1403 (breakdown, then success, then fall), _success_step L1427-1448 (env.task.success = OmniGibson's
# PredicateGoal, tasks/behavior_task.py L172-181; assisted-grasp _ag_obj_in_hand; base-link speed), _breakdown_step
# L1450-1484 + BREAKDOWN_* L110-113, settle L1486-1494 (SETTLE_STEPS 150), _fall_step L1496-1503 + FALL_* L96-99,
# replay L1586-1603, cmd_replay L2313-2341. B/privileged/grade.py: MAX_ROWS L50, replay_timeout L63-64, missing file
# L140-141, unreadable / wrong task / shape / rows / non-finite L146-156, up to --repeat 3 replays, any success L160-182
# (tests/test.sh passes --repeat 3), instance_ok / infra_error L183-193, timed-out or failed replay L164-174.
success = """
The relations above are OmniGibson's object states, evaluated on the simulator after every control step (30 Hz). An
object is *on* another (`ontop`) when the two touch and the other is directly below it; *inside* when the centre of its
bounding box lies in one of the other's container volumes; *next to* (`nextto`) when their bounding boxes are no farther
apart than a sixth of their mean side length and one is a horizontal neighbour of the other; *under* when the other is
directly above it; *touching* when the two are in contact. An object is *closed* when none of its openable joints is
more than 5 % of its range away from closed, and *switched on* when its toggle state is on.

Success needs more than these conditions: they hold for 30 consecutive control steps (1 s of simulated time), and on
each of those steps no object they name (furniture and floors included; a substance has no pose and is not checked) is
held by a gripper's assisted grasp, and each of those objects moves slower than 0.05 m/s. The replay ends at the end of
that window. There is no partial credit.

The graded file is `/app/output/trajectory.npz`: `actions`, a finite (T, 25) array with one row per control step and
at most 40,000 rows, and `task` = `{family}`. The verifier replays it open-loop, in a fresh process, from the frozen
start (the scene is rebuilt and checked against the recorded state hash, or every object pose within tolerance). After
the last row the robot holds its last command with the base still for up to 150 control steps (5 s), and a success
within that window counts. It runs up to 3 such replays and the task passes if any one of them succeeds. A replay ends
as a failure when the robot has fallen over (its base more than 3 cm below the floor, or its up axis tilted more than
41.4° from vertical, for 300 consecutive control steps) or on a simulator breakdown (a non-finite robot state, the robot
or a named object more than 10 km from the origin, or the base faster than 100 m/s).

A missing file scores 0, and so does a file that is not a plain npz, lacks `task` or `actions`, names another task, has
another shape, a non-finite value or more than 40,000 rows. A frozen scene that does not rebuild in the verifier, or a
replay process that dies or exceeds its time limit (1200 s plus T / 1.5 s, at least 3600 s and at most 28000 s), is an
infrastructure error, not a score.
"""

[modes.standard]
# B/sim/server.py (RCB_AGENT_END=1 in every environment/docker-compose.yaml, S.agent_end L175): settle_window L120-144
# (stops once now_success; steps held before count: RestWatch.run), finish L146-167 (finished / timeout -> window;
# other reasons judged as they stand: rcb_agent_end.py END_STATE_REASONS L40), check_success L405-407, ctrl_step
# L515-526 (a fall / breakdown ends the episode: finish(S.end_reason); MAX_STEPS 200,000 -> "step_limit"), end_live
# L647-659 (the session's end -> finish("timeout")), on_submit_error -> finish("error") L768. Success rule as privileged
# (B/rcb_behavior.py L103-105, L1409-1413 now_success, L1427-1448). B/standard/grade.py L29-58: success = live and
# reason != "error" and not gave_up and not infra (missing / unreadable / unfinalized final.json, sim_crashed,
# resume_failed, instance_mismatch are infra_error; sim_crashed_on_call is gave_up, the agent's 0).
success = """
The relations above are OmniGibson's object states, evaluated on the simulator after every control step (30 Hz). An
object is *on* another (`ontop`) when the two touch and the other is directly below it; *inside* when the centre of its
bounding box lies in one of the other's container volumes; *next to* (`nextto`) when their bounding boxes are no farther
apart than a sixth of their mean side length and one is a horizontal neighbour of the other; *under* when the other is
directly above it; *touching* when the two are in contact. An object is *closed* when none of its openable joints is
more than 5 % of its range away from closed, and *switched on* when its toggle state is on.

Success needs more than these conditions: they hold for 30 consecutive control steps (1 s of simulated time), and on
each of those steps no object they name (furniture and floors included; a substance has no pose and is not checked) is
held by a gripper's assisted grasp, and each of those objects moves slower than 0.05 m/s. There is no partial credit.

Graded is the one live episode (no reset), judged by the simulator service; nothing is replayed. A success during the
episode neither ends it nor is reported. The episode ends at the agent's `/finish` or when the time limit ({timeout})
is up. The robot then holds its last command with the base still for up to 150 control steps (5 s), and the task passes
if the success rule holds at the end of that window (it stops as soon as the rule holds; steps that held before the end
count toward the 30). The episode also ends, with 0, when the robot has fallen over (its base more than 3 cm below the
floor, or its up axis tilted more than 41.4° from vertical, for 300 consecutive control steps, also within the window),
on a simulator breakdown (a non-finite robot state, the robot or a named object more than 10 km from the origin, or the
base faster than 100 m/s), or on a simulator error raised by an agent's call. At the runaway guard of 200,000 control
steps the episode ends and is judged as it stands, without the window.

Repeated service crashes that all happened while serving the agent's calls score 0. A frozen start that does not rebuild
(checked before the agent is served), a crash the episode cannot be resumed from, or a service that leaves no finalized
result is an infrastructure error, not a score.
"""

