# Toolkit manifest: table tennis x Franka Panda + paddle on the x-y rail base, LOW level ("Agent as Robotics
# Engineer", docs/construction_zh.md step 3; schema: skilleval/toolkit.py). Everything the low-level seat is given for
# its robot is listed here, the same for every player; anything else (the high level's hit skill and stroke planner,
# the simulator, the ball's state) is not available. The seat has this file as /opt/robot/toolkit.toml; /spec
# (toolkit) and the task's instructions name it. Changing it changes the task: bump [toolkit] version and sport.toml
# [sport] revision, refresh the sha256 (python3 -m skilleval.toolkit check sports/tabletennis/seat/toolkit.toml --fix)
# and re-run the evaluations (tools/check tabletennis --stages 6). tests/test_tabletennis.py
# (test_exploit_toolkit_is_the_manifest) checks it and the libraries.

[toolkit]
id = "tabletennis-franka-rail-low"
version = "2.0.3"   # 2.0.3 (revision 15/12): tt_servo 1.0.3, the setpoint generator at 0.9 of the velocity limits and the joint-velocity reflex; 2.0.2 (revision 14/11): tt_servo 1.0.2, the setpoint law of bodies/limits.JerkLimiter (jerk-limited braking relative to the reference); 2.0.1: tt_servo class names (SetpointModel, ServoModel), no change of the law
sport = "tabletennis"
level = "low"
configuration = "Franka Emika Panda (MuJoCo Menagerie panda_nohand, Apache-2.0) + table-tennis paddle on the flange, on an x-y rail base behind the end line (sport.toml [arm] franka_panda: the Panda's real limits; the rail's limits in /spec limits.base), revision wallclock-12+"
definition = "RoboOlympics two-mode definition (docs/construction_zh.md step 3, control foundation B: joint interface + robot tool library)"
decision = "2026-10-08: the low level gets an IK library (optional tool), provided the core-skill boundary test passes; the low level's task is to implement the high level's API hit(t, pos, normal, vel) from these tools. 2026-10-10 (screening, real-limits rail version): 9 joints, and the robot's own servo law as a model (tt_servo: the documented law of /spec limits.controller, the robot only), because under the real limits the servo's lag is large and a robotics engineer would have the controller's model"
optional = true                              # every tool but the joint interface is optional

[[tools]]
name = "joint_interface"
kind = "interface"
api = ["act traj {k0, q: rows of 9 targets [base_x, base_y, q1..q7]} (row i = control step k0 + i, <= 300 rows)",
       "act slew {q (9), speed}: every arm joint towards q at speed x its speed limit within its acceleration limit, the base with the rail's go-to law",
       "act hold",
       "act toss {pos, height} (your service)",
       "observe: q, qd, q_target, qd_target, command, step, base_xy, paddle_pos, paddle_normal, heard, t_since_played, ball_state, ball_in_play, score, point, serve (+ the cameras: the ball)"]
rate = "100 Hz: one target per joint per 10 ms control step (sim/action_low.py)"
checks = ["joint ranges (the model's; the base's travel)", "consecutive rows within the speed limit x 10 ms",
          "three consecutive rows within the acceleration limit x (10 ms)^2",
          "the first row used joins the target in force and its velocity within both (else rejected; the previous command goes on)",
          "<= 300 rows, finite numbers, an integer k0 >= 0"]
servo = "the robot's 1 kHz servo (game spec limits.controller): a jerk-limited setpoint within the real velocity, acceleration and jerk limits, torque = M qdd_sp + kp e + kd de + gravity/Coriolis within 87 / 12 N m and 1000 N m/s; the rail's jerk-limited setpoint and PD force within 620 N"

[[tools]]
name = "robot_model"
kind = "model"
file = "/opt/robot/robot_only.xml"
source = "seat/robot_only.xml"               # robot_model.py cuts it out of the match scene (exploit E6)
sha256 = "4960207d5040853292191d1616f0d9043e4627c284152d5bd0a3a60e44253be1"
api = ["MJCF of the rail base, arm and paddle only (nothing of the world): joints base_x, base_y, joint1..joint7, site paddle_center (the blade centre; the paddle body's local +x = the face normal, +z = the handle), the robot's self-collision pairs; meshes in /opt/robot/assets"]
frame = "the match frame: x to your right, y towards the opponent, z up; table top z = 0 (duel: each seat's own frame)"
license = "MuJoCo Menagerie panda_nohand, Apache-2.0 (LICENSE.menagerie-franka)"

[[tools]]
name = "robot_meshes"
kind = "data"
file = "/opt/robot/assets"
source = "sim/scene/assets"
sha256 = "182ce5a806fed0aad6a58b45754d88ee384cdc5640ae934f53b4c7f20bc4282b"
api = ["the mesh files robot_only.xml loads (MuJoCo Menagerie panda_nohand)"]
license = "Apache-2.0 (LICENSE.menagerie-franka)"

[[tools]]
name = "ik_library"
kind = "library"
file = "/opt/robot/lib/tt_kinematics.py"
source = "seat/lib/tt_kinematics.py"
sha256 = "58467d745ea3aff68239ddd1cfdfbf64fded4f93d1ec00b75f6ecf98c24dd179"
version = "2.0.0"
module = "tt_kinematics"
class = "PaddleKinematics"
needs = ["numpy", "mujoco==3.3.7"]           # both in the low-level seat image ([seat.low] pip)
api = ["fk(q9) -> (pos, R)", "jacobian(q9) -> (6, 9)", "paddle_velocity(q9, qd9) -> (v, w)", "within_limits(q9)",
       "solve(pos, normal=None, R=None, q0=None, base=(bx, by), ...) -> (q_arm7, err)",
       "solve_near(pos, normal=None, R=None, q_ref=None, base=(bx, by), vel_limit=None, ...) -> (q_arm7, err)",
       "stance(p_c, b_now) -> base", "base_goto(b, v, goal, a) -> (b, v, a)", "base_plan(b, v, goal, n, a) -> (rows, arrived)",
       "base_reach(b, v, goal, n_avail) -> (goal, short)"]
algorithm = "damped least squares on MuJoCo's own Jacobians (mj_jacSite) of the robot-only model: blade centre position + face normal (roll free), full rotation, or position only, the base held at a given position; joint ranges by clipping; solve_near: q_ref and 12 fixed starts, the accurate solution with the least speed-weighted travel. The rail: the slew's documented go-to law and the high level's documented stance rule"
deterministic = "no randomness at run time (the 12 starts are fixed at import), no threads, a fixed iteration budget"
same_as_high_level = "the hit skill solves its IK with the same algorithm (rally.Rally._ik, match._ik_best): the low level gets the same IK quality as the platform's skill, not a better one"
choice = "own numpy IK: the seat has mujoco + numpy only; mink needs a QP solver stack, pinocchio a compiled package and a URDF that would have to match the MJCF"
license = "the repository's"

[[tools]]
name = "servo_model"
kind = "controller"
file = "/opt/robot/lib/tt_servo.py"
source = "seat/lib/tt_servo.py"
sha256 = "99f0f30c3bac3adfbf974573f13528e8dd19ced0612bf7eea35bd3cad3cef796"
version = "1.0.3"
module = "tt_servo"
class = "RobotSim"
needs = ["numpy", "mujoco==3.3.7"]
api = ["RobotSim(xml).reset(q9, qd9, q_target9)", "RobotSim.step(q_target9): one 10 ms control step", "RobotSim.rollout(rows) -> per row (blade pos, normal, vel, q, qd)", "RobotSim.paddle() -> (pos, normal, vel)"]
algorithm = "the robot's own servo law exactly as game spec limits.controller documents it (the simulator's rcb_tt.TTServo: JerkLimiter + torque-rate limiter for the arm, the rail's jerk-limited setpoint), at 1 kHz on the robot-only model: the same motion as the robot without contacts with the world (tests: test_exploit_toolkit_is_the_manifest replays rows bit for bit)"
reads = "only the robot's own state (q, qd, the target in force) and the rows it is given: no ball, no table, no opponent"
deterministic = "float64 numpy and MuJoCo's integrator; no randomness, no threads"
license = "the repository's"

[limits]                                     # /spec limits; the same checks for the platform's hit and the player's commands
source = "bodies/franka_panda/body.toml (the Panda's joint velocity, acceleration, jerk, torque and torque-rate limits, manufacturer S1-S3) and the rail's (sim/rcb_tt.py BASE_*: 2 m/s, 8 m/s^2, 200 m/s^3 estimated)"
enforced_by = "bodies/limits.py (JerkLimiter, TorqueRateLimiter) in the robot's servo (sim/rcb_tt.py TTServo), the low level's row checks (sim/action_low.py validate, sim/arm_commands.py submit)"

[forbidden]                                  # the sport's core skill: the player develops it
skills = ["hit: our implementation, the high level's act {t, pos, normal, vel} (the paddle state at contact) - the player implements hit itself",
          "the stroke planner: match.Match.plan_paddle / _ik_best, rally.stroke_rows and bodies/trajopt.py (the limits-aware swing, timing, rehearsals, speed scaling), the duel's plan worker"]
modules = ["sim/action_high.py", "sim/match.py", "sim/workers.py", "sim/duel.py", "sim/rally.py", "lowlevel/evaluator.py"]   # not in the seat image
develop = "hit(t, pos, normal, vel): where the base stands, the swing trajectory (joint targets over time within the real limits) that delivers the requested paddle state at the requested time, paddle speed and face control at contact, the ready pose, compensating the servo's lag, re-planning when a new hit replaces the stroke under way"
privileged = "no simulator handle and no ball state: the ball only from the cameras"

[boundary]
baseline = "lowlevel/boundary"               # IK to the requested blade pose + slew there, no swing (ignores t and vel)
threshold = 0.05                             # its API-test success rate must stay at or below this (rule 5)

[variants]                                   # comparison variants of the low level (data kept, nothing deleted)
noik = "toolkit 0, the Season-1 low level (fixed base, 7 joints): no IK library, no hit task; results under revision wallclock-6+duel-wallclock-4+core-0.2 or earlier"
lowtk1 = "toolkit 1.0.0 (PR #31, fixed base, 7 joints, velocity limits only): IK library, the hit task; results under revision wallclock-6+duel-wallclock-4+core-0.2+lowtk-1"

[versions]
mujoco = "3.3.7"
numpy = "2.2.6"                              # the simulator image's; the seat installs numpy with mujoco
image = "ghcr.io/mll-lab-nu/efe:embodied-olympics-match-0.1.0"
