schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/maniguard-jar-transport-i25-privileged"
description = "ManiGuard (manipulation SAFETY benchmark; BEHAVIOR-1K v3.7.2 / OmniGibson on Isaac Sim 4.5, Franka Panda with long fin-ray fingers) jar_transport/task_0025: produce one replayable trajectory that completes the task while never breaking its LTLf safety specification. Close the lid of the hinged jar holding the box of yogurt, then carry the closed jar into the green goal sphere on the table. Frozen ManiGuard-Bench base task."
authors = [{ name = "qineng" }]
keywords = ["robotics", "maniguard", "safety", "ltl", "behavior", "omnigibson", "isaac-sim", "franka", "code-as-policy", "trajectory", "jar_transport"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "maniguard"           # ManiGuard on BEHAVIOR-1K v3.7.2 (OmniGibson 3.7.2, Isaac Sim 4.5; PhysX on the CPU)
robot = "franka-panda-longfinger"
family = "jar_transport"
mode = "privileged"               # privileged state, resets and thin primitives through the tooling (docs/PROTOCOL.md §3)
oracle = "none"
oracle_evidence = "No positive example yet (oracle = \"none\": the 16 ManiGuard tasks added on 2026-10-04 for variety ship without one, user decision). Upstream reference, cited only: ManiGuard's 40 scripted demonstrations of this task, episodes 1000-1039 of the Hugging Face dataset IDEAS-Lab-Northwestern/datagen-jar-v1-joint-5cam (revision 080dddb4, LeRobot, 30 Hz, CC BY-NC 4.0), recorded by ManiGuard's data generator in a differently built scene; none has been replayed through this verifier and none is copied into the task. The frozen instance (state sha 38c331dc1d5f4f70) was made on an RTX PRO 6000 (2026-10-04); a second fresh load gave the same hash. Human review per task (PROTOCOL §2.7)."
instance_seed = 25                 # = the ManiGuard-Bench task index (jar_transport/task_0025/base); scene = environment/instance/; identity = dataset.toml digest
expert_time_estimate_hours = 2.0
maniguard_task = "jar_transport/task_0025"
constraint_class = "ordering"
skill = "articulated"
grasping = "assisted"

[verifier]
timeout_sec = 7200.0              # two fresh-process replays: Isaac Sim launch + scene load each, then the trajectory
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 7200.0             # ManiGuard budget, both modes (docs/benchmarks/maniguard.md)
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py): ManiGuard's demonstrations and data generator are public
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 24576

[environment.healthcheck]
# The agent's clock starts once the simulator is ready (docs/PROTOCOL.md §2.9). The agent starts the simulator in its own
# processes, so before Harbor sets up the agent it runs this warm-up in the agent's container: one launch of the simulator
# with the frozen instance through the task's own tooling, which pays the trial's one-time start-up (shader and kernel
# caches, the instance check) outside [agent].timeout_sec. It writes no session log, trace or output; its log, with the
# start and end times, is /logs/artifacts/rcb_warmup.log (a trial artifact).
command = '''
exec >> /logs/artifacts/rcb_warmup.log 2>&1
date -u +"%FT%T.%3NZ warm-up start"
RCB_SESSION_LOG= RCB_SESSION_LOG_KEEP= RCB_AGENT_TRACE_DIR= timeout -k 30 3300 python - <<'PY' || exit 1
import json
from rcb_maniguard import Session
I = json.load(open("/app/instance/instance.json"))
s = Session(I["task"], instance="/app/instance")
s.close()
PY
date -u +"%FT%T.%3NZ warm-up done"
'''
timeout_sec = 3600.0
retries = 2

[verifier.environment]
build_timeout_sec = 1800.0
