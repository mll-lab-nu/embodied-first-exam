# Limited mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# GPU on sim, MuJoCo tasks only: KinDER's physics is CPU either way, but every image the agent asks for is rendered
# here (egl ~1 ms a frame, CPU osmesa ~50 ms); `graphics` is the capability that mounts the EGL driver. PyBullet draws
# its images on the CPU, so its tasks reserve none.
services:
  main:
    depends_on: [sim]
  sim:
    image: ghcr.io/jameskrw/rcb-kinder:0.1.6
    volumes:
      - ./sim:/srv:ro
    command: python /srv/server.py
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_TASK_TEXT: "Put the six brown rods lying on the floor (30 cm long) into the row of eleven narrow cupboards standing side by side ahead of the robot, one rod each, each into a cupboard's 40 cm-tall compartment: taking the rods in order of their distance from where the centre of the robot's base starts, nearest first, they go into the 11th, 5th, 2nd, 8th, 4th and 1st cupboard of the row, counted from the robot's left as it faces the row at the start."
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor, so one run can set them on the command
      # line (`RCB_RESET_BUDGET=3 harbor run ...`) without editing this file. The sim logs what it got (/spec).
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-0}"        # 0: one episode, as on a real robot; N: N resets
      RCB_OBS_ROOM_CAMERA: "${RCB_OBS_ROOM_CAMERA:-0}"  # 1: + room_camera, fixed in the room, never overhead
      RCB_OBS_DEPTH: "${RCB_OBS_DEPTH:-0}"              # 1: + depth (m) with each robot_wrist image (RGB-D)
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
