# Pipeline smoke test: HoldVLA in process on ALOHA cast_coil for 2 s of simulation (80 control steps).
policy:
  address: null                 # model server host:port; switching models changes only this line
  local: vla/configs/models/hold_aloha.yaml   # model config run in process via LocalClient instead
task:
  id: cast_coil
  variation: base
  seeds: [0]
  sim_seconds: 2
run:
  execute_steps: null           # null = PolicySpec.execute_steps
  record: true
  output: null                  # null = runs/test_results/<YYYYMMDD>_vla_<model>_<task>
env: {}                         # passed to topogym.make; grasp assist stays off (default)
