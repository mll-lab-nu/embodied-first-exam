schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/robolab-cooking-clear-plate-i00-privileged"
description = "NVIDIA RoboLab cooking_clear_plate (Franka + Robotiq 2F-85, Isaac Lab 2.3 / Isaac Sim 5.1): produce one replayable trajectory. Put the two measuring cups outside of the plate. Frozen scene instance (the state after RoboLab's canonical seed-0 reset)."
keywords = ["robotics", "robolab", "isaac-lab", "isaac-sim", "franka", "code-as-policy", "trajectory", "cooking_clear_plate"]

[metadata]
task_type = "trajectory"          # trajectory | policy   (see docs/protocol/README.md)
simulator = "robolab"             # NVIDIA RoboLab v0.3.1 on Isaac Lab 2.3.2 / Isaac Sim 5.1 (PhysX on the CPU, RTX rendering)
robot = "franka-robotiq-2f85"
family = "cooking_clear_plate"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "none"
oracle_evidence = "No reference solution: RoboLab ships no expert or planner. Positive examples graded 1 by the separate verifier: robolab-cooking-clear-plate-i00__M9JWo2C (robolab-cooking-clear-plate-i00-privileged, an earlier version of the task, run codex-gpt6_luna-xhigh, robolab-lunacx-0925-2038); robolab-cooking-clear-plate-i00__pjCZgi2 (robolab-cooking-clear-plate-i00-standard, an earlier version of the task, run codex-gpt6_luna-xhigh, robolab-lunacx-0925-2038; not published: its eai-standard/2.1 batch was withdrawn for the agent's stale wrist-camera pose; grader unaffected). Re-graded with the current term (one fresh process per trajectory and tooling version): both cited positives pass the earlier term and fail the current one: in __M9JWo2C the blue scoop (spoon_1) ends on the floor beside the table (z -0.69 m) and the orange cup is not supported by the table, which -i00's object_outside_of counted as outside the plate. No positive confirmed under the current term yet. Human review per family (PROTOCOL §4)."
instance_seed = 0                 # scene = environment/instance.json (the full scene state after the seeded reset + its hash); identity = dataset.toml digest
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 29100.0             # two fresh-process replays at tests/grade.py's limit for the longest accepted trajectory
                                  # (replay_timeout(100,000 rows) = 900 s + rows / 7.5 = 14,234 s each) + 600 s; a usual
                                  # trajectory (up to 6,750 rows) keeps the old 1800 s per replay
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # PROTOCOL H.6: the verifier has no network

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0              # RoboLab budget, both modes (tasks/robolab/README.md): every Python process pays ~2 min of Isaac Sim launch + scene build
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 29696
storage_mb = 10240
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada", "RTX PRO 6000 Blackwell"]

[verifier.environment]
build_timeout_sec = 5400.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
