schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/episode.json", service = "sim" },             # the live result the service dumped at the episode end
  { source = "/data/server.log", service = "sim" },               # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },              # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },           # crash recovery: one line per service start
  { source = "/data/replay.json", service = "sim" },              # the collect hook's fresh-process replay
  { source = "/data/replay.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/topogym-blanket-flatten-medium-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): TopoGym blanket_flatten on the same frozen instance as the privileged task. Unfold and spread the blanket flat on the table without overlaps or excessive stretching, then release it and withdraw. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "aloha", "standard-mode", "trajectory", "blanket_flatten"]

[metadata]
author_name = "jianwen"
task_type = "trajectory"
simulator = "topogym"
robot = "aloha"
family = "blanket_flatten"
mode = "standard"                  # RGB + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.2"
oracle = "none"
oracle_evidence = "No reference solution (no solution/). The frozen instance was validated by the build: it builds in a fresh process (seed < 2^31) and holds still under hold checks in a fresh container, and a verifier replay grades without a grader error. No graded positive yet. Human review per family (protocol \u00a72.7)."
difficulty = "medium"
grasp = "physical (no assisted grasping)"
success_rule = "his default success (goal_complete True; terminal revision release_settling_v1)"
initial_state = "re-prepared in rcb-topogym 0.2.3 with his scripts/prepare_blanket_initial_states.py (--tier, seed 0, --acceptance scene_layout); his archived gathered_scene_v1 states do not restore in 0.2.3 (backend identity: world_sha256 of topogym/world/genesis_world.py, changed by his seed fix in 76583213; underneath, the RigidSolver layout mismatch of 0.2.1 / 0.2.2: collision verts 13876 archive vs 14008 live)"
instance_seed = 0
expert_time_estimate_hours = 3

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, one fresh-process replay with the video, write final.json
timeout_sec = 27000              # the end (a resume replay included) <= 1 h, the replay <= the agent's budget

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
