# README data for tasks/humanclaw/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   metric       HumanCLAW's paper metric recorder, unchanged: harnesses/humanclaw/src/humanclaw_bench/evaluation/metrics/
#                episode.py at the source snapshot fe3d376 (tree f60d71a0; read with `gh api .../contents?ref=fe3d376`,
#                and compared with Human-CLAW/HumanCLAW main @ 6323d93: the success code is the same). record_motion
#                L130-160 (a Sit counts, pelvis-target contact on the last physics frame of each motion), finalize
#                L162-230: NavSR@20cm = active_stop and body_target_aabb_distance_m <= nav_distance_m (L172, L220;
#                configs/paper_fullval_v1.json "nav_distance_m": 0.2); InteractSR = interact category and active_stop and
#                n_sit > 0 and the last motion's pelvis-target contact (L200-205). Geometry: envs/find_nav_interact_env.py
#                metric_target_geometry L375-386 (body points to the goal objects' boxes), is_pelvis_target_contact
#                L393- (the pelvis touching one of the episode's goal object meshes).
#   tooling      embodied_first_exam/benchmarks/humanclaw/hc_core.py (docstring L16-32: action rows, 100 actions, only a
#                stop can succeed; Session._finish L273-280 picks the rule by category)
#   privileged   .../humanclaw/grade_privileged.py (tests/grade.py) L49-87 and hc_tools.py load_actions L154-168,
#                replay L171-198
#   standard     .../humanclaw/server.py (docstring L1-21; finish = the stop L182-207; the session end runs the stop
#                first L210-226); environment/docker-compose.yaml RCB_RESET_BUDGET "0"

