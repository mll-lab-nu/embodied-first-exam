# README data for tasks/metaworldplus/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   upstream  Meta-World @ 59fc34d, metaworld/envs/sawyer_<env>_v3.py: `evaluate_state` (its "success" key) and the
#             values it takes from `compute_reward` / `_get_pos_objects`; TARGET_RADIUS defaults to 0.05
#             (metaworld/sawyer_xyz_env.py L156) where an env does not set its own.
#   graders   embodied_first_exam/benchmarks/metaworldplus/privileged/tests/grade.py (one fresh-process replay) and
#             .../privileged/environment/mw_tool.py (Session.replay / step / check: info["success"] of env.step);
#             embodied_first_exam/benchmarks/metaworldplus/sim/server_mw.py finalize() (S.check() on the live state)
#             and .../standard/tests/grade.py.
# Line numbers below are those of the pinned upstream files.

[benchmark]
name = "Meta-World"
citation = "McLean et al., 2025"     # upstream README "Citation": Meta-World+ (NeurIPS 2025 D&B); original: Yu et al., 2019
url = "https://github.com/Farama-Foundation/Metaworld"
repo = "Farama-Foundation/Metaworld"
commit = "59fc34d"

[license]
text = """
Meta-World ([Farama-Foundation/Metaworld](https://github.com/Farama-Foundation/Metaworld) @ `59fc34d`) is released
under the [MIT License](https://github.com/Farama-Foundation/Metaworld/blob/59fc34d7768af9785e4688c3e1db671424f4a6c3/LICENSE)
(Copyright (c) 2019 Meta-World Team). The Sawyer robot and object models (MuJoCo XML and meshes) used here ship in that
repository under the same license; no non-commercial terms apply. The simulator is MuJoCo 3.3.0 (Apache License 2.0).
Meta-World's scripted policies (`metaworld/policies/`) are not part of the task image.
"""

[robots]
sawyer = "Rethink Robotics Sawyer arm with a two-finger gripper"

# privileged/tests/grade.py main(): missing file -> missing_trajectory; mw_tool.load_npz (<= 2 MB, .npy members only,
# <= 64 members, no pickle), ["actions"] KeyError, mw_tool.as_actions (shape (T, 4), finite, clipped to [-1, 1]) and
# 1 <= T <= MAX_STEPS = 500 -> invalid_trajectory; one subprocess replay (Session.replay: reset to the frozen instance,
# step each row, success = info["success"] after the last row); a simulator instability raises in Session.step
# (env._did_see_sim_exception) -> the replay process fails -> grader_error, success 0.
[modes.privileged]
success = """
The check is Meta-World's own success test for `{env}-v3` (`evaluate_state`, its `success` value), applied to one
state: the state after the last action of the delivered trajectory. The verifier, in a separate sandbox without
network, replays `/app/output/trajectory.npz` (array `actions`, shape (T, 4) with 1 ≤ T ≤ 500, values clipped to
[-1, 1]) once, open-loop, in a fresh process from its own copy of the frozen start, one action per control step.
Meeting the condition at an earlier step does not count. The target point is `target_pos` of `s.state()`; distances
are straight-line distances in metres in the world frame unless the axes compared are named.

A missing file scores 0, and so does an invalid one: not a plain `.npz` of at most 2 MB holding only arrays (at most
64 members), no `actions` array, a shape other than (T, 4), a NaN or infinite value, or T outside 1 to 500. A replay
during which the simulator becomes unstable scores 0.
"""

# sim/server_mw.py: RCB_AGENT_END=1 (docker-compose), POST /finish -> finish("finished"); SIGUSR1 from the collect hook
# at the session's end -> finish("timeout"); no RCB_MAX_CONTROL_STEPS / RCB_STEP_LIMIT in the compose (no step cap); no
# reset endpoint; a simulator error -> finish("error"). finalize(): success = S.check() on the live state after the last
# executed control step AND reason != "error" AND reason in ("finished", "timeout", "step_limit"); the success is never
# shown (hidden_success_*). _check_start(): RCB_INSTANCE_SHA / RCB_START_SHA mismatch -> instance_mismatch, infra_error.
# standard/tests/grade.py: success = final.json success AND live_success AND no infra_error AND reason != "error".
[modes.standard]
success = """
The check is Meta-World's own success test for `{env}-v3` (`evaluate_state`, its `success` value), applied to one
state: the live simulator's state after the last executed control step of the one episode; nothing is replayed. The
episode ends when the agent sends `/finish`, or when the agent's session ends (at the latest after {timeout}); there is
no reset, no step limit and no other termination. Meeting the condition earlier in the episode does not count, and the
service never reports success while the episode runs. The target point is `meta["task"]["target_pos"]`; distances are
straight-line distances in metres in the world frame unless the axes compared are named.

An episode ended by a simulator error (actions that make the simulation unstable) scores 0. The scene is checked to
start at the frozen instance (instance and starting-state hashes) before the agent is served; a mismatch is an
infrastructure failure, not a score.
"""

