# Generated by scripts/dexjoco/generate.py -- edit the generator or the instance, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  { source = "/data/replay3.log", service = "sim" },           # and its third, which renders replay.mp4
  "/app/output/",
]

[task]
name = "robot-coding-bench/dexjoco-hammer-nail-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): DexJoCo hammer_nail (a Franka Panda arm with a 16-DoF Allegro hand) on the same frozen instance as dexjoco-hammer-nail-i00-privileged. Pick up the hammer and drive the nail into the wooden block by striking its head. The agent only gets a client: calibrated cameras (RGB, optional depth), the robot's joints and tcp poses, tcp-target + hand-joint chunks at 50 Hz, the robot's kinematics; one episode, no reset, no object state; the sim service records the episode, replays it in fresh processes and grades it."
authors = [{ name = "Chi Gui" }]
keywords = ["robotics", "dexjoco", "mujoco", "allegro", "dexterous-manipulation", "standard-mode", "robot-as-a-service", "hammer_nail"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"
simulator = "dexjoco"
robot = "franka-allegro"
family = "hammer_nail"
mode = "standard"
protocol = "eai-standard/2.2"
oracle = "full"
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 4.0
min_memory_gb = 5.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 4.0
verifier_min_gpu_memory_gb = 0.0
measured = "memory: sim 1.9 GB, privileged container 2.1 GB, verifier 2.1 GB, mem_guard (docker memory per container, ws-1, 10-02..10); CPU-only; CPUs: 4, visible to each container that runs the simulator (cpuset / affinity, not a quota): OpenBLAS runs no more threads than that and DexJoCo's result differs below 4 (docs/benchmarks/dexjoco.md, Threads); with fewer there is no verdict (too_few_cpus, infra_error)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 14.0
measured = "memory: no samples of the agent's container; floor 8 GiB (at most the 8 GiB cap); whole trial: + the sim service's 6 GiB (docker peak 1.9 GiB, 2 samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 4.0, memory_gb = 10.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 8.0, pids = 8192 }

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json, video
timeout_sec = 7200                # two replays of an episode without a step cap, then the video (finalize.sh: RCB_COLLECT_BUDGET_S)

[agent]
timeout_sec = 5400.0
network_mode = "allowlist"        # the reference demonstrations are public on Hugging Face (PROTOCOL §2.7)
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
