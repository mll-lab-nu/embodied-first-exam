#
# Sources checked for every success text:
#   upstream  VLABench @ cf588fe (OpenMOSS/VLABench), VLABench/tasks/dm_task.py: init_conditions L202-223 (the
#             conditions of the episode configuration, i.e. each task's instance.json episode.task.conditions, all of
#             them at once: ConditionSet), should_terminate_episode L298-303; tasks/condition.py: OrderCondition
#             L30-41 (abs() patch: images/vlabench/Dockerfile), ContainCondition L57-64, NotContainCondition L83-90,
#             IsGraspedCondition L105-110,
#             ButtonPressedCondition L119-120, AboveCondition L167-176, PourCondition L192-199, JointInRangeCondition
#             L272-278, LiftCondition L292-297, ConditionSet.is_met L309-311; tasks/components/entity.py: key_sites
#             L115-125 (group-3 sites), get_xpos L138-139 (the entity's root frame), CommonGraspedEntity.is_grasped
#             L236-248 / get_grasped_keypoints L250-260; tasks/components/container.py: CommonContainer.contain L46-54,
#             FlatContainer _build z_threshold = 0.1 L63-71 and contain L84-102, ContainerWithDoor L126-153
#             (close_threshold = pi/10); tasks/components/specific_entities/common_containers.py: BilliardTable
#             L76-95, Shelf.contain L171-173; button.py L32-52; interactive_containers.py Microwave.is_activate
#             L111-120; robots/single_arm/franka.py gripper_geoms L32-35.
#             The asset annotations (keypoint, grasp-point and horizontal_radius sites, joints) are read from
#             lerobot/vlabench-assets @ 08d7a44, the files each instance.json names.
#   tooling   embodied_first_exam/benchmarks/vlabench/privileged/environment/vlb_tool.py: MAX_STEPS = 4000 L37,
#             load_npz L66-87, Session.reset L197-228 (hash checks L202-207; RCB_AGENT_END: the termination check
#             replaced by a never-terminating one, the original kept as the success check, L208-210), _env_step
#             L230-241 (clip into the actuator bounds; done = the native termination), replay L269-277 (a row after
#             the termination raises EpisodeOver), status L310-312.
#   graders   privileged/tests/grade.py L71-84 (missing / invalid file), L85-110 (one fresh-process replay, 3600 s;
#             exit 2 = invalid trajectory), L111-113 (any other failure = grader_error); sim/server.py EVENT_TASKS L58,
#             end_judgement L80, step L171-173; standard/sidecar/rcb_service.py END_STATE_REASONS L131, _judged L682-685, _step
#             L939-957, _end L959-976; embodied_first_exam/standard/sidecar/grade.py L113 (reason "error" is 0).
# Positions are entity origins (Entity.get_xpos). VLABench places a control step at 0.1 s = 100 physics steps of 1 ms.
# The table top of the `Table` asset (obj/meshes/table/table.xml) is at z = 0.735 + 0.025 = 0.76 m.

