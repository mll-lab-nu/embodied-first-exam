# privileged tests/grade.py: no file -> missing_trajectory (0); load_trajectory L47-74: not a zip, no task.npy /
# actions.npy, a member over MAX_STEPS x 8 x 8 bytes + 1 MiB (too_large), allow_pickle=False errors, task != family
# (wrong_family), shape != (T, 8), T > MAX_STEPS = 100,000, NaN/inf -> 0. L126-150: up to --repeat 3 replays
# (tests/test.sh), each `rcb_robolab.py replay` in a fresh process, stop at the first success; L151-155 success = a
# replay succeeded AND every run's instance_matches; no result / time-out / instance_ok 0 -> grader_error = infra_error.
# rcb_robolab.py Session.replay: reset, rows stepped until the env terminates (the success term holds: RoboLab freezes
# the env, env.py L75-118), then settle() holds the last row up to 30 control steps while not terminated; status()
# success = RoboLab's env result (the success term terminated the episode). AGENT_END is not set in the verifier.
[modes.privileged]
success = """
The condition above is RoboLab's own success term for `{family}`, evaluated after every control step. The verifier, in a
separate sandbox without network, replays `/app/output/trajectory.npz` open-loop from its own copy of the frozen start,
one row per control step (15 Hz), up to 3 times, each in a fresh process, and stops at the first replay that succeeds. A
replay succeeds as soon as the condition holds at one control step: RoboLab then ends the episode and later rows are not
executed. After the last row, the last row is held for 30 more control steps (2 s) and the condition is still checked at
each of them. The task passes if any replay succeeds.

A missing file scores 0, and so does an invalid one: not an `.npz` archive, no `task` or `actions` array, a `task` other
than `{family}`, pickled or object arrays, an array larger than 100,000 × 8 numbers, `actions` not of shape (T, 8) with
T ≤ 100,000, or a NaN or infinite value. If the rebuilt start scene does not match the frozen instance (its state hash,
or else every object pose and robot joint within tolerance), or a replay process fails or runs out of time, the trial is
an infrastructure failure, not a score.
"""

# sim/server.py (RCB_AGENT_END=1 in the compose): ctrl_step L370-378: the success term is hidden (rcb_robolab
# _hide_success_term: evaluated every step, never terminates, value in term_now); S.step over -> finish("step_limit")
# at MAX_STEPS, else "failed" (a RoboLab termination other than success: only the stretched time_out exists).
# finish() L89-127: for "finished" (POST /finish) and "timeout" (collect hook at the session's end) with steps run,
# the last command held for SETTLE_STEPS = 30 control steps (a simulator error in the hold: judged as it stands);
# success = reason in (finished, timeout, step_limit, error) AND term_now (the term at the last control step).
# Instance check before serving (L136-141): instance_matches false -> give-up, infra_error. standard tests/grade.py:
# success = final.json success AND not infra_error AND finalized AND reason != "error".
[modes.standard]
success = """
The condition above is RoboLab's own success term for `{family}`, applied to one state: the live simulator's state at
the last control step of the one episode; nothing is replayed. The episode ends when the agent sends `/finish` or when
the agent's session ends (at the latest after {timeout}). The agent's last command is then held for 30 more control
steps (2 s), and the condition is judged at the last of them. There is no reset. The service evaluates the condition
after every control step but never reports it and never ends the episode on it, so meeting the condition earlier in the
episode does not count.

The episode also ends at a technical cap of 100,000 control steps; that state is judged as it stands, with no hold. An
episode ended by a simulator error scores 0, and so does one the service gives up on after repeated crashes inside the
agent's calls. The scene is checked to start at the frozen instance (its state hash, or else every object pose and robot
joint within tolerance) before the agent is served; a mismatch, a give-up after crashes between calls or a failed resume
is an infrastructure failure, not a score.
"""

