# tests/pbd_cloth_spike.py 的运行模式参数。
#
# 布的几何、材料与护栏参数不在这里 —— 它们在 task 配置的 cloth / grasp 块
# （cloth_fold），用点路径覆盖即可扫参：
#   task.cloth.particle_size=0.004
#   task.cloth.bending_compliance=0.05
#   task.grasp.weld_radius=0.030

defaults:
  - default
  - _self_

# 做哪一项测试：
#   settle  : 布自由静置，量平整度基线与自发漂移（判据阈值要从它出发）。
#             **要配 task.cloth.z=0.050 从高处放手**：2026-08-17 那次生成高度正好
#             等于平衡高度，全程零位移，分不出「没事可做」和「根本没在仿真」。
#   grip    : 四种「让布跟着夹爪走」的方式，在同一次垂直提起上对比：
#             布跟上了命令高度的百分之多少，以及材料为此要拉伸多少
#   speed   : 吸附状态下横拖，扫末端速度，找布开始发散的那条线
#   fold    : **真正的任务动作**：把边提起、越过中线、放到另一半上、松手、静置。
#             回答唯一还能推翻方案的问题——两层布叠上去会不会互相穿过去。
#             PBD 的自碰撞会漏是本仓自己的历史（两根绳应隔 12mm，实测 2.5mm、
#             互嵌 5.5mm，见 rope_contact_sweep.sh）。层分不开的话，
#             「上下层重叠率」「层数 3→1」这类判据在 PBD 下就做不出来。
#   pinch   : 在布上合拢手指（挤压）。contact 测不到这个——它是闭着手指往下降。
#   contact : 闭合手指下降到布面附近，是否 native segfault
#             （1.1.0 上会；1.2.1 上 2026-08-17 实测不会，撑到净空 0）
#   all     : 依次跑 settle -> grip -> fold -> speed -> pinch（**不含 contact**，见下）
# `contact` 不进 all：它可能整个进程 core dump，跑在别的测试前面会把它们一起带走。
# `pinch` 排在 all 的最后：它是这四项里最可能发散的。
test: settle

# contact：手指从布面上方多少开始下降、每步降多少、降到离布面多近为止。
# 每一步都 flush 一行，所以万一 segfault，最后一行就是崩溃时的净空。
contact_start_clearance: 0.060
contact_step: 0.002
contact_min_clearance: 0.000

# speed：横拖的指令速度（米/步）。扫参用 -m run.drag_speed=0.004,0.012,0.024,0.048。
# **步数固定、距离随速度变**：2026-08-17 那次距离固定，最慢档跑 45 步而最快档只跑
# 4 步，而发散需要几步才发展得起来——那个扫参在高速端根本没机会看到问题。
drag_steps: 60
# 参考量级：现有 demo 的指令速度是 0.9~2.0 mm/步。
# 隧穿的理论门槛是 v * substep_dt > particle_size/2，即 particle_size=0.006、
# substep_dt=0.0025s 时约 1.2 m/s = 12 mm/步 —— 比 demo 速度高一个量级，
# 所以这一项要是先炸，炸的原因不是隧穿。
drag_speed: 0.002

# grip / speed 共用的提起量。用哪种附着方式由 task.grasp.attach_mode 决定。
lift_delta: 0.060

# 每项测试之前的落布步数。布出生在桌面上方 cloth.z，会先掉下来；不先落稳的话
# 每项测试开头量到的都是这段下落，weld 的静止边长也会取在下落中途。
presettle_steps: 60

# settle：落稳之后再静置多少步（量平整度基线与自发漂移）。
settle_steps: 300

# 每隔多少步打印一行采样。
sample_every: 25

# ---- fold ----
# 抓哪里，以及折到哪里去：
#   corner   : 抓离机械臂最远的那个角，折到对角上（三角折）。**默认**。
#              平摊在桌上的布，夹爪唯一能「下得去手」的地方就是角。
#   edge_mid : 抓近侧边的中点，对折到另一侧（半折）。2026-08-18 那次用的就是这个。
grasp_at: corner
# 抓取点从边/角往里缩多少。焊接盘半径 0.018，正对着角的话有一半悬空、
# 两侧抓到的粒子数不等，一提起来就会歪。
grasp_inset: 0.020

# 动作被切成几段，每段结束打印一行布的状态；配 run.stop_after 可以停在任意一段
# 之后让 viewer 冻在那里（无 viewer 时直接退出，免得批处理挂住）。
#   attached / lifted / apex / placed / released / done
# **lifted 是最有诊断价值的一段**：它只往上提、完全不横移。如果整片布在这一段
# 就跟着起来了，那问题在材料的软硬与轻重，与划弧、与速度都无关。
stop_after: null

# 轨迹是「被抓的角绕折线转半圈」，半径由布料自己定（抓取点到布心的距离），
# 所以没有「提多高」「弧顶多高」这两个自由参数 —— 它们本来就不自由：
# 手离折线比布料长就是在拉伸布（其余部分被拽过来），比布料短太多布就松垂到
# 桌上、然后被横着拖走。2026-08-19 那次两头都犯了（提起时超 5.6mm，弧顶矮 61mm）。
#
# fold_slack：半径取布料长度的百分之多少。略小于 1，让布是被托着而不是被绷着。
fold_slack: 0.98
fold_steps: 240

# 被抓的角怎么走。三条路径共用同一套测量，所以数字可以直接对比 ——
# 判据的阈值要卡在「做对了」和「做错了」之间，只有一边定不出来。
#   fold    绕折线转半圈，就是任务本身
#   drag    平面路径一样，但全程不离开桌面（docx 1.1 的「贴地拖拽不提起」）
#   crumple 把角贴着桌面向内绕一圈收到中间，布堆起来而不是折过去
#           （docx 1.1 的「揉成一团同样能让面积减半」——覆盖面积分不出来的那种错法）
motion: fold

# 把远端那半布钉在桌上再折。**这是判别用的，不是任务的一部分。**
# 「布太硬折不动」和「没东西压住远端、整片被拖走」这两件事从外面看一模一样；
# 钉住远端就把后者排除掉：钉住之后能折 = 布本身没问题，去调摩擦和重量；
# 钉住之后还是折不下去 = 布确实太硬。
#   none         不钉（默认，任务的真实设置）
#   far_half     折线另一侧全部钉住
#   far_quarter  只钉外侧那一半，靠近折线的部分仍可被压上来的那层顶起
pin: none
fold_settle_steps: 150
# 算「有多少粒子离开了桌面」时的高度阈值（米）。取一个粒子直径。
lift_threshold: 0.004
# 自接触判据：静止时距离小于「这个倍数 × particle_size」的粒子对算同一片材料，
# 不计入自接触。剩下的粒子对在对折后的最近距离就是层间净空——接近 particle_size
# 说明两层是叠着的，接近 0 说明穿模了。
neighbour_radius_scale: 3.0

# grip 的形变判据用的近邻数。图建在**仿真粒子**的静止位置上，不用控制网格的边
# （Genesis 会重网格化：1089 个控制顶点进去、1398 个粒子出来，控制网格的编号
#  查到的是「碰巧排在那个号上的粒子」）。
rest_neighbours: 4

# pinch：合拢到的半宽（米）与合拢后保持的步数。
# 参照量是 particle_size/2 —— 单层布的半厚。扫参跨过它：
#   -m run.pinch_qpos=0.001,0.002,0.003,0.005,0.008
# 挤压不是在合拢那一步发散，是在之后每一步求解器都解不出可行位置时发散，
# 所以要保持住再看。
pinch_qpos: 0.003
pinch_hold_steps: 200

# 看门狗阈值。触发即记录（settle/weld/speed/pinch 会停下，contact 只记不停——
# 它要回答的是「进程活没活下来」）。spike 的目的就是找到触发条件，
# 所以这里是记录而不是防御。
#   disp_ratio    : 单步粒子位移允许达到「驱动端单步位移」的多少倍。
#                   固定阈值分不出「被指令拖得快」和「发散」：2026-08-17 那次
#                   末端每步走 8mm，粒子当然也走 8mm，20mm 的线永远不响、
#                   3mm 的线次次响。发散的定义是材料跑赢了驱动它的东西。
#   max_step_disp : 上面那条的绝对下限（米），给不驱动的 settle / 几乎不驱动的
#                   contact 用。取半个粒子。
#   max_speed     : 任一粒子的最大速率（米/秒）。绝对兜底。
#   min_z_below   : 最低粒子相对桌面的高度低于这个值即判为穿透（米，负值）
disp_ratio: 3.0
max_step_disp: 0.003
max_speed: 3.0
min_z_below: -0.005
