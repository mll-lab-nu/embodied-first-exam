# README data for tasks/embodied-olympics-match/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every text below (B/ = embodied_first_exam/benchmarks/embodied-olympics-match/; each task's own
# exported files under tasks/embodied-olympics-match/<task>/, listed in ci_checks/benchmarks/embodied-olympics-match/
# exported.toml):
#   standard, realtime  B/shared/tests/grade.py grade() L96-172 (valid = valid_trial, finalized, live or replay
#               agreeing, complete = reason in match_over / ready_timeout / clock / abandoned / no_show with a winner,
#               no errors; success against a scripted opponent = valid and the agent's side won; a real-time match's
#               world_step error after the agent's first applied act = valid, 0); B/standard-realtime/tests/
#               fexam_reward.py (duels: success = valid_trial and A_won; infra_error = technical_failure or
#               grader_error); each task's environment/docker-compose.yaml (RO_VERDICT_REPLAY=0: graded live).
#   privileged  B/privileged/tests/grade.py (tools.fullsim.formal.evaluate; a verifier failure -> infra_error) and
#               B/privileged/environment/fullsim/tools/fullsim/formal.py evaluate() L130-360 (the program as nobody in
#               its own process, a fresh match on the original clock; success = valid (valid_trial, reason match_over,
#               the core's fresh-process replay agreeing, no program error) and match_winner A; a program error, a
#               call over 5 s, not one command response per observation, the wall cutoff, a process left behind -> 0;
#               the trusted service's own failure or a disagreeing replay -> infra_error). The G1 table tennis twins
#               use their own runner (tests/formal.py): see that family's comment.

[benchmark]
name = "Embodied Olympics - Match"
citation = "Embodied Olympics authors, 2026"   # no paper; the private upstream repository
url = "https://github.com/CHIGUI0/roboolympics"
repo = "CHIGUI0/roboolympics"
commit = "0d7f680"                             # the export commit of the privileged twins' full simulator (tools/fullsim/session.py FROZEN); each task's own export commit: [benchmark] others
others = """
Exported by the {md[exporter]} from its task `{md[source_task]}` (upstream commit
`{md[source_commits][0]}`). The files changed here after the export are listed for this task in
`ci_checks/benchmarks/embodied-olympics-match/exported.toml`.
"""

[license]
text = """
Embodied Olympics ([CHIGUI0/roboolympics](https://github.com/CHIGUI0/roboolympics), a private repository) is released
under the MIT License; its exported match services, referees, scripted opponents and graders inside this task are MIT
too. The simulator is MuJoCo (Apache License 2.0). No non-commercial terms apply.
"""

[modes.privileged]
success = """
Graded: one formal match, played after the agent's session in a separate verifier container without network by the
agent's final program, from a fresh, unmodified start against the same opponent; nothing the agent played during its
session counts. The task is passed only if that match ends by the rules above with the program's side as the winner.
A program that fails to load, raises, breaks the call rules above, or leaves a process behind scores 0. A failure of
the verifier or of the trusted match service, or a replay of the match record that disagrees with the match, is an
infrastructure failure, not a score.
"""

[modes.standard]
success = """
Graded: the live match, as the trusted match service recorded it while it was played; nothing is replayed. There is
one match and no reset, and the agent cannot end it with `/finish`: the match's rules end it. A technical failure of
the match service (a crash, an error in its bookkeeping, rendering or metering) voids the trial as an infrastructure
failure, not a score.
"""

[modes.realtime]
success = """
Graded: the live match, as the trusted match service recorded it while it was played; nothing is replayed. The world
runs on a clock that does not stop: one second of game time takes {slowdown} s of real time. There is one match and no reset,
and the agent cannot end it with `/finish`: the match's rules end it. A technical failure of the match service (a
crash, an error in its bookkeeping, rendering or metering) voids the trial as an infrastructure failure, not a score.
"""

[robots]
franka-panda = "Franka Emika Panda arm on a moving base (an x-y rail in table tennis, a gantry in badminton), holding a paddle or racket"
unitree-g1 = "Unitree G1 humanoid"
booster-t1 = "Booster T1 humanoids (the agent's team)"
ssl-robot = "RoboCup Small Size League omnidirectional wheeled robots (the agent's team of five)"
foosball-rods = "The four rods of one side of a foosball table"

