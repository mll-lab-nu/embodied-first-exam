# Seed 2 of this match (tests/match_instance.json under this directory: the privileged verifier's frozen settings); the text
# that names the seed: compose RO_SEED, the privileged instruction, the full-simulator adapter's INSTANCES.

[[replace]]
old = "RO_SEED: \"7\""
new = "RO_SEED: \"2\""

[[replace]]
old = "\"seed\": 7}"
new = "\"seed\": 2}"

[[replace]]
old = "level=4, seed=7)"
new = "level=4, seed=2)"

[[replace]]
old = "--seed 7 "
new = "--seed 2 "

[[replace]]
old = ", seed 7:"
new = ", seed 2:"

[[replace]]
old = ", seed 7,"
new = ", seed 2,"

[[replace]]
old = ", seed 7\n"
new = ", seed 2\n"
