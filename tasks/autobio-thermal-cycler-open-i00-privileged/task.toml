# Generated by scripts/autobio/generate.py -- edit the generator, the shared sources, families.json or the instance, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/autobio-thermal-cycler-open-i00-privileged"
description = "AutoBio thermal_cycler_open (Open thermal cycler lid; a biology laboratory bench on MuJoCo): produce one replayable trajectory of joint position targets. Open the lid of the thermal cycler. Frozen scene instance (AutoBio's reset, seed 0); graded by two fresh-process replays with AutoBio's own check."
authors = [{ name = "Canyu Chen" }]
keywords = ["robotics", "autobio", "mujoco", "laboratory", "biology", "ur5e-robotiq-2f85", "code-as-policy", "trajectory", "thermal_cycler_open", "privileged"]

[metadata]
author_name = "Canyu Chen"
task_type = "trajectory"
simulator = "autobio"             # AutoBio @ 0850421 on MuJoCo 3.3.0 (CPU)
robot = "ur5e-robotiq-2f85"
family = "thermal_cycler_open"
mode = "privileged"
oracle = "full"
difficulty = "easy"              # AutoBio's own level for the task
success_rule = "first"
instance_seed = 0                 # AutoBio's reset(seed=0) of ThermalCyclerManipulate
expert_time_estimate_hours = 1.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 4.0
min_memory_gb = 8.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 8.0
verifier_min_gpu_memory_gb = 0.0
measured = "author (merged PR #94): CPU-only, 4 CPUs and 8 GB per trial, verifier the same"

[metadata.resources.limits]
# agent-phase limits; exceeding one fails the trial. scope: trial = every container, agent = the agent's container (docs/PROTOCOL.md §2.10)
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app"]
sustain_sec = 60.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 8.0

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# AutoBio's scripted experts are in its public repository and its recorded demonstrations on Hugging Face (and a
# standard-mode agent could rebuild the simulator from the repository): the agent reaches the model APIs and nothing
# else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
