schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/topogym-hedgehog-in-cage-very-easy-i00-privileged"
description = "TopoGym hedgehog_in_cage (panda_robotiq, Genesis): produce one replayable trajectory. Separate and place the whole hedgehog ball, including every spike inside the green dashed goal region. Keep all cage components on the puzzle/system side. Frozen scene instance (variation very_easy, seed 0)."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "panda_robotiq", "code-as-policy", "trajectory", "hedgehog_in_cage"]

[metadata]
author_name = "jianwen"
tooling_version = "18"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "topogym"             # TopoGym on Genesis 1.2.1 (CPU float64 physics, Nyx RGB)
robot = "panda_robotiq"
family = "hedgehog_in_cage"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "none"
oracle_evidence = "No reference solution (no solution/). The frozen instance was validated by the build: it builds in a fresh process (seed < 2^31) and holds still under hold checks in a fresh container, and a verifier replay grades without a grader error. No graded positive yet. Human review per family (protocol \u00a72.7)."
difficulty = "very_easy"               # the variation's tier (docs/TAXONOMY.md)
grasp = "assisted (his contact_weld_v1 grasp regions on hedgehog_ball)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision hedgehog_placement_v4_grasp_contact_2mm)"
instance_seed = 0                 # scene = environment/instance.json (variation very_easy, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
