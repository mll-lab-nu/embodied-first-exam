# Diverter Route Ball（docx 4.3）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 工业原型：分拣线上的转辙式分流器。一颗哑光陶瓷球沿进料道匀速前进，分岔口的分流板
# 决定它从左出口还是右出口离开。机器人只转分流板的拨杆，全程不接触球。
#
# 几何主轴沿 +x（远离机械臂、朝向 front 相机）：两条支路分列 ±y，而 front 相机
# （x=+0.42 朝 -x 看，up=+z）的画面右方向正是 +y，因此「右出口」在画面里就在右边。
#
# 分流板是导流叶片，不是横挡板。落座时它沿一条支路的内边界向上游延伸到对侧壁，
# 由此同时得到两件事：另一条支路的入口被隔在板的另一侧（封路），以及球撞上板面后
# 沿板面滑出的切向速度恰好等于该支路的轴向（导流）。横挡板只能做到前者，球会顺着
# 板面滑进被封的那个口里卡死。详见 tasks/connectivity/diverter_route_ball.py 的头注。
#
# 与 docx 的几何差异：docx 画的是竖直落料槽 + 重力送球，这里改为桌面水平 + 匀速驱动
# （沿用 4.1 的方案与实测）。S–T 连通性判据不受影响。决策与代价见
# docs/develop/tasks/diverter_route_ball_zh.md §2。
#
# 派生量不写在这里，由 DiverterRouteBallLayout 从下面几个数算出来，改宽度或改角度
# 时整套几何自洽：
#   nose_x        = fork_origin_x + half_width / sin(a)          分流鼻（板的枢轴）
#   junction_x    = fork_origin_x + half_width(cos a - 1)/sin a  进料道壁与支路外壁的交接
#   flap_reach    = half_width / (sin a · cos a)                 枢轴到对侧壁的距离
#   exit_plane_x  = fork_origin_x + exit_station · cos a         两个出口共用同一个 x
#
# 现值（a=30°，half_width=0.045）：nose_x=0.070，junction_x=-0.032，flap 长 0.0999，
# 出口中心 (0.153, ±0.100)，球从释放到出口 0.362m / 3.02s。

task:
  id: diverter_route_ball
  difficulty: smoke

coordinate_frame: task

# ------------------------------------------------------------------ 占地范围
# 2026-08-19 去掉了底板：侧壁直接站在桌面上，球在桌面上滚（gate_cage_ball 的侧壁
# 本来也是这么放的）。原来那块 4mm 薄板还有一个副作用——球滚出出口后会被它的板沿
# 截停（实测三个球速的落点 x 一致到 0.6mm），去掉之后球会按滑行模型多滚一段。
#
# 这一段只剩「布局外接矩形」，它不生成任何实体，但两处要用：驱动器的作用区域，
# 以及判据 flood-fill 的栅格范围。
footprint:
  # 外接矩形相对最外侧构件再留出的余量。
  margin: 0.020

# ---------------------------------------------------------------- 进料道
channel:
  # 内净宽。球径 44mm，两侧各留 23mm；这个宽度同时也是分流板落座后
  # 「板与对侧壁之间」的通行宽度（板与支路内边界共线，故通道等宽）。
  inner_width: 0.090
  wall_thickness: 0.012
  # 壁高。球心在板面上方 22mm，45mm 远高于它，球爬不出去。
  wall_height: 0.045
  # 球滚动的平面。去掉底板后就是桌面本身。
  floor_top_z: 0.0
  # 进料道最上游端（后挡板在这里）。
  entry_start_x: -0.200
  # 两条支路中心线的公共起点。整套派生几何以它为原点。
  # 取 -0.020 而不是更靠前：拨杆手柄落在 x≈0.118，距 Franka 底座 0.688m，
  # 留出工作空间余量（4.1 的取板点是 0.645m）。
  # 随机化时不直接抽它：先抽张角与拨杆长，再由 fork_frac 在
  # [fork_x_min, min(fork_x_max, 可达上界)] 里定位（DiverterRouteBallLayout.
  # fork_origin_x_from_frac）。可达上界由 reach 段反解：分岔口越靠 +x、张角越小、
  # 拨杆越长，手柄离底座越远。只向 -x 挪（进料道变短）永远安全，所以 fork_x_max
  # 就是这里的现值。
  fork_origin_x: -0.020
  fork_x_min: -0.060
  fork_x_max: -0.020
  # 分岔口在允许区间内的归一化位置，[0, 1]；只在随机化时被写入。1 对应现值（可达允许时）。
  fork_frac: 1.0

  color: [0.60, 0.60, 0.59]

# ------------------------------------------------------------------ 支路
branch:
  # 支路相对进料方向的夹角。30° 是导流角与占地的折中：角度越大占地越宽，
  # 越小则球撞板后的切向速度越大而法向分离越慢。
  angle_deg: 30.0
  # 出口平面距 fork_origin 的轴向距离。缩短它就是让球更早离开视野。
  exit_station: 0.200
  # 死路那一侧在 exit_station 之外再延长多少，末端加一道封闭墙。
  # 延长是为了让球明显滚进去一段再撞停，而不是看着像在分岔口碰了一下。
  dead_end_extra: 0.080

# ---------------------------------------------------------------- 分流板
diverter:
  # 哪一侧是**死路**（末端封闭，球滚进去就出不来）。活路那一侧才有目标点。
  # 2026-08-20 引入，取代原来的 command.side：任务从「读指令决定动作」改成
  # 「看出哪条路是死的，然后打开活的那条」，所以实例轴是这个而不是指令。
  # 逐 episode 随机它，策略才必须从画面上看出哪条路通。
  dead_end_side: left
  # 开局挡板挡住哪一侧。与 dead_end_side 组成 2×2：两者相同则挡板已经挡住死路、
  # 正确动作是不动；两者不同则必须旋转。
  init_sealed_side: right
  # 支路内壁相对分流鼻向下游让开的距离。这个缺口存在的唯一理由是给转动件让位——
  # 挡板的枢轴端与转轴都绕枢轴扫过一个圆，静止的墙必须待在那个圆之外。
  # 取到最小可行值，墙就贴着轴收口，看起来是墙托着轴，而不是轴悬在两片墙中间。
  # 实际余量由 DiverterRouteBallLayout.checks() 的 pivot_clearance 一行在建场景时校验。
  nose_setback: 0.011

  flap:
    # 比侧壁（12mm）略厚，但不厚到显得笨重。「这东西会转」现在主要靠三条表达：
    # 顶面高出侧壁、露出的转轴、以及工业操作杆形状的把手。
    # 板厚直接决定球经过时的通道宽度，改它必须重测角度→余量曲线。
    thickness: 0.014
    # 顶面高出侧壁多少，让挡板从墙里立出来。
    rise_above_wall: 0.010
    # 自由端的斜切段：更短更薄的一小段，纯视觉（不参与碰撞），
    # 让挡板一端在轴上、另一端收窄，读起来像叶片而不是对称的墙段。
    tip_length: 0.016
    tip_thickness: 0.008
    # 板自由端与对侧壁之间留的缝。
    # 2026-08-19 由 4mm 改为 20mm：4mm 时板转过落座角 4.2° 就撞墙，**墙本身就是一个
    # 机械止点**，「转到停为止」照样能落座，精度不要钱。20mm 时 60° 过转都不撞墙，
    # 而密封完全不受影响（落座时缝隙 17.3mm，球径 52mm）。
    wall_gap: 0.020
    # 板底与底板之间的间隙，避免板在底板上刮擦。
    ground_clearance: 0.001
    # 工业设备的配色：低饱和的安全橙，不是玩具橙。仍然与灰色通道壁区分得开，
    # 但不再抢眼到失真。
    color: [0.62, 0.34, 0.18]

  # 拨杆：与板同一个转动连杆，从枢轴向**下游**伸出，因此手柄扫过的是两条支路之间的
  # 空楔形区，且整体高于壁顶——夹爪不进入任何通道，球也只会碰到板。
  lever:
    radius: 0.055
    # 拨杆臂底面高出壁顶的距离。
    arm_gap: 0.007
    arm_height: 0.008
    arm_thickness: 0.014
    # 转轴：枢轴处一根竖直圆柱，从挡板底一直到拨杆臂之上还露出一截。
    # 它取代了原来那个藏在挡板与拨杆之间的方形连接柱——看得见的轴是
    # 「绕什么转」这个问题最直接的答案。
    # 轴半径受限于内壁的收口位置：轴要在墙角之内转得开。
    axle_radius: 0.010
    axle_rise: 0.014
    # 轴与拨杆臂交接处的轮毂。真实操作杆的根部都有这么一圈加粗，
    # 一根等粗的杆插在那里看着像没装配完。
    hub_radius: 0.018
    hub_height: 0.012
    # 把手做成三段，而不是一根方柱：
    #   boss  拨杆臂末端的安装座（金属）
    #   grip  握持段（深色橡胶，直径与原方柱相同，夹爪参数不用改）
    #   cap   顶部端盖（亮金属）
    # 圆柱形握持段同时解决一个力学问题：方柱在 60° 摆程里会在指垫间卡角——
    # 18mm 见方的对角是 25.5mm，转过 45° 就把指垫顶开。
    boss_radius: 0.014
    boss_height: 0.009
    knob_size: 0.018
    knob_height: 0.050
    cap_radius: 0.012
    cap_height: 0.006
    # 指垫落在手柄顶面以下多少。手柄跨 z 0.064..0.114，取 0.034 即指垫在 0.098，
    # 指尖约在 0.078，高出拨杆臂顶面（0.064）14mm。
    grasp_height: 0.034
    # 轴、轮毂、拨杆臂、安装座：枪灰金属。握持段：深色橡胶——真实阀门手柄就是
    # 这个配色，而且深色握持段在浅灰桌面上对比很强，「手放这里」一眼可见。
    color: [0.30, 0.32, 0.35]
    knob_color: [0.15, 0.15, 0.16]
    cap_color: [0.70, 0.71, 0.73]

  mechanism:
    joint_name: diverter_joint
    mass: 0.20
    # 关节阻尼与摩擦。
    # 2026-08-21 摩擦由 0.1 降回 0.03：当初提高它是为了让球推不动挡板，但那件事
    # 现在由 lock_after_turn 的位置伺服承担（±5 N·m，比球能施加的 0.012 N·m 大两个
    # 数量级）。摩擦留在 0.1 只剩一个作用——给夹爪添阻力：0.1 N·m 在 55mm 力臂上
    # 要求指垫传递 1.8N 的切向力，超过夹持力能提供的摩擦，指垫就在手柄上打滑，
    # 看起来像是夹爪在推杆而不是带着它转。
    joint_damping: 0.06
    joint_friction: 0.03
    joint_armature: 0.01
    contact_friction: 1.2
    # 臂松手退刀之后，把关节锁在当时的角度上（位置伺服）。模型是自锁式机构
    # （定位槽或蜗杆），真实分流器就是这样。两个作用：球压上来时板不再让步；
    # 判定时刻的板角就是臂松手时的那个角，target_error 因此有明确所指。
    #
    # 注意它**不能**阻止球从比自身窄的缝里挤过去——那是球与板的接触压入，
    # 与板动不动无关（实测比球窄 0.5mm 的通道照样漏）。锁死只去掉一个让步来源。
    lock_after_turn: true
    lock_kp: 50.0
    lock_kv: 5.0
    lock_force: 5.0
    # 关节要不要限位。**false 是本任务的要害**：有限位时「转到停为止」永远落座，
    # 角度精度不产生任何代价，而精准旋转正是 4.3 要考的东西。
    joint_limited: false

# ------------------------------------------------------------------ 球
ball:
  # 半径 0.026（直径 52mm）。上下都有约束，取值落在两者之间：
  #   下界：半开态必须卡住。板半开时板尖与支路外壁交接角之间的旁通间隙必须小于球径，
  #         否则球会从一侧溜过去，中间失败态就不成立。
  #   上界：落座后的通行宽度等于通道内净宽 90mm（板与支路内边界共线，通道等宽），
  #         52mm 留出每侧 19mm，球在拐弯处不蹭壁。
  # 两条都由 DiverterRouteBallLayout.checks() 按当前几何实算（half_open_bypass_gap、
  # seated_lane_width），改 channel.inner_width 或 branch.angle_deg 时自动复核。
  # 张角 24–36° 内旁通间隙 41–42mm，比球径小 10mm 以上。
  radius: 0.026

  # 哑光陶瓷轴承球的量级（同 4.1）。不用铬钢：镜面反射对视觉跟踪不利。
  rho: 3900.0
  friction: 0.4
  # 浅灰白。底板去掉之后球是在浅灰的桌面上滚，对比度不如原来对着深色底板时高；
  # 若相机跟踪吃力，把这个调深是最直接的一招。
  color: [0.88, 0.88, 0.86]
  # 沿通道的匀速（米/秒）。同 4.1 的实测可用值。
  speed: 0.120
  # 驱动方式：**有界推力**，不是写速度。
  # 2026-08-19 实测：写速度（set_dofs_velocity）是状态写入，求解器解完接触后下一步
  # 又把满速写回去，等于无穷大的力——欠转的挡板（12mm 厚）被球一步步顶穿挤了过去。
  # 改成通过求解器施加电机力之后接触能赢，max_thrust 就是这个保证。
  #
  # thrust_gain: 力 = gain × (目标速度 − 实测速度)。球质量 0.287kg，gain=1.0 时
  #   从静止到 0.12m/s 约 0.35s。无滚阻，所以到速之后误差为零、力也归零，自然匀速。
  # max_thrust: 力的上限（牛）。0.15N 在挡板枢轴上产生的力矩约 0.012 N·m，
  #   比关节摩擦 0.1 N·m 小一个数量级，因此球绝无可能把板推动或顶穿。
  thrust_gain: 1.0
  max_thrust: 0.15
  # 开局位置（进料道上，后挡板前方 30mm：球尾离墙 4mm）。
  # 随机化时不直接抽它：由 spawn_frac 在「整球离开后挡板 spawn_wall_margin」到
  # 「整球在分岔交接点上游 spawn_fork_margin」之间定位（DiverterRouteBallLayout.
  # release_x_from_frac），球径、分岔口位置变了区间自动跟。
  release_x: -0.170
  spawn_wall_margin: 0.004
  spawn_fork_margin: 0.010
  # 球在可出生段内的归一化位置，[0, 1]；只在随机化时被写入。0 对应现值。
  spawn_frac: 0.0

  # 驱动器判定「被挡住」的窗口步数。2026-08-19 由 5 改为 40，同时判据从「逐步位移」
  # 改为「窗口内净位移」：球被挡板面挤着蹭时每步都有零点几毫米位移，逐步判据永远不触发
  # （实测板角 16/18/20 度三档球都停住了却报 jammed=False）。40 步 = 0.4s，
  # 阈值 0.2*speed*dt*40 = 9.6mm，正常滚动这段时间走 48mm，卡住的球远低于它。
  stall_steps: 40
  # 出口之后的减速度（米/秒²）。求解器没有滚动阻力（tests/ball_roll_spike.py 实测），
  # 这一项替代它，使离开出口的球滚一段后静止。0.090 下 v=0.120 滚 80mm。
  offtrack_decel: 0.090

# ------------------------------------------------------------------ 指令
# 封死一侧、只留一个目标之后，指令没有内容可表达了——目标永远是那一个。
# 所以它退化成常量。逐 episode 变化的指令链路（写进 H5 的 task_goal）保留着，
# 只是这个任务用不上；改成双目标的变体时可以直接启用。
command:
  prompt: "Send the ball to the target."

# ------------------------------------------------------------------ 动作
# 全部是**手部连杆**的 z（指垫在其下方 HAND_TO_PAD_Z = 0.1029 处），任务坐标系。
motion:
  # 摆到手柄上方的安全高度。端盖顶在 0.135（拨杆臂顶 0.070 + 安装座 0.009 + 握持段 0.050
  # + 端盖 0.006），指垫在手部下方 0.1029，张开的指尖还要更低；指垫到端盖顶留 30mm
  # （checks() 的 approach_clearance 行，与 linkbar 同一门）。
  # 2026-09-02 由 0.260 提到 0.300：0.260 时只剩 22mm，变体 seed 0（分岔口靠近机械臂、
  # 手柄离 home 位水平仅 27mm）在接近段就把拨杆撞转了 71°，抓空中止。
  approach_z: 0.300
  # 抓取时的手部 z。指垫落在 diverter.lever.grasp_height 给出的高度上，
  # 由 layout.knob_grasp_world 算出，这里只给退刀高度。
  retreat_z: 0.300

  steps_per_phase: 30
  # 圆弧扫掠的角速度：每步转多少度，步数由扫掠角推导（DiverterRouteBallLayout.steps_arc），
  #   steps = max(min_steps_arc, ceil(|sweep| / arc_deg_per_step))
  # 落座到落座扫 2×张角；张角随机后步数跟着变，角速度不变（linkbar 2026-09-01 的教训：
  # 步数固定时关节滞后随扫掠角线性增长）。
  # 2026-09-02 由 0.5 降到 0.23（与 linkbar 同）：0.5°/步（缓动中段约 80°/s）下指垫在
  # ⌀18mm 握持段上打滑，关节落后手部实际角 6.3–9.6°（新定义 max_lag，门 6°）；0.23°/步
  # 诊断降到 3.3°。也是为真机一致性考虑：60° 扫掠 261 步 = 2.6s，与 linkbar 同一量级。
  arc_deg_per_step: 0.23
  min_steps_arc: 60


  gripper_steps: 30
  close_hold_steps: 30
  arc_settle_steps: 40
  release_hold_steps: 30
  # 握持段 ⌀18mm。每指 0.005 = 总过盈 8mm（原来 0.007 = 4mm）。
  # 加大过盈是为了让指垫真的夹住而不是搭在上面——Franka 的手指是位置控制，
  # 夹持力来自指令位与实际停位之差，过盈越大力越大。
  grasp_qpos: 0.005
  finger_links: [left_finger, right_finger]
  finger_friction: 2.0
  # 到位角误差阈值。**没有限位兜底，这是硬判据。** 初值取 rim_rotate 的默认 8°，
  # 实测之后按真实落点误差改。
  target_tolerance_deg: 8.0
  # 手沿理想圆弧走时，指垫与理想点的最大偏离。
  max_follow_error: 0.030
  # 松手到退刀完成之间板角的漂移上限。
  max_release_drift_deg: 5.0
  # 合爪后指位的下限，**在扫弧之前**校验：低于它说明没夹住，直接中止不去转杆。
  # 指令位 0.005，夹到 ⌀18mm 手柄时指位会停在 9mm 附近（方柱版实测 0.0098/0.0102）。
  # 取 0.007 落在两者之间：夹空了会一直合到 0.005，夹住了停在 0.009 上下。
  min_finger_qpos: 0.007
  # 扫弧过程中关节角允许落后**手部实际位置对转轴的角度**多少度。**这是「带着转」与
  # 「推着走」的分界**：指垫夹住时关节就在手所在的角度，打滑时手跑在前面。终点误差
  # 看不出这件事——中途打滑、最后又被推到位的行程，终点是对的。
  # 机械臂自身跟不上指令点的那部分由 max_follow_error 单独把关。
  # 2026-09-02 之前这个读数比的是关节角与指令角，把手部约 11mm 的跟踪滞后（在 55mm
  # 手柄圆上即 11°）也算了进去，默认布局读 14.7°、变体 13.8–16.4°，全部误判为旋转失败；
  # 那些数字与现在的读数不可比。
  max_lag_deg: 6.0


# ---------------------------------------------------------------- 目标落料垫
# 画在**指令那一侧**出口外侧的红白靶心，同 cable_routing 的
# _add_connector_target_marker：纯装饰（collision=False），同心方环，随支路旋转。
#
# 它同时是一块「胶垫」：球心进入这块矩形之后，滑行减速度换成 brake_decel。这是
# 2026-08-19 去掉底板之前那个偶然效果的有意版本——原来 4mm 板沿会把球截停（三个
# 球速落点一致到 0.6mm），但那是撞台阶撞出来的，底板厚度一改就变。现在改成明写的
# 减速区：0.5 m/s² 下三个球速分别滚 6/14/32mm，落点离散度从 144mm 压到 26mm。
#
# 不用「进区即把速度置零」：那会在观测流里留下物理上不可能的事件（瞬时减速到无穷），
# 而这些 episode 要当 IL 数据用。停球发生在判定之后（判据在出口口部就已触发），
# 所以停不停都不影响判定本身——只影响画面和终态。
#
# 没有垫的那一侧不铺，球按 ball.offtrack_decel 自然滚到停，两种结局因此一眼可分。
#
# 位置：沿支路轴向从出口口部再往外 pad_offset，垫长 pad_length、宽 pad_width。
# 球从出口出来时约 0.10 m/s，在垫的上游三分之一内停住。
#
# enabled=false 是「纯语言指令」条件：画面里不含答案，同一初始相位下两条指令的观测
# 完全相同，纯视觉策略上限被钉在一半。enabled=true 把目标放进画面，视觉可解。
# 两种条件都该跑、都该报。
target_pad:
  enabled: true
  pad_offset: 0.010
  pad_length: 0.120
  pad_width: 0.090
  brake_decel: 0.5
  ring_count: 4
  thickness: 0.002
  z_offset: 0.0015
  red_color: [0.85, 0.05, 0.05]
  white_color: [0.97, 0.97, 0.97]

# ---------------------------------------------------------------- 可达
# 拨杆手柄距 Franka 底座的上限。校验函数只拿得到 task 配置，所以底座位置在这里
# 重复声明一次；来源 common_configs/manipulation_space_tabletop_v1.yaml 的
# robot_setup.mount.pos（task 坐标，桌面平面内）。0.690 = 默认几何实测可达的 0.688
# （docs §3.2）留 2mm。GPU sweep 若在更远处仍能抓到，可放宽。
# 用于 checks() 的 knob_reach 一行，也用于反解 fork_origin_x 的可达上界。
reach:
  base_xy: [-0.570, 0.0]
  max_knob_dist: 0.690

physical:
  # 复位到 home 位之后的静置步数。机械臂在球的运动中不起作用，但仍要被驱动：
  # 场景里加了 Franka 而不给关节目标，一步进就会在重力下瘫掉。
  settle_steps: 40

success:
  # 判定用的自由空间栅格分辨率（米）。
  # 2026-08-19 由 6mm 改为 1mm。flood-fill 用格心测膨胀后的障碍，等效多膨胀了最多
  # 半个格对角线（6mm 栅格 = 半径多 4.2mm、直径多 8.4mm），在边界附近直接把结论测反：
  # 13° 时 6mm 栅格报「堵住」，1mm 栅格报「通道 53.6mm，比球宽 1.6mm」，而实机确实通了。
  # 能带边界也随之从「16° 起可达」修正为「12° 起可达」。
  # 代价：单次判定 1.0ms -> 48ms，一个 episode 只调几次，可忽略。
  grid_pitch: 0.001
  # 出口判定区的边长（米）。球心进入它即算从该侧离开。
  exit_patch: 0.050
  # 关节角距落座角多少度以内算「落座」。超出即 flap_not_seated（半开）。
  seat_tolerance_deg: 4.0
  # 判定后继续步进这么多步做物理复核。
  settle_steps: 120

# ---------------------------------------------------------------- 变体
# 逐 episode 随机的轴（generation/layout_randomization.py 读这一段）。
# 每条 uniform 各有自己的区间；区间依赖其他轴的量（分岔口位置、球出生点）抽归一化
# 位置再由 derived 派生，构造式满足约束、不靠拒绝。validate 只兜派生区间为空等情形。
variation:
  # 防捷径：哪条支路是死路（只能从画面读出）
  - {kind: choice, path: diverter.dead_end_side, values: [left, right]}
  # 防捷径：开局挡板封着哪侧；与死路侧独立，2×2 里一半实例正确动作是不转
  - {kind: choice, path: diverter.init_sealed_side, values: [left, right]}
  # 防捷径：活路出口有没有目标垫；无垫时画面里没有答案
  - {kind: choice, path: target_pad.enabled, values: [true, false]}
  # 布局：岔道张角。24° 以下手柄超出可达；36° 以上占地超出桌面
  - {kind: uniform, path: branch.angle_deg, lo: 24.0, hi: 36.0}
  # 布局：拨杆长
  - {kind: uniform, path: diverter.lever.radius, lo: 0.047, hi: 0.063}
  # 布局：球速（有界推力驱动量程；scene_check 实测 0.08–0.18 均可路由）
  - {kind: uniform, path: ball.speed, lo: 0.090, hi: 0.150}
  # 布局：分岔口在可达区间内的归一化位置
  - {kind: uniform, path: channel.fork_frac, lo: 0.0, hi: 1.0}
  # 布局：球在直道可出生段内的归一化位置
  - {kind: uniform, path: ball.spawn_frac, lo: 0.0, hi: 1.0}
  # 派生：fork_frac -> channel.fork_origin_x，spawn_frac -> ball.release_x
  - {kind: derived, fn: "topogym.tasks.connectivity.diverter_route_ball:derive_task_cfg"}
  # 校验：checks() 六行（枢轴净空、半开卡球、落座通行、分岔区间非空、出生段、可达）
  - {kind: validate, fn: "topogym.tasks.connectivity.diverter_route_ball:validate_task_cfg"}
