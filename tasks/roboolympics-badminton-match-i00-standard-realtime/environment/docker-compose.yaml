# Standard-realtime mode (PROTOCOL §4b): RoboOlympics badminton runs in the `sim` sidecar (the agent cannot open it), on
# its own clock once the match starts (sim/rcb_realtime.py, the adapter sim/rcb_olympics.py); the agent only reaches
# port 8000. No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace
# (localhost:8000). CPU only: MuJoCo physics and OSMesa rendering (the players' meshes come with the image).
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    image: ghcr.io/mll-lab-nu/eai-olympiad:0.2.0
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
    command: python /srv/rcb_realtime.py
    restart: on-failure:6                               # a crash resumes the same match, paused, never a reset
    cpus: 6
    mem_limit: 8g
    pids_limit: 256
    environment:
      RO_PLUGIN: /srv/sport/plugin.py
      RO_SPORT: badminton
      RO_FORMAT: match-wallclock
      RO_SEED: "101"
      RO_LEVEL: "1"
      RO_ACTION_LEVEL: high
      RO_TASK_TEXT: "Win a game of singles badminton against the scripted opponent: serve, and return its shots into its court."
      RO_EPISODE_TEXT: "Ends when the game is decided (first to 5 points, from 4-4 by 2, at most 7; or a player disqualified; success: you won), when your time is up (timeout), or on a simulator error."
      RCB_WALL_CLOCK_S: "7200"
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the official
      # configuration; results under other settings are reported separately.
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-10}"                # 10: RoboOlympics' official slowdown (PROTOCOL §4b exception); results state S
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-0}"        # 0: one match is one episode (PROTOCOL §4b, the mode's default)
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      LP_NUM_THREADS: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
  # >>> rcb_monitor (resource limits monitor, docs/PROTOCOL.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/eai-monitor:0.1.0@sha256:f2c910f53f79c2bfa4a71298b10c78383cae3afc40720ca562cc845b8d20fb0c
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor:/opt/rcb_monitor:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
