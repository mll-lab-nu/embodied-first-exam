schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/pandadyn-d07-spring-gate-switchyard-i00-privileged"
description = "Panda Dynamic Scenes D07 Spring gate switchyard (two Franka Pandas, ManiSkill 3 / SAPIEN, CPU PhysX at 1000 Hz): produce one replayable trajectory of 100 Hz joint-target actions. Task: A low-friction puck slides inside a U-shaped pen of bouncy rails that is open toward the right arm, and a spring-loaded swinging gate stands inside the pen. The left Panda has a bare gripper. It must take hold of the gate's handle (the block on the gate's free end) with both fingers, swing the gate open one way, and keep holding the handle with the gate well open whenever a later phase is judged. The right Panda's paddle must then hit the puck so that it travels deep into the pen. While the puck runs round, the left hand, still gripping, must swing the gate the other way: at the moment the puck hits the upper (+y) rail, the gate must be at that opposite angle. The right paddle then intercepts the puck. Finally the puck must cross a goal line in front of a backstop on the right arm's side while the left hand still holds the handle with the gate deflected well away from its rest position and the paddle is not touching the puck. Frozen scene instance i00 (nominal parameters, seed 0); graded by the task's own staged success check in two fresh-process replays."
keywords = ["robotics", "pandadyn", "maniskill", "sapien", "franka-panda", "bimanual", "dynamic-manipulation", "code-as-policy", "trajectory", "privileged"]

[metadata]
task_type = "trajectory"
simulator = "maniskill"           # Panda Dynamic Scenes on ManiSkill 3.0.1 / SAPIEN 3.0.3 (CPU PhysX at 1000 Hz, enhanced determinism)
robot = "franka-panda-bimanual"
family = "d07_spring_gate_switchyard"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "full"
instance_seed = 0
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 3000.0              # a fresh-process replay at tests/grade.py's limit (300 s + rows / 10: 650 s for the
                                  # longest episode, 3500 rows) and the filmed replay (twice that) + margin; measured: a replay
                                  # takes 10-80 s, a filmed one 1-4 min
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # the scene is procedural: everything is in the image

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2)
# The agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 5
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
