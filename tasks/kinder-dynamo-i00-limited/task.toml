# Limited-mode twin of kinder-dynamo-i00. Generated from scripts/kinder/templates/limited/task.toml -- edit subset.toml or
# the template, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/kinder-dynamo-i00-limited"
description = "LIMITED MODE (robot as a service, rcb-limited/1.1): KinDER Dynamo3D-o3 on the same frozen instance as kinder-dynamo-i00. The agent only gets a client: observe (the robot's camera RGB + joint encoders + base odometry), step (one action or a batch). No reset by default, no privileged state, no goal check; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", "mujoco", "tidybot", "mobile-manipulation", "physical-reasoning", "limited-mode", "trajectory", "dynamo"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "tidybot-plus-plus"
family = "dynamo"
tier = "perception"                # robot-camera RGB + joint encoders + base odometry; no object pose, no goal check
mode = "limited"
protocol = "rcb-limited/1.1"
instance_seed = 0
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 280); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; sleep 2; done; cat /data/final.json"
timeout_sec = 600

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator, but upstream is public: keep the agent phase off the network like every task
# here (model API opted in per run: --allow-agent-host <host>).
network_mode = "allowlist"
allowed_hosts = []

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
