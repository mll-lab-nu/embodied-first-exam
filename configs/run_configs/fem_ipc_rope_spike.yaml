# tests/fem_ipc_rope_spike.py 的运行模式参数。
#
# 材料与接触参数不在这里 —— 它们在 task 配置的 rope.fem 块里，单源 prefabs.rope_fem，
# 用点路径覆盖即可扫参，不会改到任何文件：
#   task.rope.fem.E=200000.0          （原 --e）
#   task.rope.fem.nu=0.3              （原 --nu）
#   task.rope.fem.rho=650.0           （原 --rho）
#   task.rope.fem.friction_mu=0.4     （原 --friction-mu）
#   task.rope.fem.contact_d_hat=0.001 （原 --d-hat）
#   task.rope.fem.follow_strength=200 （原 --strength）
# 场景规模同理：
#   task.braid.n_strands=3            （原 --strands）
#   task.rope.mesh.segment_length=0.004（原 --segment-length）
#
# 2026-08-10：迁移前这几项是 CLI 专属的，配置文件里查不到本次跑用的是什么值。
# prefabs.rope_fem 那组数值正是本脚本标定出来的，现在两边指向同一处。

defaults:
  - default
  - _self_

# 做哪一项测试。
#   settle : 建场景 + 沉降 + 测量（第 1 步）
#   anchor : 钉住锚定带，确认沉降过程中不脱开
#   follow : 在 anchor 基础上把抓取带抬高 60mm，报跟踪误差
#   contact: PBD 失败复现 —— 抓下方绳的自由端抬 80mm，
#            上下关系不得翻转（PBD 在第 1176 步翻了）
test: settle

# 时间步。本脚本自建场景，不走 env 的 tabletop 预设：
# IPC coupler 每个 substep 推进一次自己的世界，却按整个 sim.dt 配置
# （ipc_coupler/utils.py:93），即它是按 substeps=1 设计的。
# 锁定的 tabletop 预设是 substeps=4，这里刻意不用。
dt: 0.01

# 沉降上限步数，以及收敛判据（单步最大顶点位移低于该值即认为收敛，米）。
settle_steps: 400
settle_tol: 0.00005

# IPC coupler 的 contact_resistance。null = 不传，用 libuipc 默认值。
# 它在 rope_backends/fem_ipc.py 里没有对应项，因此留在这里而不是 task.rope.fem。
contact_resistance: null

# follow / contact 测试用的抓取带半径（米）与驱动步数。
band_radius: 0.015
drive_steps: 400
