# demos/routing/ring_transfer_physical_demo.py 的运行模式参数。

defaults:
  - default
  - _self_

# 动作。三条共用同一套判定，阈值要卡在做对与做错之间：
#   transfer       任务本身：钩住远端帽套上 B，再捏住 A 侧帽提过 A 顶。终态 {B}。
#   drape_outside  对照：远端帽落在 B **近侧**、不做第二段。俯视投影像围住了 B，
#                  绕数读 0；终态仍是 {A}。
#   lift_only      对照：跳过套 B，直接把环从 A 提离。终态空集。
motion: transfer

# 机械臂退开后再空跑多少步才停止录制（dt=0.01，100 步 = 1 秒）。
final_hold_steps: 100
