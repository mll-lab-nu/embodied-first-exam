schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/abc-sim-count-one-i00-privileged"
description = "ABC Sim count into a box: exactly 1 (two I2RT YAM arms, MuJoCo): Follow the directive 'put exactly 1 red object in the box'. Frozen scene instance; one replayable trajectory, graded by two fresh-process replays."
keywords = ["robotics", "abc-sim", "mujoco", "yam", "bimanual", "count_one", "privileged"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"                # ABC Sim (abc_sim, amazon-far/abc @ d0832d1) on MuJoCo 3.6.0
robot = "i2rt-yam-bimanual"
family = "count_one"
dynamics = "static"
oracle = "full"
instance_seed = 0
expert_time_estimate_hours = 3.0

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [0, 36, 50]
oracle = [0, 36, 50]

[verifier]
timeout_sec = 6000.0                # two side-by-side replays of at most 20,000 rows (2400 s each at the slowest scene)
                                   # and the filmed one; a reference replays in 1-100 s
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
