schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-discus-i00-privileged"
description = "Embodied Olympics discus (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Throw the discus that lies on your right palm, your fingers curled over its rim, from inside the circle so that it lands inside the sector at least 15.0 m from the circle, then leave the circle from its rear half and stand. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "discus"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "discus"
category = "throwing-catching-striking"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 12.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: The 2 kg discus lies flat on the upturned palm of the H1-2's own right Inspire hand (its default forces, 20 N per fingertip, 30 N the thumb), the fingertips curled over its rim (searched: hanging from the fingers with the arm down it slides out wherever it is placed). A swing searched by CMA-ES (about 60 generations) lets the discus leave the palm early (best 6 m; the mark is 15 m). Positive by a declared magic action: real stance on the walking policy and the hand opening; injected once, the discus moved 0.4 m forwards and up and given 13.5 m/s at 38 deg spinning at 30 rad/s: it lands 18.7 m from the rim inside the sector; the real walk backwards out of the rear half and stand; the same state hash twice. Negatives: nop (time, discus held), the hand opened at the start (it slides off unheld), walking out with the discus, leaving before the landing, outside the sector, short, touched after the release, leaving through the front half, a fall. Stress: random arm targets with the hand closed: at most 0.2 mm into the fingers. The clean release (the same rule as javelin): brushes by the right hand in the 0.2 s grace after the release may change the discus' velocity by at most 0.5 m/s in all; an injected blow on the palm (0.95 m/s) fails as 'struck after the release'. An agent's own-motor throw of 17.1 m from a model run succeeds under it (it gains less than 0.2 m/s from brushes). Every rule above is judged in the family's own 1 ms substep hook.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
