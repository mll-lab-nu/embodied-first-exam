schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/bigym2-sandwich-remove-i00-privileged"
description = "BiGym 2.0 sandwich-remove (Unitree G1 with GR00T-WBC, MuJoCo 3.8.1) in privileged mode: produce one replayable trajectory. Use the spatula to move the sandwich from the frying pan onto the chopping board. Frozen instance: upstream task sandwich_remove, seed 0."
keywords = ["robotics", "bigym2", "mujoco", "unitree-g1", "humanoid", "loco-manipulation", "trajectory", "sandwich-remove"]

[metadata]
task_type = "trajectory"
simulator = "bigym2"               # BiGym 2.0 (bigym 1.0.0 at 93ad4b3): MuJoCo 3.8.1 + NVIDIA GR00T-WBC, CPU physics
robot = "unitree-g1-dex1"
family = "sandwich-remove"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (upstream's task reset with this seed + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 2.0
oracle = "none"
oracle_evidence = "no reference solution (BiGym 2.0 ships no expert or planner; its demonstrations and its agents' programs stay off the agent's network); no positive example yet; human review in PR #123"

[verifier]
timeout_sec = 1800.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[agent]
timeout_sec = 3600.0
# The model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS): BiGym 2.0's demonstrations and its coding agents'
# programs and rollouts are public (Hugging Face SWIRL-Lab/bigym-g1-native60 and bigym2-agent-rollouts).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 13312
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
