schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay3.log", service = "sim" },           # the collect hook's video replay (replay.mp4)
  "/app/output/",
]

[task]
name = "embodied-first-exam/labutopia-open-drawer-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): LabUtopia open_drawer (Open Drawer) on the same frozen instance as labutopia-open-drawer-i00-privileged: Open the top drawer of the cabinet (the upper of its two drawers) and let go of it. The agent only gets a client: cameras (RGB, optional depth, calibration), the robot's proprioception, joint target chunks, arm kinematics; one episode, no reset, no object or instrument state; the sim service records the episode and grades the live episode (no grading replay)."
keywords = ["robotics", "labutopia", "isaac-sim", "laboratory", "chemistry", "franka-panda", "code-as-policy", "trajectory", "open_drawer", "standard-mode"]

[metadata]
task_type = "trajectory"
simulator = "labutopia"           # LabUtopia @ 8df7278 on NVIDIA Isaac Sim 6.1.0 (PhysX on the CPU, RTX cameras)
robot = "franka-panda"
family = "open_drawer"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.2"
oracle = "full"
level = 1                         # LabUtopia's own level for the task (config level1_open_drawer)
instance_seed = 2                 # numpy's and Python's random generators before LabUtopia's reset
expert_time_estimate_hours = 2.5

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, write final.json from the live episode (no replay), video replay
timeout_sec = 4800                # = finalize.sh's HOOK_BUDGET_S (keep them equal): 2700 (episode end, through a resume) + the video replay (at most 1800) + 300

[agent]
timeout_sec = 3600.0              # LabUtopia's budget, both modes (tasks/labutopia/README.md): a container's first simulator with its renderer takes 5 to 27 minutes to start
# LabUtopia's scripted controllers are in its public repository (and a standard-mode agent could rebuild the simulator
# from it): the agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0           # a first run builds the simulator image from public sources, about 25 min on a fast link (tasks/labutopia/README.md, First build)
cpus = 8
memory_mb = 32768
storage_mb = 20480
gpu_types = ["RTX 4090", "L40S"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
