defaults:
  - staged_lock_policy_views
  - _self_
task:
  physics:
    disc_damping: 0.030
    enable_joint_limit: true
  geometry:
    initial_disc_deg: [0, 0, 0]
  rotor_stops:
    - {style: single_ring, bounds_deg: [-35, 35], ear_phase_deg: -35}
    - {style: single_ring, bounds_deg: [-20, 20], ear_phase_deg: -35}
    - {style: single_ring, bounds_deg: [-30, 30], ear_phase_deg: -35}
env:
  cameras:
    limit_detail:
      res: [1280, 720]
      pos: [-0.13, -0.30, 1.44]
      lookat: [0.285, 0.18, 1.09]
      up: [0, 0, 1]
      fov: 34
      near: 0.01
      far: 12.0
run:
  output: runs/staged_lock_task/nyx_single_slot_ring
  record_cameras: [agentview, front_oblique, limit_detail]
  exterior_cameras: [agentview, front_oblique]
  drive_mode: torque_bench
