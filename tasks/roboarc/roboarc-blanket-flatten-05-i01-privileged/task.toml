schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/roboarc-blanket-flatten-05-i01-privileged"
description = "RoboARC blanket_flatten (ALOHA 2, MuJoCo): produce one replayable trajectory. Unfold and spread the blanket flat on the table without overlaps or excessive stretching, then release it and withdraw. Frozen scene instance (variation medium, seed 0)."
keywords = ["robotics", "roboarc", "mujoco", "aloha", "code-as-policy", "trajectory", "blanket_flatten"]

[metadata]
tooling_version = "19"
task_type = "trajectory"          # trajectory | policy   (see docs/protocol/README.md)
simulator = "roboarc"             # RoboARC on MuJoCo 3.14.0 (CPU physics, CUDA cloth step, Nyx RGB)
robot = "aloha-2"
family = "blanket_flatten"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "full"
difficulty = "medium"               # the variation's tier (docs/TAXONOMY.md)
grasp = "assisted (the pbd_local_patch_v1 grasp regions on blanket)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision release_settling_v1)"
instance_seed = 0                 # scene = environment/instance.json (variation medium, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 14336
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
