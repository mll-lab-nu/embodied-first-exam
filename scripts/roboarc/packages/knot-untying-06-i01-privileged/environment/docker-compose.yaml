# TopoGym runs its physics on the GPU (CUDA) and renders camera images with Nyx. Harbor's local docker sandbox rejects
# [environment].gpus, but merging this onto the main service passes the device through.
# Nyx renders through Vulkan, so the container needs the NVIDIA graphics libraries as well as compute: `runtime: nvidia`
# with NVIDIA_DRIVER_CAPABILITIES=all (`capabilities: [gpu]` alone injects compute only).
services:
  main:
    runtime: nvidia
    shm_size: "2gb"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
