name: Protocol change
description: Propose a change to docs/protocol/README.md or the standard-mode wire protocol (eai-standard/2.x).
title: "[protocol] <change>"
labels: ["protocol-change"]
body:
  - type: textarea
    id: motivation
    attributes: {label: Motivation}
    validations: {required: true}
  - type: textarea
    id: change
    attributes: {label: Exact change, description: "Fields, endpoints, rules; the proposed version (minor versions only add)."}
    validations: {required: true}
  - type: textarea
    id: compatibility
    attributes: {label: Compatibility and migration, description: "Do existing clients and tasks keep working? Which tasks change, and who migrates them?"}
    validations: {required: true}
