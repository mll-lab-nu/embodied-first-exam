schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robolab-reorient-red-mug-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): NVIDIA RoboLab reorient_red_mug on the same frozen instance as the privileged task (the state after RoboLab's canonical seed-0 reset). Put the red mug upright so that the opening is facing upwards. The agent only gets a client: get_obs (RGB, depth + proprioception), submit (joint_position or ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robolab", "isaac-lab", "isaac-sim", "franka", "standard-mode", "trajectory", "reorient_red_mug"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "robolab"
robot = "franka-robotiq-2f85"
family = "reorient_red_mug"
mode = "standard"                  # robot as a service: RGB, depth + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.2"
oracle = "none"
oracle_evidence = "No reference solution: RoboLab ships no expert or planner. Positive examples graded 1 by the separate verifier: robolab-reorient-red-mug-i00__vbq6nDY (robolab-reorient-red-mug-i00-privileged, run codex-gpt6_luna-xhigh, robolab-lunacx-0925-2038, ws3; https://embodied-agent-interface-v2-internal.github.io/runs/robolab/codex-gpt6_luna-xhigh/reorient_red_mug/unlimited/); robolab-reorient-red-mug-i00-lim__PUXCHM2 (robolab-reorient-red-mug-i00-standard, run codex-gpt6_luna-xhigh, robolab-lunaxh-limited-0928, lab; https://embodied-agent-interface-v2-internal.github.io/runs/robolab/codex-gpt6_luna-xhigh/reorient_red_mug/limited/). Human review per family (PROTOCOL §2.7)."
instance_seed = 0
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json
timeout_sec = 5400                # = the agent budget: a 1.5 h episode can record ~22-45k steps, replayed twice at ~20 steps/s

[agent]
timeout_sec = 5400.0              # RoboLab budget, both modes (docs/benchmarks/robolab.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576
