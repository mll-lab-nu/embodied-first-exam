schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/canvas_live.png", service = "sim" },       # the live episode's main sheet, the one that was scored
  { source = "/data/canvas_live_practice.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{NAME}}-standard"
description = "{{DESC_TOML_L}}"
authors = [{ name = "qineng" }]
keywords = ["robotics", "robopaint", "maniskill", "sapien", "painting", {{KEYWORDS}}, "franka", "standard-mode", "trajectory", "{{FAMILY}}"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "maniskill"
robot = "franka-panda"
family = "{{FAMILY}}"
mode = "standard"                  # camera RGB + proprioception only; no sheet readout, no score, no reset, no brush model
protocol = "eai-standard/2.2"
oracle = "{{ORACLE}}"                # solution/: the privileged oracle's joint targets, streamed through the client
oracle_evidence = "{{ORACLE_EVIDENCE_L}}"
instance_seed = 0
expert_time_estimate_hours = 6.0
difficulty = "{{DIFFICULTY}}"{{DPAD}}# RoboPaint tiers: acrylic stroke copy hard, oil paint-from-reference extreme
medium = "mypaint"
{{AXES}}

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode: the service scores its live sheet (the verdict), then renders the video once
timeout_sec = 2820                # ending a service that is resuming (up to 1500 s) + one render pass of at most 72,000 control steps

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2.12)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL §2.11
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
