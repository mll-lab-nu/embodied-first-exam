schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/episode.json", service = "sim" },             # the live result the service dumped at the episode end
  { source = "/data/server.log", service = "sim" },               # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },              # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },           # crash recovery: one line per service start
  { source = "/data/startup_binding.json", service = "sim" },
  { source = "/data/replay.verdict.json", service = "sim" },
  { source = "/data/replay.frame_map.jsonl", service = "sim" },
  { source = "/data/replay.recording_manifest.json", service = "sim" },
  { source = "/data/replay.json", service = "sim" },              # the collect hook's fresh-process replay
  { source = "/data/replay.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robotangle-cast-coil-medium-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.4): RoboTangle cast_coil on the same frozen instance as the privileged task. Assemble the gold and silver Cast Coil pieces into their matching interlocking configuration, then release both. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "aloha", "standard-mode", "trajectory", "cast_coil"]

[metadata]
author_name = "Jianwen Lyu"
task_type = "trajectory"
simulator = "robotangle"
robot = "aloha-2"
family = "cast_coil"
mode = "standard"                  # RGB + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.4"
oracle = "full"
difficulty = "medium"
grasp = "assisted (the contact_weld_v1 grasp regions on coil_gold, coil_silver)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision release_settling_v2_grasp_contact_2mm)"
tooling_version = "19"
instance_seed = 0
expert_time_estimate_hours = 3

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 7.0
min_gpu_memory_gb = 7.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / RTX 4090 24GB / L4 24GB (sm_86 or newer)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 6.0
verifier_min_gpu_memory_gb = 7.0
measured = "GPU 5.9 GB on L4, 10.3 GB on L40S, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: sim p90 4.0 GB, privileged container 4.6 GB, verifier p90 3.9 GB, mem_guard (docker memory per container, ws-1, 10-02..10); CPU author estimate"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 21.0
measured = "GPU: 10.3 GiB on a 48 GB card, 5.9 on 24 GB (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)) -> max(1.5 x peak, peak + 4); memory: no samples of the agent's container; floor 8 GiB (at most the 16 GiB cap); whole trial: + the sim service's 13 GiB (docker peak 8.4 GiB, 47 samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 4.0, memory_gb = 16.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 16.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/PROTOCOL.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, one fresh-process replay with the video, write final.json
timeout_sec = 27000              # the end (a resume replay included) <= 1 h, the replay <= the agent's budget

[agent]
timeout_sec = 7200.0             # Agent wall-clock budget
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL §2.11
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
