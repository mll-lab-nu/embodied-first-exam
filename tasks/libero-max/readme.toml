[robots]
franka-panda = "Franka Emika Panda arm on a fixed mount with its two-finger gripper (LIBERO's OSC_POSE controller)"

# privileged/tests/grade.py main L62-108: no file -> missing_trajectory (0); lmx_tool.load_actions (plain npz, <= 2 MB,
# <= 16 unique .npy members, `actions`), as_actions (shape (T, 7), finite; clipped to [-1, 1]); 1 <= T <= the suite's
# SUITE_MAX_STEPS, else invalid_trajectory (0); one fresh-process `lmx_tool.py --replay` (RCB_AGENT_END unset: LIBERO's
# done ends the episode, Session.step L215-216); rows left after the done -> "invalid" (0); success = the replay's
# success (the done on the last row). A replay process that fails or times out (3600 s) -> grader_error = 1 (0); a
# start state that does not rebuild (exit EXIT_REBUILD) -> grader_error = infra_error = 1.
[modes.privileged]
success = """
An object's origin is its body's position in the simulator. A control step is 1/20 s. LIBERO checks the goal after
every control step, and the episode ends at the first step on which it holds.

The graded file is `/app/output/trajectory.npz` with an `actions` array of shape (T, 7), 1 ≤ T ≤ {vars[steps]} (LIBERO's
step limit for this suite), one row per control step after LIBERO's 10 warm-up steps; values outside [-1, 1] are
clipped. The verifier replays it once, open-loop, in a fresh process from the frozen start, with the scene change
applied as above. It passes when the goal first holds on the step of the last row. Rows left after the step on which the
goal first holds make the trajectory invalid, and a replay whose last row leaves the goal unmet scores 0.

A missing file, a file that is not a plain npz (at most 2 MB, only `.npy` members) with a finite `actions` array of that
shape, or more than {vars[steps]} rows scores 0, as does a replay process that fails or runs over its 1 h limit (a grader
error). A host on which the frozen start does not rebuild bit-exactly is an infrastructure error, not a score.
"""

# sim service (RCB_AGENT_END=1, RCB_MAX_CONTROL_STEPS=9000 in environment/docker-compose.yaml): lmx_tool Session.step
# L213-214 (run_on: success = LIBERO's check after the step, the episode is not ended); rcb_service _step L948-953 (the
# cap -> "step_limit"), _agent_finish L978-983 ("finished"), poll L1258-1263 (SIGUSR1 at the session's end -> "timeout"), _end
# L962-967 (success = reason in END_STATE_REASONS and the check after the last control step; no end window), a
# simulator error L857-865 -> "error" (0); the start check L705-716 (instance_mismatch, infra), resume L750-772
# (sim_crashed_on_call: 0; sim_crashed, resume_failed: infra); standard/tests/grade.py L52-58 (success AND live_success
# AND graded_by "live" AND finalized AND NOT infra AND reason != "error"). One episode: RCB_RESET_BUDGET 0.
[modes.standard]
success = """
An object's origin is its body's position in the simulator. A control step is 1/20 s.

Graded is the one live episode (no reset), with the scene change applied as above. A success does not end it: the
episode ends at the agent's `POST /finish`, after 9,000 control steps, or when the agent's session ends, and the goal
is checked once, on the state after the last control step; a success earlier in the episode does not count. A
simulator error raised by the agent's actions ends the episode with 0, as do service crashes that all happened while
serving the agent's calls. A scene that does not start at the frozen instance's recorded state, service crashes outside
the agent's calls, a resume that fails or a verdict the service never writes is an infrastructure error, not a score.
"""

