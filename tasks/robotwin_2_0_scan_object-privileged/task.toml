schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robotwin_2_0_scan_object-privileged"
description = "RoboTwin 2.0 scan_object (ALOHA-AgileX dual arm, SAPIEN): produce one replayable trajectory. Pick up the scanner with one arm and the tea box with the other, hold the tea box up in front of the robot, and point the scanner's head at the box from 0 to 7 cm away so it can be scanned. Keep both grippers closed at the end (nothing is put down). Frozen scene instance (RoboTwin seed 60417)."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "robotwin", "sapien", "aloha-agilex", "dual-arm", "code-as-policy", "trajectory", "scan_object"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robotwin"            # RoboTwin 2.0 = SAPIEN 3 / PhysX + CuRobo
robot = "aloha-agilex"
family = "scan_object"
mode = "privileged"
oracle = "full"
instance_seed = 60417             # scene = environment/instance.json (RoboTwin seed + expected initial-state hash); identity = dataset.toml digest
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
