# README data for tasks/libero-max/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text (upstream clones in /data/kangrui/tmp/readme2_B_scratch/libero-max/):
#   LIBERO-PRO @ 2b910b5 (Zxy-MLlab/LIBERO-PRO; its LIBERO package), libero/libero/envs/:
#     bddl_base_domain.py step L810-819 (done = _check_success() after every control step);
#     problems/libero_*_manipulation.py _check_success (tabletop L135-143: the AND of the BDDL goal's predicates) and
#       _load_sites_in_arena (kitchen L63-124: a region of an object is a SiteObject with the joints of the body that
#       holds it; a `living_room_table` region is a TargetZone of the ranges' half-widths, height 0.007 m, no parent);
#     predicates/base_predicates.py In L57-59 (region.check_contact(obj) and region.check_contain(obj)), On L62-64
#       (B.check_ontop(A)), Close L106-108, TurnOn L111-113, TurnOff L116-118;
#     object_states/base_object_states.py ObjectState.check_ontop L78-94 (B's origin z <= A's, contact, horizontal
#       distance of the origins < 0.03 m), turn_on L116-122 (any joint), turn_off L124-130 (every joint);
#       SiteObjectState.check_contain L159-170, check_contact L172-176 (always True: In never checks contact),
#       check_ontop L178-200 (SiteObject.under, plus contact with the parent object when the site has one), is_close
#       L214-220 (every joint of the site's body);
#     objects/site_object.py in_box L35-56 (|R @ half-sizes| about the site's centre, the bottom 0.01 m lower), under
#       L63-80 (R @ (p - c): |x|, |y| < half-sizes, half_z - 0.005 < z < half_z + 0.10); objects/target_zones.py L28-56;
#     objects/articulated_objects.py WoodenCabinet L173-195 (closed: slide > 0.0 m), FlatStove L247-292 and
#       YellowStove L295-340 (on: hinge >= 0.5 rad; off: hinge < 0.0 rad);
#     assets: articulated_objects/wooden_cabinet.xml L27 (top_side), L40-45 (top_level range -0.16..0.01, top_region),
#       L82-85 (bottom_level, bottom_region); flat_stove.xml / yellow_stove.xml L22 (cook_region), L35-36 (button hinge
#       range -0.005..2.1); stable_scanned_objects/{basket,red_basket}/*.xml L9 (contain_region);
#       turbosquid_objects/desk_caddy/desk_caddy.xml L11 (back_contain_region); turbosquid_objects/wine_rack/
#       wine_rack.xml L15 (top_region, tilted).
#   LIBERO-PRO task data @ c86fc3b (zhouxueyang/LIBERO-Pro, bddl_files/): the `(:goal ...)` of each task's
#     `substrate_variant.bddl_file` (instance.json), quoted next to each [tasks] entry below.
#   LIBERO-MAX @ a1e3cef (liberomax/LIBERO-MAX), src/libero_max/: cosmos_integration.py CosmosInterventionEnv.step
#     L221-355 (the on_proximity trigger, the change applied once, done passed through unchanged for these operations);
#     pro_runtime.py step L281-289 (done unchanged); libero_backend.py (the changes, cited per family).
#   tooling (embodied_first_exam/benchmarks/libero-max/): privileged/environment/lmx_tool.py SUITE_MAX_STEPS L42,
#     load_actions L74-88, as_actions L91-99 (shape, finite, clipped to [-1, 1]), Session.__init__ L180-200 (the start
#     hash; RCB_AGENT_END), step L203-217, _replay_main L458-483 (rows after the success: invalid), EXIT_REBUILD L52;
#     privileged/tests/grade.py main L62-108; sim/server.py step L166-168, live_verdict L177-184 (no success key);
#     standard/sidecar/rcb_service.py AGENT_END / END_STATE_REASONS L127-131, _step L939-955, _end L959-976, the start check
#     L705-716, the resume and give-ups L750-772, a simulator error L857-865, the session end L1258-1263, _write_final
#     L630-643; standard/tests/grade.py main L42-81.
# The per-task names and numbers ({vars[...]}) are generated from each task's instance.json, its BDDL goal and the
