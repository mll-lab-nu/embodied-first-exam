# tests/fem_ipc_rope_spike.py 的主配置。
#
# env 用 world_tabletop_v1 而非 fem 版：本脚本自建场景（一个地面 + 两根 FEM 绳），
# 只从 env 取 genesis 后端设置，不用 tabletop 预设的 sim 参数。

defaults:
  - config
  - override task_configs@task: untangle_continuous_topogym_tabletop_v1
  - override env_configs@env: world_tabletop_v1
  - override run_configs@run: fem_ipc_rope_spike
  - _self_

# world_tabletop_v1 的 backend 是 cpu，而本脚本迁移前的 argparse 默认是 gpu。
# 2026-08-11 首次实测时因此跑在了 CPU 上，与 demo（gpu）不可比。在这里钉住。
# 想测 CPU 与 GPU 的差别用命令行覆盖：env.genesis.backend=cpu
env:
  genesis:
    backend: gpu
