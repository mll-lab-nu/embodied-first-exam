# The IKEA furniture-assembly suite (rcb_ikea.py tooling). Each item's conditions: its scene's success.py
# (images/ikea-mujoco/scenes/<item>/success.py, module docstring and report()), plus the terminal rules of rcb_ikea.status()
# (released, at rest, no breakdown; L1308-1323), checked at the end and again after the SETTLE_S = 1.0 s hold
# (final_check, L1343-1357).

[families."ikea_eket"]
# scenes/eket/success.py (ordered operations and gates, frame joints, released, resting_on_table); END_POSE_RULES["eket"]
success = """
Success needs all of these:
- The seven operations happen in this order, each measured against the top panel: side A (the side panel that starts
  next to the top panel) entry and slide, side B entry and slide, back slide, bottom entry and slide. Each one must
  reach its goal pose within the scene's gates (goal error 0.25 to 0.8 mm, angle 0.1 to 1 degree, nearly at rest, with
  contact with its counterpart panels).
- The four frame joints (side A and side B to the top, the bottom to both sides) are latched, and the five panels are
  finite.
- At the end the panels are released (no robot contact, no applied force), rest on the table (at least one panel
  touches the table top, none touches the floor) and move slower than 0.01 m/s and 0.05 rad/s.
- At the end every panel, the back included (it has no frame joint), is still in its assembled place: within 10 mm and
  2 degrees of its goal pose relative to the top panel (the benchmark's end-pose rule, `rcb_ikea.END_POSE_RULES`).
- The two side panels are the same part, so either may take side A's place; the other is then side B.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_gladom"]
# scenes/gladom/success.py; rcb_ikea IDENTICAL_PARTS (the three short screws)
success = """
Success needs all of these:
- The retention joints of frame B, the ring and the four screws are all latched.
- Every part except frame A is at its assembled pose relative to frame A: gap within 0.8 mm along frame A's z axis,
  lateral within 1 mm, tilt within 2 degrees (screws: axis tilt; frame B and the ring may be rotated 180 degrees, the
  tray 7.5 degrees), relative speed below 0.025 m/s. The three short screws are the same part: any of them may take
  the bottom nut or either ring receiver, one screw per place.
- The tray is free (never jointed) and supported by the ring (contact above 0.01 N in at least 12 of 36 samples over the
  last 0.15 s, and above 0.01 N on average over them); no robot contact with any furniture part.
- All of the above hold continuously for 0.15 s.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_ikea365"]
# scenes/ikea365/success.py (endpoint gates f27_math.GATES, strict support probe, the operations' order)
success = """
Success needs all of these:
- The seven operations are accepted in this order: remove the screw, park the screw, cross the members, return the
  screw, reinstall the screw, turn the stand, place the bowl.
- At the end the screw is retained in member A and aligned with its seated pose relative to both members, and member B
  is retained and aligned with member A (gates: axial 0.1 mm, lateral 0.6 mm, axis 1.5 degrees; member B may be rotated
  180 degrees).
- Released and settled: no robot contact with any part, every part slower than 0.025 m/s, the bench carries the parts;
  the bowl touches the members (more than 0.1 N) and member A is turned over (its z axis pointing down).
- A support probe on a copy of the final state: the bench must carry the whole weight, and the weight plus a 2 N
  downward test load on member A (the grader applies it; it never acts during the episode), with the arms holding their
  last commands.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_lack"]
# scenes/lack/success.py report() L33-46 (task.json thresholds seat_z_m 0.012, align_xy_m 0.02, align_axis_deg 10);
# the tabletop's own orientation is not checked
success = """
Success needs all of these:
- Each leg (nut end down) is screwed onto a stud of the tabletop; any leg may go on any stud, one leg per stud.
- Every leg is seated and latched on a distinct stud, and at the end, measured in the tabletop frame: the leg origin is
  0 to 12 mm above the slab top, within 20 mm laterally of its stud, and the leg axis is within 10 degrees of the
  tabletop axis.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_stegesund"]
# scenes/stegesund/success.py (assembled_report); rcb_ikea IDENTICAL_PARTS (the halves, the bolts)
success = """
Success needs all of these:
- Every part except half A and the hex key is at its assembled pose relative to half A (a bolt: relative to the shelf):
  half B and the shelf within 0.6 mm and 1 degree; the top rod within 3 mm and 1 degree (up to the rod's own symmetry:
  it may lie end for end, or turned by a facet); each bolt within 0.6 mm along and across its bore axis, its axis within
  2 degrees (spin free). The two halves are the same part, and so are the four bolts: any one-to-one assignment to the
  places counts.
- The stand is upright: half A's z axis within 1 degree of world +z.
- Only the end state is checked, and the hex key may be anywhere at the end.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_svallet"]
# scenes/svallet/success.py
success = """
Success needs all of these:
- Both retention joints are connected (shade on the stand, bulb in the shade) and, at the end, each connector is within
  its gates (axial gap, lateral offset and axis tilt).
- The stand rests on the bench (vertical contact force above 0.1 N) and is within 3 degrees of its upright start
  orientation.
- No robot contact with any lamp part at the end.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_variera"]
# scenes/variera/success.py (task.json gates)
success = """
Success needs all of these:
- Four distinct receivers each hold a screw that was turned relative to that receiver (at least 0.4 measured turns,
  with a descent matching turns x pitch), its head seated at the shelf hole (axial 0.2 mm, lateral 0.6 mm, axis 1.5
  degrees).
- The frames are aligned under the shelf, parts are slower than 0.02 m/s, the assembly stands on the bench on its own,
  and no robot touches any furniture part.
- All of the above hold for 0.5 s.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_vesken"]
# scenes/vesken/success.py; rcb_ikea IDENTICAL_PARTS (feet, columns, trays, caps)
success = """
Success needs all of these:
- All 23 snap connections are made in the source order (each depends on the previous: feet, columns, tray, columns,
  tray, columns, tray, caps) and, at the end, each connector is within its gates (axial gap 0.6 mm, lateral 0.8 mm,
  outward-axis tilt 2 degrees). Identical parts may take any of their places, one part per place.
- The feet stand on the bench (summed vertical contact force above 0.1 N) and the bottom tray is within 3 degrees of
  its upright, unrotated assembly orientation.
- No arm link touches any furniture part or jaw at the end.

Also required, at the end: no robot link touches any part; every part is at rest (at most 0.01 m/s and 0.05 rad/s);
and the simulation never broke down at any time (no non-finite state, no MuJoCo BADQACC / BADQPOS / BADQVEL warning, no
contact of a part deeper than 10 mm).
"""

[families."ikea_eket".vars]
privileged_rule = """
Every row runs, one per control step (4 physics steps of the scene). The checks above are made on the state after the
last row, and again after the verifier holds the last row for 1.0 s more; both must pass. A replay in which the
simulator crashes, or the scene's code or MuJoCo raises an error, is a breakdown and scores 0."""
file_rule = """
- not a readable `.npz` archive of at most 64 members;
- no `ctrl` array of shape (N, number of actuators) with numeric, finite values and N at least 1;
- a `substeps` entry other than 4, or a `timestep` entry other than the scene's;"""
step_cap = ""
standard_rule = """
An end at `/finish` or at the session's end is judged on the end state, by the checks above: on the live state, then
again on a copy with the last row held for 1.0 s more; both must pass. Ordered steps count as they happened during the
episode; everything else must hold at the end. The service never reports success while the episode runs. A simulator
breakdown or a simulator error ends the episode at once and scores 0, even after a success."""

