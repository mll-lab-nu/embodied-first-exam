# Minimum compute per task (docs/protocol/README.md §2.9). scripts/task_conventions.py (`normalize`) writes the keys of every
# rule whose `match` (a regular expression) finds the task directory name into [metadata.resources] of its task.toml, in
# file order (a later rule overrides an earlier one), and renders the README's "## Compute resources" from them.
# Agent phase = every container of the trial at once (standard modes: the agent's container + the sim sidecar);
# verifier phase = after it (standard modes: the sidecar still holds the simulator while the collect hook replays).
# Derivation: measured peaks x 1.2 (memory, rounded up to a GB), x 1.15 (GPU memory, rounded up to 0.5 GB), sustained
# CPU rounded up; `measured` names the measurements. Edit these values here, not in task.toml.

# behavior, privileged: 100 task(s)
[[rule]]
match = "^behavior-.*-privileged$"
min_cpus = 6.0
min_memory_gb = 16.0
min_gpu_memory_gb = 10.5
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 6.0
verifier_min_memory_gb = 16.0
verifier_min_gpu_memory_gb = 10.5
measured = "GPU 9 GB with RCB_TEXTURE_BUDGET=0.1 (evaluation-pool GPU-memory override; live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 cloud GPU hosts + an RTX 4090 workstation, 10-10): 8.3-9.0 GB); CPU 6-9 cores per trial (ps); author: 13-16 GB of RAM per Isaac process"

# behavior, standard: 100 task(s)
[[rule]]
match = "^behavior-.*-standard$"
min_cpus = 6.0
min_memory_gb = 16.0
min_gpu_memory_gb = 10.5
