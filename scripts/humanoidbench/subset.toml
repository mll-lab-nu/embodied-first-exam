# C8 · mobile manipulation
# =====================================================================================================
[[task]]
family = "room"
role = "scored"
robot = "h1hand"
env_id = "h1hand-room-v0"
paper_category = "manip"
capability_class = "C8 · mobile manipulation"
status = "verified"
expert_hours = 5.0
completion_rate = "44%"
evidence = "paper 128, FastTD3 177, bar 400"
oracle_evidence = "none known: no run has passed it, and published RL reaches 44% of the bar (paper 128, FastTD3 177, bar 400)"
one_liner = "tidies six objects scattered around a room with the Unitree H1"
task_statement = '''six loose objects — a chair, a trophy, a pair of headphones, two packages and a snow
globe — are scattered around the room (the table and the bookshelf are fixed). Tidy up: gather them
together, so they end up close to one another rather than spread out.'''
scene_note = "the objects' starting positions and the robot's initial pose never change between resets."
scoring_note = '''Unusually, this task gives you no target positions at all. The dominant term measures
how *spread out* the six objects are — the variance of their horizontal coordinates — and rewards making
that small; a smaller term pays for standing steadily. Any arrangement that brings the objects close
together scores, wherever in the room you do it.'''
ends_note = "The episode ends if the pelvis drops near the ground."
obs_layout = "qpos(118) + qvel(111), robot + all six objects"
task_notes = ""
difficulty = '''- **The only task in the benchmark whose objective is a statistic, not a pose.** Upstream scores
  `tolerance(max(variance of the objects' x and y), margin=3)` — there is no destination to reach and no
  per-object goal. The agent has to invent the placement, which is a planning problem no other task in the
  subset poses. (This is also why the old "= `package` six times over" reading was wrong: `Room` is an
  independent `Task` with an independent reward.)
- **Six objects, 42 DoF of task state** — the widest scene in the subset — on top of 61 actuators.
  Every object moved is a chance to knock another one away.
- **Mobile manipulation without a script.** The robot must walk to each object, pick or push it, and
  return; the order is the agent's to choose, and a bad order costs the whole episode.
- **Holding the start pose lasts 123 steps** and earns 5% of the bar, so nothing is given away.'''

