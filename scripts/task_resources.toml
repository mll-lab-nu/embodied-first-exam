# ---------------------------------------------------------------------------------------------------------------------
# Resource LIMITS and CAPS (docs/protocol/README.md §2.10, v1.1.5; enforced from v1.2). All sizes in GiB.
# [[limit]] -> [metadata.resources.limits]: the most the agent phase may use. normalize writes it into task.toml and
#   renders it into instruction.md ("## Resource limits") and the README. scope "trial" (privileged: every container the
#   agent drives, i.e. all but a benchmark-owned service such as RoboPaint's scorer, images/monitor/rcb_monitor/inject.py
#   BENCHMARK_SERVICES) or "agent" (standard modes: the agent's container only; the sim sidecar is the benchmark's and
#   never counts).
#   From v1.2 the task's monitor measures it and, with RCB_LIMITS_ENFORCE=1, a sustained violation (sustain_sec above a
#   limit within any window_sec) or an out-of-memory kill fails the trial; with 0 (the default) it is only recorded.
# [[cap]] -> [metadata.resources.caps]: docker caps per compose service (cpus, memory_gb, pids), applied by v1.2 and
#   the caps docker really applies: normalize sets [environment].memory_mb = main.memory_gb x 1024 (Harbor writes main's
#   memory and CPU caps from [environment]), images/monitor/rcb_monitor/inject.py writes the other values into the compose file
#   unless a service sets one itself, and then the value here must be that one (ci_checks/check-resources.py compares).
#   Memory caps sit above the limits (limit <= cap / 1.2 and <= cap - 2) so that the monitor sees a violation before the
#   kernel's OOM killer; pids (threads) >= 8 x max_processes for the services the limits bind.
#   A cap is never below what the task says it needs (ci_checks/check-resources.py): min_cpus <= the CPU caps of all
#   services together, and where the verifier phase runs in a sidecar (a [[verifier.collect]] hook replays there),
#   verifier_min_memory_gb <= the memory caps of those sidecars (a sidecar killed at a cap below its own declared
#   minimum would be the benchmark's failure). A CPU cap above the host's CPU count means the host's count: docker
#   refuses such a container ("range of CPUs is from 0.01 to N"), so a runner clamps the cap to the host's count before
#   it starts the trial (PROTOCOL §2.10); the values here are not lowered for small hosts.
# Same matching as [[rule]] (every matching rule applies, in file order). Edit the values here, not in task.toml.
# How the values were set (owner, 10-10: from measured consumption, generous margins, so that no past trial exceeds them):
# - GPU memory (simulator side): max(1.5 x peak, peak + 4) over the evaluation pool's GPU profile (per-trial peaks by card,
#   10-03..10), at least 16 for Isaac Sim; BEHAVIOR-1K from its peak with RCB_TEXTURE_BUDGET=0.1, the tasks' default since
#   v1.1.5. Privileged: the limit; standard: trial_max_gpu_memory_gb only (no standard agent container has a GPU).
# - memory, privileged: the [environment] cap every past trial ran under (at least min + 2); RoboPaint's scorer service
#   is the benchmark's own (recorded only): its 5 GiB margin is in trial_max_memory_gb, not in the limit; standard agent: max(1.5 x peak, peak + 4, 8) of the agent container's docker peak (mem_guard, 10-02..10),
#   at most its [environment] cap; trial_max adds the sim sidecar's max(1.5 x peak, peak + 4) (Embodied Olympics: its mem_limit).
# - processes 512 and disk (10 GiB CPU-only privileged, 20 GiB Isaac and standard) under /app, /tmp and /root: not yet
#   measured; the v1.2 calibration batch confirms or changes them. `measured` in each rule says what each value rests on.

[[limit]]
match = "^behavior-.*-privileged$"
scope = "trial"
max_gpu_memory_gb = 24.0
max_memory_gb = 24.0
max_processes = 512
