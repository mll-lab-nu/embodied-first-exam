# Standard mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# Isaac Sim needs an RTX-class GPU even headless (RoboDojo runs PhysX with GPU dynamics). The sidecar is TRUSTED: its Kit cache is
# the trusted volume, never mounted where agent code runs (Isaac keeps generated Python there that Kit imports); it has no
# fixed name, so every trial's compose project gets its own (Harbor's teardown deletes it).
# Crash recovery (docs/protocol/standard_mode.md §13): run.sh exits non-zero when the service crashes and compose restarts the
# same container (its /data kept); the service resumes the episode from its journal. RCB_STARTUP_TIMEOUT_S: the startup
# watchdog, at least twice the slowest measured scene build (about 3.5 min per start on a warm shader cache).
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 16   # rcb-monitor
    mem_limit: 25600m   # rcb-monitor
    pids_limit: 2048   # rcb-monitor
    x-gpu-memory-gb: 16   # GiB   # rcb-monitor
    build:
      context: ./sim
      dockerfile: Dockerfile
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:robodojo-0.2.1"]   # our prebuilt image: its layers are reused when you can pull it, else Docker builds the recipe
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - rcb_robodojo_cache_trusted:/cache
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_AGENT_END: "1"                               # agent-ended episodes (PROTOCOL §3)
      RCB_STEP_LIMIT: "1300"                           # RoboDojo's step_lim for this task
      RCB_TASK: pack_objects_into_box_random
      RCB_INSTANCE: /srv/instance.json
      RCB_TOOL: /srv/rcb_robodojo.py
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "3600"   # = task.toml [agent] timeout_sec (reported only: spec budget, meta time_left_s)
      RCB_STARTUP_TIMEOUT_S: "1800"
      PYTHONPATH: /srv
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
  rcb_robodojo_cache_trusted:
