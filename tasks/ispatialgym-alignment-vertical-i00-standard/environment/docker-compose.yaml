# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# The licensed BEHAVIOR dataset is a precondition of every run ($RCB_BEHAVIOR_DATA, docs/benchmarks/ispatialgym.md): it is
# mounted whole and read-only at /bdata, which the image links into /data next to its own ispatialgym-assets; the service writes its
# record to /out (the container's own file system: it survives compose's restarts of the same container). Crash recovery
# (docs/STANDARD_MODE.md §13): run.sh exits non-zero when the service crashes and compose restarts the container, which
# resumes the same episode from its journal. The sidecar is TRUSTED: its Kit cache is a volume of this trial only.
services:
  main:
    pids_limit: 16384   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 12   # rcb-monitor
    mem_limit: 32768m   # rcb-monitor
    pids_limit: 16384   # rcb-monitor
    image: ghcr.io/mll-lab-nu/eai-ispatialgym:0.2.0
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
      - ${RCB_BEHAVIOR_DATA:?set RCB_BEHAVIOR_DATA to the directory holding your licensed BEHAVIOR dataset (docs/benchmarks/ispatialgym.md)}:/bdata:ro
      - rcb_ispatialgym_cache_trusted:/cache
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_INSTANCE: /srv
      RCB_TOOL: /srv/rcb_ispatialgym.py
      RCB_DATA: /out
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "2400" # startup watchdog: 2x the slowest scene load measured (1013 s), at least 2400 s
      RCB_COLLECT_BUDGET_S: "8120"
      PYTHONPATH: /srv
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/PROTOCOL.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/eai-monitor:0.1.0@sha256:f2c910f53f79c2bfa4a71298b10c78383cae3afc40720ca562cc845b8d20fb0c
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor:/opt/rcb_monitor:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
  rcb_ispatialgym_cache_trusted:
