# Default to an integrated variation; unavailable sweep selections fail at prepare.
experiment: buzz_wire_3d_rollout
attempts: 1
concurrency: 1
timeout_sec: 3600
usage:
  mode: observed
  scope: trial
  limits: {input_tokens: 10000000, output_tokens: 3000000}
instances:
  - name: buzz-wire-3d-medium-seed0
    evaluation: task_success
    mode: limited
    state_fields: []
    initial_observation_steps: 5
    instruction: |-
      Guide the handheld metal loop along the entire wire from its starting end
      to the finish, keeping the wire inside the loop opening throughout traversal.
      Do not let the metal loop touch the wire. Reaching the finish by taking the
      loop off the route is not completion. Place the tool on the finish support,
      release it, withdraw the gripper and let it settle.
    simulator:
      task_id: buzz_wire_3d
      robot_id: auto
      variation_id: medium
      seed: 0
      control_mode: EE_ABS
      enable_privileged: false
      compute_backend: cuda
      render_backend: nyx
      enable_rgb: true
      physics_dt_s: 0.0025
      solver_substeps: 4
      control_decimation: 10
      max_physics_steps: 10000
