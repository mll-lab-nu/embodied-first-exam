# Generated from scripts/kinder/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/kinder-dyn-scoop-pour-2d-i00"
description = "KinDER DynScoopPour2D-o10: produce one replayable trajectory that reaches the goal, frozen scene instance i00."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", "pymunk", "2d", "manipulation", "physical-reasoning", "trajectory", "dyn-scoop-pour-2d"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "dynamic2d"
# KinDER env kinder/DynScoopPour2D-o10-v0
family = "dyn-scoop-pour-2d"
tier = "privileged"
# scene = environment/instance.json (KinDER's seed + a digest of the scene it builds); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Off the network like every task here (docs/LEAKAGE.md); the model API is opted into per run with
# `harbor run --allow-agent-host <host>`.
network_mode = "allowlist"
allowed_hosts = []

[environment]
build_timeout_sec = 1800.0
cpus = 16
memory_mb = 16384
