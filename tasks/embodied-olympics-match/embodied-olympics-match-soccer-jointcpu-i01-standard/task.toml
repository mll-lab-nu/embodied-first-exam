# Exported by Embodied Olympics from its joint-level soccer pilot v5: do not edit.
# Embodied First Exam: the standard twin of the exported realtime task (the same export; the world in lockstep:
# environment/sim/core/lockstep.py; ci_checks/benchmarks/embodied-olympics-match/exported.toml).
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
  { source = "/data/fingerprint.json", service = "sim" },
  { source = "/data/fingerprint.log", service = "sim" },
]

[task]
name = "embodied-first-exam/embodied-olympics-match-soccer-jointcpu-i01-standard"
description = "STANDARD (Embodied Olympics / Embodied Agent Olympics, our own service): humanoid robot soccer 2 v 2 at the JOINT LEVEL (12 leg joint targets per Booster T1 every 20 ms, no walking policy, no kick skill), coach format (the agent commands both robots of its team) against a learned opponent team at the joint level (level 5: its two T1s walk on a policy trained with reinforcement learning on the same joint interface and limits as yours; a learned strategy layer decides what each robot does), program play (eai-standard-lockstep/1.0: the world advances only while the player waits or an act takes effect and stands still between its calls; it freezes at every stoppage for the player's review, at most 300 s). CPU-only resource tier (6 CPU cores, numpy / SciPy / MuJoCo; no GPU, no ML framework); any method (hand-written, planning, optimisation, learning); a practice service with full copies of the match world. 2 h development (start window), then the match. The twin embodied-olympics-match-soccer-jointgpu-i01-standard is the same match in the other resource tier. Frozen development instance (seed and opponent fixed, not an official seed). Exported from Embodied Olympics pilot v5 (task soccer-match-wallclock-program-lowlevel-standard)."
keywords = ["robotics", "embodied-olympics", "sports", "soccer", "mujoco", "standard-mode", "lockstep", "joint-level", "cpu-only"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "booster-t1"
family = "soccer_jointmatch"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard-lockstep/1.0"
instance_seed = 101
opponent_level = 5
resource_tier = "cpu"
tier_twin = "embodied-olympics-match-soccer-jointgpu-i01-standard"
start_window_s = 7200
review_timeout_s = 300
revision = "soccer-2v2-11"
play = "program"
action_level = "joint"
source_task = "roboolympics/soccer-match-wallclock-program-lowlevel-standard"
source_builder = "Embodied Olympics joint-level soccer pilot v5"
source_commits = ["7ae66874c32e"]
exporter = "Embodied Olympics soccer pilot exporter"
player_mode = "unmetered"
official = false
expert_time_estimate_hours = 2.0
oracle = "partial"
oracle_evidence = "soccer-2v2-11, level 5 = our joint-level RL team (sports/soccer/rl/joint/v2: an omnidirectional gait trained with PPO at the joint level, about 1e9 steps, and an RL-trained strategy layer). The three frozen GPU-tier programs of GPT-6 Astra from our v5 pilot (developed on soccer-2v2-10 against level 2, unchanged) win 30 % of 90 practice matches against level 5 v2 (40 % against v1; against v1 on further seeds 48/150 = 32 % and 43 % of 150); a mirror match of v1 is even (24/50); scripted levels 2 and 3 never beat it (0/20, 0/40). Our joint-level reference team (the oracle) lost to level 5 v1 0:10 in both tasks on vanilla Harbor 0.23.0 (valid, replay identical, replay.mp4)"

[verifier]
timeout_sec = 3960.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running (a program would keep playing; the match is graded as it stands).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then SIGUSR1 ends the match: the service writes the verdict of the live match ("graded_ready"; no grading replay)
# then the spectator video (replay.mp4), then the walking-policy audit (sim/audit/policy_fingerprint.py),
# which replays the match only when seat A won it live: it can only take a win away (tests/fexam_reward.py).
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 1800); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000; timeout 1100 python3 /srv/audit/policy_fingerprint.py /data/episode.jsonl /srv --every 20 --out /data/fingerprint.json > /data/fingerprint.log 2>&1; tail -c 400 /data/fingerprint.log; exit 0"
timeout_sec = 3780

[agent]
timeout_sec = 14400
# The agent reaches the model APIs, the package registries, the match service (localhost:8000) and its practice service
# (localhost:8100) under Harbor's egress control.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 6
memory_mb = 16384
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
