schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/metaworldplus-plate-slide-side-i00-privileged"
description = "MetaWorld+ (Meta-World v3 plate-slide-side, Sawyer arm): Slide the plate sideways into the target position. Produce one replayable trajectory of Meta-World's native actions on a frozen instance; graded on the state after the last action."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "mujoco", "metaworld", "sawyer", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "mujoco"
robot = "sawyer"
family = "metaworld/plate-slide-side"
mode = "privileged"
oracle = "full"
instance_seed = 0             # Meta-World's reset randomization (object and goal positions)
expert_time_estimate_hours = 0.5

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 4.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 2.0
verifier_min_gpu_memory_gb = 0.0
measured = "memory: privileged container p90 2.7 GB, sim 0.7 GB, mem_guard (docker memory per container, mll-4090-1, 10-02..10); CPU-only; CPU author estimate"

[metadata.resources.limits]
# agent-phase limits; exceeding one fails the trial. scope: trial = every container, agent = the agent's container (docs/PROTOCOL.md §2.10)
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app"]
sustain_sec = 60.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 8.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Meta-World's scripted policies solve these tasks and are publicly downloadable, so egress is closed to the model APIs.
network_mode = "allowlist"      # model APIs only (scripts/set_agent_egress.py); PROTOCOL §2.7
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 1800.0
