# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# GPU on sim: physics and the whole-body controller run on the CPU, but upstream's env renders the robot's three cameras
# every control step, and every image the agent asks for is rendered here (EGL). `graphics` mounts the EGL ICD.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 10240m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    image: ghcr.io/mll-lab-nu/eai-bigym2:0.1.1
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
    command: python /srv/server.py
    restart: on-failure:6                               # a crash resumes the same episode, never a reset (rcb_service.py)
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_TASK_TEXT: "Take the plates from the dish rack and gently slot them into the dishwasher's lower rack."
      RCB_EPISODE: "one episode, no reset: it succeeds when this has held for 1 s (50 control steps): each of the two plates stands on edge in the dishwasher's lower rack: its face toward your left or right (its axis within 20 degrees of the robot's left or right at the start), touching the lower rack, held by neither gripper; both plates at once (held = a finger of the gripper touching the object); a plate touching the floor ends the episode as a failure; a fall (pelvis tilted beyond ~53 degrees or below 0.30 m) fails it without ending it; it ends at the success, a failure, the pelvis 10 m from the scene's origin, a simulator error, or after 3150 control steps"
      RCB_WALL_CLOCK_S: "3600"
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the standard
      # configuration; results under other settings are reported separately.
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-0}"        # 0: one episode (the protocol's default)
      RCB_IMAGE_HW: "${RCB_IMAGE_HW:-84}"               # the side of each onboard camera's square image, pixels (84: upstream's)
      RCB_SESSION_LOG: ""
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/PROTOCOL.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/eai-monitor:0.1.0@sha256:f2c910f53f79c2bfa4a71298b10c78383cae3afc40720ca562cc845b8d20fb0c
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor:/opt/rcb_monitor:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
