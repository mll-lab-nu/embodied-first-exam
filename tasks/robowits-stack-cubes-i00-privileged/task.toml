schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robowits-stack-cubes-i00-privileged"
description = "RoboWits stack_cubes (bimanual Marvin, Genesis): produce one replayable trajectory. Build a stable two-layer stack so the red cube's center is above the green colored dot. Frozen scene instance (RoboWits evaluation scene 0 of task 14)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robowits", "genesis", "marvin-bimanual", "dual-arm", "code-as-policy", "trajectory", "stack_cubes"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robowits"            # RoboWits @ 9cc30ae on Genesis 0.4.7 (CPU physics backend, EGL rendering)
robot = "marvin-bimanual"
family = "stack_cubes"
mode = "privileged"
oracle = "partial"
oracle_evidence = "Reference solution solution/oracle_stack_cubes.py with its skills in solution/ref_primitives.py (written for this instance; RoboWits ships no expert). It scored 1 under Harbor -a oracle on an earlier version of this task: job robowits-stack-cubes-i00-oracle-thin-0925-000706, trial robowits-stack-cubes-i00__2rVdsVe, 2026-09-25 (laptop, Intel; success=1, deterministic=1, instance_exact=1; an uncommitted tree just before dev/qineng f15dbdb7). Same since then: the frozen instance (state hash 41c4d7e7d7193b0d) and the oracle script (byte-identical to that run's /app/output/gen.py; ref_primitives.py unchanged since f15dbdb7). Changed since then, so the label is partial: the grader tests/grade.py (dev/qineng 82d76c61 added the GPU-backend exception; this PR writes the verdict before the video) and the tooling rcb_robowits.py (dev/qineng 5aa848bd, bddfc520, adce3fef, 8f0ebd55, 82d76c61, 6c0b439e, fe5fb9e6, 1515ea4e). Not re-run on this version (static validation only, 2026-10-01)."
instance_seed = 0                 # scene = environment/instance.json (entry 0 of RoboWits' eval_dataset_50/14.json + expected state hash); identity = dataset.toml digest
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 5400.0             # RoboWits budget: 1.5 h of wall clock (docs/benchmarks/robowits.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[environment.healthcheck]
# The agent's clock starts once the simulator is ready (docs/PROTOCOL.md §2.9). The agent starts the simulator in its own
# processes, so before Harbor sets up the agent it runs this warm-up in the agent's container: one launch of the simulator
# with the frozen instance through the task's own tooling, which pays the trial's one-time start-up (shader and kernel
# caches, the instance check) outside [agent].timeout_sec. It writes no session log, trace or output; its log, with the
# start and end times, is /logs/artifacts/rcb_warmup.log (a trial artifact).
command = '''
exec >> /logs/artifacts/rcb_warmup.log 2>&1
date -u +"%FT%T.%3NZ warm-up start"
RCB_SESSION_LOG= RCB_SESSION_LOG_KEEP= RCB_AGENT_TRACE_DIR= timeout -k 30 3300 python - <<'PY' || exit 1
import json
from rcb_robowits import Session
I = json.load(open("/app/instance.json"))
s = Session(I["task"], instance="/app/instance.json")
s.close()
PY
date -u +"%FT%T.%3NZ warm-up done"
'''
timeout_sec = 3600.0
retries = 2

[verifier.environment]
build_timeout_sec = 1800.0
