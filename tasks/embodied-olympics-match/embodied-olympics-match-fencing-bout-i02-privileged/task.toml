schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-fencing-bout-i02-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): robot epee fencing, one FIE direct-elimination bout fenced phrase by phrase against the scripted fencer at level 2 on the frozen instance of embodied-olympics-match-fencing-bout-i02-standard (seed 35, a turn sport, chess clock 3600 s). Full simulator in development (read and change any state, reset the whole bout); the deliverable is a closed-loop Python program that fences a fresh unmodified bout in the verifier on the twin's turn service, seeing the full state instead of the observation."
keywords = ["robotics", "mujoco", "fullsim", "policy", "fencing", "turn-based"]
[metadata]
task_type = "policy"
simulator = "mujoco"
robot = "unitree-g1"
family = "fencing_bout"
dynamics = "dynamic"
instance_seed = 35
opponent_level = 2
chess_clock_s = 3600
source_commits = ["a6712a675343"]
source_task = "roboolympics/fencing-bout-wallclock-program-standard"
exporter = "Embodied Olympics full-simulator exporter"
official = false
expert_time_estimate_hours = 0.5
oracle = "full"
oracle_evidence = "full-state reference program (solution/): the twin's reference player (builtin_players.Reference, seed 0) as a program; a local Harbor oracle run won 15:13 (valid, replay identical); the nop (no program) scores 0"
validated = true

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240
[verifier]
timeout_sec = 6300.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
