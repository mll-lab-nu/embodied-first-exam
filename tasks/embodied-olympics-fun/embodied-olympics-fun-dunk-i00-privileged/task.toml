schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-dunk-i00-privileged"
description = "Embodied Olympics dunk (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Dunk the basketball with both hands: holding it in your two hands, jump, force it down through the ring from above with both hands on it, and land on your feet. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "dunk"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "dunk"
category = "basketball-and-rackets"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 14.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: No reference solution in the task. An own-motor dunk from this start is shown by search (CMA-ES over joint targets on a lowcmd jump, then the walking policy for the landing, about 7,000 episodes): a deep squat, a jump with an arm swing (the pelvis 0.43 m above standing), the fingers half closed over the ball in the air, the ball's centre at most 2.53 m, carried into the ring by both hands 0.10 m from its axis, through at 2.74 s, standing at 4.79 s; rim and backboard contact 0.10 s; the energy is paid for by the actuators' work (+671 J against +605 J of mechanical energy in the take-off), feed-forward torque at most 100 N m, no weld. Plain open-loop jumps with the ball raised from the chest come no nearer than 0.24 m to the ring's axis above the rim. Positive by a declared magic action: the real open-hand hold and raise, a ghost jump (an upward force field on the robot's bodies for 0.35 s, the ball carried only by the hands), robot and ball teleported together over the ring at the apex, the ball going down through the real ring with both hands on it, the hands opening, an injected upright landing, a real stand; the same state hash twice; with the real landing it also stands. Negatives: nop (time, the ball still in the hands), a drop above the ring, a release over the rim, a one-hand entry, up through the ring from below, a miss after a release inside the ring, the ball on the floor, travelling (walking with the ball), hanging on the ring, a fall. The start squeeze holds an extra 0.8 g on the ball.; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
