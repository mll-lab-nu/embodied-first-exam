experiment: fiber_bundling_rollout
attempts: 1
concurrency: 1
timeout_sec: 7200
usage:
  mode: observed
  scope: trial
  limits:
    input_tokens: 1000000
    output_tokens: 300000
  on_usage_unavailable: fail
  watchdog_interval_ms: 100
  stop_grace_ms: 1000
instances:
- name: fiber-bundling-medium-seed0
  evaluation: task_success
  mode: unlimited
  state_fields:
  - world
  initial_observation_steps: 5
  instruction: |-
    Manipulate the thick sheath with the robot gripper to pass every fine fiber
    through the fixed copper ring, tip first and in tip-to-root material order,
    until all roots and the front sheath have passed and cleared the ring.
    The rear terminal stays anchored and must not pass through the ring.
    Any gripper contact with a fine fiber ends the task in failure.
    Avoid sharp bends and collisions; passing only the tips is not completion.
    Keep the completed configuration stable.
  simulator:
    task_id: fiber_bundling
    robot_id: panda_robotiq
    variation_id: fiber_bundling_medium
    seed: 0
    control_mode: EE_ABS
    enable_privileged: true
    compute_backend: cuda
    render_backend: nyx
    enable_rgb: true
    physics_dt_s: 0.0025
    solver_substeps: 4
    control_decimation: 10
    max_physics_steps: 80000
