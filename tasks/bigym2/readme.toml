# README data for tasks/bigym2/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text (upstream swirl-uk/BiGym2 @ 93ad4b3, read-only clone):
#   held success  bigym/bigym_env.py: `success` L247-257 (the predicate `_success` held for success_hold_steps
#                 consecutive control steps, counter L700-708), `fail` L287-290, `terminate` = success or fail L297-300,
#                 base `_fail` L759-772 (pelvis more than MAX_DISTANCE_FROM_ORIGIN = 10 m from the origin, L47);
#                 bigym/loco/config.py L143 success_hold_seconds = 1.0 (50 control steps at 50 Hz)
#   fall          bigym/loco/base.py is_failed L160-189: projected gravity z > -0.6 (tilt past ~53 deg) or pelvis below
#                 height.low (0.4 m) - 0.10 = 0.30 m; bigym/loco/env.py episode_fell L291-293 (latched),
#                 episode_succeeded L295-302; bigym/loco/eval/protocol.py is_success L37-48 = succeeded and never fell
#   predicates    bigym/envs/<module>.py `_success` / `_fail` of each task's G1 class (bigym/loco/tasks.py TASKS
#                 L135-177: class, episode length in 500 Hz env steps = 10 x the control steps, reach_tolerance 0.05)
#   "held"        robots/robot.py is_gripper_holding_object L153-157: a finger of that gripper touching the object
#   tooling       embodied_first_exam/benchmarks/bigym2/privileged/environment/rcb_bigym2.py (docstring L1-17;
#                 Episode.done L131-137 / success_end L139-143 / success_now L145-148; replay L301-338)
#   privileged    .../bigym2/privileged/tests/grade.py L76-124
#   standard      .../bigym2/sim/server.py (docstring L1-26: run_on, success_now, end_judgement "state",
#                 end_window_steps = success_hold_steps L65-66, step cap L135-145) and standard/sidecar/rcb_service.py _end()
#                 L960-968, end window L1320-1333; RCB_RESET_BUDGET default 0 in environment/docker-compose.yaml
#   realtime      the realtime layer embodied_first_exam/standard/realtime/rcb_realtime.py (as humanoidbench)

