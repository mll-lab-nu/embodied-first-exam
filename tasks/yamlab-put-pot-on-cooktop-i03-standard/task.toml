# Generated by scripts/yamlab/mk_tasks.py -- edit the template or scripts/yamlab/instances.json, not this.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/yamlab-put-pot-on-cooktop-i03-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): YAMLab PutPotOnCooktop-v0 on the same frozen instance as the privileged task (`pot` = `Pot/pot_003` and `cooktop` = `Cooktop/cooktop_003`). Task: lift the pot with both arms (both grippers holding it), put it down upright on the cooktop and let go. The agent only gets a client: get_obs (RGB, depth + proprioception of both arms), submit (joint_position or ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "yamlab", "isaac-lab", "isaac-sim", "bimanual", "i2rt-yam", "standard-mode", "trajectory"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "yamlab"
robot = "i2rt-yam-bimanual"
family = "put_pot_on_cooktop"
mode = "standard"                  # robot as a service: RGB, depth + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.2"
oracle = "full"
expert_time_estimate_hours = 3.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 8.0
min_memory_gb = 16.0
min_gpu_memory_gb = 5.0
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 8.0
verifier_min_memory_gb = 15.0
verifier_min_gpu_memory_gb = 5.0
measured = "GPU 3.8-4.0 GB per trial, anon memory 11.1-11.8 GB, CPU p90 5.8-8.7 cores over 12 trials, live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 AWS hosts + ws-1, 10-10); vram_profile peaks 5.5-6.5 GB on 24 GB cards; board 0048: about 11 GB RAM and 8 CPUs per simulator; verifier 7.2 GB, mem_guard (docker memory per container, ws-1, 10-02..10)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 27.0
measured = "GPU: 10.4 GiB on a 48 GB card, 6.5 on 24 GB (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)) -> max(1.5 x peak, peak + 4), at least 16 for Isaac Sim; memory: agent container docker peak 1.5 GiB over 1 samples (mem_guard (docker memory incl. page cache, top-4 containers every 10 min, ws-1, 10-02..10)) -> max(1.5 x peak, peak + 4, 8), at most the 24 GiB cap; whole trial: + the sim service's 19 GiB (docker peak 12.4 GiB, 1 samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 8.0, memory_gb = 24.0, pids = 16384 }
sim = { cpus = 16.0, memory_gb = 23.0, pids = 16384 }

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json
timeout_sec = 15000               # = finalize.sh's HOOK_BUDGET_S (keep them equal): the episode end (up to 2700 s through a
                                  # resume) + two fresh-process replays of up to 5700 s each (an Isaac start, 629 s measured on
                                  # a loaded host, + up to 100,000 control steps at 60-120 steps/s, half that on a busy host,
                                  # the first one filmed) + 900 s; finalize.sh ends a replay that would pass this deadline and
                                  # records it (replay_error, infra_error)

[agent]
timeout_sec = 5400.0              # YAMLab budget, both modes (docs/benchmarks/yamlab.md)
# YAMLab's teleoperation demonstrations (which solve these exact instances) and its MimicGen datasets are public upstream,
# so the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
