schema_version = "1.3"
artifacts = ["/app/output/", "/logs/agent/rcb/"]

[task]
name = "robot-coding-bench/sim_to_real-pack-tote-i00-privileged"
description = "Sim-to-real on the I2RT YAM bimanual station (MuJoCo digital twin): pack the groceries into the tote; produce one replayable, rate-limited joint trajectory from a frozen instance (seed 4202)."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "mujoco", "sim-to-real", "i2rt-yam", "bimanual", "code-as-policy", "trajectory"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "mujoco"
robot = "i2rt-yam-bimanual"
family = "pack_tote"
mode = "privileged"
oracle = "full"
instance_seed = 4202
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public); no reference solution for these scenes exists outside solution/.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 1800.0
