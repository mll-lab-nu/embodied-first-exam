# Generated by scripts/libero-max/generate.py -- edit the template or cases.json, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/replay.video.json", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{name}}-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): LIBERO-MAX ({{suite}}, {{event_words}}; Franka Panda) on the same frozen instance as {{name}}-privileged: {{instruction_toml}} Mid-task the scene changes ({{event_words}}). The agent only gets a client: two cameras (RGB, optional depth, calibrated) and the robot's own state; LIBERO's OSC control steps in chunks; one episode, no reset, no object poses; the sim service records the episode and grades it as it ran (no replay)."
authors = [{ name = "{{author}}" }]
keywords = ["robotics", "libero", "libero-max", "robosuite", "franka-panda", "online-event", "code-as-policy", "trajectory", "standard-mode"]

[metadata]
author_name = "{{author}}"
author_org = "{{org}}"
task_type = "trajectory"
simulator = "robosuite"
robot = "franka-panda"
family = "libero-max/{{suite}}/{{event}}"
mode = "standard"
protocol = "eai-standard/2.1"
oracle = "full"
instance_seed = {{seed}}
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container, so nothing drives the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: environment/sim/finalize.sh sends SIGUSR1 to the service (re-sent every 30 s, in case it was
# restarting), which ends the episode and writes the verdict, the live episode's, within seconds (nothing is replayed to
# grade it; board 0151). Then one video-only replay of the trajectory in a fresh process, which can neither change nor
# cost the verdict; for a long episode on a busy host it takes over an hour: the hook waits up to {{collect_wait}} s in
# all ({{std_cap}} steps at 0.5 s + 180 s to build the scene + 240 s of frames = 4920 s); timeout_sec = 180 s for the
# service's PID file + {{collect_wait}} s + 120 s (docs/benchmarks/libero-max.md, "Grading (standard mode)").
[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"
timeout_sec = {{collect_timeout}}

[agent]
timeout_sec = {{agent_timeout}}
# The agent container holds no simulator, but LIBERO's demonstrations and LIBERO-MAX's policies are public upstream: the
# agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 600.0
