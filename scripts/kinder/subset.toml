# KinDER subset -- the single source for every tasks/kinder-* directory (`gen_tasks.py render` writes them).
#
# Which tasks: KinDER's Dynamic3D tasks (MuJoCo, a TidyBot++ mobile manipulator), the ones whose goal a camera can see
# or a sentence can name, one variant each (docs/benchmarks/kinder.md); the section at the end adds the rest of KinDER
# for screening. Each of the six ships twice: full mode
# (tasks/kinder-<family>-i00: the simulator and its state, one replayable trajectory) and limited mode
# (-limited: the robot as a service, its own sensors only).
#
# task_statement is all an agent is told about the goal, in both modes, so it must name the goal exactly as KinDER
# checks it (the task JSON's goal_state): which objects, which place, and when it counts. It says what is visible;
# never how to do it.
#
# Every task is set in KinDER's MimicLabs lab (rcb_kinder.SCENE_BG: images only, the physics is the same bit for bit).
# task_view is the camera limited mode serves as room_camera; a task sets it here only where upstream's own looks
# down from high overhead, which would hand the agent a map: a camera where a lab would put one instead, looking
# down less than 45 degrees.

[defaults]
instance_tag = "i00"
seed = 0                  # KinDER draws the scene from this seed; the instance pins it (instance.json)
max_steps = 1000          # upstream's episode length for these tasks (TidyBot3DConfig.horizon): 100 s at 10 Hz
agent_timeout_sec = 3600
verifier_timeout_sec = 900

[[task]]
family = "tossing"
env_id = "kinder/Tossing3D-o1-v0"
task_view = { position = [1.0, -2.6, 2.4], lookat = [1.4, 1.2, 0.2], fovy = 65 }   # upstream: 5.5 m up, 72 deg down
expert_hours = 3.0
task_statement = """get the green cube lying on the floor into the yellow bin on the far side of the low wall that
runs across the room. The task succeeds the moment the cube's centre is inside the bin's goal region, the translucent
green box marked in the bin."""

