# roboEngineer's tasks keep the benchmark's own multi-round runtime (PROTOCOL §3: a benchmark with its own runtime;
# Appendix H applies unchanged; results are reported apart): the agent tunes a numeric policy against a public nominal
# simulator in its own container, deploys it to the private evaluator in the `sim` sidecar for at most three feedback
# rounds (noisy telemetry and camera images back), and the sidecar evaluates the selected policy on a private held-out
# bank (docs/benchmarks/roboengineer.md, docs/benchmarks/roboengineer-policy.md). ci_checks/check-protocol.py accepts
# the protocols below for the directories listed here only.
# `source_task`: the package name in PR #329 (WENLIXIAO-CS,
# experimental/roboengineer/tasks/ there). The Control Transfer tasks keep its plant seeds and case banks; their frozen
# instances differ in the public limitations text (no upstream method names, review) and, for Neural Fly, the
# force-surrogate digest (refitted for image 0.2.0). Neural Landing has new random case seeds (review: the sequential
# seeds could be recovered).

[protocols]
standard = ["eai-policy/1.0", "eai-policy/1.1"]

