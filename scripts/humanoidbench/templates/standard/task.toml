# Standard-mode twin of {{task_dir}}. Generated from scripts/humanoidbench/templates/standard/task.toml -- edit
# subset.toml or the template, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/{{task_dir}}-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): HumanoidBench {{family}} on the same frozen instance as {{task_dir}}. The agent only gets a client: /observe and /submit (head-camera RGB, joint proprioception, a pelvis IMU, a fixed room camera; joint-position chunks). One episode, no reset, no privileged state, no reward; the sim service records the episode, replays it in a fresh simulator and grades it."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "humanoidbench", "mujoco", "{{robot}}", "{{paper_category_long}}", "standard-mode", "trajectory", "{{family}}"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "humanoidbench"
robot = "{{robot_slug}}"
family = "{{family}}"
mode = "standard"
protocol = "eai-standard/2.1"
instance_seed = {{seed}}
expert_time_estimate_hours = {{standard_expert_hours}}
{{oracle_lines}}

[verifier]
timeout_sec = {{verifier_timeout}}
environment_mode = "separate"
network_mode = "no-network"

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; for i in $(seq 1 400); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; [ $((i % 15)) -eq 1 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = {{agent_timeout}}
# The agent container holds no simulator and no reward, but upstream is a public commit: like every HumanoidBench
# task, the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0
