# Terms shared by every family text; each mode text starts with them.
# privileged: embodied_first_exam/benchmarks/robocasa/privileged/tests/grade.py main L57-121 (missing file ->
# missing_trajectory; check_file L46-54: 2-D, 1 <= T <= MAX_STEPS = 3000, finite -> else invalid_trajectory; the child's
# casa_tool.as_actions(actions, 13) -> exit INVALID = 2 -> invalid_trajectory; any other child failure, including a
# simulator error or the 3600 s child timeout -> grader_error, success 0); replay L27-38 in a fresh process from
# /tests/instance.npz (casa_tool.load_instance checks its SHA-256); ok = not initial_success and success L106.
# casa_tool.py load_npz L237-249 (<= 8,000,000 bytes, <= 64 members, .npy only, <= 64,000,000 bytes expanded, no
# pickle); Session.step L610-622 clips each row to the action limits; Session.replay L665-677.
[modes.privileged]
success = """
In the conditions above, an object's centre is its body origin in the simulator; touching is a MuJoCo contact between the two
models' collision geoms; an object's horizontal radius is half the diagonal of its bounding box seen from above; the
gripper's grip point is the robot's end-effector site; a joint's opening is its position as a fraction of the joint's
range. The environment's check runs three times per control step (once inside the environment's step, before the
fixtures update their state, and twice after it) and once at the frozen start; counts of checks above are counts of
these runs.

The graded file is `/app/output/trajectory.npz`: an array `actions` of shape (T, 13), finite, with 1 ≤ T ≤ 3000, one
row per control step (1/20 s); each row is clipped to the controller's limits when it is executed. The verifier replays
it once, open-loop, in a fresh process from its own copy of the frozen instance, and takes the check's result on the
state after the last row; nothing earlier in the replay counts, except where the conditions above say a count or a
moment counts as it happens. It scores 1 when that result is a success and the check did not already hold at the
frozen start. A missing file scores 0, and so does an invalid one: over 8 MB, not an archive of at most 64 plain `.npy`
arrays, no `actions`, a shape other than (T, 13), a NaN or infinite value, or T outside 1 to 3000. A replay that fails
with an error (a simulator error, or the verifier's frozen instance failing its hash check) scores 0.
"""

# embodied_first_exam/benchmarks/robocasa365/sim/server_casa.py: RCB_AGENT_END=1 in the compose file, no
# RCB_MAX_CONTROL_STEPS / RCB_STEP_LIMIT (MAX_CONTROL_STEPS = 0, L67: no step cap); /finish -> finish("finished")
# L1203-1207; SIGUSR1 at the session's end -> finish("timeout") L1235-1239; a simulator error inside a call ->
# finish("error") L1225-1231; run_submit L855-925 / do_hold: every row runs S.step (casa_tool); finalize L1045-1094:
# success = S.check()["success"] (the last Session.step's result) and not initial_success and reason != "error" and
# reason in END_STATE_REASONS (L90); no settle window (END_JUDGEMENT = "state", L144). _start_mismatch L1246-1262
# (RCB_INSTANCE_SHA, RCB_START_SHA, solved at the start -> instance_mismatch, infra); _resume_or_start L1265-1336
# (MAX_RESUMES = 2: the third crash gives up, sim_crashed_on_call when every crash was inside a call, else sim_crashed,
# infra; resume_failed infra). embodied_first_exam/benchmarks/robocasa/standard/tests/grade.py main L40-85: success =
# graded_by live and success and live_success and not infra and reason != "error".
[modes.standard]
success = """
In the conditions above, an object's centre is its body origin in the simulator; touching is a MuJoCo contact between the two
models' collision geoms; an object's horizontal radius is half the diagonal of its bounding box seen from above; the
gripper's grip point is the robot's end-effector site; a joint's opening is its position as a fraction of the joint's
range. The environment's check runs three times per control step (once inside the environment's step, before the
fixtures update their state, and twice after it) and once at the start; counts of checks above are counts of these
runs.

Graded is the one live episode, judged by the simulator service on its own state; nothing is replayed. There is no
reset and no step limit, and only control steps (the rows of an action chunk, or a hold chunk) move time. The episode
ends at the agent's `POST /finish`, or when the agent's time ({timeout}) is up, and the verdict is the check's result
after the last executed control step: it must be a success, and the check must not have held at the start. A success
earlier in the episode neither ends it nor is shown to the agent. A simulator error raised while executing the agent's
call ends the episode with 0, as do more than two service crashes that all happened while serving the agent's calls.
A scene that does not start at the frozen instance (instance or start-state hash mismatch, or already solved), more
than two crashes not all inside the agent's calls, a failed resume or a missing verdict is an infrastructure error,
not a score.
"""

# The task's environment/sim/server.py (adapter: step L173-175 reports casa_tool's Session.success; live_verdict
# L184-188: no success when initial_success) on embodied_first_exam/standard/sidecar/rcb_service.py:
# _step L938-956 (AGENT_END: success only recorded; len(episode) >= cap -> "step_limit"), _end L958-972 (finished /
# timeout / step_limit judged on now_success), _finalize L1284-1360 (no end_window_steps in the adapter; live_verdict
# can only take a success away), _write_final L630-658. Compose: RCB_MAX_CONTROL_STEPS 3000, RCB_RESET_BUDGET 0,
# RCB_SLOWDOWN 2, RCB_START_SHA. embodied_first_exam/standard/realtime/rcb_realtime.py docstring L8-17 (paused until
# the first /submit, one control step every control_dt x S, zero-order hold when the plan runs out) and L87-98 (whose
# failure an error or crash is). embodied_first_exam/standard/sidecar/grade.py main L97-137: success = success and
# live_success and graded_by live and not infra and reason != "error".
[modes.realtime]
success = """
The environment's check runs three times per control step: once inside the environment's step, before the fixtures
update their state, and twice after it.

Graded is the one live episode, judged by the simulator service on its own state; nothing is replayed. The clock does
not stop: the episode starts paused at the frozen start, and from the agent's first `submit` one control step runs
every 0.05 s × S of wall time (slowdown S = {slowdown}), whether or not the agent sends anything; when the planned
commands run out the last one is held. There is no reset. The episode ends at the agent's `/finish`, after 3,000
control steps (150 s of robot time), or when the agent's time ({timeout}) is up, and is judged on the state it ends
in: the check's result after the last control step must be a success, and the check must not have held at the
episode's start. A success earlier in the episode neither ends it nor is shown to the agent. After the agent's first
command, a simulator error or repeated simulator crashes inside control steps are the agent's 0; a failure before the
first command, a killed service, a failed resume, a start that is not the frozen instance's state or a missing
verdict is an infrastructure error, not a score.
"""

