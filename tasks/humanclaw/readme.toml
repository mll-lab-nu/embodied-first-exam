[robots]
smplx-human = "SMPL-X neutral human body, moved by HumanCLAW's MotionDiT whole-body motion skills (no arm or gripper control)"

[modes.privileged]
# grade_privileged.py: no file -> missing_trajectory; hc_tools.load_actions: not an npz with a numeric `actions` (T, 2),
# 1 <= T <= 100, an invalid row (hc_core.clip_row: unknown id, a walk not 0.2/0.4/0.6, a zero turn or side step, a value
# on a value-less action) -> bad_trajectory (0). replay(): a fresh Session, the rows in order until the episode ends
# (later rows ignored); no stop -> no result -> 0. A replay process that dies or times out (1800 s), or a rebuilt start
# whose hash is not instance.json start_sha -> grader_error 1 + infra_error 1.
success = """
Graded file: `/app/output/trajectory.npz` with `actions`, a numeric array of 1 to 100 rows `[action_id, value]`, as
`Env.save()` writes it. After the agent's session it is replayed once from the frozen start, in a fresh process of a
separate verifier container without network, on the same GPU model the agent ran on. The rows run in order until the
episode ends; rows after the end are not run. A trajectory whose actions end without a stop fails. A missing file, a
file that is not such an array, or an invalid row (an unknown action id, a walk distance other than 0.2, 0.4 or 0.6 m,
a turn or side step of 0) scores 0. A replay that crashes or times out, or a frozen start that does not rebuild with
its recorded hash, is reported as `grader_error` (infrastructure), not as a score.
"""

[modes.standard]
# server.py: AGENT_END; POST /finish runs the stop action as the episode's last step (reason finished); a stop action the
# agent sends ends it the same way; the end of the agent's session runs the stop, then judges (reason timeout); the 100th
# action ends the episode whatever it is (step_limit; non-stop -> 0); a simulator error in a call -> reason error, 0.
# RCB_RESET_BUDGET "0" in environment/docker-compose.yaml; instance_mismatch at the start -> infra_error.
success = """
Graded: the live episode, judged by the simulator service with HumanCLAW's own metric code; nothing is replayed. The
episode ends at the agent's stop action or `/finish` (the same thing: `/finish` runs the stop as the episode's last
action), or when the agent's time ({timeout}) runs out, in which case the stop is run first and the episode is then
judged. The 100th action ends the episode whatever it is; if it is not a stop, the episode fails. Holding still
(`hold`) uses no action. No success signal is shown. No reset: the one episode is graded. A simulator error raised by
the agent's own call ends the episode with 0. A frozen start that does not rebuild, or a service crash outside the
agent's calls, is an infrastructure failure, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families: the episode's target category. nav-*: NavSR@20cm (episode.py L172, L220); sit-*: InteractSR (L200-205).
# Every goal object of the category in the house is a target (the episode's goal list; metric_target_geometry takes the
# boxes of all of them, is_pelvis_target_contact any of their meshes).

[families.nav-chair]
vars = { what = "chair" }
success = """
Success rule (HumanCLAW's NavSR@20cm): the episode ends with a stop, and at that moment the shortest distance from
the body to the bounding box of any {vars[what]} in the house that the episode lists as a target is at most 0.2 m.
Ending without a stop fails, wherever the body is. The episode allows 100 actions, the stop included; each action
other than the stop is one 0.5 s motion skill.
"""

[families.nav-tv]
vars = { what = "TV" }
success = """
