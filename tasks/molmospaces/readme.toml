# README data for tasks/molmospaces/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text (upstream molmo-spaces 0.2.9 = allenai/molmospaces tag v0.2.9 @ 7351388, the
# wheel from PyPI, read-only):
#   success      molmo_spaces/tasks/<task>.py `judge_success` (lines below); thresholds from each instance's
#                `episode.task` (environment/instance.json; defaults in molmo_spaces/configs/task_configs.py L64-92)
#   tooling      embodied_first_exam/benchmarks/molmospaces/privileged/environment/rcb_molmospaces.py: one control step =
#                one upstream Task.step; the episode ends at upstream is_done() (the horizon) or when the agent ends it;
#                success = judge_success() on the final state (docstring L7-11, Episode.success L256-257, replay()
#                L550-596: rows in order until the episode ends, then the verdict)
#   privileged   embodied_first_exam/benchmarks/molmospaces/privileged/tests/grade.py (docstring L1-17, checks L108-175)
#   standard     embodied_first_exam/benchmarks/molmospaces/sim/server.py (docstring L1-16: `done` = finish, horizon =
#                RCB_STEP_LIMIT, judged on the final state) and .../standard/tests/grade.py; no reset (no RCB_RESET_BUDGET
#                in environment/docker-compose.yaml)
# No world coordinates in the standard tasks' texts (ci_checks/check-world-frame-texts.sh).

[benchmark]
name = "MolmoSpaces"
citation = "Kim et al., 2026"
url = "https://github.com/allenai/molmospaces"
repo = "allenai/molmospaces"
commit = "7351388"

[license]
text = """
