schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  { source = "/data/replay3.log", service = "sim" },           # and its third, which renders replay.mp4
  "/app/output/",
]

[task]
name = "robot-coding-bench/molmospaces-close-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): MolmoSpaces close on the same frozen episode as molmospaces-close-i00-privileged. Close the cabinet. The agent only gets a client: camera images (RGB, depth) and proprioception, joint-position chunks, upstream's kinematic model, done. No reset, no object state; the sim service records the episode and grades it with upstream's success check."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "molmospaces", "mujoco", "franka-robotiq-2f85", "standard-mode", "trajectory", "close"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "molmospaces"
robot = "franka-robotiq-2f85"
family = "close"
mode = "standard"                  # robot as a service: images + proprioception only; no object poses, no success check, no reset
protocol = "eai-standard/2.2"
expert_time_estimate_hours = 3.0
oracle = "none"
oracle_evidence = "no reference solution (MolmoSpaces' planners and grasp files are not shipped); positive example graded 1 by the separate verifier: molmospaces-close-i00-privileged__HWWFXrw (run codex-gpt6_luna-medium, batch molmospaces-luna-1006; https://embodied-agent-interface-v2-internal.github.io/runs/molmospaces/codex-gpt6_luna-medium-openrouter/close/unlimited/); human review in PR #47"

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 6.0
min_gpu_memory_gb = 3.5
gpu_required = true
gpu_class = "any"
recommended_gpu = "any 8 GB+ NVIDIA GPU (RTX 4090 / L4 / L40S)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 5.0
verifier_min_gpu_memory_gb = 3.5
measured = "GPU 2.7 GB on L40S, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory and CPU author estimate (MuJoCo, CPU physics, EGL rendering)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 7.0
trial_max_memory_gb = 18.0
measured = "GPU: 2.7 GiB on a 48 GB card (batch_eval_live vram_profile (per-trial GPU peaks by card, 10-03..10)); one trial on a 24 GB card peaked at 18.4 GiB and would exceed: calibrate -> max(1.5 x peak, peak + 4); memory: no samples of the agent's container; floor 8 GiB (at most the 16 GiB cap); whole trial: + the sim service's 10 GiB (from the minimum: no samples); processes 512 and disk 20 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 8.0, memory_gb = 16.0, pids = 8192 }
sim = { cpus = 4.0, memory_gb = 12.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/PROTOCOL.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json, video
timeout_sec = 1800                # the end (up to 900 s through a resume) + replays of 20-120 s each; finalize.sh ends a replay
                                  # at 500 s and never starts one past 1740 s, so final.json is always completed in time

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
