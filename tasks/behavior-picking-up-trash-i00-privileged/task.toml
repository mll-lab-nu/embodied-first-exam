schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/behavior-picking-up-trash-i00-privileged"
description = "BEHAVIOR-1K v3.9.2 (2026 BEHAVIOR Challenge) picking_up_trash (R1Pro mobile manipulator, OmniGibson / Isaac Sim): produce one replayable trajectory. Put the three cans of soda from the living room inside the trash can in the kitchen. Frozen scene instance (challenge public_test instance 301)."
authors = [{ name = "qineng" }]
keywords = ["robotics", "behavior", "omnigibson", "isaac-sim", "r1pro", "mobile-manipulation", "code-as-policy", "trajectory", "picking_up_trash"]

[metadata]
author_name = "qineng"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "behavior"            # BEHAVIOR-1K v3.9.2 = OmniGibson 3.9.2 on Isaac Sim (the 2026 challenge stack)
robot = "r1pro"
family = "picking_up_trash"
mode = "privileged"               # privileged state, unlimited resets, thin primitives (docs/PROTOCOL.md §3)
oracle = "partial"
oracle_evidence = "Reference solution solution/oracle_picking_up_trash.py on the frozen task-level primitives solution/rcb_behavior_ref.py. Recorded Harbor oracle runs (laptop, pre-v1.0 uncommitted trees): 2026-09-24 behavior-picking-up-trash-i00__FKLU2nS (job behavior-picking-up-trash-i00-oracle-0924-230430) scored 1 (5115 control steps, deterministic 1, instance_exact 1); the run before it, behavior-picking-up-trash-i00__MjRvy7Y (an older placement routine), scored 0; the 2026-10-01 review counts 1 success in 3 runs of that version. Model trial behavior-picking-up-trash-i00__JRcB9fb (behavior-lunaxh-0925-2057, ws) scored 1. The tooling and verifier files changed since; not re-run on this version (static validation only)."
instance_seed = 301               # scene = environment/instance.json (2026 challenge public_test instance 301 + its state hash); identity = dataset.toml digest
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 30600.0             # two fresh-process replays, each capped at 4 h by tests/grade.py (1200 s start + 2 steps/s,
                                  # floor 3600 s), + 30 min; measured on an 8-vCPU L40S: 626 s Isaac start, < 3.5 steps/s
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then

[agent]
timeout_sec = 14400.0             # BEHAVIOR budget: every Python process pays ~3 min of Isaac Sim + scene load, ~10 steps/s (docs/benchmarks/behavior.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 24576

[verifier.environment]
build_timeout_sec = 1800.0
