# Standard mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 7168m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    image: ghcr.io/mll-lab-nu/efe:mujoco-0.1.2
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
    working_dir: /srv
    command: python /srv/server_mj.py
    restart: on-failure:6
    environment:
      RCB_TOOL: rcb_dtb
      RCB_INSTANCE: /srv/instance.json
      RCB_DTB_GOAL_TIMEOUT_S: "0"
      RCB_MAX_CONTROL_STEPS: "360000"
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-20}"   # DexToolBench standard: 20 resets (PROTOCOL §4.5); 0: one episode
      RCB_START_SHA: "4f3c592ab339"   # the frozen start's state hash: an episode on another start is refused (instance_mismatch)
      PYTHONPATH: /srv
      RCB_MJ_ROOT: /opt/rcb_mj
      RCB_WALL_CLOCK_S: "3600"
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.3.0@sha256:53154417782408df8309194971b08b18c3682d2b337e2e3b2eb4c88fe025ab85
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
