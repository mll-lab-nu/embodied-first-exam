# README data for tasks/robopaint/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text (embodied_first_exam/benchmarks/robopaint/):
#   rcb_brush_score.py   score_session() L480-491: ink targets (glyph, letters) -> score_ink + is_success, paintings ->
#                        score_paint + is_success_paint; score_ink L229-255 / _score_ink_at L258-305 (IoU, boundary F at
#                        TOL_MM = 1.0 (rcb_brush.py L96), per-region coverage, stray ink, contacts on the main sheet);
#                        is_success L308-313; registration register_window_px L129 (floor(register_mm / px)),
#                        register_masks L134 (largest ink overlap; a best shift on the window's edge -> no shift),
#                        register_paint L152 (smallest mean ΔE over the central window), score_inset_px L194;
#                        _score_paint_at L398-451 (blur σ = blur_mm, ΔE over the painted area dilated 2 mm, SSIM of L*
#                        at σ 1.5 mm, edge correlation, paint IoU, contacts); is_success_paint L454-458.
#   rcb_brush_strict.py  process_metrics L140-182 (colouring in: path_mm > max_path_mm AND mark_width_mm <
#                        min_mark_width_mm; path budget for the paintings (no min_mark_width_mm, medium mypaint: marks
#                        off); counted strokes on marked_pieces L99-114 / counted_strokes L134-137; sweep share on the
#                        pieces (calligraphy) or on the contacts (paintings)); apply_rules L185-203: success = the picture
#                        rule AND strict_ok; Session.score L209-232 (a stroke still pressed counts).
#   rcb_brush.py         MAX_STEPS = 72_000 (L83), ACTION_DIM = 7 (L82); Session.replay L1621 (reset, rows, painter.finish).
#   privileged/grade.py  and sim/server.py + standard/grade.py: see [modes].
# Every number in a family's `vars` is that task's tests/instance.json target.success (identical in the privileged
# scorer's and the standard sidecar's copies); `regions` = len(truth.strokes), the exemplar's regions that
# min_stroke_coverage is taken over. Only inked (loaded at the touch-down) contacts with the main sheet count
# (stroke_stats / piece_stats / _score_*_at filter sheet == "main" and inked).

[benchmark]
name = "RoboPaint"                  # one of this repository's original suites (root README.md)
citation = "Wang et al., 2026"       # the Embodied First Exam paper, arXiv:2611.12177
url = "https://www.embodied-first-exam.ai/suite/robopaint/"
repo = "mll-lab-nu/embodied-first-exam"
commit = "b2280d8"                   # the commit that added tasks/robopaint/ (git log --diff-filter=A)

[license]
text = """
RoboPaint (its scenes, tooling and graders) is part of this repository, MIT License. It runs on ManiSkill 3.0.1
([haosulab/ManiSkill](https://github.com/haosulab/ManiSkill) @ `a4a4f92`) and SAPIEN 3.0.3, both Apache License 2.0.
{vars[tool_license]} The base image also carries Spline-FRIDA (GPL-3.0), which this task does not use.
The exemplar: {vars[exemplar_license]} No non-commercial terms apply.
"""

[robots]
franka-panda = "Franka Emika Panda arm (ManiSkill PandaStick) holding a brush or pen"

# privileged/grade.py main() L67-142: missing file -> missing_trajectory; load_deliverable L43-60 (zip with actions.npy,
# no pickle, size bound) and L104-107 (task entry == --family, shape (T, 7), finite, T <= MAX_STEPS) -> bad_trajectory /
# wrong_family; ONE replay (repeat 1) in a fresh process: rcb_brush_strict.py replay -> Session.replay; success = the
# replay's success AND instance_matches (L126-129); no result / past --replay-timeout-s 1650 / instance not rebuilt ->
# grader_error + infra_error (L37, L118-125, L136).
[modes.privileged]
success = """
What is graded is the main sheet after one open-loop replay of the delivered trajectory. The verifier, in a separate
sandbox without network, replays `/app/output/trajectory.npz` (array `actions`, shape (T, 7): absolute joint targets,
one row per 20 Hz control step, T at most 72,000) once, in a fresh process, from its own copy of the frozen instance; a
contact still on the paper after the last row is ended there, and the sheet is then scored as above. Meeting the
conditions earlier in the replay does not count.

A missing file scores 0, and so does an invalid one: not a readable `.npz` (pickled or object arrays included), no
`actions` array, a shape other than (T, 7), a NaN or infinite value, more than 72,000 rows, or a `task` entry that names
another task. A replay that gives no result within 1650 s, or a verifier that cannot rebuild the frozen instance, is an
infrastructure failure, not a score.
"""

# sim/server.py: RCB_AGENT_END=1 (compose); finish() L146-154: POST /finish -> "finished", the collect hook's SIGUSR1
# (_end_from_signal L569-577) -> "timeout", the 72,000-step guard (ctrl_step L369-381) -> "step_limit", an error in a
# call (on_submit_error) -> "error"; no reset, no RCB_STEP_LIMIT. dump() L85-128: painter.finish() (a contact still
# pressed is committed), S.status() = rcb_brush_strict Session.score() of the live sheet, final.json success; no success
# shown during the episode (hidden_success). _check: instance sha mismatch -> give_up(infra) L160-169.
# standard/grade.py verdict() L175-195: success = final.json success AND graded_by live AND not infra AND reason != error;
# no final.json / no verdict / grade_error / give-up not caused by the agent's calls -> infra_error.
[modes.standard]
success = """
What is graded is the live main sheet at the end of the one episode; nothing is replayed. The episode ends when the agent
sends `/finish`, when the agent's session ends (at the latest after {timeout}), when the robot reaches the runaway guard
of 72,000 control steps (1 h of simulated time), or on a simulator error; there is no reset and no other step limit.
Once the agent's container is stopped, the service ends a contact still on the paper and scores the sheet as it stands,
with the same rules the privileged verifier uses. Meeting the conditions earlier in the episode does not count, and the
service never reports a score or a success while the episode runs.

An episode ended by a simulator error scores 0, and so does one ended because the service crashed repeatedly during the
agent's own calls. The scene is checked to rebuild the frozen instance (its hash) before the agent is served. A mismatch,
a missing or unreadable verdict, other repeated service crashes and a sheet the service could not score after a normal
end are infrastructure failures, not scores.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families: the pass condition and its numbers (which sheet is graded: [modes]). "≥" / "≤" as in the code.

# rcb_brush_score.py is_success_paint (painting rule; no score_inset_mm) + rcb_brush_strict.py process_metrics
# (path budget, sweeps on the contacts); numbers: tests/instance.json target.success.
[families."robopaint_acrylic_applesoranges"]
vars = { blur_mm = "1", de_mean = "2.0", de_p90 = "6.0", ssim_L = "0.92", edge_corr = "0.80", paint_iou = "0.95", register_mm = "5", max_strokes = "390", max_path_mm = "33900", max_scribble = "2.5", scribble_min_mm = "10", share_pct = "10", tool_license = "The paint engine is libmypaint 1.6.1 (ISC License, with a one-line determinism patch) with a preset of mypaint-brushes 2.0.2 (CC0-1.0).", exemplar_license = "a painting made by this task's robot and brush, after Paul Cezanne's Still Life with Apples and Oranges (Wikimedia Commons `File:Nature morte aux pommes et aux oranges, par Paul Cézanne.jpg`, public domain); the exemplar picture is dedicated to the public domain (CC0-1.0)." }
success = """
Graded on the main sheet's colours and paint coverage against the picture. Both are converted to CIELAB and blurred
with a Gaussian of σ = {vars[blur_mm]} mm. The sheet is first moved by the whole-pixel shift, at most {vars[register_mm]} mm along each
axis, that gives the smallest mean colour difference over the picture's central window (a best shift on the edge of
that window counts as no shift); every measure is taken at that shift, on the overlap of the two pictures.
Success needs all of these:

- mean ΔE (CIELAB 1976) ≤ {vars[de_mean]} and its 90th percentile ≤ {vars[de_p90]}, over the area where the sheet or
  the picture has paint (coverage ≥ 0.5), widened by about 2 mm;
- SSIM of the blurred L* channel (Gaussian windows, σ = 1.5 mm) ≥ {vars[ssim_L]};
- edge correlation ≥ {vars[edge_corr]}: the correlation of the blurred L* gradient magnitudes of the sheet and the
  picture over that area;
- paint IoU ≥ {vars[paint_iou]}: the sheet's painted area (coverage ≥ 0.5) against the exemplar's paint coverage;
- at most {vars[max_strokes]} painted contacts with the main sheet (a contact is one continuous stretch of the tip below
  the sheet's surface; it is painted when the brush was loaded at the touch-down);
- path budget: `path_mm` ≤ {vars[max_path_mm]} mm, the total length of the tip's path in all painted contacts with the
  main sheet (100 Hz physics samples);
- sweeps: contacts longer than {vars[max_scribble]} × the diagonal of their bounding box (the diagonal taken as at
  least {vars[scribble_min_mm]} mm) hold at most {vars[share_pct]} % of `path_mm`.

The practice sheet is never scored.
"""

