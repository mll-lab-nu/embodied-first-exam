# README data for tasks/yamlab/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   upstream  YAMLab @ ec0455d (github.com/ARISE-Initiative/yamlab): yamlab/envs/tasks/put_pot_on_cooktop_manager.py
#             update_stage_success L201-243, hang_mug_on_tree_manager.py __init__ L69-117 and update_stage_success
#             L194-305, yamlab/utils/task_logic.py check_pick_success L7-57, check_ontop_success L60-136,
#             check_hang_success L139-200, check_obj_below_table L203-216; configs/tasks/put_pot_on_cooktop.yaml
#             `success:` L89-95; configs/robot/yam.yaml `grasp:` L36-40 (normal_force_thresh 0.1 N, check_pad);
#             yamlab/robot/robot.py Gripper.is_grasping L317-360; yamlab/utils/assets.py OBJ_Z_OFFSET = 0.005.
#   tooling   embodied_first_exam/benchmarks/yamlab/privileged/environment/rcb_yamlab.py: _make_env L447-460 (the
#             `<object>_below_table` terminations end the episode instead of resetting), step L601-629, LAST_STAGE /
#             _reopen_last_stage L116-125 and L631-637, fallen L644-650, replay L676-686, MAX_STEPS = 100,000 L129.
#   graders   privileged/tests/grade.py (one fresh-process replay); sim/server.py finish L93-125, end_reason L380-383,
#             ctrl_step L386-394; standard/tests/grade.py.
# The per-instance numbers ({vars[...]}) are the `success_params` of each task's environment/instance.json.
# Standard texts give no world coordinates (ci_checks/check-world-frame-texts.sh): heights are relative.

[benchmark]
name = "YAMLab"
citation = "Dai, 2026"            # no paper; the upstream LICENSE's copyright holder (Tianyuan Dai, ARISE Initiative)
url = "https://github.com/ARISE-Initiative/yamlab"
repo = "ARISE-Initiative/yamlab"
commit = "ec0455d"

[license]
text = """
YAMLab ([ARISE-Initiative/yamlab](https://github.com/ARISE-Initiative/yamlab) @ `ec0455d`), its scene and object USDs
and its dataset (`yamlab/yamlab_datasets` on Hugging Face) are released under the MIT License (Copyright (c) 2026
Tianyuan Dai). Isaac Lab is BSD-3-Clause; YAMLab's LeRobot fork is Apache-2.0. NVIDIA Isaac Sim 5.1 and its wheels are
