schema_version = "1.3"
artifacts = ["/app/output/", "/logs/agent/rcb/"]

[task]
name = "robot-coding-bench/mujoco_playground_panda_pick_cube_orientation"
description = "MuJoCo Playground PandaPickCubeOrientation in plain MuJoCo: Franka Panda; produce one replayable trajectory that picks up the box and holds it at the target position and orientation, frozen instance (seed 60417)."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "mujoco", "mujoco-playground", "franka-panda", "pick-place", "orientation", "code-as-policy", "trajectory"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "mujoco"
robot = "franka-panda"
family = "mujoco_playground/PandaPickCubeOrientation"
tier = "privileged"
instance_seed = 60417             # Playground's reset randomization (box xy, target position and orientation) with this seed
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[verifier.environment]
build_timeout_sec = 1800.0
