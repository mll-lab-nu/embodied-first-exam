citation = "Li et al., 2025"     # arXiv:2505.22634, NeurIPS 2025 Datasets and Benchmarks
url = "https://github.com/Rui-li023/LabUtopia"
repo = "Rui-li023/LabUtopia"
commit = "8df7278"

