schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/referee.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/trajectory.first.npz", service = "sim" },
  { source = "/data/replay.first.mp4", service = "sim" },
  { source = "/data/replay.first.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/embodied-olympics-fun-freeski-360-i00-objpose_resetinf-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): Embodied Olympics freeski-360 on the same frozen instance as embodied-olympics-fun-freeski-360-i00-privileged. Drop in from the start platform, ride the in-run, take off from the kicker, do a 360 in the air, land on your skis and ride away past the finish line. The agent only gets a client: the robot's two head cameras (depth on one), its joint sensors and IMUs, the venue's fixed camera, and action chunks (walking, running, joint targets, Unitree LowCmd, the hands' grip). 5 resets, the last attempt graded; no object state, no referee state during an attempt. The sim service records the attempt and grades it live with the family's referee (no grading replay)."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "standard-mode", "trajectory", "freeski-360"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "unitree-g1"
family = "freeski_360"
category = "track-and-jumps"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.1"
instance_seed = 0
expert_time_estimate_hours = 52.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: Big air on a level-A FIS course (ICR Book VI 3102.4.1: a 6 m level start platform, a 38 m in-run at 35 degrees, a 2.1 m kicker at 25 degrees, a 15 m table, a 36 degree landing). The robot starts itself from the level platform and rides the in-run and the kicker on its own control (the Embodied Olympics freeski reference skier, its drop-in re-searched in this physics). Positive by a declared magic action: in the jump's flight only, the robot and its skis are turned as one rigid body about their centre of mass, first a yaw rate of 10.47 rad/s for 0.6 s (the 360), then an alignment of the skis to the landing slope at the predicted touchdown (about 68 degrees over 1.4 s); the take-off, the flight's path, the touchdown, the landing and the ride-away past the finish line are physics and the robot's own control. The referee measures the trick from the skis' heading change in the air (take-off to first snow contact), requires both skis within 45 degrees of forwards at touchdown and no more than 90 degrees of turn on the snow from 0.5 s after the landing to the finish: measured ski spin 356.2 degrees (a 360; pelvis 355.8), touchdown 0.0 / 3.6 degrees off forwards, 5.5 degrees of turn after the landing, the same in two runs. A pelvis-only spin with the skis turned 188 degrees in the air, a landing backwards and a spin on the snow each fail. Negatives: the same jump with a 540 or an under-rotated spin (180) fails as the wrong trick, a hand on the snow and a sit-down after the landing fail as fell, no jump, doing nothing (did not start). Contacts in the flight and the landing: ski edge spheres in the snow at most 10 mm, no ski-body, ski-ski or body-snow contact. Own-motor reach: in a short search, the robot's own arm and torso wind-up reaches about 255 degrees of spin in 1.8 s of air; the 360 is near the edge of its reach, not shown. Stress scan (a flailing robot on the start platform and the in-run, 5 episodes): no instability, no hook errors; the worst contact is a ski tip sphere 2.8 cm into the in-run snow (hard snow, solref 0.005).; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades the live
# episode (no grading replay). The loops run on the clock, inside timeout_sec: the verdict ("finalized":
# true, written before any video is rendered) may take until 840 s (the end waits through a crash-recovery resume);
# then the hook waits for the video, one render pass from the trajectory ("video_pending"), until 870 s -- a video that
# is not ready by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md). The agent's
# container holds no simulator, no referee and no instance.
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
