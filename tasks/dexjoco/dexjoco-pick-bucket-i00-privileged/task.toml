schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexjoco-pick-bucket-i00-privileged"
description = "DexJoCo pick_bucket (a Franka Panda arm with a 16-DoF Allegro hand, MuJoCo): produce one replayable trajectory. Put the boxed food into the bucket, then lift the bucket. Frozen scene instance (the initial state of a DexJoCo human demonstration)."
keywords = ["robotics", "dexjoco", "mujoco", "allegro", "dexterous-manipulation", "code-as-policy", "trajectory", "pick_bucket"]

[metadata]
task_type = "trajectory"
simulator = "dexjoco"
robot = "franka-allegro"
family = "pick_bucket"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "full"
instance_seed = 0
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 3600.0              # a replay of at most 50000 rows (the hand-in cap), then the video
environment_mode = "separate"     # the verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"        # the reference demonstrations are public on Hugging Face (PROTOCOL Appendix H.2)
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
