# Generated by scripts/labutopia/generate.py -- edit the generator, the shared sources, families.json or the instance, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  { source = "/data/replay3.log", service = "sim" },           # and its third, which renders replay.mp4
  "/app/output/",
]

[task]
name = "robot-coding-bench/labutopia-shake-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): LabUtopia shake (Shake) on the same frozen instance as labutopia-shake-i00-privileged: Pick up the glass beaker, shake it, and hold it still. The agent only gets a client: cameras (RGB, optional depth, calibration), the robot's proprioception, joint target chunks, arm kinematics; one episode, no reset, no object or instrument state; the sim service records the episode, replays it in fresh processes and grades it."
authors = [{ name = "Canyu Chen" }]
keywords = ["robotics", "labutopia", "isaac-sim", "laboratory", "chemistry", "franka-panda", "code-as-policy", "trajectory", "shake", "standard-mode"]

[metadata]
author_name = "Canyu Chen"
task_type = "trajectory"
simulator = "labutopia"           # LabUtopia @ 8df7278 on NVIDIA Isaac Sim 6.1.0 (PhysX on the CPU, RTX cameras)
robot = "franka-panda"
family = "shake"
mode = "standard"
protocol = "eai-standard/2.2"
oracle = "full"
level = 1                         # LabUtopia's own level for the task (config level1_shake)
instance_seed = 0                 # numpy's and Python's random generators before LabUtopia's reset
expert_time_estimate_hours = 2.5

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json, video
timeout_sec = 5400

[agent]
timeout_sec = 5400.0              # LabUtopia's budget, both modes (docs/benchmarks/labutopia.md): a container's first simulator with its renderer takes 5 to 15 minutes to start
# LabUtopia's scripted controllers are in its public repository (and a standard-mode agent could rebuild the simulator
# from it): the agent reaches the model APIs and nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 32768
