# Scene dynamics per task: THE table (docs/PROTOCOL.md §2.14; owner 2026-10-14, board 0106). One row per benchmark, and
# per family an exception where the family differs from its benchmark's row; every entry gives its reason (`why`).
#
#   dynamic   something in the scene other than the robot can do work by a force other than the robot's own and gravity:
#             a body with a velocity at the start (thrown, served, rolling, sliding, swinging), an actuated or scripted
#             body (conveyor, motor-driven rail, scripted push, a timer that moves a part), an opponent or another agent.
#   static    everything else: objects move only because the robot moves them or gravity pulls them (settling after
#             reset, cloth / liquid / granular material the robot moves, passive springs that only give back the
#             robot's energy, visual-only or state-only changes, episode horizons). A robot that must balance actively
#             (humanoid, legged, drone) does not make a task dynamic by itself.
#
# scripts/task_conventions.py (`normalize`) writes `[metadata] dynamics` into every task.toml from this file; never edit
# it in a task, a template or a generator: ci_checks/check-dynamics.py fails a task that disagrees with this table, a
# benchmark without a row, and an exception that matches no family. To change a value: edit it here (with its `why`),
# then `python3 scripts/task_cutoffs.py apply` (normalizes every task and refreshes tasks/dataset.toml, ~3 min).
# The benchmark names are the labels of scripts/task_conventions.py BENCHMARKS; a family is `[metadata] family`.
# A dynamic task may get a `-standard-realtime` twin (PROTOCOL §4b); static tasks need none. Per-family evidence
# (file:line): agentboard task 0106, dynamic_tasks.csv.

