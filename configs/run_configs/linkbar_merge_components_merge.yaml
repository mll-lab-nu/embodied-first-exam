# linkbar_merge_components_physical_merge_demo 的运行模式参数。
#
# 场景几何与两个卡座的角位置都在 task 配置里，不在这里——它们属于实例定义。
# 逐 episode 换实例就是覆盖那两个角：
#   task.sockets.b1_angle_deg=-40 task.sockets.a2_angle_deg=50

defaults:
  - default
  - _self_

# 对照对。两条规则跑同一个 episode，动作成本相同，只有约束图能把它们分开。
#   oracle          : 读哪个卡座属于另一段机架，转过去
#   nearest_socket  : 转向角度上更近的那个，不看归属
# 两个卡座角位置独立随机后，nearest_socket 恰好对一半——离线部分见
# tests/check_linkbar_planner.py，这里是它在真实物理上的复核。
oracle_mode: oracle

# full        : 完整 episode（决策 → 转+扣 → 退刀 → 行程测试 → 判定）
# rotate_only : 只跑到扫掠结束，不判定。原语自身的验收档（到位角、跟随误差、指位）
stage: full

# 故意的欠转／过转，用来造执行误差的对照 run。加在规则给出的目标角上，
# 规则本身仍是 oracle——演示的是「正确的计划 + 执行偏差」。
# 超过捕获窗（5.06°）应当扣不上，落在窗内应当照样扣上。
target_offset_deg: 0.0

# 判定完成后再步进多少步。纯粹为了录像：终态不停顿的话，视频在结论出现的那一帧就
# 结束了，看的人来不及看清最后是什么样子。100 步 = 1 秒。
final_hold_steps: 100
