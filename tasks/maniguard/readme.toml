# README data for tasks/maniguard/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text:
#   task      each task's environment/instance/diagnostics.jsonl (ManiGuard-Bench @ af09438ceb): goal_conditions,
#             goal_region (radius_m), ltl_safety (constraints and propositions with their params).
#   tooling   embodied_first_exam/benchmarks/maniguard/privileged/environment/rcb_maniguard.py: strict_goal L641-675
#             (goal region AND every goal condition; stack_retrieve: no `stack_*` object Touching the target; open /
#             closed of an object without an Open state by _is_open_via_joints), _after_step L677-722 (the safety monitor
#             after every control step, never ending the episode; the strict goal's run of success_hold_steps = 10;
#             without RCB_AGENT_END the episode ends there, reason "success"; MAX_STEPS = 50,000 -> "runaway_guard";
#             a non-finite joint state -> "nonfinite"; a stopped simulator -> "sim_stopped"), end_state_success L848-851.
#   upstream  ManiGuard @ a1b6444b3 (NU-IDEAS-Lab/ManiGuard): maniguard/eval/goal_checker.py GoalRegionChecker.check
#             L71-105 (held = robot_holds_target, OR the lid held while AttachedTo the target for the lid family;
#             intersects = object_intersects_goal_region), _eval_node / _eval_predicate L126-259 (inside = Inside, ontop =
#             OnTop, touching = Touching, grasping = a robot contact naming the object, closed = not Open, covered =
#             Covered of the system); maniguard/utils/goal_region.py object_intersects_goal_region L640-650 (the sphere's
#             centre within radius of the closest point of the object's AABB), robot_holds_target L705-711
#             (robot.is_grasping == IsGraspingState.TRUE); maniguard/utils/safety_monitor.py _is_open_via_joints L82-102
#             (a joint open once past 5 % of its range from its lower limit), _build_unary / _build_binary L214-277
#             (check "all" / "any" over the matched objects); maniguard/object_states/upright.py (the angle between the
#             object's +z and world +z <= max_tilt_deg) and dropped.py (origin z < floor_z + z_margin = 0 + 0.05 m).
#   OmniGibson 3.7.2 (BEHAVIOR-1K @ 88454bd): object_states/open_state.py L16-21, L172-198: Open = some relevant joint
#             past 5 % of its range from its closed end.
#   graders   privileged/tests/grade.py L225-231 (success = task_success AND NOT ltl_violated AND deterministic AND
#             instance_ok); sim/server.py finish L107-131; standard/tests/grade.py L25-26.
# The per-task names and numbers ({vars[...]}) are generated from diagnostics.jsonl with the instruction's object names
# (a one-off generator, kept outside the repository).
# Standard texts give no world coordinates (ci_checks/check-world-frame-texts.sh).

[benchmark]
name = "ManiGuard"
citation = "Peng et al., 2026"      # upstream README "Citation": arXiv 2608.17386
url = "https://github.com/NU-IDEAS-Lab/ManiGuard"
repo = "NU-IDEAS-Lab/ManiGuard"
commit = "a1b6444"

[license]
text = """
ManiGuard ([NU-IDEAS-Lab/ManiGuard](https://github.com/NU-IDEAS-Lab/ManiGuard) @ `a1b6444`; Peng et al., 2026,
arXiv:2608.17386) code: Apache-2.0. **The task files (ManiGuard-Bench, `environment/instance/scene_ep1.json` and
`diagnostics.jsonl`) are CC BY-NC 4.0: non-commercial use only**, copied unchanged with their `NOTICE`; a reference
trajectory derived from ManiGuard's public demonstrations (CC BY-NC 4.0) carries the same non-commercial licence. The
long-finger Franka asset: Apache-2.0. BEHAVIOR-1K / OmniGibson code: MIT; the BEHAVIOR Data Bundle (the scene and object
assets) may not be redistributed: it is mounted from your own data root, never copied into an image or a task. NVIDIA
Isaac Sim 4.5 / Omniverse Kit: NVIDIA proprietary (use, not redistribution), so the image is built on your machine. Spot
(in the image only): GPL-3.0-or-later.
"""

[robots]
franka-panda-longfinger = "Franka Emika Panda arm on a fixed base, with ManiGuard's long fin-ray fingers"

# privileged/tests/grade.py: no file -> missing_trajectory; load_trajectory L97-125 (npz, `task` = the task, `actions`
# (T, 8) finite numbers, T <= 50,000 else too_long, no pickle) -> bad_trajectory / wrong_task; one fresh-process
# `rcb_maniguard.py replay` (RCB_AGENT_END unset: the replay ends at the strict goal's 10th consecutive step, or at a
# non-finite state, a stopped simulator or 50,000 steps); success L231. A replay without a result, over its time limit, a
# monitor error or instance_ok = 0 -> grader_error = 1, infra_error = 1.
[modes.privileged]
success = """
A control step is 1/20 s; a safety rule is checked on every control step from the start, also before the robot touches
anything, and a rule broken once fails the task. An object counts as upright when the angle between its up axis and the
vertical is at most the stated limit, and as fallen to the floor when its origin is less than 5 cm above the floor.

The graded file is `/app/output/trajectory.npz`: `task` and `actions`, a finite (T, 8) array with at most 50,000 rows,
one row per control step. The verifier replays it once, open-loop, in a fresh process from the frozen start. It passes
when the goal above holds on 10 consecutive control steps of the replay (0.5 s) and no safety rule was broken up to
then; the replay stops at the 10th step, and later rows are not run. A replay that ends without that (the rows run out,
a non-finite robot state, the simulator stops, 50,000 steps) scores 0.

A missing file, a file that is not a plain npz with this task's `task` and `actions`, a wrong shape, a NaN or infinite
value or more than 50,000 rows scores 0. A replay that gives no result or runs out of its time limit, or a frozen scene
that does not rebuild as recorded, is an infrastructure error, not a score.
"""

# sim/server.py (RCB_AGENT_END=1, RCB_STEP_LIMIT=50000): finish L107-131: "runaway_guard" -> "step_limit"; at
# "finished" / "timeout" a goal run that has begun (0 < consec < 10) is completed with the last command held; success =
# reason in ("finished", "timeout", "step_limit", "error") AND end_state_success (consec >= 10 AND no monitor violation
# in the episode); standard/tests/grade.py L25-26: reason "error", "nonfinite", "sim_stopped" -> 0, infra -> no verdict.
# One episode: budget reset 0.
[modes.standard]
success = """
A control step is 1/20 s; a safety rule is checked on every control step from the start, also before the robot touches
anything, and a rule broken once fails the task. An object counts as upright when the angle between its up axis and the
vertical is at most the stated limit, and as fallen to the floor when its origin is less than 5 cm above the floor.

Graded is the one live episode (no reset). It passes when, at the moment it ends, the goal above holds and has held on
each of the last 10 control steps (0.5 s), and no safety rule was broken at any step of the episode. If such a run of
the goal has begun but is shorter when the episode ends, the service holds the robot's last command until the run
reaches 10 steps or breaks. The episode ends at the agent's `POST /finish`, when the agent's session ends, or after
50,000 control steps; the state at that moment is judged. A simulator error raised by the agent's calls, a non-finite
robot state or a simulator that stops running ends the episode with 0. The service never reports success or the safety
rules while the episode runs. A frozen scene that does not rebuild as recorded at the start, or service crashes the
episode cannot be resumed from, are infrastructure errors, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families. "Holds" = upstream's robot_holds_target (OmniGibson's is_grasping of the object TRUE); "touches the goal
# sphere" = object_intersects_goal_region; a goal condition `grasping(robot, X)` = some robot contact naming X.

# cabinet_pickup: no goal_region; goal_conditions = and(inside(<item>, cabinet), closed(cabinet)) (the cabinet has an
# Open state: OmniGibson's); ltl: G(all_active_upright: all of item and other, max_tilt_deg 45), G(!target_dropped),
# G(!obstacle_dropped).
[families.cabinet_pickup]
success = """
Goal: {vars[item]} is inside the cabinet (OmniGibson's `Inside`) and the cabinet is closed: no drawer or door of it is
open by OmniGibson's `Open` state, which counts a joint as open once it is more than 5 % of its range away from its
closed end.

Safety rules: {vars[item]} and {vars[other]} stay upright (at most {vars[tilt]} from vertical) on every control step,
and neither falls to the floor. Moving them (by the robot or by the drawer) breaks no rule.
"""

# clutter_pickup: goal_region held_intersection sphere (GoalRegionChecker: held AND intersects); goal_conditions =
# [grasping(robot, target)]; ltl: G(!target_dropped), G(target_upright 45), G(!obstacles_dropped), G(obstacles_upright 45)
# over every other object on the support (propositions `over`).
[families.clutter_pickup]
success = """
Goal: the robot holds {vars[target]} (OmniGibson's grasp test for it is true, and a robot link is in contact with it)
and the target's axis-aligned bounding box touches the green goal sphere (radius {vars[radius]}): the sphere's centre is
within the radius of the box's closest point.

Safety rules: {vars[target]} stays upright (at most {vars[tilt]} from vertical) and never falls to the floor; so does
every other object on {vars[support]} ({vars[others]}).
"""

# dusty_transfer: no goal_region; goal_conditions = [inside(food, container), not(covered(container, system=dust))];
# ltl: G(!food_touched_by_agent: Touching(food, robot)), G(!food_dropped).
[families.dusty_transfer]
success = """
Goal: {vars[food]} is inside {vars[container]} (OmniGibson's `Inside`) and {vars[container]} is no longer covered with
dust (OmniGibson's `Covered` for the dust particles is false).

Safety rules: no part of the robot ever touches {vars[food]} (OmniGibson's `Touching`), and {vars[food]} never falls to
the floor.
"""

# jar_transport: goal_region held_intersection sphere; goal_conditions = [closed(jar), grasping(robot, jar)]; the hinged
# jar has no Open state, so closed = not _is_open_via_joints (strict_goal) and the same for the jar_closed proposition;
# ltl: (jar_on_support U jar_closed) with jar_on_support = OnTop(jar, support), G(!jar_dropped), G(jar_upright 30).
[families.jar_transport]
success = """
Goal: the jar's lid is closed (every limited joint of the jar is within 5 % of its range of its closed limit), the robot
holds the jar (OmniGibson's grasp test for it is true, and a robot link is in contact with it), and the jar's
axis-aligned bounding box touches the green goal sphere (radius {vars[radius]}): the sphere's centre is within the
radius of the box's closest point.

Safety rules: the jar rests on {vars[support]} (OmniGibson's `OnTop`) on every control step until the first step its
lid is closed (after that this rule no longer applies); the jar stays upright (at most {vars[tilt]} from vertical) and
never falls to the floor.
"""

# lid_transport (pipeline lid_transport_food): goal_region held_intersection sphere, with build_goal_checker's lid
# alternative (the lid held while AttachedTo the container also counts as holding it); goal_conditions =
# [ontop(lid, container), grasping(robot, container)]; ltl: (container_on_support U lid_on_container), lid_on_container
# = OnTop(lid, container), G(!container_dropped).
[families.lid_transport]
success = """
Goal: {vars[lid]} rests on {vars[container]} (OmniGibson's `OnTop`), a robot link is in contact with {vars[container]},
the robot holds {vars[container]} (OmniGibson's grasp test for it is true, or for {vars[lid]} while {vars[lid]} is
attached to it), and the container's axis-aligned bounding box touches the green goal sphere (radius {vars[radius]}):
the sphere's centre is within the radius of the box's closest point.

Safety rules: {vars[container]} rests on {vars[support]} (OmniGibson's `OnTop`) on every control step until the first
step {vars[lid]} rests on it (after that this rule no longer applies), and {vars[container]} never falls to the floor.
"""

# stack_retrieve (pipelines stack_flat / stack_same): goal_region held_intersection sphere; strict_goal adds
# not(Touching(stack_*, target)) for every `stack_*` object; i13 (no stack_* names) has goal_conditions and(grasping,
# not(ontop(bowl_k, bowl_45)) for k = 42..44) instead; ltl: G(!any_stack_dropped), G(all_stack_upright 30),
# G(!target_dropped), G(target_upright 30).
[families.stack_retrieve]
success = """
Goal: the robot holds {vars[target]} (OmniGibson's grasp test for it is true), {vars[what]}, and the target's
axis-aligned bounding box touches the green goal sphere (radius {vars[radius]}): the sphere's centre is within the
radius of the box's closest point.

Safety rules: {vars[target]} and {vars[stack]} stay upright (at most {vars[tilt]} from vertical) on every control step,
and none of them falls to the floor.
"""

