# Peeling (multi-film topological) in the TopoGym tabletop V1 task frame.
# 单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
# 由 world 帧 peeling.yaml 仿射换算而来：x'=x-0.570, y'=y, z'=z-0.750
# （旧 common_room 工作面 world z=0.750 → task z=0）。多膜拓扑剥离 + 运动学分离。

task:
  id: peeling
  difficulty: level1

coordinate_frame: task

board:
  name: peeling_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

substrate:
  name: peel_substrate
  enabled: false
  pos: [0.000, 0.000, 0.000]
  size: [0.380, 0.280, 0.000]
  color: [0.92, 0.92, 0.94]

# Larger layer means visually/semantically above smaller layers.
films:
  film_A:
    label: A
    pos: [-0.030, 0.030, 0.003]
    size: [0.160, 0.100, 0.006]
    yaw: 0.0
    layer: 0
    fixed: true
    color: [0.02, 0.20, 1.00]
    peel_zone:
      corner: lower_right
      inset: [0.018, 0.018]
  film_C:
    label: C
    pos: [-0.035, -0.035, 0.010]
    size: [0.110, 0.085, 0.006]
    yaw: 0.0
    layer: 1
    fixed: true
    color: [0.02, 0.85, 0.12]
    peel_zone:
      corner: upper_right
      inset: [0.016, 0.016]
  film_B:
    label: B
    pos: [0.050, 0.000, 0.017]
    size: [0.145, 0.090, 0.006]
    yaw: 0.0
    layer: 2
    fixed: true
    color: [1.00, 0.48, 0.00]
    peel_zone:
      corner: lower_right
      inset: [0.018, 0.018]

peel_zones:
  # Level 1 default: a lower film is blocked if any unpeeled higher film overlaps it.
  # This makes covered/under-layer films ungraspable even if one corner is geometrically visible.
  block_if_any_higher_overlap: true
  overlap_tolerance: 0.002
  z_offset: 0.009
  marker:
    enabled: true
    show_inactive: true
    zone_size: [0.060, 0.045]
    dash_size: [0.010, 0.010, 0.004]
    dash_count_per_side: 4
    active_color: [0.70, 0.20, 1.00]
    inactive_color: [0.02, 0.06, 0.10]

separation_slots:
  visible: false
  surface_z: 0.000
  surface_clearance: 0.004
  slot_size: [0.120, 0.075, 0.004]
  color: [0.70, 0.20, 1.00]
  slots:
    film_A:
      pos: [0.230, 0.145, 0.002]
    film_B:
      pos: [0.230, 0.000, 0.002]
    film_C:
      pos: [0.230, -0.145, 0.002]

# 标靶终点：每个 separation slot 上渲染红白矩形同心环(靶),尺寸贴合各自贴片
# footprint,并带碰撞落台(贴片落上去有物理接触、不穿模)。红外白内交替。
target_marker:
  enabled: true
  ring_count: 3
  outer_margin: 0.012      # 最外环比贴片 footprint 每边大这么多
  ring_step: 0.016         # 每向内一环收缩这么多
  colors:
    - [0.85, 0.10, 0.08]   # 红
    - [0.96, 0.96, 0.96]   # 白
  height: 0.0006
  z_gap: 0.0002
  collision: true          # 落台碰撞体(贴片停在其上)

oracle:
  sequence: [film_B, film_C, film_A]

primitive:
  approach_z: 0.214
  grasp_z: 0.149
  hand_surface_offset: 0.116
  grasp_clearance: 0.006
  lift_z: 0.254
  carry_z: 0.244
  release_clearance: 0.040
  retreat_z: 0.224
  move_steps: 70
  lift_steps: 45
  place_steps: 55
  gripper_steps: 25
  film_settle_steps: 14
  grasp_qpos: 0.006
  carry_yaw: 0.0

mdp:
  max_episode_steps: 120
  reward:
    success: 10.0
    remaining: 1.0
    wrong_order: 3.0
    action: 0.01
