# gate_cage_ball_inspect_demo 的运行模式参数。
#
# 几何与材料不在这里 —— 它们在 task 配置里，用点路径覆盖即可：
#   task.ball.release_y=-0.200      （改释放点 = 改到门时刻）
#   task.channel.flat_end_y=0.180   （改封闭区长 = 改窗口长度）
#   task.ball.speed=0.160           （改球速 = 同时缩放两者）


defaults:
  - default
  - _self_

# 只建场景、一步都不走。构建时就互相穿透的几何在这一步暴露，
# 不会被第一次沉降掩盖过去。
static_only: false

# 放球滚一遍的步数上限。dt 取自 env 预设（tabletop V1 = 0.01s），1600 步 = 16 秒。
# 球进槽、到远端折返、再出来，全程要在这个预算内跑完才量得到窗口长度。
# 2026-09-08：600 → 1600。引道加长到 55 cm、球速降到 0.050–0.100 之后，球到门就要 1.15–10.20 s
# （1000 seed 实测），再加上封闭区一个来回，6 秒的预算量不完最慢那些实例。
rollout_steps: 1600

# 每隔多少步打印一行轨迹采样（run.verbose=true 时）。
sample_every: 20

# 结束后再步进多少步。纯粹为了录像：static_only 一步不走的话录像器没有帧可写
# （"No image to save"）。60 步 = 0.6 秒。
final_hold_steps: 60

# --- 变体（2026-09-03）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识。
variant_id: default
