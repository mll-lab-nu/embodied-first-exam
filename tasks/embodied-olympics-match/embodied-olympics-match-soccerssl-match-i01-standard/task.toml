# Exported by Embodied Olympics from soccer_ssl-match-wallclock-program-standard (sports/soccer_ssl/sport.toml): do not edit.
# Embodied First Exam: the standard twin of the exported realtime task (the same export; the world in lockstep:
# environment/sim/core/lockstep.py; ci_checks/benchmarks/embodied-olympics-match/exported.toml).
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
]

[task]
name = "embodied-first-exam/embodied-olympics-match-soccerssl-match-i01-standard"
description = "STANDARD (Embodied Olympics / Embodied Agent Olympics, our own service): wheeled robot soccer 5 v 5 (robocup ssl division b), one match against the opponent team at level 4 (the reinforcement-learned tier), program play (eai-standard-lockstep/1.0: the world advances only while the player waits or an act takes effect and stands still between its calls; it freezes after every point for the player's review, at most 600 s). Camera images and the robot's own state only. Frozen development instance (seed and level fixed, not an official seed). wheeled robot soccer 5 v 5 under the RoboCup Small Size League rules (Division B): ten omnidirectional SSL robots after TIGERs Mannheim's v2020 (kicker, chip kicker, dribbler; their real speed, acceleration, kick and dribbler limits) and an orange golf ball on the 9 x 6 m field, two halves of 300 s of playing time, a shoot-out when level, an automatic referee for every rule an SSL auto-referee judges; you command your robots with three skills (move to a pose, optionally by a time and at a speed; kick flat or chipped along the robot's heading, now or the moment the ball reaches it; spin the dribbler) and see the game through the four overhead cameras of the shared vision, 40 ms late; in the `match` format you command the blue team against a scripted team, in the `duel` format another player commands the yellow team, in the `team` format each robot has its own player. Exported from Embodied Olympics task soccer_ssl-match-wallclock-program-standard."
keywords = ["robotics", "embodied-olympics", "sports", "soccer_ssl", "mujoco", "standard-mode", "vision", "lockstep"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "ssl-robot"
family = "soccer_ssl_match"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard-lockstep/1.0"
instance_seed = 7
opponent_level = 4
revision = "soccer_ssl-1"
play = "program"
action_level = "high"
source_task = "roboolympics/soccer_ssl-match-wallclock-program-standard"
source_commits = ["91156213b0de"]
exporter = "Embodied Olympics task exporter"
player_mode = "unmetered"
official = false
expert_time_estimate_hours = 0.5
oracle = "partial"
oracle_evidence = "RLSSL 2026-10-16 (doc rlssl): L-RL against L3 25 W 5 D 10 L over 40 matches on fresh seeds (64 W 11 D 25 L over 100 with the screening), goals +1.7 per match; mirror match 29 W 5 D 46 L over 80 (two 40-match seed sets: 25 % and 48 %; L3 against itself on the first set 60 %); the truth reference against it 10 W of 20; replay identical; limits through World.execute (0.014 % of commands clipped, as L3). The oracle run checks the pipeline"

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [7, 1, 2]

[verifier]
timeout_sec = 3960.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running (a program would keep playing; the match is graded as it stands).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then SIGUSR1 ends the match: the service writes the verdict of the live match ("graded_ready"; no grading replay)
# then the spectator video.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 1800); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 1800); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 3780

[agent]
timeout_sec = 14400
# The agent reaches the model APIs, the package registries and the sim (localhost:8000, Harbor's egress control).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 5120
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
