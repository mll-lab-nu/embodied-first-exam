# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); between the agent's calls the world is
# frozen (sim/server.py, this benchmark's adapter -- the code of its standard-realtime twins' -- served by
# sim/rcb_service.py, the shared eai-standard/2.1 layer); the agent only reaches port 8000. No `expose`/`ports` on sim:
# under Harbor's egress control it shares main's network namespace (localhost:8000).
# SAPIEN needs a Vulkan device (the NVIDIA GPU) to build the scene and render the cameras; physics is CPU PhysX. The
# sidecar is TRUSTED: ./sim (the frozen instance, the service, the tooling) is mounted only here, never where agent code runs.
# Crash recovery: compose restarts the service, which resumes the same episode from its journal, never a reset.
# Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the task's configuration; results
# under other settings are reported separately.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 8192m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    image: ghcr.io/mll-lab-nu/eai-pandadyn:0.1.0
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./sim:/srv:ro
    working_dir: /tmp
    command: python /srv/server.py
    restart: on-failure:6          # a crash resumes the same episode, never a reset (rcb_service.py)
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_TEXTS: /srv/texts.json
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "3600"   # = task.toml [agent] timeout_sec (reported only: spec budget, meta time_left_s)
      RCB_STARTUP_TIMEOUT_S: "600"
      PYTHONPATH: /srv:/opt/pandadyn
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-3}"        # 3 resets, as in the standard-realtime twins (docs/benchmarks/pandadyn.md, "Reset budget"); 0: one episode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/eai-monitor:0.1.0@sha256:f2c910f53f79c2bfa4a71298b10c78383cae3afc40720ca562cc845b8d20fb0c
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor:/opt/rcb_monitor:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
