# Diverter Route Ball（docx 4.3）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 工业原型：分拣线上的转辙式分流器。一颗哑光陶瓷球沿进料道匀速前进，分岔口的分流板
# 决定它从左出口还是右出口离开。机器人只转分流板的拨杆，全程不接触球。
#
# 几何主轴沿 +x（远离机械臂、朝向 front 相机）：两条支路分列 ±y，而 front 相机
# （x=+0.42 朝 -x 看，up=+z）的画面右方向正是 +y，因此「右出口」在画面里就在右边。
#
# 分流板是导流叶片，不是横挡板。落座时它沿一条支路的内边界向上游延伸到对侧壁，
# 由此同时得到两件事：另一条支路的入口被隔在板的另一侧（封路），以及球撞上板面后
# 沿板面滑出的切向速度恰好等于该支路的轴向（导流）。横挡板只能做到前者，球会顺着
# 板面滑进被封的那个口里卡死。详见 tasks/connectivity/diverter_route_ball.py 的头注。
#
# 与 docx 的几何差异：docx 画的是竖直落料槽 + 重力送球，这里改为桌面水平 + 匀速驱动
# （沿用 4.1 的方案与实测）。S–T 连通性判据不受影响。决策与代价见
# docs/develop/tasks/diverter_route_ball_zh.md §2。
#
# 派生量不写在这里，由 DiverterRouteBallLayout 从下面几个数算出来，改宽度或改角度
# 时整套几何自洽：
#   nose_x        = fork_origin_x + half_width / sin(a)          分流鼻（板的枢轴）
#   junction_x    = fork_origin_x + half_width(cos a - 1)/sin a  进料道壁与支路外壁的交接
#   flap_reach    = half_width / (sin a · cos a)                 枢轴到对侧壁的距离
#   exit_plane_x  = fork_origin_x + exit_station · cos a         两个出口共用同一个 x
#
# 现值（a=30°，half_width=0.045）：nose_x=0.070，junction_x=-0.032，flap 长 0.0999，
# 出口中心 (0.153, ±0.100)，球从释放到出口 0.362m / 3.02s。

task:
  id: diverter_route_ball
  difficulty: smoke

coordinate_frame: task

# ------------------------------------------------------------------ 占地范围
# 2026-08-19 去掉了底板：侧壁直接站在桌面上，球在桌面上滚（gate_cage_ball 的侧壁
# 本来也是这么放的）。原来那块 4mm 薄板还有一个副作用——球滚出出口后会被它的板沿
# 截停（实测三个球速的落点 x 一致到 0.6mm），去掉之后球会按滑行模型多滚一段。
#
# 这一段只剩「布局外接矩形」，它不生成任何实体，但两处要用：驱动器的作用区域，
# 以及判据 flood-fill 的栅格范围。
footprint:
  # 外接矩形相对最外侧构件再留出的余量。
  margin: 0.020

# ---------------------------------------------------------------- 进料道
channel:
  # 内净宽。球径 44mm，两侧各留 23mm；这个宽度同时也是分流板落座后
  # 「板与对侧壁之间」的通行宽度（板与支路内边界共线，故通道等宽）。
  inner_width: 0.090
  wall_thickness: 0.012
  # 壁高。球心在板面上方 22mm，45mm 远高于它，球爬不出去。
  wall_height: 0.045
  # 球滚动的平面。去掉底板后就是桌面本身。
  floor_top_z: 0.0
  # 进料道最上游端（后挡板在这里）。
  entry_start_x: -0.200
  # 两条支路中心线的公共起点。整套派生几何以它为原点。
  # 取 -0.020 而不是更靠前：拨杆手柄落在 x≈0.118，距 Franka 底座 0.688m，
  # 留出工作空间余量（4.1 的取板点是 0.645m）。
  fork_origin_x: -0.020
  color: [0.60, 0.60, 0.59]

# ------------------------------------------------------------------ 支路
branch:
  # 支路相对进料方向的夹角。30° 是导流角与占地的折中：角度越大占地越宽，
  # 越小则球撞板后的切向速度越大而法向分离越慢。
  angle_deg: 30.0
  # 出口平面距 fork_origin 的轴向距离。缩短它就是让球更早离开视野。
  exit_station: 0.200

# ---------------------------------------------------------------- 分流板
diverter:
  # 开局被封住的支路。docx 的写法是「初始分流板封住左路」，这里做成配置项，
  # 阶段 4 与指令方向组成 2×2 独立随机。
  init_sealed_side: right
  # 支路内壁相对分流鼻向下游让开的距离，给板的枢轴端腾位置。
  # 留下的缺口只有十几毫米，球（44mm）进不去。
  nose_setback: 0.012

  flap:
    thickness: 0.012
    # 板自由端与对侧壁之间留的缝。
    # 2026-08-19 由 4mm 改为 20mm：4mm 时板转过落座角 4.2° 就撞墙，**墙本身就是一个
    # 机械止点**，「转到停为止」照样能落座，精度不要钱。20mm 时 60° 过转都不撞墙，
    # 而密封完全不受影响（落座时缝隙 17.3mm，球径 52mm）。
    wall_gap: 0.020
    # 板底与底板之间的间隙，避免板在底板上刮擦。
    ground_clearance: 0.001
    color: [0.78, 0.42, 0.24]

  # 拨杆：与板同一个转动连杆，从枢轴向**下游**伸出，因此手柄扫过的是两条支路之间的
  # 空楔形区，且整体高于壁顶——夹爪不进入任何通道，球也只会碰到板。
  lever:
    radius: 0.055
    # 拨杆臂底面高出壁顶的距离。
    arm_gap: 0.007
    arm_height: 0.008
    arm_thickness: 0.014
    post_size: 0.016
    knob_size: 0.018
    knob_height: 0.050
    # 指垫落在手柄顶面以下多少。手柄跨 z 0.064..0.114，取 0.034 即指垫在 0.098，
    # 指尖约在 0.078，高出拨杆臂顶面（0.064）14mm。
    grasp_height: 0.034
    color: [0.45, 0.45, 0.44]
    knob_color: [0.80, 0.76, 0.30]

  mechanism:
    joint_name: diverter_joint
    mass: 0.20
    # 关节阻尼与摩擦：摩擦要能让板在松手后停在原处，阻尼抑制接触驱动时的抖动。
    # 2026-08-19 摩擦由 0.03 提到 0.1：实测 0.1/0.3/1.0/3.0 四档结果逐位相同（饱和），
    # 0.1 正好在平台起点，按得住球又不给夹爪添阻力。
    joint_damping: 0.06
    joint_friction: 0.1
    joint_armature: 0.01
    contact_friction: 1.2
    # 臂松手退刀之后，把关节锁在当时的角度上（位置伺服）。模型是自锁式机构
    # （定位槽或蜗杆），真实分流器就是这样。两个作用：球压上来时板不再让步；
    # 判定时刻的板角就是臂松手时的那个角，target_error 因此有明确所指。
    #
    # 注意它**不能**阻止球从比自身窄的缝里挤过去——那是球与板的接触压入，
    # 与板动不动无关（实测比球窄 0.5mm 的通道照样漏）。锁死只去掉一个让步来源。
    lock_after_turn: true
    lock_kp: 50.0
    lock_kv: 5.0
    lock_force: 5.0
    # 关节要不要限位。**false 是本任务的要害**：有限位时「转到停为止」永远落座，
    # 角度精度不产生任何代价，而精准旋转正是 4.3 要考的东西。
    joint_limited: false

# ------------------------------------------------------------------ 球
ball:
  # 半径 0.026（直径 52mm）。上下都有约束，取值落在两者之间：
  #   下界：半开态必须卡住。板半开时板尖在 (-0.030, 0)，尖端两侧到侧壁各 46.3mm，
  #         球径必须大于它，否则球会从一侧溜过去，中间失败态就不成立。52 > 46.3，余 5.7mm。
  #   上界：落座后的通行宽度等于通道内净宽 90mm（板与支路内边界共线，通道等宽），
  #         52mm 留出每侧 19mm，球在拐弯处不蹭壁。
  # 改 channel.inner_width 或 branch.angle_deg 时这两个边界都会变，需重算。
  radius: 0.026
  # 哑光陶瓷轴承球的量级（同 4.1）。不用铬钢：镜面反射对视觉跟踪不利。
  rho: 3900.0
  friction: 0.4
  # 浅灰白。底板去掉之后球是在浅灰的桌面上滚，对比度不如原来对着深色底板时高；
  # 若相机跟踪吃力，把这个调深是最直接的一招。
  color: [0.88, 0.88, 0.86]
  # 沿通道的匀速（米/秒）。同 4.1 的实测可用值。
  speed: 0.120
  # 驱动方式：**有界推力**，不是写速度。
  # 2026-08-19 实测：写速度（set_dofs_velocity）是状态写入，求解器解完接触后下一步
  # 又把满速写回去，等于无穷大的力——欠转的挡板（12mm 厚）被球一步步顶穿挤了过去。
  # 改成通过求解器施加电机力之后接触能赢，max_thrust 就是这个保证。
  #
  # thrust_gain: 力 = gain × (目标速度 − 实测速度)。球质量 0.287kg，gain=1.0 时
  #   从静止到 0.12m/s 约 0.35s。无滚阻，所以到速之后误差为零、力也归零，自然匀速。
  # max_thrust: 力的上限（牛）。0.15N 在挡板枢轴上产生的力矩约 0.012 N·m，
  #   比关节摩擦 0.1 N·m 小一个数量级，因此球绝无可能把板推动或顶穿。
  thrust_gain: 1.0
  max_thrust: 0.15
  # 开局位置（进料道上，后挡板前方 30mm）。
  release_x: -0.170
  # 驱动器判定「被挡住」的窗口步数。2026-08-19 由 5 改为 40，同时判据从「逐步位移」
  # 改为「窗口内净位移」：球被挡板面挤着蹭时每步都有零点几毫米位移，逐步判据永远不触发
  # （实测板角 16/18/20 度三档球都停住了却报 jammed=False）。40 步 = 0.4s，
  # 阈值 0.2*speed*dt*40 = 9.6mm，正常滚动这段时间走 48mm，卡住的球远低于它。
  stall_steps: 40
  # 出口之后的减速度（米/秒²）。求解器没有滚动阻力（tests/ball_roll_spike.py 实测），
  # 这一项替代它，使离开出口的球滚一段后静止。0.090 下 v=0.120 滚 80mm。
  offtrack_decel: 0.090

# ------------------------------------------------------------------ 指令
# 本 episode 要求球从哪一侧出去。属于**实例定义**（和初始板向一样），不是运行模式，
# 所以在 task 下而不是 run 下——随机化只动 cfg.task，指令轴要能被它碰到。
# 默认取 right，配上 init_sealed_side=right 就是「需要旋转」的组合——
# 默认跑一次能看到完整动作。四种组合里有两种的正确动作是不旋转，
# 用 task.command.side=left 可以看到那一种。
command:
  side: right

# ------------------------------------------------------------------ 动作
# 全部是**手部连杆**的 z（指垫在其下方 HAND_TO_PAD_Z = 0.1029 处），任务坐标系。
motion:
  # 摆到手柄上方的安全高度。手柄顶在 0.114，指尖要先越过它。
  approach_z: 0.260
  # 抓取时的手部 z。指垫落在 diverter.lever.grasp_height 给出的高度上，
  # 由 layout.knob_grasp_world 算出，这里只给退刀高度。
  retreat_z: 0.260
  steps_per_phase: 30
  # 圆弧扫掠的步数。手柄圆弧半径只有 55mm，步子要密才平滑。
  steps_arc: 120
  gripper_steps: 30
  close_hold_steps: 30
  arc_settle_steps: 40
  release_hold_steps: 30
  # 手柄 18mm 见方，每指 0.007 = 总过盈 4mm。
  grasp_qpos: 0.007
  finger_links: [left_finger, right_finger]
  finger_friction: 2.0
  # 到位角误差阈值。**没有限位兜底，这是硬判据。** 初值取 rim_rotate 的默认 8°，
  # 实测之后按真实落点误差改。
  target_tolerance_deg: 8.0
  # 手沿理想圆弧走时，指垫与理想点的最大偏离。
  max_follow_error: 0.030
  # 松手到退刀完成之间板角的漂移上限。
  max_release_drift_deg: 5.0
  # 合爪后指位的下限。夹到手柄与夹了个空的分界。null = 不判但照样打印。
  min_finger_qpos: null

# ---------------------------------------------------------------- 目标落料垫
# 画在**指令那一侧**出口外侧的红白靶心，同 cable_routing 的
# _add_connector_target_marker：纯装饰（collision=False），同心方环，随支路旋转。
#
# 它同时是一块「胶垫」：球心进入这块矩形之后，滑行减速度换成 brake_decel。这是
# 2026-08-19 去掉底板之前那个偶然效果的有意版本——原来 4mm 板沿会把球截停（三个
# 球速落点一致到 0.6mm），但那是撞台阶撞出来的，底板厚度一改就变。现在改成明写的
# 减速区：0.5 m/s² 下三个球速分别滚 6/14/32mm，落点离散度从 144mm 压到 26mm。
#
# 不用「进区即把速度置零」：那会在观测流里留下物理上不可能的事件（瞬时减速到无穷），
# 而这些 episode 要当 IL 数据用。停球发生在判定之后（判据在出口口部就已触发），
# 所以停不停都不影响判定本身——只影响画面和终态。
#
# 没有垫的那一侧不铺，球按 ball.offtrack_decel 自然滚到停，两种结局因此一眼可分。
#
# 位置：沿支路轴向从出口口部再往外 pad_offset，垫长 pad_length、宽 pad_width。
# 球从出口出来时约 0.10 m/s，在垫的上游三分之一内停住。
#
# enabled=false 是「纯语言指令」条件：画面里不含答案，同一初始相位下两条指令的观测
# 完全相同，纯视觉策略上限被钉在一半。enabled=true 把目标放进画面，视觉可解。
# 两种条件都该跑、都该报。
target_pad:
  enabled: true
  pad_offset: 0.010
  pad_length: 0.120
  pad_width: 0.090
  brake_decel: 0.5
  ring_count: 4
  thickness: 0.002
  z_offset: 0.0015
  red_color: [0.85, 0.05, 0.05]
  white_color: [0.97, 0.97, 0.97]

physical:
  # 复位到 home 位之后的静置步数。机械臂在球的运动中不起作用，但仍要被驱动：
  # 场景里加了 Franka 而不给关节目标，一步进就会在重力下瘫掉。
  settle_steps: 40

success:
  # 判定用的自由空间栅格分辨率（米）。
  # 2026-08-19 由 6mm 改为 1mm。flood-fill 用格心测膨胀后的障碍，等效多膨胀了最多
  # 半个格对角线（6mm 栅格 = 半径多 4.2mm、直径多 8.4mm），在边界附近直接把结论测反：
  # 13° 时 6mm 栅格报「堵住」，1mm 栅格报「通道 53.6mm，比球宽 1.6mm」，而实机确实通了。
  # 能带边界也随之从「16° 起可达」修正为「12° 起可达」。
  # 代价：单次判定 1.0ms -> 48ms，一个 episode 只调几次，可忽略。
  grid_pitch: 0.001
  # 出口判定区的边长（米）。球心进入它即算从该侧离开。
  exit_patch: 0.050
  # 关节角距落座角多少度以内算「落座」。超出即 flap_not_seated（半开）。
  seat_tolerance_deg: 4.0
  # 判定后继续步进这么多步做物理复核。
  settle_steps: 120
