services:
  main:
    depends_on:
      sim:
        condition: service_healthy
      codex-egress:
        condition: service_healthy
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      HTTPS_PROXY: http://codex-egress:3128
      HTTP_PROXY: http://codex-egress:3128
      NO_PROXY: sim,localhost,127.0.0.1
      https_proxy: http://codex-egress:3128
      http_proxy: http://codex-egress:3128
      no_proxy: sim,localhost,127.0.0.1
  sim:
    build:
      context: ${CONTEXT_DIR}/server
    networks:
    - episode
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 8g
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; socket.create_connection(('localhost',8000),timeout=5).close()
      interval: 2s
      timeout: 10s
      retries: 180
  harbor-docker-egress-control-sidecar:
    networks:
    - episode
  codex-egress:
    build:
      context: ${CONTEXT_DIR}/codex-egress
    networks:
    - episode
    - codex_external
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; socket.create_connection(('localhost',3128),timeout=2).close()
      interval: 2s
      timeout: 5s
      retries: 30
networks:
  episode:
    internal: true
  codex_external: {}
