# Standard-realtime mode (PROTOCOL §4b): RoboOlympics {{title_lower}} runs in the `sim` sidecar (the agent cannot open it), on
# its own clock once the match starts (sim/rcb_realtime.py, the adapter sim/rcb_olympics.py); the agent only reaches
# port 8000. No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace
# (localhost:8000). CPU only: MuJoCo physics and OSMesa rendering (the players' meshes come with the image).
services:
  main:
    depends_on: [sim]
  sim:
    image: {{image}}
    volumes:
      - ./sim:/srv:ro
    command: python /srv/rcb_realtime.py
    restart: on-failure:6                               # a crash resumes the same match, paused, never a reset
    cpus: {{sim_cpus}}
    mem_limit: 8g
    pids_limit: 256
    environment:
      RO_PLUGIN: /srv/sport/plugin.py
      RO_SPORT: {{sport}}
      RO_FORMAT: {{format}}
      RO_SEED: "{{seed}}"
      RO_LEVEL: "{{level}}"
      RO_ACTION_LEVEL: {{action_level}}
      RO_TASK_TEXT: "{{task_text}}"
      RO_EPISODE_TEXT: "{{episode_text}}"
      RCB_WALL_CLOCK_S: "{{agent_timeout_sec}}"
      # Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the official
      # configuration; results under other settings are reported separately.
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-{{slowdown}}}"                # {{slowdown}}: RoboOlympics' official slowdown (PROTOCOL §4b exception); results state S
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-0}"        # 0: one match is one episode (PROTOCOL §4b, the mode's default)
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      LP_NUM_THREADS: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
