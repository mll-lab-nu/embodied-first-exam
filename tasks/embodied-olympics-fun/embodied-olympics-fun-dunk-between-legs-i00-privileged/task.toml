schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-dunk-between-legs-i00-privileged"
description = "Embodied Olympics dunk-between-legs (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. From the top of the key, with the basketball held in your two hands, dribble it, make one of its bounces pass between your legs, gather it in both hands, and with at most two steps dunk it: force it down through the ring from above with your hands on it, then land on your feet. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "dunk-between-legs"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "dunk_between_legs"
category = "basketball-and-rackets"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 20.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: No real solution (no own jump of our searches dunks; an own-motor two-hand dunk from the same open-hand hold at this ring height is shown by search in dunk, the pass between the legs is not). Positive by a declared injection: real two-hand hold and release, the right hand swung behind the hip, the ball's path round the left leg and the push through the leg gate injected (velocities between control steps), the bounce through the gate real, the gather (the arms and both hands closing on the ball rising between the open palms) real after an injected rise, the raise overhead real, then the dunk's ghost jump, teleport over the ring and landing: dribble, between the legs, gather, dunk, stand; the same state hash twice. Negatives: a bounce beside the leg, a rolled ball, through and back, a gather before any bounce between the legs, a ball at rest on the upturned palm (carrying), a touch before the floor, a palm from above, a ball pushed at the shin, a ball that gets away, the ball on the floor while held, travelling before the release and after the gather, a release after the gather, a second dribble, a shot during the dribble, a dunk without the dribble, a drop over the ring, a one-hand entry from the side, up through the ring, a miss, hanging on the ring, out of bounds, a fall; nop (time, the ball still in the hands after 40 s).; human review in the pull request that adds the benchmark (PROTOCOL §4)"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in one fresh process, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
