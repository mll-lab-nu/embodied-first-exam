# stacked_plate_inspect_demo 的主配置。

defaults:
  - config
  - override task_configs@task: stacked_plate_topogym_tabletop_v1
  # PBD/FEM 绳的场景才需要 world_tabletop_fem_v1；stacked_plate 是纯刚体。
  - override env_configs@env: world_tabletop_v1
  # 与正式 demo 一致的 stacked_plate 专用抬高 home，
  # 避免 base home 在对称盘阵里穿模。
  - override robot_control_configs@robot_control: franka_panda_position_ik_stacked_plate_raised_home
  - override run_configs@run: stacked_plate_inspect
  - _self_
