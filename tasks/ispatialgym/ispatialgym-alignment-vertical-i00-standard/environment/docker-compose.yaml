# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# The licensed BEHAVIOR dataset is a precondition of every run ($RCB_BEHAVIOR_DATA, tasks/ispatialgym/README.md): it is
# mounted whole and read-only at /bdata, which the image links into /data next to its own ispatialgym-assets; the service writes its
# record to /out (the container's own file system: it survives compose's restarts of the same container). Crash recovery
# (docs/protocol/standard_mode.md §13): run.sh exits non-zero when the service crashes and compose restarts the container, which
# resumes the same episode from its journal. The sidecar is TRUSTED: its Kit cache is a volume of this trial only.
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 12   # rcb-monitor
    mem_limit: 21504m   # rcb-monitor
    pids_limit: 2048   # rcb-monitor
    x-gpu-memory-gb: 9   # GiB   # rcb-monitor
    build:
      context: ./sim
      dockerfile: Dockerfile
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:ispatialgym-0.2.2"]   # our prebuilt image: its layers are reused when you can pull it, else Docker builds the recipe
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ${RCB_BEHAVIOR_DATA:?set RCB_BEHAVIOR_DATA to the directory holding your licensed BEHAVIOR dataset (tasks/ispatialgym/README.md)}:/bdata:ro
      - rcb_ispatialgym_cache_trusted:/cache
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_INSTANCE: /srv
      RCB_TOOL: /srv/rcb_ispatialgym.py
      RCB_DATA: /out
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "2400" # startup watchdog: 2x the slowest scene load measured (1013 s), at least 2400 s
      RCB_COLLECT_BUDGET_S: "6160"
      PYTHONPATH: /srv
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
  rcb_ispatialgym_cache_trusted:
