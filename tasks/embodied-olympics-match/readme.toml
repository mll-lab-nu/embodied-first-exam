#               L203-205; a call over 5 s L231-238; not exactly {"command": ...} L243-244; at most MAX_COMMANDS (1)
#               commands, L56-66; success = valid (valid_trial, reason match_over, the replay equal, no program error,
#               no other reason) and winner A L326-331; a world_step error after the first applied command = valid 0
#               L113-123, L348-350; a disagreeing replay or a trusted failure = infra L335-336, L353-356; a process left
#               behind = 0 L357-359. Constants: tests/trusted/tools/fullsim/sports/<sport>.py and adapter.py DEFAULTS
