# README data for tasks/labutopia/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every success text (each file is identical in every task directory of its mode):
#   rules     tests/rcb_labutopia.py (privileged; the same file as environment/sim/rcb_labutopia.py of the standard
#             tasks): the rule classes L223-535 (one per family, FAMILIES L73-83), HOLD_STEPS = 60 (L59),
#             MAX_STEPS = 36,000 (L58), Session.step L820-842 and _judge L844-849 (stop at the first step the rule is
#             met), Session.replay L899-921. Each rule is a copy of LabUtopia's controller check, checked against
#             Rui-li023/LabUtopia @ 8df7278 controllers/*_controller.py (e.g. pick_controller.py L59-60,
#             press_controller.py L36-40, placepress_controller.py L90-101).
#   graders   privileged tests/grade.py main/grade (L130-190); standard environment/sim/server.py finish() L309-347,
#             ae_success L285-291, ae_holding L294-303, AE_HOLD L306, end_from_signal L626-631, on_submit_error L672;
#             environment/sim/finalize.sh L40-55 (instance check); standard tests/grade.py grade() L36-37.
# Start values used in the relative wording (standard READMEs give no world coordinates): each privileged task's
# environment/instance.json `rule_values` (press: button x 0.4000 m; heat_liquid: beaker centre z 0.7611 m, button
# z 0.7713 m).

