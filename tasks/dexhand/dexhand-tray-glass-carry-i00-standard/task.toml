# Generated by scripts/dexhand/generate.py.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/", { source = "/data/final.json", service = "sim" }, { source = "/data/episode.jsonl", service = "sim" }, { source = "/data/trajectory.npz", service = "sim" }, { source = "/data/replay.mp4", service = "sim" }, { source = "/data/server.log", service = "sim" }, { source = "/data/journal.f64", service = "sim" }, { source = "/data/startups.jsonl", service = "sim" }, { source = "/data/video.json", service = "sim" }, { source = "/data/video.log", service = "sim" }]

[task]
name = "embodied-first-exam/dexhand-tray-glass-carry-i00-standard"
description = "Two dexterous hands on two wrist stages carry the original perforated serving tray with two filled glasses from the source counter, around a fixed bottle and across the counter gap, set it down level on the receiving counter and let go; spilled (tilted), escaped or dropped objects fail at once."
authors = [{ name = "Embodied Exam contributors" }]
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "bimanual_transport", "bimanual", "transport", "tray", "glasses", "obstacle-avoidance", "spill-free", "hook-grasp"]

[metadata]
author_name = "Embodied Exam contributors"
task_type = "trajectory"
simulator = "mujoco"
robot = "sharpa-wave-floating-bimanual"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "tray_glass_carry"
mode = "standard"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): scripts/task_dynamics.toml
protocol = "eai-standard/2.2"
oracle = "full"
oracle_evidence = "solution/trajectory.npz replays the validated Sharpa Wave authoring trajectory (1,072 controls; the episode ends with success after 952, 120 hold rows of slack) in both modes; it passes two fresh-process replays with identical state hashes and still succeeds with rows rounded to float32. solution/wuji/trajectory.npz is a validated Wuji Hand 2.2 trajectory of this instance (1,148 controls, motor targets only, physical contact only); the oracle uses it when the run selects wuji (privileged: DEXHAND_HAND=wuji; standard: the sim service's hand), and it replays to success in two fresh processes with identical state hashes."
expert_time_estimate_hours = 3.0
difficulty = "hard"
release_status = "provisional"

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 2.0
min_memory_gb = 2.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 2.0
verifier_min_gpu_memory_gb = 0.0
measured = "wave-2 integration smoke (Harbor 0.23, efe:dexhand-0.2.0, CPU-only, 2026-10-15; one privileged and one standard Sharpa oracle per family; docker cgroup memory.peak): privileged verifier <= 0.64 GiB with two concurrent replays, standard sim sidecar <= 0.96 GiB, agent containers < 0.05 GiB; one fresh replay process 0.26-0.39 GiB max RSS (os.wait4); x1.2 rounded up to a GB, raised to the 2 CPU / 2 GB design minimum (an agent's own simulator sessions take about 0.3-0.5 GiB each)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 16.0
measured = "memory: 8 GiB lets an agent run more than a dozen 0.3-0.5 GiB simulator sessions next to its harness; measurements as in the [[rule]]; processes 512 and disk 10 GiB: design defaults, not yet measured; whole trial: + the sim service's 8 GiB cap (peaks <= 0.96 GiB)"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 2.0, memory_gb = 10.0, pids = 8192 }
sim = { cpus = 2.0, memory_gb = 8.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode, write its live verdict (no replay), then one video pass
timeout_sec = 1620                # the end wait, the video and a margin (generate.py std_collect_s)

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
