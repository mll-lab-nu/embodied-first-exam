schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/badminton-match-wallclock-program-standard"
description = "PROGRAM PLAY, parameterized: the opponent level (RCB_LEVEL 1-2), slowdown (RCB_SLOWDOWN) and instance seed (RCB_SEED) are chosen at run time; the verifier reports them and whether they form an official configuration. The agent may write an autonomous player program that observes the cameras and acts without a new model response per shot, and may watch, stop, fix and restart it at any time (also mid-point) and during the frozen review after every point. One act in flight at a time. INTERACTIVE MODE, WALL-CLOCK REAL TIME in a slowed world: robot badminton, a singles match (first to 5 points, two-point lead from 4-4, at most 7, rally scoring; the same rules as the duel) against a scripted opponent (MuJoCo Franka on a sliding base with a racket; point-mass shuttlecock with quadratic drag, no bounce). Observation: 2 cameras x 4 frames, no shuttle coordinates. Success: win a valid match, with deterministic replay and no simulator, model-API or metering failure."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "robotics", "mujoco", "franka-panda", "badminton", "interactive", "real-time", "wall-clock", "vision", "spatial-reasoning", "match", "mobile-base"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded match itself
simulator = "mujoco"
robot = "franka-panda"
family = "badminton_match"
mode = "standard"
protocol = "eai-standard-realtime/1.0"           # real-time extension of standard mode
oracle = "full"
oracle_evidence = "solution/: the privileged reference player (true shuttle state through the oracle-only endpoint, ordinary acts); checked valid at L1-L2, x1-x20"
revision = "wallclock-3-program-v4-param"   # v4: the duel's rules (scoring, base, hit cap, robots home before serves)
engine_revision = "sports-audit-2026-10-01+bwf-serve-net+duel-rules"   # bm.py: BWF serve courts and net 1.524 m; scoring, base, hit cap and robot reset shared with the duel
parameters = "RCB_LEVEL (1-2, default 1), RCB_SLOWDOWN (default 20), RCB_SEED (default 101)"
expert_time_estimate_hours = 0.75

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 600); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 700

[agent]
timeout_sec = 7200.0           # preparation, then the match at the slowest official configuration (x20)

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
