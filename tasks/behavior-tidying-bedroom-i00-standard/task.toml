schema_version = "1.3"
artifacts = [
  { source = "/out/final.json", service = "sim" },
  { source = "/out/episode.jsonl", service = "sim" },
  { source = "/out/trajectory.npz", service = "sim" },
  { source = "/out/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/out/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/out/replay.mp4", service = "sim" },
  { source = "/out/replay.last.png", service = "sim" },
  { source = "/out/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/out/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/out/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/behavior-tidying-bedroom-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): BEHAVIOR-1K v3.9.2 tidying_bedroom on the same frozen instance as the privileged task (2026 challenge public_test instance 301). Tidy the bedroom. The two sandals lie on the bedroom floor and the book lies on the bed. Put one sandal next to the bed and the other sandal next to the first one, and put the book on top of a table in the bedroom. The agent only gets a client: get_obs (RGB-D + proprioception), submit (joint_position or ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory, resumes it after a crash, and the episode is graded on two fresh replays."
authors = [{ name = "qineng" }]
keywords = ["robotics", "behavior", "omnigibson", "isaac-sim", "r1pro", "mobile-manipulation", "standard-mode", "trajectory", "tidying_bedroom"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "behavior"
robot = "r1pro"
family = "tidying_bedroom"
mode = "standard"                  # robot as a service: RGB-D + proprioception, no object poses, no success predicate, no reset
protocol = "eai-standard/2.2"
oracle = "none"
oracle_evidence = "No reference solution: BEHAVIOR-1K ships no expert or planner that replays on this frozen instance. Solvable: model trial behavior-tidying-bedroom-i00__VcXRVyJ (behavior-lunaxh-t8-0927, the privileged twin behavior-tidying-bedroom-i00-privileged on the same frozen instance and BDDL goal) graded success=1, deterministic=1 by the separate verifier on a pre-v1.0 version of this task (dev/qineng 2d486a91; grader verdict and frozen instance unchanged since); agent log https://embodied-agent-interface-v2-internal.github.io/runs/behavior-1k/codex-gpt6_luna-xhigh/tidying_bedroom/unlimited/, verifier replay https://huggingface.co/datasets/eai-v2-internal/agent-runs/resolve/main/behavior-1k/codex-gpt6_luna-xhigh/tidying_bedroom/unlimited/replay.mp4; not re-run on this version (static validation only). Human review per family (protocol §2.7)."
instance_seed = 301
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode (waits through a resume), replay twice in fresh processes, write final.json
timeout_sec = 37800               # 10.5 h = the episode end (up to 2 h through a resume) + two replays as long as the privileged
                                  # grader allows (4 h each) + 30 min; measured on an 8-vCPU L40S: 626 s Isaac start, < 3.5 steps/s

[agent]
timeout_sec = 14400.0             # BEHAVIOR budget (Isaac Sim + scene load, ~10 steps/s), same as the privileged twin (docs/benchmarks/behavior.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576
