schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/live.mp4", service = "sim" },
  { source = "/data/live.2.mp4", service = "sim" },
  { source = "/data/live.3.mp4", service = "sim" },
  { source = "/data/live.4.mp4", service = "sim" },
  { source = "/data/live.5.mp4", service = "sim" },
  { source = "/data/live.6.mp4", service = "sim" },
  { source = "/data/live.7.mp4", service = "sim" },
  { source = "/data/live.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },
  { source = "/data/journal.f64", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/startup_binding.json", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/roboarc-ikea-lack-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.4): IKEA MuJoCo LACK side table (dual Franka Panda + Menagerie Panda hand, MuJoCo 3.14.0 CPU) on the same frozen scene as the privileged task. Screw all four legs onto the four threaded studs of the tabletop. The agent only gets a client: get_obs (RGB from four ALOHA-style cameras, optional depth, proprioception, calibrated cameras), submit (joint_position chunks, joint targets within the robot's joint velocity limits), stateless kinematics, every pose in the robot's frame. No reset, no privileged state; the sim service records and grades the live episode (no grading replay)."
keywords = ["robotics", "roboarc", "ikea", "furniture-assembly", "mujoco", "panda", "bimanual", "standard-mode", "trajectory"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"              # plain MuJoCo 3.14.0, CPU float64, the scene's own runtime and mechanism
robot = "franka-panda-bimanual"            # both arms (docs/TAXONOMY.md)
family = "ikea_lack"
suite = "ikea"                    # RoboARC's IKEA furniture-assembly suite (tasks/roboarc/README.md, IKEA suite)
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): only the robot and gravity do work; springs, latches and threads are passive
protocol = "eai-standard/2.4"           # the shared 2.4 service layer; 2.1 / 2.2 requests are served unchanged
oracle = "full"
grasp = "physical (finger friction; no assisted grasp, no welds to a gripper)"
success_rule = "the scene's success.py + the terminal rules (released, at rest, no breakdown): evaluated by the sim service on the live episode after each call (the first settled success ends the episode) and at its end: at the last row and again after a 1.0 s hold of it (on a copy); no grading replay"
instance_seed = 0                 # one frozen scene: images/ikea-mujoco scene lack, digest b8e0348698b0
expert_time_estimate_hours = 6

[verifier]
timeout_sec = 600.0
environment_mode = "separate"     # tests/Dockerfile: the shared client base; transcribes the sim service's final.json, no network
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end (judge the live episode as it stands) + dump + exit the service, write final.json; no replay
timeout_sec = 7200                # the end waits through a call in progress, a crash-recovery resume and the live video's close

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget (the privileged twin's; PROTOCOL H.7); verifier has its own budget
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 2                          # reads final.json, copies the live video: no simulator
memory_mb = 2048

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
