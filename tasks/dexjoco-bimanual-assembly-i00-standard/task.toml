# Generated by scripts/dexjoco/generate.py -- edit the generator or the instance, not this.
schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  { source = "/data/replay3.log", service = "sim" },           # and its third, which renders replay.mp4
  "/app/output/",
]

[task]
name = "robot-coding-bench/dexjoco-bimanual-assembly-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): DexJoCo bimanual_assembly (two Franka Panda arms, each with a 16-DoF Allegro hand) on the same frozen instance as dexjoco-bimanual-assembly-i00-privileged. Hold the tray with one hand and insert the round peg into its socket with the other. The agent only gets a client: calibrated cameras (RGB, optional depth), the robot's joints and tcp poses, tcp-target + hand-joint chunks at 50 Hz, the robot's kinematics; one episode, no reset, no object state; the sim service records the episode, replays it in fresh processes and grades it."
authors = [{ name = "Chi Gui" }]
keywords = ["robotics", "dexjoco", "mujoco", "allegro", "dexterous-manipulation", "standard-mode", "robot-as-a-service", "bimanual_assembly"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"
simulator = "dexjoco"
robot = "franka-allegro-bimanual"
family = "bimanual_assembly"
mode = "standard"
protocol = "eai-standard/2.2"
oracle = "full"
expert_time_estimate_hours = 2.5

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json, video
timeout_sec = 3600

[agent]
timeout_sec = 5400.0
network_mode = "allowlist"        # the reference demonstrations are public on Hugging Face (PROTOCOL §2.7)
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
