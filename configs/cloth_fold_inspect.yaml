# cloth_fold_inspect_demo 的主配置。
#
# env 用 world_tabletop_v1：布走 PBD，不是 FEM+IPC，所以不需要 fem 那套预设。
# 而且判据的门槛是在这组 sim 参数（dt=0.01 / substeps=4）下标定的，换一组就不成立。

defaults:
  - config
  - override task_configs@task: cloth_fold_topogym_tabletop_v1
  - override env_configs@env: world_tabletop_v1
  - override run_configs@run: cloth_fold_inspect
  - _self_
