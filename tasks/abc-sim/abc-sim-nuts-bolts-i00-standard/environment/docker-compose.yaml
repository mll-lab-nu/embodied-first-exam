# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches
# port 8000. No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace. The sidecar
# renders the cameras over EGL on an NVIDIA GPU (physics on the CPU). Crash recovery: the service exits non-zero when it
# crashes, compose restarts the container (same /data) and the service resumes the same episode from its journal.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 10240m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the shared layer's files
      context: sim
      dockerfile: Dockerfile
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6          # N >= 3; a resume continues the episode
    environment:
      RCB_INSTANCE: /srv/instance.npz
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "300"   # the scene builds in 1-5 s
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
      RCB_SERVER: /opt/abc-tools/standard/server.py
      PYTHONPATH: /srv:/opt/abc:/opt/abc-tools
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-0}"   # standard: one episode (the mode's default)
      RCB_COLLECT_BUDGET_S: "1800"   # the collect hook's timeout_sec: finalize.sh fits the video in
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.3.0@sha256:53154417782408df8309194971b08b18c3682d2b337e2e3b2eb4c88fe025ab85
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
