# Exported by Embodied Olympics from tabletennis-match-wallclock-program-standard (sports/tabletennis/sport.toml): do not edit.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
]

[task]
name = "embodied-first-exam/embodied-olympics-match-tabletennis-match-i04-realtime"
description = "REALTIME (Embodied Olympics / Embodied Agent Olympics, our own service): table tennis, one match against the scripted opponent at level 4, program play (eai-standard-realtime/1.0: the world runs at 1/10 of real speed and never waits, except that it freezes after every point for the player's review, at most 300 s). Camera images and the robot's own state only. Frozen development instance (seed and level fixed, not an official seed). robot table tennis in a continuous world slowed by a factor S (MuJoCo Franka Panda + paddle on an x-y rail base behind the end line, both held to the real robot's limits: the Panda's joint velocity, acceleration, jerk, torque and torque rate, the rail's speed, acceleration and jerk; DeepMind ball and table model), seen only through two cameras of four frames each; one game to 5 points (lead by 2 from 4:4, at 6:6 the next point wins); the players' robots serve by the ITTF service laws (a toss device on the robot projects the ball at least 16 cm up from a point you choose behind your end line, you strike it as it falls; 2 serves each, from 4:4 one each); format match: you against a scripted opponent (level 1-4; you serve first), format duel: two players. Exported from Embodied Olympics task tabletennis-match-wallclock-program-standard."
keywords = ["robotics", "embodied-olympics", "sports", "tabletennis", "mujoco", "realtime-mode", "vision", "real-time"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "franka-panda"
family = "tabletennis_match"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard-realtime/1.0"
instance_seed = 34
opponent_level = 4
revision = "wallclock-15+duel-wallclock-12+low-inloop-1+core-0.2"
play = "program"
action_level = "high"
source_task = "roboolympics/tabletennis-match-wallclock-program-standard"
source_commits = ["e25d8cc11861"]
exporter = "Embodied Olympics task exporter"
player_mode = "unmetered"
official = false
expert_time_estimate_hours = 0.5
oracle = "partial"
oracle_evidence = "level 4 (the strongest official level, unchanged): a mirror match (the level-4 opponent copied onto the player's side, same limits, same true-state prediction) won 18 of 40 (seeds 1-20, each side serving first), so level 4 is beatable by a player of its own ability; our truth-state reference beat level 4 in 2 of 40 seeds (re-screen 2026-10-12, revision 15), this seed 5:3; our camera-only reference 0 of 40; every simple baseline 0 of 20; the live oracle run is in the export report"

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [34, 404, 414]

[verifier]
timeout_sec = 1260.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running (a program would keep playing; the match is graded as it stands).
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then SIGUSR1 ends the match: the service writes the verdict of the live match ("graded_ready"; no grading replay)
# then the spectator video.
[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 180); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 720); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1080

[agent]
timeout_sec = 7200
# The agent reaches the model APIs, the package registries and the sim (localhost:8000, Harbor's egress control).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 5120
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
