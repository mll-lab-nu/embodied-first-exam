schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/ispatialgym-inter-object-relation-satisfaction-inside-small-scale-i00-privileged"
description = "PRIVILEGED MODE: iSpatialGym inter_object_relation_satisfaction_inside_small_scale (upstream subtask inter_object_relation_satisfaction_inside_small_scale_brussels_sprouts_bowl, instance 0). The goal is an image: make the scene look like /app/goal.png, the head camera's view once the task is done. The simulator runs in the agent's container from the frozen start, every object's state readable and resets unlimited, but nothing there holds the goal, a target or a success check; the deliverable is one trajectory, which a separate verifier with the goal replays twice in fresh processes and grades."
keywords = ["robotics", "ispatialgym", "spatial-intelligence", "goal-image", "omnigibson", "isaac-sim", "r1pro", "privileged-mode", "trajectory", "inter-object-relation-satisfaction"]

[metadata]
task_type = "trajectory"
simulator = "ispatialgym"
robot = "r1pro"
family = "inter_object_relation_satisfaction_inside_small_scale"
dynamics = "static"               # objects move only by the robot or gravity (tasks/ispatialgym/README.md)
oracle = "none"
oracle_evidence = "upstream's goal image of this instance is the last frame of a successful replay of upstream's own demonstration of it (kmy17518/ispatialgym-eval-data@15cb9a7, ispatialgym-eval-instances/README.md, Goal images)"
instance_seed = 0
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 5400               # one fresh-process replay (a scene load + at most 2370 steps) with margin
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 12
memory_mb = 38912
storage_mb = 10240
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
