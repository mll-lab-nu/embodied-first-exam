# Genesis renders camera images through EGL on the GPU (the physics runs on its bit-deterministic CPU backend). Harbor's
# local docker sandbox rejects [environment].gpus, but merging this onto the main service passes the device through.
# The BlenderKit models this task loads may not be redistributed, so they are not in the image: they come read-only
# from the host's folder $RCB_ROBOWITS_BLENDERKIT (images/robowits/NOTICE).
# The agent's container never sees that folder or its key (since 2026-10-14): only the `blenderkit` service mounts it; it
# decrypts the models this family loads and serves them on localhost:8765, from where the tooling in `main`
# fetches them for each scene build (RCB_BLENDERKIT_URL; rcb_robowits.py blenderkit-serve).
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    shm_size: "2gb"
    depends_on: [blenderkit]
    environment:
      RCB_BLENDERKIT_URL: http://127.0.0.1:8765
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  blenderkit:
    cpus: 1   # rcb-monitor
    mem_limit: 4096m   # rcb-monitor
    pids_limit: 4096   # rcb-monitor
    image: ghcr.io/mll-lab-nu/efe:robowits-0.1.1
    working_dir: /tmp
    volumes:
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
      - ${RCB_ROBOWITS_BLENDERKIT:?set RCB_ROBOWITS_BLENDERKIT to your BlenderKit model folder (images/robowits/NOTICE)}:/bk:ro
      - ./rcb_robowits.py:/srv/rcb_robowits.py:ro
    restart: on-failure:3
    command: ["python", "/srv/rcb_robowits.py", "blenderkit-serve", "--task", "raise_platform", "--src", "/bk", "--port", "8765"]
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by scripts/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.2.0@sha256:65442d9e9eeb493d785a59d48a321345e2b48186946cc9d55beb684182514b4b
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
