# Rendering (every control step renders the episode's cameras, as upstream's Task.step does) runs on an NVIDIA GPU
# through EGL; physics is on the CPU. Harbor's local docker sandbox rejects [environment].gpus; merging this onto the
# main service passes the device through.
services:
  main:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
