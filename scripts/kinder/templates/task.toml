# Generated from scripts/kinder/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/{{task_dir}}"
description = "KinDER {{env_name}} (privileged mode): produce one replayable trajectory that reaches the goal, frozen scene instance {{instance_tag}}."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", {{keywords}}, "physical-reasoning", "trajectory", "{{family}}"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "{{robot_id}}"
# KinDER env {{env_id}}
family = "{{family}}"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
# scene = environment/instance.json (KinDER's seed + a digest of the scene it builds); identity = the dataset.toml digest
instance_seed = {{seed}}
expert_time_estimate_hours = {{expert_hours}}
{{oracle_lines}}

[verifier]
timeout_sec = {{verifier_timeout}}
# grade.py runs in its own container, built from tests/Dockerfile (docs/protocol/README.md §2.6): the agent's container,
# where it was root, is gone by then, and only /app/output/ crosses over. It replays locally, with no network.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = {{agent_timeout}}
# The model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS): KinDER and its baselines are public.
network_mode = "allowlist"
allowed_hosts = [{{allowed_hosts}}]

[environment]
build_timeout_sec = 1800.0
cpus = 16
memory_mb = 16384
