# Linkbar Merge Components（docx 4.4）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 工业原型：两段模块化工作台机架。组件 A 螺栓固定在台面上（底梁、枢轴立柱、伸出臂
# 都不动），组件 B 是一段装在径向导轨上的机架小车。连接梁铰接在 A 的枢轴
# 立柱上，只能绕竖直轴转；梁端的销在一个水平圆上走。圆上有两个卡座：B1 装在 B 的
# 内端，A2 装在 A 自己那条伸出臂的末端。机械臂只转梁上的手柄，把销扣进其中一个卡座。
#
# 两个卡座是**同一个零件**：tasks/connectivity/linkbar_merge_components.py 的
# _socket_shapes() 只写一份形状，A2 与 B 各用一次。因此「同款插口」是代码保证而不是
# 两段配置恰好写成一样。二者同半径、同扫掠成本，唯一区别是装在谁身上——这正是本任务
# 要考的东西。
#
# 与 docx 的几何差异：docx 图画的是竖直平面内摆动，这里改为桌面水平面（铰链轴 +z）。
# 判定的不变量（约束图 β₀ 2→1）完整保留；改动的理由与代价见
# docs/develop/tasks/linkbar_merge_components_zh.md §1。
# 第二处差异：docx（与 task_taxonomy_zh.md §4.4）规定的物理复核是「提起测试」，这里
# 改为**行程测试**——推小车沿导轨走，被连接梁拉住即判合并。理由是 B 做成导轨小车后
# 只有一个自由度，读数直接就是那个关节的位置，有界且无需标定；而封闭导轨会让提起测试
# 失去判别力（没合并时小车也被导轨压着抬不起来）。这是对类别契约的一处偏离，需在
# task_taxonomy_zh.md 与本任务文档各记一行。
#
# 派生量不写在这里，由 LinkbarMergeLayout 从下面几个数算出来，改半径或改角度时整套
# 几何自洽：
#   socket_center(θ)      = pivot + arm_radius · (cos θ, sin θ)      卡座（销的落座点）
#   socket_yaw(θ)         = θ − 90°·sign(θ − init)                   卡座口朝销来的方向
#   socket_pad_half_width = pin.radius + pin_clearance + jaw_thickness  卡座的径向半宽
#   outrigger 长度        = arm_radius − socket_pad_half_width       伸出臂止于卡座底板
#   B 的机架起点          = socket_pad_half_width + base.gap         沿径向朝外
#
# 现值（arm_radius=0.170，init=0°，b1=+55°，a2=−45°）：
#   B1 卡座 (0.0775, 0.1392)，A2 卡座 (0.1002, −0.1202)，
#   捕获窗 15mm ≈ 5.06° 关节角，越程余量（销到背板）24mm ≈ 8.1°。

task:
  id: linkbar_merge_components
  difficulty: smoke

coordinate_frame: task

# ---------------------------------------------------------------- 枢轴
# 整套几何的原点。
#
# x 取 +0.020 是被实测逼出来的，不是随手选的。停在共用 home 位姿的手部实测在
# task 帧 (+0.043, −0.000, +0.267)，指尖悬在手柄的高度带里。枢轴原为 −0.020 时，
# 手部相对枢轴的半径是 0.063，而手柄圆是 0.100——张开的夹爪正好横跨手柄圆，
# 连接梁扫回初始角附近时会撞上它（2026-08-20 实测：四段扫掠里有三段顶在机械臂上，
# 接触力约 20N，梁停在 +8.34° 再也过不去）。
#
# 挪到 +0.020 之后手部相对枢轴的半径是 0.023，落在轮毂（半径 0.030、顶面 0.097）
# 正上方，指尖高度还剩约 50mm 余量；手柄圆与指尖的水平净空从 26mm 增到 43mm。
# 副作用是初始角下手柄落在 x≈0.120，距 Franka 底座 0.690m——正好是 4.3 拨杆的取值。
#
# 不改共用 home（`shared home parity`：那是 RoboMME 的锚点）。若将来仍需让开，
# 按 stacked_plate 的先例配一份任务专属的抬高 home，而不是动 common 里的 qpos。
pivot:
  x: 0.020
  y: 0.0

# ---------------------------------------------------------------- 连接梁
linkbar:
  # 销走的圆半径。也是两个卡座的半径——「同在旋转圆上」在这里是一个数。
  arm_radius: 0.170
  # 初始角。0° = 梁指向 +x（远离机械臂、朝 front 相机）。两个卡座分居它两侧。
  init_angle_deg: 0.0

  beam:
    # 梁底 0.075 高于一切卡座颚板（顶面 0.053），所以梁可以从任何卡座上方扫过，
    # 只有销会进卡座。这条净空是「扫过去不挂住」与「扫到位才锁上」能分开的前提。
    bottom_z: 0.075
    height: 0.020
    width: 0.026
    color: [0.42, 0.46, 0.52]

  pin:
    radius: 0.010
    # 销底 0.012 高于底板顶面 0.008，留 4mm：销在整圈行程里不蹭任何底板。
    bottom_z: 0.012
    collar_radius: 0.015
    collar_height: 0.008
    color: [0.88, 0.55, 0.10]

  axle:
    radius: 0.018
    # 转轴伸出梁顶多少。露出一截才看得出「梁绕它转」。
    rise: 0.010
    # 转轴底面与 A 的固定立柱顶面之间的轴承间隙。**不能为 0，更不能让转轴一路伸到
    # 桌面**：立柱已经在那里，同轴两根实心圆柱在立柱整个高度上互相穿透，等于在固定件
    # 与唯一需要自由转动的件之间做了一圈永久接触。2026-08-20 实测（转轴从 z=0 起）：
    # 伺服驱动的扫掠最多欠转 22°，且顶着卡死推，把组件 B 推离原位 9mm。
    clearance: 0.002
    color: [0.55, 0.56, 0.58]

  hub:
    radius: 0.030
    height: 0.024

  knob:
    # 手柄所在半径。取 0.100 < arm_radius：手柄在销的内侧，夹爪够手柄时离卡座还远，
    # 不会在落座瞬间撞到卡座颚板。
    station: 0.100
    boss_radius: 0.016
    boss_height: 0.010
    # 圆柱手柄而不是方柱：方柱的对角线比端面宽，转动时会把指腹撑开（4.3 实测结论）。
    radius: 0.011
    height: 0.050
    cap_radius: 0.014
    cap_height: 0.006
    # 指腹在手柄上的高度（自手柄底面起）。手柄 0.105–0.155，取中偏下。
    grasp_height: 0.025
    color: [0.12, 0.13, 0.15]
    cap_color: [0.88, 0.55, 0.10]

  mechanism:
    joint_name: linkbar_joint
    mass: 0.450
    joint_damping: 0.050
    joint_friction: 0.030
    joint_armature: 0.010
    contact_friction: 1.000
    # 关节**不设限位**。圆上有两个座，限位只能描述其中一个；而且「转到停为止」会把
    # 本任务要考的瞄准直接抹掉（4.3 就同一问题留下过书面理由）。越程由卡座背板吃掉。

# ---------------------------------------------------------------- 卡座角位置
# 防捷径的随机化轴。逐 episode 改这两个角即可：oracle 读 b1 的归属仍然可解，而
# 「转向最近的座」「总是转同一个方向」都被钉在随机水平。
sockets:
  b1_angle_deg: 55.0
  a2_angle_deg: -45.0
  # 允许的扫掠幅度（相对 init_angle_deg 的绝对值）。下界保证「转过去」是一次真动作
  # 而不是抖一下；上界保证手柄不出机械臂工作区。两个角必须分居 init 两侧，否则销要
  # 穿过一个座才能到另一个座——LinkbarMergeLayout.validate 直接报错。
  min_sweep_deg: 35.0
  max_sweep_deg: 75.0

# ---------------------------------------------------------------- 卡座（同款零件）
# 局部坐标：+x 朝外穿过卡座口（销来的方向），+y 横跨卡槽。
#
# **卡槽沿销的圆弧走，不是直的。** 直槽导不了摆臂上的销：从口部到座位 55mm 的弦上，
# 半径 170mm 的圆弧偏离弦 12.9mm，是单边间隙的三倍。2026-08-20 用直槽实测——销在
# 离 A2 座位还有 22° 处以 13N 顶死在颚板上；而 B 的卡座能动，于是销把整个 B 推开
# 14.5mm。两个现象同一个原因。
#
# 因此底板与颚板按弧长切成 jaw_segments 段，每段按自身中点的切线摆放，段内残余偏差
# 只剩该段自己的垂距（三段时 < 1mm，对 4mm 间隙）。
socket:
  # 销与颚板的单边间隙。卡槽半宽 = pin.radius + 这个值 = 0.014。
  pin_clearance: 0.004
  jaw_thickness: 0.010
  jaw_height: 0.045
  pad_thickness: 0.008
  # 卡槽沿弧长的两端（自座位量起，米）。口部一侧 0.055 ≈ 18.5° 圆心角，销在离座位
  # 18.5° 处进入槽口；深端 0.048 给背板留出安装位置。
  jaw_arc_back: 0.048
  jaw_arc_mouth: 0.055
  # 分段数。段内垂距 = R(1−cos(半段弧长/R))：三段时每段 34mm，垂距 0.85mm。
  jaw_segments: 3
  # 背板。位于弧长 −0.042 处，是关节唯一的硬止挡（关节本身不设限位）。
  # 越程余量 = 0.042 − 0.010（销半径）− 0.006（背板半厚）= 0.026m ≈ 8.8° 关节角，
  # 比捕获窗 5.06° 宽，过冲会被挡住而不是飞过。
  back_stop_arc: 0.042
  back_stop_thickness: 0.012
  # 口部导角。纯视觉：在物理上放宽入口等于偷偷改掉卡座能容忍多少对不准，而这份
  # 预算属于 capture_tolerance_xy。
  lip_length: 0.018
  lip_flare_deg: 18.0
  # 捕获窗：销心距落座点多近才锁上。15mm ≈ 5.06° 关节角，是本任务的瞄准精度要求。
  capture_tolerance_xy: 0.015
  # A2 那份是固定件，质量只用来写 URDF 的惯量，不影响任何判定。
  mass: 0.300
  contact_friction: 1.000
  color: [0.62, 0.63, 0.65]
  accent_color: [0.88, 0.55, 0.10]

# ---------------------------------------------------------------- 组件 A（固定）
component_a:
  # 底梁：自枢轴朝机械臂一侧伸出。8mm 平板而不是厚梁——销底在 0.012，销的圆上
  # 任何高过它的东西都是销会撞的东西。
  spine:
    length: 0.170
    width: 0.070
    thickness: 0.008
    # 末端立柱。离枢轴 0.140（x≈−0.160）：让 A 读起来是一段机架而不是一块贴在
    # 桌上的板。高度取 0.070 而不是更高，有两个原因：低于梁底 0.075 留 5mm，梁扫到
    # 任何角度都不会碰它；以及避免与 Franka 共用 home 位姿的前臂发生干涉。
    post_inset: 0.030
    post_height: 0.070
    post_radius: 0.016
    color: [0.55, 0.56, 0.58]
  # 伸出臂：自枢轴通往 A2 卡座。它的方向随 a2_angle_deg 派生，因此 A2 在画面里
  # 始终**结构上连着 A**——这就是「接口的全局归属」在视觉上的表达。
  outrigger:
    width: 0.056
    thickness: 0.008
    color: [0.55, 0.56, 0.58]
  # 梁转在它上面的固定立柱。顶面 0.070 刚好在梁底（0.075）之下，转轴从它上方穿出，
  # 于是关节的「固定半边」与「转动半边」在画面里是分开的两件东西。
  pivot_column:
    radius: 0.026
    height: 0.070
    color: [0.45, 0.46, 0.48]

# ---------------------------------------------------------------- 组件 B（导轨小车）
# 单个刚体小车，装在一条径向导轨上，只有一个平动自由度。
#
# 为什么不是自由体：自由体有 6 个自由度，只靠摩擦和定位块待着。2026-08-20 实测，
# 销蹭到颚板就把它推走 12.8mm、再一次 14.5mm——远超卡座 4mm 的单边间隙，闩当时
# 还在按标称座位判定，等于在测一个已经不在那儿的座位。小车推不歪、转不动、蹭不走。
#
# 同时判据变成有界读数：合并了小车走不动，没合并就跑到行程末端，是一个固定距离，
# 而不是一个大小取决于推力设定的位移。见 tasks/connectivity/_travel_probe.py。
#
# 导轨方向由卡座角派生，永远是径向。这条不能改成切向：落座时连接梁正好沿导轨方向，
# 梁以纯拉压受力、锁得最死；切向导轨与销的圆相切，小车能滑而梁角只有二阶变化，
# 锁是软的。
component_b:
  # 0.90kg。推力按自重的倍数给，所以质量改了判据不用重标。
  mass: 0.900
  contact_friction: 0.900
  color: [0.28, 0.40, 0.52]
  mechanism:
    joint_name: carriage_joint
    # 移动关节：damping 单位 N·s/m，friction 单位 N。取值只要远小于探针推力
    # （1.5 × 0.9kg × g ≈ 13.2N）即可，它们的作用是让小车不因数值噪声自己溜走。
    joint_damping: 0.500
    joint_friction: 0.200
    joint_armature: 0.010
  # 行程。未合并时小车会走到末端并停在那里，这个距离就是「没合并」那一档的读数。
  rail:
    enabled: true
    travel: 0.100
    # 两条导轨梁与末端挡块。**纯视觉**：真正的约束是移动关节，会碰撞的导轨梁只会
    # 和它打架（与 stacked_plate 的横杆同理）。它们的作用是让小车那一个自由度可读——
    # 没有导轨的话，一段沿看不见的直线滑动的机架看起来像 bug。
    beam_size: [0.000, 0.016, 0.020]
    spacing: 0.070
    overhang: 0.030
    stop_size: [0.016, 0.150, 0.045]
    color: [0.45, 0.46, 0.48]
    stop_color: [0.88, 0.55, 0.10]
  base:
    # 0.130 而不是更长：小车还要在导轨上再走 0.100，两者相加决定 B 的最外沿，
    # 而 B 在 min_sweep 那一端最靠近桌子的 +x 边缘。
    length: 0.130
    width: 0.110
    thickness: 0.008
    # 与卡座底板之间的缝。留 4mm 避免两块共面板边缘互相穿插。
    gap: 0.004
  post:
    size: 0.020
    spacing: 0.045
    height: 0.090
    # 沿 B 轴向（自机架起点算起）的两处立柱站位。
    stations: [0.028, 0.102]
  top_rail:
    thickness: 0.016
    height: 0.016
    color: [0.55, 0.56, 0.58]

# ---------------------------------------------------------------- 摆动圆弧标记
# docx 4.4 图里的那条虚线，画它的理由也一样：它是「两个卡座是同样一次转动」的可读证据。
# 纯视觉，无碰撞。
swing_arc:
  enabled: true
  segments: 16
  tick_size: [0.012, 0.004, 0.0010]
  seat_tick_size: [0.026, 0.007, 0.0012]
  z_offset: 0.0006
  color: [0.46, 0.47, 0.49]
  seat_color: [0.88, 0.55, 0.10]

# ---------------------------------------------------------------- 指令
# 与 4.3 不同，本任务的指令是常量：要读的信息（哪个卡座属于 B）在场景里，不在语言里。
command:
  prompt: "Join the two frames into one."

# ---------------------------------------------------------------- 行程测试
# 物理层复核。沿导轨方向推小车：合并成功则被连接梁拉住走不动（落座时梁沿导轨方向，
# 以纯拉压受力），接错或没扣上则小车跑到行程末端。力 = force_scale × component_b.mass
# × g，逐步重复施加（外力每步清零）。
# 取 1.5 就够：自由小车的净加速度约 14 m/s²，0.3 秒能走 0.65m，远超 0.100m 的行程，
# 必定到底。再大也不改变读数，因为答案由导轨的行程界定，不由推力大小界定。
travel_test:
  force_scale: 1.5
  steps: 30
  settle_steps: 20

# ---------------------------------------------------------------- 判据
success:
  # 被合并的小车允许的最大行程。
  max_travel: 0.005
  # 未合并时同样的推力必须走出的行程。低于它说明推力或关节摩擦标定坏了，判据无判别力
  # ——这一条不判任务成败，只用来标记「判据本身失效」。行程上限 0.100，取 0.080。
  min_free_travel: 0.080
  settle_steps: 60

# ---------------------------------------------------------------- 原语参数
# 全部是 hand link 在 task 帧的 z（指腹在其下方 HAND_TO_PAD_Z=0.1029 处）。
motion:
  approach_z: 0.300
  retreat_z: 0.300
  steps_per_phase: 100
  steps_arc: 240
  gripper_steps: 50
  close_hold_steps: 35
  arc_settle_steps: 60
  release_hold_steps: 45
  # 手柄直径 0.022，合到 0.006 让指腹实压。
  grasp_qpos: 0.006
  finger_links: [left_finger, right_finger]
  finger_friction: 3.000
  knob_friction: 2.000
  # 到位角容差。捕获窗 15mm ≈ 5.06°，这里收到 4° 留出余量。
  target_tolerance_deg: 4.0
  max_follow_error: 0.040
  # 扫掠过程中关节允许落后手部多少。这一项区分「夹着转」与「推着走」：指腹夹住时
  # 关节跟得上指令角，打滑时手先走、梁被蹭着推。终点误差看不出来——滑一下再追上，
  # 落点仍然是对的。
  max_lag_deg: 6.0
  max_release_drift_deg: 5.0
  # 合爪停位低于它即判为「合在空处」。assisted carry 不适用，这里是纯接触驱动，
  # 指行程仍是区分「夹到手柄」与「夹空」的读数。
  min_finger_qpos: 0.004

physical:
  settle_steps: 40

mdp:
  max_episode_steps: 60
  reward:
    success: 10.0
    wrong_socket_penalty: 1.0
    action: 0.01
