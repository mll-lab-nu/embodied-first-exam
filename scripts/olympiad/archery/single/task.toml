schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/archery-program-standard"
description = "PROGRAM PLAY, turn-based, parameterized: the instance seed (RCB_SEED: the wind sequence and the shot execution scatter) is chosen at run time; the verifier reports it and whether it is an official configuration. A target-archery round of 4 ends x 3 arrows at a World Archery 122 cm 10-ring face (50, 70, 70, 90 m) in a seeded, gusty crosswind/headwind (MuJoCo scene, osmesa rendering, deterministic point-mass arrow with quadratic drag on the air-relative velocity). Each arrow is `game shoot ELEV_DEG AZIM_DEG DRAW`; observations are camera images only (archer view with windsocks, scope view, side view of a windsock, close-up of the face; no coordinates, no wind numbers). The agent may write a program that reads the windsocks and the target in the images and computes and sends its shots, and stays in the loop (review after every arrow). 60-minute chess clock. One action in flight. Success: a valid, complete round with total >= 110 of 120 (the total is always reported)."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "archery", "wind", "ballistics", "sports", "turn-based", "chess-clock", "vision", "mujoco"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded match itself
simulator = "mujoco"
robot = "none (bow release primitive)"
family = "archery_target"
mode = "standard"
protocol = "eai-standard-turn/1.0"           # turn-based extension of standard mode
oracle = "full"
oracle_evidence = "solution/: a reference archer from the camera images and the documented physics (it reads the windsocks and solves the ballistics); offline it scores 115, 112 and 112 on the official seeds (success line 110)"
revision = "archery-program-2"
parameters = "RCB_SEED (default 20260929)"
expert_time_estimate_hours = 0.5

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 600); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 700

[agent]
timeout_sec = 7200.0           # preparation, then the round: 60 minutes on the agent's clock plus the simulation

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
