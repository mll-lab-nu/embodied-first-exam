# Exported by Embodied Olympics tools/export_fexam.py (do not edit). The `sim` sidecar runs our simulator service
# unchanged (core/launch.py: the match service, eai-standard-realtime/1.0); the agent's container (main)
# reaches it at localhost:8000: under Harbor's egress control both share the egress sidecar's network
# namespace (keep [agent] network_mode = "allowlist"). The seat is unmetered: no metering proxy and no
# credential here (Harbor records the model's usage). CPU only (MuJoCo, OSMesa). cap_drop NET_RAW: no raw
# sockets and no SO_MARK, which could bypass the egress proxy's mark.
services:
  main:
    pids_limit: 2048   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
    cap_drop: [NET_RAW]
  sim:
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /srv
    command: python3 /srv/core/launch.py
    cpus: 6
    mem_limit: 6g
    pids_limit: 1024
    cap_drop: [NET_RAW]
    environment:
      RCB_DATA: "/data"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      RO_PLUGIN: "/srv/sport/plugin.py"
      RO_SPORT: "badminton"
      RO_FORMAT: "duel-wallclock"
      RO_SEATS: "A,B"
      RO_SEED: "1001"
      RO_SEED_SALT: ""
      RO_SEED_INDEX: ""
      RO_FIRST: "A"
      RO_LEVEL: ""
      RO_SLOWDOWN: "20"
      RO_RENDERER: "mujoco"
      RCB_ACTION_LEVEL: "high"
      RCB_PLAY: "program"
      RCB_ACT_RULE: "program"
      CLOCK_S: "3600"
      START_TIMEOUT_S: "1800"
      READY_TIMEOUT_S: "300"
      SEAT_HOSTS: ""
      RCB_RENDER_VIDEO: "0"
      RCB_SPORT_VIDEO: "1"
      RCB_BROADCAST: "1"
      RO_REPLAY_TIMEOUT_S: "600"
      RO_VERDICT_REPLAY: "0"
      RCB_VIDEO_TIMEOUT_S: "1800"
      RO_VIDEO_RENDERER: ""
      LP_NUM_THREADS: "2"
      PLAYER_MODE_A: "unmetered"
      PLAYER_MODE_B: "oracle"
      RCB_WALL_CLOCK_S: "14400"
      RO_BUILTIN_SEATS: "B=builtin_players:RLOpponent"
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
