# The standard limited configuration, as a compose override on the sim sidecar of any limited KinDER task
# (the same budget as HumanoidBench's; the real TidyBot++'s own cameras only, with depth from the RGB-D wrist camera;
# room_camera stays a knob, RCB_OBS_ROOM_CAMERA=1, for control runs).
services:
  sim:
    environment:
      RCB_RESET_BUDGET: "50"
      RCB_OBS_DEPTH: "1"
