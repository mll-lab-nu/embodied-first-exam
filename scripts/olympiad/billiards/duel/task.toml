schema_version = "1.3"
artifacts = [
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage_A.json", service = "sim" },
  { source = "/data/think_calls_A.jsonl", service = "sim" },
  { source = "/data/think_usage_B.json", service = "sim" },
  { source = "/data/think_calls_B.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/billiards-duel-program-standard"
description = "Two-player 8-ball, turn-based, PROGRAM PLAY: two agents (seats A and B, equal isolated containers) play one rack of American 8-ball against each other (WPA rules: break, called shots, open table, solids/stripes from the first called ball pocketed, ball in hand after a foul, the 8 into a called pocket; pooltool physics). DUEL_SEED (the rack and the execution scatter) and FIRST_PLAYER (who breaks) are chosen at run time. Each player has its own 60-minute chess clock running only on its turn (reviews included; clock out = loss); acts out of turn are refused (HTTP 409); one act per seat in flight; a review after each shot. Each may write a program that measures the camera images and sends its shots, with a live metered model session. Up to 30 minutes to start after the opponent. Technical failures invalidate the trial."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "billiards", "8-ball", "pool", "pooltool", "turn-based", "chess-clock", "arena", "multi-seat", "vision"]

[metadata]
revision = "eightball-duel-turn-1-program-param"
author_name = "Chi Gui"
category = "robotics-sports-arena"
task_type = "trajectory"
simulator = "pooltool"
robot = "none (cue)"
family = "billiards_duel"
mode = "standard"
protocol = "eai-standard-turn/1.0"           # turn-based extension of standard mode
oracle = "full"
oracle_evidence = "solution/: the scripted camera-only 8-ball player on either seat; oracle against oracle plays valid games (FIRST_PLAYER A and B)"
parameters = "DUEL_SEED (default 1), FIRST_PLAYER (A or B, default A)"
duel_seed = 1
expert_time_estimate_hours = 1.0

[[seats]]
name = "A"
service = "seat_a"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress_a"]

[[seats]]
name = "B"
service = "seat_b"
agent_kwargs = { think_proxy_url = "http://sim:18091/v1" }
setup_networks = ["egress_b"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 900); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1000

[agent]
timeout_sec = 10800.0          # preparation (start window up to 30 min) and the match: two 60-minute chess clocks

[environment]
build_timeout_sec = 1200.0
cpus = 1                      # main (idle); sim and the seats are sized in docker-compose.yaml
memory_mb = 1024
# Multi-seat task (Harbor with seats): the sim sidecar (simulator, referee, one metering proxy per seat: A on
# 18090, B on 18091; the real model credentials live only here) and two identical seats. Harbor installs and runs
# seat A's agent in seat_a and seat B's in seat_b; `main` stays idle. CPU only: no GPU.
