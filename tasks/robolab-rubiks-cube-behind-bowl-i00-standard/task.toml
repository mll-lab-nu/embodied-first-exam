schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/replay1.log", service = "sim" },           # the collect hook's two fresh-process replays
  { source = "/data/replay2.log", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robolab-rubiks-cube-behind-bowl-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): NVIDIA RoboLab rubiks_cube_behind_bowl on the same frozen instance as the privileged task (the state after RoboLab's canonical seed-0 reset). Put the rubiks cube behind the bowl. The agent only gets a client: get_obs (RGB, depth + proprioception), submit (joint_position or ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "qineng" }]
keywords = ["robotics", "robolab", "isaac-lab", "isaac-sim", "franka", "standard-mode", "trajectory", "rubiks_cube_behind_bowl"]

[metadata]
author_name = "qineng"
task_type = "trajectory"
simulator = "robolab"
robot = "franka-robotiq-2f85"
family = "rubiks_cube_behind_bowl"
mode = "standard"                  # robot as a service: RGB, depth + proprioception only; no object poses, no success predicate, no reset
protocol = "eai-standard/2.2"
oracle = "none"
oracle_evidence = "No reference solution: RoboLab ships no expert or planner. Positive examples graded 1 by the separate verifier: robolab-rubiks-cube-behind-bowl__6kpNySr (robolab-rubiks-cube-behind-bowl-i00-privileged, run codex-gpt6_luna-xhigh, robolab-lunacx-0925-2038, ws; https://embodied-agent-interface-v2-internal.github.io/runs/robolab/codex-gpt6_luna-xhigh/rubiks_cube_behind_bowl/unlimited/); robolab-rubiks-cube-behind-bowl__JTz2urX (robolab-rubiks-cube-behind-bowl-i00-standard, run codex-gpt6_luna-xhigh, robolab-lunaxh-limited-0928, ws3; https://embodied-agent-interface-v2-internal.github.io/runs/robolab/codex-gpt6_luna-xhigh/rubiks_cube_behind_bowl/limited/). Human review per family (PROTOCOL §2.7)."
instance_seed = 0
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 4.0
min_memory_gb = 14.0
min_gpu_memory_gb = 6.5
gpu_required = true
gpu_class = "rtx"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 13.0
verifier_min_gpu_memory_gb = 6.5
measured = "GPU 4.0-5.5 GB per trial (one simulator), anon memory 7.6-10.3 GB, CPU p90 2.4-8 cores over 7 trials, live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 AWS hosts + mll-4090-1, 10-10); vram_profile peaks 14.5-15.7 GB include agents' extra simulator processes and Isaac's card-sized pools; author: one Isaac simulator per 32 GB of host RAM"

[metadata.resources.limits]
# agent-phase limits; exceeding one fails the trial. scope: trial = every container, agent = the agent's container (docs/PROTOCOL.md §2.10)
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 24.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app"]
sustain_sec = 60.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 38.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, replay twice in fresh processes, write final.json
timeout_sec = 5400                # = the agent budget: a 1.5 h episode can record ~22-45k steps, replayed twice at ~20 steps/s

[agent]
timeout_sec = 5400.0              # RoboLab budget, both modes (docs/benchmarks/robolab.md)
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576
