# Generated from scripts/kinder/templates/task.toml -- edit subset.toml or the template, not this.
schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/kinder-sweep-simple-i00-privileged"
description = "KinDER SweepSimple3D-o10-sweep_the_blocks_to_the_left_side_of_the_kitchen_island (privileged mode): produce one replayable trajectory that reaches the goal, frozen scene instance i00."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "kinder", "mujoco", "tidybot", "mobile-manipulation", "physical-reasoning", "trajectory", "sweep-simple"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "kinder"
robot = "tidybot-plus-plus"
# KinDER env kinder/SweepSimple3D-o10-sweep_the_blocks_to_the_left_side_of_the_kitchen_island-v0
family = "sweep-simple"
mode = "privileged"
# scene = environment/instance.json (KinDER's seed + a digest of the scene it builds); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 3.0
oracle = "none"
oracle_evidence = "GPT-6 Luna's graded standard-mode episode (50 resets), run `codex-gpt6_luna-medium` (recorded before protocol v1.0) on the results site; today's privileged verifier scores it 1, and so does the standard service when it is sent through the client; human review in PR #8"

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container, built from tests/Dockerfile (docs/PROTOCOL.md §2.6): the agent's container,
# where it was root, is gone by then, and only /app/output/ crosses over. It replays locally, with no network.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# The model APIs and nothing else (scripts/set_agent_egress.py HOSTS): KinDER and its baselines are public.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 16
memory_mb = 16384
