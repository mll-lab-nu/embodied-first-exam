# Exported by Embodied Olympics pilots/soccer_joint/export_fexam_pair.py (do not edit). Three containers share the
# egress sidecar's network namespace (keep [agent] network_mode = "allowlist"): main (the agent, the prebuilt
# seat image with the joint-level toolkit; CPU only)
# reaches the match service (`sim`, core/launch.py, eai-standard-realtime/1.0) at localhost:8000 and its
# practice service (`practice`: full copies of the match world, the scripted levels as black boxes) at
# localhost:8100. The seat is unmetered: no metering proxy and no credential here. cap_drop NET_RAW: no raw
# sockets and no SO_MARK, which could bypass the egress proxy's mark.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim, practice]
    cap_drop: [NET_RAW]
    shm_size: 2g
  sim:
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /srv
    command: python3 /srv/core/launch.py
    cpus: 6
    mem_limit: 8g
    pids_limit: 256
    cap_drop: [NET_RAW]
    environment:
      RCB_DATA: "/data"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      RO_PLUGIN: "/srv/sport/plugin.py"
      RO_SPORT: "soccer"
      RO_FORMAT: "match"
      RO_SEATS: "A"
      RO_SEED: "101"
      RO_SEED_SALT: ""
      RO_SEED_INDEX: ""
      RO_TEAM_CHANNEL: "on"
      RO_FIRST: "A"
      RO_LEVEL: "5"
      RO_SLOWDOWN: "10"
      RO_RENDERER: "mujoco"
      RCB_ACTION_LEVEL: "low"
      RCB_PLAY: "program"
      RCB_ACT_RULE: "program"
      CLOCK_S: "3600"
      START_TIMEOUT_S: "7200"
      READY_TIMEOUT_S: "300"
      AZURE_POOL_WAITS_S: ""
      SEAT_HOSTS: ""
      RCB_RENDER_VIDEO: "1"
      RCB_BROADCAST: "1"
      RO_REPLAY_TIMEOUT_S: "600"
      RO_VERDICT_REPLAY: "0"
      RCB_VIDEO_TIMEOUT_S: "1800"
      RO_VIDEO_RENDERER: ""
      PLAYER_MODE_A: "unmetered"
      RCB_WALL_CLOCK_S: "14400"
  practice:
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - ./practice:/practice:ro
    working_dir: /srv
    command: python3 /practice/practice_server.py
    cpus: 4
    mem_limit: 8g
    pids_limit: 256
    cap_drop: [NET_RAW]
    environment:
      PRACTICE_WORLDS: "4"
      PRACTICE_IDLE_S: "1800"
      RCB_SOCCER_FULLSTATE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MUJOCO_GL: "disable"
      PRACTICE_PORT: "8100"
  # >>> rcb_monitor (resource limits monitor, docs/protocol/README.md §2.10; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.3.0@sha256:53154417782408df8309194971b08b18c3682d2b337e2e3b2eb4c88fe025ab85
    pid: host                  # sees every container's processes (and NVML's host PIDs); the agent never sees it
    cgroup: host               # reads each container's own cgroup (memory, OOM kills, caps)
    network_mode: none
    cap_add: [SYS_PTRACE]      # reads /proc of processes running as other users
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}   # 1: stop the agent at a confirmed violation, and fail the trial
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
