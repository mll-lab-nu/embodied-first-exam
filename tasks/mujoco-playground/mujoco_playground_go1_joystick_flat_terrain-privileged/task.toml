schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/", "/logs/agent/rcb/"]

[task]
name = "embodied-first-exam/mujoco_playground_go1_joystick_flat_terrain-privileged"
description = "MuJoCo Playground Go1JoystickFlatTerrain in plain MuJoCo (Unitree Go1, joint position control every 0.02 s): Make the Unitree Go1 follow the joystick command schedule on flat ground for the whole 20 s episode without falling over. Produce one replayable trajectory of joint position targets on a frozen instance (Playground's reset with seed 0); graded by velocity tracking over the whole 20 s schedule without a fall (two fresh-process replays)."
authors = [{ name = "Changhe Chen" }]
keywords = ["robotics", "mujoco", "mujoco-playground", "unitree-go1", "quadruped", "locomotion", "joystick", "code-as-policy", "trajectory", "privileged"]

[metadata]
author_name = "Changhe Chen"
author_org = "MLL Lab"
task_type = "trajectory"
simulator = "mujoco"
robot = "unitree-go1"
family = "mujoco_playground/Go1JoystickFlatTerrain"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration
oracle = "full"
instance_seed = 0             # the PRNGKey of Playground's reset (and, for the joystick tasks, its command process)
expert_time_estimate_hours = 3.0

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 2.0
min_memory_gb = 4.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 0.0
measured = "GPU 1.0-1.3 GB, evaluation-pool GPU profile (per-trial GPU peaks, 10-03..10); memory: privileged container p90 2.6 GB, sim 0.7 GB, mem_guard (docker memory per container, an RTX 4090 workstation, 10-02..10); CPU p90 1.9 cores, live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 cloud GPU hosts + an RTX 4090 workstation, 10-10)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 8.0
measured = "memory: the [environment] cap 8 GiB, which every past trial ran under (docker peak 4.8 GiB over 9 samples, mem_guard (docker memory incl. page cache, top-4 containers every 10 min, an RTX 4090 workstation, 10-02..10)); processes 512 and disk 10 GiB: design defaults, not yet measured"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 4.0, memory_gb = 10.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 1800.0
# MuJoCo Playground's trained policies are public upstream, so the agent reaches the model APIs and the package registries, nothing else
# (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
