# cloth_unroll_physical_demo 的运行模式参数。

defaults:
  - default
  - _self_

# 端头怎么走。三条路径共用同一套测量，所以数字可以直接对比 —— 判据的阈值要卡在
# 「做对了」和「做错了」之间，只有一边定不出来。做法与 cloth_unpleat 的标定相同。
#   unroll   抓平铺段的自由端沿 +y 拉，总行程等于卷筒收着的料，就是任务本身
#   shove    往**反方向**拉（朝着卷筒推）。布带堆起来，卷筒一点没放料 ——
#            一个搬动了同样多布料却做错了的动作
#   overpull 拉过头，越过「料已经放完」那个点继续走。
#            **这一条在 1.3 里量的东西和 1.2 不同**：那边看的是整条布带滑动，
#            这边看的是整卷会不会被从横梁上扯下来 —— 有夹具才有的失败模式，
#            也是决定「还缠在梁上的粒子数」要不要从记录升格为门槛的依据
motion: unroll

# overpull 比正确行程多走多少倍。
overpull_scale: 1.6

# 机械臂退开之后再空跑多少步才停止录制（dt=0.01，100 步 = 1 秒）。
# 让视频最后是一段布已经落定、机械臂已经让开的稳定画面，便于截图看结果。
# 这是录制上的事不是任务定义，所以在 run 而不在 task —— 松手后的物理沉降是
# task.physical.release_hold_steps，两者管的不是一回事。
final_hold_steps: 100

# 只跑前 N 段抓取就停（0 = 全跑完）。
# 单独列出来是因为 1.3 的一个 episode 是三段，调试第二段的重新 observe 时
# 不该每次都从头等第一段跑完。
max_strokes: 0

# --- 变体（2026-09-05）------------------------------------------------------
# 按 seed 在包络内随机布局（task 配置末尾的 variation 块）：
#   run.randomize_layout=true run.seed=3
# 默认关 = 确定性布局。demo 建场景后打印 `cloth_unroll variant seed=…` 与 `cloth_unroll checks …` 两行。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进日志的变体标识（角点 sweep 用 corner_<id>）。
variant_id: default
