schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/robotangle-buzz-wire-3d-easier-i00-privileged"
description = "RoboTangle buzz_wire_3d (Franka Panda + Robotiq 2F-85, Genesis): produce one replayable trajectory. Guide the metal loop along the entire wire from start to finish without touching the wire, then release the tool on the finish support. Frozen scene instance (variation easier, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "robotangle", "genesis", "panda_robotiq", "code-as-policy", "trajectory", "buzz_wire_3d"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "19"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "robotangle"             # RoboTangle on Genesis 1.2.1 (CPU float64 physics, Nyx RGB)
robot = "franka-robotiq-2f85"
family = "buzz_wire_3d"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "full"
difficulty = "easier"               # the variation's tier (docs/TAXONOMY.md)
grasp = "assisted (the contact_weld_v1 grasp regions on wand)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision terminal_v4_traversal_then_deck_release)"
instance_seed = 0                 # scene = environment/instance.json (variation easier, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
