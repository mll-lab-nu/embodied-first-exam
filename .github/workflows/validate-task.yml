name: validate-task
# Manual runtime validation on a self-hosted GPU runner: oracle scores 1 on every task whose task.toml says
# oracle = "full", and the nop agent scores 0 on every task. Tasks with a partial or no oracle are human-reviewed
# (docs/PROTOCOL.md §1.6) and only get the nop check.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "space-separated task names from the active v15 catalog (default: all)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, docker]
    env:
      TASKS: ${{ inputs.tasks }}
      HARBOR_VERSION: "0.23.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install "harbor==$HARBOR_VERSION"
      - name: Resolve task list
        run: |
          set -eu
          # A frozen v15 task tree/catalog and its images must be present on this runner.
          # No fallback to the historical root tasks/ when the candidate is absent.
          uv run --python 3.12 --with numpy --with scipy python scripts/topogym_versions.py list --inspect-docker $TASKS > /tmp/topogym-ci-tasks-${GITHUB_RUN_ID}.txt
          echo "TASK_LIST=$(paste -sd ' ' /tmp/topogym-ci-tasks-${GITHUB_RUN_ID}.txt)" >> "$GITHUB_ENV"
          echo "JOBS=jobs/validate-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: oracle == 1 (tasks with oracle = "full")
        run: |
          set -eu
          for t in $TASK_LIST; do
            n=$(basename "$t")
            grep -Eq '^oracle *= *"full"' "${t%/}/task.toml" || { echo "skip $n (oracle is not full)"; continue; }
            harbor run -p "$t" -a oracle -o "$JOBS" --job-name "oracle-$n"
            python3 scripts/check_topogym_trial.py "$JOBS/oracle-$n" --expected 1
            grep -qx 1 "$JOBS/oracle-$n"/*/verifier/reward.txt || { echo "oracle failed on $t"; exit 1; }
          done
      - name: nop == 0
        run: |
          set -eu
          for t in $TASK_LIST; do
            n=$(basename "$t")
            harbor run -p "$t" -a nop -o "$JOBS" --job-name "nop-$n"
            python3 scripts/check_topogym_trial.py "$JOBS/nop-$n" --expected 0
            grep -qx 0 "$JOBS/nop-$n"/*/verifier/reward.txt || { echo "nop passed on $t"; exit 1; }
          done
