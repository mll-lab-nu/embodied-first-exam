# The easy set (docs/PROTOCOL.md §4, docs/RUNNING.md "Results"): task bases KEPT in the repository and run like any
# other task, but reported apart from the main table and left OUT of the headline statistics.
#
# One entry per task base (the task name without its mode suffix); it covers every mode the base ships. Fields:
#   base       e.g. "behavior-chop-an-onion-i00"
#   benchmark  the base's label (scripts/task_conventions.py BENCHMARKS)
#   reason     "shortcut": a success came through a goal looser than the task's text, or a grader shortcut (`note`: the
#              observed pattern); "owner": the benchmark owner judges the task too easy or not discriminative;
#              "solved": the screening runs solved it in every mode it ships (`note`: which runs; their core-set numbers
#              are then filtered against them, so report those runs on all tasks alongside)
#   note       optional
# Append entries in the benchmark's block (one PR per benchmark touches only its own lines).
# Read by scripts/task_conventions.py (`set_of`: "easy" / "core", recorded with each result as `set`, never part of
# `config_key`) and checked by `python3 scripts/task_conventions.py easy-set --check` (ci_checks/run_all.sh). Marking a
# task here changes none of its files: its DIGEST and the results recorded against it stay valid. A task leaves the
# set by deleting its entry (e.g. after a grader fix and a re-grade).
#
# 2026-10-16: the first 84 bases (BEHAVIOR-1K 16, ManiGuard 8, RoboARC 31, RoboLab 19, RoboPaint 8, RoboWits 2), the
# benchmark owner's (Qineng Wang) selection after the GPT-6 Astra review (#265). Several shortcut patterns are closed
# by grader fixes (#243, #244, #248, #254), so some tasks may move back to the core set after a re-grade; RoboWits is
# small because its reference solver had a hack, and its affected tasks may be re-run once the solver is fixed.

