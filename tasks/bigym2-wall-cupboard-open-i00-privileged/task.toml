schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/bigym2-wall-cupboard-open-i00-privileged"
description = "BiGym 2.0 wall-cupboard-open (Unitree G1 with GR00T-WBC, MuJoCo 3.8.1) in privileged mode: produce one replayable trajectory. Open both doors of the wall cabinet. Frozen instance: upstream task wall_cupboard_open, seed 0."
authors = [{ name = "pingyue" }]
keywords = ["robotics", "bigym2", "mujoco", "unitree-g1", "humanoid", "loco-manipulation", "trajectory", "wall-cupboard-open"]

[metadata]
author_name = "pingyue"
task_type = "trajectory"
simulator = "bigym2"               # BiGym 2.0 (bigym 1.0.0 at 93ad4b3): MuJoCo 3.8.1 + NVIDIA GR00T-WBC, CPU physics
robot = "unitree-g1-dex1"
family = "wall-cupboard-open"
mode = "privileged"
# scene = environment/instance.json (upstream's task reset with this seed + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 2.0
oracle = "none"
oracle_evidence = "no reference solution (BiGym 2.0 ships no expert or planner; its demonstrations and its agents' programs stay off the agent's network); positive example graded 1 by the separate verifier: bigym2-wall-cupboard-open-i00-pr__mcuR6nu (run codex-gpt6_luna-medium, 2026-10-08, on an earlier text of the privileged task; regraded by its current verifier); human review in PR #123"

[verifier]
timeout_sec = 1800.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in two fresh processes, with no network.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[agent]
timeout_sec = 3600.0
# The model APIs and nothing else (scripts/set_agent_egress.py HOSTS): BiGym 2.0's demonstrations and its coding agents'
# programs and rollouts are public (Hugging Face SWIRL-Lab/bigym-g1-native60 and bigym2-agent-rollouts).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
