schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]
[task]
name = "embodied-first-exam/embodied-olympics-match-soccer-jointgpu-i01-privileged"
description = "PRIVILEGED (Embodied Olympics / Embodied Agent Olympics): humanoid robot soccer 2 v 2 at the JOINT LEVEL (12 leg joint targets per Booster T1 every 20 ms, no walking policy, no kick skill), coach format, against the learned joint-level team (level 5), CPU + GPU resource tier, one match against the learned joint-level team (level 5) on the frozen instance of embodied-olympics-match-soccer-jointgpu-i01-realtime (seed 101, S = 10). Full simulator in development (read and change any state, reset the whole match); the deliverable is a closed-loop Python program that plays a fresh unmodified match in the verifier, on the original S = 10 clock, seeing the full state instead of camera images."
keywords = ["robotics", "mujoco", "fullsim", "policy", "soccer"]
[metadata]
task_type = "policy"
simulator = "mujoco"
robot = "booster-t1"
family = "soccer_jointmatch"
dynamics = "dynamic"
verifier_wall_clock = true
instance_seed = 101
opponent_level = 5
resource_tier = "gpu"
tier_twin = "embodied-olympics-match-soccer-jointcpu-i01-privileged"
source_commits = ["7ae66874c32e"]
source_task = "roboolympics/soccer-match-wallclock-program-lowlevel-standard"
exporter = "Embodied Olympics full-simulator exporter"
official = false
expert_time_estimate_hours = 1.0
oracle = "partial"
oracle_evidence = "full-state reference program (solution/): the twin's joint-level oracle controller (joint_oracle.py with its team, walker and DCM modules) fed the true state; oracle runs were waived for the Embodied Olympics - Match twins: untested"
validated = false

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [101, 1, 2]

[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 10240
[verifier]
timeout_sec = 13800.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 12288

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
