schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/think_usage.json", service = "sim" },
  { source = "/data/think_calls.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/tennis-match-wallclock-program-standard"
description = "PROGRAM PLAY, parameterized: the opponent level (RCB_LEVEL 1-4), slowdown (RCB_SLOWDOWN) and instance seed (RCB_SEED) are chosen at run time; the verifier reports them and whether they form an official configuration. The agent may write an autonomous player program that observes the cameras and acts without a new model response per shot, and may watch, stop, fix and restart it at any time (also mid-point) and during the frozen review after every point. One act (or move) in flight at a time. INTERACTIVE MODE, WALL-CLOCK REAL TIME in a slowed world: robot tennis, a singles match (first to 5 points, from 4:4 by 2, at most 7; the opponent serves every point; the same rules as the duel) against a scripted opponent on a regulation MuJoCo court (Franka Panda on an x-y rail base holding a tennis racket; ITF ball with drag, Magnus lift, hard-court bounce and racket impact laws). Observation: 2 cameras x 4 frames, no ball coordinates. Success: win a valid match, with deterministic replay and no simulator, model-API or metering failure."
authors = [{ name = "Chi Gui" }]
keywords = ["program-play", "robotics", "mujoco", "franka-panda", "tennis", "interactive", "real-time", "wall-clock", "vision", "spatial-reasoning", "match", "racket-level"]

[metadata]
author_name = "Chi Gui"
task_type = "trajectory"          # the deliverable is the recorded match itself
simulator = "mujoco"
robot = "franka-panda"
family = "tennis_match"
mode = "standard"
protocol = "eai-standard-realtime/1.0"           # real-time extension of standard mode
oracle = "full"
oracle_evidence = "solution/: a scripted camera-only player; checked valid at L1-L4 and x1-x20"
revision = "wallclock-6-program-v2-param"
parameters = "RCB_LEVEL (1-4, default 1), RCB_SLOWDOWN (default 20), RCB_SEED (default 101)"
timing_policy = "report_only"     # no lateness cutoff; all lag / planning telemetry is kept
expert_time_estimate_hours = 0.75

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "test -s /data/server.pid || exit 1; kill -USR1 $(cat /data/server.pid) || exit 1; for i in $(seq 1 600); do if grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null; then head -c 2000 /data/final.json; exit 0; fi; sleep 1; done; echo \"grading evidence did not finalize\" >&2; exit 1"
timeout_sec = 700

[agent]
timeout_sec = 7200.0           # preparation, then the match at the slowest official configuration (x20)

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
