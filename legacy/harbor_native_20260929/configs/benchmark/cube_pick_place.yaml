name: cube-pick-place-seed0
fixture: cube_pick_place
instruction: >-
  Pick up the cube, hold it at least 5 cm above the table for 0.2 seconds,
  return it to its initial place, open the gripper, withdraw at least 5 cm
  and let it settle.
wall_clock_s: 1800
simulator:
  task_id: cube_pick_place
  robot_id: panda_robotiq
  variation_id: base
  seed: 0
