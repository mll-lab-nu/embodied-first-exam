[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topogym"
version = "0.1.0"
description = "Genesis simulator modules with restorable episode state"
requires-python = ">=3.11"
dependencies = [
  "genesis-world==1.2.1",
  "numpy",
  "scipy",
  "trimesh",
  "python-fcl==0.7.0.11",
  "shapely",
  "mapbox-earcut",
  "manifold3d",
  "hydra-core>=1.3,<1.4",
  "Pillow",
]

[project.optional-dependencies]
test = ["pytest>=8", "psutil"]
video = ["imageio", "imageio-ffmpeg"]
fem = ["pyuipc==0.0.25", "tetgen==0.8.2"]
dataset = ["h5py"]
orbits-oracle = ["mujoco>=3.14,<4", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["topogym*"]
exclude = ["topogym.agents.deferred*", "topogym.redundants*", "topogym.tasks.legacy*", "topogym.planning.calibration_tools*"]
namespaces = true

[tool.setuptools.package-data]
"topogym.config" = ["profiles/*.yaml", "profiles/*/*.yaml"]
"topogym.assets" = ["resources/catalog.json", "resources/templates/*", "resources/meshes/*", "resources/textures/*", "resources/variations/**/*"]
"topogym.planning.interlocked_claws" = ["easier_reference_route.json", "reference_routes.json"]
"topogym.planning.rope_threading" = ["hard_plans.json", "wang_source.json", "reference_relays/*.json", "reference_relays/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not genesis and not hdf5'"
markers = [
  "genesis: requires real Genesis physics; explicit selection required",
  "rigid: rigid-body or robot physics",
  "pbd: deformable PBD physics",
  "fem: volumetric finite element physics",
  "ipc: native CUDA IPC coupling and historical state recovery",
  "render: requires real rendering",
  "hdf5: requires optional h5py",
]
