# Cloth Unpleat（docx 1.2「展开单个褶皱」）在 TopoGym tabletop V1 任务坐标系下的布局。
# 几何约定：单位米；task z=0 是桌面；pos 是中心点；size 是完整长宽高。
#
# 与 cloth_fold（docx 1.1）的关系：**材料、抓取方式、桌面摩擦三块的取值直接沿用
# 1.1 的标定结果**，推导过程写在 `configs/task_configs/cloth_fold_topogym_tabletop_v1.yaml`，
# 本文件只写与 1.2 有关的部分，不重复那边的论证。两个任务的布是各自独立的实体，
# 所以取值复制而不是共享；哪天两者需要分开调，改一边不会牵动另一边。
#
# 场景：布带整体平铺，中部有一个竖起的褶皱（局部三层重叠），其余部分平整。
# 动作：夹爪捏住布带自由端，贴桌面拉，把收在褶皱里的材料铺开。
# 状态变化：高度峰值从褶皱高度降至布厚、层数 3 → 1、铺展长度相应增加。
#
# 变体（2026-09-05 部署，2026-09-09 扩到最多两道褶，2026-09-10 去掉折痕斜置）：文件末尾的
# variation 块按 seed 抽褶的排布、两道褶各自的宽度与顶缘、整带镜像、行程倍数，以及一串
# 归一化分数（两褶间距、两个端平段、横纵位置、捏取点内缩量）由 `cloth_unpleat.derive_task_cfg`
# 按当前褶几何映射到可行区间；**布带长度是算出来的，不是抽的**。
# 七行可行性判据在 `_cloth_unpleat_geometry.py`，建场景 / 随机化 / 离线门 / 角点门共用。

task:
  id: cloth_unpleat
  difficulty: smoke

coordinate_frame: task

board:
  name: cloth_unpleat_board
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# ---------------------------------------------------------------------- 布带
cloth:
  name: unpleat_band
  # 材料全长（沿 x 展开后的长度）与带宽（沿 y）。
  # 布带而不是方布：docx 1.2 的状态变化里「铺展长度」是一个一维的量，
  # 材料守恒要读得出来，布就得有一个明确的长度方向。
  #
  # 0.260 是按可达性反推的。布带沿 y 摆（见下面的 material_axis）：褶皱收着的时候
  # 跨 y[-0.099, +0.099]，展开之后跨 y[-0.099, +0.161]，带宽沿 x 占 x[-0.020, +0.100]。
  # 作业区是 x[-0.23, +0.31]、y[-0.30, +0.30]（basic_env_demo 的 workspace），
  # 四个边界都在里面，而且沿 y 摆比沿 x 摆余量更大。
  # 2026-09-09 起 material_length **不再是自由常数，而是派生量**：
  #     material_length = lead + 褶宽 + gap + 褶宽 + tail  +  逐褶存料之和
  #                       \______________ 俯视跨度 ______________/
  # 三个平段是抽出来的（见下面的 lead / tail 与 pleat.gap），褶的尺寸也是，
  # 所以布带该多长跟着褶子走；当前采样再保留 130 mm 锚端支撑，全长不超过 40 cm。
  # 这里的 0.260 是固定布局（count 1、褶 24×22、lead/tail 见下）算出来的那个值，
  # ClothUnpleatLayout.validate() 断言它与算出来的一致，差超过 1e-6 就拒。
  material_length: 0.260
  # 09-10：为累计补拉留空间；单褶、双褶的采样都保留至少 130 mm 锚端引入段。
  material_length_max: 0.400
  # 带宽。single / parallel 时它就是这个常数；**cross 时是派生量**——宽度方向也折了
  # 一道，布得更宽才装得下：width = across_lead + 褶宽 + across_tail + 那道褶的存料。
  # 实测最窄的 cross 要约 18 cm、最宽约 23 cm（12 cm 只够 8 mm 宽的褶，看不出形状）。
  width: 0.120
  # 平段：带头到第一道下折痕、最后一道落点到带尾。**它们决定褶在带上的位置**
  # （原来褶钉死在带正中：lead = tail + 褶宽 是构造出来的，不是抽的）。
  # lead 要托住第一道褶的三层区并提供桌面摩擦支撑，抓住 tail 后连续展开两道褶。
  # 采样 lead ≥ max(褶宽 + 4 × 网格间距, 130 mm)；
  # tail 是光的、总是被抓，所以 tail ≥ max(4 × 网格间距, 0.044)。
  # 上限由 band_length_ceiling 给：整条铺平之后两端都要够得着、且不出工作区。
  lead: 0.09932042183901212
  tail: 0.07532042183901211
  # 两个平段在各自区间里的归一化位置，[0, 1]。固定布局跑时上面的值直接用。
  lead_frac: 0.5
  tail_frac: 0.5
  # 布带俯视中心（任务坐标）。原来是 center: [x, y] 一个列表，2026-09-05 拆成两个标量键：
  # 随机化器只写标量叶子。center_x 是横向（宽度方向）位置，center_y 是纵向（材料方向）位置，
  # **两个都由各自的 frac 派生**：可行区间随褶宽、内缩量、行程一起变（每个拉动终点都要
  # 落在可达盘与工作区内），独立抽会撞可达门（见 variation 块）。
  # 2026-09-09 起 center_x 也是派生的。原因是可达：布带铺平之后有多长要看褶子收了多少料，
  # 而可达盘的弦长随布带离底座那条线越远越短。最宽的两道褶要求 center_x ≤ 0.0677，
  # 独立抽到 0.070 那一格会被 hand_reach 拒（只差 2.3 mm，但拒绝就是拒绝）。
  center_x: 0.040
  center_y: 0.000
  # 两个方向的归一化位置，[0, 1]。center_x_frac 0.5 在基准褶几何下还原 0.040；
  # center_y_frac 0.5 还原 0.000（0 = 尽量靠 −y、1 = 尽量靠 +y）。
  center_x_frac: 0.5
  center_y_frac: 0.5
  # center_x 的包络两端（横向位置）。布带 x 跨 [center_x − 0.06, center_x + 0.06]，
  # 离工作区边 ≥ 0.12。派生只会把上端往回收，收不到下端。
  center_across_min: 0.010
  center_across_max: 0.070
  # **整条布带的镜像**：+1 = 出厂朝向，−1 = 剖面与位置一起对材料轴取反，
  # 原来在 +y 端的尾段落到 −y 端，每一次拉都反向。底座在 y = 0、工作区关于 y = 0
  # 对称，两侧的判据读数逐行相同——它是布局多样性，不是任务轴。
  #
  # 2026-09-09 改名（原 `pull_side`）：会上定「从左拉还是从右拉不作为任务轴」，
  # 所以轴表里不再有叫「拉哪边」的东西；该拉哪一端由褶的折向算出来（见 pleat 块）。
  # 留着这条 ±1 是因为删掉之后一道褶的格会全部朝 +y 拉，数据里多一个可利用的规律。
  #
  # 注意它**不是**「把某一道褶单独翻个向」：刀褶不对称（上折臂 hypot(w,h)、
  # 下折臂 hypot(2w,h)），在布带自己的坐标里翻单道褶是另一种形状——三层区从 w 宽
  # 变 2w、俯视推进量从 +w 变 −w——本任务不用那种形状。
  band_flip: 1
  # 布带的长度方向落在哪个世界轴上。**转的是布，不是纹理**：条纹由网格的 UV 绑在
  # 材料上，布转过去条纹跟着转，条纹与折痕的相对关系不变。
  #
  # y：折痕沿 x 走。front 相机在 (0.42, 0, 1.30) 朝 −x 看，等于**顺着折痕看过去**，
  #    画面上是褶皱的横截面轮廓，高度与三层直接读得出来。
  # x：折痕沿 y 走，front 正对褶皱的侧面，深度只能靠明暗推断。
  #
  # 判据里量铺展长度与 band_shift 用的也是这个轴，所以 layout 与 evaluator
  # 各读一次同一个键，而不是各自假设。
  material_axis: y
  # 铺放高度 = 一个粒子半径，布搁在桌面上的平衡高度（1.1 实测）。
  z: 0.002

  # ------------------------------------------------------------------ 褶皱
  # 褶皱是「没有压平的刀褶」：布带沿 +x 走到下折痕，向 −x 折回并抬起到顶缘，
  # 再越过下折痕落回桌面继续走。俯视图上下折痕与顶缘之间是三层
  # （底下的平铺段 + 两条折臂），两侧各是一层。
  #
  #                        顶缘（夹爪捏这里）
  #                         /\
  #              折臂1     /  \    折臂2
  #                       /    \
  #         -------------+      +----------------
  #            平铺段   下折痕            平铺段
  #
  # **收在褶皱里的材料量不是自由参数**：它 = 材料全长 − 俯视跨度 = 上折臂 + 下折臂 − width，
  # 由 width 与 crest_height 两个量算出来。当前取值下是 0.0614 m（占材料全长 24%），
  # 也就是展开后布带要长这么多。
  #
  # 2026-08-22 分两步从 50×30 减到 24×22：原来 43% 的材料收在褶皱里，布带看得见的
  # 部分只有 147 mm 而材料有 260 mm，褶皱压过了整条布带。**代价是明确的**：铺展比
  # 量的就是「收了多少料」，收得少读数变化就小，正确与压塌之间的间距从 0.30 压到
  # 0.15。再往下压塌那一侧离门槛只剩 0.09，而且动作短到 16 步、视频上看不清，
  # 所以这一档是下限附近。三条判据的实测读数见 success 块。
  pleat:
    # 褶的排布（2026-09-10 定为三种，会上「褶数不超过 2，重点放在排列与构型上」）：
    #   single    一道褶，一次拉
    #   parallel  两道褶，折痕都横穿带宽、彼此平行；尾端一次夹持连续展开
    #   cross     一道横穿带宽、一道沿布带长度方向：把布沿水平折一下、再沿竖直折一下，
    #             两条三层带成直角相交，交点处 3 × 3 = 9 层；布带的**宽度也变成派生量**
    # **不再有折痕斜置**：09-08 那套「逐条错开」的斜折痕不是一张布沿斜线折过去的形状，
    # 实测沿 y 拉 34° 时布带在折痕处折成一个角、俯视宽出 43 mm，沿折痕法向拉反而 63 mm。
    layout: single
    # 两道平行褶之间的平段（第一道的落点到第二道的下折痕）。下限两条：网格扛不住
    # 零长度的段，所以至少一个粒径；平行 = 两条三层带并排、不叠，第二道的三层区从
    # 它的下折痕往回数 褶宽B，所以 gap ≥ 褶宽B − 褶宽A 才不会压到第一道上。
    # 上限由布带长度的预算给。
    gap: 0.004
    # gap 在区间里的归一化位置，[0, 1]；0 = 两道褶挨得最近。
    gap_frac: 0.0

    # --- 第一道褶（count 1 时就是唯一那道）---
    a:
      # 褶皱的俯视宽度（下折痕到顶缘的水平距离）。**它是收料量的主旋钮**：
      # 存料 ≈ 2 × width（下折臂横跨 2×width，上折臂横跨 width）。它同时定了：
      #   三层区占俯视跨度的比例 = width / 跨度 = 0.024 / 0.1986 = 0.121。
      #     `tests/check_cloth_unpleat_geometry.py` 在合成布上量到的初始单层率 0.846、
      #     压塌 0.760、展开 1.000 —— 单层率判据的三个读数就是这些；
      #   顶缘绕下折痕转的半径 = sqrt(width² + crest_height²) = 0.0326。
      # 试过 0.060：尾段只剩 0.024 m，重采样后段内间距掉到 4.6 mm，与其余段的 7.5 mm
      # 差太多，网格不再接近均匀。
      width: 0.024
      # 顶缘高度。三处约束：
      #   与布厚分得开：0.022 是布厚（两倍粒径 = 0.008）的 2.75 倍；连桌面高度一起算，
      #     褶皱立着峰值 0.024、压塌 0.010 —— 高度判据的两端；
      #   抓取：夹爪要能只捏到顶缘而不碰到正下方的平铺段，所以它必须明显大于
      #     grasp.attach_z_band（那一项还会按顶缘实测高度自动收窄，见下）；
      #   **历史**：这一项当初还兼顾「抗下沉」（折臂越陡越不容易被自重压下去）。
      #     2026-08-23 之后这个考虑作废了：褶皱必然躺平，与陡度无关，因为
      #     Genesis 忽略 bending_compliance，没有任何东西提供折痕刚度。
      #     现在它只影响建模时三层之间的初始间距，以及 t=0 那一帧的画面。
      crest_height: 0.022

    # --- 第二道平行褶（cross 使用独立的 cross.first/second 二维几何）---
    # 两个尺寸都是**独立于第一道**抽的（会上：「两道褶的位置和对应长度尽量自由随机化」），
    # 走归一化分数，窗口两端写在下面的 *_min / *_max 上。
    b:
      width: 0.030
      crest_height: 0.022
      width_frac: 0.5
      crest_frac: 0.5
      # 两个尺寸的包络两端。**必须与 variation 块里第一道褶那两条轴的取值域一致**，
      # 离线门断言这一点（同 workspace / reach 那两处字面量副本的做法：角点门裸加载
      # 本文件，读不到 variation 块以外的东西）。
      width_min: 0.024
      # 09-10：从 44 收到 30 mm。两道仍各自独立采样；减浅后把行程预算留给
      # 同次抓取内的局部残褶补拉（存料上限 77.2 mm × 1.5 < 120 mm）。
      width_max: 0.030
      crest_min: 0.016
      crest_max: 0.028

  # ------------------------------------------------------------------ 十字折
  # `pleat.layout: cross` 时读这一块，`pleat` 那一块整块不读（反过来也一样）。
  #
  # 画面：一张平铺的方布，先沿一条横穿它的线折一下（第一折，沿 material_axis），
  # 再沿一条纵贯它的线折一下（第二折，沿另一条轴）。第二折把第一折那一叠**整个**
  # 翻过去，中间那块的层序因此被翻转；两条三层带成直角相交，交点处 3 × 3 = 9 层。
  # 这不是两个高度场相加，几何在 `_cloth_cross_geometry.py`，层序断言在
  # `tests/check_cloth_cross_geometry.py`。
  #
  # 一道折由四个数描述：lead（布边到第一条折痕的光布）、depth（折回去多深）、
  # tail（第二条折痕到另一边布边的光布）、radius（折痕的圆角半径）。
  #     材料弧长 = lead + depth + tail + 2π·radius
  #     俯视跨度 = lead − depth + tail
  #     收在折里的料 = 2 × depth + 2π·radius
  # 所以 `cloth.material_length`（第一折那条轴）与 `cloth.width`（第二折那条轴）
  # **两个都是派生量**，由 derive_cross_cfg 写回。
  cross:
    # 第二折的镜像（±1）。第一折的镜像沿用 `cloth.band_flip`，两个合起来四种朝向。
    flip: -1
    # 抓取方式。两种走法：
    #   edges   先抓第二折的自由边、沿宽度方向拉出去，松手重新观测，
    #           再抓第一折的自由边、沿长度方向拉。
    #   corner  一次抓住自由角，沿对角路径连着把两道折的料都拉出来，
    #           再对还差的那条轴补一次（配 repair_corners: true）。
    # **取 corner，2026-09-11 按 A/B 定的**
    # （runs/cloth_unpleat_variation/20260911_cross_grasp_ab/）。同一个 seed、
    # 同一组折参、同一块布，只换抓法，读数是 单层率 / 长度回收 / 宽度回收 / 最大层数：
    #   seed 0   corner  1.000 / 0.999 / 1.002 / 1 层  全门通过
    #            edges   0.778 / 0.773 / 0.448 / 3 层  三门全挂
    #   seed 3   corner  1.000 / 1.000 / 0.996 / 1 层  全门通过
    #            edges   0.767 / 0.797 / 0.556 / 3 层  三门全挂
    # 加上 09-11 混合 sweep 里 edges 的另外两格（seed 5、8）也挂：edges 0/6，corner 2/2。
    #
    # **edges 为什么不行**（按每条腿自己拉的那条轴，量「手走一毫米换来多少跨度」）：
    # 布带 95–109%，十字第一次拉 46–53%，十字第二次拉只剩 4–15%，两条腿都停在
    # stop=cap（补拉行程用完而跨度还差），而同时 room_mm 说工作区还剩 119–294 mm——
    # 卡的不是可达。机理是第一次横着拉时把第二折摊平压在了第一折上面，第二次拉就只能
    # 把没被压住的部分拖过去，交叉那一块（3 × 3 = 9 层）的料出不来。布带遇不到这件事：
    # 它只有 12 cm 宽，一个 36 mm 的附着盘拉得动整条端头，而十字的自由边有 15–25 cm 宽。
    #
    # 两种抓法的离线代价相同，所以换默认值不会带出红：首抽拒绝率都是 0.000，
    # 4,096 个十字角点都是拒 0、五行全过（corner 抓点离布中心更远，但摆位两个方向
    # 都是派生的，窗口自己跟着收）。
    grasp: corner
    corner_path: diagonal
    # 手腕朝向。两次拉在互相垂直的轴上，绑在「拉的方向」上的偏航角要在两段之间翻一次；
    # 已验收的那次用的是让手臂自己选姿态，照它。derive_cross_cfg 写回 grasp.finger_axis。
    finger_axis: arm_default
    # 补角：第一个自由角管不住两条宽边的远端，所以走完对角之后重新观测每条边的
    # 材料角点，只补还没付清的那一维；两维都够了就先静置再复查，够了就跳过
    # （日志里的 repair_skipped reason=already_flat）。A/B 那两格各补了一次。
    repair_corners: true
    repair_settle_steps: 300
    # 第二条折痕的圆角半径，以粒径为单位。1.5 是两条净空判据取等号给出的下限：
    # 第二折卷的是第一折已经叠好的一叠（三层、厚 2 个粒径），内层走小圆、外层走大圆，
    # 要让转过去之后各层仍隔 ≥ 1 个粒径，r₂ ≥ 1.5 × 粒径。
    #
    # **取 3.0。** 历史：09-12 旧映射让这一叠每层都按同一弧长转过圆角，外层被拉 1.667 倍，
    # 放大圆角是为了摊薄这个失真。09-13 换成 `_layered_rounded_pleat`（各层各走各的圆弧），
    # 第二折方向的拉伸从 1.64 降到 1.004，那个理由消失了——但退回 1.5 实测没过：
    #   新映射、diagonal，静置漂移 mm（门 2.00）与完整 unfold（runs/.../20260913_natural_ab、path_ab）
    #     seed    r₂=1.5                      r₂=3.0
    #     0       0.90  过 1.000/0.999/1.001   1.58  过 1.000/1.000/1.000
    #     3       0.73  过 1.000/1.000/1.000   0.42  过 1.000/1.000/1.000
    #     5       2.33  出生守卫中止            0.46  过 1.000/1.000/1.000
    #     8       0.25  过 1.000/0.998/1.000   0.22  过 1.000/1.000/0.999
    # seed 5（第二折最浅 17 mm、布最小）在 1.5 下三轮里读到 2.21–2.47，再加这次 2.33，
    # 是稳定超门，不是抖动；3.0 下它是 0.46。所以圆角留 3.0——不再是为了摊薄失真，
    # 是紧圆角配浅折时静置本身就不稳。代价照旧：弧长多含 2πr₂，布宽 +9 mm，sheet_max 0.245。
    second_radius_particles: 3.0
    # 布的尺寸上限（两条轴各自的材料弧长）。两条理由各一半：
    #   粒子数 —— 0.25 × 0.25 除以 1 mm 的粒径是 62,500 个粒子，比已跑通的
    #             55,443 多 13%；再大每格的 GPU 时间就不好收了；
    #   工作区 —— 出生时四角要离工作区边 ≥ 40 mm。
    # 0.245，2026-09-12 从 0.250 收的。第三条理由是可达：圆角放大到 3 个粒径之后，
    # 一道折收的料多了（存料 = 2 × 折深 + 2πr₂），拉的行程跟着变长，最宽那一族角点
    # （两折都最深、两个 lead 最短、两个 tail 最长）的横向摆位窗口从 +3.4 mm 合到 −1.3 mm。
    # 0.245 让 4,096 个十字角点全部可行，最窄的窗口还剩 +4.4 mm；粒子数 60,025。
    sheet_max: 0.245
    # 布的尺寸下限（2026-09-13）。会上的要求是十字这块布不能比单褶的布带小。
    # 布带是 12 cm × 26–40 cm，面积 313–480 cm²；十字没有下限时最小 240 cm²，
    # 38% 的抽样比布带中位数（450）还小，看起来就是一小块。1000 seed 实测：
    #   sheet_min   十字面积 cm²      比布带中位小   比布带最小小
    #   0（无）     240–598            38%           3%
    #   0.20        410–598             6%           0%
    #   0.22        490–598             0%           0%   ← 每一块都比最大的布带大
    # 取 0.22：每块十字的面积都超过任何一条布带。代价是布的大小只在 22–24.5 cm
    # 之间变，比 0.20 那档窄 2 cm。拒绝率仍是 0.000。
    # **最长边仍然是 22–24.5 cm，短于布带的 26–40 cm**，这一条改不了：十字要在两条轴上
    # 各拉一次，横向那次朝着离底座远的方向走，可达盘在那一侧只剩 4.4 mm 的余量
    # （见 sheet_max 的注释）；布带只沿一条轴拉，而且是沿底座对称线拉，不吃这个约束。
    sheet_min: 0.22
    # 十字自己的求解器档位。**这不是可调的旋钮，是实测出来的下限**
    # （runs/cloth_unpleat_variation/20260910_cross/，静置 600 步看褶散没散）：
    #   粒径/子步    粒子数    铺展比 0→600 步    交叉处层数 @600
    #   4 mm / 4     14,761    0.774 → 0.801      4
    #   4 mm / 16    14,761    0.774 → 0.874      6
    #   1 mm / 4     55,443    0.784 → 0.807      3
    #   1 mm / 16    55,443    0.784 → 0.790      9   ← 只有这一档保住九层
    # 原因是折痕做了圆角（0.5 / 1.5 mm），4 mm 的粒子比圆角还粗，圆角表示不出来，
    # 叠层就互相穿过去、自己弹开。单／双平行褶那一档（4 mm / 4）不能跟着改：
    # 所有判据门槛都是在那组参数下标定的，而且 16 子步让每格慢四倍。
    # `cloth_unpleat.apply_layout_solver` 在建场景之前按抽到的构型切档。
    solver:
      substeps: 16
      particle_size: 0.001
      mesh_spacing: 0.002
    # --- 第一折：沿 material_axis（布的长度方向）---
    # 三个长度是派生量，走归一化分数；这里的值是固定布局跑时直接用的那一组
    # （= configs/cloth_unpleat_cross.yaml 里已通过 GPU 验收的那组）。
    # radius 也是派生量：离线门 first_layer_clearance 要 2·r₁ ≥ 粒径、
    # cross_stack_clearance 要 2·r₂ − 4·r₁ ≥ 粒径，两条取等号就是
    # r₁ = 粒径/2、r₂ = 1.5 × 粒径。
    first:
      lead: 0.130
      depth: 0.024
      tail: 0.080
      radius: 0.0005
      # depth 的窗口是 [0.016, 0.030]（写在 _cloth_cross_geometry.DEPTH_MIN/MAX）：
      # 下限 16 mm 是出生检查 cross_overlap 要的——它允许九块材料贴片散开
      # 到较浅那道折的一半深度，8 mm 的余量；上限 30 mm 与平行褶最宽那档一致。
      depth_frac: 0.5
      # lead / tail 共用一份「布还能多长」的预算（sheet_max 减去 depth 与圆角周长），
      # lead 先抽、tail 抽剩下的，顺序与布带的两个端平段一样。
      # 两者的下限都是 depth + radius + 附着盘半径 + 捏取内缩下限：
      # 折痕两侧要有光布（rounded_pleat 的要求），而且附着盘要整个落在光布上。
      lead_frac: 0.5
      tail_frac: 0.5
    # --- 第二折：沿另一条轴（布的宽度方向）---
    second:
      lead: 0.130
      depth: 0.020
      tail: 0.070
      radius: 0.0015
      depth_frac: 0.5
      lead_frac: 0.5
      tail_frac: 0.5

  # 控制网格。剖面按弧长重采样后沿 y 扫掠，生成器在
  # `topogym/tasks_legacy/deformation/cloth_profile_mesh.py`。
  #
  # **网格间距沿用 1.1 的 7.5 mm**：1.1 实测唯一保序的是「7.5 mm 间距 +
  # particle_size 0.004」，且那份配置写明「「间距等于 particle_size」不是充分条件，
  # 别再凭推理定这个组合」—— 所以这里是照抄那个已实测的间距，不是重新推导。
  #
  # **但顶点顺序对 1.2 不是必需的。** 三条判据（高度／单层率／铺展比）读的都是点云，
  # 不问哪个粒子是哪个；靠顶点顺序的只有拉伸诊断量与 band_shift 的精确形式，
  # 两者都有退路。1.1 不同，它的主判据是逐粒子到解析目标的距离，没有顺序就做不成。
  # 2026-08-22 实测：36×17 的控制网格出来 2344 个粒子，而一级细分应是 71×33 = 2343，
  # 多了一个（多半是段间边长不完全一致，某条边多劈了一次），网格算术因此用不了，
  # demo 会单独打一行 `stretch_tracking=off` 说明。
  #
  # 剖面重采样按段进行（每段取最接近目标间距的整数份），折痕因此一定落在顶点上。
  # 代价是段间间距略有差异：当前取值下沿材料方向 7.53~8.14 mm，横向恒为 7.50 mm。
  # 控制网格 35×17 = 595 个顶点。
  mesh:
    spacing: 0.0075
    output_dir: .cache/topogym/meshes/cloth_unpleat

  # ------------------------------------------------- 以下取值沿用 cloth_fold
  # 粒子尺度。同时是物理参数和判据参数（碰撞厚度 + 能不能分辨出层）。
  particle_size: 0.004
  # 材料：Genesis `PBD.Cloth` 的构造默认值整套。1.1 在 2026-08-21 把原来那组
  # （抄自绳子 prefab）换成官方默认值，原因是拉伸柔度差了 12000 倍、密度重 100 倍，
  # 读起来像橡皮泥。逐项对照表在 1.1 的配置里。
  rho: 4.0
  # 布↔布（粒子之间）的摩擦，不管桌面。三层叠着的时候靠它。
  #
  # **0.4 而不是官方默认的 0.15**，2026-08-23 实测定的：`bending_relaxation=0`
  # 之后跨度两档都稳（±0.1mm），但 0.15 那档三层重叠的格数从 12 一路掉到 4，
  # 三层散掉了；0.4 稳定保住 33 格。三层重叠是这个任务的结构特征，散了任务就没了。
  # 0.4 对织物↔织物也比 0.15 更接近实测量级（常见 0.3~0.6）。
  static_friction: 0.4
  kinetic_friction: 0.4
  stretch_compliance: 1.0e-07
  bending_compliance: 1.0e-05
  stretch_relaxation: 0.3
  # **0.0，这是本任务偏离 cloth_fold 最大的一处，理由是实测的。**
  #
  # Genesis 的 PBD 弯曲约束把**平面**当静止角，`bending_relaxation` 决定每个子步
  # 把折痕往平面推多用力。也就是说它一直在拆这个褶皱。2026-08-23 扫参实测
  # （200 步静置，看俯视跨度涨了多少 = 材料从褶皱里放出来多少）：
  #
  #   bending_relaxation   0.0    0.005   0.01   0.02   0.1(默认)  0.5     1.0
  #   跨度增长(mm)         +0.1   +2.9    +2.3   +3.3   +6.3       +49.0   +61.8
  #
  # 1.0 那一档跨度到 266.9mm，**超过材料全长 260mm**——布被拉长了，那是发散。
  # 0.0 是唯一一档从第 25 步起跨度、顶缘、单层率三个数全部不再变化的。
  #
  # 不这么做的后果不是「不够真实」，是**任务不成立**：起始状态会随 settle_steps
  # 漂移（不可复现），而且一个 episode 里光靠这条约束就会放出约 17mm 的材料，
  # 占机械臂本该拿回来的 61mm 的四分之一到三分之一，判据分不清哪部分是动作做的。
  #
  # 代价要说清：这等于这块布几乎没有弯曲约束作用，在弯曲上是一层纯膜。
  # 1.1 是一张平铺的方布，弯曲约束把它往平面推正好是对的；1.2 是一条靠折痕
  # 维持形状的带子，同一个约束就是在拆场景。
  #
  # 顺带记下同一轮扫参的另一个结论：**`bending_compliance` 是死参数**，
  # 1e-1 到 1e-8 跨七个数量级读数一位没变，而日志的 material 行证明值确实
  # 传到了材质构造函数。别再调它。
  bending_relaxation: 0.0
  air_resistance: 0.001
  color: [0.90, 0.91, 0.93]
  # 织物贴图。光栅化器只保留 diffuse 颜色与 diffuse 贴图，所以织纹只能画进贴图本身。
  #
  # **条纹必须与折痕垂直**，这是它存在的全部理由：折痕沿布带宽度方向走，所以条带
  # 要沿材料方向排（一条条纵向的带），折痕横过去把每一条都切断。展开时每条被切断
  # 的条纹重新接上，画面上一眼就能看出「收在褶皱里的材料被放出来了」。
  # 条纹若与折痕平行，褶皱只是把两条之间的材料藏起来，展开前后几乎看不出差别。
  #
  # 实现上是一对必须同时成立的约定：网格的 UV 把宽度放在 v 轴
  # （`cloth_profile_mesh.sweep_profile_mesh`），而贴图的条带沿 v 分带
  # （`world/textures.py` 的 `_base_colour`）。两者由 `texture_size_m` 绑在一起，
  # 只改一边条纹就会转回与折痕平行。
  texture:
    enabled: true
    # 2026-09-13 从 stripes 换成 grid：条纹只沿一个方向分带，顺着条纹走的那道折在画面上
    # 没有任何标记——十字有一道折正好是这样，oblique / front / topdown 三个机位都看不清
    # 「十字」。grid 在两个方向都画细线，任一方向的折痕都会把线切断、展开时再接上。
    # 线是发丝粗细（约布边长的 1/400），不是填满的格子——填满会变成棋盘，织纹就读不出来了。
    pattern: grid
    accent_color: [0.20, 0.33, 0.55]
    # 条带现在沿布带的**宽度**（0.120 m）分布，不是沿长度，所以间距要按宽度选：
    # 0.020 是 6 条。0.030 只有 4 条，被折痕切断的条数太少，读不出「切断—接上」。
    # grid 的线距。0.010 = 布带宽度方向 12 条、十字 22–24.5 cm 见方的布 22–24 条；
    # 原来 stripes 用 0.020（6 条），换 grid 时一并变细，让折痕切断的线更多、更好数。
    stripe_pitch: 0.010
    thread_pitch: 0.002
    pixels_per_thread: 8
    thread_shading: 0.45
    weft_tint: 0.94
    fibre_noise: 0.05
    cloud_noise: 0.08
    seed: 0
  # 布↔桌面的持续接触摩擦。Genesis 不提供：它的可形变体↔刚体摩擦按法向速度缩放、
  # 只在粒子正撞进表面时生效，躺在桌上的布几乎没有摩擦。实现是自己写的库仑模型
  # （`world/rope.py` 的 TabletopParticleFriction，只改速度不改位置）。
  #
  # **这一项在 1.2 比在 1.1 更要紧**：整个动作贴着桌面走，没有它，拉顶缘会把
  # 整条布带一起拖走，而「整片被拖走」与「褶皱被展开」在铺展长度上读数相同。
  tabletop_friction:
    enabled: true
    kinetic_mu: 0.4
    static_mu: 0.5
    # 粒子 z 低于「桌面 + 这个」才算接触。取值要夹在平铺高度（0.002）与
    # 第二层高度（0.006）之间，让底层受摩擦、被抬起的层不受。
    contact_band: 0.003
    max_load_factor: 3.0

# ------------------------------------------------------------------ 抓取护栏
grasp:
  # 吸附捕获容差：手到抓取点的距离超过它就拒绝吸附并如实失败。
  attach_tolerance: 0.008
  # 指垫停在抓取点上方多少。手指与布硬接触在 Genesis 1.1.0 上是 native segfault，
  # 这一项是「手指永远够不到布」的唯一保证，下限 = 2 倍 particle_size。
  # 相切：指垫半高 8.5mm、中心在 HAND_TO_PAD_Z=0.1029，垫尖低 8.5mm。原来的 0.008
  # 碰巧就是相切，但在耦合开着时相切会压穿布；机械臂退出耦合后（needs_coup=False，
  # 见 tasks/deformation/cloth_unpleat.py）这个值才是安全的。推导见 cloth_unroll 同项。
  # **0.016，2026-09-13 从 0.0085 改的，理由是实测的手指关节读数。** 8.5 mm 时夹爪根本合不拢：
  # 命令 0，60 步后手指关节只到 0.033，再停 60 步到 0.031（张开是 0.040）——手指的碰撞几何
  # 比「指垫尖」这个常数往下伸得更多，在 8.5 mm 处已经顶到桌面，只能贴着桌面慢慢蹭。
  # 同一格换指垫高度扫描（单褶 seed 1，读合拢后 / 停顿后的手指关节）：
  #   8.5 mm  0.0331 / 0.0309   attach_error 0.49 mm   单层率 1.000
  #   12 mm   0.0327 / 0.0290   attach_error 2.27      1.000
  #   16 mm   0.0001 / 0.0000   attach_error 4.14      1.000   ← 合到底
  #   20 mm   0.0001 / 0.0000   attach_error 4.10      1.000
  #   30 mm   0.0001 / 0.0000   attach_error 4.00      0.988
  # 门槛在 12–16 mm 之间；取 16。attach_error 从 0.5 涨到 4 mm 仍在容差 8 mm 内，判据读数不变。
  # 09-13 之前所有录像里夹爪都是张开着拉的，日志里的 close 阶段只是发了命令。
  touch_clearance: 0.016
  # 夹爪合拢到的半宽。**0 = 合到底，2026-09-13 从 0.004 改的。**
  # 原来的 0.004 是按「两指之间要放得下一个粒子」定的，但这个抓取不是物理夹持：指垫停在
  # 布上方 touch_clearance（8.5 mm）处合拢，粒子靠 fix_particles_to_link 绑到连杆带走，
  # 手指从不碰布。所以合到多宽只影响画面——4 mm 半宽在录像里是一把永远半开的夹爪，
  # 看起来像还没抓住就开始拉了（09-13 看十字正视录像时指出）。合到底没有物理代价。
  grasp_qpos: 0.0
  attach_radius: 0.018
  # 附着的高度窗口。**null = 只按俯视距离取粒子，与 1.1 相同。**
  #
  # 2026-08-23 抓取点从褶皱顶缘改为布带的自由端之后，这一项就不需要了：端头是
  # 躺在桌上的单层布，正下方没有别的层可以抓错。它当初存在的理由是顶缘正下方压着
  # 平铺段，而现在夹爪根本不碰顶缘。
  attach_z_band: null
  # 抓取点从布带边缘往里缩多少。附着盘半径 0.018，正压在边缘上会有一半悬空。
  # 0.012 = 3 倍粒径，让整个盘落在布上，同时仍然抓在「边缘」这个语义范围内。
  # 2026-09-05 起由 edge_inset_frac 派生：区间 [0.008, min(0.018, 半跨度 − 褶宽 − 2 × attach_radius)]，
  # 上限随褶几何变（褶宽 0.035 + 顶缘 0.028 时只剩 0.0164）。固定布局跑时这里的值直接用。
  edge_inset: 0.012
  # 归一化 [0, 1]，0.4 在基准褶几何下还原 0.012。
  edge_inset_frac: 0.4
  # 手腕朝向。**这是个待实测的旋钮，不是推导出来的。**
  #   across      工具朝着拉的方向，手指横跨布带（人捏布边就是这个姿势）
  #   along       比 across 转 90°
  #   arm_default 不管朝向，让手臂用它自己最舒服的姿态
  #
  # 2026-08-23 实测：across 之下命令 64.4mm 的行程只送到 33mm，而姿态误差只有
  # 0.8°。「姿态守住了、位置丢了」正是 `continuous_ik` 够不着时的表现 —— 它一次
  # 带种子的求解够不着也不报错，交出一个折中解。所以要能不改代码就换着试。
  # 判读靠日志里新增的 `arm_gap_mm=(dx,dy,dz)`：差在拉的那个方向上是行程超界，
  # 差在别的方向上是为了保姿态被挤出去的。
  finger_axis: across
  # **在空中先合拢手指，再下降。** 与 cloth_unroll 同一个开关、同一个理由：
  # 手指张开时两个指垫横跨抓取点 80mm，下降和闭合都是贴着布面横扫。
  # 2026-08-24 实测本任务最深穿透 −2.12mm（比 1.3 的 −1.95mm 还深），
  # 与 1.3 同源 —— `touch_clearance` 加在指垫中心而不是底面。
  # 默认关闭：本任务的读数已标定，A/B 说该开再开。
  close_before_descend: false
  # Servo the commanded height so the bound patch keeps the height it had
  # at bind time instead of riding the link's z error. The bind is rigid and
  # takes those particles out of collision, so nothing else keeps them above
  # the table. Off until the A/B is measured.
  # 补掉手臂在拉动段的恒定 z 欠量（unpleat -8.0mm、unroll -1.4mm，八段纹丝不动）。
  # 机械臂退出软体耦合之后没有东西阻止夹爪进入桌面，这一项是唯一的防线。
  hold_pad_height: true
  # 绑定是刚性的、会把粒子移出碰撞求解，于是绑定瞬间的竖直状态被永久冻结：
  # 那一刻在桌面以下的粒子，整个 episode 都在桌面以下。只绑一个粒子把这件事
  # 封顶到一个粒子，其余留在求解器里可以被桌面顶回来。代价是拖拽权威变弱，
  # 可能要下调 physical.pull_step_m；看 follow_mm。默认关，等 A/B。
  attach_single_particle: false
  # 「静置之后这还算不算一个褶皱」的护栏。动作开始之前检查，不过就如实失败。
  # 2026-09-05 起只剩一条：布带铺开的长度是否明显短于材料全长（料还收在褶里）。
  # 原来第二条「三层重叠格数 ≥ 12」撤掉了：它数的是 8 mm 占用网格里能看到三层的格子，
  # 读数随布带相对网格的相位变（同一物理褶平移 60 mm 从 24 格变 6 格，角点 sweep 十格误判），
  # 而布带位置现在是变体轴。三层格数仍打印，只记录。
  #
  # 2026-08-22 的教训：褶皱是画进网格再放手的，动作开始之前它自己就会往下沉。
  # 第一次跑 demo 时抓取点取的是建模位置，结果 attach 在空气里。现在抓取点改为
  # 在静置后的粒子里找（`layout.observe`），而「找到的还是不是褶皱」靠下面两条。
  #
  # **原来这里量的是顶缘高度（min_crest_kept），2026-08-23 换掉了。**
  # 实测褶皱一定会躺平到 7.5mm（三层压在一起的厚度），没有任何参数能让它立住，
  # 所以按高度判等于每次都判失败。真正要紧的从来不是高度，是这两件事：
  #   材料还收在褶皱里没有 —— 收着才有得展开；
  #   三层还叠着没有 —— 散了就不是这个任务了。
  # 两条都是直接量，不是代理量。
  #
  # 0.80：起始铺展比实测 0.764（= 设计值，材料一点没放出来），成功门槛是 0.90。
  # 0.80 卡在中间：起始状态必须明显还收着料，否则 episode 一开始就半成品了。
  max_start_spread_ratio: 0.80
  # 静置守卫（2026-09-10 改成相对值）：静置后的铺展比只能比**设计值**高这么多。
  # 它测的是「褶在静置时有没有自己打开」；原来用绝对值 ≤ 0.80，而布带长度上限正好派生到
  # 0.80，设计 0.800 静置漂 +0.002 就被拒（s3），褶其实没散。实测十格漂移 +0.001…+0.004。
  # 上面那条 0.80 从此只是设计上限（褶至少收 20% 的料），和这条守卫不再耦合。
  max_start_spread_drift: 0.02
  # 让粒子跟着夹爪走的方式在这个任务里没有开关：原语只做 `fix_particles_to_link`
  # 一种。1.1 四种各测一次，link_patch 全面胜出（跟随率 1.00、边最大拉伸只有其余的
  # 一半到五分之一、布不入桌），那个四选一开关只在 `tests/pbd_cloth_spike.py` 里
  # 还有意义，所以这里不留一个没人读的键。

physical:
  approach_z: 0.250
  move_steps: 120
  gripper_steps: 60
  max_follow_error: 0.045
  # 拉到最后一个 waypoint 之后，保持指令等手臂到位多少步，然后才松手。
  #
  # **这一项是 2026-08-23 定位出来的一个真实缺陷的修补。** `_glide` 只把**指令**
  # 线性插值、每步走一个求解步，而手臂自己的位置控制跟不上这个斜坡，斜坡走完
  # 也没有任何人等它。实测：命令 64.4mm 的行程只送到 33mm，差 31mm；把手腕朝向
  # 放开、把布带挪近 40mm，两次读数几乎不变（31.0 / 28.1 / 30.4）——
  # 与位置和姿态都无关，就是跟随滞后。
  # 同一批日志里 z 方向恒差 7.5mm，是下降那一段留下的同一个滞后。
  #
  # 120：滞后饱和在约 32mm、指令速率 1.6mm/步，时间常数约 20 步，120 步是 6 倍。
  #
  # **但要说清这两项各自的贡献，否则以后会调错地方。** 2026-08-23 三次实测：
  #   无 settle            回收率 0.133，手臂末端差 31.0mm
  #   carry 斜坡式 settle  回收率 0.728，差 9.3mm
  #   carry 保持 + touch   回收率 1.001，差 8.6mm，attach_error 4.88 → 0.45
  # 第三次手臂末端误差几乎没变，跃升来自**抓取干净了**：指垫此前比命令低 7.5mm、
  # 压在布面高度上，手指整段拉动都蹭着布和桌面。真正关键的是下面的
  # touch_settle_steps，carry_settle_steps 只贡献了中间那一段。
  # 2026-08-23 第二轮：这一段原来写成「重新斜坡到目标」，斜坡自己又带一个滞后，
  # 结果误差从 31mm 降到 9.3mm 就停住了。改成**恒定设定值的保持**之后误差按指数衰减，
  # 120 步约 6 个时间常数。
  carry_settle_steps: 120
  # 下降到位之后、判定附着之前保持多少步。同一个滞后也让指垫停在了比命令低 7.5mm
  # 的地方 —— 那几乎是整个 touch_clearance，也就是「手指永远够不到布」这个保证的
  # 大部分。而附着容差正好在这一步之后判，不先等到位就是在给滞后打分。
  touch_settle_steps: 60
  # 绑定之后、开始拉之前原地保持多少步（dt=0.01，60 步 = 0.6 秒）。**纯粹为了画面。**
  # 绑定是刚性的、手臂已经停住，物理上不需要等；但没有这一拍，夹爪合拢和布开始动
  # 落在同一瞬间，看起来像是布被合拢的手指带走的，而不是「抓住了、然后拉」
  # （2026-09-13 看十字录像时指出）。日志里多一个 attach_hold 阶段。
  attach_hold_steps: 60
  # 首段行程每走完一个路点就原地保持多少步（首段分 8 个路点，每个约 12–17 mm）。
  # 2026-09-13 正视录像逐帧量到：绑定后一次 100 mm 的连续滑行在 4 s 内把整张十字布拉成
  # 绷紧的波浪（布区域帧差 0.8），而后面的闭环补拉是每次 5 mm、拉完就停，帧差 0.3——
  # 看起来一个是猛拽一个是轻拉。把首段也改成「拉一小段、停一下」，动作口径统一。
  # 30 步 = 0.3 s；一段首行程因此多约 2.4 s。
  segment_settle_steps: 30
  # 仅十字：抓角那条腿的闭环每补拉一次都量「锚点角」（被抓的角对面那个角，只靠桌面摩擦
  # 扣着）离出生位置漂了多远，超过这个值就停这条腿、松手，交给补角流程去另外两条边的
  # 角点上补——「检测到整块布被拖动就换另一边」（2026-09-13 提出）。
  # 背景：十字从一个角沿对角拉，整块布会被带走 42–83 mm（布带只有 2–9 mm），拉慢一半也
  # 不变，所以不是速度是锚不住。0 = 关。日志 pull_extend 行的 anchor_drift_mm 是它的读数，
  # 停下时 stop=drift。试验值 0.02，见 runs/.../20260913_final/cross_views/s8_front_drift/。
  # 0.02 在四个十字 seed 上的实测（runs/.../20260913_drift4/，对照同参数不检测那组）：
  #   seed 3  42 → 33 mm 过    seed 5  54 → 49 过    seed 8  71 → 56 过
  #   seed 0  43 → 31 mm 挂：换了两次角，第三条腿又在 21.5 mm 停下，宽度只回收 0.981。
  # 四格拖动量都降了，但 3/4 通过，不够设默认。要继续用，下一档是阈值 0.03 或允许第二轮换角。
  cross_max_drift_m: 0.0
  # 闭环每次补拉最多拉多远。0.005 是 09-05 定的（每次 5 mm、拉完停 carry_settle_steps 等手臂
  # 到位）。十字一格要补二十几次，占掉 episode 一大半的步数——是视频长的主因。
  # 2026-09-13 起做成旋钮，A/B 见 runs/.../20260913_trim/。
  pull_extend_step_m: 0.005
  # 仅十字、且只在 cross_max_drift_m > 0 时有意义：换角补拉那条腿若因锚点漂移停下而料还没
  # 付清，再从**对侧**（引入段那一端、之前没碰过的角）反向拉一次。两次拖动方向相反，
  # 整块布的净位移互相抵消；叠层已被前两次拉松，料从那一侧也出得来（2026-09-13 提出，待验）。
  # seed 0 实测（runs/.../20260913_final/cross_views/s0_front_reverse/）：抓角腿 22.7 mm 停 →
  # 换角补宽度走满 84 mm → 换角补长度 21.7 mm 停、还欠 5.4 mm → 对侧角反向补长度 21.3 mm 停，
  # 付清。全门通过 0.986 / 0.998 / 0.992，整块布被拖走 27.8 mm（不检测 43.4；只检测不反向 31.2 且挂）。
  # 单格证据；其余三个十字 seed 待跑，齐了再定默认。
  cross_reverse_repair: false
  # 松手之后原地沉降多少步（dt=0.01，60 步 = 0.6 秒）。
  release_hold_steps: 60
  # 端头每步走多少米。**不再沿用 1.1 标定的 0.0036。**
  # 那个值是在「慢了布在桌上蠕变更多」这个取舍下定的，而 `bending_relaxation=0`
  # 之后布带根本不蠕变（2026-08-23 实测，200 步跨度不动），慢下来是免费的。
  # 慢一点对接触更温和，画面上也看得清：0.0015 在 61.4 mm 的行程上是 41 步。
  # 上限仍然是隧穿（1.1 实测每步 8 mm 以内安全），离得很远。
  pull_step_m: 0.0015
  # 行程相对「褶皱收着的材料量」的倍数。1.0 就是正好把收着的料全放出来。
  # 这是首段行程；后续同次抓取的补拉根据局部残褶与累计目标决定。
  pull_scale: 1.05
  # 闭环补拉（2026-09-05，planning/cloth_unpleat_planner.PullExtender）。按上面算好的距离拉完、
  # 手臂到位后，量布带沿材料方向铺开的长度；不到目标就再拉差额，再量，直到达标或总行程到上限。
  # 角点 sweep 实测：扁褶（顶缘 / 褶宽 ≤ 0.8）与褶宽 0.035 一律留 8–10 mm 两层残褶没打开，
  # pull_scale 0.98 时回收比 0.78–0.85 落在门下；陡褶全部放出。开环公式假设存料全部能放出，实测不是。
  #   pull_extend_target     从整次任务初始静置跨度起，累计本次及先前各道褶的存料。
  #   pull_extend_max_scale  总行程上限 = 存料 × 这个倍数。锚点滑走时铺开长度不涨，靠它止损。
  #                          可达 / 工作区两行判据按这个上限算终点，不按 pull_scale。
  #   pull_extend_recoil_m   补拉时布带还被夹爪拉着，处于张紧状态，比松手静置后长；判定读的是松手后的。
  #                          出厂布局实测：拉着时 257.9 mm、松手后 252.9 mm，差 5 mm（约布长 2% 的弹性伸长），
  #                          折成回收比是 0.08。目标铺开长度按这个量加高，否则拉着时看着够了、松手就差。
  pull_extend_target: 1.0
  pull_extend_max_scale: 1.5
  pull_extend_recoil_m: 0.005
  # 仅 oracle：按出生几何标记重网格后的上层粒子，跟踪局部残褶的高度；
  # 其 95 分位高度超过桌面 + 1.125 粒径时，即使整布跨度已够也继续以 5 mm 补拉。
  pull_local_flatness: true

# ------------------------------------------------------------------ 可达与工作区
# checks() 的 hand_reach 行：拉动终点（夹爪最远到的位置）离机械臂底座的水平距离上限。
# base_xy 同 rope_unwinding / gate / unlink_c_ring / bar 的 reach 段（manipulation_space 的 mount.pos）。
# **max_hand_dist 0.665 是假设**：桌面高度沿 +y 贴桌拉的唯一实测点是 cloth_unroll 2026-08-24
# 在 x = 0.040 拉到 y = 0.181（离底座 0.636）；本任务 center_x 到 0.070 时同一 y 离底座 0.665。
# 与 bar / gate 0.700、rope_unwinding 0.780 不是一个口径：那些手在 5–10 cm 高，这里指垫在
# 桌面上 8.5 mm。角点子集里 center_x 0.070 + center_y 窗口上端的格实测后写回。
reach:
  base_xy: [-0.570, 0.0]
  max_hand_dist: 0.665

# manipulation_space.workspace 的 x / y 字面量副本（checks() 的 band_in_workspace 行读；
# 角点门裸加载本文件时读不到 common 配置）。builder 断言与 common 相等。
workspace:
  x: [-0.25, 0.25]
  y: [-0.30, 0.30]

success:
  # 静置多少步再开始动作。**120 → 60，2026-08-23 按实测缩短的。**
  # `bending_relaxation=0` 之后布带从第 25 步起跨度、顶缘、单层率三个数就不再变化
  # （扫参日志 runs/pleat_stability/），120 步里有 95 步是在等一个已经不动的东西。
  # 而且 demo 把这 60 步与夹爪张开重叠了（张开本身要 gripper_steps=60 步），
  # 所以这一段在画面上不再是「机械臂杵着不动」。
  settle_steps: 60
  # 统计用的格子边长，与 1.1 相同（2 倍 particle_size）。
  cell: 0.008
  # ---------------------------------------------------------- 三条联合判据
  # docx 1.2 的原文：最大高度低于阈值 + 覆盖区域单层 + 总铺展长度 ≈ 材料全长，
  # 三项联合判定。防捷径：把褶皱直接压塌也能让高度达标，但层数与长度守恒不过。
  #
  # **下面三个数是在合成布上定的起点，不是仿真标定值。** 标定要跑三种走法
  # （unfold / press / overpull）之后把实测填回来，做法与 1.1 相同。
  # `tests/check_cloth_unpleat_geometry.py` 在合成布上量到的四端：
  #             原样立着   压塌     展开     拉过头
  #   最大高度     24.0mm   9.97mm   2.00mm   2.00mm
  #   单层率       0.846    0.760    1.000    1.000
  #   铺展比       0.764    0.746    1.000    1.000
  #   band_shift    0mm      0mm      0mm     80.0mm
  #
  # 合成布里的「原样立着」是 t=0 的建模形状。**真实的起始状态是静置后的躺平三层**，
  # 2026-08-23 实测：单层率 0.810、铺展比 0.764、高度 9.5mm（相对桌面）、
  # 三层格数 33，且从第 25 步起不再变化。两条判定门槛对它仍然成立
  # （0.810 < 0.90，0.764 < 0.90）。
  #
  # 最大高度（米，相对桌面）。**null = 只记录不判定，2026-08-23 从门槛降下来的。**
  #
  # docx 1.2 把它列为三条判据之一，前提是褶皱立着（高度 24mm）而压塌之后是 10mm。
  # 实测这块布立不住：`bending_compliance` 是死参数，没有任何东西提供折痕记忆，
  # 褶皱放手 25 步内就躺平到 9.5mm（相对桌面）。也就是说**起始状态本身就已经
  # 通过了这条判据**，它不再区分任何东西。
  #
  # 一条永远满足的判据比没有判据更糟：它看起来像个标准，实际不起作用，还会让
  # 「三项联合」这句话名不副实。所以降为诊断量，判定只留下面两条。
  # 类别合同（C1，task_taxonomy_zh.md 4.1）要求「结构指标 + 形态指标的合取」，
  # 单层率是结构的、铺展比是形态的，两条仍然构成合取。
  max_height_m: null
  # 覆盖格中恰好一层的比例。这是唯一不需要粒子编号的读数（真机只有点云）。
  # 09-10：0.90 -> 0.98，防止整布比例掩盖一道局部残褶。
  single_layer_frac_min: 0.98
  # **放回来的料占褶皱原本收着的料的比例。** 材料守恒使「褶皱消失」与「长度恢复」
  # 严格绑定，而这个量才是那句话的正确写法。
  #
  # 2026-08-23 从 `spread_ratio_min: 0.90` 换过来，因为那个门槛是错的：
  # 铺展比的起点是 0.764 不是 0，能动的范围只有 0.236，所以 0.90 读起来像
  # 「几乎全放出来了」，实际只要求放出 58%。当天一次实测跑出 40.9/61.4 = 67%
  # 的回收率，铺展比读 0.921 顺利通过 —— 那次布带上还留着 26mm 没放出来的料。
  #
  # 0.85 的两侧现在都有实测（2026-08-23，CPU 后端）：
  #   unfold  1.001  —— 61.4mm 存料全部放回，跨度 260.1mm = 材料全长，
  #                     单层率 0.971、三层格数 0、band_shift 1.06mm
  #   压塌     -0.075 —— 合成布，材料一点没放出来
  # 分母用的是**静置后实测的存料**而不是配置里的设计值，所以褶皱在动作开始前
  # 自己松掉的那部分不会算到机械臂头上。
  #
  # 门槛暂时留在 0.85：仿真那一侧目前只有「做对了」这一个点，
  # shove / overpull 两种走法的实测拿到之后再收紧。
  # 09-10：0.85 -> 0.95；判定始终读松手静置后的状态。
  recovered_frac_min: 0.95
  # 铺展跨度 ÷ 材料全长。降为诊断量：它与上面那条量的是同一件事，但读数不好解释。
  spread_ratio_min: null
  # ---------------------------------------------------------- 只记录不判定
  # 整条布带的平移量：overpull（拉过头）与正确展开在上面三条上读数相同，
  # 差别只在这里。留作诊断量，是否升格为门槛等标定跑完再定。
  band_shift_max: null
  # 拉伸（复用 cloth_fold_verifier 的 stretch_report）与平整度方差同样只记录。
  stretch_max: null
  flatness_var_max: null
  # 末态布带在俯视上垂直于自身长度方向的跨度，减去带宽（2026-09-10）。直布带 ≈ 0（PBD
  # 毛刺 3–7 mm）；折痕斜置而沿 y 拉时，布带在折痕处折成一个角，实测 34° 时宽出 43 mm，
  # 而层数与长度两条门看不见它。先只记录，等拉的方向改成沿折痕法向之后按分布定门（预期 0.015）。
  # 09-10：启用 15 mm 直度门；当前两种构型均沿材料轴摆放、拉动。
  across_excess_max: 0.015

# ------------------------------------------------------------------ 指令
# 常量句。任务不问「从哪一端拉」（2026-09-08 会上定），所以指令里也不说；
# 要读的是画面：有几道褶、褶在哪、哪一端是光的。
goal:
  instruction: "Pull the pleated cloth band out flat on the table."

# ------------------------------------------------------------------ 变体
# 每条轴各自独立区间；区间依赖其他轴的量抽归一化 frac 再由 derive_task_cfg 派生；
# 首抽拒绝率门 2%（tests/check_variant_rng.py）。
#
# **20 条轴，但顶点不是它们的全积。** 构型轴选出的是三种**不同的场景**：
# single / parallel 造的是一条带褶的布带，cross 造的是一张对折两次的方布，
# 两边读的叶子几乎没有交集。全积会把互不相干的两组取值乘在一起（2,359,296 个顶点），
# 覆盖不到任何新东西，所以两道角点门都按构型分层穷举
# （single 768 + parallel 6,144 + cross 4,096 = 11,008 个顶点）：
# `tests/check_variant_corners.py` 的 TASKS 里 cloth_unpleat 的 `strata=` 条目，
# 以及 `tests/check_cloth_unpleat_geometry.py` 的 LAYOUT_AXES（两处是字面副本，
# 各自断言算出来的顶点数，改了一处另一处会红）。
# **抽样不分层**：抽一个没人读的叶子不花钱，而按构型跳过会让抽取顺序依赖构型，
# 进而改掉别的叶子的取值。下面每条轴的注释里写了它属于哪种构型。
#
# 从 2026-09-09 起物理证据不再按全因子跑（布带格约 60 s、十字格 10–25 min）：
# 解析层穷举全部顶点（不吃 GPU），物理层按构型各跑一个 4-way 覆盖数组
# 加每条判据行 margin 的 argmin 格。理由与实测见 docs 的「证据口径」一节。
variation:
  # 构型主轴（2026-09-11 加入 cross）：
  #   single    一道褶，一次拉
  #   parallel  两道平行褶，同一次夹持连续两次拉
  #   cross     一张方布先横折一次再纵折一次，两条正交的自由边分两次拉
  - {kind: choice, path: cloth.pleat.layout, values: [single, parallel, cross]}
  # 单调裕度轴：第一道褶叠进去的宽度三档。越窄，「拉平了」与「褶塌了」两种读数越难分开。
  # 09-10：收为 24/27/30 mm，较浅的折入宽度给局部补拉保留行程。
  - {kind: choice, path: cloth.pleat.a.width, values: [0.030, 0.027, 0.024]}
  # 布局镜像：布带对材料轴取反；十字时它是**第一折**的镜像（见 cloth.band_flip 的注释）。不是任务轴。
  - {kind: choice, path: cloth.band_flip, values: [1, -1]}
  # 布局：第一道褶的顶缘出生高度。只影响出生时三层间距与存料量（单道存料 55–85 mm）；下限 4 × 粒径。
  - {kind: uniform, path: cloth.pleat.a.crest_height, lo: 0.016, hi: 0.028}
  # 归一化：第二道褶自己的宽度与顶缘，窗口写在 cloth.pleat.b.{width,crest}_{min,max}。
  - {kind: uniform, path: cloth.pleat.b.width_frac, lo: 0.0, hi: 1.0}
  - {kind: uniform, path: cloth.pleat.b.crest_frac, lo: 0.0, hi: 1.0}
  # 归一化：布带／方布的横向位置。上限随收的料变（铺平后越大越够不着），抽 [0,1] 再派生。
  - {kind: uniform, path: cloth.center_x_frac, lo: 0.0, hi: 1.0}
  # 归一化：两道平行褶之间的平段。0 = 挨得最近（但不叠）。
  - {kind: uniform, path: cloth.pleat.gap_frac, lo: 0.0, hi: 1.0}
  # 归一化：两个端平段，即褶在布带上的位置；它们一定，布带长度就定了。
  - {kind: uniform, path: cloth.lead_frac, lo: 0.0, hi: 1.0}
  - {kind: uniform, path: cloth.tail_frac, lo: 0.0, hi: 1.0}
  # --- 以下七条只有 cross 读 ---
  # 第二折的镜像（±1）。与 cloth.band_flip 合起来四种朝向。
  - {kind: choice, path: cloth.cross.flip, values: [1, -1]}
  # 归一化：两道折各自折回去多深，窗口 [0.016, 0.030]（_cloth_cross_geometry.DEPTH_MIN/MAX）。
  # 收在一道折里的料 = 2 × depth + 2π × 圆角半径，所以它就是十字的「存料主旋钮」。
  - {kind: uniform, path: cloth.cross.first.depth_frac, lo: 0.0, hi: 1.0}
  - {kind: uniform, path: cloth.cross.second.depth_frac, lo: 0.0, hi: 1.0}
  # 归一化：两道折痕各自在布上的位置（折痕两侧的光布长度）。lead 先抽、tail 抽剩下的，
  # 共用一份 cloth.cross.sheet_max 给的预算；抽完布的长与宽就定了。
  - {kind: uniform, path: cloth.cross.first.lead_frac, lo: 0.0, hi: 1.0}
  - {kind: uniform, path: cloth.cross.first.tail_frac, lo: 0.0, hi: 1.0}
  - {kind: uniform, path: cloth.cross.second.lead_frac, lo: 0.0, hi: 1.0}
  - {kind: uniform, path: cloth.cross.second.tail_frac, lo: 0.0, hi: 1.0}
  # --- 以下三条三种构型共用 ---
  # 布局：单次行程相对该道褶／折存料的倍数。> 1.1 开始拖整块布（physical.pull_scale 的注释）。
  - {kind: uniform, path: physical.pull_scale, lo: 0.98, hi: 1.12}
  # 归一化：捏取点内缩量。上限随被抓那一端的光布长度变（附着盘要整个落在单层布上）。
  - {kind: uniform, path: grasp.edge_inset_frac, lo: 0.0, hi: 1.0}
  # 归一化：纵向位置。锚端出生位置和累计拉动终点都受工作区与可达盘限制。
  - {kind: uniform, path: cloth.center_y_frac, lo: 0.0, hi: 1.0}
  # 派生。布带：第二道的宽/高 -> 横向位置（要存料）-> 两褶间距 -> 两个端平段
  #        -> material_length（算出来写回）-> 内缩量 -> 纵向位置。
  #      十字（derive_cross_cfg）：求解器档位的 task 侧叶子 -> 两道折的圆角半径与深度
  #        -> 四个光布段 -> material_length 与 width（都写回）-> 内缩量
  #        -> 横向位置 -> 纵向位置。
  - {kind: derived, fn: "topogym.tasks_legacy.deformation.cloth_unpleat:derive_task_cfg"}
  # 校验。布带走 ClothUnpleatLayout.checks() 七行（端平段 ≥ 4 格、顶缘 ≥ 粒径、
  #       附着盘离三层区、出生布带与每个拉动终点在工作区内、每个终点可达、
  #       每道行程额度 ≤ 0.120、出生铺展比 ≤ max_start_spread_ratio）；
  #       十字走 ClothCrossLayout.checks() 五行（出生方布在工作区内、第一折的叠层
  #       厚度 ≥ 粒径、第二折让开第一折那一叠、两次拉各自的直线余量够走完行程）。
  #       终点与行程按补拉上限 存料 × pull_extend_max_scale 算。
  - {kind: validate, fn: "topogym.tasks_legacy.deformation.cloth_unpleat:validate_task_cfg"}
