schema_version = "1.3"
artifacts = [{ source = "/data/episode.jsonl", service = "sim" }, { source = "/data/final.json", service = "sim" }, "/app/output/"]

[task]
name = "poc/gym-sidecar-poc"
description = "PoC: robot-as-a-service sidecar, agent only has a client; verifier grades the sidecar's own log in a separate sandbox."
authors = [{ name = "kangrui" }]

[metadata]
author_name = "kangrui"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "python -c \"import json; L=[json.loads(l) for l in open('/data/episode.jsonl')]; json.dump({'n_events': len(L), 'success': any(e.get('success') for e in L), 'resets': sum(e['ev']=='reset' for e in L), 'denied': sum(e['ev']=='reset_denied' for e in L)}, open('/data/final.json','w'))\""
timeout_sec = 30

[agent]
timeout_sec = 600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
