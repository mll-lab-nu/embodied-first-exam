# Stacked-Plate (redesigned) on the frozen TopoGym tabletop V1 baseline.
# 几何约定：单位米；task z=0 是桌面；center 是中心点；size 是完整长宽高。
#
# 设计：3 个竖直圆盘串在一根沿 Y 的水平横杆上（左右并排），每盘缺一个相同扇形，
# 机械臂捏住盘缘薄边、靠指腹摩擦把盘向下滚转，目标 = 把三盘缺口转到同一角度重合。
# 扇形缺口为纯视觉；碰撞/质量是均匀完整圆柱（质心在轴上、无重力力矩、任意角度稳定）。

task:
  id: stacked_plate
  difficulty: level1

coordinate_frame: task

workspace:
  name: stacked_plate_workspace
  enabled: false
  pos: ${common.manipulation_space.board.pos}
  size: ${common.manipulation_space.board.size}
  color: [0.92, 0.92, 0.94]

# 水平横杆（沿 Y），穿过三盘中心；固定、纯视觉。真实转轴是各盘的 revolute joint。
# collision=false：细杆在盘的实心碰撞圆柱内部，若开碰撞会与盘 collider 重叠、施力矩时爆 NaN。
# center.y=0、length=0.74：横杆与两端支腿关于机械臂中线(y=0)轴对称（从正面看对称）；
# 三盘也关于 y=0 对称挂在杆上（-0.11/0/0.11）。支腿由 _add_support 放在杆两端
# center.y ± (0.5·length - end_margin) = ±0.35，对称框住整组盘。
# center.x=0.020 保持最佳 reach 位、不前移。中间盘坐在 y=0 会与共用 home 手指重叠，
# 但盘是竖直大圆(R=0.115)、在 X 上摊得很宽，靠前移让位需推到 reach 外——不可行；
# 改用 stacked_plate 专用抬高 home（robot_control_configs/
# franka_panda_position_ik_stacked_plate_raised_home.yaml）把夹爪停到盘顶之上，
# 靠 z 分离避免 reset_home 瞬移那帧互穿。
rod:
  enabled: true
  axis: y
  radius: 0.010
  length: 0.740
  center: [0.020, 0.000, 0.130]
  collision: false
  color: [0.05, 0.06, 0.08]

# 三个竖直圆盘：盘面在 XZ 平面，绕 Y 轴（横杆）转。同 x/z，y 左右分布。
# init_angle_deg 各不同（初始未对齐）。缺口楔角见 sector.sector_deg。
# 盘半径 0.115（约 1.5×）便于夹爪从两侧捏盘面旋转；盘心 z=0.130：底缘≈0.015 不刃桌、
# 顶缘≈0.245（正上方接近时指尖越顶手部≈0.38 < 可达上限 0.40，home(0.273) 在盘顶之上）。
# 盘阵关于 y=0 对称（y=[-0.110,0.000,0.110]），x=0.020 保持最佳 reach。中间盘坐在 y=0
# 会与共用 home 手指冲突，靠 stacked_plate 专用抬高 home 从 z 上让开（见 rod 注释），盘不前移。
# 间距 0.11（> 夹爪张开宽 0.08），工作时夹爪不蹭邻盘。半径只在 XZ 展开，不会沿 Y 撞邻盘。
disks:
  D1:
    center: [0.020, -0.110, 0.130]
    radius: 0.115
    thickness: 0.020
    init_angle_deg: 35.0
    color: [0.02, 0.20, 1.00]
    collision: true
  D2:
    center: [0.020, 0.000, 0.130]
    radius: 0.115
    thickness: 0.020
    init_angle_deg: 45.0
    color: [1.00, 0.48, 0.00]
    collision: true
  D3:
    center: [0.020, 0.110, 0.130]
    radius: 0.115
    thickness: 0.020
    init_angle_deg: 70.0
    color: [0.02, 0.75, 0.35]
    collision: true

# 扇形缺口（三盘相同）。纯视觉 mesh：完整圆盘挖掉一个 sector_deg 的楔形（pac-man）。
sector:
  sector_deg: 70.0
  # 缺口两侧切边高亮色（读出缺口位置）。
  edge_color: [0.98, 0.30, 0.10]
  arc_segments: 48

mechanism:
  mode: revolute_joint
  axis: y
  mass: 0.30
  joint_damping: 0.06
  joint_friction: 0.03
  joint_armature: 0.01
  contact_friction: 1.50
  collision_radius_scale: 0.98

# 托住横杆两端的竖直支柱（到桌面）。工程塑料灰白（与绳端插头同色）。
# collision=false：盘阵偏移后支腿可能与盘碰撞体重叠（同 rod 隐患）；盘是 fixed-base
# URDF 由关节固定，rod+支架都做纯装饰即可。
support:
  enabled: true
  radius: 0.028
  end_margin: 0.020
  collision: false
  color: [0.62, 0.63, 0.65]

# 观感升级（纯视觉、无碰撞）。
visual_details:
  enabled: true
  end_cap:                # 横杆两端端盖 hub
    enabled: true
    radius: 0.016
    length: 0.006
    color: [0.55, 0.56, 0.58]

oracle:
  # 目标对齐角：把三盘缺口都转到 90°（朝上）。
  target_angle_deg: 90.0

success:
  # 三盘缺口世界角的极差 ≤ 此值即算对齐成功。
  alignment_tolerance_deg: 10.0

physical:
  finger_links: [left_finger, right_finger]
  finger_friction: 3.00
  disk_friction: 2.50
  noslip_iterations: 0   # 大盘持续夹持接触下 noslip 迭代易触发 solver NaN；先关掉
  settle_steps: 50
  # 抓盘缘顶点前的保底高度（task 帧；demo 再按盘缘顶点动态抬高）。
  approach_z: 0.340
  retreat_z: 0.335
  approach_clearance: 0.035
  retreat_clearance: 0.035
  # 手指沿世界 Y 合拢=跨盘"厚度"两侧捏面（像两指捏飞盘）。franka 指滑轴是手部本地 Y，
  # default_ee_quat=[0,1,0,0] 已把它映射到世界 Y，故 offset=0 即正确；若设 90°会绕世界 Z
  # 转成沿 X 合拢=在盘 XZ 平面里横跨一条弦（夹不上大盘、还会把手臂怼进盘导致 NaN）。
  grasp_yaw_offset: 0.0
  # 捏缘起点方位角（0=盘缘正上方，向 +X 前方为正）。从前上方一点起捏，向下滚动更自然。
  grasp_rim_angle_deg: 25.0
  # 被捏盘缘点的滚动方向：+1/-1 强制上/下滚，0=取到目标角的最短路径。
  # 当前 init/target 下最短路径即为正向下滚，故用 0。
  roll_sign: 0
  move_steps: 100
  arc_steps: 260
  gripper_steps: 50
  # 从两侧捏盘面（盘厚 0.020，半厚 0.010）：grasp_qpos 取 0.004 « 半厚，指腹重压盘面产生
  # 足够摩擦力矩把盘拖到目标角；过松（0.008）会打滑、盘转不到位。
  grasp_qpos: 0.0040
  # 捏取半径系数：在 0.85·R 的实心盘面上捏（而非 R 的薄边、半个 pad 悬空）→ 接触更实、不打滑。
  grasp_radius_scale: 0.85
  terminal_check_interval: 4
  close_hold_steps: 35
  arc_settle_steps: 70
  release_hold_steps: 50
  final_hold_steps: 30
  rotation_tolerance_deg: 8.0
  min_rotation_deg: 20.0
  max_rim_follow_error: 0.050
  max_release_drift_deg: 5.0

mdp:
  max_episode_steps: 80
  reward:
    success: 10.0
    misalign_penalty: 1.0
    action: 0.01
