paper_category = "loco"
capability_class = "fixture (C3 · quasi-static stabilisation, too easy to score)"
status = "verified"
expert_hours = 1.0
completion_rate = "124%"
evidence = "paper 861, FastTD3 929, bar 750"
one_liner = "sits the Unitree H1 on the chair"
task_statement = "sit the robot down on the chair and keep it seated, upright and still."
scene_note = "the chair and the robot's initial pose never change between resets."
scoring_note = '''A product: the average of two seat terms — how close the pelvis is to the height it has
when seated, and whether the robot is over the seat rather than beside it — multiplied by staying upright,
a seated posture (the head's height above the torso), not moving, and low actuator force. Every step spent
not yet sitting forfeits the reward that step could have paid, so both *how fast* and *how steadily* the
robot sits matter.'''
ends_note = '''The episode ends early if the pelvis drops below about half its standing height — not far
below its height when seated.'''
obs_layout = "qpos(26) + qvel(25), robot state only"
task_notes = ""
difficulty = '''- **No pose to snap to.** Reaching the chair late still forfeits the reward of every step spent
  standing, so the agent has to sit *early* and then stay still — a partial credit landscape, not a
  goal test.
- **Doing nothing already gets 85% of the bar.** An all-zero action commands the mid-point of every
  actuator's range, which slumps the robot back against the chair's backrest with the pelvis just above
  the seat, and it stays there for the full episode: **637.6 /
  750**, measured. Holding the *starting* pose instead scores 468.12 (62.4%). That is the single clearest
  reason this task is a fixture and not a scored task — the gap a solution has to close is small enough
  that almost anything coherent closes it.
- **19 coupled DoF under gravity.** The agent has to work out *which* joints put a humanoid on a chair
  and how to get there without falling — from the raw state vector and the MuJoCo model, with no
  primitives.

**Measured difficulty** (`mini-swe-agent` + `meta/muse-spark-1.3`, first attempt): **solved, 979.03 /
750** in 26 steps, 337 s of agent time and $0.36. It did not search — it read the model, picked a seated
joint target by hand (hip −1.4, knee 1.7, ankle −0.35), cosine-blended into it over 30 steps and held,
then self-checked with `Session.replay`. That beats this task's CEM-MPC oracle (820.28) and the
published SAC baseline (861), which needs millions of environment steps.

🚩 That run also read `Sit.get_reward()` and quoted its bounds back at us, which is the measurement that
led to the reward function being removed from the image entirely
(`images/humanoidbench/scrub_oracles.py`, `docs/benchmarks/humanoidbench.md`). The 979.03 is
therefore a number from the old, reward-visible setup and is not reproducible as-is.

So this instance is **easier than it looks**, and honestly so: `sit_simple` rewards a static seated pose,
and a static pose is exactly what a competent agent can reason out. It earns its place as the first task
in the family — it proves the whole pipeline end to end with a solvable target — but it is **not part of
the scored subset**. It is kept as the template every other task is generated from and as the CI fixture
that distinguishes "the agent is broken" from "the task is hard".'''
retire_when = '''Delete this task once all 23 scored tasks are `verified` and at least two of them, from
different capability classes, have been passed end to end by different agents.
The original condition — "any scored task passed by a real agent" — was met by `walk` (784.54/700,
`claude-sonnet-5`), but that was a single run by a single model under the old reward-visible setup, and
the whole point of the fixture is to tell "the agent is broken" apart from "the task is hard". That
distinction is worth most while 23 task directories are being generated for the first time, and this is
the only task carrying an oracle, so it is also the only one where the oracle = 1 path can be
exercised.'''
reference_solution = '''`solution/sit_simple_actions.npy` — a 999-step action sequence that scores
**820.28 / 750**, replayed by `solution/oracle_sit_simple.py`. HumanoidBench ships no reference solutions
(its "solutions" are training curves), so this one was produced by training-free CEM-MPC against the
simulator itself: `solution/cem_mpc.py` reruns that search in ~2.5 minutes on 32 cores (last run:
817.7/750). It is a fresh search, not a replay, so it produces an equivalent passing trajectory rather
than this exact file. `solve.sh` replays the recording instead of searching, so the oracle is
deterministic and costs one episode.

⚠️ The oracle searches against the reward function, which the task image no longer has. It runs with the
verifier's restore path (`tests/rcb_rewards.py`) or outside the container; it is a development tool and a
CI fixture, not something an agent could reproduce from inside.'''
standard_reference_solution = '''`solution/oracle_replay.py` sends the same 999 rows (`solution/sit_simple_actions.npy`)
through the client, one per control step (`dt` = 0.02 s, `interpolate="hold"`), as an agent would send them; the
service ends the episode the moment the return reaches the pass mark. No privileged information at run time.'''

[task.standard]
ends = "when the robot falls (its pelvis drops below about half its standing height, not far below its height when seated)"
hidden = "where the robot is in the room, not the chair's pose"
tier = "no root pose, no chair pose"
camera_note = "the chair is behind the robot and never enters the head cameras' view (floor and horizon only); `room_camera` (the recording camera frozen at its starting pose) sees both."

