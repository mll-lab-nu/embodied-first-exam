# linkbar_merge_components_inspect_demo 的运行模式参数。
#
# 场景几何不在这里——它在 task 配置里（configs/task_configs/
# linkbar_merge_components_topogym_tabletop_v1.yaml），用点路径覆盖即可扫参：
#   task.sockets.b1_angle_deg=40
#   task.socket.capture_tolerance_xy=0.010
#   task.lift_test.force_scale=2.0

defaults:
  - default
  - _self_

# 只建场景、一步不走。构建期的互相穿透在这一档能看见，不会被第一次沉降藏掉。
static_only: false

# 关节扫描：用位置控制把梁依次驱到 b1 → 初始角 → a2 → 初始角，报跟随误差。
# 用位置控制而不是直接写关节，是因为这一档问的是「梁能不能真的过去」：
# 直接写角度会穿过挡路的东西并报告成功。属于运动学检查，不是 episode。
sweep_joint: false
sweep_steps: 180
# 每一段允许的残余角误差。超过它说明梁在半路被挡住了。
sweep_tolerance_deg: 1.0
# force 是关节力矩上限（N·m）。取 2.0 而不是更大：折算到销上约 12N，驱动 0.45kg 的梁
# 绰绰有余，同时限制了梁万一顶到卡座时能把自由体 B 推多远——检查工具不该自己制造
# 它要测量的那个位移。
sweep_servo:
  kp: 60.0
  kv: 6.0
  force: 2.0

# 落座相位。写关节到指定角，让闩自己判断看见了什么。
#   none  : 停在初始角，两个捕获窗都进不去，闩必须不动作（对照档）
#   b1    : 落到 B 的卡座
#   a2    : 落到 A 自己的卡座
#   angle : 落到 seat_angle_deg，用来走捕获窗的边界，验证闩确实在
#           capture_tolerance_deg 处开始动作
seat_phase: none
seat_angle_deg: 0.0

# 落座后跑提起测试：给 B 一个向上的力，看有没有东西拉住它。
lift_probe: false

# 跑判据：读约束图求 component_count，并与提起测试的结果对表。
# 与 lift_probe 一起开才有物理层读数；单开只报约束图那一半。
classify: false
