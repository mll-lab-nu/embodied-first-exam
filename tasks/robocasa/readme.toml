# privileged/tests/grade.py main(): no file -> missing_trajectory (L75-76); check_file (L46-54): casa_tool.load_npz
# (casa_tool.py L237-249: <= 8 MB, <= 64 members, .npy members only, no pickle), `actions` 2-D, 1 <= T <= MAX_STEPS =
# 3000 (casa_tool.py L78), finite -> else invalid_trajectory; replay() in a child process (L27-38, L88-103):
# as_actions (T, 12) else exit 2 -> invalid_trajectory; Session.replay (casa_tool.py L643-655: reset to the frozen
# instance, then Session.step per row: clipped to the channel limits L593, env.step, _check_success twice, L594-596).
# ok = not initial_success and success (L106; initial_success = the check at reset, casa_tool.py L581-582). A replay
# that raises (a simulator error), times out or cannot import the tooling -> grader_error = 1, success 0 (L102-103,
# L116-118). The video is rendered after reward.json is written (L120-132).
[modes.privileged]
success = """
The graded file is `/app/output/trajectory.npz`: a plain `.npz` (at most 8 MB, at most 64 members, arrays only) with an
array `actions` of shape (T, 12), finite numbers, 1 ≤ T ≤ 3000, one row per control step (1/20 s); each value is
clipped to its channel's limits ([-1, 1]). The verifier, in a separate sandbox without network, replays it once,
open-loop, in a fresh process from its own copy of the frozen start, and evaluates the environment's own check
(`_check_success`) on the state after the last row; meeting the conditions at an earlier step does not count. A scene
already solved at the start would not count either (the frozen start is not solved).

A missing file scores 0, and so does an invalid one: not a readable `.npz` of that kind, no `actions`, a shape other
than (T, 12), a NaN or infinite value, or T outside 1 to 3000. A replay that fails (a simulator error) scores 0.
"""

# sim/server_casa.py: RCB_AGENT_END=1 and no RCB_STEP_LIMIT / RCB_MAX_CONTROL_STEPS in any compose file (L67, L84-91:
# no step cap); POST /finish -> finish("finished") (L1203-1207); the collect hook's SIGUSR1 after the agent's container
# is stopped -> finish("timeout") (L1235-1239, finalize.sh); an exception while executing a call -> finish("error"),
# 500 (L1225-1231). Every executed control step is S.step (casa_tool.Session.step, L708-718); a hold chunk steps
# S.hold_targets() (L928-937). The success is only recorded, never shown (_hidden_success L101-107, L888, L943).
# finalize() L1045-1094: success = S.check() (the check after the last executed control step) and not initial_success
# and reason != "error" and reason in END_STATE_REASONS (finished, timeout, step_limit); nothing is replayed.
# _start_mismatch L1246-1262 (RCB_INSTANCE_SHA, RCB_START_SHA, solved at start) -> _give_up(instance_mismatch,
# infra=True) before the port is bound. _resume_or_start L1265-1336: more than RCB_MAX_RESUMES = 2 crashes ->
# sim_crashed_on_call (all inside the agent's calls; infra=False) or sim_crashed (infra=True); journal mismatch ->
# resume_failed (infra). standard/tests/grade.py L40-85: no final.json / unreadable / not finalized / infra_error /
# finalize_error -> infra_error = 1; success = graded_by "live" and success and live_success and reason != "error".
[modes.standard]
success = """
Graded is the one live episode: no reset, no step limit. It ends when the agent sends `POST /finish`, or when the
agent's session ends (at the latest after {timeout}); the environment's own check (`_check_success`) is evaluated on
the state after the last control step the service executed, and nothing is replayed. Meeting the conditions earlier
in the episode does not count, and the service never reports success while the episode runs. A scene already solved
at the start would not count (the frozen start is not solved).

A simulator error raised while executing an agent's call ends the episode with 0, as do repeated service crashes that
all happened while serving the agent's calls. Before the agent is served, the service checks that the scene starts at
the frozen instance (the instance file's hash and the start state's hash); a mismatch, a service crash the episode
cannot be resumed from, or a missing or unfinished verdict is an infrastructure error, not a score.
"""

