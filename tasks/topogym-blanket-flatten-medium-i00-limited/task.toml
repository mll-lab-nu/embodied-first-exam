schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/topogym-blanket-flatten-medium-i00-limited"
description = "LIMITED MODE (robot as a service, rcb-limited/2.2): TopoGym blanket_flatten on the same frozen instance as the unlimited task. Unfold and spread the blanket flat on the table without overlaps or excessive stretching, then release it and withdraw. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "aloha", "limited-mode", "trajectory", "blanket_flatten"]

[metadata]
author_name = "jianwen"
task_type = "trajectory"
simulator = "topogym"
robot = "aloha"
family = "blanket_flatten"
tier = "perception"                # RGB + proprioception only; no object poses, no success predicate, no reset
difficulty = "medium"
grasp = "physical (no assisted grasping)"
success_rule = "his default success (goal_complete True; terminal revision release_settling_v1)"
initial_state = "re-prepared in rcb-topogym 0.2.3 with his scripts/prepare_blanket_initial_states.py (--tier, seed 0, --acceptance scene_layout); his archived gathered_scene_v1 states do not restore in 0.2.3 (backend identity: world_sha256 of topogym/world/genesis_world.py, changed by his seed fix in 76583213; underneath, the RigidSolver layout mismatch of 0.2.1 / 0.2.2: collision verts 13876 archive vs 14008 live)"
mode = "limited"
protocol = "rcb-limited/2.2"
instance_seed = 0
expert_time_estimate_hours = 3

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 300); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 11100); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; sleep 2; done; for i in $(seq 1 11100); do grep -q '\"video_done\": true' /data/final.json 2>/dev/null && break; sleep 2; done; cat /data/final.json"
timeout_sec = 45000                # service up (<= 10 min), replay (grading record), then the video: each at most one episode

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
