# linkbar_rotate_to_zone_inspect_demo 的运行模式参数。
#
# 场景几何不在这里——它在 task 配置里（configs/task_configs/
# linkbar_rotate_to_zone_topogym_tabletop_v1.yaml），用点路径覆盖即可扫参：
#   task.zones.color_1.angle_deg=30 task.zones.color_2.angle_deg=60
#   task.zones.target=color_1
#   task.zones.half_width_deg=6

defaults:
  - default
  - _self_

# 只建场景、一步不走。构建期的互相穿透在这一档能看见，不会被第一次沉降藏掉。
static_only: false

# 关节扫描：用位置控制把梁依次驱到 color_1 → 初始角 → color_2 → 初始角，报跟随误差。
# 用位置控制而不是直接写关节，是因为这一档问的是「梁能不能真的过去」：
# 直接写角度会穿过挡路的东西并报告成功。属于运动学检查，不是 episode。
sweep_joint: false
sweep_steps: 180
# 每一段允许的残余角误差。超过它说明梁在半路被挡住了。
sweep_tolerance_deg: 1.0
# force 是关节力矩上限（N·m）。折算到销上约 12N，驱动 0.45kg 的梁绰绰有余。
sweep_servo:
  kp: 60.0
  kv: 6.0
  force: 2.0

# 落位相位。写关节到指定角，沉降后跑判据，看判据读出什么。
#   none  : 停在初始角，两块区域都不在，判据必须报 outside_zone（对照档）
#   color_1 : 落到 color_1 区中心
#   color_2 : 落到 color_2 区中心
#   angle : 落到 seat_angle_deg，用来走区域边界，验证判据确实在 half_width_deg 处翻转
seat_phase: none
seat_angle_deg: 0.0

# 判定完成后再步进多少步。纯粹为了录像：终态不停顿的话，视频在结论出现的那一帧就
# 结束了。60 步 = 0.6 秒。
final_hold_steps: 60

# --- 变体（2026-08-29）------------------------------------------------------
# 按 seed 在包络内随机布局（generation/layout_randomization.py 的注册条目）。默认关 = 确定性布局。
randomize_layout: false
# 划档前只有 envelope 一档（全包络）；划档后按 seed % 3 选档，见 variation_axes_plain_zh.md §5。
difficulty: envelope
# 写进 episode 元数据的变体标识。
variant_id: default
