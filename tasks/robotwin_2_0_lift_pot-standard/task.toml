schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/live.mp4", service = "sim" },
  { source = "/data/live_timeline.jsonl", service = "sim" },
  { source = "/data/live_segments.jsonl", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  "/app/output/",
]

[task]
name = "robot-coding-bench/robotwin_2_0_lift_pot-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): RoboTwin 2.0 lift_pot on the same frozen instance as the privileged task (seed 28831). Use arms to lift the pot. The agent only gets a client: /observe (RGB-D video, camera calibration, proprioception) and /submit (joint_position or ee_pose action chunks). No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "kangrui" }]
keywords = ["robotics", "robotwin", "sapien", "aloha-agilex", "dual-arm", "standard-mode", "trajectory", "lift_pot"]

[metadata]
author_name = "kangrui"
task_type = "trajectory"
simulator = "robotwin"
robot = "aloha-agilex"
family = "lift_pot"
mode = "standard"
protocol = "eai-standard/2.1"
oracle = "full"
instance_seed = 28831
expert_time_estimate_hours = 2.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 3.0
min_memory_gb = 7.0
min_gpu_memory_gb = 8.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "RTX 4090 24GB / L4 24GB"
verifier_min_cpus = 3.0
verifier_min_memory_gb = 6.0
verifier_min_gpu_memory_gb = 8.0
measured = "GPU 6.9 GB oracle peak on RTX 4090, 5.8 GB L4, vram_profile (batch_eval_live per-trial GPU peaks, 10-03..10); memory: sim p90 3.2 GB, privileged agent container p90 6.4 GB, verifier 4.2 GB, mem_guard (docker memory per container, mll-4090-1, 10-02..10); CPU author estimate"

[metadata.resources.limits]
# agent-phase limits; exceeding one fails the trial. scope: trial = every container, agent = the agent's container (docs/PROTOCOL.md §2.10)
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 16.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app"]
sustain_sec = 60.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 23.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; for i in $(seq 1 400); do grep -q '\"finalized\": true' /data/final.json 2>/dev/null && break; [ $((i % 15)) -eq 1 ] && kill -USR1 $(cat /data/server.pid) 2>/dev/null; sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
