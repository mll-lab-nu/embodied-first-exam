# Realtime mode (PROTOCOL §3): the simulator runs in the `sim` sidecar (the agent cannot open it), on its own clock
# once an episode starts (sim/rcb_realtime.py, the shared eai-standard/2.3 layer, with sim/server.py, MyoSuite's adapter);
# the agent only reaches port 8000. No `expose`/`ports` on sim: under Harbor's egress control it shares main's network
# namespace (localhost:8000).
# GPU on sim: the physics is MuJoCo on the CPU, but every image the agent asks for is rendered here, and on a clock that
# does not stop a render is time the simulator cannot step: EGL on the GPU takes ~5 ms a frame, OSMesa ~1.3 s
# (table_tennis, 640x480). `graphics` is the capability that mounts the EGL driver (server.py writes its ICD manifest).
# Crash recovery: compose restarts the service, which resumes the same episode, paused, never a reset.
# Knobs: ${NAME:-default} takes NAME from the shell that runs harbor. The defaults are the task's configuration;
# results under other settings are reported separately.
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 8192m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    x-gpu-memory-gb: 4   # GiB   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /tmp
    command: python /srv/rcb_realtime.py
    restart: on-failure:6          # N >= 3 (docs/protocol/standard_mode.md); a resume continues the episode, paused
    environment:
      RCB_INSTANCE: /srv/instance.npz
      RCB_TASK_INFO: /srv/task.json
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "300"   # the scene builds in a few seconds
      PYTHONPATH: /srv
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
      RCB_SLOWDOWN: "${RCB_SLOWDOWN:-1}"                # S = 1: the world runs at 1/S of real speed (this family's measured RTF; PROTOCOL §2)
      RCB_RESET_BUDGET: "${RCB_RESET_BUDGET:-10}"        # 10 resets (PROTOCOL §2 default); 0: one episode
      RCB_GL: "${RCB_GL:-auto}"                     # auto: EGL on the GPU when it works, else OSMesa
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
