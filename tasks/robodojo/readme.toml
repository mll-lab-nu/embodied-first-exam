# README data for tasks/robodojo/*/README.md (scripts/task_conventions.py render_readme_v3)
#
# Sources checked for every text below (upstream RoboDojo-Benchmark/RoboDojo at cb2a37d, read-only clone; T/ =
# task/RoboDojo/tasks/, RM/ = env/reward_manager/; B/ = embodied_first_exam/benchmarks/robodojo/):
#   checks      each family's T/<family>.py run_reward() (its check stages; `step_lim`), with the predicates of
#               RM/reward_manager.py (is_* wrappers) and RM/func_parser.py (their implementations); check() registers a
#               stage list, stages pass in order, at most one per action, a passed stage is popped (latched); query()
#               counts; a failed query marks the env failed (RM/reward_manager.py step() L357-494, get_reward L527-587)
#   privileged  B/privileged/tests/grade.py main L93-192: missing -> missing_trajectory; load_trajectory L55-85 (only
#               `task` and `actions` read, sizes checked before decompressing; not an npz, pickled / object arrays, not
#               (T, 14), NaN/inf, more than MAX_ACTIONS 15,000 rows -> bad_trajectory; another task -> wrong_task); up to
#               `[metadata] replays` (3) fresh-process replays, stopping at the first success; a replay without a
#               result or over its time limit -> grader_error; a rebuilt layout whose hash differs from instance.json
#               (unless "determinism": "verdict") -> instance_mismatch, grader_error. B/privileged/environment/
#               rcb_robodojo.py Session.step / end_reason L570-600: the episode ends at the first action where every
#               stage has passed (success), at a failed check, or at the 15,000-action guard; rows running out -> 0.
#   standard    B/sim/server.py (RCB_AGENT_END=1, RCB_STEP_LIMIT = the task's step_lim, docker-compose.yaml; no reset:
#               budget 0, L223) finish() L110-120 (finished / timeout / step_limit / error judged on S.success(); a
#               failed check -> 0); rcb_robodojo.py _hidden_episode_end L163-200 and END_JUDGEMENT L95-155 ("end": the
#               staged reward is 1 and the last stage re-checked holds after the last action; "history": the staged
#               reward as it stands).

[benchmark]
name = "RoboDojo"
citation = "Chen et al., 2026"
url = "https://github.com/RoboDojo-Benchmark/RoboDojo"
repo = "RoboDojo-Benchmark/RoboDojo"
commit = "cb2a37d"

[license]
text = """
RoboDojo ([RoboDojo-Benchmark/RoboDojo](https://github.com/RoboDojo-Benchmark/RoboDojo) @ `cb2a37d`) is released
under the MIT License; its assets (Hugging Face `RoboDojo-Benchmark/RoboDojo`) under the Apache License 2.0; its Isaac
Lab fork under the BSD 3-Clause License. The image also contains NVIDIA Isaac Sim 5.1 and its wheels (NVIDIA
proprietary, no redistribution) and RoboDojo's cuRobo fork (NVIDIA's cuRobo licence): each user builds the image from
public sources and accepts those terms (`images/robodojo/BUILD_ONLY`). No non-commercial terms apply to RoboDojo's
own code and assets.
"""

[robots]
arx-x5-bimanual = "Two ARX X5 arms (6 joints each, parallel two-finger grippers) at a table"

[modes.privileged]
success = """
Graded file: `/app/output/trajectory.npz` with `task` (this task's name) and `actions`, an array of at most 15,000
rows of 14 finite numbers, one per 25 Hz action, as `s.save_trajectory(...)` writes it. After the agent's session it
is replayed open-loop from the frozen start in a fresh process of a separate verifier container without network, up
to {md[replays]} times (each in a new process), stopping at the first replay that succeeds; the task is passed if any
replay succeeds. A replay runs the rows until every check stage has passed (success), a check fails for good (0), or
the rows run out (0); rows after the success are not run. Privileged mode applies no step limit beyond the 15,000
rows. A missing file, a file for another task, or a file that is not such an array scores 0. A replay that gives no
result or runs over its time limit, or a frozen layout that rebuilds to another state than the instance records, is
an infrastructure failure, not a score.
"""

[modes.standard]
success = """
Graded: the live episode, judged by the simulator service with RoboDojo's own checks after every action; nothing is
replayed. No success signal is shown to the agent, and passing the checks does not end the episode. The episode ends
at the agent's `/finish`, after {vars[step_lim]} actions (RoboDojo's own limit for this task, 25 actions per second),
or when the agent's time ({timeout}) runs out; a check that fails for good ends it at once with 0. {vars[end_rule]}
No reset: the one episode is graded. A simulator error raised by the agent's own call ends the episode, which is then
judged on the state it left. An episode that does not start from the frozen layout, or a service crash outside the
agent's calls, is an infrastructure failure, not a score.
"""

# ---------------------------------------------------------------------------------------------------------------------
# Families: one RoboDojo task each. `step_lim`: T/<family>.py self.step_lim. `end_rule`: rcb_robodojo.py END_JUDGEMENT
# ("end" -> the end-state sentence, "history" -> the history sentence).

# RoboDojo family texts, part 00 (21 families). Upstream RoboDojo-Benchmark/RoboDojo at cb2a37d. T/ = task/RoboDojo/tasks/,
# RM/ = env/reward_manager/reward_manager.py (is_* wrappers, defaults), FP/ = env/reward_manager/func_parser.py
# (implementations). Shared semantics: RM check_once L247-280 (a list inside a stage is an OR of its items, a list
# inside that OR an AND, and so on alternately), query L236-241 and step L357-494 (a query counts the actions at which
# all its items hold; a count above its aim marks the env failed). "Home" everywhere is FP all_robot_back_to_origin
# L1631-1644 (RM L829 defaults 0.15 m, 20°): each of the robot's two arms (type "target"), end-effector within 0.15 m
# of its start pose on each of x, y, z and rotated less than 20° from it. "In B" is FP is_A_in_B L168-204: A's origin
# inside the convex hull of B's world bounding-box footprint and above B's bounding-box bottom.

